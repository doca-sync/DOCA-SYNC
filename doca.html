  });
  el.querySelectorAll('[data-cancelar]').forEach(b=>b.onclick=()=>{
    const e=envioById(b.dataset.cancelar);
    const a=e.itens.reduce((x,i)=>x+(i.alocado||0),0);
    const c=e.itens.reduce((x,i)=>x+(i.reservadoColeta||0),0);
    const g=e.itens.reduce((x,i)=>x+(i.geradoCompra||0),0);
    confirmAction(`Cancelar o envio "${e.nome}"? ${fmtInt(a)} un. voltam pro Local${c?`, ${fmtInt(c)} un. voltam a ficar livres em Coletar`:''}${g?` e ${fmtInt(g)} un. saem da lista de Comprar`:''}.`,()=>{
      cancelarEnvio(b.dataset.cancelar); toast('Envio cancelado, reservas liberadas e compras revertidas.');
    });
  });
  el.querySelectorAll('[data-remitem]').forEach(b=>b.onclick=()=>{
    const [eid,iid]=b.dataset.remitem.split('|');
    const e=envioById(eid), it=e.itens.find(i=>i.id===iid), p=prodById(it.produtoId);
    confirmAction(`Remover esta programação de ${p.sku} (${fmtInt(it.solicitado)} un.) do envio "${e.nome}"? ${fmtInt(it.alocado||0)} un. voltam pro Local${it.reservadoColeta?`, ${fmtInt(it.reservadoColeta)} un. voltam a ficar livres em Coletar`:''}${it.geradoCompra?` e ${fmtInt(it.geradoCompra)} un. saem de Comprar`:''}.`,()=>{
      removerItemEnvio(eid,iid); toast('Programação removida do envio.');
    });
  });
  el.querySelectorAll('[data-movitem]').forEach(b=>b.onclick=()=>{
    const [eid,iid]=b.dataset.movitem.split('|');
    abrirMoverItemEnvio(eid,iid);
  });
  el.querySelectorAll('[data-totitem]').forEach(inp=>inp.onchange=()=>{
    const [eid,iid]=inp.dataset.totitem.split('|');
    const r=ajustarItemEnvio(eid,iid,inp.value);
    if(!r.ok){ alert(r.msg); renderEnvio(); return; }
    if(r.dif>0) toast(`Programação aumentada em ${fmtInt(r.dif)} un. — reserva e compra recalculadas.`);
    else if(r.dif<0) toast(`Programação reduzida em ${fmtInt(-r.dif)} un. — estoque e compra liberados.`);
  });
  el.querySelectorAll('[data-totkit]').forEach(inp=>inp.onchange=()=>{
    const [eid,iid]=inp.dataset.totkit.split('|');
    const r=ajustarGrupoKitEnvio(eid,iid,inp.value);
    if(!r.ok){ alert(r.msg); renderEnvio(); return; }
    if(r.dif>0) toast(`Kit aumentado em ${fmtInt(r.dif)} un. — reserva e compra de cada componente recalculadas.`);
    else if(r.dif<0) toast(`Kit reduzido em ${fmtInt(-r.dif)} un. — estoque e compra de cada componente liberados.`);
    renderEnvio();
  });
  el.querySelectorAll('[data-remkit]').forEach(b=>b.onclick=()=>{
    const [eid,iid]=b.dataset.remkit.split('|');
    const e=envioById(eid); const it=e.itens.find(i=>i.id===iid); const p=prodById(it.produtoId);
    confirmAction(`Remover o kit ${p.sku} (${fmtInt(it.solicitado)} un.) do envio "${e.nome}"? Libera de volta o estoque/compra de cada componente.`,()=>{
      removerGrupoKitEnvio(eid,iid); toast('Kit removido do envio.'); renderEnvio();
    });
  });
  el.querySelectorAll('[data-envkitdet]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.envkitdet;
    if(envioKitAberto.has(id)) envioKitAberto.delete(id); else envioKitAberto.add(id);
    renderEnvio();
  });
  el.querySelectorAll('[data-movkit]').forEach(b=>b.onclick=()=>{
    const [eid,iid]=b.dataset.movkit.split('|');
    const e=envioById(eid); if(!e) return;
    const it=e.itens.find(i=>i.id===iid); if(!it) return;
    const p=prodById(it.produtoId); if(!p) return;
    const destinos=state.envios.filter(x=>x.id!==eid&&x.loja===p.loja);
    if(!destinos.length){ toast('Não há outro envio programado nesta loja pra mover.'); return; }
    const body=openModal();
    body.innerHTML=`<h3>↦ Mover kit ${esc(p.sku)}</h3>
      <p class="hint" style="margin:0 0 12px">${fmtInt(it.solicitado)} un. do kit (com todos os componentes) saem do envio "${esc(e.nome)}" — a reserva e a compra de cada componente acompanham, sem refazer nada. O kit move sempre inteiro; pra dividir, ajuste a quantidade aqui e adicione o kit de novo no outro envio.</p>
      <label>Envio de destino<select id="mvKitDestino">${destinos.map(d=>`<option value="${d.id}">${esc(d.nome)} · ${fmtData(d.data)}</option>`).join('')}</select></label>
      <div class="modal-actions"><button class="btn" id="mvKitCanc">Cancelar</button><button class="btn acc" id="mvKitOk">Mover</button></div>`;
    document.getElementById('mvKitCanc').onclick=closeModal;
    document.getElementById('mvKitOk').onclick=()=>{
      const destino=document.getElementById('mvKitDestino').value;
      const r=moverGrupoKitEnvio(eid,iid,destino);
      closeModal();
      if(!r.ok){ alert(r.msg); return; }
      toast(`Kit ${r.sku} (${fmtInt(r.qtd)} un.) movido pro envio "${r.destinoNome}".`);
      renderEnvio();
    };
  });
  el.querySelectorAll('[data-addsku]').forEach(b=>b.onclick=()=>openAddSkuEnvioModal(b.dataset.addsku));
  el.querySelectorAll('[data-editenvio]').forEach(b=>b.onclick=()=>openEnvioModal(b.dataset.editenvio));
  document.getElementById('envioFiltroLoja').onchange=e=>{ confirmarLojaAtual=e.target.value; renderEnvio(); };
  el.querySelectorAll('[data-avisofok]').forEach(b=>b.onclick=()=>{
    state.avisosFornecedor=(state.avisosFornecedor||[]).filter(x=>x.id!==b.dataset.avisofok);
    persist();
    toast('Aviso removido.');
  });
  el.querySelectorAll('[data-confirmar]').forEach(b=>b.onclick=()=>{
    const e=envioById(b.dataset.confirmar);
    const a=e.itens.reduce((x,i)=>x+(i.alocado||0),0);
    /* CORRIGIDO 28/08 (Felipe: "não está deixando virar FULL, acho que por causa do KITPET"):
       a linha guarda-chuva de um kit carrega o solicitado total (ex.: 43) mas alocado sempre 0 -
       de propósito, os números reais moram nos COMPONENTES explodidos (ver alocarNoEnvio). Somar
       o guarda-chuva aqui fazia a conta sempre achar que faltavam essas unidades, travando a
       confirmação pra sempre em qualquer envio com kit. Os componentes continuam contando - se um
       deles realmente estiver incompleto, o alerta ainda pega. */
    const falta=e.itens.filter(i=>!i.kitGuardaChuva).reduce((x,i)=>x+Math.max(0,(i.solicitado||0)-(i.alocado||0)),0);
    if(falta>0){ alert(`Não dá pra finalizar: faltam ${fmtInt(falta)} un. para completar este envio.`); return; }
    confirmAction(`Confirmar o envio "${e.nome}" (${fmtData(e.data)} · ${e.loja}) com ${fmtInt(a)} unidade(s) como FULL no Mercado Livre? Isso remove o envio do controle. Dá pra reverter no botão Desfazer.`,()=>{
      confirmarEnvioFull(b.dataset.confirmar,true); toast('Envio confirmado como FULL.');
    });
  });
  el.querySelectorAll('[data-forcarcedo]').forEach(b=>b.onclick=()=>{
    const e=envioById(b.dataset.forcarcedo); if(!e) return;
    confirmAction(`Esse envio está programado pra ${fmtData(e.data)} - ainda não chegou a data. Liberar o botão "Virou FULL" mesmo assim (ex: coleta adiantada de verdade)?`,()=>{
      envioForcarLiberado.add(e.id); renderEnvio();
    });
  });
}
function modalRecalculo(envioId,novaData,localColeta,r){
  const e=envioById(envioId);
  const body=openModal(true);
  const desc=c=>{
    if(c.semMedia) return '<span style="opacity:.5">sem média guardada — fica igual</span>';
    if(c.dif>0) return '<span class="okv">+'+fmtInt(c.dif)+' — reserva ou ordem de compra</span>';
    if(c.dif<0) return '<span class="okv">'+fmtInt(c.dif)+' — sai da compra ou volta ao disponível</span>';
    return '<span style="opacity:.5">sem mudança</span>';
  };
  const soma=r.linhas.reduce((a,l)=>a+Math.max(0,l.dif),0), sub=r.linhas.reduce((a,l)=>a+Math.max(0,-l.dif),0);
  body.innerHTML=`<h3>Nova data: ${fmtData(novaData)}</h3>
    <p class="hint" style="margin:0 0 12px">De ${fmtData(e.data)} para ${fmtData(novaData)} · agora são <b>${r.D} dia(s)</b> até o envio ·
      cobertura de <b>${r.cob}</b> dias. O sistema refez as quantidades pela média de vendas guardada quando este envio foi criado.</p>
    <div class="table-wrap"><table class="tbl-produtos"><thead><tr>
      <th>SKU</th><th class="num">Vendas/dia</th><th class="num">Hoje</th><th class="num">Nova</th><th class="num">Diferença</th><th>O que acontece</th>
    </tr></thead><tbody>${r.linhas.map(c=>`<tr${c.dif===0?' style="opacity:.45"':''}>
      <td class="mono">${esc(c.produto.sku)}</td><td class="num">${c.media!=null?c.media.toFixed(2):'—'}</td>
      <td class="num">${fmtInt(c.atual)}</td><td class="num">${fmtInt(c.novo)}</td>
      <td class="num"><b>${c.dif>0?'+':''}${fmtInt(c.dif)}</b></td><td>${desc(c)}</td></tr>`).join('')}</tbody></table></div>
    <div class="aviso atencao" style="margin:12px 0 0"><span>⚠</span><span>Total: <b>+${fmtInt(soma)}</b> un. a mais${sub?` e <b>${fmtInt(sub)}</b> un. liberadas`:''}. O que aumentar sai do galpão, depois do Coletar, e só o resto vira ordem de compra.</span></div>
    <div class="modal-actions"><button class="btn" id="btnRecCanc">Cancelar</button>
      <button class="btn" id="btnRecSo">Só mudar a data</button>
      <button class="btn gold" id="btnRecOk">Aplicar e recalcular</button></div>`;
  document.getElementById('btnRecCanc').onclick=closeModal;
  document.getElementById('btnRecSo').onclick=()=>{ editarEnvio(envioId,{nome:fmtData(novaData),data:novaData,localColeta}); closeModal(); toast('Data alterada. As quantidades ficaram como estavam.'); };
  document.getElementById('btnRecOk').onclick=()=>{
    const res=aplicarRecalculo(envioId,novaData);
    if(localColeta) editarEnvio(envioId,{localColeta});
    closeModal();
    if(!res.ok){ alert(res.msg); return; }
    toast(`Envio recalculado para ${fmtData(novaData)}.`+(res.soma?` +${fmtInt(res.soma)} un.`:'')+(res.sub?` −${fmtInt(res.sub)} un. liberadas.`:''));
  };
}
/* modal do botão "↦ Mover" na linha do item, dentro de Envios FULL: mover pra outro envio já
   programado da mesma loja, ou criar um FULL de emergência separado só com este item (pra
   antecipar quando vai dar ruptura antes do envio programado chegar). */
function abrirMoverItemEnvio(envioId,itemId){
  const e=envioById(envioId); if(!e) return;
  const it=e.itens.find(i=>i.id===itemId); if(!it) return;
  const p=prodById(it.produtoId); if(!p) return;
  const fi=itemFullDoProduto(p);
  const media=fi?fullCalc(fi).media:0;
  const outros=state.envios.filter(x=>x.id!==envioId&&x.loja===p.loja).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  const body=openModal(false);
  body.innerHTML=`<h3>Mover ${esc(p.sku)}</h3>
    <p class="hint" style="margin:0 0 12px">${fmtInt(it.solicitado)} un. programadas no envio "<b>${esc(e.nome)}</b>" (${esc(e.loja)}). A reserva/compra que já existe não muda — só passa a pertencer ao envio de destino.</p>
    ${outros.length?`<div class="form-grid">
      <label class="span2">Mover para o envio<select id="mvDestino"><option value="">Escolha...</option>${outros.map(x=>`<option value="${x.id}">${esc(x.nome)} — ${esc(x.loja)} (${fmtData(x.data)})</option>`).join('')}</select></label>
      <label class="span2">Quantidade a mover <small>(pode ser só uma parte — o resto fica neste envio)</small><input id="mvQtd" type="number" min="1" max="${it.solicitado}" value="${it.solicitado}"></label>
    </div>
    <button class="btn acc" id="mvBtnMover">Mover para este envio</button>
    <hr class="modal-sep">`:`<p class="hint muted">Não há outro envio programado nesta loja pra mover.</p>`}
    <h4>Ou criar um FULL de emergência</h4>
    <p class="hint" style="margin-top:-4px">Pra antecipar quando este produto vai zerar antes do envio programado chegar. Não precisa ser tudo — dá pra mandar só o suficiente pra cobrir alguns dias e deixar o resto no envio programado normalmente.</p>
    <div class="form-grid">
      <label>Data deste envio de emergência<input id="mvEmData" type="date" value="${esc(hoje())}"></label>
      <label>Local da coleta<select id="mvEmColeta">${optsColeta(LOCAIS_COLETA[0])}</select></label>
      <label>Dias de cobertura desta emergência<input id="mvEmDias" type="number" min="1" placeholder="Ex: 15" ${media>0?'':'disabled title="Sem média de vendas/dia lida ainda pra este SKU — informe a quantidade direto"'}></label>
      <label>Quantidade a enviar<input id="mvEmQtd" type="number" min="1" max="${it.solicitado}" value="${it.solicitado}"></label>
    </div>
    <p class="hint" id="mvEmInfo" style="margin-top:-6px">${media>0?`Média de vendas: <b>${media.toFixed(2)}</b> un./dia. No máximo dá pra tirar ${fmtInt(it.solicitado)} un. deste envio (o que sobrar continua programado normalmente pra ${fmtData(e.data)}).`:'Sem média de vendas/dia lida ainda pra este SKU — o campo de dias fica desativado, informe a quantidade direto.'}</p>
    <button class="btn gold" id="mvBtnEmergencia">🚨 Criar FULL de emergência</button>
    <div class="modal-actions" style="margin-top:14px"><button class="btn" id="mvCancelar">Fechar</button></div>`;
  document.getElementById('mvCancelar').onclick=closeModal;
  const mvEmDias=document.getElementById('mvEmDias'), mvEmQtd=document.getElementById('mvEmQtd');
  if(media>0) mvEmDias.oninput=()=>{
    const d=Number(mvEmDias.value);
    if(!d||d<=0) return;
    mvEmQtd.value=Math.min(it.solicitado,Math.ceil(d*media));
  };
  const btnMover=document.getElementById('mvBtnMover');
  if(btnMover) btnMover.onclick=()=>{
    const destino=document.getElementById('mvDestino').value;
    if(!destino){ alert('Escolha o envio de destino.'); return; }
    const ed=envioById(destino);
    const qtd=Math.round(Number(document.getElementById('mvQtd').value)||0);
    if(qtd<=0){ alert('Informe uma quantidade válida.'); return; }
    const r=moverQtdEntreEnvios(envioId,itemId,destino,qtd);
    if(!r.ok){ alert(r.msg); return; }
    closeModal();
    const restou=it.solicitado-qtd;
    toast(`${fmtInt(qtd)} un. de ${p.sku} movidas para o envio "${ed.nome}".`+(restou>0?` As outras ${fmtInt(restou)} un. continuam no envio "${e.nome}".`:''));
  };
  document.getElementById('mvBtnEmergencia').onclick=()=>{
    const data=document.getElementById('mvEmData').value;
    if(!data){ alert('Informe a data.'); return; }
    const localColeta=document.getElementById('mvEmColeta').value;
    const qtd=Math.round(Number(mvEmQtd.value)||0);
    if(qtd<=0){ alert('Informe uma quantidade válida.'); return; }
    const r=moverQtdParaNovoEmergencia(envioId,itemId,qtd,data,localColeta);
    if(!r.ok){ alert(r.msg); return; }

/* calcula (sem alterar o state) de onde sairia uma quantidade "q" deste SKU, explodindo
   componentes de kit e redirecionando SKUs vinculados pro mestre - mesma lógica de
   alocarNoEnvio, só que só pra prévia na tela (não mexe em nada). */
function previewAlocacao(produtoEscolhido,q){
  const comps=componentesDe(produtoEscolhido);
  if(comps.length){
    let dl=0,dc=0,gc=0; const detalhes=[];
    comps.forEach(c=>{
      const comp=prodById(c.produtoId); if(!comp) return;
      const r=previewAlocacao(comp,q*c.qtdPorUnidade);
      dl+=r.dl; dc+=r.dc; gc+=r.gc;
      detalhes.push({sku:comp.sku,...r});
    });
    return {dl,dc,gc,detalhes};
  }
  const base=produtoEfetivo(produtoEscolhido);
  const dl=Math.min(q,base.qtd.local);
  const dc=Math.min(q-dl,coletarLivre(base));
  const gc=q-dl-dc;
  return {dl,dc,gc,detalhes:[]};
}

/* ---------- PDF ---------- */
function parseNomeArquivo(nome){
  const base=nome.replace(/\.pdf$/i,'').trim();
  const m=/^(\d{2})(\d{2})(\d{2})[\s._-]*(.+)$/.exec(base);
  if(!m) return {data:'',loja:null,nome:base};
  const [,dd,mm,aa,lt]=m;
  return {data:`20${aa}-${mm}-${dd}`,loja:acharLoja(lt),nome:base};
}
async function extrairLinhasPdf(file){
  if(!window.pdfjsLib) throw new Error('Biblioteca de leitura de PDF não carregou. Verifique sua conexão e recarregue a página.');
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const linhas=[];
  for(let pn=1;pn<=pdf.numPages;pn++){
    const tc=await (await pdf.getPage(pn)).getTextContent();
    const items=tc.items.map(it=>({str:(it.str||''),x:it.transform[4],y:it.transform[5]}));
    const skus=[],codigos=[],qtds=[];
    items.forEach(it=>{
      if(it.x<235){
        const ms=/SKU:\s*(\S+)/i.exec(it.str); if(ms) skus.push({sku:ms[1],y:it.y});
        const mc=/C[óo]digo ML:\s*([A-Z0-9]+)/i.exec(it.str); if(mc) codigos.push({codigo:mc[1],y:it.y});
      }
      const s=it.str.trim();
      if(it.x>=225&&it.x<=285&&/^\d[\d.,]*$/.test(s)){
        const v=parseInt(s.replace(/\D/g,''),10);
        if(!isNaN(v)&&v>0) qtds.push({qtd:v,y:it.y});
      }
    });
    qtds.forEach(q=>{
      let best=null,bd=Infinity;
      skus.forEach(s=>{ const d=q.y-s.y; if(d>=-6&&d<=32&&Math.abs(d)<bd){ bd=Math.abs(d); best=s; } });
      if(!best) return;
      let cod='',cd=Infinity;
      codigos.forEach(c=>{ const d=Math.abs(c.y-best.y); if(d<=22&&d<cd){ cd=d; cod=c.codigo; } });
      const ex=linhas.find(l=>l.sku.toLowerCase()===best.sku.toLowerCase());
      if(ex) ex.qtd+=q.qtd; else linhas.push({sku:best.sku,qtd:q.qtd,codigo:cod});
    });
  }
  return linhas;
}
async function processarPdf(file){
  try{
    toast('Lendo o PDF...');
    const meta=parseNomeArquivo(file.name);
    const linhas=await extrairLinhasPdf(file);
    if(!linhas.length){ alert('Não consegui identificar SKUs e quantidades nesse PDF. Confira se é o documento de inbound do Mercado Livre.'); return; }
    /* mesmo arquivo, ou mesma loja na mesma data = provavelmente uma atualizacao */
    const dup=state.envios.find(e=>e.arquivo&&e.arquivo.toLowerCase()===file.name.toLowerCase())
      ||(meta.loja&&meta.data?state.envios.find(e=>e.loja===meta.loja&&e.data===meta.data):null);
    const seguir=()=>{ pdfPreview={meta,linhas,arquivo:file.name}; openPdfPreviewModal(); };
    if(dup) perguntarAtualizacao(dup,{meta,linhas,arquivo:file.name},seguir);
    else seguir();
  }catch(err){ alert('Erro ao ler o PDF: '+err.message); }
}

/* ================= PREVISÃO FULL ================= */
function fullCfg(){ return state.full.cfg; }
function fullItensLoja(loja){ return state.full.itens.filter(i=>i.loja===(loja||fullCfg().loja)); }
/* casa com o cadastro do Doca: SKU primeiro, depois Código ML */
function fullProduto(i){
  if(i.produtoId){ const v=prodById(i.produtoId); if(v) return v; }
  const s=String(i.sku||'').trim().toLowerCase(), c=String(i.codigo||'').trim().toLowerCase();
  return state.produtos.find(p=>p.loja===i.loja&&String(p.sku||'').toLowerCase()===s)
    ||(c?state.produtos.find(p=>p.loja===i.loja&&String(p.codigo||'').toLowerCase()===c):null)
    ||(s?state.produtos.find(p=>p.loja===i.loja&&String(p.codigo||'').toLowerCase()===s):null)||null;
}
/* o SKU mostrado é sempre o do cadastro quando o produto existe */
function fullSku(i){ const p=fullProduto(i); return p?p.sku:(i.sku||i.codigo||'—'); }
function fullCusto(i){ const p=fullProduto(i); return p?(Number(p.custo)||0):0; }
function diasEntre(a,b){ if(!a||!b) return 0; return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5); }
function fullCalc(i,envioOverride){
  const c=fullCfg();
  const r7=(i.v7||0)/7, r15=(i.v15||0)/15, r30=(i.v30||0)/30;
  const soma=(c.p7||0)+(c.p15||0)+(c.p30||0);
  const somaPond=r7*c.p7+r15*c.p15+r30*c.p30;
  const temPeriodos=(i.v7||0)||(i.v15||0)||(i.v30||0);
  const mediaPronta=(!temPeriodos&&i.mediaFixa!=null&&i.mediaFixa>0);
  const media=mediaPronta?i.mediaFixa:(soma>0?somaPond/soma:0);
  /* envioOverride deixa recalcular pra uma data diferente da salva em c.envio, sem mexer no
     estado — usado no modal "Criar FULL no Doca" pra atualizar a sugestão na hora quando a
     pessoa muda a data ali dentro, antes de confirmar. */
  const D=Math.max(0,diasEntre(hoje(),envioOverride||c.envio));
  /* dois estados de estoque "a caminho do Full", cada um com fonte própria e 100% real:
     - "em transferência" (i.transf): direto da API do Mercado Livre.
     - "próximos programados" (envios criados no Doca e ainda NÃO confirmados como FULL — ver
       entradaPendenteDe): dado do próprio Doca, sempre atual.
     O campo "Entrada pendente" (tentativa de rastrear localmente o que já foi confirmado como
     FULL no Doca mas a API ainda não mostrava) foi removido — o Mercado Livre não expõe essa
     informação por API, e o número só ficava desatualizado sem ninguém perceber. Assim que um
     envio é confirmado como FULL, ele sai de "Próximos programados" e some do cálculo até a
     próxima sincronização mostrar a mercadoria de verdade em "Aptas"/"Em transferência".
     Os dois contam pra QUANTIDADE (full/Total/cobertura/sugestão de envio), pra não sugerir
     enviar de novo o que já está no caminho ou já programado. Só "em transferência" conta pro
     VALOR EM DINHEIRO — "próximos programados" ainda está fisicamente no galpão/fornecedor e
     seu valor já é contado no estoque LOCAL via "Reservado" (ver valorEstoque/totalNoGalpao);
     contar de novo aqui duplicaria o dinheiro. */
  const proximosProgramados=entradaPendenteDe(i.produtoId||(fullProduto(i)?fullProduto(i).id:null));
  const fullValorBase=(i.aptas||0)+(i.transf||0);
  /* "em processamento" (CORRIGIDO 28/08, pedido do Felipe): a quantidade de um envio que acabou
     de ser confirmado como FULL, mas que o Mercado Livre ainda não processou de verdade (aptas/
     transf ainda não subiram) - ver confirmarEnvioFull/mlAtualizarFullDoSinc. Antes, assim que
     confirmava, esse número simplesmente sumia (saía de "próximos programados" e ainda não tinha
     entrado em aptas/transf), fazendo o Doca sugerir enviar de novo algo que já tinha ido, se o
     próximo planejamento caísse dentro da janela de até 5 dias que o ML leva pra processar. Decai
     PROPORCIONAL conforme aptas+transf sobe de verdade (cada unidade que chega é uma a menos "em
     processamento"), até zerar (chegou tudo) ou vencer os 5 dias - nunca um número congelado.
     CORRIGIDO 28/08 (2ª volta): soma a FILA inteira (p.filaProcessamento), não só 1 marcador - ver
     comentário completo em confirmarEnvioFull/mlAtualizarFullDoSinc sobre por que virou fila.
     CORRIGIDO 28/08 (3ª volta, "Entrada Pendente 2.0"): em vez de decair por delta de aptas+transf
     (que se confundia com venda no meio do caminho), usa o log real de recebimento do ML - ver
     filaProcessamentoComRestante. */
  const emProcessamento=(()=>{
    const p=fullProduto(i);
    if(!p) return 0;
    return filaProcessamentoComRestante(p).reduce((s,e)=>s+(e.qtdRestante||0),0);
  })();
  const full=fullValorBase+proximosProgramados+emProcessamento;   /* quantidade, pra Total/cobertura/sugestão */
  const consumo=media*D, proj=full-consumo, dem=media*(c.cobertura||30);
  const bruto=dem-proj, enviar=bruto>0?Math.ceil(bruto):0;
  const cob=media>0?full/media:(full>0?Infinity:0);   /* dias que o estoque do Full aguenta */
  /* ruptura: o estoque zera ANTES do envio chegar */
  const rompe=media>0&&cob<D;
  const diaRuptura=rompe?new Date(Date.now()+Math.floor(cob)*864e5).toISOString().slice(0,10):'';
  /* "aguenta até" (pedido do Felipe 27/08): igual diaRuptura, mas SEMPRE calculado (não só quando
     rompe) - pra Previsão de Reposição mostrar até quando o estoque atual (aptas + em transferência
     + próximos programados) aguenta, mesmo quando ele aguenta folgado até depois do envio. */
  const aguentaAte=(media>0&&cob!==Infinity)?new Date(Date.now()+Math.floor(cob)*864e5).toISOString().slice(0,10):null;
  const vendasIncoer=!mediaPronta&&((i.v7||0)>(i.v15||0)||(i.v15||0)>(i.v30||0));
  /* se esse SKU ja teve um envio confirmado (Criar FULL no Doca) e o envio ainda existe,
     nao sugere mandar de novo — mesmo que a conta de demanda desse outro numero. So volta a
     sugerir se o envio for excluido ou se voce ajustar manualmente. */
  const jaEnviado=!!(i.enviado&&envioById(i.enviado.envioId));
  const qtd=i.ajuste!=null?i.ajuste:(jaEnviado?0:enviar);
  return {r7,r15,r30,soma:somaPond,media,mediaPronta,D,full,proximosProgramados,emProcessamento,consumo,proj,dem,enviar,qtd,cob,
    rompe,diaRuptura,aguentaAte,vendasIncoer,jaEnviado,custo:fullCusto(i),valor:fullValorBase*fullCusto(i)};
}
function fullResumo(loja){

}

/* produtos (de qualquer loja) que, no ritmo de venda atual, zeram no FULL dentro de N dias —
   independe da data de envio programada, é só um alerta antecipado pra Visão Geral. */
function rupturaProximaLista(diasLimite){
  const out=[];
  state.full.itens.forEach(i=>{
    const p=fullProduto(i); if(!p) return;
    const k=fullCalc(i);
    if(k.media>0&&k.cob<=diasLimite){
      out.push({produto:p,dias:Math.max(0,Math.floor(k.cob)),diaZero:new Date(Date.now()+Math.max(0,Math.floor(k.cob))*864e5).toISOString().slice(0,10)});
    }
  });
  return out.sort((a,b)=>a.dias-b.dias);
}
function fullUnidadesTodasLojas(){ return STORES.reduce((a,l)=>a+fullResumo(l).unid,0); }
/* liga o item lido do painel a um produto já cadastrado — grava o Código ML no produto
   para que as próximas leituras casem sozinhas */
function vincularItemFull(itemId,produtoId){
  const i=state.full.itens.find(x=>x.id===itemId); if(!i) return {ok:false,msg:'Item não encontrado.'};
  const p=prodById(produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  if(p.loja!==i.loja) return {ok:false,msg:'O produto é de outra loja.'};
  const jaUsado=state.full.itens.find(x=>x!==i&&x.loja===i.loja&&fullProduto(x)&&fullProduto(x).id===produtoId);
  if(jaUsado) return {ok:false,msg:'Este produto já está ligado a outra linha desta leitura.'};
  snapshot('vínculo de '+(i.codigo||i.sku)+' com '+p.sku);
  i.produtoId=produtoId;
  const cod=String(i.codigo||i.sku||'').toUpperCase();
  if(cod&&!p.codigo) p.codigo=cod;      /* guarda o Código ML no cadastro */
  persist();
  return {ok:true,produto:p,gravouCodigo:!!cod};
}
function desvincularItemFull(itemId){
  const i=state.full.itens.find(x=>x.id===itemId); if(!i) return;
  snapshot('remoção do vínculo'); i.produtoId=null; persist();
}
/* histórico: uma linha por SKU a cada leitura, para ver a tendência */
function chaveHist(i){ const p=fullProduto(i); return (i.loja||'')+'|'+(p?p.id:('cod:'+String(i.codigo||i.sku||'').toUpperCase())); }
function gravarHistorico(loja){
  const dia=hoje();
  fullItensLoja(loja).forEach(i=>{
    const k=fullCalc(i), ch=chaveHist(i);
    const ant=state.full.hist.filter(x=>x.ch===ch);
    const mesmoDia=ant.find(x=>x.data===dia);
    if(mesmoDia){ mesmoDia.media=k.media; mesmoDia.full=k.full; mesmoDia.sku=fullSku(i); return; }
    state.full.hist.push({ch,loja,sku:fullSku(i),data:dia,media:k.media,full:k.full});
    /* guarda no máximo 24 leituras por SKU */
    const meus=state.full.hist.filter(x=>x.ch===ch);
    if(meus.length>24){ const fora=meus.slice(0,meus.length-24); state.full.hist=state.full.hist.filter(x=>fora.indexOf(x)<0); }
  });
}
function histDe(i){ const ch=chaveHist(i); return state.full.hist.filter(x=>x.ch===ch).slice(-24); }
/* tendência: compara a média de agora com a leitura anterior */
function tendencia(i){
  const h=histDe(i); if(h.length<2) return null;
  const atual=h[h.length-1].media, ant=h[h.length-2].media;
  if(!ant) return null;
  const v=(atual/ant-1)*100;
  return {pct:v,sobe:v>2,cai:v<-2,ant,de:h[h.length-2].data};
}
/* média das últimas leituras — serve de referência para prever o próximo período */
function mediaHistorica(i,n){
  const h=histDe(i).slice(-(n||6)).filter(x=>x.media>0);
  if(!h.length) return null;
  return {media:h.reduce((a,x)=>a+x.media,0)/h.length,leituras:h.length,desde:h[0].data};
}
/* cria o envio no Doca direto da previsão */
function criarFullDaPrevisao(loja,data,localColeta){
  const l=fullItensLoja(loja).map(i=>({i,k:fullCalc(i)})).filter(x=>x.k.qtd>0);
  if(!l.length) return {ok:false,msg:'Nenhum produto com quantidade a enviar nesta loja.'};
  let criados=0,ger=0,cam=0,alo=0;
  const nome=fmtData(data);
  let envio=null;
  batch('criação do envio '+nome+' pela Previsão FULL',()=>{
    envio=criarEnvio(nome,data,loja,'',localColeta||LOCAIS_COLETA[0]);
    envio.origem='previsao';
    envio.medias={};
    l.forEach(({i,k})=>{
      let p=fullProduto(i);
      if(!p){
        p=addProduto({loja,sku:(i.sku||i.codigo||'').toUpperCase(),codigo:(i.codigo||'').toUpperCase(),
          fornecedor:'',custo:0,estoqueMinimo:0,qtd:{comprar:0,coletar:0,local:0},lotes:[],pedidos:[],obsCompra:''});
        criados++;
      } else if(!p.codigo&&i.codigo) p.codigo=String(i.codigo).toUpperCase();
      const r=alocarNoEnvio(envio,p,k.qtd);
      alo+=r.alocado; cam+=r.aCaminho; ger+=r.gerado;
      /* guarda a média e o estoque lido, para recalcular se a data mudar */
      envio.medias[p.id]={media:k.media,full:k.full,lidoEm:state.full.lidoEm[loja]||Date.now()};
      i.enviado={qtd:k.qtd,envioId:envio.id,envio:nome,em:Date.now()};
    });
  });
  return {ok:true,envio,criados,alocado:alo,aCaminho:cam,gerado:ger,itens:l.length};
}
/* quanto dá pra enviar AGORA de um produto sem precisar comprar - só o que já está fisicamente
   no galpão (produtoEfetivo pra resolver SKU vinculado, estoque compartilhado mora no mestre).
   Pra kit, é o gargalo: o componente que permite montar menos unidades limita quantos kits dá
   pra montar. Usado só na emergência (ver criarFullEmergencia) - pedido do Felipe 28/08: "separe
   somente o produto que precisa ser enviado e considere a quantidade disponível no galpão pra
   envio, porque senão vai precisar comprar, aí não dá pra enviar com urgência". */
function disponivelUrgenteEnvio(p){
  if(!p) return 0;
  const comps=componentesDe(p);
  if(comps.length){
    return comps.reduce((min,c)=>{
      const comp=prodById(c.produtoId); if(!comp) return 0;
      const disp=Math.floor(disponivelUrgenteEnvio(comp)/(c.qtdPorUnidade||1));
      return Math.min(min,disp);
    },Infinity);
  }
  return produtoEfetivo(p).qtd.local||0;
}
/* Cria um envio separado (marcado como emergência) só com os SKUs que vão zerar
   antes da data prevista — usado quando não dá pra antecipar o envio já programado.
   CORRIGIDO 28/08 (Felipe): antes usava a quantidade "ideal" (k.qtd, a mesma da Previsão normal,
   que pode incluir uma parte a comprar) - numa emergência isso não ajuda, porque enviar de
   verdade fica esperando a compra chegar. Agora capa pelo que já está disponível no galpão
   (disponivelUrgenteEnvio) e deixa de fora quem não tem NADA físico disponível agora (sem produto
   cadastrado também fica de fora, já que sem cadastro não dá pra saber o estoque real). */
function criarFullEmergencia(loja,data,localColeta){
  const l=fullItensLoja(loja).map(i=>({i,k:fullCalc(i),p:fullProduto(i)})).filter(x=>x.k.rompe)
    .filter(x=>x.p&&disponivelUrgenteEnvio(x.p)>0);
  if(!l.length) return {ok:false,msg:'Nenhum produto em risco de ruptura nesta loja com estoque disponível no galpão pra enviar agora — enviar exigiria comprar primeiro, o que não resolve a urgência.'};
  let ger=0,cam=0,alo=0;
  const nome='FULL DE EMERGÊNCIA · '+fmtData(data);
  let envio=null;
  batch('criação do envio de emergência '+nome,()=>{
    envio=criarEnvio(nome,data,loja,'',localColeta||LOCAIS_COLETA[0]);
    envio.origem='emergencia';
    envio.medias={};
    l.forEach(({i,k,p})=>{
      const disp=disponivelUrgenteEnvio(p);
      const qtd=Math.min(Math.max(k.qtd,1),disp);
      if(!p.codigo&&i.codigo) p.codigo=String(i.codigo).toUpperCase();
      const r=alocarNoEnvio(envio,p,qtd);
      alo+=r.alocado; cam+=r.aCaminho; ger+=r.gerado;
      envio.medias[p.id]={media:k.media,full:k.full,lidoEm:state.full.lidoEm[loja]||Date.now()};
      i.enviado={qtd,envioId:envio.id,envio:nome,em:Date.now()};
    });
  });
  return {ok:true,envio,criados:0,alocado:alo,aCaminho:cam,gerado:ger,itens:l.length};
}
/* recalcula um envio da Previsão para uma nova data — só calcula, não altera */
function recalcularEnvioPorData(envioId,novaData){
  const e=envioById(envioId); if(!e) return {ok:false,msg:'Envio não encontrado.'};
  if(!e.medias) return {ok:false,msg:'Este envio não veio da Previsão FULL, então não há média de vendas guardada para recalcular.'};
  const D=Math.max(0,diasEntre(hoje(),novaData));
  const cob=fullCfg().cobertura||30;
  const linhas=[];
  e.itens.forEach(it=>{
    const p=prodById(it.produtoId); if(!p) return;
    const m=e.medias[p.id]; if(!m) { linhas.push({item:it,produto:p,atual:it.solicitado,novo:it.solicitado,dif:0,semMedia:true}); return; }
    const proj=(m.full||0)-m.media*D;
    const bruto=m.media*cob-proj;
    const novo=bruto>0?Math.ceil(bruto):0;
    linhas.push({item:it,produto:p,media:m.media,atual:it.solicitado||0,novo,dif:novo-(it.solicitado||0)});
  });
  return {ok:true,D,cob,linhas,mudou:linhas.filter(l=>l.dif!==0)};
}
function aplicarRecalculo(envioId,novaData){
  const r=recalcularEnvioPorData(envioId,novaData);
  if(!r.ok) return r;
  const e=envioById(envioId);
  let soma=0,sub=0;
  batch('mudança da data do envio '+e.nome+' para '+fmtData(novaData),()=>{
    r.linhas.forEach(l=>{
      if(l.dif===0) return;
      aplicarAjusteItem(e,l.item,l.produto,l.novo);
      if(l.dif>0) soma+=l.dif; else sub+=-l.dif;
    });
    if(e.data!==novaData) e.coletaConfirmada=false; /* ver comentário em editarEnvio */
    e.data=novaData; e.nome=fmtData(novaData);
  });
  return {ok:true,soma,sub};
}

function copiarTexto(t,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>toast(msg||'Copiado.'),()=>fallbackCopia(t,msg));
  else fallbackCopia(t,msg);
}
function fallbackCopia(t,msg){
  const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select();
  try{ document.execCommand('copy'); toast(msg||'Copiado.'); }catch(e){ toast('Copie manualmente.'); }
  a.remove();
}

/* Sugestão de emergência: quando algum produto vai zerar antes do envio já previsto,
   oferece criar um envio separado (menor, focado só no que está em risco) em vez de

/* CORRIGIDO 28/08 (Felipe): só entra no modal quem TEM estoque físico no galpão pra mandar agora
   (ver disponivelUrgenteEnvio/criarFullEmergencia) - quem está em risco mas sem estoque disponível
   fica de fora e é avisado separado, porque incluir geraria compra, e compra não resolve urgência. */
function abrirCriarFullEmergencia(){
  const c=fullCfg();

  if(!todos.length){ toast('Nenhum produto em risco de ruptura nesta loja no momento.'); return; }
  const l=todos.filter(x=>x.p&&disponivelUrgenteEnvio(x.p)>0);
  if(!l.length){ toast('Os produtos em risco de ruptura não têm estoque disponível no galpão agora — enviar exigiria comprar primeiro, o que não resolve uma emergência.'); return; }

  }

function gerarInboundPrevisao(){
  const c=fullCfg(), l=fullItensLoja().map(i=>({i,k:fullCalc(i)})).filter(x=>x.k.qtd>0);
  if(!l.length){ alert('Nenhum produto com quantidade a enviar nesta loja.'); return; }
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('A biblioteca de PDF não carregou. Verifique a conexão e recarregue a página.'); return; }
  const {jsPDF}=window.jspdf, ALT=841.89, X_PROD=38, X_QTD=237;
  const doc=new jsPDF({unit:'pt',format:'a4'}), y=v=>ALT-v;
  doc.setFontSize(9);
  doc.text('PRODUTO',X_PROD,y(632)); doc.text('UNIDADES',X_QTD,y(632));
  let py=603;
  l.forEach(({i,k})=>{
    if(py<70){ doc.addPage(); py=754; doc.text('PRODUTO',X_PROD,y(782)); doc.text('UNIDADES',X_QTD,y(782)); }
    const p=fullProduto(i);
    doc.text('Código ML: '+((p&&p.codigo)||i.codigo||'—')+' Código universal: ',X_PROD,y(py));
    doc.text('SKU: '+fullSku(i),X_PROD,y(py-9));
    doc.text(String(fullSku(i)).slice(0,62),X_PROD,y(py-21));
    doc.text(String(k.qtd),X_QTD,y(py+2));
    py-=61;
  });
  const [a,m,d]=c.envio.split('-');
  const nome=d+m+a.slice(2)+' '+c.loja.toUpperCase().replace(/\s+/g,'')+'.pdf';
  const blob=doc.output('blob'), link=document.createElement('a');
  link.href=URL.createObjectURL(blob); link.download=nome; link.click();
  setTimeout(()=>URL.revokeObjectURL(link.href),4000);
  toast('Inbound gerado: '+nome);
}

function fLidoTxt(t){
  if(!t) return 'nunca';
  const d=new Date(t);
  /* comparação por DIA CIVIL (data do calendário), não por janela corrida de 24h - antes,
     uma leitura de ontem às 19:50 ainda aparecia como "hoje" se tivessem se passado menos de
     24h (ex: eram 15h de hoje), o que é enganoso: a data impressa já mostra 11/08 mas o rótulo
     dizia "hoje" mesmo sendo 12/08. */
  const meiaNoite=x=>{ const dt=new Date(x); return new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()).getTime(); };
  const ha=Math.round((meiaNoite(Date.now())-meiaNoite(t))/864e5);
  const s=d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return s+(ha<=0?' · hoje':ha===1?' · ontem':' · há '+ha+' dia(s)');
}

/* ---------- Ruptura de estoque: todas as lojas de uma vez, comparando com o envio FULL
   já programado de verdade (Envios programados), não com a data manual da Previsão ---------- */
/* envios programados (ainda não confirmados como FULL) deste produto, abertos por data - mesmo
   conjunto que entradaPendenteDe soma num número só, só que aqui cada data fica separada. */
function pendentesPorData(produtoId){
  if(!produtoId) return [];
  const porData={};
  state.envios.forEach(e=>e.itens.forEach(i=>{
    /* CORRIGIDO 25/08: pra um SKU vinculado (estoque físico compartilhado, ver
       produtoEfetivo/alocarNoEnvio), o item do envio guarda produtoId = SKU MESTRE (só pra
       contar reservado/compra corretamente no estoque compartilhado) e skuEscolhidoId = o SKU
       REAL que foi escolhido pro Full (cada anúncio vinculado tem Full/anúncio PRÓPRIO, mesmo
       compartilhando estoque físico). Casar só por produtoId fazia o Doca achar que um SKU
       vinculado nunca tinha nada programado (caso real: AMASSADORALHO some do alerta de
       ruptura porque o envio ficava registrado como o mestre AMASSADORALHO19). */
    if((i.skuEscolhidoId||i.produtoId)!==produtoId||!(i.solicitado>0)) return;
    const d=e.data||'9999-99-99'; /* sem data = não dá pra saber se chega a tempo, trata como "não conta" */
    porData[d]=(porData[d]||0)+i.solicitado;
  }));
  return Object.keys(porData).sort().map(d=>({data:d,qtd:porData[d]}));
}
/* recalcula full/cob/diaZero considerando só os envios programados que chegam A TEMPO de evitar
   a ruptura: aptas + em transferência sempre contam (já são reais/garantidos); dos "próximos
   programados", só entra quem tem data igual ou antes da projeção de zerar - envio programado
   pra depois que já zerou não ajuda em nada. Precisa iterar porque incluir um envio empurra a
   projeção de zerar mais pra frente, o que pode trazer mais um envio pra dentro do prazo. */
function rupturaCalcComData(i){
  const k=fullCalc(i);
  const produtoId=i.produtoId||(fullProduto(i)?fullProduto(i).id:null);
  const pendentes=pendentesPorData(produtoId);
  const diaCalc=full=>k.media>0?full/k.media:(full>0?Infinity:0);
  /* CORRIGIDO 28/08: inclui k.emProcessamento (envio confirmado como FULL, aguardando o ML
     processar - ver fullCalc) na base, senão o alerta de ruptura dispara à toa logo depois de
     confirmar um envio, antes da API mostrar o recebimento de verdade. */
  let full=(i.aptas||0)+(i.transf||0)+(k.emProcessamento||0);
  let cob=diaCalc(full);
  let diaZero=cob===Infinity?null:new Date(Date.now()+Math.max(0,Math.floor(cob))*864e5).toISOString().slice(0,10);
  const usados=new Set();
  let mudou=true;
  while(mudou){
    mudou=false;
    for(const p of pendentes){
      if(usados.has(p.data)) continue;
      if(diaZero!=null&&p.data<=diaZero){
        full+=p.qtd; usados.add(p.data); mudou=true;
        cob=diaCalc(full);
        diaZero=cob===Infinity?null:new Date(Date.now()+Math.max(0,Math.floor(cob))*864e5).toISOString().slice(0,10);
      }
    }
  }
  /* primeiro envio programado PRA ESSE PRODUTO que não entrou a tempo de evitar a ruptura (chega
     depois da projeção de zerar) — usado pra avisar "já tem FULL programado, mas é tarde" de
     forma específica por produto, em vez de olhar só se a LOJA tem algum envio programado
     (podia ser um envio que nem inclui esse SKU). */
  const pendenteTardio=pendentes.find(p=>!usados.has(p.data))||null;
  return {...k,full,cob,diaZero,pendentes,pendenteTardio};
}
/* pausa/reativa o aviso de ruptura de 1 SKU - pra produto que vai sair de linha: vende o que
   resta, não repõe, e depois exclui o anúncio no Mercado Livre. Não mexe em estoque nem vendas,
   só tira (ou devolve) da lista de risco de ruptura em Visão Geral e FULL → Ruptura. */
function pausarReposicao(id,pausar){
  const p=prodById(id); if(!p) return;
  snapshot((pausar?'aviso de ruptura pausado: ':'aviso de ruptura reativado: ')+p.sku);
  p.repoPausada=!!pausar;
  persist();
}

  return state.produtos.filter(p=>p.repoPausada).sort((a,b)=>a.loja.localeCompare(b.loja)||a.sku.localeCompare(b.sku));

function rupturaLojaLista(loja,diasLimite){
  const prox=proximoEnvioLoja(loja);
  return fullItensLoja(loja).map(i=>({i,k:fullCalc(i),p:fullProduto(i)}))
    /* produto ja excluido/encerrado no Mercado Livre (p.mlAusente=true) nao deve gerar alerta
       de ruptura - ele so continua no cadastro pra manter historico, nao faz mais sentido
       comprar/coletar/repor algo que nao existe mais como anuncio pra vender. */
    .filter(({p})=>!(p&&p.mlAusente))
    /* produto que o Felipe marcou pra "sair de linha" (vende o que resta, não repõe, depois
       exclui o anúncio) - o aviso de ruptura não faz sentido mais pra ele, então some da lista
       até ser reativado (ver botão 🔕/produtosComReposicaoPausada). */
    .filter(({p})=>!(p&&p.repoPausada))
    .filter(({k})=>k.media>0&&k.cob!==Infinity)
    .map(x=>{
      const kr=rupturaCalcComData(x.i);
      const cobDias=Math.floor(kr.cob);
      const zeraAntesDoEnvio=!!kr.pendenteTardio; /* ESSE produto tem FULL programado, mas tarde */
      const proximoFullProduto=kr.pendentes&&kr.pendentes.length?kr.pendentes[0]:null;
      const diaZero=kr.diaZero||new Date(Date.now()+Math.max(0,cobDias)*864e5).toISOString().slice(0,10);
      /* regra nova (Felipe, 21/08): mesmo fora da janela normal de alerta (diasLimite, ex.: 10 dias),
         se esse SKU NAO tem nenhum FULL programado pra ele (proximoFullProduto null) E a loja já
         tem um próximo envio agendado (prox) que não vai chegar a tempo de evitar a ruptura, avisa
         de qualquer forma - senão o produto só entraria no radar quando a ruptura já estivesse a
         menos de 10 dias, tarde demais pra entrar no próximo envio que já está sendo montado agora.
         Caso real que motivou isso: o PERLON80 não estava em nenhum envio programado e só apareceu
         no alerta quando a ruptura já estava a 10 dias - com essa regra, teria aparecido antes,
         assim que ficasse claro que ele não ia entrar a tempo no próximo envio da loja. */
      // 21/08: se esse SKU acabou de ter um envio confirmado como FULL e o Mercado Livre ainda
      // não mostrou movimento real (ver mlAtualizarFullDoSinc/confirmarEnvioFull), suspende só o
      // aviso "não está no próximo envio" - ele ficaria fora de lugar (material já foi, só falta
      // o ML processar). O resto do alerta (cobDias/diaZero) continua real, sem mexer.
      // CORRIGIDO 28/08 (2ª volta): agora olha a fila (p.filaProcessamento) em vez de 1 marcador -
      // ver comentário completo em confirmarEnvioFull.
      const emGracaEnvio=!!(x.p&&x.p.filaProcessamento&&x.p.filaProcessamento.length);
      const foraDoProximoEnvio=!emGracaEnvio&&!proximoFullProduto&&!!prox&&!!prox.data&&diaZero<=prox.data;
      return {...x,k:kr,cobDias,zeraAntesDoEnvio,proximoFullProduto,diaZero,foraDoProximoEnvio,emGracaEnvio,dataEnvioConfirmado:emGracaEnvio?x.p.filaProcessamento[0].data:null};
    })
    .filter(x=>x.cobDias<=diasLimite||x.zeraAntesDoEnvio||x.foraDoProximoEnvio)
    .sort((a,b)=>a.cobDias-b.cobDias)
    .map(x=>({...x,prox}));
}

/* ---------- Estoque Mínimo (pedido do Felipe 22/08) ----------
   Compara o estoque mínimo já calculado pelo sistema (mesma conta da Previsão de reposição: média
   de vendas/dia x 30 dias de cobertura, com fallback pro valor manual) com TUDO que já é dono hoje
   - não só o que já chegou no FULL, mas também o que está a caminho, o que já foi comprado do
   fornecedor (a coletar), o que já está pedido (a comprar) e o que está fisicamente no galpão -
   pra saber quanto falta comprar de verdade e quanto capital isso exige. */
let estoqueMinimoSoFaltantes=true;
let estoqueMinimoSoCurvaA=true; // filtro Curva A (70% do faturamento) - toggle, pedido do Felipe 22/08
// 22/08 (achado real do Felipe): eu estava usando p.qtd.local sozinho (só a parte LIVRE do
// galpão), mas o que já está RESERVADO pra um envio FULL programado (reservadoLocalDe) continua
// sendo estoque seu de verdade, só que já com destino certo - não pode ficar de fora da conta.
// Por outro lado, o número "A caminho" que aparece no Produtos (386 no exemplo do Cabo Mickey) já
// SOMA esse reservado (o próprio Doca mostra isso: "Próximos programados não entra no Valor
// estoque - já está contado em Reservado"), então usar local+reservado (totalNoGalpao) E TAMBÉM o
// "A caminho" cheio contaria o reservado 2x. A conta certa: local TOTAL (livre+reservado, via
// totalNoGalpao) + aptas no FULL + só a parte que está de fato em trânsito (mlTransferencia) -
// sem entrar com "próximos programados" de novo.
function estoqueTotalCombinado(p){
  return (p.mlQtdDisponivel||0)+(p.mlTransferencia||0)+(p.qtd.comprar||0)+(p.qtd.coletar||0)+totalNoGalpao(p);
}
function linhaEstoqueMinimo(p){
  if(p.vinculadoA) return null; // estoque mora no SKU mestre, não duplica aqui
  const minimoBase=estoqueMinimoEfetivo(p);
  if(!minimoBase||minimoBase<=0) return null; // sem mínimo definido ainda (nem sugerido pelo FULL, nem manual)
  const minimo=minimoBase*2; // meta = 2 meses de estoque (confirmado com Felipe 22/08, era 1 mês antes)
  const atual=estoqueTotalCombinado(p);
  const comprarAMais=Math.max(0,minimo-atual);
  const semCusto=comprarAMais>0&&!(p.custo>0);
  const capital=semCusto?0:comprarAMais*(p.custo||0);
  const galpaoLivre=p.qtd.local||0, galpaoReservado=reservadoLocalDe(p);
  const vendasDia=mediaVendasDiaria(p)||0; // pra ordenar relatório por mais vendido
  const detalhe=`FULL: ${fmtInt(p.mlQtdDisponivel||0)} · Em trânsito pro FULL: ${fmtInt(p.mlTransferencia||0)} · A comprar (já em pedido): ${fmtInt(p.qtd.comprar||0)} · A coletar: ${fmtInt(p.qtd.coletar||0)} · No galpão livre: ${fmtInt(galpaoLivre)} · No galpão reservado p/ envio: ${fmtInt(galpaoReservado)}`;
  return {p,minimo,atual,comprarAMais,capital,semCusto,detalhe,vendasDia};
}
/* Curva A (Pareto 70% do faturamento) por loja - pedido do Felipe 22/08: a aba Estoque Mínimo
   só faz sentido pros produtos que realmente sustentam o faturamento, não pro catálogo inteiro.
   Busca o faturamento do mês corrente por produto (mesmo job usado em Finanças/Amauri/Ads —
   /financas/resumo-job, roda em background), ordena por faturamento desc e pega os produtos até
   a soma acumulada bater 70% do faturamento total. Guarda o resultado em cache por loja
   (estoqueMinimoCurvaA) pra não ficar rebuscando a cada render. */
let estoqueMinimoCurvaA={}; // { [loja]: {status:'carregando'|'pronto'|'erro', skuIds:Set<itemId>, erro, progresso, calculadoEm} }
async function carregarCurvaAEstoqueMinimo(loja){
  estoqueMinimoCurvaA[loja]={status:'carregando',skuIds:new Set(),erro:null,progresso:null,calculadoEm:null};
  renderEstoqueMinimo();
  try{
    const resumo=await fetchResumoJob(loja,'mes_corrente','','',(p)=>{
      if(estoqueMinimoCurvaA[loja]) estoqueMinimoCurvaA[loja].progresso=p;
      renderEstoqueMinimo();
    });
    const itens=(resumo.itensVendidos||[]).filter(it=>(it.valor||0)>0).slice().sort((a,b)=>b.valor-a.valor);
    const totalFat=itens.reduce((s,it)=>s+(it.valor||0),0);
    const skuIds=new Set();
    let acumulado=0;
    for(const it of itens){
      acumulado+=it.valor||0;
      skuIds.add(it.itemId);
      if(totalFat>0&&acumulado/totalFat>=0.7) break;
    }
    estoqueMinimoCurvaA[loja]={status:'pronto',skuIds,erro:null,progresso:null,calculadoEm:new Date()};
  }catch(e){
    estoqueMinimoCurvaA[loja]={status:'erro',skuIds:new Set(),erro:e.message,progresso:null,calculadoEm:null};
  }
  renderEstoqueMinimo();
}

    return {loja,ca,aguardandoCurvaA,linhas,totalSku:todasLinhas.length,capitalTotalLoja,semCustoQtd};

  const capitalGeral=porLoja.reduce((s,r)=>s+r.capitalTotalLoja,0);

/* sincroniza com o Mercado Livre sozinho assim que o Doca abre, se o backend já estiver
   configurado — não precisa clicar em nada nem dar F5. Passa por TODAS as lojas (STORES),
   uma de cada vez (não em paralelo, pra não sobrecarregar o backend/servidor gratuito),
   aplicando automaticamente o que já está vinculado por SKU/mlItemId. Roda em segundo
   plano; se uma loja falhar (não autorizada, servidor dormindo, sem internet etc.) segue
   pras próximas sem travar o resto do app — cada loja fica só com os dados de quando
   funcionou por último. */
(async function sincronizarMlAoAbrir(){
  if(!backendUrl()) return;
  /* fatura do Mercado Livre primeiro (uma chamada rápida por loja) — antes ela ficava no fim de
     uma fila sequencial (produtos → Mercado Pago → Ads → fatura → imposto, loja por loja), então
     se qualquer passo mais lento travasse ou o backend gratuito estivesse "dormindo", a fatura só
     aparecia depois de clicar manualmente em "🔄" na aba Finanças. Disparar as 4 lojas exatamente
     ao mesmo tempo esbarrava no limite de chamadas por segundo do Mercado Livre (429), então agora
     começa uma loja a cada 500ms (ainda bem mais rápido que a fila antiga) e cada uma tenta de
     novo sozinha se cair num 429 (ver puxarFaturaMlComRetry). */
  const promessasFatura=[];
  for(let i=0;i<STORES.length;i++){
    const loja=STORES[i];
    promessasFatura.push(puxarFaturaMlComRetry(loja).catch(e=>{
      console.error(`Sincronização automática da fatura do Mercado Livre falhou ao abrir o Doca (loja ${loja}):`,e.message);
      financasUltimoErroAuto[loja]=e.message;
    }));
    if(i<STORES.length-1) await sleep(500);
  }
  await Promise.allSettled(promessasFatura);
  renderFinancas();
  for(const loja of STORES){
    try{
      const resultado=await mlSincronizarLoja(loja);
      aplicarSincronizacaoAutomatica(resultado);
      delete mlUltimoErroAuto[loja];
    }catch(e){
      console.error(`Sincronização automática com o Mercado Livre falhou ao abrir o Doca (loja ${loja}):`,e.message);
      mlUltimoErroAuto[loja]=e.message;
      renderProdutos();
    }
    try{
      await carregarReclamacoes(loja);
      await carregarMensagens(loja);
      renderDashboard();
    }catch(e){
      console.error(`Sincronização automática de reclamações/mensagens falhou ao abrir o Doca (loja ${loja}):`,e.message);
    }
    try{
      aplicarSincronizacaoFinanceira(loja,await mpSincronizarFinanceiro(loja));
    }catch(e){
      console.error(`Sincronização automática do financeiro (Mercado Pago) falhou ao abrir o Doca (loja ${loja}):`,e.message);
    }
    try{
      await adsSincronizarLoja(loja);
    }catch(e){
      console.error(`Sincronização automática de Ads falhou ao abrir o Doca (loja ${loja}):`,e.message);
    }
    try{
      await sincronizarImpostoAutomatico(loja);
      renderDashboard();
    }catch(e){
      console.error(`Sincronização automática do imposto (Visão Geral) falhou ao abrir o Doca (loja ${loja}):`,e.message);
    }
    try{
      await sincronizarImpostoDespesaMes(loja);
      renderFinancas();
    }catch(e){
      console.error(`Sincronização automática da despesa de Imposto falhou ao abrir o Doca (loja ${loja}):`,e.message);
    }
  }
})();

   deve aparecer como pendente no alerta do dia - pedido do Felipe 19/08 */
/* DATA EFETIVA DE TAREFA PERIÓDICA (pedido do Felipe 01/09: "não deveria estar aparecendo 07/08,
   isso foi quando foi criado - quando concluir deve mudar pro próximo mês, 07/09 e assim por
   diante"): numa tarefa de Gestão Ativa a data guardada serve só pra dizer QUE DIA do período ela
   cai (dia 7, toda quarta...), não uma data única no calendário. Antes a data ficava congelada no
   dia em que a tarefa foi criada, então o mês virava e ela aparecia como atrasada pra sempre,
   cobrando todo santo dia mesmo faltando uma semana pro dia 7 chegar de novo.
   Agora a data mostrada e usada no aviso é sempre a ocorrência do período ATUAL - e, se já foi
   concluída neste período, já mostra a do período seguinte. A data guardada (t.data) não é
   alterada: ela continua sendo a origem do "dia 7", e editar o campo simplesmente escolhe outro
   dia. Tarefa normal (sem Gestão Ativa) não muda nada - data continua sendo data. */
function diaParaISO(numDias){
  const d=new Date(numDias*864e5+432e5); /* meio-dia, pra não escorregar de dia por fuso */
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dataEfetivaTarefa(t){
  const base=String((t&&t.data)||'').slice(0,10);
  if(!base||!t.resetaTipo) return base;
  const h=hoje();
  if(t.resetaTipo==='semanal'){
    /* mesma "semana" usada pelo reset (ver semanaAtualStr): blocos fixos de 7 dias */
    const diaBase=Math.floor(new Date(base+'T12:00:00').getTime()/864e5);
    if(isNaN(diaBase)) return base;
    const hojeNum=Math.floor(new Date(h+'T12:00:00').getTime()/864e5);
    const inicio=Math.floor(hojeNum/7)*7;
    let alvo=inicio+((((diaBase-inicio)%7)+7)%7);
    if(tarefaConcluidaNoPeriodo(t)) alvo+=7;
    return diaParaISO(alvo);
  }
  const dia=Number(base.slice(8,10));
  if(!dia) return base;
  let ano=Number(h.slice(0,4)), mes=Number(h.slice(5,7));
  if(tarefaConcluidaNoPeriodo(t)){ mes++; if(mes>12){ mes=1; ano++; } }
  const ultimoDiaDoMes=new Date(ano,mes,0).getDate(); /* dia 31 num mês de 30 cai no último dia */
  const diaFinal=Math.min(dia,ultimoDiaDoMes);
  return `${ano}-${String(mes).padStart(2,'0')}-${String(diaFinal).padStart(2,'0')}`;
}
function tarefaConcluidaNoPeriodo(t){
  if(!t||!t.resetaTipo) return false;
  const subs=t.subs||[];
  if(subs.length){ const periodo=periodoAtualParaTarefa(t); return subs.every(s=>s.concluidoMes===periodo); }
  return tarefaFeitaEsteMes(t);
}
function tarefasDeHojePendentes(){
  const h=hoje();
  const hhmm=new Date().toTimeString().slice(0,5);
  const porData=(state.tarefas||[]).filter(t=>{
    const d=dataEfetivaTarefa(t);                  // periódica: ocorrência deste período, não a data de criação
    if(!d||d>h) return false;                      // sem data, ou data futura - ainda não mostra
    // pedido do Felipe 20/08: hoje OU atrasada (d<=h) continua avisando todo dia até concluir -
    // só não mostra quando a tarefa já foi concluída.
    if(tarefaConcluidaNoPeriodo(t)) return false;  // Gestão Ativa já concluída este período - não incomoda de novo
    return true;
  });
  /* tarefa de Gestão Ativa (mensal/semanal) SEM data marcada é um lembrete recorrente - entra no
     aviso todo dia enquanto não for concluída no período. A que TEM data já foi tratada no filtro
     acima (mesma regra das tarefas normais: hoje ou atrasada, some quando concluir) - pedido do
     Felipe 20/08 */
  const vistos=new Set(porData.map(t=>t.id));
  (state.tarefas||[]).forEach(t=>{
    if(!t.resetaTipo||t.data||vistos.has(t.id)||tarefaConcluidaNoPeriodo(t)) return;
    vistos.add(t.id); porData.push(t);
  });
  return porData;
}
/* aoFechar (opcional): chamado depois que o usuário fecha o alerta - usado pra encadear com o
   alerta de despesas vencendo, já que os dois usam o MESMO modal (ver mostrarAlertaDespesasDoDia)
   e não dá pra abrir os dois ao mesmo tempo sem um sobrescrever o outro. */
function mostrarAlertaTarefasDoDia(aoFechar){
  const lista=tarefasDeHojePendentes();
  if(!lista.length){ if(aoFechar) aoFechar(); return; }
  const body=openModal(false);
  body.innerHTML=`<h3>⏰ ${lista.length} tarefa${lista.length>1?'s':''} pra hoje</h3>
    <p class="hint" style="margin:0 0 12px">Ainda não concluída${lista.length>1?'s':''}:</p>
    <div class="table-wrap"><table class="tbl-produtos"><tbody>
      ${lista.map(t=>`<tr><td>${esc(t.titulo)}${t.hora?` <span class="muted" style="font-size:11px">(${esc(t.hora)})</span>`:''}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="modal-actions"><button class="btn gold" id="btnFecharAlertaTarefasDoDia">Ok, entendi</button></div>`;
  document.getElementById('btnFecharAlertaTarefasDoDia').onclick=()=>{ closeModal(); if(aoFechar) aoFechar(); };
}
/* despesas vencendo ou vencidas e ainda não pagas (pedido do Felipe 23/08, "igual gestão ativa") -
   mesmo padrão do alerta de tarefas: aparece ao abrir o Doca e ao entrar em Finanças, some quando
   fechado mas VOLTA a aparecer enquanto a despesa continuar pendente (só some de vez quando
   marcar como paga). Fatura ML fica de fora - é debitada automático e o próprio Doca já marca
   como paga sozinho (ver puxarFaturaMl), não precisa de lembrete manual pra ela. */
function despesasVencendoPendentes(){
  const h=hoje();
  return despesasArr().filter(d=>!d.pago&&d.origem!=='ml_fatura'&&d.dataPagamento&&d.dataPagamento<=h)
    .sort((a,b)=>a.dataPagamento.localeCompare(b.dataPagamento));
}
function mostrarAlertaDespesasDoDia(aoFechar){
  const lista=despesasVencendoPendentes();
  if(!lista.length){ if(aoFechar) aoFechar(); return; }
  const body=openModal(false);
  body.innerHTML=`<h3>💸 ${lista.length} despesa${lista.length>1?'s':''} vencendo</h3>
    <p class="hint" style="margin:0 0 12px">Ainda não paga${lista.length>1?'s':''}:</p>
    <div class="table-wrap"><table class="tbl-produtos"><tbody>
      ${lista.map(d=>`<tr><td>${esc(d.descricao)} <span class="loja-tag">${esc(d.loja)}</span></td><td class="num">${fmtMoney(d.valor)}</td><td class="muted" style="white-space:nowrap">${d.dataPagamento<hoje()?'venceu ':'vence '}${fmtData(d.dataPagamento)}</td><td><button class="btn sm" data-alertjapaguei="${d.id}">Já paguei</button></td></tr>`).join('')}
    </tbody></table></div>
    <div class="modal-actions"><button class="btn gold" id="btnFecharAlertaDespesasDoDia">Ok, entendi</button></div>`;
  body.querySelectorAll('[data-alertjapaguei]').forEach(btn=>{
    btn.onclick=()=>{
      marcarDespesaPaga(btn.getAttribute('data-alertjapaguei'),true);
      toast('Despesa marcada como paga.');
      renderFinancas();
      mostrarAlertaDespesasDoDia(aoFechar); // redesenha o alerta só com o que ainda falta (fecha sozinho se não sobrar nada)
    };
  });
  document.getElementById('btnFecharAlertaDespesasDoDia').onclick=()=>{ closeModal(); if(aoFechar) aoFechar(); };
}
/* bug corrigido 19/08: essa linha chamava checarTarefasVencendo(), uma função que nunca chegou
   a ser criada - o erro (ReferenceError não capturado) parava a execução do script bem aqui,
   impedindo o setInterval do re-sync financeiro periódico (linha abaixo) de sequer ser
   registrado. Troca pela função que já existe e faz o mesmo (avisar de tarefa pendente pra
   hoje), rodando 1x já na abertura do app - encadeada com o alerta de despesas (pedido do Felipe
   23/08), já que os dois competem pelo mesmo modal. */
mostrarAlertaTarefasDoDia(mostrarAlertaDespesasDoDia);
/* re-sync periódico só do financeiro (Mercado Pago), enquanto a aba do Doca fica aberta.
   Motivo (descoberto com dado real em 13/08): o relatório do Mercado Pago fica pronto rápido,
   mas o Doca só ia buscar ele quando a aba era aberta/recarregada - sem isso, um relatório que
   ficasse pronto enquanto ninguém tinha o Doca aberto só era "visto" horas depois, na próxima
   vez que alguém abrisse o app, dentro da janela de frescor. Rodando esse re-sync sozinho a
   cada 20min, a aba aberta vai catando o relatório pronto sem precisar recarregar a página. */
async function sincronizarFinanceiroPeriodico(){
  if(!backendUrl()) return;
  for(const loja of STORES){
    try{ aplicarSincronizacaoFinanceira(loja,await mpSincronizarFinanceiro(loja)); }
    catch(e){ console.error(`Re-sync periódico do financeiro (Mercado Pago) falhou (loja ${loja}):`,e.message); }
  }
}
setInterval(sincronizarFinanceiroPeriodico,20*60*1000);
</script>
