/* ================= PREVISÃO FULL ================= */
function fullCfg(){ return state.full.cfg; }
function fullItensLoja(loja){ return state.full.itens.filter(i=>i.loja===(loja||fullCfg().loja)); }
/* casa com o cadastro do Doca: SKU primeiro, depois Código ML */
function fullProduto(i){
  if(i.produtoId){ const v=prodById(i.produtoId); if(v) return v; }
  const s=String(i.sku||'').trim().toLowerCase(), c=String(i.codigo||'').trim().toLowerCase();
  return state.produtos.find(p=>p.loja===i.loja&&String(p.sku||'').toLowerCase()===s)
    ||(c?state.produtos.find(p=>p.loja===i.loja&&String(p.codigo||'').toLowerCase()===c):null)
    ||(s?state.produtos.find(p=>p.loja===i.loja&&String(p.codigo||'').toLowerCase()===s):null)||null;
}
/* o SKU mostrado é sempre o do cadastro quando o produto existe */
function fullSku(i){ const p=fullProduto(i); return p?p.sku:(i.sku||i.codigo||'—'); }
function fullCusto(i){ const p=fullProduto(i); return p?(Number(p.custo)||0):0; }
function diasEntre(a,b){ if(!a||!b) return 0; return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5); }
function fullCalc(i,envioOverride){
  const c=fullCfg();
  const r7=(i.v7||0)/7, r15=(i.v15||0)/15, r30=(i.v30||0)/30;
  const soma=(c.p7||0)+(c.p15||0)+(c.p30||0);
  const somaPond=r7*c.p7+r15*c.p15+r30*c.p30;
  const temPeriodos=(i.v7||0)||(i.v15||0)||(i.v30||0);
  const mediaPronta=(!temPeriodos&&i.mediaFixa!=null&&i.mediaFixa>0);
  const media=mediaPronta?i.mediaFixa:(soma>0?somaPond/soma:0);
  /* envioOverride deixa recalcular pra uma data diferente da salva em c.envio, sem mexer no
     estado — usado no modal "Criar FULL no Doca" pra atualizar a sugestão na hora quando a
     pessoa muda a data ali dentro, antes de confirmar. */
  const D=Math.max(0,diasEntre(hoje(),envioOverride||c.envio));
  /* dois estados de estoque "a caminho do Full", cada um com fonte própria e 100% real:
     - "em transferência" (i.transf): direto da API do Mercado Livre.
     - "próximos programados" (envios criados no Doca e ainda NÃO confirmados como FULL — ver
       entradaPendenteDe): dado do próprio Doca, sempre atual.
     O campo "Entrada pendente" (tentativa de rastrear localmente o que já foi confirmado como
     FULL no Doca mas a API ainda não mostrava) foi removido — o Mercado Livre não expõe essa
     informação por API, e o número só ficava desatualizado sem ninguém perceber. Assim que um
     envio é confirmado como FULL, ele sai de "Próximos programados" e some do cálculo até a
     próxima sincronização mostrar a mercadoria de verdade em "Aptas"/"Em transferência".
     Os dois contam pra QUANTIDADE (full/Total/cobertura/sugestão de envio), pra não sugerir
     enviar de novo o que já está no caminho ou já programado. Só "em transferência" conta pro
     VALOR EM DINHEIRO — "próximos programados" ainda está fisicamente no galpão/fornecedor e
     seu valor já é contado no estoque LOCAL via "Reservado" (ver valorEstoque/totalNoGalpao);
     contar de novo aqui duplicaria o dinheiro. */
  const proximosProgramados=entradaPendenteDe(i.produtoId||(fullProduto(i)?fullProduto(i).id:null));
  const fullValorBase=(i.aptas||0)+(i.transf||0);
  const full=fullValorBase+proximosProgramados;   /* quantidade, pra Total/cobertura/sugestão */
  const consumo=media*D, proj=full-consumo, dem=media*(c.cobertura||30);
  const bruto=dem-proj, enviar=bruto>0?Math.ceil(bruto):0;
  const cob=media>0?full/media:(full>0?Infinity:0);   /* dias que o estoque do Full aguenta */
  /* ruptura: o estoque zera ANTES do envio chegar */
  const rompe=media>0&&cob<D;
  const diaRuptura=rompe?new Date(Date.now()+Math.floor(cob)*864e5).toISOString().slice(0,10):'';
  const vendasIncoer=!mediaPronta&&((i.v7||0)>(i.v15||0)||(i.v15||0)>(i.v30||0));
  /* se esse SKU ja teve um envio confirmado (Criar FULL no Doca) e o envio ainda existe,
     nao sugere mandar de novo — mesmo que a conta de demanda desse outro numero. So volta a
     sugerir se o envio for excluido ou se voce ajustar manualmente. */
  const jaEnviado=!!(i.enviado&&envioById(i.enviado.envioId));
  const qtd=i.ajuste!=null?i.ajuste:(jaEnviado?0:enviar);
  return {r7,r15,r30,soma:somaPond,media,mediaPronta,D,full,proximosProgramados,consumo,proj,dem,enviar,qtd,cob,
    rompe,diaRuptura,vendasIncoer,jaEnviado,custo:fullCusto(i),valor:fullValorBase*fullCusto(i)};
}
function fullResumo(loja){
  const l=fullItensLoja(loja).map(i=>({i,k:fullCalc(i)}));
  return {
    itens:l.length,
    unid:l.reduce((a,x)=>a+x.k.full,0),
    valor:l.reduce((a,x)=>a+x.k.valor,0),
    semCusto:l.filter(x=>x.k.full>0&&!x.k.custo).length,
    enviar:l.filter(x=>x.k.qtd>0).length,
    unEnviar:l.reduce((a,x)=>a+x.k.qtd,0),
    rupturas:l.filter(x=>x.k.rompe).length,
    lidoEm:state.full.lidoEm[loja||fullCfg().loja]||0
  };
}
function fullValorTodasLojas(){ return STORES.reduce((a,l)=>a+fullResumo(l).valor,0); }
/* produtos (de qualquer loja) que, no ritmo de venda atual, zeram no FULL dentro de N dias —
   independe da data de envio programada, é só um alerta antecipado pra Visão Geral. */
function rupturaProximaLista(diasLimite){
  const out=[];
  state.full.itens.forEach(i=>{
    const p=fullProduto(i); if(!p) return;
    const k=fullCalc(i);
    if(k.media>0&&k.cob<=diasLimite){
      out.push({produto:p,dias:Math.max(0,Math.floor(k.cob)),diaZero:new Date(Date.now()+Math.max(0,Math.floor(k.cob))*864e5).toISOString().slice(0,10)});
    }
  });
  return out.sort((a,b)=>a.dias-b.dias);
}
function fullUnidadesTodasLojas(){ return STORES.reduce((a,l)=>a+fullResumo(l).unid,0); }
/* liga o item lido do painel a um produto já cadastrado — grava o Código ML no produto
   para que as próximas leituras casem sozinhas */
function vincularItemFull(itemId,produtoId){
  const i=state.full.itens.find(x=>x.id===itemId); if(!i) return {ok:false,msg:'Item não encontrado.'};
  const p=prodById(produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  if(p.loja!==i.loja) return {ok:false,msg:'O produto é de outra loja.'};
  const jaUsado=state.full.itens.find(x=>x!==i&&x.loja===i.loja&&fullProduto(x)&&fullProduto(x).id===produtoId);
  if(jaUsado) return {ok:false,msg:'Este produto já está ligado a outra linha desta leitura.'};
  snapshot('vínculo de '+(i.codigo||i.sku)+' com '+p.sku);
  i.produtoId=produtoId;
  const cod=String(i.codigo||i.sku||'').toUpperCase();
  if(cod&&!p.codigo) p.codigo=cod;      /* guarda o Código ML no cadastro */
  persist();
  return {ok:true,produto:p,gravouCodigo:!!cod};
}
function desvincularItemFull(itemId){
  const i=state.full.itens.find(x=>x.id===itemId); if(!i) return;
  snapshot('remoção do vínculo'); i.produtoId=null; persist();
}
/* histórico: uma linha por SKU a cada leitura, para ver a tendência */
function chaveHist(i){ const p=fullProduto(i); return (i.loja||'')+'|'+(p?p.id:('cod:'+String(i.codigo||i.sku||'').toUpperCase())); }
function gravarHistorico(loja){
  const dia=hoje();
  fullItensLoja(loja).forEach(i=>{
    const k=fullCalc(i), ch=chaveHist(i);
    const ant=state.full.hist.filter(x=>x.ch===ch);
    const mesmoDia=ant.find(x=>x.data===dia);
    if(mesmoDia){ mesmoDia.media=k.media; mesmoDia.full=k.full; mesmoDia.sku=fullSku(i); return; }
    state.full.hist.push({ch,loja,sku:fullSku(i),data:dia,media:k.media,full:k.full});
    /* guarda no máximo 24 leituras por SKU */
    const meus=state.full.hist.filter(x=>x.ch===ch);
    if(meus.length>24){ const fora=meus.slice(0,meus.length-24); state.full.hist=state.full.hist.filter(x=>fora.indexOf(x)<0); }
  });
}
function histDe(i){ const ch=chaveHist(i); return state.full.hist.filter(x=>x.ch===ch).slice(-24); }
/* tendência: compara a média de agora com a leitura anterior */
function tendencia(i){
  const h=histDe(i); if(h.length<2) return null;
  const atual=h[h.length-1].media, ant=h[h.length-2].media;
  if(!ant) return null;
  const v=(atual/ant-1)*100;
  return {pct:v,sobe:v>2,cai:v<-2,ant,de:h[h.length-2].data};
}
/* média das últimas leituras — serve de referência para prever o próximo período */
function mediaHistorica(i,n){
  const h=histDe(i).slice(-(n||6)).filter(x=>x.media>0);
  if(!h.length) return null;
  return {media:h.reduce((a,x)=>a+x.media,0)/h.length,leituras:h.length,desde:h[0].data};
}
/* cria o envio no Doca direto da previsão */
function criarFullDaPrevisao(loja,data,localColeta){
  const l=fullItensLoja(loja).map(i=>({i,k:fullCalc(i)})).filter(x=>x.k.qtd>0);
  if(!l.length) return {ok:false,msg:'Nenhum produto com quantidade a enviar nesta loja.'};
  let criados=0,ger=0,cam=0,alo=0;
  const nome=fmtData(data);
  let envio=null;
  batch('criação do envio '+nome+' pela Previsão FULL',()=>{
    envio=criarEnvio(nome,data,loja,'',localColeta||LOCAIS_COLETA[0]);
    envio.origem='previsao';
    envio.medias={};
    l.forEach(({i,k})=>{
      let p=fullProduto(i);
      if(!p){
        p=addProduto({loja,sku:(i.sku||i.codigo||'').toUpperCase(),codigo:(i.codigo||'').toUpperCase(),
          fornecedor:'',custo:0,estoqueMinimo:0,qtd:{comprar:0,coletar:0,local:0},lotes:[],pedidos:[],obsCompra:''});
        criados++;
      } else if(!p.codigo&&i.codigo) p.codigo=String(i.codigo).toUpperCase();
      const r=alocarNoEnvio(envio,p,k.qtd);
      alo+=r.alocado; cam+=r.aCaminho; ger+=r.gerado;
      /* guarda a média e o estoque lido, para recalcular se a data mudar */
      envio.medias[p.id]={media:k.media,full:k.full,lidoEm:state.full.lidoEm[loja]||Date.now()};
      i.enviado={qtd:k.qtd,envioId:envio.id,envio:nome,em:Date.now()};
    });
  });
  return {ok:true,envio,criados,alocado:alo,aCaminho:cam,gerado:ger,itens:l.length};
}
/* Cria um envio separado (marcado como emergência) só com os SKUs que vão zerar
   antes da data prevista — usado quando não dá pra antecipar o envio já programado. */
function criarFullEmergencia(loja,data,localColeta){
  const l=fullItensLoja(loja).map(i=>({i,k:fullCalc(i)})).filter(x=>x.k.rompe);
  if(!l.length) return {ok:false,msg:'Nenhum produto em risco de ruptura nesta loja.'};
  let criados=0,ger=0,cam=0,alo=0;
  const nome='FULL DE EMERGÊNCIA · '+fmtData(data);
  let envio=null;
  batch('criação do envio de emergência '+nome,()=>{
    envio=criarEnvio(nome,data,loja,'',localColeta||LOCAIS_COLETA[0]);
    envio.origem='emergencia';
    envio.medias={};
    l.forEach(({i,k})=>{
      let p=fullProduto(i);
      const qtd=Math.max(k.qtd,1);
      if(!p){
        p=addProduto({loja,sku:(i.sku||i.codigo||'').toUpperCase(),codigo:(i.codigo||'').toUpperCase(),
          fornecedor:'',custo:0,estoqueMinimo:0,qtd:{comprar:0,coletar:0,local:0},lotes:[],pedidos:[],obsCompra:''});
        criados++;
      } else if(!p.codigo&&i.codigo) p.codigo=String(i.codigo).toUpperCase();
      const r=alocarNoEnvio(envio,p,qtd);
      alo+=r.alocado; cam+=r.aCaminho; ger+=r.gerado;
      envio.medias[p.id]={media:k.media,full:k.full,lidoEm:state.full.lidoEm[loja]||Date.now()};
      i.enviado={qtd,envioId:envio.id,envio:nome,em:Date.now()};
    });
  });
  return {ok:true,envio,criados,alocado:alo,aCaminho:cam,gerado:ger,itens:l.length};
}
/* recalcula um envio da Previsão para uma nova data — só calcula, não altera */
function recalcularEnvioPorData(envioId,novaData){
  const e=envioById(envioId); if(!e) return {ok:false,msg:'Envio não encontrado.'};
  if(!e.medias) return {ok:false,msg:'Este envio não veio da Previsão FULL, então não há média de vendas guardada para recalcular.'};
  const D=Math.max(0,diasEntre(hoje(),novaData));
  const cob=fullCfg().cobertura||30;
  const linhas=[];
  e.itens.forEach(it=>{
    const p=prodById(it.produtoId); if(!p) return;
    const m=e.medias[p.id]; if(!m) { linhas.push({item:it,produto:p,atual:it.solicitado,novo:it.solicitado,dif:0,semMedia:true}); return; }
    const proj=(m.full||0)-m.media*D;
    const bruto=m.media*cob-proj;
    const novo=bruto>0?Math.ceil(bruto):0;
    linhas.push({item:it,produto:p,media:m.media,atual:it.solicitado||0,novo,dif:novo-(it.solicitado||0)});
  });
  return {ok:true,D,cob,linhas,mudou:linhas.filter(l=>l.dif!==0)};
}
function aplicarRecalculo(envioId,novaData){
  const r=recalcularEnvioPorData(envioId,novaData);
  if(!r.ok) return r;
  const e=envioById(envioId);
  let soma=0,sub=0;
  batch('mudança da data do envio '+e.nome+' para '+fmtData(novaData),()=>{
    r.linhas.forEach(l=>{
      if(l.dif===0) return;
      aplicarAjusteItem(e,l.item,l.produto,l.novo);
      if(l.dif>0) soma+=l.dif; else sub+=-l.dif;
    });
    e.data=novaData; e.nome=fmtData(novaData);
  });
  return {ok:true,soma,sub};
}

function gerarInboundPrevisao(){
  const c=fullCfg(), l=fullItensLoja().map(i=>({i,k:fullCalc(i)})).filter(x=>x.k.qtd>0);
  if(!l.length){ alert('Nenhum produto com quantidade a enviar nesta loja.'); return; }
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('A biblioteca de PDF não carregou. Verifique a conexão e recarregue a página.'); return; }
  const {jsPDF}=window.jspdf, ALT=841.89, X_PROD=38, X_QTD=237;
  const doc=new jsPDF({unit:'pt',format:'a4'}), y=v=>ALT-v;
  doc.setFontSize(9);
  doc.text('PRODUTO',X_PROD,y(632)); doc.text('UNIDADES',X_QTD,y(632));
  let py=603;
  l.forEach(({i,k})=>{
    if(py<70){ doc.addPage(); py=754; doc.text('PRODUTO',X_PROD,y(782)); doc.text('UNIDADES',X_QTD,y(782)); }
    const p=fullProduto(i);
    doc.text('Código ML: '+((p&&p.codigo)||i.codigo||'—')+' Código universal: ',X_PROD,y(py));
    doc.text('SKU: '+fullSku(i),X_PROD,y(py-9));
    doc.text(String(fullSku(i)).slice(0,62),X_PROD,y(py-21));
    doc.text(String(k.qtd),X_QTD,y(py+2));
    py-=61;
  });
  const [a,m,d]=c.envio.split('-');
  const nome=d+m+a.slice(2)+' '+c.loja.toUpperCase().replace(/\s+/g,'')+'.pdf';
  const blob=doc.output('blob'), link=document.createElement('a');
  link.href=URL.createObjectURL(blob); link.download=nome; link.click();
  setTimeout(()=>URL.revokeObjectURL(link.href),4000);
  toast('Inbound gerado: '+nome);
}

          ${i.enviado&&envioById(i.enviado.envioId)?` <span class="tagcri" title="Estas ${fmtInt(i.enviado.qtd)} un. já entraram no envio ${esc(i.enviado.envio)}. Para mudar a quantidade, edite lá — assim a reserva e a compra acompanham.">✓ no FULL ${esc(i.enviado.envio)}</span>`:''}</td>
        <td class="num"><span class="det">${fmtInt(k.full)}<span class="i">i</span><span class="pop">
          <span class="ln"><span>Aptas para venda</span><b>${fmtInt(i.aptas)}</b></span>
          <span class="ln"><span>Em transferência</span><b>${fmtInt(i.transf||0)}</b></span>
          ${k.proximosProgramados?`<span class="ln"><span>Próximos programados</span><b>${fmtInt(k.proximosProgramados)}</b></span>`:''}
          <span class="ln tot"><span>Total</span><b>${fmtInt(k.full)}</b></span>
          ${k.proximosProgramados?`<span class="obs">Próximos programados conta na quantidade acima, mas não entra no valor em R$ da coluna Valor — o dinheiro deles já está contado no estoque Local (Reservado). Sai daqui quando você confirmar o envio como FULL, e volta a aparecer em "Aptas"/"Em transferência" assim que o Mercado Livre receber de verdade.</span>`:''}
          <span class="obs">7d ${fmtInt(i.v7)} · 15d ${fmtInt(i.v15)} · 30d ${fmtInt(i.v30)} un. vendidas${i.produtoNome?'<br>'+esc(i.produtoNome):''}${i.codigo?'<br>Código ML: '+esc(i.codigo):''}</span></span></span></td>
        <td class="num">${k.custo?fmtMoney(k.valor):'<span class="pend">sem custo</span>'}</td>
        <td class="num"><span class="det">${k.media.toFixed(2)}${(()=>{const t=tendencia(i); return t?`<span class="tend ${t.sobe?'up':(t.cai?'dn':'eq')}">${t.sobe?'▲':(t.cai?'▼':'=')}</span>`:'';})()}<span class="i">i</span><span class="pop">
          <span class="ln"><span>7d: ${fmtInt(i.v7)} ÷ 7</span><b>${k.r7.toFixed(2)} × ${c.p7}</b></span>
          <span class="ln"><span>15d: ${fmtInt(i.v15)} ÷ 15</span><b>${k.r15.toFixed(2)} × ${c.p15}</b></span>
          <span class="ln"><span>30d: ${fmtInt(i.v30)} ÷ 30</span><b>${k.r30.toFixed(2)} × ${c.p30}</b></span>
          <span class="ln tot"><span>÷ ${soma} (soma dos pesos)</span><b>${k.media.toFixed(2)}</b></span>
          ${(()=>{const t=tendencia(i),m=mediaHistorica(i); let s='';
            if(t) s+=`<span class="ln"><span>Leitura de ${fmtData(t.de)}</span><b>${t.ant.toFixed(2)} (${t.pct>0?'+':''}${t.pct.toFixed(0)}%)</b></span>`;
            if(m&&m.leituras>1) s+=`<span class="ln"><span>Média de ${m.leituras} leituras</span><b>${m.media.toFixed(2)}</b></span>`;
            const h2=histDe(i);
            if(h2.length>1) s+=`<span class="obs">Histórico: ${h2.slice(-6).map(x=>fmtData(x.data).slice(0,5)+' '+x.media.toFixed(1)).join(' · ')}</span>`;
            else s+='<span class="obs">O histórico começa a se formar a partir da segunda leitura do painel.</span>';
            return s;})()}</span></span></td>
        <td class="num">${k.cob===Infinity?'∞':Math.round(k.cob)+' d'}</td>
        <td><span class="det"><input type="number" min="0" class="qty-acao" data-fq="${i.id}" value="${k.qtd}"><span class="pop">
          <span class="ln"><span>Demanda de ${c.cobertura} dias</span><b>${Math.round(k.dem)}</b></span>
          <span class="ln"><span>Estoque FULL hoje</span><b>−${fmtInt(k.full)}</b></span>
          <span class="ln"><span>Consumo em ${k.D} d até o envio</span><b>+${Math.round(k.consumo)}</b></span>
          <span class="ln tot"><span>A enviar</span><b>${fmtInt(k.enviar)}</b></span>
          <span class="obs">O que já está no FULL é descontado; só entra o que falta para fechar ${c.cobertura} dias no dia do envio.${i.ajuste!=null?'<br><b>Você ajustou à mão para '+fmtInt(i.ajuste)+'.</b> Muda a data do envio pra voltar ao cálculo automático.':''}</span></span></span></td>
        <td><button class="btn sm danger-outline" data-fdel="${i.id}" title="Remover da lista">✕</button></td></tr>`;}).join('')}
      </tbody></table></div>`
     :(l.length?`<p class="empty-inline">Nenhum produto precisa de envio nesta data.</p>`
      :`<p class="empty-inline">Nenhum dado desta loja ainda. Use "🤖 Copiar prompt", rode no Cowork e cole o resultado aqui.</p>`)}
  </div>`;

  document.getElementById('fLoja').onchange=e=>{ fullCfg().loja=e.target.value; persist(); };
  document.getElementById('fEnvio').onchange=e=>{
    if(!e.target.value) return;
    snapshot('mudança da data da previsão');
    fullCfg().envio=e.target.value;
    /* muda a data => a sugestão de todo mundo volta a seguir o cálculo automático,
       inclusive quem tinha sido ajustado à mão antes (senão o ajuste antigo fica
       travado com uma data que não é mais a real) */
    state.full.itens.forEach(i=>{ i.ajuste=null; });
    persist();
  };
  const num=(id,campo,min)=>{ const n=document.getElementById(id); if(!n) return; n.onchange=()=>{
    const v=Number(n.value);
    if(isNaN(v)||v<min){ alert('Valor inválido.'); renderPrevisao(); return; }
    snapshot('ajuste de '+campo); fullCfg()[campo]=v;
    if(((fullCfg().p7||0)+(fullCfg().p15||0)+(fullCfg().p30||0))<=0){ toast('Ao menos um peso precisa ser maior que zero.'); fullCfg()[campo]=campo==='p7'?3:(campo==='p15'?2:1); }
    persist(); }; };
  num('fCob','cobertura',1); num('fP7','p7',0); num('fP15','p15',0); num('fP30','p30',0); num('fDiasAlerta','diasAlertaRuptura',1);
  el.querySelectorAll('[data-fq]').forEach(inp=>inp.onchange=()=>{
    const i=state.full.itens.find(x=>x.id===inp.dataset.fq); if(!i) return;
    const v=Math.max(0,parseInt(inp.value)||0);
    snapshot('ajuste da quantidade a enviar');
    i.ajuste = v===fullCalc(i).enviar ? null : v;
    persist();
  });
  el.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=()=>{
    snapshot('remoção de item da previsão');
    state.full.itens=state.full.itens.filter(x=>x.id!==b.dataset.fdel); persist();
  });
  const fs=document.getElementById('fSo'); if(fs) fs.onchange=()=>{ fFiltro.so=fs.checked; renderPrevisao(); };
  const fo=document.getElementById('fOrdem'); if(fo) fo.onchange=()=>{ fFiltro.ordem=fo.value; renderPrevisao(); };
  el.querySelectorAll('[data-fvinc]').forEach(b=>b.onclick=()=>abrirVincular(b.dataset.fvinc));
  el.querySelectorAll('[data-verenvio]').forEach(b=>b.onclick=()=>irParaAba('envio'));
  document.getElementById('fPdf').onclick=gerarInboundPrevisao;
  document.getElementById('fCriar').onclick=abrirCriarFull;
  const be=document.getElementById('fEmergencia'); if(be) be.onclick=abrirCriarFullEmergencia;
}

/* ---------- Ruptura de estoque: todas as lojas de uma vez, comparando com o envio FULL
   já programado de verdade (Envios programados), não com a data manual da Previsão ---------- */
function rupturaLojaLista(loja,diasLimite){
  const prox=proximoEnvioLoja(loja);
  const diasAteEnvio=prox?diasEntre(hoje(),prox.data):null;
  return fullItensLoja(loja).map(i=>({i,k:fullCalc(i),p:fullProduto(i)}))
    .filter(({k})=>k.media>0&&k.cob!==Infinity)
    .map(x=>{
      const cobDias=Math.floor(x.k.cob);
      const zeraAntesDoEnvio=prox!=null&&cobDias<diasAteEnvio;
      const diaZero=new Date(Date.now()+Math.max(0,cobDias)*864e5).toISOString().slice(0,10);
      return {...x,cobDias,zeraAntesDoEnvio,diaZero};
    })
    .filter(x=>x.cobDias<=diasLimite||x.zeraAntesDoEnvio)
    .sort((a,b)=>a.cobDias-b.cobDias)
    .map(x=>({...x,prox,diasAteEnvio}));
}
function renderRuptura(){
  const el=document.getElementById('tab-ruptura'); if(!el) return;
  const diasLimite=fullCfg().diasAlertaRuptura||10;
  const secoes=STORES.map(loja=>{
    const l=rupturaLojaLista(loja,diasLimite);
    const prox=proximoEnvioLoja(loja);
    const antesDoEnvio=l.filter(x=>x.zeraAntesDoEnvio).length;
    return {loja,l,prox,antesDoEnvio};
  });
  const totalRisco=secoes.reduce((a,s)=>a+s.l.length,0);
  const totalAntes=secoes.reduce((a,s)=>a+s.antesDoEnvio,0);
  el.innerHTML=`
  <div class="card">
    <div class="form-grid">
      <label>Avisar ruptura com <small>(dias de antecedência)</small><input id="rDiasAlerta" type="number" min="1" value="${diasLimite}"></label>
    </div>
    <p class="hint">Mostra, por loja, todo SKU que — no ritmo de venda atual — vai zerar no FULL dentro desse prazo, e destaca em vermelho quem vai zerar <b>antes do próximo envio já programado</b> em Envios programados (não a data manual da Previsão). Esse mesmo campo de dias também controla o alerta da Visão Geral.</p>
  </div>
  <div class="cards-linha">
    <div class="card mini ${totalRisco?'alerta':''}"><span class="rot">SKU(s) em risco (todas as lojas)</span><b>${fmtInt(totalRisco)}</b>
      <small>dentro de ${diasLimite} dia(s)</small></div>
    <div class="card mini ${totalAntes?'alerta':''}"><span class="rot">Vão zerar antes do envio programado</span><b>${fmtInt(totalAntes)}</b>
      <small>${totalAntes?'precisam de ação — antecipar ou emergência':'nenhum, com os envios programados de hoje'}</small></div>
  </div>
  ${secoes.map(({loja,l,prox,antesDoEnvio})=>`
    <div class="card">
      <div class="acoes-linha" style="justify-content:space-between;align-items:center">
        <h3 style="margin:0">${esc(loja)}</h3>
        <span class="hint" style="margin:0">${prox?'Próximo envio programado: <b>'+fmtData(prox.data)+'</b> ('+esc(prox.nome)+')':'Nenhum envio programado para esta loja'}</span>
      </div>
      ${!l.length?`<p class="empty-inline">Nenhum SKU em risco de ruptura nesta loja.</p>`:`
      ${antesDoEnvio?`<div class="aviso risco" style="margin-top:10px"><span>🚨</span><span><b>${antesDoEnvio} SKU(s) vão zerar antes do envio programado.</b> Antecipe o envio se der, ou crie um FULL de emergência só com eles.</span>
        <button class="btn sm danger" data-remerg="${esc(loja)}">🚨 FULL de emergência</button></span></div>`:''}
      <div class="table-wrap" style="margin-top:10px"><table class="tbl-produtos"><thead><tr>
        <th>SKU</th><th class="num">Estoque FULL</th><th class="num">Vendas/dia</th><th class="num">Cobertura</th><th>Zera em</th><th></th></tr></thead><tbody>
        ${l.map(({i,k,p,cobDias,zeraAntesDoEnvio,diaZero})=>`<tr>
          <td class="mono">${esc(fullSku(i))}</td>
          <td class="num">${fmtInt(k.full)}</td>
          <td class="num">${k.media.toFixed(2)}</td>
          <td class="num">${cobDias} d</td>
          <td>${zeraAntesDoEnvio?`<span class="pend">${fmtData(diaZero)} — antes do envio</span>`:fmtData(diaZero)}</td>
          <td><button class="btn sm" data-rver="${loja}" title="Ver e ajustar na Previsão de reposição">Ver na Previsão</button></td>
        </tr>`).join('')}
      </tbody></table></div>`}
    </div>`).join('')}`;
  const rd=document.getElementById('rDiasAlerta'); if(rd) rd.onchange=()=>{
    const v=Number(rd.value);
    if(isNaN(v)||v<1){ alert('Valor inválido.'); renderRuptura(); return; }
    snapshot('ajuste de dias de alerta de ruptura'); fullCfg().diasAlertaRuptura=v; persist();
  };
  el.querySelectorAll('[data-rver]').forEach(b=>b.onclick=()=>{ fullCfg().loja=b.dataset.rver; persist(); irParaAba('previsao'); });
  el.querySelectorAll('[data-remerg]').forEach(b=>b.onclick=()=>{ fullCfg().loja=b.dataset.remerg; persist(); abrirCriarFullEmergencia(); });
}

/* ---------- render ---------- */
function renderAll(){
  /* cada seção isolada: se uma falhar, as outras continuam atualizando */
  [['bloqueio',renderBloqueio],['avisos',renderAvisos],['tarefas',renderTarefas],['onboarding',renderOnboard],['visão geral',renderDashboard],
   ['produtos',renderProdutos],['comprar',renderComprar],['coletar',renderColetar],['notas fiscais',renderNotasFiscais],['ads',renderAds],
   ['previsão FULL',renderPrevisao],['envios',renderEnvio],['ruptura',renderRuptura],['barra',updateFileStatus],['menu',atualizarBadgeTarefas]
  ].forEach(([nome,fn])=>{
    try{ fn(); }catch(err){ console.error('Erro ao renderizar '+nome,err); toast('⚠ Erro ao atualizar a aba '+nome+'. Recarregue a página.'); }
  });
}

/* ---------- init ---------- */
function irParaSub(nome){
  document.querySelectorAll('#subFull button').forEach(x=>x.setAttribute('aria-selected',x.dataset.sub===nome?'true':'false'));
  ['previsao','envio','ruptura'].forEach(n=>{ const p=document.getElementById('tab-'+n); if(p) p.classList.toggle('hidden',n!==nome); });
}
function irParaAba(nome){
  /* previsão, envios e ruptura moram na mesma aba FULL */
  let sub=null;
  if(nome==='previsao'||nome==='envio'||nome==='ruptura'){ sub=nome; nome='full'; }
  const b=document.querySelector('#mainNav button[data-tab='+nome+']'); if(!b) return;
  document.querySelectorAll('#mainNav button').forEach(x=>x.setAttribute('aria-selected','false'));
  b.setAttribute('aria-selected','true');
  document.querySelectorAll('.tabpanel').forEach(p=>p.classList.add('hidden'));
  const p=document.getElementById('tab-'+nome); if(p) p.classList.remove('hidden');
  if(sub) irParaSub(sub);
  try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){}
}
document.querySelectorAll('#mainNav button').forEach(b=>{ b.onclick=()=>irParaAba(b.dataset.tab); });
document.querySelectorAll('#subFull button').forEach(b=>{ b.onclick=()=>irParaSub(b.dataset.sub); });
document.getElementById('btnArquivo').onclick=menuArquivo;
document.getElementById('btnBackup').onclick=baixarBackup;
document.getElementById('btnDesfazer').onclick=desfazer;
document.getElementById('confirmYes').onclick=()=>{
  document.getElementById('confirmOverlay').classList.add('hidden');
  if(pendingConfirm) pendingConfirm();
  pendingConfirm=null;
};
document.getElementById('confirmNo').onclick=()=>{ document.getElementById('confirmOverlay').classList.add('hidden'); pendingConfirm=null; };
document.getElementById('modalOverlay').addEventListener('click',e=>{ if(e.target.id==='modalOverlay') closeModal(); });
/* os iconezinhos "i" (.det .i) mostram detalhe no hover, mas isso depende de ter espaço na
   tela — perto do topo, do rodapé ou dentro de listas com rolagem, o balão pode ficar cortado
   ou preso na área visível. Clicar no ícone abre o mesmo conteúdo numa janela normal (o modal
   que já existe no resto do Doca), que sempre aparece inteira, não importa onde a linha esteja. */
document.addEventListener('click',e=>{
  const i=e.target.closest('.det .i'); if(!i) return;
  const pop=i.nextElementSibling; if(!pop||!pop.classList.contains('pop')) return;
  const body=openModal(true);
  body.innerHTML=`<h3>Detalhe</h3><div class="det" style="display:block"><span class="pop" style="position:static;opacity:1;pointer-events:auto;transform:none;box-shadow:none;border:0;padding:0;display:block;min-width:0;background:transparent">${pop.innerHTML}</span></div><div class="modal-acoes"><button class="btn" id="btnFecharDet">Fechar</button></div>`;
  document.getElementById('btnFecharDet').onclick=closeModal;
});
document.getElementById('confirmOverlay').addEventListener('click',e=>{ if(e.target.id==='confirmOverlay'){ document.getElementById('confirmOverlay').classList.add('hidden'); pendingConfirm=null; } });

/* grava pendências ao sair ou trocar de aba.
   Só avisa/força gravação se houver arquivo/pasta conectado — sem isso os dados já
   estão salvos no cache deste navegador (localStorage) e não há nada "pendente" de verdade. */
function flushEdicaoAtual(){
  const a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&typeof a.blur==='function') a.blur();
}
window.addEventListener('visibilitychange',()=>{
  flushEdicaoAtual();
  if(document.visibilityState==='hidden'&&alteracaoLocal&&fileHandle) saveToFile();
});
window.addEventListener('beforeunload',e=>{
  flushEdicaoAtual();
  if(alteracaoLocal&&fileHandle){ saveToFile(); e.preventDefault(); e.returnValue=''; }
});

loadFromLocalStorage();
renderBloqueio();   /* trava a tela imediatamente, antes de tudo */
renderAll();
tentarReconectar();

/* sincroniza com o Mercado Livre sozinho assim que o Doca abre, se o backend já estiver
   configurado — não precisa clicar em nada nem dar F5. Passa por TODAS as lojas (STORES),
   uma de cada vez (não em paralelo, pra não sobrecarregar o backend/servidor gratuito),
   aplicando automaticamente o que já está vinculado por SKU/mlItemId. Roda em segundo
   plano; se uma loja falhar (não autorizada, servidor dormindo, sem internet etc.) segue
   pras próximas sem travar o resto do app — cada loja fica só com os dados de quando
   funcionou por último. */
(async function sincronizarMlAoAbrir(){
  if(!backendUrl()) return;
  for(const loja of STORES){
    try{
      const resultado=await mlSincronizarLoja(loja);
      aplicarSincronizacaoAutomatica(resultado);
    }catch(e){
      console.error(`Sincronização automática com o Mercado Livre falhou ao abrir o Doca (loja ${loja}):`,e.message);
    }
    try{
      aplicarSincronizacaoFinanceira(loja,await mpSincronizarFinanceiro(loja));
    }catch(e){
      console.error(`Sincronização automática do financeiro (Mercado Pago) falhou ao abrir o Doca (loja ${loja}):`,e.message);
    }
  }
})();
</script>
