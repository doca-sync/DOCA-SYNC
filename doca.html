   está definido junto com a tela, mais abaixo, num só lugar) ---------- */
function tarefaById(id){ return state.tarefas.find(t=>t.id===id); }
/* leva a tarefa para outra lista, mantendo ela no topo da lista de destino */
function moverTarefaParaLista(tarefaId,listaId){
  const t=state.tarefas.find(x=>x.id===tarefaId); if(!t) return {ok:false};
  const l=state.listas.find(x=>x.id===listaId); if(!l) return {ok:false};
  if(t.listaId===listaId) return {ok:false,mesma:true};
  const nomeAntigo=(state.listas.find(x=>x.id===t.listaId)||{}).nome||'';
  snapshot('mover tarefa para '+l.nome);
  const i=state.tarefas.indexOf(t);
  state.tarefas.splice(i,1);
  t.listaId=listaId;
  const prim=state.tarefas.findIndex(x=>x.listaId===listaId);
  if(prim<0) state.tarefas.push(t); else state.tarefas.splice(prim,0,t);
  persist();
  return {ok:true,tarefa:t,de:nomeAntigo,para:l.nome};
}
/* reordena as listas arrastando os chips */
function reordenarListas(id,paraId){
  if(id===paraId) return false;
  const de=state.listas.findIndex(l=>l.id===id), para=state.listas.findIndex(l=>l.id===paraId);
  if(de<0||para<0) return false;
  snapshot('reordenação das listas');
  const [l]=state.listas.splice(de,1);
  state.listas.splice(para,0,l);
  persist();
  return true;
}

/* ---------- envios FULL ---------- */
function criarEnvio(nome,data,loja,arquivo,localColeta){
  const e={id:gerarId('e'),nome,data,loja,arquivo:arquivo||'',localColeta:localColeta||LOCAIS_COLETA[0],itens:[],criadoEm:Date.now()};
  state.envios.push(e); return e;
}
function editarEnvio(id,patch){
  const e=envioById(id); if(!e) return;
  snapshot('edição do envio '+e.nome);
  Object.assign(e,patch);
  const marca='FULL '+(e.nome||'')+(e.loja?' · '+e.loja:'');
  state.produtos.forEach(p=>(p.pedidos||[]).forEach(c=>{ if(c.envioId===id) c.origem=marca; }));
  persist();
}
/* Reserva o que está no galpão (Local) e o que já foi comprado e está por coletar.
   O Coletar NÃO é descontado — o motorista continua vendo tudo que precisa buscar. */
function alocarNoEnvio(envio,produto,solicitado){
  const marcaEnvio='FULL '+(envio.nome||'')+(envio.loja?' · '+envio.loja:'');
  const aloc=Math.min(solicitado,produto.qtd.local);
  produto.qtd.local-=aloc;
  let falta=solicitado-aloc;
  const resCol=Math.min(falta,coletarLivre(produto));
  falta-=resCol;
  const gerado=falta;
  if(gerado>0){
    if(!produto.pedidos) produto.pedidos=[];
    produto.pedidos.push({...novoPedido(gerado),origem:marcaEnvio,envioId:envio.id});
    sincronizarPedidos(produto);
  }
  envio.itens.push({id:gerarId('it'),produtoId:produto.id,solicitado,alocado:aloc,reservadoColeta:resCol,geradoCompra:gerado});
  produto.atualizadoEm=Date.now();
  return {alocado:aloc,aCaminho:resCol,gerado};
}
/* puxa para a reserva o que estiver sobrando no Local */
function alocarPendentes(envioId){
  const e=envioById(envioId); if(!e) return 0;
  snapshot('alocar estoque no envio '+e.nome);
  let total=0;
  e.itens.forEach(i=>{
    const p=prodById(i.produtoId); if(!p) return;
    const falta=(i.solicitado||0)-(i.alocado||0)-(i.reservadoColeta||0)-(i.geradoCompra||0);
    const alvo=Math.max(falta,0)+ (i.geradoCompra||0);
    const dl=Math.min(alvo,p.qtd.local);
    if(dl<=0) return;
    p.qtd.local-=dl; i.alocado+=dl; total+=dl;
    i.geradoCompra=Math.max(0,(i.geradoCompra||0)-dl);
  });
  persist(); return total;
}
/* tira a quantidade dos pedidos gerados por ESTE envio; só depois recorre aos demais */
function removerCompraDoEnvio(p,envioId,qtd){
  if(!p.pedidos) p.pedidos=[];
  let rest=qtd;
  for(let i=p.pedidos.length-1;i>=0&&rest>0;i--){
    if(p.pedidos[i].envioId!==envioId) continue;
    const t=Math.min(rest,p.pedidos[i].qtd);
    p.pedidos[i].qtd-=t; rest-=t;
    if(p.pedidos[i].qtd<=0) p.pedidos.splice(i,1);
  }
  for(let i=p.pedidos.length-1;i>=0&&rest>0;i--){
    const t=Math.min(rest,p.pedidos[i].qtd);
    p.pedidos[i].qtd-=t; rest-=t;
    if(p.pedidos[i].qtd<=0) p.pedidos.splice(i,1);
  }
  sincronizarPedidos(p);
}
function reverterItem(item,envioId){
  const p=prodById(item.produtoId); if(!p) return;
  p.qtd.local+=(item.alocado||0);
  if(item.geradoCompra>0) removerCompraDoEnvio(p,envioId,item.geradoCompra);
  p.atualizadoEm=Date.now();
}
function cancelarEnvio(envioId){
  const e=envioById(envioId); if(!e) return;
  snapshot('cancelamento do envio '+e.nome);
  e.itens.forEach(i=>reverterItem(i,e.id));
  state.envios=state.envios.filter(x=>x.id!==envioId);
  persist();
}
function removerItemEnvio(envioId,itemId){
  const e=envioById(envioId); if(!e) return;
  const it=e.itens.find(i=>i.id===itemId); if(!it) return;
  const p=prodById(it.produtoId);
  snapshot('remoção de '+(p?p.sku:'item')+' do envio '+e.nome);
  reverterItem(it,envioId);
  e.itens=e.itens.filter(i=>i.id!==itemId);
  persist();
}
/* reduz o envio ao que já está etiquetado no galpão, liberando o que faltava */
function ajustarEnvioParaPronto(envioId){
  const e=envioById(envioId); if(!e) return 0;
  snapshot('ajuste do envio '+e.nome+' para o que está pronto');
  let liberado=0;
  e.itens.forEach(i=>{
    const p=prodById(i.produtoId);
    const pend=(i.solicitado||0)-(i.alocado||0);
    if(pend<=0) return;
    liberado+=pend;
    if(p&&i.geradoCompra>0) removerCompraDoEnvio(p,e.id,i.geradoCompra);
    i.reservadoColeta=0; i.geradoCompra=0; i.solicitado=i.alocado;
  });
  e.itens=e.itens.filter(i=>(i.solicitado||0)>0);
  persist();
  return liberado;
}
function confirmarEnvioFull(envioId,manterCompra){
  const e=envioById(envioId); if(!e) return;
  snapshot('confirmação do envio '+e.nome);
  if(!manterCompra) e.itens.forEach(i=>{ const p=prodById(i.produtoId); if(p&&i.geradoCompra>0) removerCompraDoEnvio(p,e.id,i.geradoCompra); });
  /* confirmar só tira o envio da programação (ele já não conta mais como "Próximos
     programados" na Previsão) — não tenta mais adivinhar um estado intermediário de "a
     caminho do Full" localmente. Assim que a mercadoria chegar de verdade, a próxima
     sincronização com o Mercado Livre mostra ela em "Aptas"/"Em transferência", que já é
     dado real direto da API — sem número congelado no meio do caminho. */
  const somado=[];
  e.itens.forEach(i=>{
    const p=prodById(i.produtoId); if(!p||!(i.solicitado>0)) return;
    const fi=state.full.itens.find(x=>x.loja===e.loja&&fullProduto(x)&&fullProduto(x).id===p.id);
    if(fi) fi.ajuste=null;
    somado.push(p.sku);
    flashFull[p.id]=Date.now();
  });
  state.envios=state.envios.filter(x=>x.id!==envioId);
  persist();
  if(somado.length) toast(somado.length+' SKU(s) confirmados como FULL. Assim que o Mercado Livre receber, a próxima sincronização atualiza sozinha.');
  /* tira o realce depois de alguns segundos e re-renderiza só pra limpar a classe */
  setTimeout(()=>{ flashFull={}; renderPrevisao(); },2600);
}

let arrastando=null,arrastandoLista=null;

/* avança uma data ISO em 1 mês, ajustando pro último dia quando o mês novo é mais curto */
function proximoMes(iso){
  if(!iso) return '';
  const [a,m,d]=iso.split('-').map(Number);
  let novoM=m+1, novoA=a;
  if(novoM>12){ novoM=1; novoA++; }
  const ultimoDia=new Date(novoA,novoM,0).getDate();
  const novoD=Math.min(d,ultimoDia);
  return novoA+'-'+String(novoM).padStart(2,'0')+'-'+String(novoD).padStart(2,'0');
}

      if(arrastandoLista&&arrastandoLista!==ch.dataset.lista){ ev.preventDefault(); ch.classList.add('alvo-chip'); }

    };
  });

function finLoja(loja){
  if(!state.financeiro) state.financeiro={};
  if(!state.financeiro[loja]) state.financeiro[loja]={mercadoPago:0,aReceber:0};
  return state.financeiro[loja];
}
function atualizarFinanceiro(loja,patch){
  const f=finLoja(loja);
  snapshot('ajuste financeiro de '+loja);
  if(patch.mercadoPago!==undefined){ f.mercadoPago=Math.max(0,parseMoeda(patch.mercadoPago)); }
  if(patch.aReceber!==undefined){ f.aReceber=Math.max(0,parseMoeda(patch.aReceber)); }
  persist();
}

/* ---------- produtos ---------- */
function mlSyncCfg(){ return state.mlSync.cfg; }
/* URL do backend: se não foi digitada em Produtos → Atualizar, e o próprio Doca está sendo
   aberto direto do backend (ex.: https://doca-sync.onrender.com/doca, o caso do celular), usa
   o endereço da própria página como padrão — não precisa configurar nada à mão nesse caso. */
function backendUrl(){
  const configurada=(mlSyncCfg().baseUrl||'').trim().replace(/\/+$/,'');
  if(configurada) return configurada;
  if(location.protocol==='http:'||location.protocol==='https:') return location.origin;
  return '';
}

function statusMlLabel(s){
  const mapa={active:'Ativo',paused:'Pausado',closed:'Encerrado',under_review:'Em revisão',inactive:'Inativo',payment_required:'Aguardando pagamento'};
  return mapa[s]||(s||'—');
}
/* só mostra algo quando tem concorrência real na página do catálogo (empatando ou perdendo) —
   "ganhando"/"listado" não indicam a presença de outro vendedor de forma confiável, então ficam mudos */
function concorrenciaLabel(s){
  if(s==='losing') return 'Perdendo no catálogo';
  if(s==='sharing_first') return 'Empatando no catálogo';
  return null;
}

/* alimenta automaticamente a mesma lista usada pelo card "No FULL" da Visão Geral (state.full.itens)
   com o que vem da API do Mercado Livre: quantidade "aptas", vendas 7/15/30d (a Previsão de
   reposição e a média ponderada passam a usar isso, igual usariam uma leitura manual do
   painel) e a transferência real entre depósitos do Full.
   O cálculo do "No Full" é sempre aptas+transf, os dois direto da API — nada inferido/guardado
   localmente. O campo "Entrada pendente" (que tentava adivinhar o que já foi confirmado como
   FULL no Doca mas a API ainda não mostrou) foi removido: não tinha fonte confiável (Mercado
   Livre não expõe isso por API) e criava número congelado/errado sempre que algo mudava fora
   do Doca. Pra planejar o próximo envio, o que interessa é "Próximos programados" (envios já
   criados no Doca e ainda não confirmados como FULL — ver entradaPendenteDe/fullCalc), que é
   um dado 100% real, mantido pelo próprio Doca. Assim que um envio é confirmado como FULL, ele
   sai da programação e some do cálculo até a próxima sincronização mostrar ele em aptas/transf
   de verdade — sem precisar adivinhar o estado intermediário. */
function mlAtualizarFullDoSinc(p,item,loja){
  let fi=state.full.itens.find(x=>x.loja===loja&&fullProduto(x)&&fullProduto(x).id===p.id);
  if(!fi){
    fi={id:gerarId('fi'),loja,sku:p.sku,codigo:p.codigo||'',produtoId:p.id,
      v7:0,v15:0,v30:0,aptas:0,aCaminho:0,transf:0,mediaFixa:null,ajuste:null,movido:null};
    state.full.itens.push(fi);
  }
  const transferido=(typeof item.transferencia_full==='number')?item.transferencia_full:0;
  fi.aptas=item.quantidade_disponivel||0;
  fi.v7=(typeof item.vendas_7d==='number')?item.vendas_7d:(fi.v7||0);
  fi.v15=(typeof item.vendas_15d==='number')?item.vendas_15d:(fi.v15||0);
  fi.v30=(typeof item.vendas_30d==='number')?item.vendas_30d:(fi.v30||0);
  fi.transf=transferido;
  fi.aCaminho=transferido;
  fi.aCaminhoFonte='api';
  fi.confirmadoNaoVerificado=0;
  fi.movido=null;
  state.full.lidoEm[loja]=Date.now();
}

/* chama o backend hospedado: primeiro manda sincronizar (POST /sync), depois busca o resultado (GET /data) */
async function mlSincronizarLoja(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro (ex: https://doca-sync.onrender.com).');
  const rSync=await fetch(`${base}/sync?loja=${encodeURIComponent(loja)}`,{method:'POST'});
  let jSync; try{ jSync=await rSync.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+rSync.status+'). Confira a URL.'); }
  if(!rSync.ok||!jSync.ok) throw new Error(jSync.erro||('Falha ao sincronizar (status '+rSync.status+').'));
  const rData=await fetch(`${base}/data?loja=${encodeURIComponent(loja)}`);
  let jData; try{ jData=await rData.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado ao buscar os dados.'); }
  if(!rData.ok||!jData.ok) throw new Error(jData.erro||'Falha ao buscar os dados sincronizados.');
  return jData;
}
/* sincroniza o financeiro (saldo Mercado Pago + a receber) de 1 loja com o backend. Os
   relatórios do Mercado Pago são assíncronos (pedem minutos pra ficar prontos), então cada
   chamada tenta TERMINAR o pedido anterior e/ou começar um novo — o valor só troca de verdade
   quando um pedido anterior finalmente fica pronto, por isso guarda sempre o "atualizado em"
   junto (ver aplicarSincronizacaoFinanceira). Se a loja não tem token do Mercado Pago
   configurado no backend, o retorno vem com configurado:false e essa loja simplesmente
   continua com os campos manuais — não é erro. */
async function mpSincronizarFinanceiro(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro.');
  const r=await fetch(`${base}/financeiro/mp/sincronizar?loja=${encodeURIComponent(loja)}`,{method:'POST'});
  let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado ao sincronizar o financeiro.'); }
  if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao sincronizar o financeiro (status '+r.status+').'));
  return j;
}
/* aplica o resultado de mpSincronizarFinanceiro no state — só sobrescreve o número quando o
   backend realmente tem um valor lido (saldoDisponivel/aReceber não nulos); enquanto o
   primeiro relatório ainda não processou, mantém o que já estava (0 ou o que foi digitado
   manualmente antes de ligar a automação) e só liga a marcação de "automático". */
function aplicarSincronizacaoFinanceira(loja,j){
  if(!j||!j.configurado) return;
  const f=finLoja(loja);
  f.mpAutomatico=true;
  /* Number(...) aqui é proposital: o backend pode devolver esses valores como texto
     (coluna "numeric" do Postgres vira string), e "3310"+"2716.3" em JS gruda os dígitos
     em vez de somar, gerando um patrimônio absurdo. Nunca confiar que a API manda number. */
  if(j.saldoDisponivel!=null){ f.mercadoPago=Number(j.saldoDisponivel)||0; f.mpAtualizadoEm=j.saldoAtualizadoEm||null; }
  if(j.aReceber!=null){ f.aReceber=Number(j.aReceber)||0; f.aReceberAtualizadoEm=j.aReceberAtualizadoEm||null; }
  persist();
}

/* aplica os dados de 1 anúncio sincronizado no SKU do Doca que já está vinculado a ele —
   usado tanto no vínculo automático (por mlItemId/SKU) quanto no manual e na importação,
   pra não ter a mesma lista de campos copiada em 3 lugares */
function aplicarItemSincronizado(p,item,loja){
  p.mlItemId=item.ml_item_id;
  p.mlQtdDisponivel=item.quantidade_disponivel;
  p.mlAtualizadoEm=item.atualizado_em;
  p.mlStatus=item.status||null;
  p.mlCatalogo=!!item.catalog_listing;
  p.mlConcorrenciaStatus=item.concorrencia_status||null;
  p.mlConcorrenciaPreco=(typeof item.concorrencia_preco==='number')?item.concorrencia_preco:null;
  p.mlPerguntas=item.perguntas_sem_resposta||0;
  p.mlTransferencia=(typeof item.transferencia_full==='number')?item.transferencia_full:null;
  mlAtualizarFullDoSinc(p,item,loja);
}

/* cadastra no Doca, sozinho, um anúncio do ML que ainda não tem SKU correspondente — usa o
   SKU do próprio anúncio (ou o ID do anúncio, se não tiver SKU) como SKU do Doca e o título
   do anúncio como Código, com custo/fornecedor em branco pra completar depois. Se por acaso já
   existir um produto com esse SKU nessa loja (corrida entre duas sincronizações, por ex.),
   reaproveita em vez de duplicar. */
function importarProdutoAutomatico(item,loja){
  const skuGerado=(item.sku||item.ml_item_id).toUpperCase();
  let p=state.produtos.find(x=>x.loja===loja&&(x.sku||'').toUpperCase()===skuGerado);
  if(!p){
    p=addProduto({loja,sku:skuGerado,codigo:item.titulo||'',fornecedor:'',custo:0,estoqueMinimo:0,
      qtd:{comprar:0,coletar:0,local:0},lotes:[],pedidos:[],obsCompra:'Importado automaticamente do Mercado Livre.'});
  }
  aplicarItemSincronizado(p,item,loja);
  return p;
}

/* casa cada anúncio do resultado com o SKU certo (por mlItemId salvo, ou por SKU quando bate);
   o que não bater com nada é cadastrado sozinho no Doca (ver importarProdutoAutomatico) — não
   precisa importar manualmente cada anúncio novo. Usado tanto pelo modal quanto pela
   sincronização automática ao abrir o Doca. */
function aplicarSincronizacaoAutomatica(resultado){
  const produtosDaLoja=state.produtos.filter(p=>p.loja===resultado.loja);
  let vinculados=0,importados=0;
  resultado.produtos.forEach(item=>{
    let p=produtosDaLoja.find(x=>x.mlItemId===item.ml_item_id);
    if(!p&&item.sku) p=produtosDaLoja.find(x=>!x.mlItemId&&x.sku&&x.sku.toLowerCase()===item.sku.toLowerCase());
    if(p){ aplicarItemSincronizado(p,item,resultado.loja); vinculados++; }
    else { p=importarProdutoAutomatico(item,resultado.loja); produtosDaLoja.push(p); importados++; }
  });
  if(vinculados>0||importados>0) persist();
  return {vinculados,importados};
}

/* modal com o botão Atualizar: sincroniza com o backend e mostra os anúncios do Mercado Livre
   comparados com o cadastro do Doca (vínculo por mlItemId salvo, ou por SKU quando bate) */
function abrirSincronizacaoML(){
  const c=mlSyncCfg();
  const body=openModal(true);
  let ultimoResultadoMl=null;
  let render=(resultado,erro)=>{
    let linhasHtml='';
    if(resultado){
      const produtosDaLoja=state.produtos.filter(p=>p.loja===resultado.loja);
      let mudouAlgo=false;
      linhasHtml=resultado.produtos.map(item=>{
        let p=produtosDaLoja.find(x=>x.mlItemId===item.ml_item_id);
        if(!p&&item.sku) p=produtosDaLoja.find(x=>!x.mlItemId&&x.sku&&x.sku.toLowerCase()===item.sku.toLowerCase());
        let importadoAgora=false;
        if(p){ aplicarItemSincronizado(p,item,resultado.loja); }
        else { p=importarProdutoAutomatico(item,resultado.loja); produtosDaLoja.push(p); importadoAgora=true; }
        mudouAlgo=true;
        return `<tr>
          <td>${esc(item.titulo)}</td>
          <td class="mono">${esc(item.sku)||'<span class="muted">—</span>'}</td>
          <td class="num">${fmtInt(item.quantidade_disponivel)}</td>
          <td>${statusMlLabel(item.status)}${item.catalog_listing?' <span title="Vinculado ao catálogo do Mercado Livre">📚</span>':''}${concorrenciaLabel(item.concorrencia_status)?` <span title="${esc(concorrenciaLabel(item.concorrencia_status))}${(typeof item.concorrencia_preco==='number')?' · Concorrente: '+fmtMoney(item.concorrencia_preco):''}">⚔</span>`:''}</td>
          <td><span class="okv">✓ ${esc(p.sku)} (${esc(p.loja)})</span>${importadoAgora?` <span class="pend" title="Cadastro criado automaticamente pela sincronização — confira/edite custo e fornecedor na aba Produtos">🆕 novo SKU</span>`:''}<br><span class="muted" style="font-size:11px">Disponível no Doca: ${fmtInt(disponivel(p))}</span></td>
        </tr>`;
      }).join('');
      if(mudouAlgo) persist();
    }
    body.innerHTML=`<h3>🔄 Sincronizar com o Mercado Livre</h3>
      <p class="hint">Isso chama o backend que você hospedou (fora do Doca) pra buscar os anúncios e o estoque publicado de <b>todas as lojas</b> de uma vez. A loja escolhida abaixo é só pra ver a tabela de comparação aqui na tela — as outras são atualizadas em segundo plano, sem precisar abrir uma a uma. Anúncio que já bate com um SKU do Doca (por vínculo salvo ou pelo SKU) só atualiza os dados; anúncio novo é <b>cadastrado sozinho</b> no Doca (SKU e título do próprio anúncio, custo/fornecedor em branco pra completar depois em Produtos) — não precisa importar manualmente.</p>
      <div class="form-grid" style="grid-template-columns:2fr 1fr">
        <label>URL do backend<input id="mlBaseUrl" type="text" placeholder="${esc(backendUrl()||'https://doca-sync.onrender.com')}" value="${esc(c.baseUrl)}"></label>
        <label>Loja (visualização)<select id="mlLoja">${optsLojas(c.loja)}</select></label>
      </div>
      ${!c.baseUrl&&backendUrl()?`<p class="hint" style="margin-top:6px">Detectado automaticamente: <b class="mono">${esc(backendUrl())}</b> (o próprio endereço deste Doca). Só preencha o campo acima se quiser usar outro.</p>`:''}
      <div class="acoes-linha" style="margin-top:10px">
        <button class="btn gold" id="btnMlAtualizar">🔄 Atualizar todas as lojas</button>
        <span id="mlStatus" style="font-size:12.5px;color:var(--muted)"></span>
      </div>
      ${erro?`<p class="aviso" style="margin-top:12px">⚠ ${esc(erro)}</p>`:''}
      ${resultado?`
        <p class="hint" style="margin-top:12px">${resultado.autorizado?'Loja autorizada.':'⚠ Essa loja ainda não foi autorizada no backend (rode o /oauth/login primeiro).'} ${resultado.ultimaAtualizacao?'Última sincronização: '+new Date(resultado.ultimaAtualizacao).toLocaleString('pt-BR'):''}</p>
        <div class="table-wrap"><table class="tbl-produtos"><thead><tr><th>Anúncio</th><th>SKU (ML)</th><th class="num">Disponível (ML)</th><th>Status</th><th>Vínculo com o Doca</th></tr></thead>
        <tbody>${linhasHtml||`<tr><td colspan="5" class="empty">Nenhum anúncio encontrado.</td></tr>`}</tbody></table></div>
      `:''}
      <div class="modal-acoes"><button class="btn" id="btnMlFechar">Fechar</button></div>`;
    document.getElementById('btnMlFechar').onclick=closeModal;
    document.getElementById('mlBaseUrl').onchange=e=>{ c.baseUrl=e.target.value.trim(); persist(); };
    document.getElementById('mlLoja').onchange=e=>{ c.loja=e.target.value; persist(); render(ultimoResultadoMl&&ultimoResultadoMl.loja===c.loja?ultimoResultadoMl:null,null); };
    /* clicar em "Atualizar" sincroniza TODAS as lojas de STORES, uma de cada vez — as outras
       (diferentes da selecionada no dropdown) são aplicadas em segundo plano, direto, sem
       mostrar tabela; a loja selecionada é sincronizada por último e mostra a tabela completa
       de comparação/vínculo, porque é a única que faz sentido revisar visualmente aqui. */
    document.getElementById('btnMlAtualizar').onclick=async()=>{
      c.baseUrl=document.getElementById('mlBaseUrl').value.trim();
      c.loja=document.getElementById('mlLoja').value;
      persist();
      const st=document.getElementById('mlStatus'); const btn=document.getElementById('btnMlAtualizar');
      btn.disabled=true;
      const outras=STORES.filter(l=>l!==c.loja);
      const falhas=[];
      for(let i=0;i<outras.length;i++){
        st.textContent=`Sincronizando ${outras[i]}... (${i+1}/${outras.length+1})`;
        try{ aplicarSincronizacaoAutomatica(await mlSincronizarLoja(outras[i])); }
        catch(e){ falhas.push(outras[i]); }
        try{ aplicarSincronizacaoFinanceira(outras[i],await mpSincronizarFinanceiro(outras[i])); }catch(e){}
      }
      st.textContent=`Sincronizando ${c.loja}... (${outras.length+1}/${outras.length+1}) — pode levar até 1 minuto se o servidor estava dormindo.`;
      try{
        const resultado=await mlSincronizarLoja(c.loja);
        ultimoResultadoMl=resultado;
        try{ aplicarSincronizacaoFinanceira(c.loja,await mpSincronizarFinanceiro(c.loja)); }catch(e){}
        render(resultado,null);
        toast('Todas as lojas sincronizadas'+(falhas.length?` (falhou: ${falhas.join(', ')})`:'')+'.');
      }catch(e){
        render(null,e.message);
      }
      btn.disabled=false;
    };
  };
  const renderOrig=render;
  render=(r,e)=>{ if(r) ultimoResultadoMl=r; renderOrig(r,e); };
  render(null,null);
  /* se a URL do backend já está salva, dispara a sincronização direto ao abrir —
     não precisa clicar duas vezes (uma pra abrir, outra pra atualizar) */
  if(backendUrl()) document.getElementById('btnMlAtualizar').onclick();
}

function renderProdutos(){
  const el=document.getElementById('tab-produtos');
  const filtrados=state.produtos.filter(p=>{
    if(filtro.loja!=='todas'&&p.loja!==filtro.loja) return false;
    if(filtro.busca){ const q=filtro.busca.toLowerCase();
      if(!((p.sku||'').toLowerCase().includes(q)||(p.codigo||'').toLowerCase().includes(q)||(p.fornecedor||'').toLowerCase().includes(q))) return false; }
    return true;
  });
  /* sempre ranqueado por curva de vendas (maior média diária primeiro) — sem opção de trocar,
     é o que mais importa pra decidir prioridade de reposição/atenção. */
  const lista=[...filtrados].sort((a,b)=>{
    const ma=mediaVendasDiaria(a)||0, mb=mediaVendasDiaria(b)||0;
    return mb-ma||a.loja.localeCompare(b.loja)||a.sku.localeCompare(b.sku);
  });

    <h1 class="page-title">Produtos</h1>
    <div class="toolbar-produtos">
      <select id="filtroLoja"><option value="todas" ${filtro.loja==='todas'?'selected':''}>Todas as lojas</option>${optsLojas(filtro.loja==='todas'?null:filtro.loja)}</select>
      <input id="filtroBusca" class="grow" type="text" placeholder="Buscar por SKU, código ou fornecedor..." value="${esc(filtro.busca)}">
      <button class="btn" id="btnConferencia">🖨 Conferência de estoque</button>
      <button class="btn" id="btnSyncML">🔄 Atualizar (Mercado Livre)</button>
      <button class="btn gold" id="btnNovoSku">+ Novo SKU</button>
    </div>
    <div class="table-wrap"><table class="tbl-produtos">
      <thead><tr><th>Loja</th><th title="Passe o mouse sobre o SKU pra ver código do produto e fornecedor">SKU</th><th>Custo</th>
      <th>Vendas/dia</th>
      <th>Comprar</th><th>Coletar</th><th>Local</th><th>Reservado</th><th>Disponível*</th><th title="Vem do botão Atualizar (Mercado Livre)">Aptas Full</th><th title="Em transferência (API) + próximos programados (Doca). Passe o mouse pra ver o detalhe">A Caminho</th><th>Valor estoque</th><th></th></tr></thead>
      <tbody>${lista.length?lista.map(p=>{
        const m=mediaVendasDiaria(p);
        const dicaSku=(p.codigo||'')+(p.fornecedor?' · Fornecedor: '+p.fornecedor:'');
        const fi=fullItemDeProduto(p), fk=fi?fullCalc(fi):null;
        return `
        <tr class="${estoqueBaixo(p)?'row-baixo':''}">
          <td><span class="loja-tag">${esc(p.loja)}</span></td>
          <td class="mono" title="${esc(dicaSku)}">${esc(p.sku)}${estoqueBaixo(p)?' <span title="Estoque abaixo do mínimo">⚠</span>':''}${p.mlItemId&&p.mlStatus==='paused'?' <span title="Anúncio pausado no Mercado Livre">⏸</span>':''}${p.mlItemId&&p.mlCatalogo?' <span title="Anúncio vinculado ao catálogo do Mercado Livre">📚</span>':''}${p.mlItemId&&concorrenciaLabel(p.mlConcorrenciaStatus)?` <span title="${esc(concorrenciaLabel(p.mlConcorrenciaStatus))}${(typeof p.mlConcorrenciaPreco==='number')?' · Concorrente: '+fmtMoney(p.mlConcorrenciaPreco):''} — tem outro vendedor no mesmo catálogo">⚔</span>`:''}${p.mlItemId&&p.mlPerguntas>0?` <span title="${p.mlPerguntas} pergunta${p.mlPerguntas===1?'':'s'} sem resposta no Mercado Livre">❓</span>`:''}</td>
          <td>${(!p.custo||p.custo<=0)?'<span class="tag-zero">sem custo</span>':fmtMoney(p.custo)}</td>
          <td class="num">${m!=null?m.toFixed(2):'<span class="muted">—</span>'}</td>
          <td class="num">${fmtInt(p.qtd.comprar)}</td>
          <td class="num">${fmtInt(p.qtd.coletar)}</td>
          <td class="num">${fmtInt(totalNoGalpao(p))}</td>
          <td class="num">${reservadoDe(p)>0?`<button class="btn sm" style="padding:3px 9px" data-verres="${p.id}" title="Ver em quais envios está reservado"><span class="okv">${fmtInt(reservadoDe(p))}</span> ⓘ</button>`:'0'}</td>
          <td class="num">${fmtInt(disponivel(p))}</td>
          <td class="num">${p.mlItemId?fmtInt(p.mlQtdDisponivel||0):'<span class="muted">—</span>'}</td>
          <td class="num">${fi?(()=>{const tot=fk.full-(fi.aptas||0); return `<span class="det">${fmtInt(tot)}<span class="i">i</span><span class="pop">
            <span class="ln"><span>Em transferência</span><b>${fmtInt(fi.transf||0)}</b></span>
            ${fk.proximosProgramados?`<span class="ln"><span>Próximos programados</span><b>${fmtInt(fk.proximosProgramados)}</b></span>`:''}
            <span class="ln tot"><span>Total</span><b>${fmtInt(tot)}</b></span>

  document.getElementById('filtroLoja').onchange=e=>{ filtro.loja=e.target.value; renderProdutos(); };
  document.getElementById('filtroBusca').oninput=e=>{ filtro.busca=e.target.value; renderProdutos(); };
  document.getElementById('btnNovoSku').onclick=()=>openProdutoModal(null,filtro.loja!=='todas'?filtro.loja:null);
  document.getElementById('btnConferencia').onclick=imprimirConferenciaEstoque;
  document.getElementById('btnSyncML').onclick=abrirSincronizacaoML;
  el.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>openProdutoModal(b.dataset.manage));
  el.querySelectorAll('[data-verres]').forEach(b=>b.onclick=()=>openOndeReservadoModal(b.dataset.verres));
}

/* mostra em quais envios o SKU está reservado */

        <td class="num">${fmtInt((i.alocado||0)+(i.reservadoColeta||0))}</td></tr>`).join('')}

}

/* ---------- conferência mensal de estoque ---------- */
function imprimirConferenciaEstoque(){
  const lojas = filtro.loja==='todas' ? STORES : [filtro.loja];
  const dados = lojas.map(loja=>({loja, itens: state.produtos.filter(p=>p.loja===loja&&(totalNoGalpao(p)>0||p.qtd.coletar>0))
    .sort((a,b)=>(a.fornecedor||'').localeCompare(b.fornecedor||'')||a.sku.localeCompare(b.sku))})).filter(d=>d.itens.length);
  if(!dados.length){ alert('Não há estoque no galpão nem a coletar para conferir.'); return; }
  const win=window.open('','_blank');
  if(!win){ alert('Não foi possível abrir a janela de impressão. Verifique o bloqueador de pop-up.'); return; }
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Conferência de Estoque</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;padding:26px;color:#111}
      h1{font-size:19px;margin:0 0 4px}
      .sub{color:#555;font-size:12px;margin-bottom:6px}
      .assin{font-size:12px;margin:10px 0 18px;color:#333}
      .loja-h{font-weight:bold;font-size:16px;background:#eee;padding:9px 12px;margin:26px 0 10px;border-radius:4px}
      .loja-h:first-of-type{margin-top:14px}
      table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
      th,td{border:1px solid #bbb;padding:6px 8px;text-align:left}
      th{background:#f2f2f2;font-size:11px}
      td.n{text-align:right;font-family:monospace;font-weight:bold}
      td.box{background:#fcfcfc;width:62px}
      .tot{font-size:12.5px;text-align:right;font-weight:bold;margin-bottom:4px}
      .quebra{page-break-after:always}
      .rod{margin-top:20px;font-size:11.5px;color:#444;border-top:1px solid #999;padding-top:8px}
      @media print{.no-print{display:none}}
    </style></head><body>
    <h1>Conferência de Estoque</h1>
    <div class="sub">Gerado em ${new Date().toLocaleString('pt-BR')}</div>
    <div class="assin">Conferido por: ______________________________&nbsp;&nbsp;&nbsp;&nbsp;Data da contagem: ______ / ______ / __________</div>
    ${dados.map((d,idx)=>{
      const tg=d.itens.reduce((a,p)=>a+totalNoGalpao(p),0);
      const tc=d.itens.reduce((a,p)=>a+p.qtd.coletar,0);
      return `<div class="loja-h">${esc(d.loja)}</div>
      <table><thead><tr>
        <th>SKU</th><th>Código</th><th>Fornecedor</th>
        <th>No galpão<br><span style="font-weight:normal">(sistema)</span></th><th>Contado</th><th>Difer.</th>
        <th>A coletar<br><span style="font-weight:normal">(sistema)</span></th><th>Contado</th><th>Difer.</th>
      </tr></thead><tbody>
      ${d.itens.map(p=>`<tr>
        <td>${esc(p.sku)}</td><td>${esc(p.codigo)}</td><td>${esc(p.fornecedor)||'—'}</td>
        <td class="n">${fmtInt(totalNoGalpao(p))}</td><td class="box"></td><td class="box"></td>
        <td class="n">${fmtInt(p.qtd.coletar)}</td><td class="box"></td><td class="box"></td>
      </tr>`).join('')}
      </tbody></table>
      <div class="tot">${esc(d.loja)} — total no galpão: ${fmtInt(tg)} un. · total a coletar: ${fmtInt(tc)} un.</div>
      ${idx<dados.length-1?'<div class="quebra"></div>':''}`;
    }).join('')}
    <div class="rod">Preencha a coluna <b>Contado</b> com a quantidade física encontrada e anote a diferença. Depois lance os ajustes no sistema em Produtos → Gerenciar → Ajuste manual de estoque.<br>
    Atenção: a coluna "No galpão" inclui o que já está etiquetado para envios FULL — conte tudo que estiver fisicamente no galpão.</div>
    <button class="no-print" onclick="window.print()" style="margin-top:14px;padding:10px 18px;font-size:14px;cursor:pointer">Imprimir</button>
    </body></html>`);

}

/* ---------- modal produto ---------- */
function openProdutoModal(id,lojaPadrao){
  const editing=!!id, p=editing?prodById(id):null;
  const body=openModal(false);
  const rl=editing?reservadoLocalDe(p):0, rc=editing?reservadoColetaDe(p):0;
  const sug=editing?estoqueMinimoSugerido(p):null;
  body.innerHTML=`
    <h3>${editing?'Gerenciar SKU':'Novo SKU'}</h3>
    <div class="form-grid">
      <label>Loja<select id="fpLoja">${optsLojas(p?p.loja:(lojaPadrao||STORES[0]))}</select></label>
      <label>SKU<input id="fSku" type="text" value="${p?esc(p.sku):''}" placeholder="Ex: afiador19"></label>
      <label>Código do produto<input id="fCodigo" type="text" value="${p?esc(p.codigo):''}" placeholder="Ex: JIIK92165"></label>
      <label>Fornecedor<input id="fFornecedor" type="text" value="${p?esc(p.fornecedor):''}" placeholder="Ex: Distribuidora XYZ"></label>
      <label>Custo unitário (R$)<input id="fCusto" type="text" inputmode="decimal" placeholder="0,00" oninput="filtrarValorMoeda(this)" value="${p&&p.custo?String(p.custo).replace('.',','):''}"></label>
    </div>
    ${sug!=null?`<p class="hint" style="margin-top:-8px">Estoque mínimo automático pelas vendas do FULL: <b>${fmtInt(sug)} un.</b> (média diária ponderada 7/15/30d × 30 dias de cobertura).</p>`:''}
    ${!editing?`<div class="form-grid">
      <label>Quantidade inicial<input id="fQtdInicial" type="number" min="0" value="0"></label>
      <label>Status inicial<select id="fStatusInicial"><option value="comprar">Comprar</option><option value="coletar">Coletar</option><option value="local">Local</option></select></label>
    </div>`:''}
    <div class="modal-actions"><button class="btn" id="btnCancelar">Cancelar</button>
      <button class="btn acc" id="btnSalvarProduto">${editing?'Salvar alterações':'Cadastrar SKU'}</button></div>
    ${editing?`
      <hr class="modal-sep">
      <h4>Adicionar compra (nova entrada em Comprar)</h4>
      <div class="envio-full-row"><input id="fQtdAdicionar" type="number" min="1" placeholder="Quantidade">
        <button class="btn acc" id="btnAdicionarComprar">+ Adicionar ao Comprar</button></div>
      <p class="hint">Use pra repor esse SKU. Soma em Comprar sem tirar de nenhum outro status.</p>

      <hr class="modal-sep">
      <h4>Ajuste manual de estoque (contagem física)</h4>
      ${rl?`<div class="aviso atencao" style="margin-bottom:12px"><span>⚠</span><span>Deste total, <b>${fmtInt(rl)} un.</b> já estão etiquetadas para envios FULL. <b>Conte tudo o que estiver no galpão</b>, inclusive essas — o sistema separa sozinho.</span></div>`:''}
      <div class="form-grid">
        <label class="span2">Quantidade contada no galpão <small>(o total físico, incluindo o que já está etiquetado)</small><input id="ajLocal" type="number" min="0" value="${totalNoGalpao(p)}"></label>
      </div>
      <button class="btn acc" id="btnAjustar">Salvar contagem</button>
      <p class="hint">O valor informado <b>substitui</b> o total do galpão (não soma). Hoje o sistema tem <b>${fmtInt(totalNoGalpao(p))} un.</b>${rl?` (${fmtInt(p.qtd.local)} livres + ${fmtInt(rl)} etiquetadas)`:''}. Para corrigir compras e coletas, use a quantidade do pedido na aba <b>Comprar</b> ou receba o lote na aba <b>Coletar</b>.</p>

      <hr class="modal-sep">
      <div class="calc-row">
        <span>A comprar: <b>${fmtInt(p.qtd.comprar)}</b></span>
        <span>A coletar: <b>${fmtInt(p.qtd.coletar)}</b></span>
        <span>No galpão: <b>${fmtInt(totalNoGalpao(p))}</b></span>
        <span>Reservado: <b>${fmtInt(rl+rc)}</b> <span class="muted">(${fmtInt(rl)} no galpão + ${fmtInt(rc)} a coletar)</span></span>
        <span>Disponível: <b>${fmtInt(disponivel(p))}</b></span>
        <span>Valor: <b>${fmtMoney(valorEstoque(p))}</b></span>
      </div>

      <hr class="modal-sep">
      <button class="btn danger-outline" id="btnExcluirProduto">Excluir este SKU do sistema</button>`:''}`;

  document.getElementById('btnCancelar').onclick=closeModal;
  document.getElementById('btnSalvarProduto').onclick=()=>{
    const loja=document.getElementById('fpLoja').value;
    const sku=document.getElementById('fSku').value.trim().toUpperCase();
    const codigo=document.getElementById('fCodigo').value.trim().toUpperCase();
    const fornecedor=document.getElementById('fFornecedor').value.trim().toUpperCase();
    const custo=parseMoeda(document.getElementById('fCusto').value);
    if(!sku){ alert('Preencha o SKU.'); return; }
    const dup=state.produtos.some(x=>x.id!==id&&x.loja===loja&&x.sku.toLowerCase()===sku.toLowerCase());
    if(dup){ alert('Já existe esse SKU cadastrado nessa loja.'); return; }
    if(editing&&loja!==p.loja){
      const emEnvio=state.envios.some(e=>e.itens.some(i=>i.produtoId===id));
      if(emEnvio){ alert('Este SKU está em um envio FULL da loja '+p.loja+'. Remova-o do envio antes de trocar a loja.'); return; }
    }
    if(!editing){
      const q=parseInt(document.getElementById('fQtdInicial').value)||0;
      const st=document.getElementById('fStatusInicial').value;
      const qtd={comprar:0,coletar:0,local:0}; qtd[st]=q;
      const lotes = st==='coletar'&&q>0 ? [novoLote(q)] : [];
      const pedidos = st==='comprar'&&q>0 ? [novoPedido(q)] : [];
      batch('cadastro do SKU '+sku,()=>addProduto({loja,sku,codigo,fornecedor,custo,estoqueMinimo:0,qtd,lotes,pedidos,obsCompra:''}));
      closeModal(); toast('SKU cadastrado.');
    } else { updateProduto(id,{loja,sku,codigo,fornecedor,custo}); closeModal(); toast('Alterações salvas.'); }
  };
  if(editing){
    document.getElementById('btnAdicionarComprar').onclick=()=>{
      const r=adicionarQtd(id,'comprar',document.getElementById('fQtdAdicionar').value);
      if(!r.ok){ alert(r.msg); return; }
      openProdutoModal(id); toast('Quantidade adicionada ao Comprar.');
    };
    document.getElementById('btnAjustar').onclick=()=>{
      const r=ajustarEstoque(id,{local:document.getElementById('ajLocal').value});
      if(!r.ok){ alert(r.msg); return; }
      openProdutoModal(id);
      const pp=prodById(id);
      toast(`Contagem salva: ${fmtInt(totalNoGalpao(pp))} un. no galpão.`+(r.reconciliado?` ${fmtInt(r.reconciliado)} un. foram destinadas a envios pendentes.`:''));
    };
    document.getElementById('btnExcluirProduto').onclick=()=>{
      confirmAction(`Excluir o SKU ${p.sku} (${p.loja})? Ele sai também dos envios FULL em que estiver. Dá pra reverter no botão Desfazer.`,()=>{
        deleteProduto(id); closeModal(); toast('SKU excluído.');
      });
    };
  }
}

/* ---------- comprar ---------- */
function wireAcaoButtons(scope){
  scope.querySelectorAll('[data-comprei]').forEach(b=>{
    b.onclick=()=>{
      const [pid,cid]=b.dataset.comprei.split('|');
      const p=prodById(pid);
      const r=comprarPedido(pid,cid);
      if(!r.ok){ alert(r.msg); return; }
      toast(`${fmtInt(r.qtd)} un. de ${p.sku} foram para a lista de coleta.`);
    };
  });
  scope.querySelectorAll('[data-receber]').forEach(b=>{
    b.onclick=()=>{
      const [pid,lid]=b.dataset.receber.split('|');

      if(!r.ok){ alert(r.msg); return; }
      toast(`${fmtInt(r.qtd)} un. entraram no galpão.`);
    };
  });
}

function renderComprar(){

  let h=`<h1 class="page-title">Comprar</h1>
    <div class="modal-actions" style="justify-content:flex-start;margin:0 0 16px">
      <button class="btn gold" id="btnRelCompraFornecedor">🖨 Relatório de compra por fornecedor</button></div>
    <p class="hint" style="margin:0 0 16px">Cada pedido aparece em uma linha própria, mesmo sendo do mesmo SKU. Se o fornecedor não tiver a quantidade toda, altere direto na coluna <b>Qtd do pedido</b> — os outros pedidos do mesmo SKU não são afetados. Ao clicar em <b>Comprei</b>, só aquele pedido vira um lote na lista de coleta.</p>`;
  STORES.forEach(loja=>{
    const l=state.produtos.filter(p=>p.loja===loja&&(p.pedidos||[]).length>0).sort((a,b)=>a.sku.localeCompare(b.sku));
    h+=`<h3>${esc(loja)}</h3>${tableComprar(l)}`;
  });
  el.innerHTML=h;
  wireAcaoButtons(el);
  el.querySelectorAll('[data-obsped]').forEach(i=>{
    i.onchange=()=>{ const [pid,cid]=i.dataset.obsped.split('|'); atualizarPedido(pid,cid,{obs:i.value.toUpperCase()}); toast('Observação salva.'); };
  });
  el.querySelectorAll('[data-qtdped]').forEach(i=>{
    i.onchange=()=>{
      const [pid,cid]=i.dataset.qtdped.split('|');
      const r=atualizarPedido(pid,cid,{qtd:i.value});
      if(!r.ok){ alert(r.msg||'Não foi possível ajustar.'); return; }
      if(r.aviso) toast(`Quantidade ajustada. ${fmtInt(r.aviso.qtd)} un. tiradas do envio "${r.aviso.envio}" — veja o aviso em Envios programados pra ajustar no Mercado Livre também.`);
      else toast('Quantidade do pedido ajustada.');
    };
  });
  document.getElementById('btnRelCompraFornecedor').onclick=imprimirRelatorioCompraFornecedor;
}
function imprimirRelatorioCompraFornecedor(){

  if(!ch.length){ alert('Marque ao menos um pedido para incluir no relatório.'); return; }
  const itens=[];
  ch.forEach(x=>{
    const [pid,cid]=x.dataset.ped.split('|');
    const p=prodById(pid); if(!p) return;
    const c=(p.pedidos||[]).find(y=>y.id===cid); if(!c||c.qtd<=0) return;
    itens.push({loja:p.loja,sku:p.sku,codigo:p.codigo,fornecedor:p.fornecedor,custo:p.custo,qtd:c.qtd,obs:c.obs,data:c.data});
  });
  if(!itens.length){ alert('Não há nada pendente em Comprar.'); return; }

  const win=window.open('','_blank');
  if(!win){ alert('Não foi possível abrir a janela de impressão. Verifique o bloqueador de pop-up.'); return; }
  const total=itens.reduce((a,i)=>a+(i.custo||0)*i.qtd,0);
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Pedido de Compra por Fornecedor</title>
    <style>body{font-family:Arial,Helvetica,sans-serif;padding:28px;color:#111}h1{font-size:19px;margin:0 0 4px}
    .sub{color:#555;font-size:12px;margin-bottom:22px}table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
    th,td{border:1px solid #ccc;padding:8px 10px;text-align:left}th{background:#f2f2f2}td.n{text-align:right}
    .forn-h{font-weight:bold;font-size:15px;background:#eee;padding:8px 10px;margin-top:24px;border-radius:4px}
    .sub-t{font-size:13px;text-align:right;margin:0 0 6px;font-weight:bold}
    .tot{margin-top:24px;font-size:15px;font-weight:bold;border-top:2px solid #333;padding-top:10px;text-align:right}
    .obs{font-style:italic;color:#444}@media print{.no-print{display:none}}</style></head><body>
    <h1>Pedido de Compra por Fornecedor</h1><div class="sub">Gerado em ${new Date().toLocaleString('pt-BR')}</div>
    ${nomes.map(f=>{
      const l=g[f].sort((a,b)=>a.loja.localeCompare(b.loja)||a.sku.localeCompare(b.sku));
      const sub=l.reduce((a,i)=>a+(i.custo||0)*i.qtd,0);
      return `<div class="forn-h">${esc(f)} — ${l.reduce((a,i)=>a+i.qtd,0)} un. em ${l.length} pedido(s)</div>
      <table><thead><tr><th style="width:40px"></th><th>Pedido de</th><th>Loja</th><th>SKU</th><th>Código</th><th>Qtd</th><th>Custo un.</th><th>Subtotal</th><th>Obs.</th></tr></thead><tbody>
      ${l.map(i=>`<tr><td><span style="display:inline-block;width:18px;height:18px;border:1.5px solid #333"></span></td>
        <td>${esc(fmtData(i.data))}</td><td>${esc(i.loja)}</td><td>${esc(i.sku)}</td><td>${esc(i.codigo)}</td><td class="n">${fmtInt(i.qtd)}</td>

        <td class="obs">${esc(i.obs||'')}</td></tr>`).join('')}
      </tbody></table><div class="sub-t">Subtotal ${esc(f)}: ${fmtMoney(sub)}</div>`;

/* cada compra é uma linha própria — lotes do mesmo SKU não se somam */
function tableColetar(list){
  const linhas=[];
  list.forEach(p=>(p.lotes||[]).forEach(l=>linhas.push({p,l})));
  if(!linhas.length) return `<p class="empty-inline">Nada por aqui.</p>`;
  linhas.sort((a,b)=>(a.l.data||'').localeCompare(b.l.data||'')||a.p.sku.localeCompare(b.p.sku));
  return `<div class="table-wrap" style="margin-bottom:18px"><table class="tbl-produtos"><thead><tr>
    <th style="width:36px">Coletar?</th><th>Comprado em</th><th>SKU</th><th>Código</th><th>Fornecedor</th><th>Qtd do lote</th><th>Pedido do fornecedor</th><th></th>
  </tr></thead><tbody>
    ${linhas.map(({p,l})=>`<tr>
      <td><input type="checkbox" class="chk-coleta" data-lote="${p.id}|${l.id}" checked></td>
      <td class="mono">${esc(fmtData(l.data))}</td>
      <td class="mono">${esc(p.sku)}</td><td>${esc(p.codigo)}</td><td>${esc(p.fornecedor)||'<span class="muted">—</span>'}</td>
      <td class="num">${fmtInt(l.qtd)}</td>
      <td><input type="text" class="obs-input" placeholder="Nº do pedido" value="${esc(l.pedido||'')}" data-pedido="${p.id}|${l.id}"></td>
      <td><button class="btn sm acc" data-receber="${p.id}|${l.id}">Chegou no galpão</button></td>
    </tr>`).join('')}
  </tbody></table></div>`;
}

/* ================= ADS (Product Ads · Mercado Livre) ================= */
function adsCfg(){ return state.ads.cfg; }
function campanhasAds(loja){ return state.ads.campanhas.filter(c=>c.loja===(loja||adsCfg().loja)); }

function promptAds(){
  const c=adsCfg();
  return `Tarefa: leitura de anúncios patrocinados (Product Ads) — loja ${c.loja} (Mercado Livre)

Use a aba do navegador já aberta e logada nesta loja. Não faça login, não troque de conta, não peça credenciais.
Consulte o painel somente em modo leitura: não pausar, não reativar, não mudar orçamento, não mudar ROAS objetivo, não editar nada. Só olhar e anotar.

NÃO CALCULE NADA — nem CTR, nem CVR, nem médias, nem sugestões. Isso eu calculo no meu sistema. Entregue só os dados brutos que já aparecem prontos na tela.

ONDE BUSCAR
No menu do Mercado Livre, vá em Publicidade → Product Ads → Campanhas. Essa tela lista TODAS as campanhas (ativas e pausadas) — anote mentalmente quantas existem no total e se há paginação (botão de próxima página ou numeração no rodapé da lista).

PASSO A PASSO DENTRO DE CADA CAMPANHA (repita esses 6 passos pra CADA campanha da lista, uma de cada vez, até terminar todas — inclusive as que estiverem em outras páginas):
1) Clique na campanha pra abrir os detalhes dela. Antes de ler os números, clique no ícone de lápis ✎ ao lado do bloco de métricas e marque para aparecer: Vendas atribuídas, Outras vendas, TACOS, Cliques, Impressões (essas cinco precisam estar marcadas — às vezes o painel não vem configurado assim por padrão).
2) Anote: nome da campanha, Estado (ativa/pausada), Diagnóstico. Confira também se o produto anunciado tem a etiqueta/selo "MAIS VENDIDO" (também chamada de "Mercado Líder" às vezes) — normalmente aparece na miniatura ou no título do anúncio, dentro da própria página da campanha ou no anúncio em si. Anote SIM se tiver a etiqueta, NAO se não tiver.
3) No topo da página, antes do bloco de métricas, tem um card "Orçamento médio diário" com o valor atual (com um lápis ✎ do lado pra editar — não clique, só leia) e o ROAS Objetivo. Se logo abaixo desse card aparecer uma caixinha de aviso do tipo "Você está perdendo X vendas por mês por falta de orçamento. Aumente-o à R$Y e venda mais.", anote esse X (vendas perdidas por mês) e esse Y (orçamento sugerido). Se não aparecer esse aviso, anote os dois como 0.
4) A tela normalmente já abre com o filtro em "Últimos 30 dias" — não troque o filtro ainda. Primeiro expanda a seção "Ganho de leilões" (também pode aparecer como "Seus anúncios patrocinados versus sua concorrência") e anote os três percentuais de competitividade para esse período de 30 dias que já está aberto: Seus anúncios patrocinados foram exibidos / Não foram exibidos por falta de orçamento / Não foram exibidos por classificação.
5) Ainda com o filtro em 30 dias, anote também: Vendas atribuídas, Outras vendas, TACOS, ROAS Realizado (às vezes aparece só como "ROAS", ao lado do ROAS Objetivo — se não tiver um valor separado por período, repita o mesmo ROAS Objetivo), Cliques, Impressões e CPC. Depois troque o filtro pra 15 dias e repita a mesma leitura (métricas + ROAS Realizado + Ganho de leilões). Depois troque pra 7 dias e repita de novo — capriche na leitura desse último, os últimos 7 dias costumam ser o período mais importante pra decisão. Pode ignorar a tabela de anúncios no rodapé da campanha, se houver — só preciso do total da campanha.
6) Volte pra lista de campanhas (breadcrumb ou botão voltar do navegador) e abra a PRÓXIMA campanha ainda não lida. Repita os passos 1 a 5. Quando terminar todas as campanhas da página atual, se houver próxima página na lista, avance e continue até não sobrar nenhuma.

Só escreva a tabela final depois de ter passado por TODAS as campanhas — não pare no meio nem entregue parcial sem avisar.

FORMATO DE SAÍDA — entregue um bloco de código com tabela separada por TABULAÇÃO, com esta primeira linha exata:

CAMPANHA	STATUS	DIAGNOSTICO	TEM_TAG	ORCAMENTO_DIARIO	ORCAMENTO_SUGERIDO	VENDAS_PERDIDAS_MES	ROAS_OBJETIVO	PERIODO	VENDAS_ATRIBUIDAS	OUTRAS_VENDAS	TACOS	ROAS_REALIZADO	CLIQUES	IMPRESSOES	CPC	EXIBIDO_PCT	SEM_ORCAMENTO_PCT	SEM_CLASSIF_PCT

Regras:
- TRÊS linhas por campanha — uma com PERIODO=7D, uma com 15D e uma com 30D. Os campos que não mudam com o período (nome, status, diagnóstico, tem tag, orçamento, orçamento sugerido, vendas perdidas por mês, ROAS objetivo) se repetem nas três linhas da mesma campanha.
- TEM_TAG: escreva só SIM ou NAO.
- Números com ponto decimal (ex.: 5.4), sem separador de milhar, sem "%", sem "R$", sem "un.", sem "x".
- TACOS, EXIBIDO_PCT, SEM_ORCAMENTO_PCT e SEM_CLASSIF_PCT são percentuais — escreva só o número (ex.: 6.2 para 6,2%).
- Se algum dado não existir ou não carregar, escreva 0. Não invente número.
- Sem totais, sem comentários entre as linhas, sem linha de rodapé.

Depois da tabela, diga quantas campanhas existem no total na lista e confirme que passou por todas (ou avise quais faltaram e por quê). Aponte qualquer coisa estranha que notar (campanha sem orçamento definido, métrica que não carregou, etc). Informe a data de hoje confirmada no painel.`;
}

const ADS_NORM=s=>String(s==null?'':s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9]+/g,'_').replace(/^_+|_+$/g,'');
const ADS_COLS=['CAMPANHA','STATUS','DIAGNOSTICO','TEM_TAG','ORCAMENTO_DIARIO','ORCAMENTO_SUGERIDO','VENDAS_PERDIDAS_MES','ROAS_OBJETIVO','PERIODO','VENDAS_ATRIBUIDAS','OUTRAS_VENDAS','TACOS','ROAS_REALIZADO','CLIQUES','IMPRESSOES','CPC','EXIBIDO_PCT','SEM_ORCAMENTO_PCT','SEM_CLASSIF_PCT'];
function adsNum(v){
  let s=String(v==null?'':v).trim().replace(/[^\d.,\-]/g,'');
  if(!s) return 0;
  if(s.includes(',')&&!s.includes('.')) s=s.replace(',','.');
  else s=s.replace(/,/g,'');
  const x=parseFloat(s);
  return isNaN(x)?0:x;
}
function adsPeriodoVazio(){ return {vendasAtribuidas:0,outrasVendas:0,tacos:0,roasRealizado:0,cliques:0,impressoes:0,cpc:0,exibidoPct:0,semOrcamentoPct:0,semClassifPct:0}; }
function adsBool(v){ const s=ADS_NORM(v); return s==='SIM'||s==='S'||s==='TRUE'||s==='1'||s==='YES'||s==='X'; }
function adsParsear(txt){
  let t=String(txt||'');
  const bl=t.match(/```[a-z]*\n([\s\S]*?)```/i); if(bl) t=bl[1];
  let ls=t.split(/\r?\n/).map(l=>l.replace(/\r/g,'')).filter(l=>l.trim().length);
  if(!ls.length) return {campanhas:[],linhas:0};
  const comPipe=ls.filter(l=>l.includes('|')).length>=Math.max(2,ls.length*0.6);
  let div;
  if(comPipe){ ls=ls.filter(l=>!/^[\s|:+-]+$/.test(l)); div=l=>l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(x=>x.trim()); }
  else { const c0=ls[0]; const sep=c0.includes('\t')?'\t':(c0.split(';').length>c0.split(',').length?';':','); div=l=>l.split(sep).map(x=>x.replace(/^"|"$/g,'').trim()); }
  if(!ls.length) return {campanhas:[],linhas:0};
  const cab=div(ls[0]).map(ADS_NORM);
  const idx={}; ADS_COLS.forEach(c=>{ const i=cab.indexOf(c); if(i>=0) idx[c]=i; });
  if(idx.CAMPANHA===undefined||idx.PERIODO===undefined) return {campanhas:[],linhas:0,naoReconhecido:true,cab};
  const porCampanha={};
  let linhas=0;
  for(let n=1;n<ls.length;n++){
    const cel=div(ls[n]); if(cel.length<3) continue;
    const nome=(cel[idx.CAMPANHA]||'').trim(); if(!nome) continue;
    if(/^(total|totais|soma)/i.test(nome)) continue;
    const periodoRaw=ADS_NORM(cel[idx.PERIODO]||'');
    const pk=periodoRaw.startsWith('7')?'d7':periodoRaw.startsWith('15')?'d15':periodoRaw.startsWith('30')?'d30':null;
    if(!pk) continue;
    const g=k=>idx[k]!==undefined?adsNum(cel[idx[k]]):0;
    if(!porCampanha[nome]) porCampanha[nome]={nome,status:(cel[idx.STATUS]||'').trim(),diagnostico:(cel[idx.DIAGNOSTICO]||'').trim(),
      temTag:idx.TEM_TAG!==undefined?adsBool(cel[idx.TEM_TAG]):false,
      orcamentoDiario:g('ORCAMENTO_DIARIO'),orcamentoSugerido:g('ORCAMENTO_SUGERIDO'),vendasPerdidasMes:g('VENDAS_PERDIDAS_MES'),roasObjetivo:g('ROAS_OBJETIVO'),periodos:{}};
    porCampanha[nome].periodos[pk]={vendasAtribuidas:g('VENDAS_ATRIBUIDAS'),outrasVendas:g('OUTRAS_VENDAS'),tacos:g('TACOS'),roasRealizado:g('ROAS_REALIZADO'),
      cliques:g('CLIQUES'),impressoes:g('IMPRESSOES'),cpc:g('CPC'),exibidoPct:g('EXIBIDO_PCT'),semOrcamentoPct:g('SEM_ORCAMENTO_PCT'),semClassifPct:g('SEM_CLASSIF_PCT')};
    linhas++;
  }
  return {campanhas:Object.values(porCampanha),linhas,idx,cab};
}
function aplicarColagemAds(loja,campanhasNovas){

  campanhasNovas.forEach(cn=>{
    ['d7','d15','d30'].forEach(pk=>{ if(!cn.periodos[pk]) cn.periodos[pk]=adsPeriodoVazio(); });
    let camp=state.ads.campanhas.find(c=>c.loja===loja&&c.nome.toUpperCase()===cn.nome.toUpperCase());
    if(!camp){ camp={id:gerarId('camp'),loja,nome:cn.nome}; state.ads.campanhas.push(camp); }
    camp.status=cn.status; camp.diagnostico=cn.diagnostico; camp.temTag=!!cn.temTag; camp.orcamentoDiario=cn.orcamentoDiario; camp.orcamentoSugerido=cn.orcamentoSugerido||0; camp.vendasPerdidasMes=cn.vendasPerdidasMes||0; camp.roasObjetivo=cn.roasObjetivo;
    camp.periodos=cn.periodos; camp.lidoEm=Date.now();
    const dia=hoje();
    ['d7','d15','d30'].forEach(pk=>{
      const p=cn.periodos[pk];
      state.ads.hist.push({data:dia,loja,campanha:cn.nome,periodo:pk,roasObjetivo:cn.roasObjetivo,
        tacos:p.tacos,vendasAtribuidas:p.vendasAtribuidas,outrasVendas:p.outrasVendas,cliques:p.cliques,impressoes:p.impressoes,
        exibidoPct:p.exibidoPct,semOrcamentoPct:p.semOrcamentoPct});
    });
  });
  const chaves=[...new Set(state.ads.hist.map(h=>h.loja+'|'+h.campanha))];
  chaves.forEach(ch=>{
    const i=ch.indexOf('|'), loja2=ch.slice(0,i), nome2=ch.slice(i+1);
    const meus=state.ads.hist.filter(h=>h.loja===loja2&&h.campanha===nome2);
    if(meus.length>300){ const fora=meus.slice(0,meus.length-300); state.ads.hist=state.ads.hist.filter(h=>fora.indexOf(h)<0); }
  });
  adsCfg().loja=loja;
  persist();
}
/* diagnóstico + sugestões de uma campanha, com base na leitura de 30 dias */
/* escolhe a janela mais recente com volume suficiente pra não tirar conclusão de amostra pequena — prioriza 7 dias, que costuma ser o período mais importante pra decisão */
function periodoBaseAds(camp){
  const d7=camp.periodos.d7||adsPeriodoVazio();
  if((d7.cliques||0)>=10||(d7.impressoes||0)>=200) return {chave:'d7',dados:d7,rotulo:'7d'};
  const d15=camp.periodos.d15||adsPeriodoVazio();
  if((d15.cliques||0)>=10) return {chave:'d15',dados:d15,rotulo:'15d'};
  return {chave:'d30',dados:camp.periodos.d30||adsPeriodoVazio(),rotulo:'30d'};
}
/* compara a média diária dos últimos 7 dias com a média diária da janela anterior (15d, ou 30d se 15d vazio) pra indicar se cliques/impressões estão subindo ou caindo — sem precisar coletar dado dia a dia */
/* compara a media diaria dos ultimos 7 dias com a media diaria dos ultimos 30 dias */
function adsTendencia(camp){
  const d7=camp.periodos.d7||adsPeriodoVazio(), d30=camp.periodos.d30||adsPeriodoVazio();
  const calc=campo=>{
    const m7=(d7[campo]||0)/7, m30=(d30[campo]||0)/30;
    if(!m30) return {dir:'eq',m7,base:0,deltaPct:0};
    const delta=(m7-m30)/m30;
    return {dir:delta>0.12?'up':(delta<-0.12?'dn':'eq'),m7,base:m30,deltaPct:delta*100};
  };
  return {cliques:calc('cliques'),impressoes:calc('impressoes')};
}
function setaTend(dir){ return dir==='up'?'▲':(dir==='dn'?'▼':'='); }
/* tendencia do ROAS realizado: compara os ultimos 7 dias com os 15 dias (janela um pouco mais longa) — no ROAS, subir é bom (mais retorno), diferente da tendencia de cliques/impressoes */
function adsTendenciaRoas(camp){
  const d7=(camp.periodos.d7||adsPeriodoVazio()).roasRealizado||0;
  const d15=(camp.periodos.d15||adsPeriodoVazio()).roasRealizado||0;
  if(!d15) return {dir:'eq',pct:0};
  const pct=(d7-d15)/d15*100;
  return {dir:pct>3?'up':(pct<-3?'dn':'eq'),pct};
}
/* produto do Doca vinculado manualmente a esta campanha (pra puxar dado real de estoque/vendas) */
function produtoDaCampanhaAds(camp){
  return camp.produtoId?(state.produtos.find(p=>p.id===camp.produtoId)||null):null;
}
/* vendas/dia da campanha: usa a média real do produto vinculado no Doca (mais confiável) quando existir;
   senão estima pela janela de leitura da campanha (vendas atribuídas + orgânicas, dividido pelos dias do período) */
function vendasDiaAds(camp,base){
  const p=produtoDaCampanhaAds(camp);
  if(p){ const m=mediaVendasDiaria(p); if(m!=null&&m>0) return {valor:m,fonte:'doca'}; }
  const dias=base.chave==='d7'?7:(base.chave==='d15'?15:30);
  const total=(base.dados.vendasAtribuidas||0)+(base.dados.outrasVendas||0);
  return {valor:dias>0?total/dias:0,fonte:'ads'};
}
/* risco de ruptura do produto vinculado, usando a mesma lista/prazo já usado no alerta da Visão Geral */
function rupturaAds(camp){
  const p=produtoDaCampanhaAds(camp); if(!p) return null;
  const dias=(typeof fullCfg==='function'?(fullCfg().diasAlertaRuptura||10):10);
  const item=rupturaProximaLista(dias).find(r=>r.produto.id===p.id);
  return item||null;
}
/* responde a "pergunta chave": quantas vendas/dia o histórico já mostrou com TACOS perto da meta,
   e se isso for menos que 10, qual foi o menor TACOS que já rendeu 10+ vendas/dia */
function perguntaChaveAds(loja,nomeCampanha,metaTacos){
  const regs=state.ads.hist.filter(h=>h.loja===loja&&h.campanha===nomeCampanha&&h.periodo==='d30'&&h.roasObjetivo>0);
  if(regs.length<2) return null;
  const porRoas={};
  regs.forEach(h=>{ (porRoas[h.roasObjetivo]=porRoas[h.roasObjetivo]||[]).push(h); });
  const chaves=Object.keys(porRoas);
  if(chaves.length<2) return null;
  const resumo=chaves.map(k=>{
    const l=porRoas[k];
    const tacosMedio=l.reduce((a,x)=>a+x.tacos,0)/l.length;
    const vendasDiaMedia=l.reduce((a,x)=>a+((x.vendasAtribuidas||0)+(x.outrasVendas||0))/30,0)/l.length;
    return {roas:Number(k),tacosMedio,vendasDiaMedia,leituras:l.length};
  });
  const naMeta=resumo.filter(r=>Math.abs(r.tacosMedio-metaTacos)<=2).sort((a,b)=>b.vendasDiaMedia-a.vendasDiaMedia)[0]||null;
  let precisaPara10=null;
  if(!naMeta||naMeta.vendasDiaMedia<10){
    const acima10=resumo.filter(r=>r.vendasDiaMedia>=10).sort((a,b)=>a.tacosMedio-b.tacosMedio)[0];
    if(acima10) precisaPara10=acima10;
  }
  return {naMeta,precisaPara10,resumo:resumo.sort((a,b)=>a.roas-b.roas)};
}

/* olha o histórico de leituras e compara os ROAS objetivo já usados nesta campanha */
function melhorRoasHistoricoAds(loja,nomeCampanha,tetoTacos){
  const regs=state.ads.hist.filter(h=>h.loja===loja&&h.campanha===nomeCampanha&&h.periodo==='d30'&&h.roasObjetivo>0);
  if(!regs.length) return null;
  const porRoas={};
  regs.forEach(h=>{ (porRoas[h.roasObjetivo]=porRoas[h.roasObjetivo]||[]).push(h); });
  const chaves=Object.keys(porRoas);
  if(chaves.length<2) return null;
  const resumo=chaves.map(k=>{
    const l=porRoas[k];
    const tacosMedio=l.reduce((a,x)=>a+x.tacos,0)/l.length;
    const vendasMedia=l.reduce((a,x)=>a+x.vendasAtribuidas,0)/l.length;
    return {roas:Number(k),tacosMedio,vendasMedia,leituras:l.length};
  });
  const dentroDoTeto=resumo.filter(r=>r.tacosMedio<=tetoTacos);
  const base=(dentroDoTeto.length?dentroDoTeto:resumo).slice().sort((a,b)=>b.vendasMedia-a.vendasMedia);
  return {melhor:base[0],todos:resumo.slice().sort((a,b)=>a.roas-b.roas)};
}
/* nota de saúde da campanha perante a nossa margem — substitui o status bruto (ativa/pausada) por algo que já diz se precisa de ação.
   base: margem média (ex.: 18%) menos a meta de TACOS (ex.: 6%) define onde a campanha "começa a ficar saudável" (ex.: 12%) —
   acima da margem = urgente (TACOS come mais que a margem inteira); entre esse ponto e a margem = atenção;
   entre a meta e esse ponto = bom (pode ser produto novo ainda rankeando); na meta ou abaixo = saudável. */
/* 4 fases entre a meta (TACOS ideal) e a margem (teto absoluto):
   até a meta = Saudável (no alvo); da meta até o meio do caminho = Estável (folga, comum rankeando);
   do meio até a margem = Se pagando (margem apertada, quase no limite); acima da margem = Investindo (gastando mais que a margem permite). */
function notaCampanhaAds(A,camp,cfg){
  const meta=cfg.tacosTeto||6;
  const margem=cfg.margemPct||18;
  const meio=(meta+margem)/2;
  const t=A.tacos;
  if(t>margem) return {nivel:'investindo',emoji:'🔴',label:'Investindo',cor:'var(--danger)',bg:'rgba(251,113,133,.15)'};
  if(t>meio) return {nivel:'sepagando',emoji:'🟠',label:'Se pagando',cor:'var(--warn)',bg:'rgba(251,191,36,.13)'};
  if(t>meta+1) return {nivel:'estavel',emoji:'🟡',label:'Estável',cor:'var(--info)',bg:'rgba(96,165,250,.13)'};
  return {nivel:'saudavel',emoji:'🟢',label:'Saudável',cor:'var(--ok)',bg:'rgba(52,211,153,.13)'};
}
/* score pro modo ranking: maior número de vendas, com bônus quando o TACOS está o mais próximo possível da meta (nem muito acima, nem muito abaixo) */
function scoreRankingAds(camp,cfg,Apre){
  const A=Apre||analisarCampanhaAds(camp,cfg);
  const teto=cfg.tacosTeto||6;
  const vendas=A.base.dados.vendasAtribuidas||0;
  const proximidade=1-Math.min(Math.abs(A.tacos-teto)/teto,1);
  return vendas*(0.5+0.5*proximidade);
}

/* ---------- listas de tarefas ---------- */
function addLista(nome){
  snapshot('nova lista de tarefas');
  const l={id:gerarId('lst'),nome:(nome||'').trim().toUpperCase()||'NOVA LISTA'};
  state.listas.push(l); listaAtual=l.id; persist();
  return l;
}
function renomearLista(id,nome){
  const l=state.listas.find(x=>x.id===id); if(!l) return;
  snapshot('renomear lista'); l.nome=(nome||'').trim().toUpperCase()||l.nome; persist();
}
function excluirLista(id){
  if(state.listas.length<=1){ alert('É preciso ter ao menos uma lista.'); return; }
  snapshot('exclusão de lista de tarefas');
  state.listas=state.listas.filter(l=>l.id!==id);
  state.tarefas=state.tarefas.filter(t=>t.listaId!==id);
  if(listaAtual===id) listaAtual=state.listas[0].id;
  persist();
}
function tarefasDaLista(id){ return state.tarefas.filter(t=>t.listaId===id); }

/* ---------- tarefas ---------- */
function addTarefa(titulo,data,hora,repetirMensal,obs){
  snapshot('nova tarefa');
  state.tarefas.unshift({id:gerarId('t'),listaId:listaAtual,titulo:(titulo||'').trim().toUpperCase(),data:data||'',hora:hora||'',repetirMensal:!!repetirMensal,obs:(obs||'').trim(),subs:[],criadoEm:Date.now()});
  persist();
}
function updateTarefa(id,patch){
  const t=state.tarefas.find(x=>x.id===id); if(!t) return;
  snapshot('edição de tarefa');
  Object.assign(t,patch); persist();
}
function concluirTarefa(id){
  const t=state.tarefas.find(x=>x.id===id); if(!t) return {ok:false};
  if(t.repetirMensal&&t.data){
    snapshot('conclusão (recorrente) da tarefa "'+(t.titulo||'').slice(0,30)+'"');
    t.data=proximoMes(t.data);
    (t.subs||[]).forEach(s=>s.feito=false);
    persist();
    return {ok:true,repetiu:true,novaData:t.data};
  }
  snapshot('conclusão da tarefa "'+(t.titulo||'').slice(0,30)+'"');
  state.tarefas=state.tarefas.filter(x=>x.id!==id);
  persist();
  return {ok:true,repetiu:false};
}
function moverTarefa(id,paraId){
  if(id===paraId) return;
  const de=state.tarefas.findIndex(t=>t.id===id);
  const para=state.tarefas.findIndex(t=>t.id===paraId);
  if(de<0||para<0) return;
  snapshot('reordenação de tarefas');
  const [t]=state.tarefas.splice(de,1);
  state.tarefas.splice(para,0,t);
  persist();
}
function addSub(tid,titulo){
  const t=state.tarefas.find(x=>x.id===tid); if(!t) return;
  const tit=(titulo||'').trim(); if(!tit) return;
  snapshot('nova subtarefa');
  if(!t.subs) t.subs=[];
  t.subs.push({id:gerarId('s'),titulo:tit.toUpperCase(),feito:false});
  persist();
}
function alternarSub(tid,sid){
  const t=state.tarefas.find(x=>x.id===tid); if(!t) return;
  const s=(t.subs||[]).find(x=>x.id===sid); if(!s) return;
  snapshot(s.feito?'reabrir subtarefa':'concluir subtarefa');
  s.feito=!s.feito; persist();
}
function editarSub(tid,sid,titulo){
  const t=state.tarefas.find(x=>x.id===tid); if(!t) return;
  const s=(t.subs||[]).find(x=>x.id===sid); if(!s) return;
  snapshot('edição de subtarefa'); s.titulo=(titulo||'').toUpperCase(); persist();
}
function removerSub(tid,sid){
  const t=state.tarefas.find(x=>x.id===tid); if(!t) return;
  snapshot('remoção de subtarefa');
  t.subs=(t.subs||[]).filter(x=>x.id!==sid); persist();
}

/* ---------- PDF ---------- */
function parseNomeArquivo(nome){
  const base=nome.replace(/\.pdf$/i,'').trim();
  const m=/^(\d{2})(\d{2})(\d{2})[\s._-]*(.+)$/.exec(base);
  if(!m) return {data:'',loja:null,nome:base};
  const [,dd,mm,aa,lt]=m;
  return {data:`20${aa}-${mm}-${dd}`,loja:acharLoja(lt),nome:base};
}
async function extrairLinhasPdf(file){
  if(!window.pdfjsLib) throw new Error('Biblioteca de leitura de PDF não carregou. Verifique sua conexão e recarregue a página.');
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const linhas=[];
  for(let pn=1;pn<=pdf.numPages;pn++){
    const tc=await (await pdf.getPage(pn)).getTextContent();
    const items=tc.items.map(it=>({str:(it.str||''),x:it.transform[4],y:it.transform[5]}));
    const skus=[],codigos=[],qtds=[];
    items.forEach(it=>{
      if(it.x<235){
        const ms=/SKU:\s*(\S+)/i.exec(it.str); if(ms) skus.push({sku:ms[1],y:it.y});
        const mc=/C[óo]digo ML:\s*([A-Z0-9]+)/i.exec(it.str); if(mc) codigos.push({codigo:mc[1],y:it.y});
      }
      const s=it.str.trim();
      if(it.x>=225&&it.x<=285&&/^\d[\d.,]*$/.test(s)){
        const v=parseInt(s.replace(/\D/g,''),10);
        if(!isNaN(v)&&v>0) qtds.push({qtd:v,y:it.y});
      }
    });
    qtds.forEach(q=>{
      let best=null,bd=Infinity;
      skus.forEach(s=>{ const d=q.y-s.y; if(d>=-6&&d<=32&&Math.abs(d)<bd){ bd=Math.abs(d); best=s; } });
      if(!best) return;
      let cod='',cd=Infinity;
      codigos.forEach(c=>{ const d=Math.abs(c.y-best.y); if(d<=22&&d<cd){ cd=d; cod=c.codigo; } });
      const ex=linhas.find(l=>l.sku.toLowerCase()===best.sku.toLowerCase());
      if(ex) ex.qtd+=q.qtd; else linhas.push({sku:best.sku,qtd:q.qtd,codigo:cod});
    });
  }
  return linhas;
}
async function processarPdf(file){
  try{
    toast('Lendo o PDF...');
    const meta=parseNomeArquivo(file.name);
    const linhas=await extrairLinhasPdf(file);
    if(!linhas.length){ alert('Não consegui identificar SKUs e quantidades nesse PDF. Confira se é o documento de inbound do Mercado Livre.'); return; }
    /* mesmo arquivo, ou mesma loja na mesma data = provavelmente uma atualizacao */
    const dup=state.envios.find(e=>e.arquivo&&e.arquivo.toLowerCase()===file.name.toLowerCase())
      ||(meta.loja&&meta.data?state.envios.find(e=>e.loja===meta.loja&&e.data===meta.data):null);
    const seguir=()=>{ pdfPreview={meta,linhas,arquivo:file.name}; openPdfPreviewModal(); };
    if(dup) perguntarAtualizacao(dup,{meta,linhas,arquivo:file.name},seguir);
    else seguir();
  }catch(err){ alert('Erro ao ler o PDF: '+err.message); }
}

function modalComparacao(envio,dados){

    if(c.tipo==='removido') return '<span class="pend">sai do envio — volta ao disponível</span>';
    if(c.tipo==='novoProduto') return '<span class="pend">SKU novo — será cadastrado</span>';
    if(c.tipo==='novoItem') return '<span class="pend">entra no envio</span>';
    if(c.dif>0) return '<span class="okv">+'+fmtInt(c.dif)+' — reserva ou ordem de compra</span>';
    if(c.dif<0) return '<span class="okv">'+fmtInt(c.dif)+' — sai da compra ou volta ao disponível</span>';
    return '<span style="opacity:.5">sem mudança</span>';
  };

      <td class="num"><b>${c.dif>0?'+':''}${fmtInt(c.dif)}</b></td><td>${rot(c)}</td></tr>`).join('')}</tbody></table></div>
    ${varias?`<div class="aviso atencao" style="margin:12px 0 0"><span>⚠</span><span>${varias} SKU(s) têm mais de uma programação neste envio. A diferença é aplicada na <b>programação mais recente</b>, preservando a mais antiga.</span></div>`:''}
    ${mudou.length?'':'<div class="aviso" style="margin:12px 0 0"><span>ℹ</span><span>Nada mudou em relação ao envio atual.</span></div>'}
    <div class="modal-actions"><button class="btn" id="btnCancComp">Cancelar</button>
      <button class="btn gold" id="btnAplicComp"${mudou.length?'':' disabled'}>Aplicar ao envio</button></div>`;
  document.getElementById('btnCancComp').onclick=()=>{ pdfPreview=null; closeModal(); };
  document.getElementById('btnAplicComp').onclick=()=>{

    if(r.rem) m+=` ${r.rem} SKU(s) removidos.`;
    if(r.cri) m+=` ${r.cri} SKU(s) novos cadastrados.`;
