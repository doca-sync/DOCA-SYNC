/* le o xlsx do Relatorio de Conciliacao no navegador (SheetJS, ja carregado no doca.html) - o
   arquivo tem 3 linhas de cabecalho antes dos dados (1: descrição solta, 2: agrupamento das
   colunas por seção tipo "Tarifas cobradas"/"Envio", 3: nome real de cada coluna) - usa a 3ª como
   cabecalho de verdade. Faz no navegador (não no backend) porque campos como "Detalhes de
   tarifas" têm ";" e quebra de linha dentro do valor, o que quebraria um CSV simples. */
async function lerLinhasRelatorioConciliacao(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const sheet=wb.Sheets[wb.SheetNames[0]];
  const brutas=XLSX.utils.sheet_to_json(sheet,{header:1,raw:true,defval:''});
  const header=(brutas[2]||[]).map(h=>String(h||'').trim());
  if(!header.includes('SKU')) throw new Error('Não reconheci as colunas desse arquivo — confira se é o Relatório de Conciliação (por venda / por liberação) baixado do Mercado Livre em Vendas → Relatórios → Conciliação.');
  return brutas.slice(3).filter(l=>l&&l.some(v=>v!==''&&v!=null)).map(l=>{
    const obj={};
    header.forEach((h,i)=>{ if(h) obj[h]=l[i]; });
    return obj;
  });
}
function dataBrParaMes(s){
  const m=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(String(s||'').trim());
  return m?`${m[3]}-${m[2]}`:null;
}
function numeroCel(v){ return typeof v==='number'?v:(parseFloat(String(v||'').replace(',','.'))||0); }
function resumirConciliacaoVenda(linhas,mes){
  const doMes=linhas.filter(l=>dataBrParaMes(l['Data da operação'])===mes);
  const porTipo={}; let bruto=0,liquido=0,tarifaColuna=0,freteVendedor=0,freteVendedorBrutoTotal=0;
  doMes.forEach(l=>{
    const t=l['Tipo de operação']||'?';
    if(!porTipo[t]) porTipo[t]={qtd:0,bruto:0,liquido:0};
    const b=numeroCel(l['Valor bruto (=)']), n=numeroCel(l['Valor líquido após tarifas']);
    porTipo[t].qtd++; porTipo[t].bruto+=b; porTipo[t].liquido+=n;
    bruto+=b; liquido+=n;
    /* tarifa e frete só existem de fato pra linhas de "Venda" - somadas à parte, pra dar pra
       comparar direto com res.tarifa_real/res.frete_real da Auditoria e resumo.tarifas/
       resumo.frete.vendedor do Resumo Financeiro (pedido do Felipe 23/08: comparação 3 vias).
       CUIDADO (achado 24/08, investigando um número de tarifa 4x maior que o esperado): a coluna
       "Valor total de tarifas (desconto já aplicado)" do Mercado Livre inclui TAMBÉM as linhas de
       "Tarifa de envio extra ou intermunicipal" / "Tarifa por envio interno ao município" (frete
       cobrado do vendedor, contabilizado pelo ML como um tipo de "tarifa") - exatamente o mesmo
       valor que já aparece em "Envio pago pelo vendedor" nessas linhas. Somar a coluna de tarifa
       inteira contava o frete DUAS vezes (uma como tarifa, outra como frete). Por isso subtrai
       freteVendedor do total da coluna de tarifa pra sobrar só a comissão de venda de verdade -
       validado contra a Auditoria de julho/2026 da TorvStore (bateu em ~R$40 de diferença). */
    if(t==='Venda'){
      tarifaColuna+=numeroCel(l['Valor total de tarifas (desconto já aplicado)'])+numeroCel(l['Valor total de tarifas pós-pagas']);
      /* "Envio pago pelo vendedor" do proprio ML e' BRUTO - inclui a parte que o COMPRADOR pagou a
         mais de frete (coluna "Envio pago pelo comprador (+)"), apesar do nome sugerir que e' so'
         a sua parte. Achado 24/08 (pedido do Felipe, comparando com um pedido real): pedido
         2000017191053798, "Envio pago pelo vendedor"=R$20,94 mas "Envio pago pelo comprador
         (+)"=R$13,99 - a sua parte de verdade e' R$6,95 (20,94-13,99), confirmado batendo com o
         net_received_amount desse pedido no Mercado Pago. Mesmo bug que existia na Auditoria
         (server.js, corrigido no mesmo dia) - desconta aqui tambem. */
      const freteVendedorBruto=numeroCel(l['Envio pago pelo vendedor']);
      const freteCompradorLinha=numeroCel(l['Envio pago pelo comprador (+)']);
      freteVendedorBrutoTotal+=freteVendedorBruto;
      freteVendedor+=Math.max(0,freteVendedorBruto-freteCompradorLinha);
    }
  });
  /* a coluna de tarifa embute o frete BRUTO (nao o liquido) como se fosse uma linha de tarifa -
     por isso o cancelamento da dupla contagem tem que usar o freteVendedorBrutoTotal aqui, mesmo
     que o freteVendedor retornado abaixo (pro card/comparacao) seja o liquido. Usar o liquido
     aqui por engano (bug do dia 24/08, achado pelo Felipe comparando a tela) deixava sobrar a
     parte do comprador dentro da tarifa, inflando ela por engano. */
  const tarifa=tarifaColuna-freteVendedorBrutoTotal;
  Object.values(porTipo).forEach(x=>{ x.bruto=Math.round(x.bruto*100)/100; x.liquido=Math.round(x.liquido*100)/100; });
  /* versaoCalculo: sobe toda vez que a fórmula de tarifa/frete muda de verdade (não só ajuste de
     texto), pra dar pra avisar "esse anexo é de antes desse cálculo, suba de novo" mesmo quando o
     campo já existe mas com o valor calculado do jeito antigo/errado (ex: v1 não separava a
     tarifa de envio da comissão de venda, dava um número de tarifa ~4x maior que o real; v2 não
     descontava o frete pago pelo comprador do "Envio pago pelo vendedor", que vem bruto do ML;
     v3 corrigiu isso mas passou a usar o freteVendedor (já líquido) pra cancelar a dupla
     contagem na tarifa, quando o cancelamento precisa do valor BRUTO - inflava a tarifa). */
  return {linhasNoMes:doMes.length,linhasNoArquivo:linhas.length,porTipo,bruto:Math.round(bruto*100)/100,liquido:Math.round(liquido*100)/100,tarifa:Math.round(tarifa*100)/100,freteVendedor:Math.round(freteVendedor*100)/100,versaoCalculo:4};
}
function ultimoDiaMes(mes){
  const [y,m]=String(mes||'').split('-').map(Number);
  if(!y||!m) return '';
  return `${mes}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;
}
function resumirConciliacaoLiberacao(linhas,mes){
  const doMes=linhas.filter(l=>dataBrParaMes(l['Data da liberação'])===mes);
  const porTipo={}; let liquido=0;
  doMes.forEach(l=>{
    const t=l['Tipo de operação']||'?';
    if(!porTipo[t]) porTipo[t]={qtd:0,liquido:0};
    const n=numeroCel(l['Valor líquido após tarifas']);
    porTipo[t].qtd++; porTipo[t].liquido+=n;
    liquido+=n;
  });
  Object.values(porTipo).forEach(x=>{ x.liquido=Math.round(x.liquido*100)/100; });
  return {linhasNoMes:doMes.length,linhasNoArquivo:linhas.length,porTipo,liquido:Math.round(liquido*100)/100};
}
async function enviarAnexoAuditoria(tipo,file){
  if(!file) return;
  auditoriaAnexoEnviando=tipo; renderFinancas();
  try{
    if(!/\.xlsx$/i.test(file.name||'')) throw new Error('Suba o arquivo .xlsx baixado direto em Vendas → Relatórios → Conciliação, no Mercado Livre.');
    const linhas=await lerLinhasRelatorioConciliacao(file);
    const colChave=tipo==='venda'?'Data da operação':'Data da liberação';
    if(!linhas.length||!(colChave in linhas[0])) throw new Error(`Esse arquivo não parece ser o relatório "${ROTULO_TIPO_ANEXO[tipo]}" — confira se escolheu o botão certo.`);
    const resumo=tipo==='venda'?resumirConciliacaoVenda(linhas,auditoriaAnexoMes):resumirConciliacaoLiberacao(linhas,auditoriaAnexoMes);
    if(!resumo.linhasNoMes) throw new Error(`O arquivo não tem nenhuma linha de ${auditoriaAnexoMes} — confira se o mês selecionado bate com o período do relatório baixado.`);
    const base=backendUrl();
    if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
    const r=await fetch(`${base}/auditoria/anexo`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({loja:auditoriaLoja,mes:auditoriaAnexoMes,tipo,nomeArquivo:file.name,resumo})});
    let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+r.status+').'); }
    if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao anexar (status '+r.status+').'));
    toast('Relatório anexado — '+fmtInt(resumo.linhasNoMes)+' linha(s) de '+auditoriaAnexoMes+'.');
    carregarAnexosAuditoria(auditoriaLoja,auditoriaAnexoMes);
  }catch(e){ alert('Não foi possível anexar: '+e.message); }
  finally{ auditoriaAnexoEnviando=null; renderFinancas(); }
}

/* ================= Fluxo de Caixa (pedido do Felipe 23/08) =================
   Projeta o saldo dia a dia por loja/grupo de sócios usando só dado que o Doca já sincroniza
   sozinho: saldo disponível + agenda de liberações do Mercado Pago (mp_financeiro, sincronizado
   a cada 20min - ver sincronizarFinanceiroPeriodico) menos as despesas cadastradas ainda não
   pagas (a fatura do ML já entra aí, origem 'ml_fatura'). Não é previsão de vendas futuras, só o
   que já está garantido/comprometido de entrar e sair. Cada loja só entra com a própria despesa
   (não existe mais despesa "Geral" compartilhada - revisado 23/08). GRUPOS_CAIXA junta lojas com
   os MESMOS sócios (Felipe+Thiago), pra dar pra ver o caixa somado - a Orbix nunca entra nesse
   grupo por causa do Paulo. */
function despesasPendentesParaProjecao(lojas){
  /* fatura do ML sem vencimento real ainda (período em aberto, ML não fechou a conta) usa o
     vencimento ESTIMADO (ciclo de fechamento/vencimento por loja em FATURA_CICLO, pedido do
     Felipe 24/08) em vez do "hoje" que só serve pra bucketing na aba Despesas - ver
     vencimentoEstimadoFatura/puxarFaturaMl. Só fica de fora da projeção quando nem isso tem
     (loja sem ciclo configurado ainda). */
  return despesasArr().filter(d=>!d.pago&&lojas.includes(d.loja)&&!(d.origem==='ml_fatura'&&d.semVencimentoReal&&!d.vencimentoEstimado));
}
/* compras de produto pagas à vista (não é despesa - já sai o dinheiro na hora, na loja que o
   Felipe escolheu como pagante ao clicar "Comprei"). Pedido do Felipe 24/08: mostrar essas
   compras no Fluxo de Caixa, no dia em que o dinheiro sai de verdade. Só entram as com
   valorTotal>0 e contaPagante preenchida - produto adiantado pelo Amauri fica de fora (não
   desembolsa nada agora). */
function comprasAVistaParaProjecao(lojas){
  return (state.notasFiscais||[]).filter(n=>n.contaPagante&&lojas.includes(n.contaPagante)&&Number(n.valorTotal)>0);
}
/* Calibra saldo/a-receber ENTRE sincronizações reais usando a própria agenda de liberações que o
   Doca já tem salva: qualquer liberação agendada DEPOIS da data do último sync real (mpAtualizadoEm)
   e até hoje - ou seja, o que aconteceu no "buraco" entre a última sincronização e agora, que a
   sincronização periódica ainda não pegou - é somada ao saldo e tirada do "a receber" na hora de
   EXIBIR. Pedido do Felipe 24/08: "conforme for acontecendo os lançamentos vc vai fazendo a soma
   ou a subtração automaticamente". Não mexe no state salvo (state.financeiro) - é só conta derivada
   pra mostrar; quando a sincronização real chegar e sobrescrever tudo, volta a bater sozinho, sem
   risco de somar duas vezes.
   CORRIGIDO 27/08 (Felipe achou um caso real errado - TorvStore mostrando R$31.066,12 quando o
   saldo real no app do Mercado Pago era R$26.364,10): antes considerava "ainda não pega pela
   sincronização" QUALQUER liberação com data <= hoje, mesmo se o último sync real já tivesse
   acontecido DEPOIS dessa liberação (e portanto já refletisse ela no saldo sincronizado) - dado
   real confirmado: sync de hoje (27/08) às 11h14 trouxe saldo_disponivel=24.657,51, mas a agenda
   tinha liberação de 26/08 (3.147,02) E de 27/08 (3.261,59), ambas já tinham caído ANTES desse
   sync e portanto já estavam dentro dos 24.657,51 - a conta antiga somava elas de novo em cima,
   dobrando: 24.657,51+3.147,02+3.261,59=31.066,12, batendo exatamente com o valor errado visto.
   Agora só soma liberação com data ESTRITAMENTE DEPOIS da data do último sync (não só "<=hoje"). */
function financeiroCalibrado(loja){
  const f=finLoja(loja);
  const hojeStr=hoje();
  const agenda=f.agendaLiberacoes||[];
  let dataUltimoSync=null;
  if(f.mpAtualizadoEm){ const d=new Date(f.mpAtualizadoEm); dataUltimoSync=_dataISO(d.getFullYear(),d.getMonth(),d.getDate()); }
  /* CORRIGIDO 27/08 (2ª volta, ideia do Felipe: "saldo = última atualização + valor liberado hoje -
     o que já caiu"). O filtro antigo usava data<=hojeStr, o que tinha um buraco: quando o último
     sync tinha acontecido HOJE (dataUltimoSync===hojeStr), o item da agenda datado de hoje não
     batia nem "data<=hojeStr && data>dataUltimoSync" (falha porque hoje não é > hoje) nem entrava
     na agenda futura da tabela (que só pega data>hojeStr) - esse valor simplesmente sumia do saldo
     mostrado até o próximo sync. Agora separado em 2 buckets sem ambiguidade: jaDeviaTerCaido só
     conta dias ESTRITAMENTE ANTES de hoje (isso é sempre seguro somar ao saldo "de verdade", já
     devia ter caído há dias) e aindaHoje conta só o de hoje (ainda incerto quando exatamente cai,
     por isso fica de fora do saldo "garantido" mercadoPago e vira uma ESTIMATIVA separada de fim de
     dia - dá pra ver os dois: quanto está confirmado agora e quanto deve entrar ainda hoje). */
  const jaDeviaTerCaido=agenda.filter(x=>x.data<hojeStr&&(!dataUltimoSync||x.data>dataUltimoSync)).reduce((s,x)=>s+(Number(x.valor)||0),0);
  const aindaHoje=agenda.filter(x=>x.data===hojeStr).reduce((s,x)=>s+(Number(x.valor)||0),0);
  const mercadoPagoCalibrado=(f.mercadoPago||0)+jaDeviaTerCaido;
  /* CORRIGIDO 28/08 (Felipe mandou o extrato real da TorvStore de 27/08 pra calibrar): somar
     aindaHoje em cima do saldo sincronizado HOJE dava conta errada porque esse saldo pode já
     incluir PARTE do movimento de hoje (o relatório de saldo e o de agenda saem em horários
     diferentes do Mercado Pago) - validado no extrato real: erro de R$1.991 (6,8%). A correção,
     também validada no mesmo extrato (erro caiu pra R$24, 0,08%): somar aindaHoje em cima do
     FECHAMENTO DE ONTEM (ver fechamentoDiario em aplicarSincronizacaoFinanceira) em vez do saldo
     de hoje - fechamento de ontem por construção nunca tem nada de hoje dentro, não tem como
     contar 2x. Só calcula quando já existe o fechamento de ontem guardado (precisa 1 sync no dia
     anterior); sem isso fica null e a tela avisa em vez de mostrar um número não confiável. */
  const ontemStr=_somaDiasISO(hojeStr,-1);
  const fechamentoOntem=(f.fechamentoDiario&&f.fechamentoDiario[ontemStr]!=null)?Number(f.fechamentoDiario[ontemStr]):null;
  const saldoEstimadoFimDia=fechamentoOntem!=null?(fechamentoOntem+aindaHoje):null;
  return {
    mercadoPago:mercadoPagoCalibrado,
    aReceber:Math.max(0,(f.aReceber||0)-jaDeviaTerCaido-aindaHoje),
    agendaLiberacoes:agenda.filter(x=>x.data>hojeStr),
    mpAtualizadoEm:f.mpAtualizadoEm,
    calibrado:jaDeviaTerCaido,
    aindaHoje,
    fechamentoOntem,
    saldoEstimadoFimDia,
    /* delta que ainda falta somar HOJE na trilha Garantido/Projetado (projecaoCaixaBase) - quando
       tem fechamento de ontem, é só a diferença entre a estimativa calibrada e o saldo de hoje
       (evita somar aindaHoje inteiro em cima de um saldo que já pode ter parte dele dentro); sem
       fechamento de ontem, cai pro comportamento antigo (aindaHoje inteiro, melhor que nada). */
    deltaHojeProjecao:fechamentoOntem!=null?Math.max(0,saldoEstimadoFimDia-mercadoPagoCalibrado):aindaHoje
  };
}
/* achado 27/08 (pedido do Felipe): "geralmente os envios FULL são no meio do mês e no final (15 e
   30, ou perto disso conforme a data disponível); as compras são programadas logo depois da última
   coleta, geralmente na segunda-feira seguinte ao último envio FULL, pro envio seguinte". Acha essa
   segunda-feira "de programação de compra" a partir de uma data-âncora (envio real ou estimado). */
function segundaFeiraSeguinte(dataIso){
  const d=new Date(dataIso+'T12:00:00');
  const dow=d.getDay(); // 0=domingo...6=sábado
  const add=dow===1?7:((8-dow)%7||7); // já é segunda -> pula pra próxima semana; senão, a próxima segunda
  d.setDate(d.getDate()+add);
  return _dataISO(d.getFullYear(),d.getMonth(),d.getDate());
}
/* segundas-feiras de programação de compra dentro da janela de projeção, pra 1 loja: a primeira usa
   o PRÓXIMO envio FULL já agendado (real) se existir, senão o ÚLTIMO envio FULL já confirmado
   (passado) como âncora - marcada "estimado" nesse 2º caso. As seguintes (ciclo além do que já está
   agendado) são sempre estimadas a cada ~15 dias a partir dali, só pra não deixar a projeção "cega"
   nos ciclos futuros ainda não programados. */
function proximasSegundasDeCompra(loja,dias){
  const hojeStr=hoje();
  const limite=_somaDiasISO(hojeStr,dias);
  const datas=[];
  const prox=proximoEnvioLoja(loja);
  let ancora=prox?prox.data:null;
  let estimado=!prox;
  if(!ancora){
    const passados=enviosOrdenados().filter(e=>e.loja===loja&&e.data&&e.data<hojeStr);
    ancora=passados.length?passados[passados.length-1].data:null;
  }
  if(!ancora) return datas;
  let cursor=segundaFeiraSeguinte(ancora);
  let cicloEstimado=estimado;
  let guarda=0;
  while(cursor<=limite&&guarda<20){
    // envio que essa compra abastece: ~15 dias depois do envio-âncora do ciclo (mesmo raciocínio
    // do Felipe - "na segunda programamos a compra pro envio de daqui a uns 15 dias"). Usado pro
    // alerta de coleta (produto precisa estar coletado até 3 dias antes desse envio).
    const envioAlvo=_somaDiasISO(ancora,15);
    if(cursor>=hojeStr) datas.push({data:cursor,estimado:cicloEstimado,envioAlvo});
    ancora=envioAlvo;
    cursor=segundaFeiraSeguinte(ancora);
    cicloEstimado=true; // a partir do 2º ciclo pra frente, sempre estimado
    guarda++;
  }
  return datas;
}
/* estimativa de capital de giro pra próxima compra, ANTES de existir um pedido de compra real pra
   esse ciclo. Pedido do Felipe 27/08.
   CORRIGIDO 27/08 (3ª volta, Felipe: "os números são todos iguais estimados, não parece ter
   descontado o que eu já teria em estoque com novas compras"). A 2ª versão passou a usar
   fullCalc(i).qtd (que desconta o estoque ATUAL) - isso é certo pro PRÓXIMO ciclo (imediato),
   mas essa função era chamada do MESMO jeito pra TODOS os ciclos futuros (2º, 3º, 4º...), e
   fullCalc(i) é sempre ancorado no MESMO estoque de HOJE e no MESMO envio configurado (c.envio) -
   então repetia exatamente o mesmo número em todo ciclo futuro, o que não faz sentido (o estoque
   do 2º ciclo em diante já vai ter sido consumido pelas vendas + reposto pela compra do ciclo
   anterior, não é mais o estoque de hoje). Como não dá pra saber com precisão o estoque de um
   ciclo 2/3/4 meses no futuro (dependeria de simular a chegada+consumo de cada compra anterior),
   agora só o ciclo IMEDIATO (parâmetro imediato=true, é o único caso em que "estoque de hoje" é
   um dado real e válido) desconta o estoque via fullCalc(i).qtd. Os ciclos seguintes voltam a
   usar a demanda bruta de 15 dias (i.v15) sem desconto - é a mesma lógica de regime permanente: se
   o ciclo anterior foi comprado certo, por essa altura o estoque já deve estar baixo de novo,
   então uma "demanda de 1 ciclo" é a melhor estimativa disponível sem simular tudo.
   CORRIGIDO 27/08 (4ª volta, Felipe: "tenho 1193 de SPRAY em estoque, duraria uns 230 dias, e
   ainda assim apareceu pra comprar"). fullCalc(i).qtd só desconta o estoque que já está NO FULL
   (aptas + em transferência + próximos programados) - faz sentido pra aba FULL, que pergunta
   "quanto preciso ENVIAR pro Full" (o estoque Local é justamente de onde sai esse envio, não
   substitui ele). Mas aqui a pergunta é outra - "preciso COMPRAR mais material?" - e pra essa
   pergunta o estoque Local TAMBÉM conta (é material que já foi comprado e só está esperando ser
   enviado, comprar de novo por cima seria dobrar). Por isso o cálculo do ciclo imediato agora
   desconta local+Full juntos: pega a demanda até o próximo envio + cobertura alvo (k.dem) menos o
   estoque do Full que vai sobrar até lá (k.proj) menos o estoque Local inteiro - só o que sobrar
   disso é que precisa ser comprado de verdade.
   Devolve total E o detalhe por SKU (pedido do Felipe 27/08, pra poder mostrar de onde veio a conta
   no hover/clique do Fluxo de Caixa, em vez de só o número final).
   CORRIGIDO 28/08 (Felipe: "tenho MUITO SPRAY e CANETAAZUL em estoque, não era pra estar aparecendo
   aí pela demanda de venda" - reportado num ciclo futuro/"empurrado"). O ciclo imediato (idx 0) já
   descontava o estoque certo (ver histórico acima), mas os ciclos seguintes (2º em diante) caíam no
   fallback de demanda bruta de 15 dias (i.v15) SEM olhar pro estoque NENHUMA vez - então um item com
   estoque parado de 200+ dias (SPRAY: 1193 un., ~230 dias de cobertura) aparecia pra comprar em TODO
   ciclo futuro, com o mesmo número, como se o estoque de hoje não existisse lá na frente. Agora
   simula o estoque combinado (Full+Local) DESCENDO ciclo a ciclo (consumo = média diária × dias até
   o envio-alvo daquele ciclo), encadeado a partir do estoque real de hoje - só sugere comprar quando
   esse estoque projetado realmente cair abaixo do alvo de cobertura (k.dem), e assume que a compra
   sugerida repõe até esse alvo pra continuar a cadeia certa nos ciclos seguintes. Pra item parado
   como o SPRAY, isso zera a sugestão em todos os ciclos até o estoque projetado finalmente furar o
   alvo, lá na frente. */
function previsaoCompraEstimadaCiclos(loja,ciclos){
  const c=fullCfg();
  const curva=classificarCurvaLoja(loja);
  const porCiclo=ciclos.map(()=>({itens:[],total:0}));
  fullItensLoja(loja).forEach(i=>{
    const p=fullProduto(i);
    if(!p) return;
    const k=fullCalc(i);
    if(k.media<=0) return; // sem histórico de venda, não projeta compra futura
    const un=Number(p.unidPorCaixa)||0;
    const local=Number(p.qtd&&p.qtd.local)||0;
    // ciclo 0 (imediato): mesma conta já validada (desconta Full projetado + Local, ver acima).
    const needed0=Math.max(0,(k.dem-k.proj)-local);
    let estoque=Math.max(k.dem,(k.proj+local)); // estoque combinado após reposição do ciclo 0
    let dataAnterior=c.envio||hoje();
    ciclos.forEach((oc,idx)=>{
      let falta;
      if(idx===0){
        falta=needed0;
      }else{
        const dias=Math.max(0,diasEntre(dataAnterior,oc.envioAlvo));
        estoque-=k.media*dias;
        falta=Math.max(0,k.dem-estoque);
      }
      dataAnterior=oc.envioAlvo;
      if(falta>0.01){
        const qtd=un>0?Math.ceil(falta/un)*un:Math.ceil(falta);
        const valor=qtd*k.custo;
        if(valor>0){
          porCiclo[idx].total+=valor;
          porCiclo[idx].itens.push({sku:p.sku,unidades:falta,unidPorCaixa:un,qtd,custo:k.custo,valor,curva:curva.get(p.id)||null});
        }
        if(idx>0) estoque=Math.max(k.dem,estoque);
      }
    });
  });
  porCiclo.forEach(pc=>pc.itens.sort((a,b)=>b.valor-a.valor));
  return porCiclo;
}
/* capital de giro REAL já em pedidos de compra ativos dessa loja (mesmo número que aparece no card
   de capital de giro da Visão Geral) - assim que existir, substitui a estimativa acima pra próxima
   segunda de programação de compra. Mesmo detalhe por SKU que a estimativa, pra dar pra comparar. */
function previsaoCompraReal(loja){
  const itens=[]; let total=0;
  const curva=classificarCurvaLoja(loja);
  state.produtos.filter(p=>p.loja===loja).forEach(p=>{
    const valor=capitalGiroComprar(p);
    if(valor<=0) return;
    const un=Number(p.unidPorCaixa)||0;
    const qtd=un>0?Math.ceil((p.qtd.comprar||0)/un)*un:(p.qtd.comprar||0);
    total+=valor;
    itens.push({sku:p.sku,unidades:p.qtd.comprar||0,unidPorCaixa:un,qtd,custo:p.custo||0,valor,curva:curva.get(p.id)||null});
  });
  itens.sort((a,b)=>b.valor-a.valor);
  return {total,itens};
}
/* faturamento GROSS ainda por vir no mês corrente, pra projetar a fatura ML em aberto e o imposto
   do próximo ciclo (pedido do Felipe 27/08: "dá pra projetar em cima do faturamento projetado, tipo
   9% pra fatura ML"). Reaproveita o impostoFaturamentoBase que sincronizarImpostoDespesaMes já
   calcula e persiste todo dia pro ciclo em aberto (dado real, vindo da API do Mercado Livre, não é
   chute) - divide pelos dias já passados do mês pra achar a média diária, multiplica pelos dias que
   faltam. Só funciona depois que essa despesa já sincronizou uma vez (senão devolve null e quem
   chamar mantém o valor parcial sem projeção). */
function faturamentoProjetadoRestanteMes(loja){
  const mesAtual=mesAtualStr();
  const dImp=despesasArr().find(d=>d.origem==='imposto'&&d.loja===loja&&d.impostoRefMes===mesAtual);
  if(!dImp||!(dImp.impostoFaturamentoBase>0)) return null;
  const hojeStr=hoje();
  const diasElapsed=Math.max(1,diasEntre(`${mesAtual}-01`,hojeStr)+1);
  const diasMes=diasNoMesDe(hojeStr);
  const diasRestantes=Math.max(0,diasMes-diasElapsed);
  if(diasRestantes<=0) return 0;
  const mediaDiariaBruta=dImp.impostoFaturamentoBase/diasElapsed;
  return mediaDiariaBruta*diasRestantes;
}
function projecaoCaixaBase(lojas,dias){
  const hojeStr=hoje();
  let saldoInicial=0;
  const semSync=[];
  lojas.forEach(loja=>{ const fc=financeiroCalibrado(loja); saldoInicial+=fc.mercadoPago; if(!fc.mpAtualizadoEm) semSync.push(loja); });
  const entradas={};
  lojas.forEach(loja=>{ financeiroCalibrado(loja).agendaLiberacoes.forEach(x=>{ entradas[x.data]=(entradas[x.data]||0)+x.valor; }); });
  /* CORRIGIDO 27/08 (Felipe fez a conta na mão e bateu diferente): o "aindaHoje" (ver
     financeiroCalibrado) ficava só na "ESTIMATIVA — FIM DO DIA" isolada, sem nunca entrar na
     trilha Garantido dia-a-dia - então a partir de AMANHÃ esse dinheiro simplesmente sumia da
     tabela pra sempre (nem contava em saldoInicial, nem em nenhuma data futura), fazendo o saldo
     de amanhã em diante ficar sempre uns R$X a menos do que devia. Agora entra como "entrada" no
     próprio dia de hoje - assim que passa de hoje pra amanhã, esse valor já está "andando" no
     saldo garantido igual qualquer outra liberação agendada (o que é correto: por amanhã, algo
     agendado pra HOJE já deveria ter caído de verdade). */
  /* CORRIGIDO 28/08: usa deltaHojeProjecao (não aindaHoje inteiro) - ver financeiroCalibrado.
     Quando tem fechamento de ontem calibrado, isso evita repetir aqui a mesma dupla contagem que
     foi corrigida na Estimativa — Fim do Dia (o saldo de hoje já pode ter parte da agenda de hoje
     dentro). */
  lojas.forEach(loja=>{ const fc=financeiroCalibrado(loja); if(fc.deltaHojeProjecao>0.01) entradas[hojeStr]=(entradas[hojeStr]||0)+fc.deltaHojeProjecao; });
  const saidas={}; const saidasDetalhe={};
  /* pra cada loja, quanto falta faturar no mês (dado real, ver faturamentoProjetadoRestanteMes) -
     calculado 1x por loja aqui fora do loop de despesa, reaproveitado abaixo pra projetar a fatura
     ML em aberto e o imposto do ciclo ainda aberto (pedido do Felipe 27/08). Só entra no Projetado
     (saidasProjetadasExtra), nunca no Garantido (saidas) - o Garantido continua só com o valor
     parcial real, sem estimativa. */
  const saidasProjetadasExtra={};
  const saidasDetalheProjetado={};
  const faturamentoRestantePorLoja={};
  lojas.forEach(loja=>{ faturamentoRestantePorLoja[loja]=faturamentoProjetadoRestanteMes(loja); });
  despesasPendentesParaProjecao(lojas).forEach(d=>{
    const estimado=d.origem==='ml_fatura'&&d.semVencimentoReal&&!!d.vencimentoEstimado;
    let data=estimado?d.vencimentoEstimado:(d.dataPagamento||hojeStr);
    if(data<hojeStr) data=hojeStr;
    saidas[data]=(saidas[data]||0)+(Number(d.valor)||0);
    (saidasDetalhe[data]=saidasDetalhe[data]||[]).push({descricao:(d.descricao||'Despesa')+(estimado?' (estimado, valor parcial até agora)':''),valor:Number(d.valor)||0});
    const faturamentoRestante=faturamentoRestantePorLoja[d.loja];
    if(faturamentoRestante>0){
      let extra=0,rotuloExtra='';
      if(estimado){
        const pct=finLoja(d.loja).pctFaturaMl||0;
        if(pct>0){ extra=faturamentoRestante*(pct/100); rotuloExtra=`+ projeção fatura ML (${pct}% do faturamento restante do mês)`; }
      }else if(d.origem==='imposto'&&d.impostoRefMes===mesAtualStr()){
        const aliq=finLoja(d.loja).aliquotaImposto||0;
        if(aliq>0){ extra=faturamentoRestante*(aliq/100); rotuloExtra=`+ projeção imposto (${aliq}% do faturamento restante do mês)`; }
      }
      if(extra>0.01){
        saidasProjetadasExtra[data]=(saidasProjetadasExtra[data]||0)+extra;
        (saidasDetalheProjetado[data]=saidasDetalheProjetado[data]||[]).push({descricao:rotuloExtra+' — '+d.loja,valor:extra});
      }
    }
  });
  comprasAVistaParaProjecao(lojas).forEach(n=>{
    const data=n.dataCompra||hojeStr; if(data<hojeStr) return; /* já é história, o saldo sincronizado já reflete */
    saidas[data]=(saidas[data]||0)+(Number(n.valorTotal)||0);
    (saidasDetalhe[data]=saidasDetalhe[data]||[]).push({descricao:`Compra: ${n.sku} (${fmtInt(n.qtd)} un.)`,valor:Number(n.valorTotal)||0});
  });
  /* CORRIGIDO 27/08 (Felipe, direto depois de ver o resultado): a Previsão de Compra NÃO entra
     no saldo/saídas que viram "Saldo projetado" - fica de fora do mesmo jeito que "Compras
     pendentes" (aba Comprar) já ficava. Motivo (Felipe: "talvez não adianta ter previsão de
     comprar sem previsão de vendas também"): essa tela inteira é construída pra só contar o que
     está GARANTIDO (despesas já cadastradas, liberações já agendadas) - de propósito NÃO tenta
     prever vendas futuras (ver texto de abertura da Projeção de Saldo). A Previsão de Compra é uma
     ESTIMATIVA (não um compromisso real como uma despesa cadastrada), e empilhar só o lado do CUSTO
     estimado em cima de um saldo que já não conta a RECEITA futura correspondente deixa o número
     artificialmente mais negativo do que a realidade - dá a impressão de que vai faltar caixa,
     quando na verdade essa compra também vai gerar venda (e portanto liberação) depois. Por isso
     fica como informação separada (ver previsoesCompra abaixo), junto do saldo projetado NAQUELE
     dia sem contar essa compra - pra decidir com juízo, não pra virar parte do número "garantido". */
  const previsoesCompra=[];
  lojas.forEach(loja=>{
    const ciclosLoja=proximasSegundasDeCompra(loja,dias);
    /* uma simulação só por loja, encadeando o estoque projetado ciclo a ciclo (ver
       previsaoCompraEstimadaCiclos) - não dá pra calcular cada ciclo isolado como antes, porque o
       estoque do 2º ciclo em diante depende do que sobrou/foi reposto no ciclo anterior. */
    const estimativas=previsaoCompraEstimadaCiclos(loja,ciclosLoja);
    ciclosLoja.forEach((oc,idx)=>{
      /* só a ocorrência mais próxima pode ter pedido de compra real já gerado - as seguintes ainda
         nem chegaram no ciclo de programação, então continuam na estimativa. */
      const real=idx===0?previsaoCompraReal(loja):{total:0,itens:[]};
      const usarReal=real.total>0;
      const {total:valor,itens}=usarReal?real:estimativas[idx];
      if(valor<=0) return;
      previsoesCompra.push({loja,data:oc.data,valor,itens,real:usarReal,imediato:idx===0,envioAlvo:oc.envioAlvo||null});
    });
  });
  previsoesCompra.sort((a,b)=>a.data.localeCompare(b.data));
  const dense=[]; let saldo=saldoInicial;
  for(let i=0;i<=dias;i++){
    const d=_somaDiasISO(hojeStr,i);
    const entrou=entradas[d]||0, saiu=saidas[d]||0;
    saldo=saldo+entrou-saiu;
    dense.push({data:d,entrou,saiu,saldo,saidaDetalhe:saidasDetalhe[d]||[]});
  }
  previsoesCompra.forEach(pc=>{ const dia=dense.find(x=>x.data===pc.data); pc.saldoSemCompra=dia?dia.saldo:saldoInicial; });
  /* trilha "Projetado" (27/08, pedido do Felipe: "não adianta ter previsão de comprar sem previsão
     de vendas também" - e ele pediu explicitamente as 2 colunas, igual empresa grande faz: uma
     "garantido" (a de cima, só compromisso real) e uma "projetado" que soma venda futura estimada
     E compra futura estimada juntas, nunca uma sem a outra).
     Receita futura projetada = taxa diária de receita líquida REAL recente de cada loja (calculada
     no backend a partir do relatório de "dinheiro em conta" - ver aplicarSincronizacaoFinanceira),
     deslocada pelo prazo de liberação EMPÍRICO da própria loja (idem, calculado do relatório real -
     medido só nas linhas JÁ liberadas de verdade, não nas pendentes que mostram uma data estimada/
     conservadora antes da entrega ser confirmada; ver comentário em passoAReceberMp no server.js).
     Loja sem esses 2 dados ainda sincronizados fica de fora da receita projetada (soma 0), listada
     em semReceita pra avisar na tela. */
  const entradasProjetadas={};
  const semReceita=[];
  lojas.forEach(loja=>{
    const f=finLoja(loja);
    const taxa=Number(f.receitaDiariaMedia)||0;
    const prazo=f.prazoLiberacaoDias!=null?Number(f.prazoLiberacaoDias):null;
    if(!(taxa>0)||prazo==null){ semReceita.push(loja); return; }
    for(let i=0;i<=dias;i++){
      const dataVenda=_somaDiasISO(hojeStr,i);
      const dataLibera=_somaDiasISO(dataVenda,prazo);
      entradasProjetadas[dataLibera]=(entradasProjetadas[dataLibera]||0)+taxa;
    }
  });
  /* prioridade de Curva na Previsão de Compra (28/08, pedido do Felipe: "se no caixa projetado
     ficar negativo fazendo a compra total estimada, fazer dividido por prioridade de curva -
     comprar primeiro os curva A e depois quando o caixa fica positivo comprar o restante"):
     1) trajetória BASE do Projetado sem NENHUMA compra (garantido + receita projetada) - ponto de
        partida pra "encaixar" as compras em ordem de prioridade.
     2) processa as previsões de compra em ordem cronológica: a fatia Curva A de cada uma é
        SEMPRE lançada na data programada (prioridade - não empurra, igual a aba Comprar já
        prioriza Curva A pro caixa). A fatia "restante" (B/C/sem curva) só é lançada nessa mesma
        data se o caixa aguentar sem ficar negativo depois disso (mesma checagem usada em Compras
        Pendentes/Simulador) - senão, empurra pra primeira data seguinte (dentro da janela) em que
        aguenta, já considerando a fatia A e as compras anteriores da fila.
     3) alerta de coleta: os itens precisam estar coletados até 3 dias antes do envio FULL que
        essa compra abastece (~15 dias depois do envio-âncora do ciclo, ver proximasSegundasDeCompra
        / envioAlvo). Se o "restante" for empurrado pra depois desse prazo (ou não achar data
        nenhuma dentro da janela), marca pc.alertaColeta pra avisar na tela. */
  const denseBase=[]; let saldoBase=saldoInicial;
  for(let i=0;i<=dias;i++){
    const d=_somaDiasISO(hojeStr,i);
    const entrouProj=(entradas[d]||0)+(entradasProjetadas[d]||0);
    const saiuProj=(saidas[d]||0)+(saidasProjetadasExtra[d]||0);
    saldoBase=saldoBase+entrouProj-saiuProj;
    denseBase.push({data:d,entrou:entrouProj,saiu:saiuProj,saldo:saldoBase,receitaEstimada:entradasProjetadas[d]||0,compraEstimada:0,saidaEstimadaExtra:saidasProjetadasExtra[d]||0,saidaEstimadaDetalhe:saidasDetalheProjetado[d]||[]});
  }
  const denseWork=denseBase.map(x=>({...x}));
  const aplicarSaidaWorking=(data,valor)=>{
    denseWork.forEach(x=>{
      if(x.data===data){ x.saiu=(x.saiu||0)+valor; x.compraEstimada=(x.compraEstimada||0)+valor; }
      if(x.data>=data) x.saldo-=valor;
    });
  };
  previsoesCompra.forEach(pc=>{
    const itensA=(pc.itens||[]).filter(it=>it.curva==='A');
    const itensRestante=(pc.itens||[]).filter(it=>it.curva!=='A');
    const valorA=Math.round(itensA.reduce((s,it)=>s+it.valor,0)*100)/100;
    const valorRestante=Math.round(itensRestante.reduce((s,it)=>s+it.valor,0)*100)/100;
    pc.itensA=itensA; pc.itensRestante=itensRestante; pc.valorA=valorA; pc.valorRestante=valorRestante;
    pc.dataA=valorA>0?pc.data:null;
    if(valorA>0) aplicarSaidaWorking(pc.data,valorA);
    if(valorRestante>0){
      const janela=denseWork.filter(x=>x.data>=pc.data);
      const check=janela.length?primeiroDiaComCaixaEmDense(janela,valorRestante):null;
      pc.dataRestante=check?check.data:null;
      if(check) aplicarSaidaWorking(check.data,valorRestante);
    }else{
      pc.dataRestante=null;
    }
    pc.prazoColeta=pc.envioAlvo?_somaDiasISO(pc.envioAlvo,-3):null;
    pc.alertaColeta=valorRestante>0.01&&!!pc.prazoColeta&&(!pc.dataRestante||pc.dataRestante>pc.prazoColeta);
  });
  const denseProjetado=denseWork;
  return {saldoInicial,dense,semSync,previsoesCompra,denseProjetado,semReceita};
}
/* primeiro dia dentro da janela em que o saldo projetado aguenta esse valor SEM ficar negativo
   depois (olha o mínimo do saldo dali até o fim da janela, não só o saldo daquele dia isolado) -
   responde a pergunta "quando dá pra fazer essa compra/gasto de X reais sem faltar pra mais nada
   depois". */
function primeiroDiaComCaixaEmDense(dense,valor){
  const n=dense.length;
  const sufMin=new Array(n);
  sufMin[n-1]=dense[n-1].saldo;
  for(let i=n-2;i>=0;i--) sufMin[i]=Math.min(dense[i].saldo,sufMin[i+1]);
  for(let i=0;i<n;i++){ if(sufMin[i]>=valor) return {data:dense[i].data,saldoNaqueleDia:dense[i].saldo}; }
  return null;
}
function primeiroDiaComCaixaPara(lojas,valor,dias){
  const {dense}=projecaoCaixaBase(lojas,dias);
  return primeiroDiaComCaixaEmDense(dense,valor);
}

async function aplicarPrioridadeFechamento(resumo,loja,de,ate){
  resumo._usouAuditoria=false; resumo._usouConciliacao=false;

        resumo.tarifas=a.tarifa_real;

        resumo.frete.vendedor=a.frete_real;
        resumo._usouAuditoria=true;
      }
    }
  }catch(e){ /* falha ao checar auditoria salva - segue só com o Resumo Financeiro mesmo */ }
  try{
    const mesCandidato=de.slice(0,7);

      const r=await fetch(`${base}/auditoria/anexo?loja=${encodeURIComponent(loja)}&mes=${encodeURIComponent(mesCandidato)}`);
      const j=await r.json().catch(()=>null);

      }
    }
  }catch(e){ /* falha ao checar anexo de conciliação - segue com o que já tinha (Auditoria ou estimado) */ }
  return resumo;
}

function comprasPendentesComCaixa(loja,dense){

  const ordCurva={A:0,B:1,C:2,null:3};

    const ca=ordCurva[curva.get(a.p.id)??'null'], cb=ordCurva[curva.get(b.p.id)??'null'];
    if(ca!==cb) return ca-cb;
    return (a.c.data||'').localeCompare(b.c.data||'')||a.p.sku.localeCompare(b.p.sku);

  let denseAjustado=dense.map(x=>({...x}));

/* Relatório curto tipo "analista de fluxo de caixa" - pedido do Felipe 24/08. Interpreta a MESMA
   projeção que já alimenta a tabela (proj.dense), sem buscar nada novo - só os 3 pontos discutidos
   no chat: 1) o pior dia do período tem folga ou vai faltar (e quando); 2) a curva está subindo,
   estável ou caindo (folga crescendo ou encolhendo); 3) qual a maior saída isolada do período e se
   o caixa já acumulado até aquele dia cobre sozinho, sem depender do que entra no próprio dia. */
function analisarFluxoCaixa(proj){
  const dense=proj.dense;
  if(!dense.length) return [];
  const piorSaldo=Math.min(...dense.map(x=>x.saldo));
  const diaPior=dense.find(x=>x.saldo===piorSaldo);
  const ultimoDia=dense[dense.length-1];
  const paragrafos=[];
  if(piorSaldo<0){
    paragrafos.push(`⚠ O caixa fica negativo em <b>${fmtData(diaPior.data)}</b>, faltando <b>${fmtMoney(Math.abs(piorSaldo))}</b> pra cobrir tudo que já está previsto até lá. Precisa de uma ação antes dessa data — reforçar com saldo de outra loja, negociar prazo de alguma despesa, ou reduzir gasto (Ads costuma ser o mais rápido de cortar).`);
  }else if(piorSaldo<300||piorSaldo<proj.saldoInicial*0.15){
    paragrafos.push(`⚠ O caixa não fica negativo, mas chega bem apertado em <b>${fmtData(diaPior.data)}</b>, com só <b>${fmtMoney(piorSaldo)}</b> de folga. Qualquer imprevisto (despesa não cadastrada, liberação atrasada) pode virar o jogo — vale acompanhar de perto essa data.`);
  }else{
    paragrafos.push(`✓ O caixa se mantém positivo nos 60 dias inteiros, com no mínimo <b>${fmtMoney(piorSaldo)}</b> de folga em ${fmtData(diaPior.data)} (o dia mais apertado do período). Sem ação necessária por enquanto.`);
  }
  const variacao=ultimoDia.saldo-proj.saldoInicial;
  if(Math.abs(variacao)>Math.max(50,proj.saldoInicial*0.03)){
    paragrafos.push(variacao>0
      ?`Tendência de alta: o saldo projetado sobe de ${fmtMoney(proj.saldoInicial)} hoje pra ${fmtMoney(ultimoDia.saldo)} em ${fmtData(ultimoDia.data)} — entra mais do que sai no período.`
      :`Tendência de queda: o saldo projetado cai de ${fmtMoney(proj.saldoInicial)} hoje pra ${fmtMoney(ultimoDia.saldo)} em ${fmtData(ultimoDia.data)} — as saídas já cadastradas pesam mais que as entradas conhecidas. Vale checar se é só timing (uma despesa pontual) ou se é estrutural (ex: Ads acima do que a margem sustenta).`);
  }else{
    paragrafos.push(`O saldo projetado fica praticamente estável no período (${fmtMoney(proj.saldoInicial)} → ${fmtMoney(ultimoDia.saldo)}).`);
  }
  const eventosSaida=dense.filter(x=>x.saiu>0).sort((a,b)=>b.saiu-a.saiu);
  if(eventosSaida.length){
    const maior=eventosSaida[0];
    const idx=dense.findIndex(x=>x.data===maior.data);
    const saldoAntes=idx>0?dense[idx-1].saldo:proj.saldoInicial;
    const desc=(maior.saidaDetalhe&&maior.saidaDetalhe.length)?maior.saidaDetalhe.map(x=>x.descricao).join(', '):'saída';
    paragrafos.push(saldoAntes>=maior.saiu
      ?`A maior saída isolada do período é ${fmtMoney(maior.saiu)} em ${fmtData(maior.data)} (${esc(desc)}) — o caixa já acumulado até esse dia (${fmtMoney(saldoAntes)}) cobre sozinho, sem depender do que entra naquele mesmo dia.`
      :`A maior saída isolada do período é ${fmtMoney(maior.saiu)} em ${fmtData(maior.data)} (${esc(desc)}) — maior que o caixa acumulado até esse dia (${fmtMoney(saldoAntes)}), então parte dela só fecha com o que entra no próprio dia. É o ponto mais sensível da projeção.`);
  }
  /* notas educativas - pedido do Felipe 24/08: "pra nós que nunca mexemos com essa parte
     financeira, era legal colocar mais alguma informação no relatório pra ir aprendendo". Duas
     notas: 1) o "fôlego em dias" (régua clássica de saúde de caixa: quantos dias o saldo de hoje
     aguenta se NINGUÉM mais comprasse nada) calculado de verdade em cima do período; 2) a
     diferença entre fluxo de caixa e lucro, que é a confusão mais comum de quem tá começando a
     olhar pra esse número. */
  const totalSaidasPeriodo=dense.reduce((s,x)=>s+x.saiu,0);
  const mediaSaidaDia=totalSaidasPeriodo/dense.length;
  if(mediaSaidaDia>0){
    const folegoDias=Math.floor(proj.saldoInicial/mediaSaidaDia);
    paragrafos.push(`📚 <b>Fôlego de caixa:</b> se nenhuma venda nova entrasse a partir de hoje, o saldo atual aguentaria pagar as saídas médias do período por cerca de <b>${folegoDias} dia(s)</b> antes de zerar. Não é uma previsão real (as vendas seguem acontecendo todo dia) — é só uma régua de segurança: quanto maior esse número, mais gordura a loja tem pra aguentar um imprevisto sem passar aperto.`);
  }
  paragrafos.push(`📚 <b>Fluxo de caixa não é a mesma coisa que lucro:</b> lucro é "quanto sobra no papel" (venda menos custo). Fluxo de caixa é "quando o dinheiro realmente cai e sai da conta". Dá pra estar tendo lucro e mesmo assim ficar apertado num dia específico, só porque uma conta grande (como a fatura do Mercado Livre) venceu antes do dinheiro das vendas correspondentes ter sido liberado pelo Mercado Pago. É exatamente esse descompasso de tempo que essa tela tenta antecipar — não é sobre se a loja é lucrativa, é sobre QUANDO o dinheiro está disponível.`);
  return paragrafos;
}
/* Auditoria de calibração Garantido x Projetado (27/08, pedido do Felipe: "como vamos auditar

const CHECKPOINTS_PREVISAO_CAIXA=[7,15,30,60];
function escoposAuditoriaCaixa(){

function garantirSnapshotsProjecaoCaixaHoje(){
  if(!Array.isArray(state.previsaoCaixaHistorico)) state.previsaoCaixaHistorico=[];
  const hist=state.previsaoCaixaHistorico;
  const hojeStr=hoje();
  let mudou=false;
  escoposAuditoriaCaixa().forEach(esc=>{
    if(hist.some(h=>h.feitoEm===hojeStr&&h.escopo===esc.chave)) return;
    const lojas=esc.chave==='todas'?STORES.slice():[esc.chave];
    const proj=projecaoCaixaBase(lojas,Math.max(...CHECKPOINTS_PREVISAO_CAIXA));
    CHECKPOINTS_PREVISAO_CAIXA.forEach(dias=>{
      const g=proj.dense[dias],p=proj.denseProjetado[dias];
      if(!g||!p) return;
      hist.push({feitoEm:hojeStr,escopo:esc.chave,dias,dataAlvo:g.data,saldoGarantido:g.saldo,saldoProjetado:p.saldo,avaliado:false});
    });
    mudou=true;
  });
  /* avalia snapshots cuja data-alvo já chegou, comparando com o saldo real de HOJE (aproximação -
     se o Doca só for aberto dias depois da data-alvo, usa o saldo real de quando finalmente
     avaliar, não o saldo exato daquele dia específico, mas na prática o app roda quase todo dia). */
  hist.forEach(h=>{
    if(h.avaliado||h.dataAlvo>hojeStr) return;
    const lojas=h.escopo==='todas'?STORES.slice():[h.escopo];
    const real=lojas.reduce((s,l)=>s+financeiroCalibrado(l).mercadoPago,0);
    h.avaliado=true; h.realNaData=real;
    h.erroGarantido=real-h.saldoGarantido;
    h.erroProjetado=real-h.saldoProjetado;
    mudou=true;
  });
  if(hist.length>2000){ state.previsaoCaixaHistorico=hist.slice(-2000); mudou=true; }
  if(mudou){ saveToLocalStorage(); if(typeof nuvemAuth!=='undefined'&&nuvemAuth&&typeof salvarNaNuvem==='function') salvarNaNuvem(); }
  return mudou;
}
function resumoAuditoriaCaixa(escopoChave){
  const hist=(state.previsaoCaixaHistorico||[]).filter(h=>h.escopo===escopoChave&&h.avaliado);
  return CHECKPOINTS_PREVISAO_CAIXA.map(dias=>{
    const itens=hist.filter(h=>h.dias===dias);
    if(!itens.length) return {dias,n:0};
    const mediaErroG=itens.reduce((s,h)=>s+h.erroGarantido,0)/itens.length;
    const mediaErroP=itens.reduce((s,h)=>s+h.erroProjetado,0)/itens.length;
    const mediaAbsG=itens.reduce((s,h)=>s+Math.abs(h.erroGarantido),0)/itens.length;
    const mediaAbsP=itens.reduce((s,h)=>s+Math.abs(h.erroProjetado),0)/itens.length;
    return {dias,n:itens.length,mediaErroG,mediaErroP,mediaAbsG,mediaAbsP,ultimos:itens.slice(-5).reverse()};
  });
}

/* fechamento de todas as lojas de uma vez, no MESMO periodo escolhido no Resumo Financeiro acima -
   busca /financas/resumo loja por loja (com uma pequena pausa entre elas pra nao estourar limite
   de chamadas por segundo) e monta um relatorio pra impressao comparando faturamento, margem de
   contribuicao, lucro bruto e margem liquida entre as lojas. */
async function calcularFechamentoTodasLojas(){
  if(financasFechTodasCarregando) return;
  /* v (19/08, 2a revisão a pedido do Felipe): sem aba nova nenhuma - o vídeo toca em tela cheia
     na PRÓPRIA aba do Doca (só assim o navegador libera autoplay com som - uma aba nova aberta
     via window.open nunca recebe o clique nela mesma, então fica mudo/congelado) e, quando o
     relatório fica pronto, ele substitui a página inteira NESSA MESMA aba (ver
     imprimirRelatorioFechamentoTodasLojas) - pra voltar pro Doca depois, é só usar o botão
     "voltar" do navegador. */
  mostrarOverlayVideoCarregando();
  financasFechTodasCarregando=true; financasFechTodasErro=null; financasFechTodasProgresso={feito:0,total:STORES.length,etapa:''}; renderFinancas();
  try{
    if(financasResumoPeriodo==='personalizado'&&(!financasResumoDe||!financasResumoAte)) throw new Error('Informe as duas datas do período personalizado.');
    const resultados=[];
    for(let i=0;i<STORES.length;i++){
      const loja=STORES[i];
      let resumo=await fetchResumoJob(loja,financasResumoPeriodo,financasResumoDe,financasResumoAte,(p)=>{
        financasFechTodasProgresso={feito:i,total:STORES.length,etapa:`${loja}: ${p&&p.etapa?p.etapa:''} (${p?p.feito:0}%)`};
        renderFinancas();
        // progresso geral = lojas já concluídas + fração da loja atual (0-100% dela), pedido do
        // Felipe 20/08: barra de progresso em tempo real por cima do vídeo de loading
        atualizarOverlayProgresso(((i+(p&&p.feito?p.feito/100:0))/STORES.length)*100);
      });
      // usa dado confirmado (Conciliação/Auditoria) em vez do estimado, sempre que já tiver pro
      // mesmo período exato resolvido pelo backend (ver aplicarPrioridadeFechamento) - reaproveita
      // o resumo já buscado acima, sem precisar buscar tudo de novo.
      resumo=await aplicarPrioridadeFechamento(resumo,loja,resumo.periodo.de,resumo.periodo.ate);
      const m=calcularMargensResumo(resumo,loja);
      // fechamento de sócios da mesma loja/período, junto no mesmo relatório (pedido do Felipe
      // 23/08: "na teoria é o mesmo relatório") - TorvShop (papel 'reserva') não retira, fica só
      // com a margem líquida como referência.
      let porSocio=null,baseSocios=null,geralMesSocios=0;
      const mesSocios=resumo.periodo.de.slice(0,7);
      if(PAPEL_CAIXA_LOJA[loja]!=='reserva'){
        const bd=baseDistribuivelLoja(loja,m.margemLiquida,mesSocios);
        baseSocios=bd.base; geralMesSocios=bd.geralMes;
        const socios=sociosDaLoja(loja);
        const ownership=OWNERSHIP_LOJA[loja]||{};
        porSocio=socios.map(s=>{
          const lista=movimentosSocioMes(loja,s,mesSocios);
          const retirou=totalPorTipo(lista,'retirada');
          const reembolso=totalPorTipo(lista,'reembolso');
          const pct=ownership[s]||0;
          const cota=baseSocios*(pct/100);
          const ajuste=cota-retirou+reembolso;
          return {socio:s,pct,cota,retirou,reembolso,ajuste};
        });
      }
      resultados.push({loja,resumo,m,porSocio,baseSocios,geralMesSocios});
      financasFechTodasProgresso={feito:i+1,total:STORES.length,etapa:`${loja} concluída`};
      renderFinancas();
      atualizarOverlayProgresso(((i+1)/STORES.length)*100);
      await sleep(150);
    }
    // relatório pronto - substitui a página inteira NESSA aba (document.write dentro da função
    // abaixo derruba o app do Doca dessa aba, então nada depois disso precisa (nem consegue)
    // rodar de forma visível - por garantia zera os estados antes de sair)
    financasFechTodasCarregando=false; financasFechTodasProgresso=null;
    imprimirRelatorioFechamentoTodasLojas(resultados);
    return;
  }catch(e){
    financasFechTodasErro=e.message;
  }
  financasFechTodasCarregando=false; financasFechTodasProgresso=null; renderFinancas(); esconderOverlayVideoCarregando();
}
/* overlay do vídeo de loading, sobre a própria tela do Doca - tela cheia, barra de progresso
   em cima (pedido do Felipe 20/08 - antes estava embaixo) */
let overlayProgressoReal=0, overlayProgressoExibido=0, overlayProgressoTrickleTimer=null;
function mostrarOverlayVideoCarregando(){
  esconderOverlayVideoCarregando();
  overlayProgressoReal=0; overlayProgressoExibido=0;
  const div=document.createElement('div');
  div.id='overlayVideoCarregando';
  div.style.cssText='position:fixed;inset:0;z-index:99999;background:#0A0418;display:flex;align-items:center;justify-content:center';
  /* pedido do Felipe 20/08: no celular o vídeo continua ocupando a tela inteira (comportamento
     original), mas no computador (telas largas) ele ficava esticado/cortado de forma estranha
     porque o vídeo é vertical (formato de celular, 478x850). A partir de 700px de largura, o
     vídeo passa a ficar num quadro no formato de celular, centralizado, em vez de esticar pra
     tela toda. */
  div.innerHTML=`<style>
      #overlayVideoCarregando .video-fechamento-frame{position:relative;width:100%;height:100%}
      @media (min-width:700px){
        #overlayVideoCarregando .video-fechamento-frame{width:auto;height:min(88vh,850px);aspect-ratio:478/850;border-radius:18px;overflow:hidden;box-shadow:0 24px 70px -20px rgba(0,0,0,.85)}
      }
    </style>
    <div class="video-fechamento-frame">
      <video id="videoCarregandoFechamento" playsinline loop style="width:100%;height:100%;object-fit:cover;display:block" src="${backendUrl()}/loading-video.mp4?v=2"></video>
      <div style="position:absolute;left:0;right:0;top:0;padding:calc(18px + env(safe-area-inset-top)) 22px 18px;background:linear-gradient(180deg,rgba(0,0,0,.65),transparent)">
        <div style="height:6px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden">
          <div id="barraProgressoFechamento" style="height:100%;width:0%;background:#fff;border-radius:99px;transition:width .35s linear"></div>
        </div>
        <div id="pctProgressoFechamento" style="margin-top:8px;color:#fff;font-size:13px;font-weight:600;text-align:center">0%</div>
      </div>
    </div>`;
  document.body.appendChild(div);
  const v=document.getElementById('videoCarregandoFechamento');
  if(v){ v.play().catch(()=>{}); }
  /* "trickle": pedido do Felipe 20/08 (ficava muito tempo parado no mesmo número entre uma
     atualização real e outra, ex. durante o cálculo de frete de uma loja com muitos envios) -
     a cada 400ms avança um pouquinho sozinha, sem nunca ultrapassar 4 pontos à frente do último
     progresso REAL recebido nem passar de 97% (os últimos % só aparecem quando a loja realmente
     terminar) - dá sensação de continuidade sem inventar progresso que não existe. */
  overlayProgressoTrickleTimer=setInterval(()=>{
    const teto=Math.min(97,overlayProgressoReal+4);
    if(overlayProgressoExibido<teto){ overlayProgressoExibido=Math.min(teto,overlayProgressoExibido+0.6); pintarOverlayProgresso(); }
  },400);
}
function pintarOverlayProgresso(){
  const barra=document.getElementById('barraProgressoFechamento');
  const texto=document.getElementById('pctProgressoFechamento');
  if(!barra||!texto) return;
  const p=Math.round(overlayProgressoExibido);
  barra.style.width=p+'%';
  texto.textContent=p+'%';
}
/* recebe o progresso REAL (ver chamadas em calcularFechamentoTodasLojas) - o trickle acima só
   preenche o tempo ATÉ aqui, nunca ultrapassa o que já foi confirmado de verdade */
function atualizarOverlayProgresso(pct){
  const p=Math.max(0,Math.min(100,pct||0));
  if(p>overlayProgressoReal) overlayProgressoReal=p;
  if(p>overlayProgressoExibido){ overlayProgressoExibido=p; pintarOverlayProgresso(); }
}
function esconderOverlayVideoCarregando(){
  if(overlayProgressoTrickleTimer){ clearInterval(overlayProgressoTrickleTimer); overlayProgressoTrickleTimer=null; }
  const el=document.getElementById('overlayVideoCarregando');
  if(el){ const v=el.querySelector('video'); if(v){ try{v.pause();}catch(e){} } el.remove(); }
}
/* relatório de fechamento de todas as lojas - pedido do Felipe 19/08: incluir pedidos/unidades
   por loja, somatória geral, e lista dos produtos vendidos com quantidade. Vai ser visto no
   celular, então o layout é mobile-first (cards empilhados em vez de tabela larga fixa; tabela
   de produtos só tem 3 colunas estreitas, cabe numa tela de celular sem rolar pro lado).
   v (19/08, 2a revisão): não abre mais aba nova - escreve DIRETO na aba atual (win=window),
   substituindo o Doca pelo relatório nessa mesma aba (pedido do Felipe). */
function imprimirRelatorioFechamentoTodasLojas(resultados){
  const win=window;
  const porLoja=resultados.map(r=>{
    const unidades=(r.resumo.itensVendidos||[]).reduce((s,it)=>s+(it.qtd||0),0);
    const aliquotaLoja=finLoja(r.loja).aliquotaImposto||0;
    const produtos=(r.resumo.itensVendidos||[]).slice().sort((a,b)=>b.qtd-a.qtd).map(it=>{
      const p=state.produtos.find(x=>x.mlItemId===it.itemId);
      /* sinal verde de "dentro da meta de Ads" por produto - pedido do Felipe 20/08: mesma regra
         já usada no Resumo Financeiro (ver renderResumoFinanceiroResultado) - meta = 1/3 da
         Margem de Contribuição do produto no período. Só marca quando o produto teve Ads gasto
         de fato E a Margem de Contribuição é positiva. */
      const custoUnit=p&&p.custo?p.custo:0;
      const custoProdutoItem=custoUnit*(it.qtd||0);
      const impostoItem=(it.valor||0)*((aliquotaLoja||0)/100);
      const margemContribItem=(it.valor||0)-custoProdutoItem-(it.tarifa||0)-(it.freteMl||0)-impostoItem;
      const adsAchado=p?adsGastoAutoProduto(p,r.resumo):null;
      /* UNIFICADO 02/09: mesmo criterio da aba Ads (ver metaTacosUnit) - margem unitaria pelo
         preco do anuncio, meta = 1/3. Se nao der pra calcular pelo anuncio, cai na margem do
         periodo, como era antes. */
      const metaIt=tetoAdsDoItem(p,aliquotaLoja,it);
      const dentroMetaAds=adsAchado!=null&&(metaIt?adsAchado<=metaIt.teto
        :(margemContribItem>0&&adsAchado<=margemContribItem/3));
      return {nome:(p&&p.sku)?p.sku:it.itemId,qtd:it.qtd||0,valor:it.valor||0,adsAchado,dentroMetaAds};
    });
    const gastoAds=r.resumo.ads&&r.resumo.ads.custo||0;
    const margemPosAds=r.m.margem-gastoAds;
    /* só no relatório de fechamento (não na tela de Finanças) - pedido do Felipe 19/08: mostrar
       as DUAS versões da Margem Líquida lado a lado. "custo total" desconta despesas + fatura ML
       do MÊS INTEIRO em valor cheio. "rateada" pega esse mesmo total e divide pelos dias do mês,
       multiplicando pelos dias do período - útil quando o período é curto (ex: "Hoje") e não faz
       sentido comparar 1 dia de faturamento com o custo mensal inteiro. CORRIGIDO 26/08 (2a vez,
       pedido do Felipe): agora rateia despesas e fatura ML igual (calculado dentro de
       calcularMargensResumo) - antes só a fatura ML era rateada, então com período "Hoje" uma
       despesa mensal inteira caía sobre 1 dia de faturamento e dava número sem sentido. */
    return {loja:r.loja,pedidos:r.resumo.pedidosValidos||0,unidades,faturamento:r.resumo.faturamento,margem:r.m.margem,margemPosAds,gastoAds,margemLiquidaTotal:r.m.margemLiquida,margemLiquidaRateada:r.m.margemLiquidaRateada,produtos,unidSemCusto:r.m.unidSemCusto||0,porSocio:r.porSocio,fonte:rotuloFonteFechamento(r.resumo),
      // guardado só pra mostrar o detalhamento embaixo dos cards (diagnóstico visual - pedido do
      // Felipe 26/08 pra conseguir ver DE ONDE vem cada dedução sem precisar bater conta manual)
      custosPeriodo:r.m.custosPeriodo,faturaMlPeriodo:r.m.faturaMlPeriodo,custosRateado:r.m.custosRateado,faturaMlRateada:r.m.faturaMlRateada,mesDe:r.m.mesDe,mesAte:r.m.mesAte,diasMes:r.m.diasMes,diasSel:r.m.diasSel};
  });
  // total consolidado por sócio, somando a cota (e subtraindo retirada/reembolso) de TODAS as
  // lojas que ele participa - pedido do Felipe 23/08: "trate como separado e depois subtraia de
  // felipe e thiago respectivo" - não é mais um ajuste isolado por loja.
  const totalPorSocio={};
  porLoja.forEach(r=>{ (r.porSocio||[]).forEach(p=>{ totalPorSocio[p.socio]=(totalPorSocio[p.socio]||0)+p.ajuste; }); });
  const linhaAjusteTxt=ajuste=>ajuste>0.004
    ?`<span style="color:var(--ok)">Pagamento de <b>${fmtMoney(ajuste)}</b></span>`
    :(ajuste<-0.004?`<span style="color:var(--danger)">Devolve <b>${fmtMoney(-ajuste)}</b></span>`:'<span class="vazio">Já equilibrado</span>');
  const totalPedidos=porLoja.reduce((s,r)=>s+r.pedidos,0);
  const totalUnidades=porLoja.reduce((s,r)=>s+r.unidades,0);
  const totalFat=porLoja.reduce((s,r)=>s+r.faturamento,0);
  const totalMargem=porLoja.reduce((s,r)=>s+r.margem,0);
  const totalMargemPosAds=porLoja.reduce((s,r)=>s+r.margemPosAds,0);
  const totalGastoAds=porLoja.reduce((s,r)=>s+r.gastoAds,0);
  const totalMargemLiquidaTotal=porLoja.reduce((s,r)=>s+r.margemLiquidaTotal,0);
  const totalMargemLiquidaRateada=porLoja.reduce((s,r)=>s+r.margemLiquidaRateada,0);
  const rotulos={hoje:'Hoje','7d':'Últimos 7 dias','15d':'Últimos 15 dias','30d':'Últimos 30 dias',mes_corrente:'Mês corrente',personalizado:fmtData(financasResumoDe)+' a '+fmtData(financasResumoAte)};
  const rotuloPeriodo=rotulos[financasResumoPeriodo]||financasResumoPeriodo;
  const metrica=(lbl,val,neg,pctVal)=>`<div class="metric"><div class="lbl">${lbl}</div><div class="val${neg?' neg':''}">${val}</div>${pctVal!=null?`<div class="pctv">${pctVal.toFixed(1)}% do faturamento</div>`:''}</div>`;
  const pctDe=(v,fat)=>fat>0?(v/fat*100):0;
  const cardLoja=r=>`<div class="loja-card">
      <h2>${esc(r.loja)}</h2>
      <div class="metrics">
        ${metrica('Pedidos',fmtInt(r.pedidos))}
        ${metrica('Unidades vendidas',fmtInt(r.unidades))}
        ${metrica('Faturamento',fmtMoney(r.faturamento))}
        ${metrica('Margem Contribuição',fmtMoney(r.margem),r.margem<0,pctDe(r.margem,r.faturamento))}
        ${metrica('Margem pós Ads',fmtMoney(r.margemPosAds),r.margemPosAds<0,pctDe(r.margemPosAds,r.faturamento))}
        ${metrica('Gasto em Ads',fmtMoney(r.gastoAds),false,pctDe(r.gastoAds,r.faturamento))}
        ${metrica('Margem Líquida (rateada)',fmtMoney(r.margemLiquidaRateada),r.margemLiquidaRateada<0,pctDe(r.margemLiquidaRateada,r.faturamento))}
        ${metrica('Margem Líquida (custo total)',fmtMoney(r.margemLiquidaTotal),r.margemLiquidaTotal<0,pctDe(r.margemLiquidaTotal,r.faturamento))}
      </div>
      <p class="vazio" style="margin-top:2px">Descontado da Margem de Contribuição — mês de ${esc(r.mesDe)} a ${esc(r.mesAte)} (${r.diasMes} dias): despesas <b>${fmtMoney(r.custosPeriodo)}</b> + fatura ML <b>${fmtMoney(r.faturaMlPeriodo)}</b> = <b>${fmtMoney(r.custosPeriodo+r.faturaMlPeriodo)}</b> (valor cheio, usado na "custo total"). Rateado pros ${r.diasSel} dia(s) do período selecionado: <b>${fmtMoney(r.custosRateado+r.faturaMlRateada)}</b> (usado na "rateada").</p>
      ${r.unidSemCusto>0?`<p class="vazio" style="color:var(--danger)">⚠ ${fmtInt(r.unidSemCusto)} unidade(s) vendida(s) sem custo cadastrado neste aparelho — a margem acima está inflada (entrando como custo R$ 0). Cadastre o custo em Produtos e gere o relatório de novo.</p>`:''}
      ${r.produtos.length?`<div class="tbl-scroll"><table><thead><tr><th>Produto</th><th class="n">Qtd</th><th class="n">Faturamento</th><th class="n">Ads</th></tr></thead><tbody>
        ${r.produtos.map(p=>`<tr><td>${esc(p.nome)}${p.dentroMetaAds?' <span style="color:var(--ok)">✓</span>':''}</td><td class="n">${fmtInt(p.qtd)}</td><td class="n">${fmtMoney(p.valor)}</td><td class="n">${p.adsAchado==null?'—':fmtMoney(p.adsAchado)}</td></tr>`).join('')}
      </tbody></table></div>`:`<p class="vazio">Nenhuma venda no período.</p>`}
      ${r.porSocio?`<h3 style="font-size:12.5px;margin:14px 0 8px;color:var(--violet-l)">Sócios${r.fonte?` · ${esc(r.fonte)}`:''}</h3>
        <div class="tbl-scroll"><table><thead><tr><th>Sócio</th><th class="n">Cota</th><th class="n">Retirou</th><th class="n">Reembolso</th></tr></thead><tbody>
          ${r.porSocio.map(p=>`<tr><td>${NOME_SOCIO[p.socio]} (${p.pct.toFixed(p.pct%1?2:0)}%)</td><td class="n">${fmtMoney(p.cota)}</td><td class="n">${fmtMoney(p.retirou)}</td><td class="n">${fmtMoney(p.reembolso)}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="vazio" style="margin-top:6px">Ajuste de pagar/devolver é consolidado no total por sócio, no fim do relatório (soma todas as lojas).</p>`
      :`<p class="vazio" style="margin-top:10px">Loja de reserva/reinvestimento — sem retirada de sócio.</p>`}
    </div>`;
  win.document.open();
  win.document.write(`<!doctype html><html><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fechamento — Todas as Lojas</title>
    <style>${relatorioDarkCss()}
      .metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-bottom:12px}
      .metric .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
      .metric .val{font-size:17px;font-weight:700;margin-top:3px;color:var(--ok)}
      .metric .val.neg{color:var(--danger)}
      .metric .pctv{font-size:10.5px;color:var(--muted);margin-top:1px}
      .tot-card h2{border:none;margin-bottom:12px;padding:0;color:var(--violet-l)}
      @media (min-width:560px){ .metrics{grid-template-columns:repeat(3,1fr)} }
    </style></head><body>
    <h1>Fechamento Financeiro — Todas as Lojas</h1>
    <div class="sub">Período: ${esc(rotuloPeriodo)} · Gerado em ${new Date().toLocaleString('pt-BR')}</div>
    ${porLoja.map(cardLoja).join('')}
    <div class="tot-card">
      <h2>Total — Todas as Lojas</h2>
      <div class="metrics">
        ${metrica('Pedidos',fmtInt(totalPedidos))}
        ${metrica('Unidades vendidas',fmtInt(totalUnidades))}
        ${metrica('Faturamento',fmtMoney(totalFat))}
        ${metrica('Margem Contribuição',fmtMoney(totalMargem),totalMargem<0,pctDe(totalMargem,totalFat))}
        ${metrica('Margem pós Ads',fmtMoney(totalMargemPosAds),totalMargemPosAds<0,pctDe(totalMargemPosAds,totalFat))}
        ${metrica('Gasto em Ads',fmtMoney(totalGastoAds),false,pctDe(totalGastoAds,totalFat))}
        ${metrica('Margem Líquida (rateada)',fmtMoney(totalMargemLiquidaRateada),totalMargemLiquidaRateada<0,pctDe(totalMargemLiquidaRateada,totalFat))}
        ${metrica('Margem Líquida (custo total)',fmtMoney(totalMargemLiquidaTotal),totalMargemLiquidaTotal<0,pctDe(totalMargemLiquidaTotal,totalFat))}
      </div>
    </div>
    <div class="tot-card">
      <h2>Total a receber/devolver por sócio (todas as lojas)</h2>
      ${Object.keys(totalPorSocio).map(s=>`<div style="margin:6px 0">${NOME_SOCIO[s]||s}: ${linhaAjusteTxt(totalPorSocio[s])}</div>`).join('')}
    </div>
    ${relatorioShareBoxHtml()}
    <div class="gerado">Doca · Abastecimento Full · Mercado Livre</div>
    <script>${relatorioShareScript('Fechamento Doca')}<\/script>
    </body></html>`);
  win.document.close();
}
/* DRE + DFC por loja (27/08, pedido do Felipe) - separado do fechamento das 4 lojas: reaproveita o
   MESMO resumo/margens (calcularMargensResumo = a base do DRE) e ACRESCENTA:
   1) DFC (Demonstrativo de Fluxo de Caixa) do período - só dinheiro que REALMENTE já
      entrou/saiu, não lucro contábil. Entrada: como o Doca não guarda um histórico dia a dia do
      saldo do Mercado Pago, estima usando um SEGUNDO resumo de vendas deslocado pelo prazo real de
      liberação da própria loja (ex: prazo 8 dias, período 01-10/09 -> busca vendas de 24/08-02/09,
      que são as que estariam liberando agora), líquido de tarifa/frete vendedor (mesma dedução que
      vira SETTLEMENT_NET_AMOUNT no relatório do Mercado Pago). Loja sem prazo sincronizado ainda
      fica sem essa estimativa (mostra aviso, não inventa número). Saída: despesas MARCADAS COMO
      PAGAS com vencimento no período (todas as origens — diferente do DRE, que separa fatura
      ML/imposto pra não descontar 2x) + retiradas de sócio já efetivadas no período. Reembolso NÃO
      entra aqui — confirmado com o Felipe 27/08: reembolso é uma dívida da empresa com o sócio (ele
      pagou do próprio bolso) que só vira caixa de verdade quando for de fato devolvido no
      fechamento, não no dia em que foi lançado.
   2) Análise: lucro (DRE) x caixa (DFC) do período, mais o mesmo "fôlego" que já existe no Fluxo de
      Caixa (projecaoCaixaBase Garantido, 60 dias).
   3) Sugestão de retirada: reaproveita o MESMO ajuste por sócio do fechamento das 4 lojas
      (cota-retirou+reembolso, pra não divergir de um relatório pro outro) e enfileira contra o
      Garantido dos próximos 90 dias (mesma função primeiroDiaComCaixaEmDense usada em Compras
      Pendentes) — cada sócio na fila já considera que o(s) anterior(es) reservaram a fatia deles. */
async function calcularRelatorioDreDfc(){
  if(financasDreDfcCarregando) return;
  mostrarOverlayVideoCarregando();
  financasDreDfcCarregando=true; financasDreDfcErro=null; financasDreDfcProgresso={feito:0,total:STORES.length,etapa:''}; renderFinancas();
  try{
    if(financasResumoPeriodo==='personalizado'&&(!financasResumoDe||!financasResumoAte)) throw new Error('Informe as duas datas do período personalizado.');
    const resultados=[];
    for(let i=0;i<STORES.length;i++){
      const loja=STORES[i];
      let resumo=await fetchResumoJob(loja,financasResumoPeriodo,financasResumoDe,financasResumoAte,(p)=>{
        financasDreDfcProgresso={feito:i,total:STORES.length,etapa:`${loja}: ${p&&p.etapa?p.etapa:''} (${p?p.feito:0}%)`};
        renderFinancas();
        atualizarOverlayProgresso(((i+(p&&p.feito?p.feito/100:0))/STORES.length)*100);
      });
      resumo=await aplicarPrioridadeFechamento(resumo,loja,resumo.periodo.de,resumo.periodo.ate);
      const m=calcularMargensResumo(resumo,loja);
      // comparação com o período anterior equivalente (28/08, pedido do Felipe) - mesmo padrão já
      // usado no Resumo Financeiro (periodoAnteriorEquivalente/badge), só que aqui via fetchResumoJob
      // (espera o job terminar de verdade) em vez do fetch direto, pra não pegar resultado parcial.
      let mAnt=null,resumoAnt=null;
      try{
        const {de:anDe,ate:anAte}=periodoAnteriorEquivalente(resumo.periodo.de,resumo.periodo.ate);
        resumoAnt=await fetchResumoJob(loja,'personalizado',anDe,anAte,(p)=>{
          financasDreDfcProgresso={feito:i,total:STORES.length,etapa:`${loja}: comparando com período anterior (${p?p.feito:0}%)`};
          renderFinancas();
        });
        mAnt=calcularMargensResumo(resumoAnt,loja);
      }catch(e){ mAnt=null; resumoAnt=null; }
      // imposto (28/08, pedido do Felipe) - status do imposto JÁ REGISTRADO (base no faturamento do
      // mês anterior ao período do relatório, vencimento dia 20) + quanto está ACUMULANDO agora pro
      // próximo (m.impostoCalc, já calculado acima em cima do faturamento deste período mesmo).
      const refMesImposto=mesAnteriorStr(m.mesDe.slice(0,7));
      const despesaImposto=despesasArr().find(d=>d.origem==='imposto'&&d.loja===loja&&d.impostoRefMes===refMesImposto)||null;
      // DFC - entradas estimadas (venda deslocada pelo prazo real de liberação da loja)
      const prazoDias=finLoja(loja).prazoLiberacaoDias!=null?Number(finLoja(loja).prazoLiberacaoDias):null;
      let entradasCaixa=null,periodoEntradas=null;
      if(prazoDias!=null){
        const deSloc=_somaDiasISO(resumo.periodo.de,-prazoDias), ateSloc=_somaDiasISO(resumo.periodo.ate,-prazoDias);
        try{
          const resumoEntradas=await fetchResumoJob(loja,'personalizado',deSloc,ateSloc,(p)=>{
            financasDreDfcProgresso={feito:i,total:STORES.length,etapa:`${loja}: estimando entrada de caixa (${p?p.feito:0}%)`};
            renderFinancas();
          });
          entradasCaixa=Math.max(0,(resumoEntradas.faturamento||0)-(resumoEntradas.tarifas||0)-((resumoEntradas.frete&&resumoEntradas.frete.vendedor)||0));
          periodoEntradas={de:deSloc,ate:ateSloc};
        }catch(e){ entradasCaixa=null; }
      }
      // DFC - saídas reais: despesas JÁ PAGAS com vencimento no período (qualquer origem) + retiradas
      // de sócio já efetivadas no período (reembolso fica de fora - ver comentário acima)
      const despesasPagas=despesasArr().filter(d=>d.loja===loja&&d.pago&&d.dataPagamento&&d.dataPagamento>=resumo.periodo.de&&d.dataPagamento<=resumo.periodo.ate).reduce((s,d)=>s+(Number(d.valor)||0),0);
      let retiradasPeriodo=0;
      if(PAPEL_CAIXA_LOJA[loja]!=='reserva'){
        sociosDaLoja(loja).forEach(s=>{
          (sociosLoja(loja)[s]||[]).forEach(mv=>{
            if(mv.tipo==='retirada'&&mv.data&&mv.data>=resumo.periodo.de&&mv.data<=resumo.periodo.ate) retiradasPeriodo+=Number(mv.valor)||0;
          });
        });
      }
      const saidasCaixa=despesasPagas+retiradasPeriodo;
      const resultadoCaixa=entradasCaixa!=null?(entradasCaixa-saidasCaixa):null;
      // ajuste por sócio (idêntico ao fechamento das 4 lojas, pra não divergir de um relatório pro outro)
      let porSocio=null,baseSocios=null;
      const mesSocios=resumo.periodo.de.slice(0,7);
      if(PAPEL_CAIXA_LOJA[loja]!=='reserva'){
        const bd=baseDistribuivelLoja(loja,m.margemLiquida,mesSocios);
        baseSocios=bd.base;
        const ownership=OWNERSHIP_LOJA[loja]||{};
        porSocio=sociosDaLoja(loja).map(s=>{
          const lista=movimentosSocioMes(loja,s,mesSocios);
          const retirou=totalPorTipo(lista,'retirada');
          const reembolso=totalPorTipo(lista,'reembolso');
          const pct=ownership[s]||0;
          const cota=baseSocios*(pct/100);
          const ajuste=cota-retirou+reembolso;
          return {socio:s,pct,cota,retirou,reembolso,ajuste};
        });
      }
      // sugestão de retirada: fila em ordem decrescente de participação, contra o Garantido de 90 dias
      let sugestoes=null;
      if(porSocio){
        const projLoja=projecaoCaixaBase([loja],90);
        let denseAjustado=projLoja.dense.map(x=>({...x}));
        sugestoes=porSocio.filter(p=>p.ajuste>0.01).sort((a,b)=>b.pct-a.pct).map(p=>{
          const check=primeiroDiaComCaixaEmDense(denseAjustado,p.ajuste);
          if(check) denseAjustado=denseAjustado.map(x=>x.data>=check.data?{...x,saldo:x.saldo-p.ajuste}:x);
          // guarda o detalhe do cálculo junto (28/08, pedido do Felipe: "me explique como chegou na
          // sugestão de retirada") - assim o próprio relatório mostra de onde veio o número, sem
          // precisar perguntar. Fórmula: ajuste = cota (base do mês × % do sócio) − retirou + reembolso.
          return {socio:p.socio,pct:p.pct,cota:p.cota,retirou:p.retirou,reembolso:p.reembolso,valor:p.ajuste,dataSegura:check?check.data:null};
        });
      }
      // análise: reaproveita o mesmo "fôlego" do Fluxo de Caixa (Garantido, 60 dias)
      const projLoja60=projecaoCaixaBase([loja],60);
      const piorSaldoLoja=Math.min(...projLoja60.dense.map(x=>x.saldo));
      const diaPiorLoja=projLoja60.dense.find(x=>x.saldo===piorSaldoLoja);
      resultados.push({loja,resumo,m,mAnt,resumoAnt,despesaImposto,entradasCaixa,periodoEntradas,despesasPagas,retiradasPeriodo,saidasCaixa,resultadoCaixa,prazoDias,porSocio,baseSocios,sugestoes,piorSaldoLoja,diaPiorLoja});
      financasDreDfcProgresso={feito:i+1,total:STORES.length,etapa:`${loja} concluída`};
      renderFinancas();
      atualizarOverlayProgresso(((i+1)/STORES.length)*100);
      await sleep(150);
    }
    financasDreDfcCarregando=false; financasDreDfcProgresso=null;
    imprimirRelatorioDreDfc(resultados);
    return;
  }catch(e){
    financasDreDfcErro=e.message;
  }
  financasDreDfcCarregando=false; financasDreDfcProgresso=null; renderFinancas(); esconderOverlayVideoCarregando();
}
function imprimirRelatorioDreDfc(resultados){
  const win=window;
  const metrica=(lbl,val,neg,pctVal,badgeHtml)=>`<div class="metric"><div class="lbl">${lbl}</div><div class="val${neg?' neg':''}">${val}</div>${pctVal!=null?`<div class="pctv">${pctVal.toFixed(1)}% do faturamento</div>`:''}${badgeHtml?`<div class="pctv">${badgeHtml}</div>`:''}</div>`;
  const pctDe=(v,fat)=>fat>0?(v/fat*100):0;
  /* mesmo padrão de ▲/▼ do Resumo Financeiro (renderResumoFinanceiroResultado), reaproveitado aqui
     pra comparar cada loja com o período anterior equivalente (28/08, pedido do Felipe). */
  const badge=(atual,anteriorValor,inverterBom)=>{
    if(anteriorValor==null) return '';
    if(anteriorValor===0) return atual>0?'<span style="color:var(--ok)">▲ novo (era R$ 0,00)</span>':'';
    const variacao=(atual-anteriorValor)/Math.abs(anteriorValor)*100;
    const melhorou=inverterBom?variacao<0:variacao>0;
    const seta=variacao>=0?'▲':'▼';
    return `<span style="color:${melhorou?'var(--ok)':'var(--danger)'}">${seta} ${Math.abs(variacao).toFixed(1)}% vs. período anterior</span>`;
  };
  const rotulos={hoje:'Hoje','7d':'Últimos 7 dias','15d':'Últimos 15 dias','30d':'Últimos 30 dias',mes_corrente:'Mês corrente',personalizado:fmtData(financasResumoDe)+' a '+fmtData(financasResumoAte)};
  const rotuloPeriodo=rotulos[financasResumoPeriodo]||financasResumoPeriodo;
  const cardLojaDreDfc=r=>{
    const aliquota=finLoja(r.loja).aliquotaImposto||0;
    const analiseParagrafos=[];
    if(r.resultadoCaixa!=null){
      const diffLucroCaixa=r.m.margemLiquidaRateada-r.resultadoCaixa;
      if(Math.abs(diffLucroCaixa)>Math.max(30,Math.abs(r.m.margemLiquidaRateada)*0.1)){
        analiseParagrafos.push(diffLucroCaixa>0
          ?`Lucro (${fmtMoney(r.m.margemLiquidaRateada)}) maior que o caixa efetivamente movimentado no período (${fmtMoney(r.resultadoCaixa)}) — parte do lucro ainda não virou dinheiro na conta, provavelmente porque parte das vendas mais recentes ainda está no prazo de liberação (${r.prazoDias!=null?r.prazoDias+' dias':'prazo ainda não sincronizado'}).`
          :`Caixa movimentado no período (${fmtMoney(r.resultadoCaixa)}) maior que o lucro contábil (${fmtMoney(r.m.margemLiquidaRateada)}) — entrou dinheiro de vendas de um período anterior, mais do que o lucro gerado agora. Não é um sinal de piora nem melhora por si só, só timing entre venda e liberação.`);
      }else{
        analiseParagrafos.push(`Lucro e caixa do período estão próximos (${fmtMoney(r.m.margemLiquidaRateada)} de lucro, ${fmtMoney(r.resultadoCaixa)} de caixa movimentado) — sem descasamento relevante de timing nesse período.`);
      }
    }else{
      analiseParagrafos.push(`Ainda não dá pra comparar lucro com caixa real — essa loja ainda não sincronizou o prazo de liberação real (sincroniza sozinho; volte a gerar esse relatório depois).`);
    }
    analiseParagrafos.push(r.piorSaldoLoja<0
      ?`⚠ No Fluxo de Caixa (garantido), o saldo dessa loja fica negativo em ${fmtData(r.diaPiorLoja.data)} — antes de retirar qualquer coisa, resolver isso é prioridade.`
      :`No Fluxo de Caixa (garantido) dos próximos 60 dias, a folga mínima é de ${fmtMoney(r.piorSaldoLoja)} em ${fmtData(r.diaPiorLoja.data)} — é o teto real de segurança pra qualquer retirada.`);
    const impostoStatus=r.despesaImposto

        ?`<span style="color:var(--ok)">✓ pago</span> — ${fmtMoney(r.despesaImposto.valor)} (base ${mesLabel(r.despesaImposto.impostoRefMes)}, venceu ${fmtData(r.despesaImposto.dataPagamento)})`

      :'sem despesa de imposto registrada pra esse mês de referência ainda (sincroniza sozinho, ou alíquota não configurada)';
    return `<div class="loja-card">
      <h2>${esc(r.loja)}</h2>
      <h3 style="font-size:12.5px;margin:0 0 8px;color:var(--violet-l)">DRE — Demonstrativo de Resultado</h3>
