        ${metrica('CMV',fmtMoney(r.m.cmv),false,pctDe(r.m.cmv,r.resumo.faturamento))}
        ${metrica('Tarifas (comissão)',fmtMoney(r.resumo.tarifas),false,pctDe(r.resumo.tarifas,r.resumo.faturamento))}
        ${metrica('Impostos ('+(aliquota||0)+'%)',fmtMoney(r.m.impostoCalc),false,pctDe(r.m.impostoCalc,r.resumo.faturamento))}
        ${metrica('Ads',fmtMoney(r.resumo.ads.custo),false,pctDe(r.resumo.ads.custo,r.resumo.faturamento))}
        ${metrica('Frete (vendedor)',fmtMoney(r.resumo.frete.vendedor),false,pctDe(r.resumo.frete.vendedor,r.resumo.faturamento))}
        ${metrica('Margem de Contribuição',fmtMoney(r.m.margem),r.m.margem<0,pctDe(r.m.margem,r.resumo.faturamento),r.mAnt?badge(r.m.margem,r.mAnt.margem,false):'')}
        ${metrica('Margem Líquida (rateada)',fmtMoney(r.m.margemLiquidaRateada),r.m.margemLiquidaRateada<0,pctDe(r.m.margemLiquidaRateada,r.resumo.faturamento),r.mAnt?badge(r.m.margemLiquidaRateada,r.mAnt.margemLiquidaRateada,false):'')}
        ${metrica('Margem Líquida (custo total)',fmtMoney(r.m.margemLiquida),r.m.margemLiquida<0,pctDe(r.m.margemLiquida,r.resumo.faturamento),r.mAnt?badge(r.m.margemLiquida,r.mAnt.margemLiquida,false):'')}
      </div>
      <p class="vazio">"Rateada" divide as despesas/fatura ML do mês pelos dias do período. "Custo total" desconta o mês INTEIRO de despesas de uma vez — é essa que serve de base pra cota de retirada dos sócios abaixo (por isso costuma ficar bem menor no meio do mês, antes do faturamento fechar).</p>
      ${!r.mAnt?`<p class="vazio">Não deu pra comparar com o período anterior (falha ao buscar).</p>`:''}
      <h3 style="font-size:12.5px;margin:14px 0 8px;color:var(--violet-l)">Imposto</h3>
      <p class="vazio">Já registrado (mês vencido/a vencer): ${impostoStatus}. Acumulando agora, ainda não vencido — reserva recomendada pra esse período: <b style="color:var(--text)">${fmtMoney(r.m.impostoCalc)}</b> (vira despesa de imposto no dia 20 do mês seguinte).</p>
      <h3 style="font-size:12.5px;margin:14px 0 8px;color:var(--violet-l)">DFC — Demonstrativo de Fluxo de Caixa (caixa real do período)</h3>
      ${r.entradasCaixa!=null?`<div class="metrics">
        ${metrica('Entradas (estimada)',fmtMoney(r.entradasCaixa))}
        ${metrica('Despesas pagas',fmtMoney(r.despesasPagas),true)}
        ${metrica('Retiradas de sócio',fmtMoney(r.retiradasPeriodo),true)}
        ${metrica('Resultado de caixa',fmtMoney(r.resultadoCaixa),r.resultadoCaixa<0)}
      </div>
      <p class="vazio">Entrada estimada a partir das vendas de ${fmtData(r.periodoEntradas.de)} a ${fmtData(r.periodoEntradas.ate)} (deslocado ${r.prazoDias} dia(s) — o prazo real de liberação medido pra essa loja), líquido de tarifa e frete vendedor. Despesas pagas e retiradas já são valor real, não estimativa.</p>`
      :`<div class="metrics">
        ${metrica('Despesas pagas',fmtMoney(r.despesasPagas),true)}
        ${metrica('Retiradas de sócio',fmtMoney(r.retiradasPeriodo),true)}
      </div>
      <p class="vazio">Entrada de caixa não estimada — essa loja ainda não sincronizou o prazo real de liberação (sincroniza sozinho no Fluxo de Caixa).</p>`}
      <h3 style="font-size:12.5px;margin:14px 0 8px;color:var(--violet-l)">Análise</h3>
      ${analiseParagrafos.map(p=>`<p class="vazio" style="font-size:12.5px">${p}</p>`).join('')}
      <h3 style="font-size:12.5px;margin:14px 0 8px;color:var(--violet-l)">Sugestão de retirada</h3>
      ${r.sugestoes?(r.sugestoes.length?`<p class="vazio" style="margin:0 0 8px">Base do mês (Margem Líquida custo total): <b style="color:var(--text)">${fmtMoney(r.baseSocios)}</b>. Cota de cada sócio = base × % de participação. Valor sugerido = cota − o que já retirou este mês + reembolso que a empresa ainda deve a ele.</p>
        <div class="tbl-scroll"><table><thead><tr><th>Sócio</th><th class="n">%</th><th class="n">Cota</th><th class="n">Já retirou</th><th class="n">Reembolso devido</th><th class="n">Valor sugerido</th><th class="n">Data segura</th></tr></thead><tbody>
          ${r.sugestoes.map(s=>`<tr><td>${NOME_SOCIO[s.socio]||s.socio}</td><td class="n">${s.pct.toFixed(s.pct%1?2:0)}%</td><td class="n">${fmtMoney(s.cota)}</td><td class="n">${fmtMoney(s.retirou)}</td><td class="n">${fmtMoney(s.reembolso)}</td><td class="n"><b>${fmtMoney(s.valor)}</b></td><td class="n">${s.dataSegura?fmtData(s.dataSegura):'sem data em 90 dias que caiba esse valor sem furar o caixa'}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="vazio" style="margin-top:6px">Data é o primeiro dia em que o caixa garantido aguenta essa retirada SEM ficar negativo depois — já considera que os sócios acima na lista reservaram a fatia deles primeiro.</p>`
        :`<p class="vazio">Nenhum sócio com valor pendente a receber nesse fechamento (já retiraram o que tinham direito, ou ainda devem devolver).</p>`)
      :`<p class="vazio">Loja de reserva/reinvestimento — sem retirada de sócio.</p>`}
    </div>`;
  };
  const totalFat=resultados.reduce((s,r)=>s+r.resumo.faturamento,0);
  const totalMargemLiquida=resultados.reduce((s,r)=>s+r.m.margemLiquidaRateada,0);
  const totalCaixa=resultados.reduce((s,r)=>s+(r.resultadoCaixa||0),0);
  const totalSugerido=resultados.reduce((s,r)=>s+(r.sugestoes||[]).reduce((s2,x)=>s2+x.valor,0),0);
  win.document.open();
  win.document.write(`<!doctype html><html><head><meta charset="utf-8">

    <div class="tot-card">
      <h2>Comparativo — Todas as Lojas</h2>
      <div class="tbl-scroll"><table><thead><tr><th>Loja</th><th class="n">Faturamento</th><th class="n">Margem Líquida</th><th class="n">Caixa do período</th><th class="n">Retirada sugerida</th></tr></thead><tbody>
        ${resultados.map(r=>`<tr><td>${esc(r.loja)}</td><td class="n">${fmtMoney(r.resumo.faturamento)}</td><td class="n">${fmtMoney(r.m.margemLiquidaRateada)}</td><td class="n">${r.resultadoCaixa!=null?fmtMoney(r.resultadoCaixa):'—'}</td><td class="n">${fmtMoney((r.sugestoes||[]).reduce((s,x)=>s+x.valor,0))}</td></tr>`).join('')}
        <tr style="font-weight:700"><td>Total</td><td class="n">${fmtMoney(totalFat)}</td><td class="n">${fmtMoney(totalMargemLiquida)}</td><td class="n">${fmtMoney(totalCaixa)}</td><td class="n">${fmtMoney(totalSugerido)}</td></tr>
      </tbody></table></div>
    </div>
    ${relatorioShareBoxHtml()}
    <div class="gerado">Doca · Abastecimento Full · Mercado Livre</div>

  win.document.close();
}
/* CMV = soma de (custo cadastrado do produto × quantidade vendida no período), casando pelo
   mlItemId salvo em cada produto. Item vendido sem produto vinculado (ou sem custo cadastrado)
   entra em "semCusto" pra avisar que o CMV está subestimado, em vez de fingir que é zero. */
function calcularCmvResumo(resumo){
  let cmv=0,unidSemCusto=0;
  (resumo.itensVendidos||[]).forEach(it=>{
    const p=state.produtos.find(x=>x.mlItemId===it.itemId);
    if(p&&p.custo>0) cmv+=p.custo*it.qtd; else unidSemCusto+=it.qtd;
  });
  return {cmv,unidSemCusto};
}
/* despesas manuais (cadastradas em Finanças, exceto a fatura do ML e o Imposto — que já entram
   descontados dentro do próprio cálculo de margem, ver calcularMargensResumo/impostoCalc) dessa
   loja com vencimento dentro do período do Resumo Financeiro — usadas como "custos do período" na
   Margem Líquida. O Imposto aparece em Despesas/Fluxo de Caixa só como lembrete de pagamento
   (pedido do Felipe 23/08), não pode somar aqui senão desconta 2x. */
function despesasPeriodoLoja(loja,de,ate){
  return despesasArr().filter(d=>d.loja===loja&&d.origem!=='ml_fatura'&&d.origem!=='imposto'&&d.dataPagamento&&d.dataPagamento>=de&&d.dataPagamento<=ate);
}
/* fatura(s) do ML cujo VENCIMENTO cai dentro do período do Resumo (de,ate) - CORRIGIDO 25/08:
   antes a Margem Líquida usava faturaMlPendenteLoja (soma de tudo que ainda está em aberto, sem
   olhar período nenhum) - pro caso da Orbix isso significava somar a fatura de SETEMBRO (ainda
   em andamento, período seguinte) na margem de AGOSTO, e ainda por cima sumir com a fatura de
   agosto assim que ela fosse marcada como paga (ver faturaMlPendenteLoja, filtra "!pago"). O
   custo real da operação nesse período é o da fatura QUE VENCEU dentro dele, tenha sido paga ou
   não - pago só importa pro Fluxo de Caixa, não pra quanto custou de verdade. */
function faturaMlPeriodoLoja(loja,de,ate){
  return despesasArr().filter(d=>d.origem==='ml_fatura'&&d.loja===loja&&d.dataPagamento&&d.dataPagamento>=de&&d.dataPagamento<=ate)
    .reduce((s,d)=>s+(Number(d.valor)||0),0);
}
/* margem de contribuição e margem líquida a partir de um resumo (do backend) - função separada
   pra ser reaproveitada tanto no Resumo Financeiro quanto no fechamento dos sócios. */
/* quantos dias tem o período [de,ate] (inclusive) e quantos dias já se passaram no mês de
   referência - usado só pra ratear a fatura ML pendente (ver calcularMargensResumo abaixo). */
function diasNoPeriodoResumo(de,ate){ return Math.max(1,Math.round((new Date(ate)-new Date(de))/864e5)+1); }
/* total de dias do mês corrente (28-31) - usado pra ratear a fatura ML pendente: valor da fatura
   ÷ dias do mês = valor por dia, vezes os dias do período escolhido - pedido do Felipe 19/08
   (antes dividia pelos dias já decorridos no mês, o que inflava o rateio conforme o mês avançava;
   dividir pelo total de dias do mês dá uma taxa diária estável, sempre a mesma independente do
   dia em que for consultado) */
function diasNoMesAtual(){ const d=new Date(); return new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); }
/* último dia do mês (calendário) que contém essa data ISO - usado pra não cortar despesas/fatura
   ML que vencem depois de "hoje" mas ainda dentro do mesmo mês do período escolhido (pedido do
   Felipe 25/08: uma despesa lançada pro dia 28 já é um custo de agosto, mesmo que "Mês Corrente"
   só vá até hoje (dia 25) e ela ainda nem tenha vencido/sido paga - não é uma previsão, é um
   custo já sabido daquele mês). */
function fimMesDe(dataIso){
  const d=new Date(dataIso+'T12:00:00');
  const ultimo=new Date(d.getFullYear(),d.getMonth()+1,0);
  return _dataISO(ultimo.getFullYear(),ultimo.getMonth(),ultimo.getDate());
}
/* primeiro dia do mês (calendário) que contém essa data ISO - par de fimMesDe, usado junto pra
   sempre pegar o MÊS INTEIRO que contém o período escolhido (ver calcularMargensResumo abaixo). */
function inicioMesDe(dataIso){
  const d=new Date(dataIso+'T12:00:00');
  return _dataISO(d.getFullYear(),d.getMonth(),1);
}
/* quantos dias tem o mês (calendário, 28-31) que contém essa data ISO - igual diasNoMesAtual, mas
   baseado no mês do PERÍODO em vez de sempre "agora" (importa pra Mês Fechado, que olha o mês
   anterior). */
function diasNoMesDe(dataIso){
  const d=new Date(dataIso+'T12:00:00');
  return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
}
function calcularMargensResumo(resumo,loja){
  const {cmv,unidSemCusto}=calcularCmvResumo(resumo);
  const aliquota=finLoja(loja).aliquotaImposto||0;
  const impostoCalc=resumo.faturamento*(aliquota/100);
  // regra (corrigida): Ads NAO entra separado aqui - a fatura ML pendente (cadastrada em
  // Financas, origem "ml_fatura") ja' inclui o valor cobrado de Ads pelo Mercado Livre. Se
  // descontássemos Ads aqui E TAMBÉM a fatura ML pendente, o Ads seria descontado 2x (uma vez
  // direto, outra embutido na fatura). Por isso a Margem Líquida desconta direto da Margem de
  // Contribuição: despesas do período (despesasPeriodoLoja, que já exclui origem ml_fatura) e a
  // fatura ML pendente (que carrega o Ads dentro dela).
  const margem=resumo.faturamento-cmv-resumo.tarifas-impostoCalc-(resumo.frete.vendedor||0)-resumo.reembolsosValor;
  // CORRIGIDO 26/08 (pedido do Felipe): "custo total" agora sempre soma o MÊS INTEIRO (calendário)
  // que contém o período escolhido - despesas e fatura ML são custo mensal, pagas ou não, não
  // fatiado por dia. Antes usava só a janela do período em si (esticada até o fim do mês) - com
  // período "Hoje" isso cortava despesas ANTES de hoje e distorcia tudo. A "rateada" pega esse
  // mesmo total do mês inteiro e divide pelos dias do mês, multiplicando pelos dias do período
  // selecionado - MESMA régua pras despesas e pra fatura ML, e pras 4 lojas igual.
  const mesDe=inicioMesDe(resumo.periodo.de), mesAte=fimMesDe(resumo.periodo.de);
  const diasMes=diasNoMesDe(resumo.periodo.de);
  const diasSel=diasNoPeriodoResumo(resumo.periodo.de,resumo.periodo.ate);
  const custosPeriodo=despesasPeriodoLoja(loja,mesDe,mesAte).reduce((s,d)=>s+(Number(d.valor)||0),0);
  // faturaMlAtual: soma de TUDO que ainda está em aberto agora (sem filtro de período) - usada só
  // pro card "Fatura Mercado Livre" da Visão Geral (patrimônio). faturaMlPeriodo: a fatura do MÊS
  // que contém o período selecionado - é essa que representa o custo real do período, pra Margem
  // Líquida "de custo total" e pro fechamento dos sócios (baseDistribuivelLoja).
  const faturaMlAtual=faturaMlPendenteLoja(loja);
  const faturaMlPeriodo=faturaMlPeriodoLoja(loja,mesDe,mesAte);
  const custosRateado=(custosPeriodo/diasMes)*diasSel;
  const faturaMlRateada=(faturaMlPeriodo/diasMes)*diasSel;
  const margemLiquida=margem-custosPeriodo-faturaMlPeriodo;
  const margemLiquidaRateada=margem-custosRateado-faturaMlRateada;
  return {cmv,unidSemCusto,aliquota,impostoCalc,margem,custosPeriodo,faturaMlAtual,faturaMlPeriodo,custosRateado,faturaMlRateada,margemLiquida,margemLiquidaRateada,diasMes,diasSel,mesDe,mesAte};
}
/* monta os cartões de dedução + margem de contribuição a partir do resumo devolvido pelo backend.
   Frete pago pelo COMPRADOR não entra na margem (não sai do seu bolso) - só o frete VENDEDOR
   (o que você paga quando o anúncio tem frete grátis) é deduzido, igual o print de referência
   (Metrify) mostrava. Cancelamentos e reembolsos também são deduzidos - são vendas que geraram
   custo/trabalho mas não viraram receita de verdade. */
let resumoRankingAberto=new Set();
function renderResumoFinanceiroResultado(resumo,loja){
  const {cmv,unidSemCusto,aliquota,impostoCalc,margem,custosPeriodo,faturaMlAtual,faturaMlPeriodo,custosRateado,faturaMlRateada,margemLiquida,margemLiquidaRateada,diasMes,diasSel}=calcularMargensResumo(resumo,loja);
  const margemPct=resumo.faturamento>0?(margem/resumo.faturamento*100):0;
  const margemPosAds=margem-resumo.ads.custo;
  const margemPosAdsPct=resumo.faturamento>0?(margemPosAds/resumo.faturamento*100):0;
  const margemLiquidaPct=resumo.faturamento>0?(margemLiquida/resumo.faturamento*100):0;
  /* Margem Líquida (rateada) - pedido do Felipe 19/08, CORRIGIDO 26/08 (2a vez): agora rateia
     despesas E fatura ML igual, pelos dias do período ÷ dias do mês (calculado em
     calcularMargensResumo, mesma régua usada no fechamento das 4 lojas) - antes só a fatura ML
     era rateada e a despesa entrava no valor cheio, o que gerava número sem sentido (ex: descontar
     uma despesa mensal inteira de 1 dia de faturamento só porque venceu bem naquele dia). */
  const margemLiquidaRateadaPct=resumo.faturamento>0?(margemLiquidaRateada/resumo.faturamento*100):0;
  const pct=v=>resumo.faturamento>0?(v/resumo.faturamento*100).toFixed(1)+'% do faturamento':'';
  const cartao=(titulo,valor,sub)=>`<div class="card" style="margin:0"><div class="muted" style="font-size:11px">${titulo}</div><b style="font-size:17px">${fmtMoney(valor)}</b>${sub?`<div class="hint" style="margin:2px 0 0;font-size:11px">${sub}</div>`:''}</div>`;
  /* badge ▲/▼ comparando com o período anterior equivalente (mesmo tanto de dias, logo antes) -

     null enquanto ainda não buscou ou não achou dado válido pra comparar (não mostra nada, não
     inventa 0% quando não sabe). */
  const comparAnt=financasResumoAnterior;
  const badge=(atual,anteriorValor,inverterBom)=>{
    if(financasResumoAnteriorCarregando) return ' <span class="muted" style="font-size:11px">(comparando com período anterior...)</span>';

    const melhorou=inverterBom?variacao<0:variacao>0;
    const seta=variacao>=0?'▲':'▼';
    return ` <span class="${melhorou?'okv':'pend'}" style="font-size:11px" title="Período anterior (${fmtData(comparAnt.periodo.de)} a ${fmtData(comparAnt.periodo.ate)}): ${fmtMoney(anteriorValor)}">${seta} ${Math.abs(variacao).toFixed(1)}% vs. período anterior</span>`;
  };
  const margensAnt=comparAnt?calcularMargensResumo(comparAnt,loja):null;

      ${cartao('TARIFAS (COMISSÃO)',resumo.tarifas,pct(resumo.tarifas))}

      ${cartao('ADS',resumo.ads.custo,pct(resumo.ads.custo))}
      ${cartao('FRETE (VENDEDOR)',resumo.frete.vendedor,pct(resumo.frete.vendedor))}

      ${cartao('CANCELAMENTOS',resumo.cancelamentosValor,pct(resumo.cancelamentosValor))}
      ${cartao('REEMBOLSOS',resumo.reembolsosValor,pct(resumo.reembolsosValor))}

        <div class="hint" style="margin:2px 0 0">descontado da Margem de Contribuição: despesas ${fmtMoney(custosPeriodo)} + fatura ML do mês ${fmtMoney(faturaMlPeriodo)} (valor cheio, mês inteiro)</div>

      ${financasResumoPeriodo==='hoje'?'':`<div class="card" style="margin:0">
        <div class="muted" style="font-size:11px">VENDAS DE HOJE</div>
        <b style="font-size:18px">${fmtInt(resumo.vendasHoje.pedidos)} pedido(s) · ${fmtInt(resumo.vendasHoje.unidades||0)} unidade(s) · ${fmtMoney(resumo.vendasHoje.faturamento)}</b>
      </div>`}
    </div>
    <div class="card" style="margin-top:12px">
      <h3 style="margin-top:0">🏆 Ranking de produtos vendidos no período</h3>
      ${itensOrdenados.length?`<div class="table-wrap"><table class="tbl-produtos"><thead><tr><th style="width:40px">#</th><th>Produto</th><th class="num">Unid.</th><th class="num">Faturamento</th><th class="num">M. Contribuição</th><th class="num">Ads</th><th class="num">M. Líquida</th><th></th></tr></thead><tbody>
        ${itensOrdenados.map((it,i)=>{
          const p=state.produtos.find(x=>x.mlItemId===it.itemId);
          const nome=p&&p.sku?esc(p.sku):`<span class="muted">${esc(it.itemId)} (sem SKU vinculado)</span>`;
          const custoUnit=p&&p.custo?p.custo:0;
          const custoProdutoItem=custoUnit*it.qtd;
          const impostoItem=it.valor*((aliquota||0)/100);
          const margemContribItem=it.valor-custoProdutoItem-(it.tarifa||0)-(it.freteMl||0)-impostoItem;
          const adsAchado=p?adsGastoAutoProduto(p,resumo):null;
          const adsItem=adsAchado||0;
          const margemLiquidaItem=margemContribItem-adsItem;
          /* tag de "dentro da meta de TACOS" ao lado do Ads gasto - pedido do Felipe 18/08: meta
             = 1/3 do faturamento do produto no período. So mostra quando ha Ads gasto de fato. */
          /* UNIFICADO 02/09: mesmo criterio da aba Ads (ver metaTacosUnit). */
          const metaIt=tetoAdsDoItem(p,aliquota,it);
          const dentroMetaTacosItem=adsAchado!=null&&(metaIt?adsAchado<=metaIt.teto
            :(margemContribItem>0&&adsAchado<=margemContribItem/3));
          const pctAds=it.valor&&adsAchado!=null?(adsAchado/it.valor*100):0;
          const adsCel=adsAchado==null?'<span class="muted" title="Nenhuma campanha/anúncio de Ads encontrado pra esse produto no período">—</span>':`${fmtMoney(adsAchado)} <span class="muted" style="font-size:11px">(${pctAds.toFixed(1)}%)</span>${dentroMetaTacosItem?` <span class="okv" style="font-size:11px;font-weight:700" title="Ads dentro da meta de TACOS — teto de ${fmtMoney(metaIt?metaIt.teto:margemContribItem/3)}${metaIt?` (meta ${metaIt.metaPct.toFixed(2)}% = 1/3 da margem unitária de ${metaIt.margemPct.toFixed(1)}%, mesmo critério da aba Ads)`:' (1/3 da Margem de Contribuição do período)'}">✓</span>`:''}`;
          const aberto=resumoRankingAberto.has(String(it.itemId));
          const pctMC=it.valor?(margemContribItem/it.valor*100):0;
          const pctML=it.valor?(margemLiquidaItem/it.valor*100):0;
          return `<tr><td class="muted">${i+1}º</td><td>${nome}</td><td class="num"><b>${fmtInt(it.qtd)}</b></td><td class="num">${fmtMoney(it.valor)}</td><td class="num">${fmtMoney(margemContribItem)} <span class="muted" style="font-size:11px">(${pctMC.toFixed(1)}%)</span></td><td class="num">${adsCel}</td><td class="num"><b class="${margemLiquidaItem>=0?'okv':'pend'}">${fmtMoney(margemLiquidaItem)}</b> <span class="muted" style="font-size:11px">(${pctML.toFixed(1)}%)</span></td><td><button class="btn sm" data-rankver="${esc(it.itemId)}">${aberto?'▲':'▼'}</button></td></tr>
          ${aberto?`<tr><td colspan="8">
            <div class="form-grid" style="grid-template-columns:repeat(4,1fr);gap:8px 16px;margin:6px 0 10px">
              <div><span class="muted" style="font-size:11px">Faturamento</span><br>${fmtMoney(it.valor)}</div>
              <div><span class="muted" style="font-size:11px">Custo do produto${p&&p.custo?' ('+fmtMoney(custoUnit)+'/un. × '+fmtInt(it.qtd)+')':' (sem custo cadastrado em Produtos)'}</span><br>− ${fmtMoney(custoProdutoItem)}</div>
              <div><span class="muted" style="font-size:11px">Tarifa (comissão ML, % da categoria)</span><br>− ${fmtMoney(it.tarifa||0)}</div>
              <div><span class="muted" style="font-size:11px">Frete (vendedor, rateado por peso)</span><br>− ${fmtMoney(it.freteMl||0)}</div>
              <div><span class="muted" style="font-size:11px">Imposto (${aliquota||0}% do faturamento)</span><br>− ${fmtMoney(impostoItem)}</div>
              <div><span class="muted" style="font-size:11px">= Margem de Contribuição</span><br><b>${fmtMoney(margemContribItem)}</b> <span class="muted" style="font-size:11px">(${pctMC.toFixed(1)}%)</span></div>
              <div><span class="muted" style="font-size:11px">Ads (não entra na M. Contribuição)</span><br>${adsAchado==null?'não encontrado':'− '+fmtMoney(adsAchado)+' '}${adsAchado!=null?`<span class="muted" style="font-size:11px">(${pctAds.toFixed(1)}%)</span>`:''}</div>
              <div><span class="muted" style="font-size:11px">= Margem Líquida</span><br><b class="${margemLiquidaItem>=0?'okv':'pend'}">${fmtMoney(margemLiquidaItem)}</b> <span class="muted" style="font-size:11px">(${pctML.toFixed(1)}%)</span></div>
            </div>
          </td></tr>`:''}`;
        }).join('')}
      </tbody></table></div>`:'<p class="empty-inline">Nenhuma venda com item identificado nesse período.</p>'}
    </div>
  `;
}
/* ---- Retiradas e Reembolsos (TorvStore): cartão independente, sempre visível (não depende de
   ter pesquisado um período no Resumo Financeiro acima) — mesma lógica de "sempre aparece" da
   tabela de despesas, usando o mesmo mês selecionado em financasFiltroMes. O fechamento (margem
   líquida do mês) é calculado sob demanda, com uma busca própria à API do Mercado Livre pro mês
   inteiro. */
let novoSocioData='';
let novaDespesaData='';
let novoPagAmauriData='';
/* Retiradas e Reembolso funciona em qualquer loja 'distribui' (TorvStore, Dor Block, Orbix) - cada
   lançamento marca de qual loja saiu o dinheiro (útil pro Fluxo de Caixa saber de onde tirar). O
   valor final de pagar/devolver por sócio, porém, não é mais calculado isolado por loja: soma a
   cota do sócio em TODAS as lojas que ele participa e só then subtrai as retiradas/reembolsos dele
   nelas (ver calcularFechamentoTodasLojas) - pedido do Felipe 23/08, revisado 2a vez. TorvShop não
   retira nada (fica de fora). */
const LOJAS_RETIRADA=STORES.filter(l=>PAPEL_CAIXA_LOJA[l]!=='reserva');
/* todos os sócios que aparecem em pelo menos uma loja de LOJAS_RETIRADA, em ordem fixa (felipe,
   thiago, paulo, e quem mais entrar depois) - pedido do Felipe 23/08 (revisão final): "não precisa
   ter 2 grupos deixe somente cada sócio... nessa tela só deve aparecer um campo de cada sócio". A
   tela vira 1 formulário só + 1 coluna por sócio, sem mostrar loja/grupo nenhum - o "balde" (loja)
   onde cada lançamento é gravado por baixo dos panos é só a primeira loja de LOJAS_RETIRADA onde
   aquele sócio tem participação (ver lojaStorageSocio), o que não muda o resultado final porque o
   fechamento consolidado (calcularFechamentoTodasLojas) soma a cota e as retiradas/reembolsos do
   sócio em TODAS as lojas que ele participa antes de bater o total - não compara loja a loja. */
function sociosUniao(){
  const set=new Set();
  LOJAS_RETIRADA.forEach(l=>sociosDaLoja(l).forEach(s=>set.add(s)));
  const ordem=['felipe','thiago','paulo'];
  return [...set].sort((a,b)=>(ordem.indexOf(a)<0?99:ordem.indexOf(a))-(ordem.indexOf(b)<0?99:ordem.indexOf(b)));
}
function lojasDoSocio(socio){ return LOJAS_RETIRADA.filter(l=>OWNERSHIP_LOJA[l]&&Object.prototype.hasOwnProperty.call(OWNERSHIP_LOJA[l],socio)); }
function lojaStorageSocio(socio){ return lojasDoSocio(socio)[0]||LOJAS_RETIRADA[0]; }

    </tbody></table>`:`<p class="empty-inline">Nada lançado em ${esc(mesLabel(mes))}.</p>`;
  return `
    <div class="card" style="margin-top:16px">
      <h3 style="margin-top:0">💸 Retiradas e Reembolsos</h3>

        </label>
      </div>
      <p class="hint" style="margin:0 0 10px">Lance abaixo em ${esc(mesLabel(mes))} (mesmo mês da tabela de despesas acima, pode trocar pelo seletor): <b>Retirada</b> é o que o sócio já tirou pra ele; <b>Reembolso</b> é o inverso — o que ele pagou do próprio bolso e precisa ser devolvido. O valor final de pagar/devolver de cada sócio (somando todas as lojas que ele participa) sai no botão "📋 Calcular fechamento de todas as lojas", lá em cima em Resumo Financeiro.</p>
      <div class="form-grid" style="grid-template-columns:1fr 1fr 2fr 1fr 1fr auto">

        <label>Tipo<select id="socTipo"><option value="retirada">Retirada</option><option value="reembolso">Reembolso</option></select></label>
        <label>Descrição<input id="socDescricao" type="text" placeholder="Ex: combustível"></label>
        <label>Valor (R$)<input id="socValor" type="text" inputmode="decimal" placeholder="0,00" oninput="filtrarValorMoeda(this)"></label>
        <label>Data${botaoData('socData',novoSocioData||hoje(),{style:''})}</label>
        <button class="btn gold" id="btnAddSocio" style="align-self:end">+ Adicionar</button>
      </div>
      <div class="form-grid" style="grid-template-columns:repeat(${socios.length},1fr);gap:14px;margin-top:14px">
        ${socios.map(s=>`<div><b style="font-size:12.5px">${NOME_SOCIO[s]} — retirou ${fmtMoney(retiradaPorSocio[s])}${reembolsoPorSocio[s]?` · reembolso ${fmtMoney(reembolsoPorSocio[s])}`:''}</b>${listaSocio(s,listasPorSocio[s])}</div>`).join('')}
      </div>
    </div>`;
}

/* ================= Amauri: fechamento dos produtos em parceria (TorvStore) =================
   3 produtos da TorvStore têm sociedade com o Amauri. Cada produto tem seus próprios custos
   (frete, embalagem, etiqueta e ads — editáveis, guardados por produto) e um percentual de
   repasse (padrão 50%). Pra cada período escolhido: puxa unidades vendidas/faturamento de cada
   produto marcado (via /financas/resumo, igual o Resumo Financeiro), calcula a margem líquida
   de cada um (faturamento − CMV − frete − embalagem − etiqueta − ads − imposto) e o repasse
   devido a ele, e soma tudo no final. Um log de pagamentos já feitos permite acompanhar quanto
   ainda falta pagar. */
function amauriState(){
  if(!state.amauri||typeof state.amauri!=='object') state.amauri={};
  if(!Array.isArray(state.amauri.produtoIds)) state.amauri.produtoIds=[];
  if(!state.amauri.custos||typeof state.amauri.custos!=='object') state.amauri.custos={};
  if(!Array.isArray(state.amauri.pagamentos)) state.amauri.pagamentos=[];
  if(typeof state.amauri.aliquotaImposto!=='number') state.amauri.aliquotaImposto=Number(state.amauri.aliquotaImposto)||0;
  return state.amauri;
}
/* cada custo tem um valor E um "quem pagou" (torvstore ou amauri) - só o custo do produto não
   tem valor editável aqui: ele é puxado direto do custo unitário cadastrado em Produtos (sempre
   o valor mais atual de lá, não uma cópia que fica desatualizada) - só o "quem paga" desse custo
   fica editável na Amauri. Os outros nascem como pagos pela loja; é só o padrão inicial, dá pra
   trocar em cada produto. */
function amauriCustos(produtoId){
  const a=amauriState();
  const p=prodById(produtoId);
  if(!a.custos[produtoId]||typeof a.custos[produtoId]!=='object'){
    a.custos[produtoId]={custoProdutoQuemPagou:'amauri',coleta:0,coletaQuemPagou:'torvstore',embalagem:0,embalagemQuemPagou:'torvstore',etiqueta:0,etiquetaQuemPagou:'torvstore',ads:0,adsQuemPagou:'torvstore',percentual:50};
  }
  const c=a.custos[produtoId];
  delete c.custoProduto;
  /* "frete" era o nome antigo desse campo (virou "coleta") - migra o que já tinha sido lançado
     em vez de perder o valor. */
  if(c.frete!=null&&c.coleta==null){ c.coleta=c.frete; c.coletaQuemPagou=c.freteQuemPagou||'torvstore'; }
  delete c.frete; delete c.freteQuemPagou;
  if(!c.custoProdutoQuemPagou) c.custoProdutoQuemPagou='amauri';
  if(c.coleta==null) c.coleta=0; if(!c.coletaQuemPagou) c.coletaQuemPagou='torvstore';
  if(c.embalagem==null) c.embalagem=0; if(!c.embalagemQuemPagou) c.embalagemQuemPagou='torvstore';
  if(c.etiqueta==null) c.etiqueta=0; if(!c.etiquetaQuemPagou) c.etiquetaQuemPagou='torvstore';
  if(c.ads==null) c.ads=0; if(!c.adsQuemPagou) c.adsQuemPagou='torvstore';
  if(c.percentual==null) c.percentual=50;
  return c;
}
function amauriProdutosMarcados(){
  const a=amauriState();
  return a.produtoIds.map(id=>prodById(id)).filter(Boolean);
}
function toggleAmauriProduto(produtoId){

/* aqui não tem preset de período (hoje/7d/15d/30d/mês corrente) - é sempre preenchido na mão,
   com as duas datas. */
let amauriResumoPeriodo='personalizado', amauriResumoDe='', amauriResumoAte='';
let amauriResumoResultado=null, amauriResumoCarregando=false, amauriResumoErro=null;
let amauriCustosAberto=new Set();
let amauriSubAba='periodo'; // 'produtos' | 'periodo' - sub-abas dentro de Amauri (periodo primeiro)

async function pesquisarResumoAmauri(){

/* linha de cálculo de um produto: casa pelo mlItemId (igual o Resumo Financeiro), usando valor e
   pedidos por item que o backend manda desde a v56 (antes só mandava a quantidade).
   A margem líquida desconta TODOS os custos (não importa quem pagou) - é o lucro real do
   produto. Só depois disso é que entra a questão de quem adiantou o dinheiro: qualquer custo
   marcado como "pago pelo Amauri" vira reembolso (some da margem líquida mas o valor volta pra
   ele por fora, além da fatia percentual), porque esse dinheiro já saiu do bolso dele, não do
   caixa compartilhado. */
function calcularLinhaAmauriProduto(p,resumo){
  const c=amauriCustos(p.id);
  const it=(resumo.itensVendidos||[]).find(x=>x.itemId===p.mlItemId);
  const qtd=it?(it.qtd||0):0;
  const faturamento=it?(it.valor||0):0;
  const vendasConcluidas=it?(it.pedidos||0):0;
  const qtdCancelada=it?(it.qtdCancelada||0):0;
  const pedidosCancelados=it?(it.pedidosCancelados||0):0;
  const tarifaMlTotal=it?(it.tarifa||0):0;
  /* frete que o Mercado Livre encara como frete (o frete grátis que sai do seu bolso) - vem do
     backend já rateado por item quando o envio tinha mais de 1 produto. É diferente da "coleta"
     abaixo, que é um custo seu (levar a mercadoria até o ponto de despacho, por exemplo). */
  const freteMlTotal=it?(it.freteMl||0):0;
  const custoProdutoTotal=(p.custo||0)*qtd;
  const coletaTotal=(c.coleta||0)*qtd;
  const embalagemTotal=(c.embalagem||0)*qtd;
  const etiquetaTotal=(c.etiqueta||0)*qtd;
  const adsTotal=c.ads||0;
  const aliquota=amauriState().aliquotaImposto||0;
  const impostoCalc=faturamento*(aliquota/100);
  const margemLiquida=faturamento-tarifaMlTotal-freteMlTotal-custoProdutoTotal-coletaTotal-embalagemTotal-etiquetaTotal-adsTotal-impostoCalc;
  const percentual=c.percentual!=null?c.percentual:50;
  const repasseMargem=margemLiquida*(percentual/100);
  const itensCusto=[
    {rotulo:'Custo do produto',valor:custoProdutoTotal,quemPagou:c.custoProdutoQuemPagou},
    {rotulo:'Coleta',valor:coletaTotal,quemPagou:c.coletaQuemPagou},
    {rotulo:'Embalagem',valor:embalagemTotal,quemPagou:c.embalagemQuemPagou},
    {rotulo:'Etiqueta',valor:etiquetaTotal,quemPagou:c.etiquetaQuemPagou},
    {rotulo:'Ads',valor:adsTotal,quemPagou:c.adsQuemPagou}
  ];
  const reembolsoAmauri=itensCusto.filter(x=>x.quemPagou==='amauri').reduce((s,x)=>s+x.valor,0);
  const repasseTotal=repasseMargem+reembolsoAmauri;
  return {p,c,qtd,faturamento,vendasConcluidas,qtdCancelada,pedidosCancelados,tarifaMlTotal,freteMlTotal,custoProdutoTotal,coletaTotal,embalagemTotal,etiquetaTotal,adsTotal,aliquota,impostoCalc,margemLiquida,percentual,repasseMargem,reembolsoAmauri,repasseTotal};
}
/* tenta achar sozinho quanto foi gasto de ads com esse produto EXATAMENTE no período calculado,
   casando o SKU com o nome da campanha. Usa resumo.ads.campanhas, que o backend busca com o MESMO
   de/ate do fechamento (o mesmo endpoint que alimenta o painel de Publicidade do Mercado Livre
   quando você escolhe um intervalo personalizado por lá) - nada de aproximar por janela fixa de
   7/15/30 dias. Devolve null quando não consegue achar (backend antigo sem esse dado, ou nenhuma
   campanha com o SKU no nome) - nesse caso o campo continua editável na mão. */
/* tira acento, espaço, hífen, underline etc e deixa maiúsculo - usado so' no fallback por nome
   (quando o backend antigo nao mandou o gasto por item_id ainda) */
function normalizarParaMatch(s){
  return String(s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase()
    .replace(/[^A-Z0-9]/g,'');
}
/* v78: acha o gasto de Ads do produto casando pelo item_id do Mercado Livre (resumo.ads.itens,
   devolvido pelo backend a partir do endpoint que lista TODOS os anuncios do advertiser com custo
   ja calculado por item) - exato, nao depende do nome da campanha ter o SKU dentro (ex.: a
   campanha podia se chamar "ALHO VALECOM" pro produto Amassadoralho, e o casamento por texto nunca
   ia achar isso). So cai pro casamento por nome de campanha (mais fragil) se o backend for uma
   versao antiga que ainda nao manda resumo.ads.itens. */
function adsGastoAutoProduto(p,resumo){
  const itens=(resumo&&resumo.ads&&resumo.ads.itens)||[];
  if(itens.length){
    if(!p.mlItemId) return null;
    const achado=itens.find(it=>it.itemId===p.mlItemId);
    return achado?(achado.cost||0):null;
  }
  if(!p.sku) return null;
  const campanhas=(resumo&&resumo.ads&&resumo.ads.campanhas)||[];
  if(!campanhas.length) return null;
  const skuNorm=normalizarParaMatch(p.sku);
  if(!skuNorm) return null;
  const camp=campanhas.find(cc=>normalizarParaMatch(cc.name).includes(skuNorm));
  return camp?(camp.cost||0):null;
}
/* preenche o custo de ads sozinho, disparado toda vez que o período é calculado (sem precisar de
   botão à parte) - silencioso quando não acha nada (fica só o valor manual de antes), só avisa com
   um toast discreto quando consegue achar pra pelo menos 1 produto. */
function autoPreencherAdsAmauri(){
  const marcados=amauriProdutosMarcados();
  if(!marcados.length||!amauriResumoResultado) return;
  let achados=0;
  marcados.forEach(p=>{
    const v=adsGastoAutoProduto(p,amauriResumoResultado);
    if(v!=null){ amauriCustos(p.id).ads=v; achados++; }
  });
  if(achados){ persist(); toast(`Ads puxado automático (período exato) pra ${achados} produto(s).`); }
}
/* Os campos de custo/quem-paga/percentual só gravam no estado quando o campo perde o foco
   (onchange) - igual todo campo de valor no Doca. Só que "Calcular", trocar o período e "Puxar
   ads automático" redesenham a aba na hora, e se o cursor ainda estivesse num campo de custo sem
   ter saído dele (sem clicar fora/apertar Tab), a edição se perdia - a margem líquida parecia não
   descontar os custos porque o valor digitado nunca tinha sido salvo. Por isso, antes de qualquer
   uma dessas ações, "força" a leitura de tudo que estiver na tela pro estado, mesmo sem o campo ter
   perdido o foco. */
function salvarCustosAmauriPendentes(){
  const el=document.getElementById('tab-amauri'); if(!el) return;
  el.querySelectorAll('[data-amauricusto]').forEach(inp=>{
    const [produtoId,campo]=inp.dataset.amauricusto.split('|');
    amauriCustos(produtoId)[campo]=parseMoeda(inp.value);
  });
  el.querySelectorAll('[data-amauriquem]').forEach(sel=>{
    const [produtoId,campo]=sel.dataset.amauriquem.split('|');
    amauriCustos(produtoId)[campo]=sel.value;
  });
  el.querySelectorAll('[data-amauripct]').forEach(inp=>{
    amauriCustos(inp.dataset.amauripct).percentual=Number(inp.value)||0;
  });
}

  snapshot('custos da parceria com Amauri');
  salvarCustosAmauriPendentes();
  persist();
}

/* ================= Análise de Mercado (21/08, atualizado no mesmo dia) =================
   Compara as vendas de cada produto com a categoria inteira dele no Mercado Livre, período a
   período. Não existe API pública pro painel "Análise de mercado" do vendedor - só dá pra ver
   logado, no navegador (vendedores.mercadolivre.com.br/metricas/...). MAS o próprio painel tem um
   botão "Baixar relatório" que gera um .xlsx com os 100 produtos mais vendidos da categoria (preço,
   unidades vendidas, visualizações, etc) - o Doca lê esse arquivo (com a lib SheetJS, direto no
   navegador) e calcula os números da categoria sozinho, sem precisar digitar nada. Quem não tiver
   o arquivo à mão ainda pode digitar manualmente (aba "ou digitar manualmente", só com o resumo do
   topo da tela). Já as SUAS vendas de cada período são 100% automáticas (calculadas pelo backend a
   partir do histórico real de pedidos). */
let mercadoAberto=new Set(); // chaves "loja|itemId" expandidas no momento
let mercadoDados={}; // "loja|itemId" -> {carregando,erro,categoriaId,urlTendencia,historico,vendasProprias}
let mercadoFormMes={}; // "loja|itemId" -> rascunho do formulário manual "colar mês da categoria"
let mercadoImportPreview={}; // "loja|itemId" -> prévia do .xlsx lido, antes de confirmar salvar
function mercadoKey(loja,itemId){ return loja+'|'+itemId; }
function mercadoMesAtual(){ return new Date().toISOString().slice(0,7); }
function mercadoFmtDiaMes(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); return m?`${m[3]}/${m[2]}`:(iso||''); }
// rótulo curto pra mostrar na tabela/gráfico: mês civil (digitado à mão) vira "08/26"; período
// exato importado do relatório vira "01/08–21/08"
function mercadoLabelHistorico(h){
  if(/^\d{4}-\d{2}$/.test(h.mes||'')){ const [a,m]=h.mes.split('-'); return `${m}/${a.slice(2)}`; }
  if(h.periodo_de&&h.periodo_ate){
    // 21/08 (achado real do Felipe): quando o período esticava além de ~2 meses ou cruzava o ano
    // (ex: ele testou 2025-08-01 a 2026-08-21), o rótulo "DD/MM–DD/MM" escondia o ano e ficava
    // parecendo um período curto normal (mostrava só "01/08–21/08"). Agora mostra o ano também
    // nesses casos, pra não esconder que o período é bem maior do que parece.
    const anoDiferente=h.periodo_de.slice(0,4)!==h.periodo_ate.slice(0,4);
    const diasSpan=(new Date(h.periodo_ate)-new Date(h.periodo_de))/864e5;
    if(anoDiferente||diasSpan>60){
      const fmtComAno=(iso)=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); return m?`${m[3]}/${m[2]}/${m[1].slice(2)}`:(iso||''); };
      return `${fmtComAno(h.periodo_de)}–${fmtComAno(h.periodo_ate)}`;
    }
    return `${mercadoFmtDiaMes(h.periodo_de)}–${mercadoFmtDiaMes(h.periodo_ate)}`;
  }
  return h.mes;
}
function mercadoLimitesDoMes(mesYYYYMM){
  // "YYYY-MM" -> {de,ate} (primeiro e último dia civil desse mês, formato YYYY-MM-DD)
  const [ano,mes]=mesYYYYMM.split('-').map(Number);
  const ultimoDia=new Date(Date.UTC(ano,mes,0)).getUTCDate(); // truque: mes (1-indexado) como índice 0-indexado do MÊS SEGUINTE, dia 0 = último dia deste mês
  return { de:`${mesYYYYMM}-01`, ate:`${mesYYYYMM}-${String(ultimoDia).padStart(2,'0')}` };
}
// vira um id de elemento HTML seguro (a "key" tem espaço e barra, ex: "Dor Block|MLB123" - não dá
// pra usar direto como id de elemento)
function mercadoIdSeguro(key){ return 'mc_'+key.replace(/[^a-zA-Z0-9]/g,'_'); }
/* 21/08 (achado real do Felipe): expandir um produto travava a tela inteira - não dava nem pra
   colapsar de volta nem clicar em mais nada. Causa: toda atualização (inclusive as automáticas,
   tipo "carregando categoria" -> "carregando vendas" -> "pronto") chamava renderMercado(), que
   reconstrói o HTML de TODOS os produtos da lista inteira via innerHTML - isso destrói e recria o
   próprio <details> que o navegador estava processando o clique dele NAQUELE EXATO MOMENTO,
   deixando o clique/toggle num estado inconsistente. A partir de agora, qualquer atualização DE UM
   PRODUTO SÓ (carregar dados, importar arquivo, excluir período, etc) atualiza só a div daquele
   produto (ver atualizarCorpoMercado) - nunca mais mexe no <details> dos outros nem no dele
   próprio, só no conteúdo de dentro. Só a lista de produtos em si (renderMercado) reconstrói tudo,
   e só quando ela realmente muda (troca de aba, sync novo, etc). */
function atualizarCorpoMercado(loja,itemId){
  const key=mercadoKey(loja,itemId);
  const corpo=document.getElementById('corpo_'+mercadoIdSeguro(key));
  if(!corpo) return; // produto não está mais na tela (trocou de aba, fechou o card, etc) - nada a atualizar
  // 21/08 (3º achado real do Felipe): a busca de "suas vendas" em segundo plano (pode levar vários
  // segundos, principalmente depois de salvar a Sazonalidade com vários meses de uma vez) chamava
  // isso de novo quando terminava e reescrevia o corpo inteiro - inclusive enquanto o usuário ainda
  // estava digitando outro valor na mesma tabela, derrubando/fechando o campo sem salvar nada. Se o
  // foco atual (campo de texto) estiver dentro desse card, pula essa atualização - tenta de novo
  // na próxima chamada (ex: quando ele clicar em Salvar ou fechar o card), sem interromper quem
  // está digitando.
  if(corpo.contains(document.activeElement)&&usuarioDigitando()) return;
  const p=state.produtos.find(x=>x.loja===loja&&x.mlItemId===itemId);
  if(!p) return;
  corpo.innerHTML=renderMercadoCorpo(p,key,mercadoDados[key]);
  bindMercadoCorpo(corpo,p,key);
}
async function carregarMercadoProduto(loja,itemId){
  const key=mercadoKey(loja,itemId);
  // busca só a categoria primeiro (rápido, é só banco de dados) e MOSTRA a tela na hora - o
  // cálculo de "suas vendas" roda depois, em paralelo, e só pros períodos que realmente existem
  // no histórico (em vez de 12 meses fixos toda vez, que travava produto novo sem dado nenhum).
  mercadoDados[key]=Object.assign({},mercadoDados[key],{carregando:true,erro:null});
  atualizarCorpoMercado(loja,itemId);
  try{
    const base=backendUrl();
    if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
    const rc=await fetchComTimeout(`${base}/mercado/categoria?loja=${encodeURIComponent(loja)}&itemId=${encodeURIComponent(itemId)}`,{},20000);
    let jc; try{ jc=await rc.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado ao buscar a categoria (status '+rc.status+').'); }
    if(!rc.ok||!jc.ok) throw new Error(jc.erro||('Falha ao buscar dados da categoria (status '+rc.status+').'));
    const historico=jc.historico||[];
    mercadoDados[key]={carregando:false,erro:null,categoriaId:jc.categoriaId,urlTendencia:jc.urlTendencia,historico,vendasProprias:{},vendasCarregando:historico.length>0};
    atualizarCorpoMercado(loja,itemId);
    if(!historico.length) return; // nada registrado ainda - só o botão de importar, sem espera nenhuma
    const vendasProprias={};
    await Promise.all(historico.map(async h=>{
      try{
        const {de,ate}=(h.periodo_de&&h.periodo_ate)?{de:h.periodo_de,ate:h.periodo_ate}:mercadoLimitesDoMes(h.mes);
        const rr=await fetchComTimeout(`${base}/mercado/vendas-proprias?loja=${encodeURIComponent(loja)}&itemId=${encodeURIComponent(itemId)}&de=${de}&ate=${ate}`,{},60000);
        let jj; try{ jj=await rr.json(); }catch(e2){ throw new Error('resposta inesperada (status '+rr.status+')'); }
        if(rr.ok&&jj.ok) vendasProprias[h.mes]={unidades:jj.unidades,valorBruto:jj.valorBruto};
        // 21/08 (achado real do Felipe): quando esse período específico falhava, a célula ficava
        // pra sempre em "—" sem nenhuma pista do motivo - antes isso era engolido em silêncio.
        // Agora guarda o erro pra mostrar na tabela (com hover) em vez de fingir que não tem dado.
        else vendasProprias[h.mes]={erro:(jj&&jj.erro)||('status '+rr.status)};
      }catch(e){ vendasProprias[h.mes]={erro:e.message||'falha desconhecida'}; }
    }));
    mercadoDados[key]=Object.assign({},mercadoDados[key],{vendasProprias,vendasCarregando:false});
  }catch(e){
    mercadoDados[key]=Object.assign({},mercadoDados[key],{carregando:false,vendasCarregando:false,erro:e.message});
  }
  atualizarCorpoMercado(loja,itemId);
}

/* -------- importação do relatório .xlsx "Mais vendidos nas suas categorias" -------- */
// acha a aba mais ESPECÍFICA do arquivo (o relatório vem com uma aba por nível da categoria, da
// mais ampla pra mais estreita, tipo "Casa, Móveis e Decoração" > "Cozinha" > ... > "Afiadores de
// Facas Manuais" - as últimas abas ficam vazias/placeholder quando a árvore não desce tanto).
function mercadoAcharPlanilhaValida(wb){
  let ultimaValida=null;
  for(const nome of wb.SheetNames){
    if(nome==='Definições') continue;
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,raw:true,blankrows:false});
    if(!aoa.length) continue;
    const primeiraCel=String((aoa[0]&&aoa[0][0])||'');
    if(primeiraCel.startsWith('{')) continue; // placeholder tipo "{CAT_L6_TITLE}"
    const linhaHeader=aoa.findIndex(r=>r.includes('Nome')&&r.includes('Unidades vendidas'));
    if(linhaHeader<0) continue;
    const dados=aoa.slice(linhaHeader+1).filter(r=>r&&r[1]&&String(r[1]).trim()&&String(r[1]).trim()!=='-');
    if(!dados.length) continue;
    ultimaValida={nome, header:aoa[linhaHeader], dados};
  }
  return ultimaValida;
}
function parseRelatorioMercadoXlsx(arrayBuffer){
  const wb=XLSX.read(arrayBuffer,{type:'array'});
  const achado=mercadoAcharPlanilhaValida(wb);
  if(!achado) throw new Error('Não encontrei uma aba com produtos nesse arquivo. Confira se é o relatório "Mais vendidos nas suas categorias" baixado do Mercado Livre (Métricas → Análise de mercado → Tendências por categoria → Baixar relatório).');
  const h=achado.header;
  const iNome=h.indexOf('Nome'), iPreco=h.indexOf('Preço'), iUnid=h.indexOf('Unidades vendidas'), iVis=h.indexOf('Visualizações');
  const produtos=achado.dados.map(r=>({
    nome:String(r[iNome]||'').trim(),
    preco:parseMoeda(r[iPreco]),
    unidades:Number(r[iUnid])||0,
    visualizacoes:Number(r[iVis])||0
  }));
  const unidadesTotais=produtos.reduce((s,pr)=>s+pr.unidades,0);
  const vendasBrutasTotais=produtos.reduce((s,pr)=>s+pr.unidades*pr.preco,0);
  return {
    categoriaNome:achado.nome,
    produtos,
    unidadesTotais,
    vendasBrutasTotais:Math.round(vendasBrutasTotais*100)/100,
    precoMedio:unidadesTotais>0?Math.round((vendasBrutasTotais/unidadesTotais)*100)/100:0
  };
}
function mercadoExtrairPeriodoDoNome(nomeArquivo){
  const m=/(\d{4}-\d{2}-\d{2})a(\d{4}-\d{2}-\d{2})/.exec(nomeArquivo||'');
  return m?{de:m[1],ate:m[2]}:{de:'',ate:''};
}
async function onArquivoMercadoSelecionado(loja,itemId,input){
  const key=mercadoKey(loja,itemId);
  const file=input.files&&input.files[0];
  input.value='';
  if(!file) return;
  try{
    if(!window.XLSX) throw new Error('A biblioteca de leitura de planilha ainda não carregou — recarregue a página e tente de novo.');
    const buf=await file.arrayBuffer();
    const resultado=parseRelatorioMercadoXlsx(buf);
    const periodo=mercadoExtrairPeriodoDoNome(file.name);
    mercadoImportPreview[key]=Object.assign({},resultado,{periodoDe:periodo.de,periodoAte:periodo.ate,nomeArquivo:file.name});
  }catch(e){ alert('Não consegui ler esse arquivo: '+e.message); }
  atualizarCorpoMercado(loja,itemId);
}

/* gráfico simples em SVG inline (sem lib externa, igual ao resto do Doca) - cada série é
   normalizada pro próprio máximo (0-100%), pra comparar a FORMA/sazonalidade das duas curvas
   mesmo com escalas bem diferentes (categoria inteira vs um produto só). */
function svgMercadoChart(labels,catVals,propVals){
  const w=Math.max(340,labels.length*66), h=150, padL=8,padR=8,padT=14,padB=24;
  const norm=(arr)=>{ const max=Math.max(1,...arr.map(v=>Number(v)||0)); return arr.map(v=>(Number(v)||0)/max*100); };
  const nc=norm(catVals), np=norm(propVals);
  const stepX=labels.length>1?(w-padL-padR)/(labels.length-1):0;
  const y=(v)=>padT+(100-v)/100*(h-padT-padB);
  const pts=(arr)=>arr.map((v,i)=>`${(padL+i*stepX).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const labelsHtml=labels.map((l,i)=>`<text x="${(padL+i*stepX).toFixed(1)}" y="${h-8}" font-size="9" text-anchor="middle" fill="#999">${esc(l)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block">
    <polyline points="${pts(nc)}" fill="none" stroke="#8a8aff" stroke-width="2"/>
    <polyline points="${pts(np)}" fill="none" stroke="#ffb020" stroke-width="2"/>
    ${labelsHtml}
  </svg>`;
}

      ${historico.map(h=>{

const MERCADO_MESES_ABREV=['jan','fev','mar','abr','maio','jun','jul','ago','set','out','nov','dez'];
function sazonalidadeValor(historico,mesKey){
  const h=(historico||[]).find(x=>x.mes===mesKey);
  return (h&&h.vendas_brutas_categoria!=null)?h.vendas_brutas_categoria:null;
}
// 21/08 (pedido real do Felipe): ele quer comparar a sazonalidade da categoria (esse ano x ano
// passado) igual o gráfico "Sazonalidade anual" que o próprio Mercado Livre mostra na tela de
// Análise de Mercado. Essa série mês a mês NÃO está no relatório .xlsx (que é só um retrato de um
// período) nem em nenhuma API pública - só existe visualmente naquele gráfico do ML, mas passando
// o mouse em cada ponto ele mostra o valor exato (confirmado pelo Felipe). Então aqui é só uma
// tabela pra colar esses 12+12 valores (uma vez), reaproveitando o mesmo /mercado/categoria com
// mes em formato "YYYY-MM" que já existia antes (a busca de "suas vendas" mês a mês pra essas
// linhas já acontece automática, igual qualquer outra linha do histórico).
// 21/08 (achado real do Felipe): a primeira versão só criava uma TABELA pra digitar os valores -
// não desenhava o gráfico de verdade comparando as duas linhas mês a mês (a tabela virava só mais
// linhas soltas no gráfico/tabela genérico de período, uma sequência única, sem alinhar por mês).
// Esse gráfico é dedicado: eixo X sempre jan-dez, uma linha por ano (roxo = ano atual, cinza = ano
// anterior, igual as cores do próprio Mercado Livre) + uma terceira linha (laranja) com as SUAS
// vendas mês a mês do ano atual - essa parte é 100% automática, puxada da mesma API de pedidos.
function svgMercadoSazonalidadeChart(mesesAbrev,anoAtualVals,anoAnteriorVals,suasVendasVals){
  const w=640,h=190,padL=58,padR=10,padT=14,padB=22;
  const stepX=(w-padL-padR)/(mesesAbrev.length-1);
  const maxCategoria=Math.max(1,...anoAtualVals.map(v=>Number(v)||0),...anoAnteriorVals.map(v=>Number(v)||0));
  const maxProprio=Math.max(1,...suasVendasVals.map(v=>Number(v)||0));
  const yCat=(v)=>padT+(1-(Number(v)||0)/maxCategoria)*(h-padT-padB);
  const yProp=(v)=>padT+(1-(Number(v)||0)/maxProprio)*(h-padT-padB);
  const linha=(arr,fn)=>arr.map((v,i)=>(v==null?null:`${(padL+i*stepX).toFixed(1)},${fn(v).toFixed(1)}`)).filter(Boolean).join(' ');
  const labelsHtml=mesesAbrev.map((l,i)=>`<text x="${(padL+i*stepX).toFixed(1)}" y="${h-6}" font-size="9" text-anchor="middle" fill="#999">${esc(l)}</text>`).join('');
  const gridHtml=[0,0.5,1].map(f=>{
    const val=maxCategoria*f, yy=yCat(val);
    return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${w-padR}" y2="${yy.toFixed(1)}" stroke="#333" stroke-width="1" stroke-dasharray="2,3"/><text x="${padL-6}" y="${(yy+3).toFixed(1)}" font-size="9" text-anchor="end" fill="#777">${fmtMoney(val)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block">
    ${gridHtml}
    <polyline points="${linha(anoAnteriorVals,yCat)}" fill="none" stroke="#999" stroke-width="2"/>
    <polyline points="${linha(anoAtualVals,yCat)}" fill="none" stroke="#8a5cf6" stroke-width="2"/>
    <polyline points="${linha(suasVendasVals,yProp)}" fill="none" stroke="#ffb020" stroke-width="2" stroke-dasharray="5,3"/>
    ${labelsHtml}
  </svg>`;
}

}
async function salvarMercadoSazonalidade(loja,itemId,corpo){
  const base=backendUrl();
  if(!base){ alert('Configure a URL do backend primeiro (em Produtos → Atualizar).'); return; }
  const inputs=Array.from(corpo.querySelectorAll('[data-mercadosazon]')).filter(inp=>(inp.value||'').trim());
  if(!inputs.length){ alert('Preencha pelo menos um mês antes de salvar.'); return; }
  let salvos=0, falhas=[];
  for(const inp of inputs){
    const mes=inp.dataset.mercadosazon;
    try{
      const r=await fetch(`${base}/mercado/categoria`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({loja,itemId,mes,vendasBrutas:parseMoeda(inp.value),fonte:'manual'})
      });
      let j; try{ j=await r.json(); }catch(e){ j=null; }
      if(r.ok&&j&&j.ok) salvos++; else falhas.push(mes);
    }catch(e){ falhas.push(mes); }
  }
  if(falhas.length) alert(`Salvou ${salvos} mês(es). Falhou: ${falhas.join(', ')} — tenta de novo só esses.`);
  else toast(`✓ ${salvos} mês(es) de sazonalidade salvos.`);
  await carregarMercadoProduto(loja,itemId);
}
// 21/08 (2º achado real do Felipe): expandir um produto travava o app inteiro (não dava pra
// colapsar nem clicar em mais nada). Causa: o ontoggle do <details> chamava renderMercado()
// inteiro, que reconstruía TODO o innerHTML da aba - inclusive o próprio <details> que estava no
// meio do próprio evento de toggle dele. Isso deixava o DOM/eventos num estado inconsistente e
// travava a interação. Fix: cada produto agora tem um <div id="corpo_..."> fixo, e toggle/edições
// dentro de um card só tocam nesse div (via bindMercadoCorpo/atualizarCorpoMercado), nunca a aba
// inteira de novo.
function bindMercadoCorpo(corpo,p,key){
  if(!corpo) return;
  corpo.querySelectorAll('[data-mercadorecarregar]').forEach(b=>{
    b.onclick=()=>{ const [loja,itemId]=b.dataset.mercadorecarregar.split('|'); carregarMercadoProduto(loja,itemId); };
  });
  corpo.querySelectorAll('[data-mercadoexcluirmes]').forEach(b=>{
    b.onclick=()=>{ const [loja,itemId,mes]=b.dataset.mercadoexcluirmes.split('|'); confirmAction(`Excluir os dados de ${mes} dessa categoria?`,()=>excluirMercadoMes(loja,itemId,mes)); };
  });
  corpo.querySelectorAll('[data-mercadosalvarsazon]').forEach(b=>{
    b.onclick=()=>{ const [loja,itemId]=b.dataset.mercadosalvarsazon.split('|'); salvarMercadoSazonalidade(loja,itemId,corpo); };
  });
  corpo.querySelectorAll('[data-mercadoarquivo]').forEach(inp=>{
    inp.onchange=()=>{ const [loja,itemId]=inp.dataset.mercadoarquivo.split('|'); onArquivoMercadoSelecionado(loja,itemId,inp); };
  });
  // 21/08 (achado real do Felipe): o <input type="file"> sozinho não estava abrindo o seletor de
  // arquivo ao clicar (só o input cru, sem nenhum botão visível) - trocado pro mesmo padrão já
  // usado no importador de PDF de Comprar: um botão comum dispara o clique no input escondido via
  // JS, que é mais confiável que depender do clique direto no <input type="file"> puro.
  corpo.querySelectorAll('[data-mercadoescolherarquivo]').forEach(b=>{
    b.onclick=()=>{
      const chave=b.dataset.mercadoescolherarquivo;
      const inp=Array.from(corpo.querySelectorAll('[data-mercadoarquivo]')).find(i=>i.dataset.mercadoarquivo===chave);
      if(inp) inp.click();
    };
  });
  // mesma lógica pro link "abrir tendência": em vez de confiar só no clique nativo do <a>, abre
  // explicitamente via JS (window.open) dentro do próprio gesto de clique - mais robusto contra
  // qualquer coisa que possa estar interceptando o clique simples no link (relatado pelo Felipe).
  corpo.querySelectorAll('[data-mercadoabrirtendencia]').forEach(a=>{
    a.onclick=(ev)=>{ ev.preventDefault(); window.open(a.getAttribute('href'),'_blank','noopener'); };
  });
  corpo.querySelectorAll('[data-mercadoperiodo]').forEach(inp=>{
    inp.onchange=()=>{
      const [k,campo]=inp.dataset.mercadoperiodo.split('||');
      const pv=mercadoImportPreview[k]; if(!pv) return;
      if(campo==='de') pv.periodoDe=inp.value; else pv.periodoAte=inp.value;
    };
  });
  corpo.querySelectorAll('[data-mercadoconfirmarimport]').forEach(b=>{
    b.onclick=()=>{ const [loja,itemId]=b.dataset.mercadoconfirmarimport.split('|'); confirmarImportacaoMercado(loja,itemId); };
  });
  corpo.querySelectorAll('[data-mercadocancelarimport]').forEach(b=>{
    b.onclick=()=>{ const [loja,itemId]=b.dataset.mercadocancelarimport.split('|'); cancelarImportacaoMercado(loja,itemId); };
  });
}

    ${produtosComItem.length?produtosComItem.map(p=>{

      const aberto=mercadoAberto.has(key);
      const d=mercadoDados[key];
      const idSeguro=mercadoIdSeguro(key);
      return `<details class="card" style="margin-bottom:10px" ${aberto?'open':''} data-mercadodetails="${esc(key)}" id="det_${idSeguro}">
        <summary style="cursor:pointer;font-weight:600">${esc(p.titulo||p.sku)} <span class="muted" style="font-weight:400">— ${esc(p.loja)} · SKU ${esc(p.sku)}</span></summary>

      </details>`;
    }).join(''):'<p class="empty">Nenhum produto com anúncio vinculado ainda.</p>'}
  `;
  el.querySelectorAll('[data-mercadodetails]').forEach(det=>{
    det.ontoggle=()=>{
      const key=det.dataset.mercadodetails;
      const corpo=document.getElementById('corpo_'+mercadoIdSeguro(key));
      if(det.open){
        mercadoAberto.add(key);
        const [loja,itemId]=key.split('|');
        if(!mercadoDados[key]){
          if(corpo) corpo.innerHTML=barraIndeterminada('Carregando dados de mercado...');
          carregarMercadoProduto(loja,itemId);
        } else {
          atualizarCorpoMercado(loja,itemId);
        }
      } else {
        mercadoAberto.delete(key);
        if(corpo) corpo.innerHTML='';
      }
    };
  });
  // produtos que já começam abertos tiveram o corpo preenchido direto no template acima (pra
  // primeira pintura ficar rápida) - precisa vincular os botões desse corpo aqui, fora do fluxo
  // de toggle (que só roda quando o usuário clica de novo).
  produtosComItem.forEach(p=>{
    const key=mercadoKey(p.loja,p.mlItemId);
    if(mercadoAberto.has(key)){
      const corpo=document.getElementById('corpo_'+mercadoIdSeguro(key));
      bindMercadoCorpo(corpo,p,key);
    }
  });
}

/* ---------- listas de tarefas ---------- */
function addLista(nome){
  snapshot('nova lista de tarefas');
  const l={id:gerarId('lst'),nome:(nome||'').trim().toUpperCase()||'NOVA LISTA'};
  state.listas.push(l); listaAtual=l.id; persist();
  return l;
}
function renomearLista(id,nome){
  const l=state.listas.find(x=>x.id===id); if(!l) return;
  snapshot('renomear lista'); l.nome=(nome||'').trim().toUpperCase()||l.nome; persist();
}
function excluirLista(id){
  if(state.listas.length<=1){ alert('É preciso ter ao menos uma lista.'); return; }
  snapshot('exclusão de lista de tarefas');
  state.listas=state.listas.filter(l=>l.id!==id);
  state.tarefas=state.tarefas.filter(t=>t.listaId!==id);
  if(listaAtual===id) listaAtual=state.listas[0].id;
  persist();
}
function tarefasDaLista(id){ return state.tarefas.filter(t=>t.listaId===id); }
/* ---------- tarefas ---------- */
function addTarefa(titulo,data,hora,repetirMensal,obs,resetaTipo){
  snapshot('nova tarefa');
  state.tarefas.unshift({id:gerarId('t'),listaId:listaAtual,titulo:(titulo||'').trim().toUpperCase(),data:data||'',hora:hora||'',repetirMensal:!!repetirMensal,obs:(obs||'').trim(),subs:[],criadoEm:Date.now(),resetaTipo:resetaTipo||null});
  persist();
}
function updateTarefa(id,patch){
  const t=state.tarefas.find(x=>x.id===id); if(!t) return;
  snapshot('edição de tarefa');
  Object.assign(t,patch); persist();
}
function concluirTarefa(id){
  const t=state.tarefas.find(x=>x.id===id); if(!t) return {ok:false};
  if(t.repetirMensal&&t.data){
    snapshot('conclusão (recorrente) da tarefa "'+(t.titulo||'').slice(0,30)+'"');
    t.data=proximoMes(t.data);
    (t.subs||[]).forEach(s=>s.feito=false);
    persist();
    return {ok:true,repetiu:true,novaData:t.data};
  }
  snapshot('conclusão da tarefa "'+(t.titulo||'').slice(0,30)+'"');
  state.tarefas=state.tarefas.filter(x=>x.id!==id);
  persist();
  return {ok:true,repetiu:false};
}
/* período atual, pra controlar as tarefas de lista "Gestão Ativa" (resetaTipo) - pedido do
   Felipe 19/08: tarefa dessas listas não pode sumir ao concluir (quer continuar vendo o item, só
   marcado como feito), mas precisa voltar a pedir conclusão de novo no período seguinte (mês ou
   semana, à escolha), sozinho - sem precisar reabrir na mão. Como concluidoMes guarda o período
   em que foi concluída, comparar contra o período atual a cada render já resolve o "reset"
   sozinho, sem precisar de nenhum job. */
function mesAtualStr(){ return hoje().slice(0,7); }
/* chave de semana simples e estável (não é a semana ISO "oficial", só precisa trocar uma vez por
   semana) - pedido do Felipe 19/08, opção semanal de reset em Gestão Ativa */
function semanaAtualStr(){ return 'S'+Math.floor(Math.floor(Date.now()/864e5)/7); }
function periodoAtualParaTarefa(t){
  return (t&&t.resetaTipo==='semanal')?semanaAtualStr():mesAtualStr();
}
function tarefaFeitaEsteMes(t){ return !!(t&&t.concluidoMes===periodoAtualParaTarefa(t)); }
function concluirTarefaMensal(id){
  const t=state.tarefas.find(x=>x.id===id); if(!t) return;
  snapshot('conclusão (periódica, não some) da tarefa "'+(t.titulo||'').slice(0,30)+'"');
  t.concluidoMes=periodoAtualParaTarefa(t);
  persist();
}
function desconcluirTarefa(id){
  const t=state.tarefas.find(x=>x.id===id); if(!t) return;
  snapshot('reabertura da tarefa "'+(t.titulo||'').slice(0,30)+'"');
  t.concluidoMes=null;
  persist();
}
/* Gestão Ativa agora é por tarefa: cada uma escolhe mensal, semanal, ou nenhum (comportamento
   normal, some ao concluir) - dá pra misturar dentro da mesma lista - pedido do Felipe 19/08 */
function alternarGestaoTipoTarefa(id,tipo){
  const t=state.tarefas.find(x=>x.id===id); if(!t) return;
  const novo=t.resetaTipo===tipo?null:tipo;
  snapshot((novo?'ativar':'desativar')+' modo '+tipo+' na tarefa "'+(t.titulo||'').slice(0,30)+'"');
  t.resetaTipo=novo;
  if(!novo) t.concluidoMes=null;
  persist();
}
function moverTarefa(id,paraId){
  if(id===paraId) return;
  const de=state.tarefas.findIndex(t=>t.id===id);
  const para=state.tarefas.findIndex(t=>t.id===paraId);
  if(de<0||para<0) return;
  snapshot('reordenação de tarefas');
  const [t]=state.tarefas.splice(de,1);
  state.tarefas.splice(para,0,t);
  persist();
}
function addSub(tid,titulo){
  const t=state.tarefas.find(x=>x.id===tid); if(!t) return;
  const tit=(titulo||'').trim(); if(!tit) return;
  snapshot('nova subtarefa');
  if(!t.subs) t.subs=[];
  t.subs.push({id:gerarId('s'),titulo:tit.toUpperCase(),feito:false});
  persist();
}
function alternarSub(tid,sid){
  const t=state.tarefas.find(x=>x.id===tid); if(!t) return;
  const s=(t.subs||[]).find(x=>x.id===sid); if(!s) return;
  snapshot(s.feito?'reabrir subtarefa':'concluir subtarefa');
  s.feito=!s.feito; persist();
}
/* mesma ideia do concluirTarefaMensal: em lista "Gestão Ativa", subtarefa concluída fica marcada
   com concluidoMes (não usa mais o boolean feito) - e a tarefa principal finaliza sozinha quando
   todas as subtarefas da vez estiverem com concluidoMes === mês atual - pedido do Felipe 19/08 */
function alternarSubMensal(tid,sid){
  const t=state.tarefas.find(x=>x.id===tid); if(!t) return;
  const s=(t.subs||[]).find(x=>x.id===sid); if(!s) return;
  const periodo=periodoAtualParaTarefa(t);
  const feitoAgora=s.concluidoMes===periodo;
  snapshot(feitoAgora?'reabrir subtarefa (período)':'concluir subtarefa (período)');
  s.concluidoMes=feitoAgora?null:periodo;
  const todasFeitas=(t.subs||[]).length>0&&t.subs.every(x=>x.concluidoMes===periodo);
  t.concluidoMes=todasFeitas?periodo:null;
  persist();
}
function editarSub(tid,sid,titulo){
  const t=state.tarefas.find(x=>x.id===tid); if(!t) return;
  const s=(t.subs||[]).find(x=>x.id===sid); if(!s) return;
  snapshot('edição de subtarefa'); s.titulo=(titulo||'').toUpperCase(); persist();
}
function removerSub(tid,sid){
  const t=state.tarefas.find(x=>x.id===tid); if(!t) return;
  snapshot('remoção de subtarefa');
  t.subs=(t.subs||[]).filter(x=>x.id!==sid); persist();
}
/* arrasta a subtarefa sid pra posição da subtarefa paraSid (mesma tarefa) */
function moverSubPara(tid,sid,paraSid){
  if(sid===paraSid) return;
  const t=state.tarefas.find(x=>x.id===tid); if(!t||!Array.isArray(t.subs)) return;
  const de=t.subs.findIndex(x=>x.id===sid), para=t.subs.findIndex(x=>x.id===paraSid);
  if(de<0||para<0) return;
  snapshot('reordenação de subtarefas');
  const [s]=t.subs.splice(de,1);
  t.subs.splice(t.subs.findIndex(x=>x.id===paraSid),0,s);
  persist();
}
function tarefasAtrasadas(lid){ const h=hoje(); return state.tarefas.filter(t=>(!lid||t.listaId===lid)&&t.data&&t.data<h).length; }

               Mercado Livre (vende com SKU próprio), então a média/dia sai da venda dele mesmo,
               igual a qualquer outro item. E o "disponível" existe sim: é quantos kits dá pra
               montar com o estoque livre dos componentes hoje - o componente que tiver menos é
               quem limita (mesma conta do kitVirtualQtd usado na aba Produtos). */
            const pjKit=projecaoEnvioItem(p,i.solicitado);
            const kv=kitVirtualQtd(p);
            const dispKit=kv?kv.disp:null;
            return `<tr><td class="mono">🧩 ${esc(p.sku)}${medalhaProduto(p)} <button class="btn sm" data-envkitdet="${i.id}" style="padding:1px 7px;font-size:11px">${aberto?'▾':'▸'} detalhar</button></td><td>${esc(p.codigo)}</td>

            <td class="num ${gc?'pend':''}">${fmtInt(gc)}</td>
            <td class="num ${dispKit>0?'okv':''}" title="${dispKit==null?'Kit sem componentes cadastrados':'Quantos kits dá pra montar com o estoque livre dos componentes hoje (o componente com menos é quem limita) — veja componente a componente em detalhar'}">${dispKit==null?'—':fmtInt(dispKit)}</td>

            <td class="num" title="Ponderada 7/15/30 dias da venda do próprio anúncio do kit, igual a Previsão de reposição">${pjKit.media>0?pjKit.media.toFixed(2):'—'}</td>
            <td title="Contando aptas + em transferência + esta programação">${pjKit.diaZero?fmtData(pjKit.diaZero):(pjKit.media>0?'—':'sem venda')}</td>
            <td><button class="btn sm" data-movkit="${e.id}|${i.id}" title="Mover este kit inteiro (com todos os componentes) pra outro envio programado desta loja">↦ Mover</button>
              <button class="btn sm danger-outline" data-remkit="${e.id}|${i.id}">Remover</button></td></tr>
            ${aberto?grupo.map(g=>{ const pg=prodById(g.skuEscolhidoId||g.produtoId); if(!pg) return '';
              const pj=projecaoEnvioItem(pg,g.solicitado);
              const dispG=disponivel(produtoEfetivo(pg));
              return `<tr style="opacity:.75"><td class="mono" style="padding-left:22px">↳ ${esc(pg.sku)}</td><td>${esc(pg.codigo)}</td>
              <td class="num ${g.reservadoColeta?'cam':''}">${fmtInt(g.reservadoColeta||0)}</td>
              <td class="num ${g.geradoCompra?'pend':''}">${fmtInt(g.geradoCompra||0)}</td>
              <td class="num ${dispG>0?'okv':''}">${fmtInt(dispG)}</td>
              <td class="hint">${fmtInt(g.solicitado)} un. — parte do kit acima</td>
              <td class="num">${pj.media>0?pj.media.toFixed(2):'—'}</td>
              <td>${pj.diaZero?fmtData(pj.diaZero):(pj.media>0?'—':'sem venda')}</td>
              <td></td></tr>`; }).join(''):''}`;
          }
          const avisoItem=avisos.find(a=>a.envioId===e.id&&a.produtoId===i.produtoId);
          const pj=projecaoEnvioItem(p,i.solicitado);
          const dispMais=disponivel(produtoEfetivo(p));
          return `<tr><td class="mono">${esc(p.sku)}${medalhaProduto(p)}</td><td>${esc(p.codigo)}</td>
            <td class="num ${i.reservadoColeta?'cam':''}">${fmtInt(i.reservadoColeta||0)}</td>
            <td class="num ${i.geradoCompra?'pend':''}">${fmtInt(i.geradoCompra||0)}</td>
            <td class="num ${dispMais>0?'okv':''}" title="Estoque livre (galpão + comprado aguardando coleta) pra reservar mais nesse envio">${fmtInt(dispMais)}</td>
            <td><input type="number" min="0" value="${i.solicitado}" class="qty-acao" data-totitem="${e.id}|${i.id}"
              title="Altere a quantidade desta programação — o sistema refaz a reserva e a compra">
              ${avisoItem?` <button class="btn sm danger" data-avisofok="${avisoItem.id}" title="${fmtInt(avisoItem.qtd)} un. ${avisoItem.direcao==='adicionar'?'adicionadas aqui':'tiradas daqui'} (${avisoItem.motivo==='manual'?'alterado manualmente':'fornecedor não tem tudo'}) — clique depois de ${avisoItem.direcao==='adicionar'?'adicionar':'retirar'} o mesmo tanto no envio real do Mercado Livre.">${avisoItem.direcao==='adicionar'?'➕ ajustar no ML ↺':'🚨 ajustar no ML ↺'}</button>`:''}</td>
            <td class="num" title="Ponderada 7/15/30 dias, igual a Previsão de reposição">${pj.media>0?pj.media.toFixed(2):'—'}</td>
            <td title="Contando aptas + em transferência + esta programação">${pj.diaZero?fmtData(pj.diaZero):(pj.media>0?'—':'sem venda')}</td>
            <td><button class="btn sm" data-movitem="${e.id}|${i.id}" title="Mover para outro envio já programado, ou criar um FULL de emergência só com este item">↦ Mover</button>
              <button class="btn sm danger-outline" data-remitem="${e.id}|${i.id}">Remover</button></td></tr>`;
        }).join('')}
        </tbody></table></div>`:`<p class="empty-inline">Envio sem itens.</p>`}
        ${(c||g)?`<div class="aviso atencao" style="margin:12px 0 0"><span>⚠</span><span><b>Ainda não pode ser finalizado.</b> Faltam ${fmtInt(c+g)} un. das ${fmtInt(a+c+g)} un. do envio: ${c?`<b>${fmtInt(c)}</b> por coletar`:''}${c&&g?' e ':''}${g?`<b>${fmtInt(g)}</b> por comprar`:''}.${a>0?' Receba tudo no galpão, ou use Editar para reduzir a quantidade do SKU.':' Compre e receba a mercadoria no galpão.'}</span></div>`:''}

  document.getElementById('btnNovoEnvio').onclick=()=>openEnvioModal(null,confirmarLojaAtual!=='todas'?confirmarLojaAtual:null);
  document.getElementById('btnEscolherPdf').onclick=()=>document.getElementById('inputPdf').click();
  document.getElementById('inputPdf').onchange=e=>{ if(e.target.files[0]) processarPdf(e.target.files[0]); e.target.value=''; };
  const d=document.getElementById('dropPdf');
  d.ondragover=e=>{ e.preventDefault(); d.classList.add('dragover'); };
  d.ondragleave=()=>d.classList.remove('dragover');
  d.ondrop=e=>{ e.preventDefault(); d.classList.remove('dragover'); if(e.dataTransfer.files[0]) processarPdf(e.dataTransfer.files[0]); };
  el.querySelectorAll('[data-alocar]').forEach(b=>b.onclick=()=>{
    const n=alocarPendentes(b.dataset.alocar);
