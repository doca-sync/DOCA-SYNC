        <span>A coletar: <b>${fmtInt(p.qtd.coletar)}</b></span>
        <span>No galpão: <b>${fmtInt(totalNoGalpao(p))}</b></span>
        <span>Reservado: <b>${fmtInt(rl+rc)}</b> <span class="muted">(${fmtInt(rl)} no galpão + ${fmtInt(rc)} a coletar)</span></span>
        <span>Disponível: <b>${fmtInt(disponivel(p))}</b></span>

      </div>`}
      <hr class="modal-sep">
      <button class="btn danger-outline" id="btnExcluirProduto">Excluir este SKU do sistema</button>`:''}`;
  document.getElementById('btnCancelar').onclick=closeModal;

  if(editing){

    body.querySelectorAll('[data-remcomp]').forEach(b=>b.onclick=()=>{
      const comp=prodById(b.dataset.remcomp);
      confirmAction(`Remover ${comp?comp.sku:'este componente'} do kit ${p.sku}? Isso não desfaz nenhuma compra já somada antes - só para de contar nas próximas montagens.`,()=>{
        removerComponenteKit(id,b.dataset.remcomp); openProdutoModal(id); toast('Componente removido do kit.');
      });
    });
    const btnAddComponente=document.getElementById('btnAddComponente');
    if(btnAddComponente) btnAddComponente.onclick=()=>{
      const produtoId=document.getElementById('fNovoComponente').value;
      if(!produtoId){ alert('Escolha um produto pra adicionar como componente.'); return; }
      const r=adicionarComponenteKit(id,produtoId,document.getElementById('fQtdComponente').value);
      if(!r.ok){ alert(r.msg); return; }
      openProdutoModal(id); toast('Componente adicionado ao kit.');
    };
    const btnCriarComponenteInterno=document.getElementById('btnCriarComponenteInterno');
    if(btnCriarComponenteInterno) btnCriarComponenteInterno.onclick=()=>{
      const sku=document.getElementById('fNovoSkuInterno').value;
      const qtd=document.getElementById('fQtdSkuInterno').value;
      const r=criarComponenteInterno(id,sku,qtd);
      if(!r.ok){ alert(r.msg); return; }
      openProdutoModal(id); toast('SKU interno criado e adicionado ao kit.');
    };
    const btnAjustar=document.getElementById('btnAjustar');
    if(btnAjustar) btnAjustar.onclick=()=>{
      const r=ajustarEstoque(id,{local:document.getElementById('ajLocal').value});
      if(!r.ok){ alert(r.msg); return; }
      openProdutoModal(id);
      const pp=prodById(id);
      toast(`Contagem salva: ${fmtInt(totalNoGalpao(pp))} un. no galpão.`+(r.reconciliado?` ${fmtInt(r.reconciliado)} un. foram destinadas a envios pendentes.`:''));
    };
    const btnAbrirMestre=document.getElementById('btnAbrirMestre');
    if(btnAbrirMestre) btnAbrirMestre.onclick=()=>openProdutoModal(mestreVinc.id);
    const btnDesvincular=document.getElementById('btnDesvincular');
    if(btnDesvincular) btnDesvincular.onclick=()=>{
      confirmAction(`Desvincular ${p.sku} do estoque de ${mestreVinc.sku}? Ele volta a ter compra/coleta/estoque próprios (hoje zerados — ajuste na aba Comprar/Coletar depois de desvincular).`,()=>{
        updateProduto(id,{vinculadoA:null}); openProdutoModal(id); toast('SKU desvinculado.');
      });
    };
    const btnVincular=document.getElementById('btnVincular');
    if(btnVincular) btnVincular.onclick=()=>{
      const alvoId=document.getElementById('fVincularA').value;
      if(!alvoId){ alert('Escolha um SKU pra vincular.'); return; }
      const alvo=prodById(alvoId);
      /* estoque próprio (Comprar/Coletar/Local) e reservas em envio FULL deste SKU não ficam
         perdidos - são transferidos automaticamente pro SKU mestre ao vincular (ver
         mesclarEstoqueNoVinculo), não precisa mais zerar/mover nada à mão antes. */
      const temEstoqueProprio=(p.qtd.comprar||0)+(p.qtd.coletar||0)+(p.qtd.local||0)>0;
      const temReserva=reservadoDe(p)>0;
      const avisoTransferencia=(temEstoqueProprio||temReserva)
        ?` O estoque próprio deste SKU (${fmtInt(p.qtd.comprar)} a comprar, ${fmtInt(p.qtd.coletar)} a coletar, ${fmtInt(p.qtd.local)} no galpão${temReserva?', incluindo o que já está reservado em envio':''}) será transferido automaticamente pro SKU ${alvo.sku}.`
        :'';
      confirmAction(`Vincular ${p.sku} ao estoque de ${alvo.sku}? Este SKU passa a não ter mais compra/coleta/ajuste próprios — tudo isso passa a ser feito no SKU ${alvo.sku}.${avisoTransferencia}`,()=>{
        batch('vínculo de '+p.sku+' ao estoque de '+alvo.sku,()=>{
          if(temEstoqueProprio||temReserva) mesclarEstoqueNoVinculo(id,alvoId);
          updateProduto(id,{vinculadoA:alvoId});
        });
        openProdutoModal(id); toast(`Vinculado ao estoque de ${alvo.sku}.`+(avisoTransferencia?' Estoque próprio transferido.':''));
      });
    };
    document.getElementById('btnExcluirProduto').onclick=()=>{
      confirmAction(`Excluir o SKU ${p.sku} (${p.loja})? Ele sai também dos envios FULL em que estiver. Dá pra reverter no botão Desfazer.`,()=>{
        deleteProduto(id); closeModal(); toast('SKU excluído.');
      });
    };
  }
}
/* ---------- comprar ---------- */
function wireAcaoButtons(scope){
  scope.querySelectorAll('[data-comprei]').forEach(b=>{
    b.onclick=()=>{
      const [pid,cid]=b.dataset.comprei.split('|');
      const p=prodById(pid);
      const finalizar=(contaPagante)=>{
        const r=comprarPedido(pid,cid,contaPagante);
        if(!r.ok){ alert(r.msg); return; }
        toast(`${fmtInt(r.qtd)} un. de ${p.sku} foram para a lista de coleta.`);
      };
      /* produto adiantado pelo Amauri não desembolsa dinheiro agora - compra direto, sem
         perguntar de qual loja saiu o pagamento. Os demais, pergunta - pedido do Felipe 24/08,
         já que ele às vezes paga com o saldo de outra loja que tem dinheiro sobrando. */
      if(produtoAdiantadoPeloAmauri(p) || !(p.custo>0)){ finalizar(p.loja); return; }
      const body=openModal(false);
      body.innerHTML=`<h3>Confirmar compra</h3>
        <p class="hint" style="margin:0 0 10px">${esc(p.sku)} — pago com o saldo de qual loja?</p>
        <div class="form-grid" style="grid-template-columns:1fr"><label>Loja pagante<select id="cpLoja">${optsLojas(p.loja)}</select></label></div>
        <div class="modal-actions"><button class="btn" id="btnCancelarCompra">Cancelar</button><button class="btn acc" id="btnConfirmarCompra">Confirmar compra</button></div>`;
      document.getElementById('btnCancelarCompra').onclick=closeModal;
      document.getElementById('btnConfirmarCompra').onclick=()=>{
        const contaPagante=document.getElementById('cpLoja').value;
        closeModal();
        finalizar(contaPagante);
      };
    };
  });
  scope.querySelectorAll('[data-receber]').forEach(b=>{
    b.onclick=()=>{
      const [pid,lid]=b.dataset.receber.split('|');
      const r=receberLote(pid,lid);
      if(!r.ok){ alert(r.msg); return; }
      toast(`${fmtInt(r.qtd)} un. entraram no galpão.`);
    };
  });
}
/* checa, pra um pedido pendente (ainda não comprado), se já tem caixa garantido (saldo + agenda
   de liberação - despesas/compras já conhecidas) pra pagar ele - usa a mesma projeção de 60 dias
   do Fluxo de Caixa. Pedido do Felipe 24/08: "quando estiver em comprar, vai aparecer o valor da
   compra... e se possível o que teria dinheiro pra fazer a compra". Produto adiantado pelo Amauri
   não desembolsa nada, então não faz sentido checar caixa pra ele. */
function badgeCaixaParaCompra(p,custoTotal,denseLoja){
  if(produtoAdiantadoPeloAmauri(p)) return '<span class="muted" title="Adiantado pelo Amauri — não sai dinheiro da loja agora">—</span>';
  if(!(custoTotal>0)) return '<span class="muted">—</span>';
  const check=primeiroDiaComCaixaEmDense(denseLoja,custoTotal);
  const hojeStr=hoje();
  if(check&&check.data===hojeStr) return `<span class="badge okv" title="Saldo projetado dá pra essa compra hoje sem faltar pra mais nada depois">✓ tem caixa hoje</span>`;
  if(check) return `<span class="badge pend" title="Só dá sem faltar caixa depois a partir de ${fmtData(check.data)}">⚠ só em ${fmtData(check.data)}</span>`;
  return `<span class="badge pend" title="Não dá pra cobrir essa compra nos próximos 60 dias com o caixa já garantido">🔴 sem caixa (60d)</span>`;
}
/* cada pedido é uma linha própria — pedidos do mesmo SKU não se somam. Ordenado por prioridade de
   Curva A primeiro (mesma classificação Pareto usada no alerta de ruptura da Visão Geral) - dentro
   da mesma curva, mais antigo primeiro. Pedido do Felipe 24/08: "por ordem de prioridade por
   produtos curva A". Produto sem leitura de venda no FULL (sem curva) fica por último. */
function tableComprar(list,denseLoja,curva){
  const linhas=[];
  list.forEach(p=>(p.pedidos||[]).forEach(c=>linhas.push({p,c})));
  if(!linhas.length) return `<p class="empty-inline">Nada por aqui.</p>`;
  const ordCurva={A:0,B:1,C:2,null:3};
  linhas.sort((a,b)=>{
    const ca=ordCurva[(curva&&curva.get(a.p.id))??'null'], cb=ordCurva[(curva&&curva.get(b.p.id))??'null'];
    if(ca!==cb) return ca-cb;
    return (a.c.data||'').localeCompare(b.c.data||'')||a.p.sku.localeCompare(b.p.sku);
  });
  return `<div class="table-wrap" style="margin-bottom:18px"><table class="tbl-produtos"><thead><tr>
    <th style="width:36px">Imprimir?</th><th>Curva</th><th>Pedido de</th><th>SKU</th><th>Código</th><th>Fornecedor</th><th>Qtd do pedido</th><th>Custo</th><th>Caixa p/ comprar</th><th>Gerado por</th><th>Observação</th><th></th>
  </tr></thead><tbody>
    ${linhas.map(({p,c})=>{ const ce=compraDeEnvios(p); const custoTotal=(p.custo||0)*c.qtd; const cv=curva&&curva.get(p.id); return `<tr>
      <td><input type="checkbox" class="chk-compra" data-ped="${p.id}|${c.id}" checked></td>
      <td>${cv?`<span class="curva-badge curva-${cv}" title="Curva ${cv}">${cv}</span>`:'<span class="muted">—</span>'}</td>
      <td class="mono">${esc(fmtData(c.data))}</td>
      <td class="mono">${esc(p.sku)}${medalhaProduto(p)}</td><td>${esc(p.codigo)}</td><td>${esc(p.fornecedor)||'<span class="muted">—</span>'}</td>
      <td><input type="number" min="0" value="${c.qtd}" class="qty-acao" data-qtdped="${p.id}|${c.id}" title="Ajuste aqui se o fornecedor não tiver a quantidade toda">${p.unidPorCaixa?`<div class="hint" style="margin-top:2px">${caixasTxt(c.qtd,p.unidPorCaixa)}</div>`:''}</td>
      <td class="num">${(!p.custo||p.custo<=0)?'<span class="tag-zero">sem custo</span>':fmtMoney(custoTotal)}</td>
      <td>${badgeCaixaParaCompra(p,custoTotal,denseLoja)}</td>
      <td>${c.origem?`<span class="cam" style="font-size:11.5px">${esc(c.origem)}</span>`:'<span class="muted">—</span>'}</td>
      <td><input type="text" class="obs-input" placeholder="Observação (opcional)" value="${esc(c.obs||'')}" title="${esc(c.obs||'')}" data-obsped="${p.id}|${c.id}"></td>
      <td><button class="btn sm acc" data-comprei="${p.id}|${c.id}">Comprei — vai coletar</button></td>
    </tr>`;}).join('')}
  </tbody></table></div>`;
}
function renderComprar(){
  const el=document.getElementById('tab-comprar');
  let h=`<h1 class="page-title">Comprar</h1>
    <div class="modal-actions" style="justify-content:flex-start;margin:0 0 16px">

    <p class="hint" style="margin:0 0 16px">Cada pedido aparece em uma linha própria, mesmo sendo do mesmo SKU. Se o fornecedor não tiver a quantidade toda, altere direto na coluna <b>Qtd do pedido</b> — os outros pedidos do mesmo SKU não são afetados. Ao clicar em <b>Comprei</b>, só aquele pedido vira um lote na lista de coleta.</p>`;
  STORES.forEach(loja=>{
    const l=state.produtos.filter(p=>p.loja===loja&&(p.pedidos||[]).length>0).sort((a,b)=>a.sku.localeCompare(b.sku));
    const denseLoja=l.length?projecaoCaixaBase([loja],60).dense:[];

    i.onchange=()=>{ const [pid,cid]=i.dataset.obsped.split('|'); atualizarPedido(pid,cid,{obs:i.value.toUpperCase()}); toast('Observação salva.'); };
  });
  el.querySelectorAll('[data-qtdped]').forEach(i=>{
    i.onchange=()=>{
      const [pid,cid]=i.dataset.qtdped.split('|');
      const r=atualizarPedido(pid,cid,{qtd:i.value});
      if(!r.ok){ alert(r.msg||'Não foi possível ajustar.'); return; }
      if(r.aviso) toast(`Quantidade ajustada. ${fmtInt(r.aviso.qtd)} un. tiradas do envio "${r.aviso.envio}" — veja o aviso em Envios programados pra ajustar no Mercado Livre também.`);
      else toast('Quantidade do pedido ajustada.');
    };
  });
  document.getElementById('btnRelCompraFornecedor').onclick=imprimirRelatorioCompraFornecedor;
}
function imprimirRelatorioCompraFornecedor(){
  const ch=document.querySelectorAll('#tab-comprar .chk-compra:checked');
  if(!ch.length){ alert('Marque ao menos um pedido para incluir no relatório.'); return; }
  const itens=[];
  ch.forEach(x=>{
    const [pid,cid]=x.dataset.ped.split('|');
    const p=prodById(pid); if(!p) return;
    const c=(p.pedidos||[]).find(y=>y.id===cid); if(!c||c.qtd<=0) return;
    itens.push({loja:p.loja,sku:p.sku,codigo:p.codigo,fornecedor:p.fornecedor,custo:p.custo,qtd:c.qtd,obs:c.obs,data:c.data,unidPorCaixa:p.unidPorCaixa,produtoId:p.id,compartilhado:(membrosVinculados(p).length>0||!!p.vinculadoA)});
  });
  if(!itens.length){ alert('Não há nada pendente em Comprar.'); return; }
  /* Felipe 31/08: produto de estoque compartilhado (vinculadoA) pode ter várias linhas de pedido
     separadas (uma pra cada envio que gerou a compra nele) mesmo sendo fisicamente o mesmo
     produto - no relatório impresso pro fornecedor, unifica numa linha só (soma a qtd). Em
     Comprar a tela continua mostrando cada pedido separado (útil pra saber de qual envio veio
     cada um) - a unificação é só na hora de imprimir/mandar pro fornecedor. */
  const itensUnificados=[]; const porProduto={};
  itens.forEach(i=>{
    if(!i.compartilhado){ itensUnificados.push(i); return; }
    const acc=porProduto[i.produtoId];
    if(!acc){ const novo={...i,_datas:new Set([i.data]),_obsSet:new Set(i.obs?[i.obs]:[])}; porProduto[i.produtoId]=novo; itensUnificados.push(novo); return; }
    acc.qtd+=i.qtd; acc._datas.add(i.data); if(i.obs) acc._obsSet.add(i.obs);
  });
  itensUnificados.forEach(i=>{
    if(!i.compartilhado) return;
    i.data=i._datas.size===1?[...i._datas][0]:null;
    i.obs=[...i._obsSet].join(' · ');
  });
  const g={}; itensUnificados.forEach(i=>{ const f=(i.fornecedor||'').trim()||'Sem fornecedor definido'; (g[f]=g[f]||[]).push(i); });
  const nomes=Object.keys(g).sort((a,b)=>a.localeCompare(b));
  const win=window.open('','_blank');
  if(!win){ alert('Não foi possível abrir a janela do relatório. Verifique o bloqueador de pop-up.'); return; }
  const total=itensUnificados.reduce((a,i)=>a+(i.custo||0)*i.qtd,0);
  win.document.open();
  win.document.write(`<!doctype html><html><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedido de Compra por Fornecedor</title>
    <style>${relatorioDarkCss()}
    .forn-h{font-weight:700;font-size:14.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px}
    .forn-sub{font-size:11.5px;color:var(--muted);margin-bottom:8px}
    .sub-t{font-size:12.5px;text-align:right;margin-top:6px;color:var(--muted)}
    .sub-t b{color:var(--text)}
    .obs{font-style:italic;color:var(--muted)}</style></head><body>
    <h1>Pedido de Compra por Fornecedor</h1>
    <div class="sub">Gerado em ${new Date().toLocaleString('pt-BR')}</div>
    ${nomes.map(f=>{
      const l=g[f].sort((a,b)=>a.loja.localeCompare(b.loja)||a.sku.localeCompare(b.sku));
      const sub=l.reduce((a,i)=>a+(i.custo||0)*i.qtd,0);
      return `<div class="card-rel">
      <div class="forn-h">${esc(f)}</div>
      <div class="forn-sub">${l.reduce((a,i)=>a+i.qtd,0)} un. em ${l.length} pedido(s)</div>
      <div class="tbl-scroll"><table><thead><tr><th>Pedido de</th><th>Loja</th><th>SKU</th><th>Código</th><th class="n">Caixas</th><th class="n">Qtd</th><th class="n">Custo un.</th><th class="n">Subtotal</th><th>Obs.</th></tr></thead><tbody>
      ${l.map(i=>`<tr>
        <td>${i.data?esc(fmtData(i.data)):'Diversas datas'}</td><td>${esc(i.loja)}</td><td>${esc(i.sku)}${i.compartilhado?' <span style="font-size:10.5px;color:var(--muted)" title="Estoque compartilhado - pedidos de mais de um envio somados nesta linha">🔗</span>':''}</td><td>${esc(i.codigo)}</td>
        <td class="n">${i.unidPorCaixa?fmtInt(Math.ceil(i.qtd/i.unidPorCaixa)):'—'}</td>
        <td class="n">${fmtInt(i.qtd)}</td>
        <td class="n">${i.custo>0?fmtMoney(i.custo):'—'}</td><td class="n">${i.custo>0?fmtMoney(i.custo*i.qtd):'—'}</td>
        <td class="obs">${esc(i.obs||'')}</td></tr>`).join('')}

/* acha o objeto de campanha (precisa pra chamar margemContribuicaoCampanha) pelo id, procurando
   em qualquer período já carregado no state dessa loja - não depende do período selecionado na

function _campanhaPorId(loja,campanhaId){
  const dados=adsApiLoja(loja);
  const periodos=dados&&dados.periodos||{};
  for(const k of ['d30','d15','d7','d1']){
    const arr=(periodos[k]&&periodos[k].results)||[];

function itensDaCampanhaAds(camp){

  return itens.filter(it=>String(it.campaignId)===String(camp.id));

/* Margem de Contribuição do(s) produto(s) desta campanha, no período calculado em Lucro — mesma
   fórmula usada no ranking do Resumo Financeiro. Retorna null se ainda não calculou ou não achou
   o produto no período (sem vendas). */
/* META DE TACOS POR PRODUTO (pedido do Felipe 02/09: "meta de TACOS = 1/3 da margem, mas em cima
   do custo unitário do produto - se a margem unitária é 18%, a meta é 6%; aí o Doca faz as contas
   do quanto vendeu e vê se está dentro").
   Fórmula da margem, exatamente como ele definiu:
       margem = valor de venda − CMV − tarifa de envio − imposto − comissão
   Tudo por unidade (divide pela quantidade vendida no período), então a meta não muda de acordo
   com o volume - é uma característica do produto, não do mês.
   Com a margem unitária em %, a meta de TACOS é 1/3 dela, e o teto de Ads em reais sai aplicando
   essa meta no faturamento que o produto REALMENTE fez no período. "Dentro" = gasto de Ads do
   produto <= esse teto.
   Obs.: o preço unitário sai da venda real (valor/qtd) porque o Doca não guarda preço de tabela -
   é o número mais fiel ao que de fato entrou, já com promoção/desconto aplicados. */
/* busca no Mercado Livre a tarifa de venda e o custo de envio ATUAIS dos anúncios que aparecem na
   aba Ads e guarda em p.mlComissao/p.mlFrete (ver /ml/custos-anuncio no server) - é o que faz a
   meta de TACOS bater com o "Resumo de custos" do simulador do ML. Roda uma vez por loja a cada
   12h; não trava a tela (se falhar, a conta cai na média real das vendas, como antes). */
let custosAnuncioBuscando={};
async function garantirCustosAnuncio(loja,forcar){
  if(custosAnuncioBuscando[loja]) return;
  const itens=((adsLucroResultado&&adsLucroResultado.ads&&adsLucroResultado.ads.itens)||[]);
  const agora=Date.now();
  const alvos=[];
  itens.forEach(it=>{
    const p=state.produtos.find(x=>x.mlItemId===it.itemId);
    if(!p||p.loja!==loja) return;
    /* forcar: usado pelo botão Atualizar - sem isso, um valor errado já gravado ficava 12h na
       tela mesmo depois de corrigir o cálculo no servidor (pedido do Felipe 02/09) */
    if(!forcar&&p.mlCustosEm&&(agora-p.mlCustosEm)<12*3600*1000) return; /* já está fresco */
    if(alvos.indexOf(it.itemId)<0) alvos.push(it.itemId);
  });
  if(!alvos.length) return;
  custosAnuncioBuscando[loja]=true;
  try{
    const base=nuvemBaseUrl(); if(!base) return;
    const r=await fetch(`${base}/ml/custos-anuncio?loja=${encodeURIComponent(loja)}&itemIds=${encodeURIComponent(alvos.join(','))}`,
      {cache:'no-store',headers:nuvemAuth?{Authorization:'Basic '+nuvemAuth}:{}});
    const j=await r.json();
    if(!r.ok||!j.ok) throw new Error(j.erro||'falha');
    let mudou=false;
    (j.itens||[]).forEach(x=>{
      const p=state.produtos.find(y=>y.mlItemId===x.itemId);
      if(!p) return;
      if(typeof x.comissao==='number'&&x.comissao>0){ p.mlComissao=x.comissao; mudou=true; }
      if(typeof x.comissaoPercentual==='number'&&x.comissaoPercentual>0){ p.mlComissaoPct=x.comissaoPercentual; mudou=true; }
      if(typeof x.comissaoFixa==='number'){ p.mlComissaoFixa=x.comissaoFixa; }
      if(typeof x.frete==='number'&&x.frete>0){ p.mlFrete=x.frete; mudou=true; }
      if(typeof x.preco==='number'&&x.preco>0){ p.mlPreco=x.preco; mudou=true; }
      /* posição de mais vendido na categoria (pedido do Felipe 02/09) - vem do ranking de
         destaques do ML, ver /ml/custos-anuncio. null = anúncio fora do ranking da categoria. */
      p.mlPosicaoCategoria=(typeof x.posicaoCategoria==='number')?x.posicaoCategoria:null;
      p.mlTotalRanking=(typeof x.totalRanking==='number')?x.totalRanking:null;
      p.mlTagMaisVendido=!!x.tagMaisVendido;
      mudou=true;
      p.mlCustosEm=Date.now();
    });
    if(mudou){ persist(); renderAds(); }
  }catch(e){ console.error('custos do anúncio:',e.message); }
  finally{ custosAnuncioBuscando[loja]=false; }
}
/* META DE TACOS DE UM PRODUTO - FONTE ÚNICA DA VERDADE (02/09, pergunta do Felipe: "nos relatórios
   em Finanças vai usar o mesmo critério agora de Ads também?"). Antes existiam DUAS contas:
     - Ads   : margem unitária pelo preço do anúncio (o critério novo, que ele definiu)
     - Finanças: margem agregada do período (preço médio já com promoção)
   O mesmo produto podia sair ✓ num lugar e ⚠ no outro. Agora as duas telas chamam esta função.
   Fórmula: preço − custo − comissão − tarifa de envio − imposto, por unidade; meta = 1/3 disso.
   `realizado` (opcional) traz as médias reais do período pra servir de referência e de reserva:
   o preço do anúncio só é aceito quando bate com o recebido por unidade (anúncio com faixa de
   quantidade tem preço de pack, ver a correção do AFIADOR19). */
function metaTacosUnit(p,aliquota,realizado){
  const custoUnit=(p&&p.custo)?p.custo:0;
  const precoRealizado=(realizado&&realizado.precoUnit>0)?realizado.precoUnit:null;
  const precoPorFaixa=!!(p&&Array.isArray(p.mlTags)&&p.mlTags.indexOf('standard_price_by_quantity')>=0);
  const precoAnuncioBruto=(p&&typeof p.mlPreco==='number'&&p.mlPreco>0)?p.mlPreco:null;
  const precoBate=!precoPorFaixa&&precoAnuncioBruto!=null&&precoRealizado&&Math.abs(precoAnuncioBruto-precoRealizado)/precoRealizado<=0.25;
  const precoDoAnuncio=precoBate?precoAnuncioBruto:null;
  const precoUnit=precoDoAnuncio||precoRealizado||precoAnuncioBruto||0;
  if(!(precoUnit>0)) return null;
  const comissaoDoAnuncio=(p&&typeof p.mlComissaoPct==='number'&&p.mlComissaoPct>0)
    ? (precoUnit*(p.mlComissaoPct/100)+(Number(p.mlComissaoFixa)||0)) : null;
  const comissaoUnit=(comissaoDoAnuncio!=null)?comissaoDoAnuncio
    :((realizado&&realizado.comissaoUnit>=0)?realizado.comissaoUnit:0);
  const freteDoAnuncio=(p&&typeof p.mlFrete==='number'&&p.mlFrete>0)?p.mlFrete:null;
  const freteUnit=(freteDoAnuncio!=null)?freteDoAnuncio
    :((realizado&&realizado.freteUnit>=0)?realizado.freteUnit:0);
  const impostoUnit=precoUnit*((aliquota||0)/100);
  const margemUnit=precoUnit-custoUnit-comissaoUnit-freteUnit-impostoUnit;
  const margemPct=margemUnit/precoUnit*100;
  return {precoUnit,custoUnit,comissaoUnit,freteUnit,impostoUnit,margemUnit,margemPct,
    metaPct:margemPct/3,precoDoAnuncio:!!precoDoAnuncio,precoRealizado,
    comissaoDoAnuncio:comissaoDoAnuncio!=null,freteDoAnuncio:freteDoAnuncio!=null,
    comissaoPct:(p&&typeof p.mlComissaoPct==='number')?p.mlComissaoPct:null,
    comissaoFixa:(p&&Number(p.mlComissaoFixa))||0,
    semCusto:!(custoUnit>0)};
}
/* usado pelos relatórios de Finanças: teto de Ads em reais pro que o produto faturou no período,
   pelo MESMO critério da aba Ads. Devolve null quando não dá pra calcular (produto sem preço). */
function tetoAdsDoItem(p,aliquota,it){
  const qtd=(it&&it.qtd)||0, valor=(it&&it.valor)||0;
  if(!(qtd>0)||!(valor>0)) return null;
  const m=metaTacosUnit(p,aliquota,{precoUnit:valor/qtd,comissaoUnit:(it.tarifa||0)/qtd,freteUnit:(it.freteMl||0)/qtd});
  if(!m||!(m.margemPct>0)) return null;
  return {metaPct:m.metaPct,teto:valor*(m.metaPct/100),margemUnit:m.margemUnit,margemPct:m.margemPct,detalhe:m};
}
function metaTacosPorProduto(camp,loja){
  if(!adsLucroResultado) return [];
  const aliquota=finLoja(loja).aliquotaImposto||0;
  const itensAds=itensDaCampanhaAds(camp);
  const linhas=[];
  itensAds.forEach(ia=>{
    const iv=((adsLucroResultado.itensVendidos)||[]).find(x=>x.itemId===ia.itemId);
    if(!iv||!(iv.qtd>0)||!(iv.valor>0)) return;
    const p=state.produtos.find(x=>x.mlItemId===ia.itemId);
    const m=metaTacosUnit(p,aliquota,{precoUnit:iv.valor/iv.qtd,comissaoUnit:(iv.tarifa||0)/iv.qtd,freteUnit:(iv.freteMl||0)/iv.qtd});
    if(!m) return;
    const tetoAds=iv.valor*(m.metaPct/100);
    const gastoAds=Number(ia.cost)||0;
    const tacosReal=iv.valor>0?(gastoAds/iv.valor*100):0;
    linhas.push({itemId:ia.itemId,sku:(p&&p.sku)||ia.itemId,semCusto:m.semCusto,
      precoDoAnuncio:m.precoDoAnuncio,precoRealizado:m.precoRealizado,
      comissaoDoAnuncio:m.comissaoDoAnuncio,freteDoAnuncio:m.freteDoAnuncio,
      comissaoPct:m.comissaoPct,comissaoFixa:m.comissaoFixa,
      qtd:iv.qtd,faturamento:iv.valor,precoUnit:m.precoUnit,custoUnit:m.custoUnit,
      comissaoUnit:m.comissaoUnit,freteUnit:m.freteUnit,impostoUnit:m.impostoUnit,
      margemUnit:m.margemUnit,margemPct:m.margemPct,metaPct:m.metaPct,
      tetoAds,gastoAds,tacosReal,dentro:gastoAds<=tetoAds});
  });
  return linhas.sort((a,b)=>b.faturamento-a.faturamento);
}
/* meta de TACOS da CAMPANHA = as metas por produto (acima) ponderadas pelo quanto cada um faturou.
   Campanha de 1 anúncio só - o caso comum - é simplesmente a meta daquele produto. */
function metaTacosCampanha(camp,loja){
  const lp=metaTacosPorProduto(camp,loja);
  if(!lp.length) return null;
  const fat=lp.reduce((s,l)=>s+l.faturamento,0);
  if(!(fat>0)) return null;
  const metaPct=lp.reduce((s,l)=>s+l.metaPct*l.faturamento,0)/fat;
  const tetoAds=lp.reduce((s,l)=>s+l.tetoAds,0);
  const gastoAds=lp.reduce((s,l)=>s+l.gastoAds,0);
  return {metaPct,tetoAds,gastoAds,faturamento:fat,linhas:lp,
    tacosReal:fat>0?gastoAds/fat*100:0,dentro:gastoAds<=tetoAds};
}
function margemContribuicaoCampanha(camp,loja){
  if(!adsLucroResultado) return null;
  const itensAds=itensDaCampanhaAds(camp);
  if(!itensAds.length) return null;
  const aliquota=finLoja(loja).aliquotaImposto||0;
  let margemTotal=0, faturamentoTotal=0, achou=false;
  itensAds.forEach(ia=>{
    const iv=((adsLucroResultado.itensVendidos)||[]).find(x=>x.itemId===ia.itemId);
    if(!iv) return;
    achou=true;
    const p=state.produtos.find(x=>x.mlItemId===ia.itemId);
    const custoUnit=p&&p.custo?p.custo:0;
    const custoProdutoItem=custoUnit*iv.qtd;
    const impostoItem=iv.valor*(aliquota/100);
    margemTotal+=iv.valor-custoProdutoItem-(iv.tarifa||0)-(iv.freteMl||0)-impostoItem;
    faturamentoTotal+=iv.valor;
  });
  return achou?{margem:margemTotal,faturamento:faturamentoTotal}:null;
}
/* custo de Ads desta campanha no período EXATO calculado em Lucro (resumo.ads.campanhas) - usa
   o mesmo valor pra bater com a Margem de Contribuição de cima, em vez de misturar com o custo
   mostrado na tabela (que pode ser de um período de comparação levemente diferente) */
function custoAdsCampanhaCalculado(camp){
  if(!adsLucroResultado) return null;
  const campanhas=(adsLucroResultado.ads&&adsLucroResultado.ads.campanhas)||[];
  const achada=campanhas.find(cc=>String(cc.id)===String(camp.id));
  return achada?(achada.cost||0):null;
}
/* ---------- Sugestão de ROAS objetivo (baseada em 90 dias reais, TODAS as campanhas) ----------
   Roda em background (job assíncrono no servidor, mesmo padrão da Auditoria mensal) porque
   puxar 90 dias de todas as campanhas de uma loja não cabe numa chamada HTTP normal (leva uns
   60-90s). O servidor baixa 1 dia de cada vez (90 chamadas na API do ML, não 90×campanha — cada
   chamada já devolve TODAS as campanhas daquele dia de uma vez). Aqui no front, pra cada
   campanha: agrupa os dias pelo ROAS REALIZADO (arredondado) e, dentro de cada faixa com pelo
   menos 3 dias de amostra (pra não confiar em dia isolado), tira a média de TACOS/vendas por
   dia/ROAS/custo de Ads/lucro (margem de contribuição estimada pela % de margem configurada
   menos o custo de Ads). A faixa vencedora é a que tem a maior nota combinando, com peso igual:
   TACOS baixo + vendas altas + ROAS alto + custo baixo + lucro alto — as 5 coisas que dão a
   "maior eficiência com mais lucro" pedida. */
let adsSugestaoRoasJobId=null, adsSugestaoRoasStatus='idle', adsSugestaoRoasProgresso=null, adsSugestaoRoasErro=null;
let _adsSugestaoRoasPollTimer=null;
function adsSugestaoRoasArr(){ if(!state.adsSugestaoRoas||typeof state.adsSugestaoRoas!=='object') state.adsSugestaoRoas={}; return state.adsSugestaoRoas; }
function _adsCalcularBucketsCampanha(porDia,campanhaId,margemPct,metaTacos){
  const dias=[];
  porDia.forEach(d=>{
    const c=d.campanhas&&d.campanhas[campanhaId]; if(!c) return;
    /* dia sem gasto de Ads (só venda orgânica) não serve pra sugerir ROAS objetivo — não dá
       pra configurar "objetivo 0x" no Mercado Ads, e misturar esses dias no cálculo inflava
       artificialmente a faixa 0x como se fosse a "melhor" opção. */
    if(!(c.cost>0)) return;
    const receita=(c.total_amount||0)+(c.organic_units_amount||0);
    if(receita<=0) return;
    const tacos=(c.cost||0)/receita*100;
    const vendasDia=(c.units_quantity||0)+(c.organic_units_quantity||0);
    dias.push({date:d.date,cost:c.cost||0,receita,tacos,vendasDia,roas:c.roas||0});
  });
  if(dias.length<3) return null;
  const porFaixa={};
  dias.forEach(d=>{ const f=Math.round(d.roas); (porFaixa[f]=porFaixa[f]||[]).push(d); });
  let resumo=Object.keys(porFaixa).map(k=>{
    const l=porFaixa[k];
    const tacosM=l.reduce((a,x)=>a+x.tacos,0)/l.length;
    const vendasM=l.reduce((a,x)=>a+x.vendasDia,0)/l.length;
    const roasM=l.reduce((a,x)=>a+x.roas,0)/l.length;
    const custoM=l.reduce((a,x)=>a+x.cost,0)/l.length;
    const receitaM=l.reduce((a,x)=>a+x.receita,0)/l.length;
    const margemM=receitaM*(margemPct/100);
    const lucroM=margemM-custoM;
    return {faixa:Number(k),dias:l.length,tacosM,vendasM,roasM,custoM,receitaM,margemM,lucroM};
  }).filter(r=>r.dias>=2&&r.faixa>0);
  if(!resumo.length) return null;
  resumo.forEach(r=>{ r.eficiencia=r.custoM>0?r.lucroM/r.custoM:0; r.scoreIdeal=r.vendasM*r.lucroM*r.eficiencia; });
  /* critério final (pedido do Felipe, 18/08 — várias rodadas de ajuste): dentro da meta de TACOS
     (1/3 da margem real do produto) com 15% de tolerância, entram todas as faixas com pelo menos
     2 dias de amostra (1 dia único é fácil demais de ser sorte). Rankeia por "score ideal" =
     vendas/dia x lucro bruto/dia x eficiência (lucro por real gasto) — as 3 coisas que ele quer
     maximizar juntas. O topo do ranking é o "melhor cenário", mostrado como sugestão principal;
     o resto do ranking fica disponível pra conferência manual (ao expandir a campanha), porque o
     próprio Felipe decidiu que faz mais sentido ele escolher olhando a lista do que o sistema
     forçar um "degrau" artificial — teve caso real (Cabo Mickey) onde o 2º colocado por score
     tinha ROAS mais alto mas TACOS e eficiência bem piores, então virar "próxima etapa" dele não
     fazia sentido nenhum. */
  const N_MIN=2;
  const metaTolerada=metaTacos*1.15;
  const elegiveis=resumo.filter(r=>r.dias>=N_MIN&&r.tacosM<=metaTolerada).sort((a,b)=>b.scoreIdeal-a.scoreIdeal);
  const melhor=elegiveis.length?elegiveis[0]:null;
  let maisProxima=null;
  if(!elegiveis.length){ const comAmostra=resumo.filter(r=>r.dias>=N_MIN); if(comAmostra.length) maisProxima=[...comAmostra].sort((a,b)=>a.tacosM-b.tacosM)[0]; }
  resumo.sort((a,b)=>b.scoreIdeal-a.scoreIdeal);
  return {ranking:resumo,elegiveis,melhor,metaTacos,metaTolerada,maisProxima,diasAmostrados:dias.length,metodo:'realizado_proxy'};
}
/* mesma ideia da funcao acima, mas agrupando pelo ROAS OBJETIVO REAL (via objetivoRealNaData,
   alimentado pelo historico de mudancas) em vez do ROAS REALIZADO - metodo mais confiavel porque
   usa o valor que realmente estava configurado em cada dia, nao uma aproximacao. So funciona pra
   dias cobertos pelo historico de mudancas (os de fora ficam de fora do calculo) e exige pelo
   menos 2 objetivos diferentes testados (senao nao da pra comparar nada). */
function _adsCalcularBucketsCampanhaPorObjetivoReal(porDia,loja,campanhaId,margemPct,metaTacos){
  const hist=historicoObjetivoCampanha(loja,campanhaId);
  if(!hist.length) return null;
  const dias=[];
  porDia.forEach(d=>{
    const c=d.campanhas&&d.campanhas[campanhaId]; if(!c) return;
    if(!(c.cost>0)) return;
    const obj=objetivoRealNaData(loja,campanhaId,d.date);
    if(obj==null) return;
    const receita=(c.total_amount||0)+(c.organic_units_amount||0);
    if(receita<=0) return;
    const tacos=(c.cost||0)/receita*100;
    const vendasDia=(c.units_quantity||0)+(c.organic_units_quantity||0);
    dias.push({date:d.date,cost:c.cost||0,receita,tacos,vendasDia,roas:c.roas||0,objetivo:obj});
  });
  if(dias.length<3) return null;
  const porObjetivo={};
  dias.forEach(d=>{ (porObjetivo[d.objetivo]=porObjetivo[d.objetivo]||[]).push(d); });
  if(Object.keys(porObjetivo).length<2) return null;
  let resumo=Object.keys(porObjetivo).map(k=>{
    const l=porObjetivo[k];
    const tacosM=l.reduce((a,x)=>a+x.tacos,0)/l.length;
    const vendasM=l.reduce((a,x)=>a+x.vendasDia,0)/l.length;
    const roasM=l.reduce((a,x)=>a+x.roas,0)/l.length;
    const custoM=l.reduce((a,x)=>a+x.cost,0)/l.length;
    const receitaM=l.reduce((a,x)=>a+x.receita,0)/l.length;
    const margemM=receitaM*(margemPct/100);
    const lucroM=margemM-custoM;
    const eficiencia=custoM>0?lucroM/custoM:0;
    return {faixa:Number(k),dias:l.length,tacosM,vendasM,roasM,custoM,receitaM,margemM,lucroM,eficiencia,scoreIdeal:vendasM*lucroM*eficiencia};
  }).filter(r=>r.dias>=3);
  if(resumo.length<2) return null;
  const N_MIN=5;
  const elegiveis=resumo.filter(r=>r.dias>=N_MIN&&r.tacosM<=metaTacos);
  let sugestao=null,dentroMeta=false,maisProxima=null;
  if(elegiveis.length){ elegiveis.sort((a,b)=>b.scoreIdeal-a.scoreIdeal); sugestao=elegiveis[0]; dentroMeta=true; }
  else { const comAmostra=resumo.filter(r=>r.dias>=N_MIN); if(comAmostra.length) maisProxima=[...comAmostra].sort((a,b)=>a.tacosM-b.tacosM)[0]; }
  resumo.sort((a,b)=>b.scoreIdeal-a.scoreIdeal);
  return {ranking:resumo,sugestao,dentroMeta,maisProxima,metaTacos,diasAmostrados:dias.length,metodo:'objetivo_real'};
}

/* mini-editor do historico de ROAS objetivo de 1 campanha - lista, adiciona 1 por 1, ou

      </tbody></table>`:`<p class="hint" style="margin:0 0 8px">Nenhum registro ainda — o Doca grava sozinho quando detectar mudança no "Atualizar", mas você pode adicionar datas passadas aqui pra deixar a sugestão mais confiável mais rápido.</p>`}
      <div class="acoes-linha" style="flex-wrap:wrap;gap:6px">
        <input type="date" style="width:auto" data-objhistdata="${chave}">

        <button class="btn sm" data-objhistadd="${chave}">+ Adicionar</button>
      </div>
      <label style="display:block;font-size:11.5px;color:var(--muted);margin-top:8px">Ou cole em lote (uma mudança por linha, ex: "21/05/2026 = 6" ou "18/06 pra 7"):
        <textarea rows="3" style="width:100%;margin-top:4px" placeholder="21/05/2026 = 6&#10;18/06 = 7&#10;29/06 = 6,67" data-objhistlote="${chave}"></textarea>
      </label>
      <button class="btn sm" style="margin-top:6px" data-objhistimportar="${chave}">Importar lote</button>

async function iniciarSugestaoRoasLoja(loja){
  try{
    const base=backendUrl();
    if(!base) throw new Error('Configure a URL do backend primeiro.');
    adsSugestaoRoasStatus='rodando'; adsSugestaoRoasErro=null; adsSugestaoRoasProgresso={feito:0,total:90}; renderAds();
    const r=await fetch(`${base}/debug/ads/estudo-diario-loja/iniciar?loja=${encodeURIComponent(loja)}&dias=90`);
    let j; try{ j=await r.json(); }catch(e){ throw new Error('Resposta inválida do backend.'); }
    if(!r.ok||!j.ok) throw new Error(j.erro||('Erro ao iniciar (HTTP '+r.status+').'));
    adsSugestaoRoasJobId=j.jobId;
    _adsPollSugestaoRoas(loja);
  }catch(e){ adsSugestaoRoasStatus='erro'; adsSugestaoRoasErro=e.message; renderAds(); }
}
function _adsPollSugestaoRoas(loja){
  if(_adsSugestaoRoasPollTimer) clearTimeout(_adsSugestaoRoasPollTimer);
  _adsSugestaoRoasPollTimer=setTimeout(async()=>{
    try{
      const base=backendUrl();
      const r=await fetch(`${base}/debug/ads/estudo-diario-loja/status?id=${encodeURIComponent(adsSugestaoRoasJobId)}`);
      let j; try{ j=await r.json(); }catch(e){ throw new Error('Resposta inválida do backend.'); }
      if(!r.ok||!j.ok) throw new Error(j.erro||('Erro ao consultar status (HTTP '+r.status+').'));
      adsSugestaoRoasProgresso=j.progresso;
      if(j.status==='rodando'){ renderAds(); _adsPollSugestaoRoas(loja); return; }
      if(j.status==='erro'){ adsSugestaoRoasStatus='erro'; adsSugestaoRoasErro=j.erro||'Falha desconhecida.'; renderAds(); return; }
      const margemPadrao=adsCfg().margemPct||18;
      const porDia=j.resultado.porDia;
      const idsCampanhas=new Set();
      porDia.forEach(d=>Object.keys(d.campanhas||{}).forEach(id=>idsCampanhas.add(id)));
      const porCampanha={};
      idsCampanhas.forEach(id=>{
        /* meta de TACOS = 1/3 da margem REAL do produto desta campanha (regra do Felipe, 18/08:
           "a meta não é 6%, é 1/3 da margem do produto, pra cada produto vc vai ter que fazer o
           cálculo") - não dá mais pra usar uma % genérica igual pra todas as campanhas da loja.
           Usa margemContribuicaoCampanha (custo/tarifa/frete/imposto reais do produto, mesma conta
           do card "Margem de Contribuição" em Ads) quando disponível; só cai pro padrão da loja se
           o produto ainda não tem custo cadastrado ou o Lucro Bruto do período não rodou ainda. */
        const camp=_campanhaPorId(loja,id);
        let margemPct=margemPadrao, margemFonte='padrao_da_loja';
        if(camp){
          const mc=margemContribuicaoCampanha(camp,loja);
          if(mc&&mc.faturamento>0){ margemPct=mc.margem/mc.faturamento*100; margemFonte='produto_real'; }
        }
        const metaTacos=margemPct/3;
        /* Felipe, 18/08 (correção final): esquecer de vez o ROAS que foi CONFIGURADO (não temos
           acesso confiável a esse histórico) - a sugestão usa só o ROAS REALIZADO que vem dos
           90 dias de dados reais da campanha (_adsCalcularBucketsCampanha, agrupado pelo ROAS que
           de fato aconteceu em cada dia). O método de histórico de objetivo configurado
           (_adsCalcularBucketsCampanhaPorObjetivoReal) fica guardado no código sem uso, caso um dia
           a gente volte a ter esse dado de forma confiável. */
        const proxy=_adsCalcularBucketsCampanha(porDia,id,margemPct,metaTacos);
        if(!proxy) return;
        porCampanha[id]={
          melhor:proxy.melhor,
          elegiveis:proxy.elegiveis,
          ranking:proxy.ranking,
          maisProxima:proxy.maisProxima,
          metaTacos:proxy.metaTacos,
          metaTolerada:proxy.metaTolerada,
          margemPct,margemFonte,
          diasAmostrados:proxy.diasAmostrados
        };
      });
      const arr=adsSugestaoRoasArr();
      arr[loja]={calculadoEm:Date.now(),porCampanha};
      persist();
      adsSugestaoRoasStatus='concluido';
      renderAds();
    }catch(e){ adsSugestaoRoasStatus='erro'; adsSugestaoRoasErro=e.message; renderAds(); }
  },2500);
}
/* ---------- Ads: puxado direto da API (Product Ads / Mercado Ads) ----------
   Substitui o renderAds() manual acima (ficou parado, sem uso, caso algum pedaço da análise
   dele — scores, sugestões etc — sirva de referência depois). Por enquanto só mostra tudo que
   a API devolve, sem calcular nada por cima: filtros e cálculos entram numa etapa seguinte,
   depois de decidirmos o que faz sentido com dado real na mão. */
function adsApiLoja(loja){
  if(!state.adsApi) state.adsApi={};
  if(!state.adsApi[loja]) state.adsApi[loja]={advertiserId:null,siteId:null,atualizadoEm:null,periodos:{}};
  if(!state.adsApi[loja].manualLostRank) state.adsApi[loja].manualLostRank={};
  if(!state.adsApi[loja].tagMaisVendido) state.adsApi[loja].tagMaisVendido={};
  return state.adsApi[loja];
}
async function adsSincronizarLoja(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
  const rSync=await fetch(`${base}/ads/sync?loja=${encodeURIComponent(loja)}`,{method:'POST'});
  let jSync; try{ jSync=await rSync.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado ao sincronizar Ads (status '+rSync.status+').'); }
  if(!rSync.ok||!jSync.ok) throw new Error(jSync.erro||('Falha ao sincronizar Ads (status '+rSync.status+').'));
  const rData=await fetch(`${base}/ads/data?loja=${encodeURIComponent(loja)}`);
  let jData; try{ jData=await rData.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado ao buscar os dados de Ads.'); }
  if(!rData.ok||!jData.ok) throw new Error(jData.erro||'Falha ao buscar os dados de Ads sincronizados.');
  const alvo=adsApiLoja(loja);
  alvo.periodos=jData.periodos||{};
  alvo.atualizadoEm=jData.atualizadoEm;
  /* loga 1 leitura de hoje por campanha (janela de 7 dias, mais estável) pro histórico que
     alimenta o ponto de inflexão TACOS × ROAS - sozinho, sem precisar de colagem manual. */
  const p7=alvo.periodos.d7;
  if(p7&&p7.results) registrarHistoricoAds(loja,p7.results);
  persist();
  return jData;
}
/* histórico diário de TACOS/ROAS/vendas por campanha, alimentado sozinho a cada "Atualizar"
   (puxa da API) - guarda 1 leitura por campanha por dia (sincronizar de novo no mesmo dia
   substitui a leitura de hoje em vez de duplicar). É a base pra achar o ponto de inflexão
   TACOS × ROAS de cada campanha (ver pontoInflexaoAds) - sem precisar de colagem manual. */
function adsHistArr(){ if(!Array.isArray(state.adsHist)) state.adsHist=[]; return state.adsHist; }
/* historico de ROAS OBJETIVO real (diferente do adsHist acima, que registra o ROAS REALIZADO por
   dia) - aqui cada entrada diz "a partir desta data, o objetivo configurado passou a ser X".
   Alimentado de duas formas: (1) automaticamente, toda vez que "Atualizar" roda e o objetivo
   atual e diferente do ultimo conhecido, grava a mudanca com a data de hoje; (2) manualmente, na
   tela de detalhe da campanha, quando o usuario ja sabe datas de mudancas passadas (antes do
   Doca comecar a registrar sozinho). E a base pra bucketizar o estudo de 90 dias pelo objetivo
   REAL configurado em cada dia, em vez do ROAS que calhou de ser realizado (proxy mais fraco,
   usado so quando nao ha historico real suficiente ainda). */
function adsObjetivoHistArr(){ if(!Array.isArray(state.adsObjetivoHist)) state.adsObjetivoHist=[]; return state.adsObjetivoHist; }
function registrarMudancaObjetivo(loja,campanhaId,desde,roas){
  const arr=adsObjetivoHistArr();
  const cid=String(campanhaId);
  const i=arr.findIndex(x=>x.loja===loja&&String(x.campanhaId)===cid&&x.desde===desde);
  if(i>=0) arr[i].roas=roas; else arr.push({loja,campanhaId:cid,desde,roas});
}
function removerMudancaObjetivo(loja,campanhaId,desde){
  state.adsObjetivoHist=adsObjetivoHistArr().filter(x=>!(x.loja===loja&&String(x.campanhaId)===String(campanhaId)&&x.desde===desde));
}
function historicoObjetivoCampanha(loja,campanhaId){
  return adsObjetivoHistArr().filter(x=>x.loja===loja&&String(x.campanhaId)===String(campanhaId)).sort((a,b)=>a.desde<b.desde?-1:(a.desde>b.desde?1:0));
}
function objetivoRealNaData(loja,campanhaId,data){
  const hist=historicoObjetivoCampanha(loja,campanhaId).filter(x=>x.desde<=data);
  if(!hist.length) return null;
  return hist[hist.length-1].roas;
}
/* aceita colar varias linhas tipo "21/05/2026 = 6" ou "18/06 pra 7" (ano opcional, assume o
   atual) - extrai data + numero de cada linha, ignora o resto do texto */
function parseImportacaoObjetivo(texto){
  const linhas=String(texto||'').split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const anoAtual=new Date().getFullYear();
  const out=[];
  linhas.forEach(l=>{
    const m=l.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?[^\d]+(\d+(?:[.,]\d+)?)/);
    if(!m) return;
    const dd=m[1].padStart(2,'0'), mm=m[2].padStart(2,'0');
    let aaaa=m[3]?m[3]:String(anoAtual);
    if(aaaa.length===2) aaaa='20'+aaaa;
    const roas=Number(m[4].replace(',','.'));
    if(isNaN(roas)) return;
    out.push({desde:`${aaaa}-${mm}-${dd}`,roas});
  });
  return out;
}
function registrarHistoricoAds(loja,campanhas){
  const arr=adsHistArr();
  const dia=hoje();
  campanhas.forEach(camp=>{
    const m=camp.metrics||{};
    const vendasDia=((m.units_quantity||0)+(m.organic_units_quantity||0))/7;
    const reg={data:dia,loja,campanhaId:camp.id,campanhaNome:camp.title||camp.name||camp.id,
      roasObjetivo:camp.roas_target||0,orcamento:camp.budget||0,tacos:calcTacos(m),roasRealizado:m.roas||0,vendasDia};
    const i=arr.findIndex(x=>x.data===dia&&x.loja===loja&&x.campanhaId===camp.id);
    if(i>=0) arr[i]=reg; else arr.push(reg);
    /* detecta mudanca de ROAS objetivo sozinho: se o valor atual for diferente do ultimo
       registrado no historico real, grava a mudanca com a data de hoje (pedido do Felipe -
       comeca a registrar quando perceber alteracao de roas). */
    const objAtual=camp.roas_target||0;
    const histObj=historicoObjetivoCampanha(loja,camp.id);
    const ultimoObj=histObj.length?histObj[histObj.length-1]:null;
    if(!ultimoObj||Number(ultimoObj.roas)!==Number(objAtual)) registrarMudancaObjetivo(loja,camp.id,dia,objAtual);
  });
  /* guarda só os últimos 400 registros por loja+campanha pra não crescer pra sempre */
  const chaves=[...new Set(arr.map(h=>h.loja+'|'+h.campanhaId))];
  chaves.forEach(ch=>{
    const i=ch.indexOf('|'), loja2=ch.slice(0,i), cid=ch.slice(i+1);
    const meus=arr.filter(h=>h.loja===loja2&&String(h.campanhaId)===cid);
    if(meus.length>400){ const foraIds=new Set(meus.slice(0,meus.length-400).map(x=>x.data));
      state.adsHist=arr.filter(h=>!(h.loja===loja2&&String(h.campanhaId)===cid&&foraIds.has(h.data))); }
  });
}
/* responde 2 perguntas com o histórico de 1 campanha, agrupando as leituras por qual ROAS
   objetivo estava configurado em cada uma (cada valor de ROAS objetivo = 1 "experimento"):
   1) meta de vendas/dia: qual ROAS objetivo já sustentou essa meta, e com que TACOS médio.
   2) ponto de inflexão: dentre todos os experimentos já feitos, qual teve o melhor equilíbrio
      de TACOS baixo + ROAS alto + vendas altas ao mesmo tempo (o "ponto máximo de otimização"
      que a campanha já alcançou de verdade, não uma meta hipotética). */
function pontoInflexaoAds(loja,campanhaId,metaVendasDia){
  const regs=adsHistArr().filter(h=>h.loja===loja&&String(h.campanhaId)===String(campanhaId));
  if(regs.length<2) return null;
  const porRoas={};
  regs.forEach(h=>{ (porRoas[h.roasObjetivo]=porRoas[h.roasObjetivo]||[]).push(h); });
  const resumo=Object.keys(porRoas).map(k=>{
    const l=porRoas[k];
    const tacosMedio=l.reduce((a,x)=>a+x.tacos,0)/l.length;
    const roasMedio=l.reduce((a,x)=>a+x.roasRealizado,0)/l.length;
    const vendasDiaMedia=l.reduce((a,x)=>a+x.vendasDia,0)/l.length;
    return {roas:Number(k),tacosMedio,roasMedio,vendasDiaMedia,leituras:l.length};
  });
  if(resumo.length<2) return null;
  const bateMeta=resumo.filter(r=>r.vendasDiaMedia>=metaVendasDia).sort((a,b)=>a.tacosMedio-b.tacosMedio)[0]||null;
  /* score simples e explicável: mais vendas × mais ROAS ÷ menos TACOS - cada experimento com
     leitura de verdade concorre nesse número, o maior vence. Exige tacosMedio>0 pra não deixar
     um dia com custo zero (sem investir nada) ganhar por divisão por zero. */
  const candidatos=resumo.filter(r=>r.tacosMedio>0&&r.vendasDiaMedia>0);
  const otimo=candidatos.length?candidatos.slice().sort((a,b)=>(b.vendasDiaMedia*b.roasMedio/b.tacosMedio)-(a.vendasDiaMedia*a.roasMedio/a.tacosMedio))[0]:null;
  return {resumo:resumo.sort((a,b)=>a.roas-b.roas),bateMeta,otimo};
}
/* TACOS (Total Advertising Cost of Sale) = custo do anúncio dividido pela receita TOTAL do
   produto anunciado (venda atribuída ao anúncio + venda orgânica dele) — diferente do ACOS,
   que só considera a venda atribuída ao anúncio. A API de Ads não devolve isso pronto (só
   ACOS/ROAS), então calculamos a partir do que ela devolve. */
function calcTacos(m){
  const receita=(m.total_amount||0)+(m.organic_units_amount||0);
  return receita>0?(m.cost||0)/receita*100:0;
}
/* "Aporte para publicidade" = o mesmo texto/percentual que aparece no painel oficial do Mercado
   Ads ("Seus anúncios patrocinados geram X% das vendas totais dos seus anúncios divulgados").
   Confirmado batendo com dado real: campanha CABO MICKEY, 7 dias — units_quantity:50,
   organic_items_quantity:23 → 50/(50+23)=68,49% ≈ os 68% mostrados no painel deles. */
function calcAporteAds(m){
  const vendasAds=m.units_quantity||0, outrasVendas=m.organic_items_quantity||0;
  const total=vendasAds+outrasVendas;
  return total>0?vendasAds/total*100:0;
}
/* seta comparando o valor atual com o de um período mais longo (ex.: 7d vs 30d) — verde quando
   melhora, vermelho quando piora; maiorMelhor diz se, pra essa métrica, subir é bom (ROAS/CTR/
   CVR) ou ruim (TACOS/ACOS) */
function setaTrendAds(atual,base,maiorMelhor){
  if(base==null||!isFinite(base)) return '';
  const diff=atual-base;
  if(Math.abs(diff)<0.05) return ' <span class="muted" style="font-size:10px">=</span>';
  const melhorou=maiorMelhor?diff>0:diff<0;
  return ` <span class="${melhorou?'okv':'pend'}" style="font-size:10px">${diff>0?'▲':'▼'}</span>`;
}
/* ---------- sugestão "subir ROAS" (regra combinada com o usuário — ver
   regras_sugestao_roas_ads.md pra descrição completa de cada critério) ----------
   SEMPRE em cima dos últimos 7 dias (não muda com o período selecionado na tela) - as
   tendências (critérios de TACOS e CVR vs. histórico) comparam contra 15d E 30d juntos.
   O critério de CVR (o mais importante de todos, segundo o usuário) não é mais um simples
   sim/não - vira peso crescente em 6 faixas: CVR > 5% = peso 1, > 10% = peso 2, > 15% = peso 3,
   > 20% = peso 4, > 25% = peso 5, > 30% = peso 6. Os outros 5 critérios continuam valendo 1
   ponto cada (sim/não). A nota final é a soma de tudo dividida pelo máximo possível (5 + 6 = 11). */
const PESO_MAX_CVR=6;
function pesoCvr(cvrPct){
  if(cvrPct==null) return 0;
  if(cvrPct>30) return 6;
  if(cvrPct>25) return 5;
  if(cvrPct>20) return 4;
  if(cvrPct>15) return 3;
  if(cvrPct>10) return 2;
  if(cvrPct>5) return 1;
  return 0;
}
/* avalia os critérios pra TODAS as campanhas de 1 loja de uma vez. Devolve um Map
   campanhaId -> {score (0-100), criterios:[5 booleans], pesoCvr (0-6), cvr7, vendasDia}. */
function avaliarSugestoesRoas7d(loja,dados){
  const p7=dados.periodos.d7, p15=dados.periodos.d15, p30=dados.periodos.d30;
  const campanhas7=(p7&&p7.results)||[];
  const mapa15={}, mapa30={};
  ((p15&&p15.results)||[]).forEach(cp=>mapa15[cp.id]=cp.metrics||{});
  ((p30&&p30.results)||[]).forEach(cp=>mapa30[cp.id]=cp.metrics||{});
  const resultado=new Map();
  campanhas7.forEach(camp=>{
    const m=camp.metrics||{};
    const m15=mapa15[camp.id], m30=mapa30[camp.id];
    const vendasTotal=(m.units_quantity||0)+(m.organic_units_quantity||0);
    const vendasDia=vendasTotal/7;
    const tacos7=calcTacos(m);
    const tacos15=m15?calcTacos(m15):null;
    const tacos30=m30?calcTacos(m30):null;
    const cvr7=m.cvr||0, cvr15=m15?(m15.cvr||0):null, cvr30=m30?(m30.cvr||0):null;
    const criterios=[
      m.roas!=null&&camp.roas_target!=null&&m.roas>camp.roas_target,          // 1. ROAS real > objetivo
      m.sov!=null&&m.sov>50,                                                  // 2. Ganho de Leilões > 50%
      vendasDia>=10,                                                          // 3. 10 vendas/dia (orgânica+ads)
      (tacos15!=null&&tacos7<tacos15)&&(tacos30!=null&&tacos7<tacos30),       // 4. TACOS caindo vs. 15d E 30d
      (cvr15!=null&&cvr7>=cvr15-0.05)&&(cvr30!=null&&cvr7>=cvr30-0.05)        // 5. CVR subindo ou igual vs. 15d E 30d
    ];
    const pesoCvrCriterio=pesoCvr(cvr7);
    const score=(criterios.filter(Boolean).length+pesoCvrCriterio)/(criterios.length+PESO_MAX_CVR)*100;
    resultado.set(camp.id,{score,criterios,pesoCvr:pesoCvrCriterio,cvr7,vendasDia,tacos:tacos7});
  });
  return resultado;
}

            const linhaCenario=(r,idx)=>{

              const linhaForaMeta=(r,idx)=>`<div>${idx===0?'🔸':'&nbsp;&nbsp;'} <b>${r.faixa}x</b> (N=${r.dias}): TACOS ${r.tacosM.toFixed(2)}%, ${r.vendasM.toFixed(1)} vendas/dia, lucro ${fmtMoney(r.lucroM)}/dia, eficiência ${fmtMoney(r.eficiencia)} <span class="muted" style="font-size:11px">(fora da meta)</span></div>`;

                <div>Nenhum ROAS testado com amostra suficiente (2+ dias) ficou dentro da meta de TACOS nos últimos 90 dias — mas seguem os melhores cenários já testados, mesmo fora da meta, pra você decidir:</div>

              <b style="font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold,#d4a83c)">🎯 Cenários de ROAS objetivo dentro da meta de TACOS de ${dadosCamp.metaTolerada.toFixed(1)}% (90 dias)</b>
              ${dadosCamp.elegiveis.slice(0,8).map(linhaCenario).join('')}
              <div style="opacity:.6;font-size:11px">Calculado em ${new Date(sug.calculadoEm).toLocaleString('pt-BR')} · ${dadosCamp.diasAmostrados} dia(s) com venda no período · meta baseada na ${margemLabel}. O ⭐ é o melhor cenário pelo conjunto vendas + lucro + eficiência; os outros ficam aqui pra você decidir olhando os números.</div>

          ${(()=>{
            /* REMOVIDO 02/09 (Felipe: "remova esse campo, agora ele puxa automático"): o checkbox

            const prods=itensDaCampanhaAds(camp).map(it=>state.produtos.find(x=>x.mlItemId===it.itemId)).filter(Boolean);

  `;
  document.getElementById('adLoja').onchange=e=>{ c.loja=e.target.value; persist(); renderAds(); };

  const btnAtualizar=document.getElementById('adAtualizar');

      calcularLucroAdsPeriodo(c.loja,adsPeriodoApi).then(()=>{ garantirCustosAnuncio(c.loja,true); iniciarSugestaoRoasLoja(c.loja); });

  const elPersBtn=document.getElementById('adPersonalizadoBtn');
  if(elPersBtn) elPersBtn.onclick=()=>abrirSeletorPeriodo(adsPersonalizadoDe,adsPersonalizadoAte,(de,ate)=>{
    adsPersonalizadoDe=de; adsPersonalizadoAte=ate; renderAds();

  const btnPersCalc=document.getElementById('adPersonalizadoCalcular');
  if(btnPersCalc) btnPersCalc.onclick=()=>{

    adsBuscarPersonalizado(c.loja);

/* ================= Finanças (despesas + histórico mensal, base pra DRE) =================
   Guarda as despesas do negócio (manuais ou puxadas automaticamente do Mercado Livre) com data de
   pagamento, se já foi pago, e se é recorrente (repete todo mês). Despesa recorrente marcada como
   paga não "some" nem "vira" o mês que vem — ela fica registrada naquele mês (pro histórico) e uma
   NOVA ocorrência é criada pro mês seguinte, ligada pelo campo origemRecorrenciaId. Ainda não inclui
   receita/faturamento automaticamente — só o lado das despesas, que é o que foi pedido por ora. */
function despesasArr(){ if(!Array.isArray(state.despesas)) state.despesas=[]; return state.despesas; }
function addDespesa({descricao,valor,dataPagamento,recorrente,loja,origem,faturaKey}){
  snapshot('nova despesa'+(descricao?' ("'+descricao.slice(0,30)+'")':''));
  const arr=despesasArr();
  const d={id:gerarId('desp'),descricao:(descricao||'').trim(),valor:Number(valor)||0,dataPagamento:dataPagamento||hoje(),
    pago:false,recorrente:!!recorrente,loja:loja||null,origem:origem||'manual',faturaKey:faturaKey||null,
    origemRecorrenciaId:null,criadoEm:Date.now()};
  arr.push(d);
  persist();
  return d;
}
function abrirEditarDespesaModal(id){

    <div class="form-grid" style="grid-template-columns:2fr 1fr 1fr 1fr">
      <label>Descrição<input id="feDescricao" type="text" value="${esc(d.descricao)}"></label>
      <label>Valor (R$)<input id="feValor" type="text" inputmode="decimal" placeholder="0,00" oninput="filtrarValorMoeda(this)" value="${d.valor?String(d.valor).replace('.',','):''}"></label>
      <label>Data de pagamento<input id="feData" type="date" value="${esc(d.dataPagamento)}"></label>

      ${d.origem!=='imposto'?`<label style="display:flex;align-items:center;gap:6px;font-size:12.5px"><input type="checkbox" id="fePago" style="width:auto" ${d.pago?'checked':''}> Pago${d.origem==='ml_fatura'?' (marque na mão se já pagou e o Doca ainda não confirmou sozinho)':' (desmarque se tickou por engano)'}</label>`:''}

    ${d.origem==='imposto'?`<p class="hint" style="margin-top:8px">⚠ Esta despesa de Imposto é automática — o status de pago fica em Despesas, na coluna Pago.</p>`:''}
    <div class="modal-actions"><button class="btn" id="btnCancelarEditDesp">Cancelar</button><button class="btn acc" id="btnSalvarEditDesp">Salvar alterações</button></div>`;

    const fePago=document.getElementById('fePago');
    if(fePago&&fePago.checked!==d.pago) marcarDespesaPaga(id,fePago.checked);
    closeModal(); toast('Despesa atualizada.'); renderFinancas();

}
/* edita uma despesa já lançada (descrição, valor, data, loja, recorrente) - útil pro cartão de
   crédito por exemplo, que é recorrente mas o valor muda todo mês: em vez de excluir e recriar,
   só ajusta o valor da ocorrência do mês antes de marcar como paga. */
function editarDespesa(id,{descricao,valor,dataPagamento,loja,recorrente}){
  const arr=despesasArr();
  const d=arr.find(x=>x.id===id); if(!d) return {ok:false,msg:'Despesa não encontrada.'};
  if(!descricao) return {ok:false,msg:'Informe uma descrição.'};
  if(!(valor>0)) return {ok:false,msg:'Informe um valor válido.'};
  if(!dataPagamento) return {ok:false,msg:'Informe a data de pagamento.'};
  snapshot('edição da despesa ("'+(d.descricao||'').slice(0,30)+'")');
  d.descricao=descricao.trim(); d.valor=Number(valor); d.dataPagamento=dataPagamento; d.loja=loja||null; d.recorrente=!!recorrente;
  /* CORRIGIDO 25/08 (3a vez): mesmo depois de não sobrescrever mais valor=0 na sincronização
     automática (ver puxarFaturaMl), o Felipe ainda via a fatura ML voltar a 0 depois de editar -
     sinal de que a correção anterior não bastava (algum caminho ainda sobrescrevia). Em vez de
     tentar prever TODO caso em que o valor vindo do Mercado Livre pode ser 0/estranho, trava de
     vez: uma vez editado manualmente aqui, essa despesa de fatura ML nunca mais tem o campo
     "valor" tocado pela sincronização automática (ver checagem "!d.valorEditadoManual" em
     puxarFaturaMl) - só editando de novo aqui muda de novo. */
  if(d.origem==='ml_fatura') d.valorEditadoManual=true;
  persist();
  return {ok:true};
}
function excluirDespesa(id){
  const arr=despesasArr();
  const d=arr.find(x=>x.id===id); if(!d) return;
  snapshot('exclusão de despesa ("'+(d.descricao||'').slice(0,30)+'")');
  state.despesas=arr.filter(x=>x.id!==id);
  persist();
}
/* marca pago/pendente; se for recorrente e estiver marcando como PAGO, gera a proxima ocorrência
   (mês seguinte) automaticamente, se ainda não existir - assim o histórico do mês atual fica
   preservado e a despesa continua "viva" pro mês que vem. Fatura ML e Imposto NÃO entram nessa
   clonagem (mesmo sendo recorrente:true, só pra mostrar o selo) - o valor delas muda todo mês
   (não dá pra simplesmente copiar o valor atual pro mês seguinte) e cada uma já tem sua própria
   sincronização automática que cria a ocorrência certa (ver puxarFaturaMl/sincronizarImpostoDespesaMes). */
function marcarDespesaPaga(id,pago){
  const arr=despesasArr();
  const d=arr.find(x=>x.id===id); if(!d) return;
  snapshot((pago?'despesa paga: ':'despesa marcada como pendente: ')+(d.descricao||''));
  d.pago=!!pago;
  if(pago&&d.recorrente&&d.origem!=='ml_fatura'&&d.origem!=='imposto'){
    const serieId=d.origemRecorrenciaId||d.id;
    const proxData=proximoMes(d.dataPagamento);
    const jaExiste=arr.some(x=>(x.origemRecorrenciaId||x.id)===serieId&&x.dataPagamento===proxData);
    if(!jaExiste){
      arr.push({id:gerarId('desp'),descricao:d.descricao,valor:d.valor,dataPagamento:proxData,
        pago:false,recorrente:true,loja:d.loja,origem:d.origem,faturaKey:null,origemRecorrenciaId:serieId,criadoEm:Date.now()});
    }
  }
  persist();
}
/* busca a fatura mais recente do Mercado Livre (taxas de venda/anúncio/Full - não é o saldo do
   Mercado Pago) e cadastra/atualiza como despesa recorrente automaticamente, evitando duplicar
   pelo par loja+faturaKey (a "key" que o próprio ML usa pra identificar o período de cobrança) */
let financasUltimoErroAuto={}; // loja -> mensagem do último erro da tentativa AUTOMÁTICA de puxar a fatura (não persistido — só pra visibilidade nesta sessão, sem precisar abrir o console do navegador)
let mlUltimoErroAuto={}; // loja -> mensagem do último erro da sincronização AUTOMÁTICA de produtos do Mercado Livre ao abrir o Doca (mesma ideia acima) - pedido do Felipe 19/08: produto novo cadastrado no ML não estava aparecendo, e a sincronização automática falhava sem avisar nada na tela (só no console)
function sleep(ms){ return new Promise(res=>setTimeout(res,ms)); }
/* calcula dataPagamento/semVencimentoReal/vencimentoEstimado pra um período de fatura ML (seja o
   "principal" ou um dos "outros") - fatorado pra puxarFaturaMl não repetir a mesma lógica 2x.
   achado o motivo real do vencimento vir errado (debug 24/08 com a TorvStore): o Mercado Livre usa
   "9999-12-31" como valor sentinela de "sem vencimento ainda" no período em aberto, em vez de null
   - o backend já filtra isso (ver buscarFaturaMl), então quando "per.vencimento" chega aqui é
   porque é de verdade, confirmado pelo Mercado Livre (o período já fechou). Só cai pra estimativa
   do ciclo (FATURA_CICLO, confirmado pelo Felipe pra cada uma das 4 lojas) quando o backend não
   achou vencimento real pra esse período - aí sim é estimativa mesmo, e fica rotulada "estimado"
   na tela. */
function _camposVencimentoFatura(loja,per){
  const cfg=FATURA_CICLO[loja];
  const vencimentoCiclo=cfg?vencimentoEstimadoFatura(loja,per.dataInicio,per.dataFim):null;
  const semVencimentoReal=!per.vencimento;
  const vencimentoEstimado=semVencimentoReal?vencimentoCiclo:null;
  const dataPagamento=per.vencimento||vencimentoCiclo||hoje();
  return {semVencimentoReal,vencimentoEstimado,dataPagamento};
}
async function puxarFaturaMl(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
  const r=await fetch(`${base}/financas/fatura-ml?loja=${encodeURIComponent(loja)}`);
  let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+r.status+').'); }
  if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao buscar a fatura do Mercado Livre (status '+r.status+').'));
  if(!j.fatura) throw new Error('Nenhuma fatura encontrada pra essa loja ainda.');
  const f=j.fatura;
  const arr=despesasArr();
  const {semVencimentoReal,vencimentoEstimado,dataPagamento}=_camposVencimentoFatura(loja,f);
  let d=arr.find(x=>x.origem==='ml_fatura'&&x.loja===loja&&x.faturaKey===f.key);
  if(d){
    snapshot('atualização da fatura do Mercado Livre ('+loja+')');
    /* CORRIGIDO 25/08 (2a vez): quando a fatura acaba de ser totalmente quitada, unpaid_amount
       vira 0 - mas sobrescrever "valor" com 0 nesse momento apaga o registro de quanto essa
       fatura realmente custou (o Felipe pegou o caso: mostrava R$11.647,58 devendo, virou
       R$0,00 assim que quitou). "valor" é o quanto ainda falta pagar; uma vez que já sabíamos
       que faltava um valor > 0, mantém esse último valor conhecido mesmo depois de pago - só
       assim o "Total do mês"/"Já pago" da aba Despesas continua contando o custo real, em vez de
       fingir que a fatura não custou nada só porque já foi quitada. */
    if(f.valor&&!d.valorEditadoManual) d.valor=f.valor;
    d.dataPagamento=dataPagamento; d.itens=f.itens||[]; d.valorTotal=f.valorTotal; d.itensAviso=f.itensAviso||null;
    d.periodoDe=f.dataInicio||null; d.periodoAte=f.dataFim||null; d.semVencimentoReal=semVencimentoReal; d.vencimentoEstimado=vencimentoEstimado;
    /* CORRIGIDO 25/08: antes só ligava "pago" (if(valorPendente===0) d.pago=true), nunca
       desligava - então uma fatura que quitou e depois voltou a acumular dívida nova (ou uma
       fatura que nunca tinha ficado 100% quitada de fato) ficava PRESA como "paga" pra sempre,
       some do cálculo de custo (ver faturaMlPendenteLoja) mesmo já devendo de novo. Agora sempre
       reflete o estado atual, pra cima ou pra baixo - bate com o pedido do Felipe (tarefa #55) de
       isso ser 100% automático, nunca manual. */
    d.pago=f.valorPendente===0;
  }else{
    snapshot('fatura do Mercado Livre importada ('+loja+')');
    /* periodoDe/periodoAte (pedido do Felipe 24/08): a fatura do ML é filtrada em Despesas pelo
       VENCIMENTO (dataPagamento), que pode cair num mês diferente do mês em que as cobranças
       aconteceram de fato (ex: cobranças de agosto, ciclo fecha e vence só em setembro) - guarda
       o período de referência à parte pra mostrar na tela e não parecer que "sumiu" a fatura do
       mês anterior quando na real ela está ali, só datada pelo vencimento. */
    arr.push({id:gerarId('desp'),descricao:'Fatura Mercado Livre — '+loja,valor:f.valor,dataPagamento,
      pago:f.valorPendente===0,recorrente:true,loja,origem:'ml_fatura',faturaKey:f.key,origemRecorrenciaId:null,
      itens:f.itens||[],valorTotal:f.valorTotal,itensAviso:f.itensAviso||null,
      periodoDe:f.dataInicio||null,periodoAte:f.dataFim||null,semVencimentoReal,vencimentoEstimado,criadoEm:Date.now()});
  }
  /* outros (pedido do Felipe 25/08): faturas de outros períodos do mesmo lote já buscado pelo
     backend (a Orbix e a TorvShop tinham a fatura de Agosto, já quitada, sumindo inteira do Doca
     assim que o período de Setembro virou o "principal" acima - o Doca só olhava pra 1 período
     por vez). Cria a despesa se ainda não existir (só pra período já FECHADO, pra não criar cedo
     demais uma fatura que ainda nem fechou) e sempre reconcilia valor/pago/vencimento em
     qualquer uma que já existia - sem mexer em itens já detalhados manualmente. */
  if(Array.isArray(f.outros)){
    f.outros.forEach(per=>{
      const od=arr.find(x=>x.origem==='ml_fatura'&&x.loja===loja&&x.faturaKey===per.key);
      const cv=_camposVencimentoFatura(loja,per);
      if(od){
        /* mesma correção 25/08 do bloco acima: não sobrescreve valor com 0 quando a fatura já
           está quitada (per.valor vem 0 pra sempre depois de paga) - senão apaga uma correção
           manual que o Felipe fez em "Editar" (era exatamente esse bug: editava o valor real da
           fatura da Orbix/TorvShop e a sincronização automática seguinte (a cada 20min) zerava
           de novo, "não salvava"). */
        if(per.valor&&!od.valorEditadoManual) od.valor=per.valor;
        od.valorTotal=per.valorTotal; od.dataPagamento=cv.dataPagamento;
        od.periodoDe=per.dataInicio||null; od.periodoAte=per.dataFim||null;
        od.semVencimentoReal=cv.semVencimentoReal; od.vencimentoEstimado=cv.vencimentoEstimado;
        od.pago=per.valorPendente===0;
      }else if(per.status==='CLOSED'){
        arr.push({id:gerarId('desp'),descricao:'Fatura Mercado Livre — '+loja,valor:per.valor,dataPagamento:cv.dataPagamento,
          pago:per.valorPendente===0,recorrente:true,loja,origem:'ml_fatura',faturaKey:per.key,origemRecorrenciaId:null,
          itens:[],valorTotal:per.valorTotal,itensAviso:null,
          periodoDe:per.dataInicio||null,periodoAte:per.dataFim||null,
          semVencimentoReal:cv.semVencimentoReal,vencimentoEstimado:cv.vencimentoEstimado,criadoEm:Date.now()});
      }
    });
  }
  delete financasUltimoErroAuto[loja];
  persist();
  return f;
}
/* tenta de novo com espera crescente quando o Mercado Livre responde 429 (limite de chamadas por
   segundo) — descoberto ao puxar a fatura das 4 lojas em paralelo assim que o Doca abre, que às
   vezes estourava o limite. Erros de outro tipo (sem fatura, backend fora do ar etc.) não têm
   novo motivo pra dar certo numa tentativa a mais, então sobem direto. */
async function puxarFaturaMlComRetry(loja,tentativa){
  tentativa=tentativa||0;
  try{
    return await puxarFaturaMl(loja);
  }catch(e){
    if(/\b429\b/.test(e.message)&&tentativa<3){
      await sleep(1200*Math.pow(2,tentativa));
      return puxarFaturaMlComRetry(loja,tentativa+1);
    }
    throw e;
  }
}
/* explica em português simples cada categoria de cobrança que vem no detalhamento da fatura do
   ML (vindo do /summary da API de Billing) - os rótulos que o próprio ML manda variam um pouco
   de conta pra conta, então casa por palavra-chave (sem acento, minúsculo) em vez de comparar o
   texto inteiro. Cobre publicidade/Ads, comissão de venda, envio/frete, parcelamento, Full
   (armazenagem/coleta), devolução, reembolso/estorno e bonificação - o resto cai num texto
   genérico em vez de ficar mudo. */
function normalizarTexto(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function explicarCobrancaML(label){
  const t=normalizarTexto(label);
  if(t.includes('bonific')) return 'Valor que o próprio Mercado Livre devolveu pra você (ex: comissão ou taxa estornada).';
  if(t.includes('devolu')) return 'Ajuste referente a um produto devolvido pelo comprador.';
  if(t.includes('reembols')||t.includes('estorno')) return 'Valor reembolsado por cancelamento ou estorno de uma venda.';
  if(t.includes('public')||t.includes('campanha')||t.includes('ads')) return 'Custo dos anúncios patrocinados (Ads) contratados pra aparecer em destaque nas buscas.';
  if(t.includes('full')||t.includes('armazen')||t.includes('coleta')||t.includes('fulfillment')) return 'Custo de armazenar, coletar ou movimentar produtos no centro de distribuição Full.';
  if(t.includes('difal')||t.includes('icms')||t.includes('aliquota interestadual')) return 'Diferencial de alíquota interestadual (ICMS/DIFAL) sobre vendas pra outros estados.';
  if(t.includes('parcel')) return 'Taxa cobrada quando o comprador parcela o pagamento no cartão.';
  if(t.includes('recebiment')||t.includes('mercado pago')) return 'Taxa cobrada pelo Mercado Pago pra receber/processar o valor da venda.';
  if(t.includes('envio')||t.includes('frete')||t.includes('shipping')||t.includes('municipio')) return 'Custo do frete das vendas enviadas pelo Mercado Envios (repassado a você quando o anúncio tem frete grátis).';
  if(t.includes('venda')||t.includes('comiss')) return 'Comissão que o Mercado Livre cobra por cada venda concluída.';
  return 'Cobrança do Mercado Livre referente a essa categoria (detalhe direto da fatura oficial).';
}
/* agrupa as linhas de "detalhar fatura" (que vêm uma por LABEL individual, ex: "Custo por vender
   no Mercado Livre" separado de "Cancelamento do custo por vender no Mercado Livre") em um punhado
   de categorias maiores, com subtotal cada uma - pedido do Felipe 25/08, mesma ideia da tabela por
   categoria que fizemos pro relatório do Full (armazenagem/coleta/retirada/inconformidade), só que
   agora pra fatura do ML inteira. "Cancelamento de X" cai na MESMA categoria de X (o valor do
   cancelamento já vem negativo do Mercado Livre, então o subtotal já sai líquido sozinho). */
function categoriaCobrancaML(label){
  const t=normalizarTexto(label);
  if(t.includes('bonific')||t.includes('devolu')||t.includes('reembols')||t.includes('estorno')) return 'Estornos e reembolsos';
  if(t.includes('public')||t.includes('campanha')||t.includes('ads')) return 'Publicidade (Ads)';
  if(t.includes('full')||t.includes('armazen')||t.includes('coleta')||t.includes('fulfillment')) return 'Armazenagem e logística (Full)';
  if(t.includes('difal')||t.includes('icms')||t.includes('aliquota interestadual')) return 'Impostos (ICMS/DIFAL)';
  if(t.includes('parcel')) return 'Taxa de parcelamento';
  if(t.includes('recebiment')||t.includes('mercado pago')) return 'Taxas do Mercado Pago';
  if(t.includes('envio')||t.includes('frete')||t.includes('shipping')||t.includes('municipio')) return 'Frete';
  if(t.includes('venda')||t.includes('comiss')) return 'Comissão de venda';
  return 'Outras tarifas';
}
/* agrupa um array de itens {label,valor} nas categorias acima, somando o valor de cada uma -
   devolve já ordenado do maior custo pro menor (valor absoluto), pra tela mostrar primeiro o que
   pesa mais na fatura. */
function agruparItensPorCategoria(itens){
  const porCategoria=new Map();
  (itens||[]).forEach(it=>{
    const cat=categoriaCobrancaML(it.label);
    if(!porCategoria.has(cat)) porCategoria.set(cat,{categoria:cat,total:0,itens:[]});
    const g=porCategoria.get(cat);
    g.total+=(Number(it.valor)||0);
    g.itens.push(it);
  });
  return [...porCategoria.values()].sort((a,b)=>Math.abs(b.total)-Math.abs(a.total));
}

}

/* ================= Retiradas e Reembolsos (TorvStore): fechamento equilibrado entre sócios =====
   RETIRADA = dinheiro que o sócio já tirou da empresa pra ele (reduz o que falta receber da cota).
   REEMBOLSO = o inverso: dinheiro que o sócio pagou do próprio bolso pela empresa e que a empresa
   precisa devolver pra ele (aumenta o que a empresa ainda deve, além da cota). No fechamento, a
   margem líquida do período é dividida 50/50 (a "cota" de cada um); o que falta pra cada um é:
   cota − retiradas + reembolsos. Quem já retirou mais que a cota (líquido de reembolsos) devolve a
   diferença. Cada entrada guarda um "tipo" ('retirada' ou 'reembolso') — entradas antigas sem tipo
   (de antes desse campo existir) contam como retirada, mantendo o comportamento de antes. */
function sociosLoja(loja){
  if(!state.socios) state.socios={};
  if(!state.socios[loja]) state.socios[loja]={};
  const socios=sociosDaLoja(loja);
  let todos=[];
  socios.forEach(s=>{
    if(!Array.isArray(state.socios[loja][s])) state.socios[loja][s]=[];
    todos=todos.concat(state.socios[loja][s]);
  });
  todos.forEach(x=>{ if(x.tipo!=='retirada'&&x.tipo!=='reembolso') x.tipo='retirada'; });
  return state.socios[loja];
}

function removerMovimentoSocio(loja,socio,id){

/* edita um lançamento de retirada/reembolso já salvo (tipo, sócio, descrição, valor, data) - até
   permite mover o lançamento de um sócio pra outro, caso tenha sido cadastrado errado. */
function editarMovimentoSocio(loja,socioOriginal,id,{socio,tipo,descricao,valor,data}){
  const s=sociosLoja(loja);
  const d=s[socioOriginal].find(x=>x.id===id);
  if(!d) return {ok:false,msg:'Lançamento não encontrado.'};
  if(!(valor>0)) return {ok:false,msg:'Informe um valor válido.'};
  if(!data) return {ok:false,msg:'Informe a data.'};
  if(tipo!=='retirada'&&tipo!=='reembolso') return {ok:false,msg:'Tipo inválido.'};
  snapshot('edição de lançamento de '+socioOriginal);
  d.tipo=tipo; d.descricao=(descricao||'').trim(); d.valor=Number(valor); d.data=data;
  if(socio&&socio!==socioOriginal){
    s[socioOriginal]=s[socioOriginal].filter(x=>x.id!==id);
    s[socio].push(d);
  }
  persist();
  return {ok:true};
}

   personalizado. O CMV é calculado AQUI no navegador (backend só manda item_id+qtd vendida),
   porque o custo unitário de cada produto só existe no state local (aba Produtos). */

let financasResumoAnterior=null;

function _diasEntreISO(de,ate){ return Math.round((new Date(ate+'T00:00:00Z')-new Date(de+'T00:00:00Z'))/864e5)+1; }
function _somaDiasISO(iso,dias){ const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+dias); return d.toISOString().slice(0,10); }
function periodoAnteriorEquivalente(de,ate){
  const dias=_diasEntreISO(de,ate);
  const anteAte=_somaDiasISO(de,-1);
  const anteDe=_somaDiasISO(anteAte,-(dias-1));
  return {de:anteDe,ate:anteAte};
}

async function pollCheckLiberacao(chave,jobId,base){
  while(true){

    const atual=liberacaoCheck[chave];
    if(!atual||atual.jobId!==jobId) return; // saiu da tela ou pediu de novo - abandona esse poll
    try{

      let j; try{ j=await r.json(); }catch(e){ throw new Error('Resposta inesperada do backend ao consultar status.'); }
      if(!r.ok||!j.ok) throw new Error(j.erro||'Falha ao consultar o status da conferência.');
      if(j.status==='concluido'){ liberacaoCheck[chave]={status:'pronto',jobId,resultado:j.resultado,erro:null}; renderFinancas(); return; }
      if(j.status==='erro'){ liberacaoCheck[chave]={status:'erro',jobId,resultado:null,erro:j.erro}; renderFinancas(); return; }
    }catch(e){
      liberacaoCheck[chave]={status:'erro',jobId,resultado:null,erro:e.message};
