/* ---------- Sugestão de ROAS objetivo (baseada em 90 dias reais, TODAS as campanhas) ----------
   Roda em background (job assíncrono no servidor, mesmo padrão da Auditoria mensal) porque
   puxar 90 dias de todas as campanhas de uma loja não cabe numa chamada HTTP normal (leva uns
   60-90s). O servidor baixa 1 dia de cada vez (90 chamadas na API do ML, não 90×campanha — cada
   chamada já devolve TODAS as campanhas daquele dia de uma vez). Aqui no front, pra cada
   campanha: agrupa os dias pelo ROAS REALIZADO (arredondado) e, dentro de cada faixa com pelo
   menos 3 dias de amostra (pra não confiar em dia isolado), tira a média de TACOS/vendas por
   dia/ROAS/custo de Ads/lucro (margem de contribuição estimada pela % de margem configurada
   menos o custo de Ads). A faixa vencedora é a que tem a maior nota combinando, com peso igual:
   TACOS baixo + vendas altas + ROAS alto + custo baixo + lucro alto — as 5 coisas que dão a
   "maior eficiência com mais lucro" pedida. */
let adsSugestaoRoasJobId=null, adsSugestaoRoasStatus='idle', adsSugestaoRoasProgresso=null, adsSugestaoRoasErro=null;
let _adsSugestaoRoasPollTimer=null;
function adsSugestaoRoasArr(){ if(!state.adsSugestaoRoas||typeof state.adsSugestaoRoas!=='object') state.adsSugestaoRoas={}; return state.adsSugestaoRoas; }
function _adsCalcularBucketsCampanha(porDia,campanhaId,margemPct,metaTacos){
  const dias=[];
  porDia.forEach(d=>{
    const c=d.campanhas&&d.campanhas[campanhaId]; if(!c) return;
    /* dia sem gasto de Ads (só venda orgânica) não serve pra sugerir ROAS objetivo — não dá
       pra configurar "objetivo 0x" no Mercado Ads, e misturar esses dias no cálculo inflava
       artificialmente a faixa 0x como se fosse a "melhor" opção. */
    if(!(c.cost>0)) return;
    const receita=(c.total_amount||0)+(c.organic_units_amount||0);
    if(receita<=0) return;
    const tacos=(c.cost||0)/receita*100;
    const vendasDia=(c.units_quantity||0)+(c.organic_units_quantity||0);
    dias.push({date:d.date,cost:c.cost||0,receita,tacos,vendasDia,roas:c.roas||0});
  });
  if(dias.length<3) return null;
  const porFaixa={};
  dias.forEach(d=>{ const f=Math.round(d.roas); (porFaixa[f]=porFaixa[f]||[]).push(d); });
  let resumo=Object.keys(porFaixa).map(k=>{
    const l=porFaixa[k];
    const tacosM=l.reduce((a,x)=>a+x.tacos,0)/l.length;
    const vendasM=l.reduce((a,x)=>a+x.vendasDia,0)/l.length;
    const roasM=l.reduce((a,x)=>a+x.roas,0)/l.length;
    const custoM=l.reduce((a,x)=>a+x.cost,0)/l.length;
    const receitaM=l.reduce((a,x)=>a+x.receita,0)/l.length;
    const margemM=receitaM*(margemPct/100);
    const lucroM=margemM-custoM;
    return {faixa:Number(k),dias:l.length,tacosM,vendasM,roasM,custoM,receitaM,margemM,lucroM};
  }).filter(r=>r.dias>=2&&r.faixa>0);
  if(!resumo.length) return null;
  resumo.forEach(r=>{ r.eficiencia=r.custoM>0?r.lucroM/r.custoM:0; r.scoreIdeal=r.vendasM*r.lucroM*r.eficiencia; });
  /* critério final (pedido do Felipe, 18/08 — várias rodadas de ajuste): dentro da meta de TACOS
     (1/3 da margem real do produto) com 15% de tolerância, entram todas as faixas com pelo menos
     2 dias de amostra (1 dia único é fácil demais de ser sorte). Rankeia por "score ideal" =
     vendas/dia x lucro bruto/dia x eficiência (lucro por real gasto) — as 3 coisas que ele quer
     maximizar juntas. O topo do ranking é o "melhor cenário", mostrado como sugestão principal;
     o resto do ranking fica disponível pra conferência manual (ao expandir a campanha), porque o
     próprio Felipe decidiu que faz mais sentido ele escolher olhando a lista do que o sistema
     forçar um "degrau" artificial — teve caso real (Cabo Mickey) onde o 2º colocado por score
     tinha ROAS mais alto mas TACOS e eficiência bem piores, então virar "próxima etapa" dele não
     fazia sentido nenhum. */
  const N_MIN=2;
  const metaTolerada=metaTacos*1.15;
  const elegiveis=resumo.filter(r=>r.dias>=N_MIN&&r.tacosM<=metaTolerada).sort((a,b)=>b.scoreIdeal-a.scoreIdeal);
  const melhor=elegiveis.length?elegiveis[0]:null;
  let maisProxima=null;
  if(!elegiveis.length){ const comAmostra=resumo.filter(r=>r.dias>=N_MIN); if(comAmostra.length) maisProxima=[...comAmostra].sort((a,b)=>a.tacosM-b.tacosM)[0]; }
  resumo.sort((a,b)=>b.scoreIdeal-a.scoreIdeal);
  return {ranking:resumo,elegiveis,melhor,metaTacos,metaTolerada,maisProxima,diasAmostrados:dias.length,metodo:'realizado_proxy'};
}
/* mesma ideia da funcao acima, mas agrupando pelo ROAS OBJETIVO REAL (via objetivoRealNaData,
   alimentado pelo historico de mudancas) em vez do ROAS REALIZADO - metodo mais confiavel porque
   usa o valor que realmente estava configurado em cada dia, nao uma aproximacao. So funciona pra
   dias cobertos pelo historico de mudancas (os de fora ficam de fora do calculo) e exige pelo
   menos 2 objetivos diferentes testados (senao nao da pra comparar nada). */
function _adsCalcularBucketsCampanhaPorObjetivoReal(porDia,loja,campanhaId,margemPct,metaTacos){
  const hist=historicoObjetivoCampanha(loja,campanhaId);
  if(!hist.length) return null;
  const dias=[];
  porDia.forEach(d=>{
    const c=d.campanhas&&d.campanhas[campanhaId]; if(!c) return;
    if(!(c.cost>0)) return;
    const obj=objetivoRealNaData(loja,campanhaId,d.date);
    if(obj==null) return;
    const receita=(c.total_amount||0)+(c.organic_units_amount||0);
    if(receita<=0) return;
    const tacos=(c.cost||0)/receita*100;
    const vendasDia=(c.units_quantity||0)+(c.organic_units_quantity||0);
    dias.push({date:d.date,cost:c.cost||0,receita,tacos,vendasDia,roas:c.roas||0,objetivo:obj});
  });
  if(dias.length<3) return null;
  const porObjetivo={};
  dias.forEach(d=>{ (porObjetivo[d.objetivo]=porObjetivo[d.objetivo]||[]).push(d); });
  if(Object.keys(porObjetivo).length<2) return null;
  let resumo=Object.keys(porObjetivo).map(k=>{
    const l=porObjetivo[k];
    const tacosM=l.reduce((a,x)=>a+x.tacos,0)/l.length;
    const vendasM=l.reduce((a,x)=>a+x.vendasDia,0)/l.length;
    const roasM=l.reduce((a,x)=>a+x.roas,0)/l.length;
    const custoM=l.reduce((a,x)=>a+x.cost,0)/l.length;
    const receitaM=l.reduce((a,x)=>a+x.receita,0)/l.length;
    const margemM=receitaM*(margemPct/100);
    const lucroM=margemM-custoM;
    const eficiencia=custoM>0?lucroM/custoM:0;
    return {faixa:Number(k),dias:l.length,tacosM,vendasM,roasM,custoM,receitaM,margemM,lucroM,eficiencia,scoreIdeal:vendasM*lucroM*eficiencia};
  }).filter(r=>r.dias>=3);
  if(resumo.length<2) return null;
  const N_MIN=5;
  const elegiveis=resumo.filter(r=>r.dias>=N_MIN&&r.tacosM<=metaTacos);
  let sugestao=null,dentroMeta=false,maisProxima=null;
  if(elegiveis.length){ elegiveis.sort((a,b)=>b.scoreIdeal-a.scoreIdeal); sugestao=elegiveis[0]; dentroMeta=true; }
  else { const comAmostra=resumo.filter(r=>r.dias>=N_MIN); if(comAmostra.length) maisProxima=[...comAmostra].sort((a,b)=>a.tacosM-b.tacosM)[0]; }
  resumo.sort((a,b)=>b.scoreIdeal-a.scoreIdeal);
  return {ranking:resumo,sugestao,dentroMeta,maisProxima,metaTacos,diasAmostrados:dias.length,metodo:'objetivo_real'};
}

           de fato aconteceu em cada dia). O método de histórico de objetivo configurado
           (_adsCalcularBucketsCampanhaPorObjetivoReal) fica guardado no código sem uso, caso um dia
           a gente volte a ter esse dado de forma confiável. */
        const proxy=_adsCalcularBucketsCampanha(porDia,id,margemPct,metaTacos);
        if(!proxy) return;
        porCampanha[id]={
          melhor:proxy.melhor,
          elegiveis:proxy.elegiveis,

          metaTolerada:proxy.metaTolerada,
          margemPct,margemFonte,
          diasAmostrados:proxy.diasAmostrados
        };
      });
      const arr=adsSugestaoRoasArr();
      arr[loja]={calculadoEm:Date.now(),porCampanha};
      persist();
      adsSugestaoRoasStatus='concluido';
      renderAds();
    }catch(e){ adsSugestaoRoasStatus='erro'; adsSugestaoRoasErro=e.message; renderAds(); }
  },2500);
}
/* ---------- Ads: puxado direto da API (Product Ads / Mercado Ads) ----------
   Substitui o renderAds() manual acima (ficou parado, sem uso, caso algum pedaço da análise
   dele — scores, sugestões etc — sirva de referência depois). Por enquanto só mostra tudo que
   a API devolve, sem calcular nada por cima: filtros e cálculos entram numa etapa seguinte,
   depois de decidirmos o que faz sentido com dado real na mão. */
function adsApiLoja(loja){
  if(!state.adsApi) state.adsApi={};
  if(!state.adsApi[loja]) state.adsApi[loja]={advertiserId:null,siteId:null,atualizadoEm:null,periodos:{}};
  if(!state.adsApi[loja].manualLostRank) state.adsApi[loja].manualLostRank={};
  if(!state.adsApi[loja].tagMaisVendido) state.adsApi[loja].tagMaisVendido={};
  return state.adsApi[loja];
}
async function adsSincronizarLoja(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
  const rSync=await fetch(`${base}/ads/sync?loja=${encodeURIComponent(loja)}`,{method:'POST'});
  let jSync; try{ jSync=await rSync.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado ao sincronizar Ads (status '+rSync.status+').'); }
  if(!rSync.ok||!jSync.ok) throw new Error(jSync.erro||('Falha ao sincronizar Ads (status '+rSync.status+').'));
  const rData=await fetch(`${base}/ads/data?loja=${encodeURIComponent(loja)}`);
  let jData; try{ jData=await rData.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado ao buscar os dados de Ads.'); }
  if(!rData.ok||!jData.ok) throw new Error(jData.erro||'Falha ao buscar os dados de Ads sincronizados.');
  const alvo=adsApiLoja(loja);
  alvo.periodos=jData.periodos||{};
  alvo.atualizadoEm=jData.atualizadoEm;
  /* loga 1 leitura de hoje por campanha (janela de 7 dias, mais estável) pro histórico que
     alimenta o ponto de inflexão TACOS × ROAS - sozinho, sem precisar de colagem manual. */
  const p7=alvo.periodos.d7;
  if(p7&&p7.results) registrarHistoricoAds(loja,p7.results);
  persist();
  return jData;
}
/* histórico diário de TACOS/ROAS/vendas por campanha, alimentado sozinho a cada "Atualizar"
   (puxa da API) - guarda 1 leitura por campanha por dia (sincronizar de novo no mesmo dia
   substitui a leitura de hoje em vez de duplicar). É a base pra achar o ponto de inflexão
   TACOS × ROAS de cada campanha (ver pontoInflexaoAds) - sem precisar de colagem manual. */
function adsHistArr(){ if(!Array.isArray(state.adsHist)) state.adsHist=[]; return state.adsHist; }
/* historico de ROAS OBJETIVO real (diferente do adsHist acima, que registra o ROAS REALIZADO por
   dia) - aqui cada entrada diz "a partir desta data, o objetivo configurado passou a ser X".
   Alimentado de duas formas: (1) automaticamente, toda vez que "Atualizar" roda e o objetivo
   atual e diferente do ultimo conhecido, grava a mudanca com a data de hoje; (2) manualmente, na
   tela de detalhe da campanha, quando o usuario ja sabe datas de mudancas passadas (antes do
   Doca comecar a registrar sozinho). E a base pra bucketizar o estudo de 90 dias pelo objetivo
   REAL configurado em cada dia, em vez do ROAS que calhou de ser realizado (proxy mais fraco,
   usado so quando nao ha historico real suficiente ainda). */
function adsObjetivoHistArr(){ if(!Array.isArray(state.adsObjetivoHist)) state.adsObjetivoHist=[]; return state.adsObjetivoHist; }
function registrarMudancaObjetivo(loja,campanhaId,desde,roas){
  const arr=adsObjetivoHistArr();
  const cid=String(campanhaId);
  const i=arr.findIndex(x=>x.loja===loja&&String(x.campanhaId)===cid&&x.desde===desde);
  if(i>=0) arr[i].roas=roas; else arr.push({loja,campanhaId:cid,desde,roas});
}
function removerMudancaObjetivo(loja,campanhaId,desde){
  state.adsObjetivoHist=adsObjetivoHistArr().filter(x=>!(x.loja===loja&&String(x.campanhaId)===String(campanhaId)&&x.desde===desde));
}
function historicoObjetivoCampanha(loja,campanhaId){
  return adsObjetivoHistArr().filter(x=>x.loja===loja&&String(x.campanhaId)===String(campanhaId)).sort((a,b)=>a.desde<b.desde?-1:(a.desde>b.desde?1:0));
}
function objetivoRealNaData(loja,campanhaId,data){
  const hist=historicoObjetivoCampanha(loja,campanhaId).filter(x=>x.desde<=data);
  if(!hist.length) return null;
  return hist[hist.length-1].roas;
}
/* aceita colar varias linhas tipo "21/05/2026 = 6" ou "18/06 pra 7" (ano opcional, assume o
   atual) - extrai data + numero de cada linha, ignora o resto do texto */
function parseImportacaoObjetivo(texto){
  const linhas=String(texto||'').split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const anoAtual=new Date().getFullYear();
  const out=[];
  linhas.forEach(l=>{
    const m=l.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?[^\d]+(\d+(?:[.,]\d+)?)/);
    if(!m) return;
    const dd=m[1].padStart(2,'0'), mm=m[2].padStart(2,'0');
    let aaaa=m[3]?m[3]:String(anoAtual);
    if(aaaa.length===2) aaaa='20'+aaaa;
    const roas=Number(m[4].replace(',','.'));
    if(isNaN(roas)) return;
    out.push({desde:`${aaaa}-${mm}-${dd}`,roas});
  });
  return out;
}
function registrarHistoricoAds(loja,campanhas){
  const arr=adsHistArr();
  const dia=hoje();
  campanhas.forEach(camp=>{
    const m=camp.metrics||{};
    const vendasDia=((m.units_quantity||0)+(m.organic_units_quantity||0))/7;
    const reg={data:dia,loja,campanhaId:camp.id,campanhaNome:camp.title||camp.name||camp.id,
      roasObjetivo:camp.roas_target||0,orcamento:camp.budget||0,tacos:calcTacos(m),roasRealizado:m.roas||0,vendasDia};
    const i=arr.findIndex(x=>x.data===dia&&x.loja===loja&&x.campanhaId===camp.id);
    if(i>=0) arr[i]=reg; else arr.push(reg);
    /* detecta mudanca de ROAS objetivo sozinho: se o valor atual for diferente do ultimo
       registrado no historico real, grava a mudanca com a data de hoje (pedido do Felipe -
       comeca a registrar quando perceber alteracao de roas). */
    const objAtual=camp.roas_target||0;
    const histObj=historicoObjetivoCampanha(loja,camp.id);
    const ultimoObj=histObj.length?histObj[histObj.length-1]:null;
    if(!ultimoObj||Number(ultimoObj.roas)!==Number(objAtual)) registrarMudancaObjetivo(loja,camp.id,dia,objAtual);
  });
  /* guarda só os últimos 400 registros por loja+campanha pra não crescer pra sempre */
  const chaves=[...new Set(arr.map(h=>h.loja+'|'+h.campanhaId))];
  chaves.forEach(ch=>{
    const i=ch.indexOf('|'), loja2=ch.slice(0,i), cid=ch.slice(i+1);
    const meus=arr.filter(h=>h.loja===loja2&&String(h.campanhaId)===cid);
    if(meus.length>400){ const foraIds=new Set(meus.slice(0,meus.length-400).map(x=>x.data));
      state.adsHist=arr.filter(h=>!(h.loja===loja2&&String(h.campanhaId)===cid&&foraIds.has(h.data))); }
  });
}
/* responde 2 perguntas com o histórico de 1 campanha, agrupando as leituras por qual ROAS
   objetivo estava configurado em cada uma (cada valor de ROAS objetivo = 1 "experimento"):
   1) meta de vendas/dia: qual ROAS objetivo já sustentou essa meta, e com que TACOS médio.
   2) ponto de inflexão: dentre todos os experimentos já feitos, qual teve o melhor equilíbrio
      de TACOS baixo + ROAS alto + vendas altas ao mesmo tempo (o "ponto máximo de otimização"
      que a campanha já alcançou de verdade, não uma meta hipotética). */
function pontoInflexaoAds(loja,campanhaId,metaVendasDia){
  const regs=adsHistArr().filter(h=>h.loja===loja&&String(h.campanhaId)===String(campanhaId));
  if(regs.length<2) return null;
  const porRoas={};
  regs.forEach(h=>{ (porRoas[h.roasObjetivo]=porRoas[h.roasObjetivo]||[]).push(h); });
  const resumo=Object.keys(porRoas).map(k=>{
    const l=porRoas[k];
    const tacosMedio=l.reduce((a,x)=>a+x.tacos,0)/l.length;
    const roasMedio=l.reduce((a,x)=>a+x.roasRealizado,0)/l.length;
    const vendasDiaMedia=l.reduce((a,x)=>a+x.vendasDia,0)/l.length;
    return {roas:Number(k),tacosMedio,roasMedio,vendasDiaMedia,leituras:l.length};
  });
  if(resumo.length<2) return null;
  const bateMeta=resumo.filter(r=>r.vendasDiaMedia>=metaVendasDia).sort((a,b)=>a.tacosMedio-b.tacosMedio)[0]||null;
  /* score simples e explicável: mais vendas × mais ROAS ÷ menos TACOS - cada experimento com
     leitura de verdade concorre nesse número, o maior vence. Exige tacosMedio>0 pra não deixar
     um dia com custo zero (sem investir nada) ganhar por divisão por zero. */
  const candidatos=resumo.filter(r=>r.tacosMedio>0&&r.vendasDiaMedia>0);
  const otimo=candidatos.length?candidatos.slice().sort((a,b)=>(b.vendasDiaMedia*b.roasMedio/b.tacosMedio)-(a.vendasDiaMedia*a.roasMedio/a.tacosMedio))[0]:null;
  return {resumo:resumo.sort((a,b)=>a.roas-b.roas),bateMeta,otimo};
}
/* TACOS (Total Advertising Cost of Sale) = custo do anúncio dividido pela receita TOTAL do
   produto anunciado (venda atribuída ao anúncio + venda orgânica dele) — diferente do ACOS,
   que só considera a venda atribuída ao anúncio. A API de Ads não devolve isso pronto (só
   ACOS/ROAS), então calculamos a partir do que ela devolve. */
function calcTacos(m){
  const receita=(m.total_amount||0)+(m.organic_units_amount||0);
  return receita>0?(m.cost||0)/receita*100:0;
}
/* "Aporte para publicidade" = o mesmo texto/percentual que aparece no painel oficial do Mercado
   Ads ("Seus anúncios patrocinados geram X% das vendas totais dos seus anúncios divulgados").
   Confirmado batendo com dado real: campanha CABO MICKEY, 7 dias — units_quantity:50,
   organic_items_quantity:23 → 50/(50+23)=68,49% ≈ os 68% mostrados no painel deles. */
function calcAporteAds(m){
  const vendasAds=m.units_quantity||0, outrasVendas=m.organic_items_quantity||0;
  const total=vendasAds+outrasVendas;
  return total>0?vendasAds/total*100:0;
}
/* seta comparando o valor atual com o de um período mais longo (ex.: 7d vs 30d) — verde quando
   melhora, vermelho quando piora; maiorMelhor diz se, pra essa métrica, subir é bom (ROAS/CTR/
   CVR) ou ruim (TACOS/ACOS) */
function setaTrendAds(atual,base,maiorMelhor){
  if(base==null||!isFinite(base)) return '';
  const diff=atual-base;
  if(Math.abs(diff)<0.05) return ' <span class="muted" style="font-size:10px">=</span>';
  const melhorou=maiorMelhor?diff>0:diff<0;
  return ` <span class="${melhorou?'okv':'pend'}" style="font-size:10px">${diff>0?'▲':'▼'}</span>`;
}
/* ---------- sugestão "subir ROAS" (regra combinada com o usuário — ver
   regras_sugestao_roas_ads.md pra descrição completa de cada critério) ----------
   SEMPRE em cima dos últimos 7 dias (não muda com o período selecionado na tela) - as
   tendências (critérios de TACOS e CVR vs. histórico) comparam contra 15d E 30d juntos.
   O critério de CVR (o mais importante de todos, segundo o usuário) não é mais um simples
   sim/não - vira peso crescente em 6 faixas: CVR > 5% = peso 1, > 10% = peso 2, > 15% = peso 3,
   > 20% = peso 4, > 25% = peso 5, > 30% = peso 6. Os outros 5 critérios continuam valendo 1
   ponto cada (sim/não). A nota final é a soma de tudo dividida pelo máximo possível (5 + 6 = 11). */
const PESO_MAX_CVR=6;
function pesoCvr(cvrPct){
  if(cvrPct==null) return 0;
  if(cvrPct>30) return 6;
  if(cvrPct>25) return 5;
  if(cvrPct>20) return 4;
  if(cvrPct>15) return 3;
  if(cvrPct>10) return 2;
  if(cvrPct>5) return 1;
  return 0;
}
/* avalia os critérios pra TODAS as campanhas de 1 loja de uma vez. Devolve um Map
   campanhaId -> {score (0-100), criterios:[5 booleans], pesoCvr (0-6), cvr7, vendasDia}. */
function avaliarSugestoesRoas7d(loja,dados){
  const p7=dados.periodos.d7, p15=dados.periodos.d15, p30=dados.periodos.d30;
  const campanhas7=(p7&&p7.results)||[];
  const mapa15={}, mapa30={};
  ((p15&&p15.results)||[]).forEach(cp=>mapa15[cp.id]=cp.metrics||{});
  ((p30&&p30.results)||[]).forEach(cp=>mapa30[cp.id]=cp.metrics||{});
  const resultado=new Map();
  campanhas7.forEach(camp=>{
    const m=camp.metrics||{};
    const m15=mapa15[camp.id], m30=mapa30[camp.id];
    const vendasTotal=(m.units_quantity||0)+(m.organic_units_quantity||0);
    const vendasDia=vendasTotal/7;
    const tacos7=calcTacos(m);
    const tacos15=m15?calcTacos(m15):null;
    const tacos30=m30?calcTacos(m30):null;
    const cvr7=m.cvr||0, cvr15=m15?(m15.cvr||0):null, cvr30=m30?(m30.cvr||0):null;
    const criterios=[
      m.roas!=null&&camp.roas_target!=null&&m.roas>camp.roas_target,          // 1. ROAS real > objetivo
      m.sov!=null&&m.sov>50,                                                  // 2. Ganho de Leilões > 50%
      vendasDia>=10,                                                          // 3. 10 vendas/dia (orgânica+ads)
      (tacos15!=null&&tacos7<tacos15)&&(tacos30!=null&&tacos7<tacos30),       // 4. TACOS caindo vs. 15d E 30d
      (cvr15!=null&&cvr7>=cvr15-0.05)&&(cvr30!=null&&cvr7>=cvr30-0.05)        // 5. CVR subindo ou igual vs. 15d E 30d
    ];
    const pesoCvrCriterio=pesoCvr(cvr7);
    const score=(criterios.filter(Boolean).length+pesoCvrCriterio)/(criterios.length+PESO_MAX_CVR)*100;
    resultado.set(camp.id,{score,criterios,pesoCvr:pesoCvrCriterio,cvr7,vendasDia,tacos:tacos7});
  });
  return resultado;
}

        ${aberto?`<tr><td colspan="14">
          <div class="form-grid" style="grid-template-columns:repeat(4,1fr);gap:8px 16px;margin:6px 0 10px">
            <div><span class="muted" style="font-size:11px">Orçamento</span><br>${fmtMoney(camp.budget||0)}</div>

            if(!dadosCamp){

            const margemReal=dadosCamp.margemFonte==='produto_real';

            };
            if(!dadosCamp.melhor){

                <b style="font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold,#d4a83c)">⚠ Sugestão de ROAS objetivo (90 dias) · meta de TACOS ${dadosCamp.metaTolerada.toFixed(1)}% (1/3 da ${margemLabel} + tolerância de 15%)</b>
                <div>Nenhum ROAS testado com amostra suficiente (2+ dias) ficou dentro da meta de TACOS nos últimos 90 dias — mas seguem os melhores cenários já testados, mesmo fora da meta, pra você decidir:</div>
                ${rankingHtml}
                <div style="opacity:.6;font-size:11px">Calculado em ${new Date(sug.calculadoEm).toLocaleString('pt-BR')} · ${dadosCamp.diasAmostrados} dia(s) com venda no período. Pra fechar a meta, ou testa um ROAS mais alto ao vivo e acompanha o resultado, ou revisa se 1/3 da margem é realista pra esse produto especificamente.${margemReal?'':' ⚠ '+margemLabel}</div>

              ${dadosCamp.elegiveis.slice(0,8).map(linhaCenario).join('')}
              <div style="opacity:.6;font-size:11px">Calculado em ${new Date(sug.calculadoEm).toLocaleString('pt-BR')} · ${dadosCamp.diasAmostrados} dia(s) com venda no período · meta baseada na ${margemLabel}. O ⭐ é o melhor cenário pelo conjunto vendas + lucro + eficiência; os outros ficam aqui pra você decidir olhando os números.</div>

          </label>
        </td></tr>`:''}`;

    </tbody></table></div>`:`<p class="empty-inline">${personalizado?(adsPersonalizadoCarregando?'Calculando...':(adsPersonalizadoResultado?'Nenhuma campanha encontrada nesse período.':'Escolha as datas e clique em Calcular.')):(dados.atualizadoEm?'Nenhuma campanha encontrada nesse período.':'Clique em Atualizar pra puxar as campanhas dessa loja.')}</p>`}
  `;
  document.getElementById('adLoja').onchange=e=>{ c.loja=e.target.value; persist(); renderAds(); };
  document.getElementById('adPeriodo').onchange=e=>{ adsPeriodoApi=e.target.value; renderAds(); };
  document.getElementById('adFiltro').onchange=e=>{
    /* só troca a ordenação — NÃO recalcula mais nada aqui. O cálculo de Lucro Bruto e a
       Sugestão de ROAS agora só rodam quando aperta "Atualizar" (evita ficar martelando o
       backend a cada troca de filtro/período/loja). */
    adsFiltro=e.target.value;
    renderAds();
  };
  const adMargemEl=document.getElementById('adMargem');
  if(adMargemEl) adMargemEl.onchange=e=>{ const v=Number(e.target.value); if(isNaN(v)||v<0){ alert('Valor inválido.'); renderAds(); return; } c.margemPct=v; persist(); renderAds(); };
  const btnAtualizar=document.getElementById('adAtualizar');
  if(btnAtualizar) btnAtualizar.onclick=async()=>{
    adsSincronizando=true; renderAds();
    try{
      await adsSincronizarLoja(c.loja);
      toast('Ads atualizado.');
      /* recalcula o Lucro Bruto e dispara a Sugestão de ROAS (90 dias, todas as campanhas) -
         essa segunda parte roda em background e não trava o Atualizar (a barra de progresso
         aparece sozinha na tela enquanto ela roda). */
      calcularLucroAdsPeriodo(c.loja,adsPeriodoApi);
      iniciarSugestaoRoasLoja(c.loja);
    }
    catch(e){ alert('Não foi possível sincronizar: '+e.message); }
    finally{ adsSincronizando=false; renderAds(); }
  };
  const elPersBtn=document.getElementById('adPersonalizadoBtn');
  if(elPersBtn) elPersBtn.onclick=()=>abrirSeletorPeriodo(adsPersonalizadoDe,adsPersonalizadoAte,(de,ate)=>{
    adsPersonalizadoDe=de; adsPersonalizadoAte=ate; renderAds();
  });
  const btnPersCalc=document.getElementById('adPersonalizadoCalcular');
  if(btnPersCalc) btnPersCalc.onclick=()=>{
    /* antes só calculava o Lucro/custo quando o filtro já estava em "Maior Lucro Bruto" -
       por isso o custo ficava em branco no personalizado mesmo trocando de filtro depois.
       Agora calcula sempre, igual ao "Atualizar" nos outros períodos. A Sugestão de ROAS (90
       dias, sempre a mesma janela independente do período escolhido aqui em cima) também
       precisa disparar aqui, porque o botão "Atualizar" (que normalmente dispara ela) fica
       escondido quando o período é personalizado. */
    adsBuscarPersonalizado(c.loja);
    calcularLucroAdsPeriodo(c.loja,adsPeriodoApi);
    iniciarSugestaoRoasLoja(c.loja);
  };

    const id=String(b.dataset.adsver);

    renderAds();
  });
  el.querySelectorAll('[data-adstag]').forEach(chk=>chk.onchange=()=>{
    dados.tagMaisVendido[chk.dataset.adstag]=chk.checked;
    persist();
    toast(chk.checked?'Marcado com a tag de Mais Vendido.':'Tag de Mais Vendido removida.');
    renderAds();
  });
}
/* ================= Finanças (despesas + histórico mensal, base pra DRE) =================
   Guarda as despesas do negócio (manuais ou puxadas automaticamente do Mercado Livre) com data de
   pagamento, se já foi pago, e se é recorrente (repete todo mês). Despesa recorrente marcada como
   paga não "some" nem "vira" o mês que vem — ela fica registrada naquele mês (pro histórico) e uma
   NOVA ocorrência é criada pro mês seguinte, ligada pelo campo origemRecorrenciaId. Ainda não inclui
   receita/faturamento automaticamente — só o lado das despesas, que é o que foi pedido por ora. */
function despesasArr(){ if(!Array.isArray(state.despesas)) state.despesas=[]; return state.despesas; }
function addDespesa({descricao,valor,dataPagamento,recorrente,loja,origem,faturaKey}){
  snapshot('nova despesa'+(descricao?' ("'+descricao.slice(0,30)+'")':''));
  const arr=despesasArr();
  const d={id:gerarId('desp'),descricao:(descricao||'').trim(),valor:Number(valor)||0,dataPagamento:dataPagamento||hoje(),
    pago:false,recorrente:!!recorrente,loja:loja||null,origem:origem||'manual',faturaKey:faturaKey||null,
    origemRecorrenciaId:null,criadoEm:Date.now()};
  arr.push(d);
  persist();
  return d;
}
function abrirEditarDespesaModal(id){
  const d=despesasArr().find(x=>x.id===id); if(!d) return;
  const body=openModal(false);
  body.innerHTML=`<h3>Editar despesa</h3>
    <div class="form-grid" style="grid-template-columns:2fr 1fr 1fr 1fr">
      <label>Descrição<input id="feDescricao" type="text" value="${esc(d.descricao)}"></label>
      <label>Valor (R$)<input id="feValor" type="number" min="0" step="0.01" value="${d.valor}"></label>
      <label>Data de pagamento<input id="feData" type="date" value="${esc(d.dataPagamento)}"></label>
      <label>Loja<select id="feLoja"><option value="" ${d.loja?'':'selected'}>Geral (todas)</option>${optsLojas(d.loja)}</select></label>
    </div>
    <div class="acoes-linha" style="margin-top:10px">
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px"><input type="checkbox" id="feRecorrente" style="width:auto" ${d.recorrente?'checked':''}> Despesa recorrente (repete todo mês)</label>
    </div>
    ${d.origem==='ml_fatura'?`<p class="hint" style="margin-top:8px">⚠ Esta despesa veio automático da fatura do Mercado Livre — se sincronizar de novo, o valor puxado da API substitui o que você editar aqui.</p>`:''}
    <div class="modal-actions"><button class="btn" id="btnCancelarEditDesp">Cancelar</button><button class="btn acc" id="btnSalvarEditDesp">Salvar alterações</button></div>`;
  document.getElementById('btnCancelarEditDesp').onclick=closeModal;
  document.getElementById('btnSalvarEditDesp').onclick=()=>{
    const r=editarDespesa(id,{
      descricao:document.getElementById('feDescricao').value.trim(),
      valor:Number(document.getElementById('feValor').value),
      dataPagamento:document.getElementById('feData').value,
      loja:document.getElementById('feLoja').value||null,
      recorrente:document.getElementById('feRecorrente').checked,
    });
    if(!r.ok){ alert(r.msg); return; }
    closeModal(); toast('Despesa atualizada.'); renderFinancas();
  };
}
/* edita uma despesa já lançada (descrição, valor, data, loja, recorrente) - útil pro cartão de

function marcarDespesaPaga(id,pago){

/* busca a fatura mais recente do Mercado Livre (taxas de venda/anúncio/Full - não é o saldo do
   Mercado Pago) e cadastra/atualiza como despesa recorrente automaticamente, evitando duplicar
   pelo par loja+faturaKey (a "key" que o próprio ML usa pra identificar o período de cobrança) */
let financasUltimoErroAuto={}; // loja -> mensagem do último erro da tentativa AUTOMÁTICA de puxar a fatura (não persistido — só pra visibilidade nesta sessão, sem precisar abrir o console do navegador)
let mlUltimoErroAuto={}; // loja -> mensagem do último erro da sincronização AUTOMÁTICA de produtos do Mercado Livre ao abrir o Doca (mesma ideia acima) - pedido do Felipe 19/08: produto novo cadastrado no ML não estava aparecendo, e a sincronização automática falhava sem avisar nada na tela (só no console)
function sleep(ms){ return new Promise(res=>setTimeout(res,ms)); }
async function puxarFaturaMl(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
  const r=await fetch(`${base}/financas/fatura-ml?loja=${encodeURIComponent(loja)}`);
  let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+r.status+').'); }
  if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao buscar a fatura do Mercado Livre (status '+r.status+').'));
  if(!j.fatura) throw new Error('Nenhuma fatura encontrada pra essa loja ainda.');
  const f=j.fatura;
  const arr=despesasArr();
  // sem data de vencimento confiável (período ainda em aberto, ML não fechou a conta) usa hoje
  // só pra a despesa aparecer no mês certo — não inventa uma data de vencimento que não existe
  const dataPagamento=f.vencimento||hoje();
  let d=arr.find(x=>x.origem==='ml_fatura'&&x.loja===loja&&x.faturaKey===f.key);
  if(d){
    snapshot('atualização da fatura do Mercado Livre ('+loja+')');
    d.valor=f.valor; d.dataPagamento=dataPagamento; d.itens=f.itens||[]; d.valorTotal=f.valorTotal; d.itensAviso=f.itensAviso||null;
    if(f.valorPendente===0) d.pago=true;
  }else{
    snapshot('fatura do Mercado Livre importada ('+loja+')');
    arr.push({id:gerarId('desp'),descricao:'Fatura Mercado Livre — '+loja,valor:f.valor,dataPagamento,
      pago:f.valorPendente===0,recorrente:true,loja,origem:'ml_fatura',faturaKey:f.key,origemRecorrenciaId:null,
      itens:f.itens||[],valorTotal:f.valorTotal,itensAviso:f.itensAviso||null,criadoEm:Date.now()});
  }
  delete financasUltimoErroAuto[loja];
  persist();
  return f;
}
/* tenta de novo com espera crescente quando o Mercado Livre responde 429 (limite de chamadas por
   segundo) — descoberto ao puxar a fatura das 4 lojas em paralelo assim que o Doca abre, que às
   vezes estourava o limite. Erros de outro tipo (sem fatura, backend fora do ar etc.) não têm
   novo motivo pra dar certo numa tentativa a mais, então sobem direto. */
async function puxarFaturaMlComRetry(loja,tentativa){
  tentativa=tentativa||0;
  try{
    return await puxarFaturaMl(loja);
  }catch(e){
    if(/\b429\b/.test(e.message)&&tentativa<3){
      await sleep(1200*Math.pow(2,tentativa));
      return puxarFaturaMlComRetry(loja,tentativa+1);
    }
    throw e;
  }
}

/* ================= Retiradas e Reembolsos (TorvStore): fechamento equilibrado entre sócios =====
   RETIRADA = dinheiro que o sócio já tirou da empresa pra ele (reduz o que falta receber da cota).
   REEMBOLSO = o inverso: dinheiro que o sócio pagou do próprio bolso pela empresa e que a empresa
   precisa devolver pra ele (aumenta o que a empresa ainda deve, além da cota). No fechamento, a
   margem líquida do período é dividida 50/50 (a "cota" de cada um); o que falta pra cada um é:
   cota − retiradas + reembolsos. Quem já retirou mais que a cota (líquido de reembolsos) devolve a
   diferença. Cada entrada guarda um "tipo" ('retirada' ou 'reembolso') — entradas antigas sem tipo
   (de antes desse campo existir) contam como retirada, mantendo o comportamento de antes. */
function sociosLoja(loja){
  if(!state.socios) state.socios={};
  if(!state.socios[loja]) state.socios[loja]={felipe:[],thiago:[]};
  if(!Array.isArray(state.socios[loja].felipe)) state.socios[loja].felipe=[];
  if(!Array.isArray(state.socios[loja].thiago)) state.socios[loja].thiago=[];
  [...state.socios[loja].felipe,...state.socios[loja].thiago].forEach(x=>{ if(x.tipo!=='retirada'&&x.tipo!=='reembolso') x.tipo='retirada'; });
  return state.socios[loja];
}

let financasResumoAnterior=null;

function _diasEntreISO(de,ate){ return Math.round((new Date(ate+'T00:00:00Z')-new Date(de+'T00:00:00Z'))/864e5)+1; }
function _somaDiasISO(iso,dias){ const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+dias); return d.toISOString().slice(0,10); }
function periodoAnteriorEquivalente(de,ate){
  const dias=_diasEntreISO(de,ate);
  const anteAte=_somaDiasISO(de,-1);
  const anteDe=_somaDiasISO(anteAte,-(dias-1));
  return {de:anteDe,ate:anteAte};
}

      ${(res.avisos||[]).filter(a=>!/^intervalo /.test(a)).length?`<p class="hint" style="color:#e6a23c;margin-top:6px">${res.avisos.filter(a=>!/^intervalo /.test(a)).map(a=>esc(a)).join('<br>')}</p>`:''}

      </tbody></table></div>`:`<p class="empty-inline">Nenhuma anomalia encontrada nesse período.</p>`}
      `:''}

}
/* fechamento de todas as lojas de uma vez, no MESMO periodo escolhido no Resumo Financeiro acima -
   busca /financas/resumo loja por loja (com uma pequena pausa entre elas pra nao estourar limite
   de chamadas por segundo) e monta um relatorio pra impressao comparando faturamento, margem de
   contribuicao, lucro bruto e margem liquida entre as lojas. */
async function calcularFechamentoTodasLojas(){
  if(financasFechTodasCarregando) return;
  /* v (19/08, 2a revisão a pedido do Felipe): sem aba nova nenhuma - o vídeo toca em tela cheia
     na PRÓPRIA aba do Doca (só assim o navegador libera autoplay com som - uma aba nova aberta
     via window.open nunca recebe o clique nela mesma, então fica mudo/congelado) e, quando o
     relatório fica pronto, ele substitui a página inteira NESSA MESMA aba (ver
     imprimirRelatorioFechamentoTodasLojas) - pra voltar pro Doca depois, é só usar o botão
     "voltar" do navegador. */
  mostrarOverlayVideoCarregando();
  financasFechTodasCarregando=true; financasFechTodasErro=null; financasFechTodasProgresso={feito:0,total:STORES.length,etapa:''}; renderFinancas();
  try{
    if(financasResumoPeriodo==='personalizado'&&(!financasResumoDe||!financasResumoAte)) throw new Error('Informe as duas datas do período personalizado.');
    const resultados=[];
    for(let i=0;i<STORES.length;i++){
      const loja=STORES[i];
      const resumo=await fetchResumoJob(loja,financasResumoPeriodo,financasResumoDe,financasResumoAte,(p)=>{
        financasFechTodasProgresso={feito:i,total:STORES.length,etapa:`${loja}: ${p&&p.etapa?p.etapa:''} (${p?p.feito:0}%)`};
        renderFinancas();
        // progresso geral = lojas já concluídas + fração da loja atual (0-100% dela), pedido do
        // Felipe 20/08: barra de progresso em tempo real por cima do vídeo de loading
        atualizarOverlayProgresso(((i+(p&&p.feito?p.feito/100:0))/STORES.length)*100);
      });
      resultados.push({loja,resumo,m:calcularMargensResumo(resumo,loja)});
      financasFechTodasProgresso={feito:i+1,total:STORES.length,etapa:`${loja} concluída`};
      renderFinancas();
      atualizarOverlayProgresso(((i+1)/STORES.length)*100);
      await sleep(150);
    }
    // relatório pronto - substitui a página inteira NESSA aba (document.write dentro da função
    // abaixo derruba o app do Doca dessa aba, então nada depois disso precisa (nem consegue)
    // rodar de forma visível - por garantia zera os estados antes de sair)
    financasFechTodasCarregando=false; financasFechTodasProgresso=null;
    imprimirRelatorioFechamentoTodasLojas(resultados);
    return;
  }catch(e){
    financasFechTodasErro=e.message;
  }
  financasFechTodasCarregando=false; financasFechTodasProgresso=null; renderFinancas(); esconderOverlayVideoCarregando();
}
/* overlay do vídeo de loading, sobre a própria tela do Doca - tela cheia, barra de progresso
   em cima (pedido do Felipe 20/08 - antes estava embaixo) */
let overlayProgressoReal=0, overlayProgressoExibido=0, overlayProgressoTrickleTimer=null;
function mostrarOverlayVideoCarregando(){
  esconderOverlayVideoCarregando();
  overlayProgressoReal=0; overlayProgressoExibido=0;
  const div=document.createElement('div');
  div.id='overlayVideoCarregando';
  div.style.cssText='position:fixed;inset:0;z-index:99999;background:#0A0418;display:flex;align-items:center;justify-content:center';
  /* pedido do Felipe 20/08: no celular o vídeo continua ocupando a tela inteira (comportamento
     original), mas no computador (telas largas) ele ficava esticado/cortado de forma estranha
     porque o vídeo é vertical (formato de celular, 478x850). A partir de 700px de largura, o
     vídeo passa a ficar num quadro no formato de celular, centralizado, em vez de esticar pra
     tela toda. */
  div.innerHTML=`<style>
      #overlayVideoCarregando .video-fechamento-frame{position:relative;width:100%;height:100%}
      @media (min-width:700px){
        #overlayVideoCarregando .video-fechamento-frame{width:auto;height:min(88vh,850px);aspect-ratio:478/850;border-radius:18px;overflow:hidden;box-shadow:0 24px 70px -20px rgba(0,0,0,.85)}
      }
    </style>
    <div class="video-fechamento-frame">
      <video id="videoCarregandoFechamento" playsinline loop style="width:100%;height:100%;object-fit:cover;display:block" src="${backendUrl()}/loading-video.mp4?v=2"></video>
      <div style="position:absolute;left:0;right:0;top:0;padding:calc(18px + env(safe-area-inset-top)) 22px 18px;background:linear-gradient(180deg,rgba(0,0,0,.65),transparent)">
        <div style="height:6px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden">
          <div id="barraProgressoFechamento" style="height:100%;width:0%;background:#fff;border-radius:99px;transition:width .35s linear"></div>
        </div>
        <div id="pctProgressoFechamento" style="margin-top:8px;color:#fff;font-size:13px;font-weight:600;text-align:center">0%</div>
      </div>
    </div>`;
  document.body.appendChild(div);
  const v=document.getElementById('videoCarregandoFechamento');
  if(v){ v.play().catch(()=>{}); }
  /* "trickle": pedido do Felipe 20/08 (ficava muito tempo parado no mesmo número entre uma
     atualização real e outra, ex. durante o cálculo de frete de uma loja com muitos envios) -
     a cada 400ms avança um pouquinho sozinha, sem nunca ultrapassar 4 pontos à frente do último
     progresso REAL recebido nem passar de 97% (os últimos % só aparecem quando a loja realmente
     terminar) - dá sensação de continuidade sem inventar progresso que não existe. */
  overlayProgressoTrickleTimer=setInterval(()=>{
    const teto=Math.min(97,overlayProgressoReal+4);
    if(overlayProgressoExibido<teto){ overlayProgressoExibido=Math.min(teto,overlayProgressoExibido+0.6); pintarOverlayProgresso(); }
  },400);
}
function pintarOverlayProgresso(){
  const barra=document.getElementById('barraProgressoFechamento');
  const texto=document.getElementById('pctProgressoFechamento');
  if(!barra||!texto) return;
  const p=Math.round(overlayProgressoExibido);
  barra.style.width=p+'%';
  texto.textContent=p+'%';
}
/* recebe o progresso REAL (ver chamadas em calcularFechamentoTodasLojas) - o trickle acima só
   preenche o tempo ATÉ aqui, nunca ultrapassa o que já foi confirmado de verdade */
function atualizarOverlayProgresso(pct){
  const p=Math.max(0,Math.min(100,pct||0));
  if(p>overlayProgressoReal) overlayProgressoReal=p;
  if(p>overlayProgressoExibido){ overlayProgressoExibido=p; pintarOverlayProgresso(); }
}
function esconderOverlayVideoCarregando(){
  if(overlayProgressoTrickleTimer){ clearInterval(overlayProgressoTrickleTimer); overlayProgressoTrickleTimer=null; }
  const el=document.getElementById('overlayVideoCarregando');
  if(el){ const v=el.querySelector('video'); if(v){ try{v.pause();}catch(e){} } el.remove(); }
}
/* relatório de fechamento de todas as lojas - pedido do Felipe 19/08: incluir pedidos/unidades
   por loja, somatória geral, e lista dos produtos vendidos com quantidade. Vai ser visto no
   celular, então o layout é mobile-first (cards empilhados em vez de tabela larga fixa; tabela
   de produtos só tem 3 colunas estreitas, cabe numa tela de celular sem rolar pro lado).
   v (19/08, 2a revisão): não abre mais aba nova - escreve DIRETO na aba atual (win=window),
   substituindo o Doca pelo relatório nessa mesma aba (pedido do Felipe). */
function imprimirRelatorioFechamentoTodasLojas(resultados){
  const win=window;
  const porLoja=resultados.map(r=>{
    const unidades=(r.resumo.itensVendidos||[]).reduce((s,it)=>s+(it.qtd||0),0);
    const aliquotaLoja=finLoja(r.loja).aliquotaImposto||0;
    const produtos=(r.resumo.itensVendidos||[]).slice().sort((a,b)=>b.qtd-a.qtd).map(it=>{
      const p=state.produtos.find(x=>x.mlItemId===it.itemId);
      /* sinal verde de "dentro da meta de Ads" por produto - pedido do Felipe 20/08: mesma regra
         já usada no Resumo Financeiro (ver renderResumoFinanceiroResultado) - meta = 1/3 da
         Margem de Contribuição do produto no período. Só marca quando o produto teve Ads gasto
         de fato E a Margem de Contribuição é positiva. */
      const custoUnit=p&&p.custo?p.custo:0;
      const custoProdutoItem=custoUnit*(it.qtd||0);
      const impostoItem=(it.valor||0)*((aliquotaLoja||0)/100);
      const margemContribItem=(it.valor||0)-custoProdutoItem-(it.tarifa||0)-(it.freteMl||0)-impostoItem;
      const adsAchado=p?adsGastoAutoProduto(p,r.resumo):null;
      const dentroMetaAds=adsAchado!=null&&margemContribItem>0&&adsAchado<=margemContribItem/3;
      return {nome:(p&&p.sku)?p.sku:it.itemId,qtd:it.qtd||0,valor:it.valor||0,adsAchado,dentroMetaAds};
    });
    const gastoAds=r.resumo.ads&&r.resumo.ads.custo||0;
    const margemPosAds=r.m.margem-gastoAds;
    /* só no relatório de fechamento (não na tela de Finanças) - pedido do Felipe 19/08: mostrar
       as DUAS versões da Margem Líquida lado a lado. "custo total" é a mesma conta de sempre
       (r.m.margemLiquida - desconta a fatura ML pendente inteira, o ciclo acumulado até hoje).
       "rateada" divide essa fatura proporcional aos dias do período escolhido, útil quando o
       período é curto (ex: "Hoje") e não faz sentido comparar 1 dia de faturamento com o ciclo
       inteiro de custo acumulado. */
    const diasSel=diasNoPeriodoResumo(r.resumo.periodo.de,r.resumo.periodo.ate);
    const faturaMlRateada=(r.m.faturaMlAtual/diasNoMesAtual())*diasSel;
    const margemLiquidaRateada=r.m.margem-r.m.custosPeriodo-faturaMlRateada;
    return {loja:r.loja,pedidos:r.resumo.pedidosValidos||0,unidades,faturamento:r.resumo.faturamento,margem:r.m.margem,margemPosAds,gastoAds,margemLiquidaTotal:r.m.margemLiquida,margemLiquidaRateada,produtos,unidSemCusto:r.m.unidSemCusto||0};
  });
  const totalPedidos=porLoja.reduce((s,r)=>s+r.pedidos,0);
  const totalUnidades=porLoja.reduce((s,r)=>s+r.unidades,0);
  const totalFat=porLoja.reduce((s,r)=>s+r.faturamento,0);
  const totalMargem=porLoja.reduce((s,r)=>s+r.margem,0);
  const totalMargemPosAds=porLoja.reduce((s,r)=>s+r.margemPosAds,0);
  const totalGastoAds=porLoja.reduce((s,r)=>s+r.gastoAds,0);
  const totalMargemLiquidaTotal=porLoja.reduce((s,r)=>s+r.margemLiquidaTotal,0);
  const totalMargemLiquidaRateada=porLoja.reduce((s,r)=>s+r.margemLiquidaRateada,0);
  const rotulos={hoje:'Hoje','7d':'Últimos 7 dias','15d':'Últimos 15 dias','30d':'Últimos 30 dias',mes_corrente:'Mês corrente',personalizado:fmtData(financasResumoDe)+' a '+fmtData(financasResumoAte)};
  const rotuloPeriodo=rotulos[financasResumoPeriodo]||financasResumoPeriodo;
  const metrica=(lbl,val,neg,pctVal)=>`<div class="metric"><div class="lbl">${lbl}</div><div class="val${neg?' neg':''}">${val}</div>${pctVal!=null?`<div class="pctv">${pctVal.toFixed(1)}% do faturamento</div>`:''}</div>`;
  const pctDe=(v,fat)=>fat>0?(v/fat*100):0;
  const cardLoja=r=>`<div class="loja-card">
      <h2>${esc(r.loja)}</h2>
      <div class="metrics">
        ${metrica('Pedidos',fmtInt(r.pedidos))}
        ${metrica('Unidades vendidas',fmtInt(r.unidades))}
        ${metrica('Faturamento',fmtMoney(r.faturamento))}
        ${metrica('Margem Contribuição',fmtMoney(r.margem),r.margem<0,pctDe(r.margem,r.faturamento))}
        ${metrica('Margem pós Ads',fmtMoney(r.margemPosAds),r.margemPosAds<0,pctDe(r.margemPosAds,r.faturamento))}
        ${metrica('Gasto em Ads',fmtMoney(r.gastoAds),false,pctDe(r.gastoAds,r.faturamento))}
        ${metrica('Margem Líquida (rateada)',fmtMoney(r.margemLiquidaRateada),r.margemLiquidaRateada<0,pctDe(r.margemLiquidaRateada,r.faturamento))}
        ${metrica('Margem Líquida (custo total)',fmtMoney(r.margemLiquidaTotal),r.margemLiquidaTotal<0,pctDe(r.margemLiquidaTotal,r.faturamento))}
      </div>
      ${r.unidSemCusto>0?`<p class="vazio" style="color:var(--danger)">⚠ ${fmtInt(r.unidSemCusto)} unidade(s) vendida(s) sem custo cadastrado neste aparelho — a margem acima está inflada (entrando como custo R$ 0). Cadastre o custo em Produtos e gere o relatório de novo.</p>`:''}
      ${r.produtos.length?`<table><thead><tr><th>Produto</th><th class="n">Qtd</th><th class="n">Faturamento</th><th class="n">Ads</th></tr></thead><tbody>
        ${r.produtos.map(p=>`<tr><td>${esc(p.nome)}${p.dentroMetaAds?' <span style="color:var(--ok)">✓</span>':''}</td><td class="n">${fmtInt(p.qtd)}</td><td class="n">${fmtMoney(p.valor)}</td><td class="n">${p.adsAchado==null?'—':fmtMoney(p.adsAchado)}</td></tr>`).join('')}
      </tbody></table>`:`<p class="vazio">Nenhuma venda no período.</p>`}
    </div>`;
  win.document.open();
  win.document.write(`<!doctype html><html><head><meta charset="utf-8">

      html,body{margin:0}
      body{

          radial-gradient(900px 440px at 92% 2%,rgba(255,197,61,.06),transparent 60%), var(--bg);
        font-family:-apple-system,BlinkMacSystemFont,'Plus Jakarta Sans',Arial,Helvetica,sans-serif;
        padding:18px;color:var(--text);font-size:15px;max-width:720px;margin:0 auto;line-height:1.5}
      h1{font-size:19px;margin:0 0 4px;color:var(--text)}
      h2{font-size:14.5px;margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line);color:var(--gold);letter-spacing:.03em;text-transform:uppercase}
      .sub{color:var(--muted);font-size:12.5px;margin-bottom:18px}
      .loja-card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:var(--paper)}

      .metric .val.neg{color:var(--danger)}
      .metric .pctv{font-size:10.5px;color:var(--muted);margin-top:1px}
      .vazio{color:var(--muted);font-size:12.5px;margin:4px 0 0}
      table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}

}
/* CMV = soma de (custo cadastrado do produto × quantidade vendida no período), casando pelo
   mlItemId salvo em cada produto. Item vendido sem produto vinculado (ou sem custo cadastrado)
   entra em "semCusto" pra avisar que o CMV está subestimado, em vez de fingir que é zero. */
function calcularCmvResumo(resumo){
  let cmv=0,unidSemCusto=0;
  (resumo.itensVendidos||[]).forEach(it=>{
    const p=state.produtos.find(x=>x.mlItemId===it.itemId);
    if(p&&p.custo>0) cmv+=p.custo*it.qtd; else unidSemCusto+=it.qtd;
  });
  return {cmv,unidSemCusto};
}
/* despesas manuais (cadastradas em Finanças, exceto a fatura do ML — que entra separada, com o
   valor pendente atual) dessa loja com vencimento dentro do período do Resumo Financeiro — usadas
   como "custos do período" na Margem Líquida. */
function despesasPeriodoLoja(loja,de,ate){
  return despesasArr().filter(d=>d.loja===loja&&d.origem!=='ml_fatura'&&d.dataPagamento&&d.dataPagamento>=de&&d.dataPagamento<=ate);
}
/* margem de contribuição e margem líquida a partir de um resumo (do backend) - função separada
   pra ser reaproveitada tanto no Resumo Financeiro quanto no fechamento dos sócios. */
/* quantos dias tem o período [de,ate] (inclusive) e quantos dias já se passaram no mês de
   referência - usado só pra ratear a fatura ML pendente (ver calcularMargensResumo abaixo). */
function diasNoPeriodoResumo(de,ate){ return Math.max(1,Math.round((new Date(ate)-new Date(de))/864e5)+1); }
/* total de dias do mês corrente (28-31) - usado pra ratear a fatura ML pendente: valor da fatura
   ÷ dias do mês = valor por dia, vezes os dias do período escolhido - pedido do Felipe 19/08
   (antes dividia pelos dias já decorridos no mês, o que inflava o rateio conforme o mês avançava;
   dividir pelo total de dias do mês dá uma taxa diária estável, sempre a mesma independente do
   dia em que for consultado) */
function diasNoMesAtual(){ const d=new Date(); return new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); }
function calcularMargensResumo(resumo,loja){
  const {cmv,unidSemCusto}=calcularCmvResumo(resumo);
  const aliquota=finLoja(loja).aliquotaImposto||0;
  const impostoCalc=resumo.faturamento*(aliquota/100);
  // regra (corrigida): Ads NAO entra separado aqui - a fatura ML pendente (cadastrada em
  // Financas, origem "ml_fatura") ja' inclui o valor cobrado de Ads pelo Mercado Livre. Se
  // descontássemos Ads aqui E TAMBÉM a fatura ML pendente, o Ads seria descontado 2x (uma vez
  // direto, outra embutido na fatura). Por isso a Margem Líquida desconta direto da Margem de
  // Contribuição: despesas do período (despesasPeriodoLoja, que já exclui origem ml_fatura) e a
  // fatura ML pendente (que carrega o Ads dentro dela).
  const margem=resumo.faturamento-cmv-resumo.tarifas-impostoCalc-(resumo.frete.vendedor||0)-resumo.reembolsosValor;
  const custosPeriodo=despesasPeriodoLoja(loja,resumo.periodo.de,resumo.periodo.ate).reduce((s,d)=>s+(Number(d.valor)||0),0);
  const faturaMlAtual=faturaMlPendenteLoja(loja);
  const margemLiquida=margem-custosPeriodo-faturaMlAtual;
  return {cmv,unidSemCusto,aliquota,impostoCalc,margem,custosPeriodo,faturaMlAtual,margemLiquida};
}
/* monta os cartões de dedução + margem de contribuição a partir do resumo devolvido pelo backend.
   Frete pago pelo COMPRADOR não entra na margem (não sai do seu bolso) - só o frete VENDEDOR
   (o que você paga quando o anúncio tem frete grátis) é deduzido, igual o print de referência
   (Metrify) mostrava. Cancelamentos e reembolsos também são deduzidos - são vendas que geraram
   custo/trabalho mas não viraram receita de verdade. */
let resumoRankingAberto=new Set();
function renderResumoFinanceiroResultado(resumo,loja){
  const {cmv,unidSemCusto,aliquota,impostoCalc,margem,custosPeriodo,faturaMlAtual,margemLiquida}=calcularMargensResumo(resumo,loja);
  const margemPct=resumo.faturamento>0?(margem/resumo.faturamento*100):0;
  const margemPosAds=margem-resumo.ads.custo;
  const margemPosAdsPct=resumo.faturamento>0?(margemPosAds/resumo.faturamento*100):0;
  const margemLiquidaPct=resumo.faturamento>0?(margemLiquida/resumo.faturamento*100):0;
  /* Margem Líquida (rateada) - pedido do Felipe 19/08: mostrar junto da Margem Líquida "de custo
     total" (a de cima, que desconta a fatura ML pendente inteira). Essa aqui divide a fatura
     proporcional aos dias do período escolhido, pra não afundar o número quando o período é
     curto (ex: "Hoje") comparado ao ciclo inteiro de custo acumulado. */
  const diasSelResumo=diasNoPeriodoResumo(resumo.periodo.de,resumo.periodo.ate);
  const faturaMlRateadaResumo=(faturaMlAtual/diasNoMesAtual())*diasSelResumo;
  const margemLiquidaRateada=margem-custosPeriodo-faturaMlRateadaResumo;
  const margemLiquidaRateadaPct=resumo.faturamento>0?(margemLiquidaRateada/resumo.faturamento*100):0;
  const pct=v=>resumo.faturamento>0?(v/resumo.faturamento*100).toFixed(1)+'% do faturamento':'';
  const cartao=(titulo,valor,sub)=>`<div class="card" style="margin:0"><div class="muted" style="font-size:11px">${titulo}</div><b style="font-size:17px">${fmtMoney(valor)}</b>${sub?`<div class="hint" style="margin:2px 0 0;font-size:11px">${sub}</div>`:''}</div>`;
  /* badge ▲/▼ comparando com o período anterior equivalente (mesmo tanto de dias, logo antes) -
     verde quando melhora (ou piora um custo/despesa, se inverterBom=true), vermelho quando piora.
     null enquanto ainda não buscou ou não achou dado válido pra comparar (não mostra nada, não
     inventa 0% quando não sabe). */
  const comparAnt=financasResumoAnterior;
  const badge=(atual,anteriorValor,inverterBom)=>{
    if(financasResumoAnteriorCarregando) return ' <span class="muted" style="font-size:11px">(comparando com período anterior...)</span>';
    if(anteriorValor==null||!comparAnt) return '';
    if(anteriorValor===0) return atual>0?' <span class="okv" style="font-size:11px">▲ novo (era R$ 0,00 no período anterior)</span>':'';
    const variacao=(atual-anteriorValor)/Math.abs(anteriorValor)*100;
    const melhorou=inverterBom?variacao<0:variacao>0;
    const seta=variacao>=0?'▲':'▼';
    return ` <span class="${melhorou?'okv':'pend'}" style="font-size:11px" title="Período anterior (${fmtData(comparAnt.periodo.de)} a ${fmtData(comparAnt.periodo.ate)}): ${fmtMoney(anteriorValor)}">${seta} ${Math.abs(variacao).toFixed(1)}% vs. período anterior</span>`;
  };
  const margensAnt=comparAnt?calcularMargensResumo(comparAnt,loja):null;
  const itensOrdenados=(resumo.itensVendidos||[]).slice().sort((a,b)=>b.qtd-a.qtd);
  const unidadesVendidas=itensOrdenados.reduce((s,it)=>s+it.qtd,0);
  return `
    <p class="hint" style="margin:14px 0 8px">Período: ${fmtData(resumo.periodo.de)} a ${fmtData(resumo.periodo.ate)} · ${fmtInt(resumo.pedidosValidos)} pedido(s) válido(s) · ${fmtInt(unidadesVendidas)} unidade(s) vendida(s)${resumo.pedidosCancelados?' · '+fmtInt(resumo.pedidosCancelados)+' cancelado(s)':''}</p>
    <div class="form-grid" style="grid-template-columns:repeat(3,1fr);gap:10px">
      ${cartao('FATURAMENTO',resumo.faturamento,(resumo.cancelamentosValor?'bruto (com cancelados): '+fmtMoney(resumo.faturamento+resumo.cancelamentosValor):'')+badge(resumo.faturamento,comparAnt?comparAnt.faturamento:null,false))}
      ${cartao('CUSTOS (CMV)',cmv,unidSemCusto?fmtInt(unidSemCusto)+' unid. sem custo cadastrado — CMV subestimado':pct(cmv))}
      ${cartao('TARIFAS (COMISSÃO)',resumo.tarifas,pct(resumo.tarifas))}
      ${cartao('IMPOSTOS ('+(aliquota||0)+'%)',impostoCalc,aliquota?pct(impostoCalc):'alíquota não configurada')}
      ${cartao('ADS',resumo.ads.custo,pct(resumo.ads.custo))}
      ${cartao('FRETE (VENDEDOR)',resumo.frete.vendedor,pct(resumo.frete.vendedor))}
      ${cartao('FRETE (COMPRADOR)',resumo.frete.comprador,'pago pelo cliente, não entra na margem')}
      ${cartao('CANCELAMENTOS',resumo.cancelamentosValor,pct(resumo.cancelamentosValor))}
      ${cartao('REEMBOLSOS',resumo.reembolsosValor,pct(resumo.reembolsosValor))}
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px">
      <div class="card" style="margin:0">
        <div class="muted" style="font-size:11px">MARGEM DE CONTRIBUIÇÃO</div>
        <b style="font-size:22px" class="${margem>=0?'okv':'pend'}">${fmtMoney(margem)}</b>
        <div class="hint" style="margin:2px 0 0">${margemPct.toFixed(1)}% do faturamento${badge(margem,margensAnt?margensAnt.margem:null,false)}</div>
        <div class="hint" style="margin:2px 0 0" title="Margem de Contribuição menos o gasto de Ads do período - só informativo, não desconta de novo na Margem Líquida (que já desconta via fatura ML pendente)">Margem pós Ads: <b class="${margemPosAds>=0?'okv':'pend'}">${fmtMoney(margemPosAds)}</b> (${margemPosAdsPct.toFixed(1)}% do faturamento)</div>
      </div>
      <div class="card" style="margin:0">
        <div class="muted" style="font-size:11px">MARGEM LÍQUIDA (RATEADA)</div>
        <b style="font-size:22px" class="${margemLiquidaRateada>=0?'okv':'pend'}">${fmtMoney(margemLiquidaRateada)}</b>
        <div class="hint" style="margin:2px 0 0" title="Fatura ML pendente (${fmtMoney(faturaMlAtual)} acumulado no ciclo até hoje) ÷ ${diasNoMesAtual()} dias do mês × ${diasSelResumo} dia(s) do período = ${fmtMoney(faturaMlRateadaResumo)} descontada aqui, em vez do valor cheio">${margemLiquidaRateadaPct.toFixed(1)}% do faturamento · fatura ML rateada: ${fmtMoney(faturaMlRateadaResumo)}</div>
      </div>
      <div class="card" style="margin:0">
        <div class="muted" style="font-size:11px">MARGEM LÍQUIDA</div>
        <b style="font-size:22px" class="${margemLiquida>=0?'okv':'pend'}">${fmtMoney(margemLiquida)}</b>
        <div class="hint" style="margin:2px 0 0">${margemLiquidaPct.toFixed(1)}% do faturamento${badge(margemLiquida,margensAnt?margensAnt.margemLiquida:null,false)}</div>
      </div>
    </div>
    <div class="form-grid" style="grid-template-columns:${financasResumoPeriodo==='hoje'?'1fr':'1fr 1fr'};gap:10px;margin-top:12px">
      <div class="card" style="margin:0">
        <div class="muted" style="font-size:11px">VENDAS DO PERÍODO</div>
        <b style="font-size:18px">${fmtInt(resumo.pedidosValidos)} pedido(s) · ${fmtInt(unidadesVendidas)} unidade(s) · ${fmtMoney(resumo.faturamento)}</b>
      </div>
      ${financasResumoPeriodo==='hoje'?'':`<div class="card" style="margin:0">
        <div class="muted" style="font-size:11px">VENDAS DE HOJE</div>
        <b style="font-size:18px">${fmtInt(resumo.vendasHoje.pedidos)} pedido(s) · ${fmtInt(resumo.vendasHoje.unidades||0)} unidade(s) · ${fmtMoney(resumo.vendasHoje.faturamento)}</b>
      </div>`}
    </div>
    <div class="card" style="margin-top:12px">
      <h3 style="margin-top:0">🏆 Ranking de produtos vendidos no período</h3>
      ${itensOrdenados.length?`<div class="table-wrap"><table class="tbl-produtos"><thead><tr><th style="width:40px">#</th><th>Produto</th><th class="num">Unid.</th><th class="num">Faturamento</th><th class="num">M. Contribuição</th><th class="num">Ads</th><th class="num">M. Líquida</th><th></th></tr></thead><tbody>
        ${itensOrdenados.map((it,i)=>{
          const p=state.produtos.find(x=>x.mlItemId===it.itemId);
          const nome=p&&p.sku?esc(p.sku):`<span class="muted">${esc(it.itemId)} (sem SKU vinculado)</span>`;
          const custoUnit=p&&p.custo?p.custo:0;
          const custoProdutoItem=custoUnit*it.qtd;
          const impostoItem=it.valor*((aliquota||0)/100);
          const margemContribItem=it.valor-custoProdutoItem-(it.tarifa||0)-(it.freteMl||0)-impostoItem;
          const adsAchado=p?adsGastoAutoProduto(p,resumo):null;
          const adsItem=adsAchado||0;
          const margemLiquidaItem=margemContribItem-adsItem;
          /* tag de "dentro da meta de TACOS" ao lado do Ads gasto - pedido do Felipe 18/08: meta
             = 1/3 do faturamento do produto no período. So mostra quando ha Ads gasto de fato. */
          const dentroMetaTacosItem=adsAchado!=null&&margemContribItem>0&&adsAchado<=margemContribItem/3;
          const pctAds=it.valor&&adsAchado!=null?(adsAchado/it.valor*100):0;
          const adsCel=adsAchado==null?'<span class="muted" title="Nenhuma campanha/anúncio de Ads encontrado pra esse produto no período">—</span>':`${fmtMoney(adsAchado)} <span class="muted" style="font-size:11px">(${pctAds.toFixed(1)}%)</span>${dentroMetaTacosItem?` <span class="okv" style="font-size:11px;font-weight:700" title="Ads dentro da meta de TACOS (1/3 da Margem de Contribuição: ${fmtMoney(margemContribItem/3)})">✓</span>`:''}`;
          const aberto=resumoRankingAberto.has(String(it.itemId));
          const pctMC=it.valor?(margemContribItem/it.valor*100):0;
          const pctML=it.valor?(margemLiquidaItem/it.valor*100):0;
          return `<tr><td class="muted">${i+1}º</td><td>${nome}</td><td class="num"><b>${fmtInt(it.qtd)}</b></td><td class="num">${fmtMoney(it.valor)}</td><td class="num">${fmtMoney(margemContribItem)} <span class="muted" style="font-size:11px">(${pctMC.toFixed(1)}%)</span></td><td class="num">${adsCel}</td><td class="num"><b class="${margemLiquidaItem>=0?'okv':'pend'}">${fmtMoney(margemLiquidaItem)}</b> <span class="muted" style="font-size:11px">(${pctML.toFixed(1)}%)</span></td><td><button class="btn sm" data-rankver="${esc(it.itemId)}">${aberto?'▲':'▼'}</button></td></tr>
          ${aberto?`<tr><td colspan="8">
            <div class="form-grid" style="grid-template-columns:repeat(4,1fr);gap:8px 16px;margin:6px 0 10px">
              <div><span class="muted" style="font-size:11px">Faturamento</span><br>${fmtMoney(it.valor)}</div>
              <div><span class="muted" style="font-size:11px">Custo do produto${p&&p.custo?' ('+fmtMoney(custoUnit)+'/un. × '+fmtInt(it.qtd)+')':' (sem custo cadastrado em Produtos)'}</span><br>− ${fmtMoney(custoProdutoItem)}</div>
              <div><span class="muted" style="font-size:11px">Tarifa (comissão ML, % da categoria)</span><br>− ${fmtMoney(it.tarifa||0)}</div>
              <div><span class="muted" style="font-size:11px">Frete (vendedor, rateado por peso)</span><br>− ${fmtMoney(it.freteMl||0)}</div>
              <div><span class="muted" style="font-size:11px">Imposto (${aliquota||0}% do faturamento)</span><br>− ${fmtMoney(impostoItem)}</div>
              <div><span class="muted" style="font-size:11px">= Margem de Contribuição</span><br><b>${fmtMoney(margemContribItem)}</b> <span class="muted" style="font-size:11px">(${pctMC.toFixed(1)}%)</span></div>
              <div><span class="muted" style="font-size:11px">Ads (não entra na M. Contribuição)</span><br>${adsAchado==null?'não encontrado':'− '+fmtMoney(adsAchado)+' '}${adsAchado!=null?`<span class="muted" style="font-size:11px">(${pctAds.toFixed(1)}%)</span>`:''}</div>
              <div><span class="muted" style="font-size:11px">= Margem Líquida</span><br><b class="${margemLiquidaItem>=0?'okv':'pend'}">${fmtMoney(margemLiquidaItem)}</b> <span class="muted" style="font-size:11px">(${pctML.toFixed(1)}%)</span></div>
            </div>
          </td></tr>`:''}`;
        }).join('')}
      </tbody></table></div>`:'<p class="empty-inline">Nenhuma venda com item identificado nesse período.</p>'}
    </div>
  `;
}
/* ---- Retiradas e Reembolsos (TorvStore): cartão independente, sempre visível (não depende de
   ter pesquisado um período no Resumo Financeiro acima) — mesma lógica de "sempre aparece" da
   tabela de despesas, usando o mesmo mês selecionado em financasFiltroMes. O fechamento (margem
   líquida do mês) é calculado sob demanda, com uma busca própria à API do Mercado Livre pro mês
   inteiro. */
let sociosFechamento=null;
let novoSocioData='';
let novaDespesaData='';
let novoPagAmauriData='';
let sociosFechamentoMes=null;
let sociosFechamentoCarregando=false;
let sociosFechamentoErro=null;
let sociosFechamentoProgresso=null; // {feito,total,etapa}
async function calcularFechamentoSocios(){
  sociosFechamentoCarregando=true; sociosFechamentoErro=null; sociosFechamentoProgresso=null; renderFinancas();
  try{
    const mes=financasFiltroMes;
    const [ano,mm]=mes.split('-').map(Number);
    const de=`${mes}-01`;
    const ate=`${mes}-${String(new Date(ano,mm,0).getDate()).padStart(2,'0')}`;
    const resumo=await fetchResumoJob('TorvStore','personalizado',de,ate,(p)=>{ sociosFechamentoProgresso=p; renderFinancas(); });
    sociosFechamento=resumo;
    sociosFechamentoMes=mes;
  }catch(e){ sociosFechamentoErro=e.message; }
  finally{ sociosFechamentoCarregando=false; sociosFechamentoProgresso=null; renderFinancas(); }
}
function renderSociosCard(){
  const loja='TorvStore';
  const mes=financasFiltroMes;
  const listaFelipe=movimentosSocioMes(loja,'felipe',mes);
  const listaThiago=movimentosSocioMes(loja,'thiago',mes);
  const retiradaFelipe=totalPorTipo(listaFelipe,'retirada'), reembolsoFelipe=totalPorTipo(listaFelipe,'reembolso');
  const retiradaThiago=totalPorTipo(listaThiago,'retirada'), reembolsoThiago=totalPorTipo(listaThiago,'reembolso');
  const tagTipo=t=>t==='reembolso'?'<span class="badge okv">Reembolso</span>':'<span class="badge">Retirada</span>';
  const listaSocio=(socio,lista)=>lista.length?`<table class="tbl-produtos" style="margin-top:6px"><tbody>
      ${lista.map(x=>`<tr><td>${tagTipo(x.tipo)}</td><td>${esc(x.descricao)||'<span class="muted">—</span>'}</td><td class="muted">${fmtData(x.data)}</td><td class="num">${fmtMoney(x.valor)}</td><td style="white-space:nowrap"><button class="btn sm" data-editsocio="${socio}|${x.id}">Editar</button> <button class="btn sm danger-outline" data-remsocio="${socio}|${x.id}">✕</button></td></tr>`).join('')}
    </tbody></table>`:`<p class="empty-inline">Nada lançado em ${esc(mesLabel(mes))}.</p>`;
  const linhaAjuste=(nome,ajuste)=>ajuste>0.004
    ?`<span class="okv">Pagamento de <b>${fmtMoney(ajuste)}</b> pra ${nome}</span>`
    :(ajuste<-0.004?`<span class="pend">${nome} devolve <b>${fmtMoney(-ajuste)}</b></span>`:'<span class="muted">Já equilibrado</span>');
  let fechamentoHtml;
  if(sociosFechamentoCarregando){
    fechamentoHtml=sociosFechamentoProgresso&&sociosFechamentoProgresso.total?barraProgresso(sociosFechamentoProgresso.feito,sociosFechamentoProgresso.total,'📊 '+(sociosFechamentoProgresso.etapa||'Calculando fechamento de sócios...')):barraIndeterminada('📊 Calculando fechamento de sócios...');
  }else if(sociosFechamentoErro){
    fechamentoHtml=`<p class="hint" style="color:#e66;margin-top:10px">⚠ ${esc(sociosFechamentoErro)}</p>`;
  }else if(sociosFechamento&&sociosFechamentoMes===mes){
    const m=calcularMargensResumo(sociosFechamento,loja);
    const cadaCota=m.margemLiquida/2;
    /* cota − retiradas (já tirou da empresa) + reembolsos (pagou do bolso, empresa deve devolver) */
    const ajusteFelipe=cadaCota-retiradaFelipe+reembolsoFelipe;
    const ajusteThiago=cadaCota-retiradaThiago+reembolsoThiago;
    fechamentoHtml=`<div class="card" style="margin-top:14px">
        <div class="muted" style="font-size:11px">FECHAMENTO DE ${esc(mesLabel(mes)).toUpperCase()} — CADA SÓCIO TEM DIREITO A</div>
        <b style="font-size:18px">${fmtMoney(cadaCota)}</b>
        <div class="hint" style="margin:4px 0 10px">50% da margem líquida (${fmtMoney(m.margemLiquida)}) do mês.</div>
        <div class="form-grid" style="grid-template-columns:1fr 1fr">
          <div>Felipe: retirou <b>${fmtMoney(retiradaFelipe)}</b>${reembolsoFelipe?`, reembolso de <b>${fmtMoney(reembolsoFelipe)}</b>`:''}<br>${linhaAjuste('Felipe',ajusteFelipe)}</div>
          <div>Thiago: retirou <b>${fmtMoney(retiradaThiago)}</b>${reembolsoThiago?`, reembolso de <b>${fmtMoney(reembolsoThiago)}</b>`:''}<br>${linhaAjuste('Thiago',ajusteThiago)}</div>
        </div>
      </div>`;
  }else{
    fechamentoHtml=`<p class="hint" style="margin-top:10px">Clique em "Calcular fechamento" pra ver a margem líquida de ${esc(mesLabel(mes))} e quanto cada um recebe ou devolve.</p>`;
  }

/* ================= Amauri: fechamento dos produtos em parceria (TorvStore) =================
   3 produtos da TorvStore têm sociedade com o Amauri. Cada produto tem seus próprios custos
   (frete, embalagem, etiqueta e ads — editáveis, guardados por produto) e um percentual de
   repasse (padrão 50%). Pra cada período escolhido: puxa unidades vendidas/faturamento de cada
   produto marcado (via /financas/resumo, igual o Resumo Financeiro), calcula a margem líquida
   de cada um (faturamento − CMV − frete − embalagem − etiqueta − ads − imposto) e o repasse
   devido a ele, e soma tudo no final. Um log de pagamentos já feitos permite acompanhar quanto
   ainda falta pagar. */
function amauriState(){
  if(!state.amauri||typeof state.amauri!=='object') state.amauri={};
  if(!Array.isArray(state.amauri.produtoIds)) state.amauri.produtoIds=[];
  if(!state.amauri.custos||typeof state.amauri.custos!=='object') state.amauri.custos={};
  if(!Array.isArray(state.amauri.pagamentos)) state.amauri.pagamentos=[];
  if(typeof state.amauri.aliquotaImposto!=='number') state.amauri.aliquotaImposto=Number(state.amauri.aliquotaImposto)||0;
  return state.amauri;
}
/* cada custo tem um valor E um "quem pagou" (torvstore ou amauri) - só o custo do produto não
   tem valor editável aqui: ele é puxado direto do custo unitário cadastrado em Produtos (sempre
   o valor mais atual de lá, não uma cópia que fica desatualizada) - só o "quem paga" desse custo
   fica editável na Amauri. Os outros nascem como pagos pela loja; é só o padrão inicial, dá pra
   trocar em cada produto. */
function amauriCustos(produtoId){
  const a=amauriState();
  const p=prodById(produtoId);
  if(!a.custos[produtoId]||typeof a.custos[produtoId]!=='object'){
    a.custos[produtoId]={custoProdutoQuemPagou:'amauri',coleta:0,coletaQuemPagou:'torvstore',embalagem:0,embalagemQuemPagou:'torvstore',etiqueta:0,etiquetaQuemPagou:'torvstore',ads:0,adsQuemPagou:'torvstore',percentual:50};
  }
  const c=a.custos[produtoId];
  delete c.custoProduto;
  /* "frete" era o nome antigo desse campo (virou "coleta") - migra o que já tinha sido lançado
     em vez de perder o valor. */
  if(c.frete!=null&&c.coleta==null){ c.coleta=c.frete; c.coletaQuemPagou=c.freteQuemPagou||'torvstore'; }
  delete c.frete; delete c.freteQuemPagou;
  if(!c.custoProdutoQuemPagou) c.custoProdutoQuemPagou='amauri';
  if(c.coleta==null) c.coleta=0; if(!c.coletaQuemPagou) c.coletaQuemPagou='torvstore';
  if(c.embalagem==null) c.embalagem=0; if(!c.embalagemQuemPagou) c.embalagemQuemPagou='torvstore';
  if(c.etiqueta==null) c.etiqueta=0; if(!c.etiquetaQuemPagou) c.etiquetaQuemPagou='torvstore';
  if(c.ads==null) c.ads=0; if(!c.adsQuemPagou) c.adsQuemPagou='torvstore';
  if(c.percentual==null) c.percentual=50;
  return c;
}
function amauriProdutosMarcados(){

}

/* aqui não tem preset de período (hoje/7d/15d/30d/mês corrente) - é sempre preenchido na mão,
   com as duas datas. */
let amauriResumoPeriodo='personalizado', amauriResumoDe='', amauriResumoAte='';
let amauriResumoResultado=null, amauriResumoCarregando=false, amauriResumoErro=null;
let amauriCustosAberto=new Set();
let amauriSubAba='periodo'; // 'produtos' | 'periodo' - sub-abas dentro de Amauri (periodo primeiro)
let amauriResumoProgresso=null; // {feito,total,etapa}
async function pesquisarResumoAmauri(){
  if(!amauriResumoDe||!amauriResumoAte) return;
  amauriResumoCarregando=true; amauriResumoErro=null; amauriResumoProgresso=null; renderAmauri();
  try{
    if(amauriResumoPeriodo==='personalizado'&&(!amauriResumoDe||!amauriResumoAte)) throw new Error('Informe as duas datas do período personalizado.');
    const resumo=await fetchResumoJob('TorvStore',amauriResumoPeriodo,amauriResumoDe,amauriResumoAte,(p)=>{ amauriResumoProgresso=p; renderAmauri(); });
    amauriResumoResultado=resumo;
    autoPreencherAdsAmauri();
  }catch(e){ amauriResumoErro=e.message; }
  finally{ amauriResumoCarregando=false; amauriResumoProgresso=null; renderAmauri(); }
}
/* linha de cálculo de um produto: casa pelo mlItemId (igual o Resumo Financeiro), usando valor e
   pedidos por item que o backend manda desde a v56 (antes só mandava a quantidade).
   A margem líquida desconta TODOS os custos (não importa quem pagou) - é o lucro real do
   produto. Só depois disso é que entra a questão de quem adiantou o dinheiro: qualquer custo
   marcado como "pago pelo Amauri" vira reembolso (some da margem líquida mas o valor volta pra
   ele por fora, além da fatia percentual), porque esse dinheiro já saiu do bolso dele, não do
   caixa compartilhado. */
function calcularLinhaAmauriProduto(p,resumo){
  const c=amauriCustos(p.id);
  const it=(resumo.itensVendidos||[]).find(x=>x.itemId===p.mlItemId);
  const qtd=it?(it.qtd||0):0;
  const faturamento=it?(it.valor||0):0;
  const vendasConcluidas=it?(it.pedidos||0):0;
  const qtdCancelada=it?(it.qtdCancelada||0):0;
  const pedidosCancelados=it?(it.pedidosCancelados||0):0;
  const tarifaMlTotal=it?(it.tarifa||0):0;
  /* frete que o Mercado Livre encara como frete (o frete grátis que sai do seu bolso) - vem do
     backend já rateado por item quando o envio tinha mais de 1 produto. É diferente da "coleta"
     abaixo, que é um custo seu (levar a mercadoria até o ponto de despacho, por exemplo). */
  const freteMlTotal=it?(it.freteMl||0):0;
  const custoProdutoTotal=(p.custo||0)*qtd;
  const coletaTotal=(c.coleta||0)*qtd;
  const embalagemTotal=(c.embalagem||0)*qtd;
  const etiquetaTotal=(c.etiqueta||0)*qtd;
  const adsTotal=c.ads||0;
  const aliquota=amauriState().aliquotaImposto||0;
  const impostoCalc=faturamento*(aliquota/100);
  const margemLiquida=faturamento-tarifaMlTotal-freteMlTotal-custoProdutoTotal-coletaTotal-embalagemTotal-etiquetaTotal-adsTotal-impostoCalc;
  const percentual=c.percentual!=null?c.percentual:50;
  const repasseMargem=margemLiquida*(percentual/100);
  const itensCusto=[
    {rotulo:'Custo do produto',valor:custoProdutoTotal,quemPagou:c.custoProdutoQuemPagou},
    {rotulo:'Coleta',valor:coletaTotal,quemPagou:c.coletaQuemPagou},
    {rotulo:'Embalagem',valor:embalagemTotal,quemPagou:c.embalagemQuemPagou},
    {rotulo:'Etiqueta',valor:etiquetaTotal,quemPagou:c.etiquetaQuemPagou},
    {rotulo:'Ads',valor:adsTotal,quemPagou:c.adsQuemPagou}
  ];
  const reembolsoAmauri=itensCusto.filter(x=>x.quemPagou==='amauri').reduce((s,x)=>s+x.valor,0);
  const repasseTotal=repasseMargem+reembolsoAmauri;
  return {p,c,qtd,faturamento,vendasConcluidas,qtdCancelada,pedidosCancelados,tarifaMlTotal,freteMlTotal,custoProdutoTotal,coletaTotal,embalagemTotal,etiquetaTotal,adsTotal,aliquota,impostoCalc,margemLiquida,percentual,repasseMargem,reembolsoAmauri,repasseTotal};
}
/* tenta achar sozinho quanto foi gasto de ads com esse produto EXATAMENTE no período calculado,
   casando o SKU com o nome da campanha. Usa resumo.ads.campanhas, que o backend busca com o MESMO
   de/ate do fechamento (o mesmo endpoint que alimenta o painel de Publicidade do Mercado Livre
   quando você escolhe um intervalo personalizado por lá) - nada de aproximar por janela fixa de
   7/15/30 dias. Devolve null quando não consegue achar (backend antigo sem esse dado, ou nenhuma
   campanha com o SKU no nome) - nesse caso o campo continua editável na mão. */
/* tira acento, espaço, hífen, underline etc e deixa maiúsculo - usado so' no fallback por nome
   (quando o backend antigo nao mandou o gasto por item_id ainda) */
function normalizarParaMatch(s){
  return String(s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase()
    .replace(/[^A-Z0-9]/g,'');
}
/* v78: acha o gasto de Ads do produto casando pelo item_id do Mercado Livre (resumo.ads.itens,
   devolvido pelo backend a partir do endpoint que lista TODOS os anuncios do advertiser com custo
   ja calculado por item) - exato, nao depende do nome da campanha ter o SKU dentro (ex.: a
   campanha podia se chamar "ALHO VALECOM" pro produto Amassadoralho, e o casamento por texto nunca
   ia achar isso). So cai pro casamento por nome de campanha (mais fragil) se o backend for uma
   versao antiga que ainda nao manda resumo.ads.itens. */
function adsGastoAutoProduto(p,resumo){
  const itens=(resumo&&resumo.ads&&resumo.ads.itens)||[];
  if(itens.length){
    if(!p.mlItemId) return null;
    const achado=itens.find(it=>it.itemId===p.mlItemId);
    return achado?(achado.cost||0):null;
  }
  if(!p.sku) return null;
  const campanhas=(resumo&&resumo.ads&&resumo.ads.campanhas)||[];
  if(!campanhas.length) return null;
  const skuNorm=normalizarParaMatch(p.sku);
  if(!skuNorm) return null;
  const camp=campanhas.find(cc=>normalizarParaMatch(cc.name).includes(skuNorm));
  return camp?(camp.cost||0):null;
}
/* preenche o custo de ads sozinho, disparado toda vez que o período é calculado (sem precisar de
   botão à parte) - silencioso quando não acha nada (fica só o valor manual de antes), só avisa com
   um toast discreto quando consegue achar pra pelo menos 1 produto. */
function autoPreencherAdsAmauri(){
  const marcados=amauriProdutosMarcados();
  if(!marcados.length||!amauriResumoResultado) return;
  let achados=0;
  marcados.forEach(p=>{
    const v=adsGastoAutoProduto(p,amauriResumoResultado);
    if(v!=null){ amauriCustos(p.id).ads=v; achados++; }
  });
  if(achados){ persist(); toast(`Ads puxado automático (período exato) pra ${achados} produto(s).`); }
}
/* Os campos de custo/quem-paga/percentual só gravam no estado quando o campo perde o foco
   (onchange) - igual todo campo de valor no Doca. Só que "Calcular", trocar o período e "Puxar
   ads automático" redesenham a aba na hora, e se o cursor ainda estivesse num campo de custo sem
   ter saído dele (sem clicar fora/apertar Tab), a edição se perdia - a margem líquida parecia não
   descontar os custos porque o valor digitado nunca tinha sido salvo. Por isso, antes de qualquer
   uma dessas ações, "força" a leitura de tudo que estiver na tela pro estado, mesmo sem o campo ter
   perdido o foco. */
function salvarCustosAmauriPendentes(){
  const el=document.getElementById('tab-amauri'); if(!el) return;
  el.querySelectorAll('[data-amauricusto]').forEach(inp=>{
    const [produtoId,campo]=inp.dataset.amauricusto.split('|');
    amauriCustos(produtoId)[campo]=parseMoeda(inp.value);
  });
  el.querySelectorAll('[data-amauriquem]').forEach(sel=>{
    const [produtoId,campo]=sel.dataset.amauriquem.split('|');
    amauriCustos(produtoId)[campo]=sel.value;
  });
  el.querySelectorAll('[data-amauripct]').forEach(inp=>{
    amauriCustos(inp.dataset.amauripct).percentual=Number(inp.value)||0;
  });
}
function commitCustosAmauri(){
  snapshot('custos da parceria com Amauri');
  salvarCustosAmauriPendentes();
  persist();
}
