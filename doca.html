/* Reavalia os envios deste SKU: pendências de compra que agora já estão cobertas
   pelo estoque a coletar deixam de ser ordem de compra e viram reserva. */
function reconciliarProduto(p){
  let movido=0;
  enviosOrdenados().forEach(e=>e.itens.forEach(i=>{
    if(i.produtoId!==p.id) return;
    /* 1) pendência coberta pelo que já está no galpão → vira reserva etiquetada */
    let c=Math.min(i.geradoCompra||0, p.qtd.local);
    if(c>0){ i.geradoCompra-=c; i.alocado+=c; p.qtd.local-=c; movido+=c; }
    /* 2) pendência coberta pelo que já foi comprado e está por coletar */
    c=Math.min(i.geradoCompra||0, coletarLivre(p));
    if(c>0){ i.geradoCompra-=c; i.reservadoColeta=(i.reservadoColeta||0)+c; movido+=c; }
  }));
  return movido;
}
/* garante que nenhum envio fique "falta comprar" havendo estoque livre daquele SKU */
/* CUSTO AUTOMÁTICO DE KIT (pedido do Felipe 01/09): o custo de um kit é sempre a soma do custo
   de cada componente x a quantidade dele por unidade do kit - não faz sentido digitar isso na
   mão, porque desatualiza sozinho toda vez que o custo de um componente muda. Escreve direto no
   p.custo do kit pra que TUDO que já lê custo (margem, CMV, fechamento, relatórios) pegue o
   valor certo sem precisar mudar cada tela.
   Isso NÃO duplica valor de estoque: o kit nunca tem estoque próprio (fica sempre 0 de
   propósito, ver kitVirtualQtd), então no valor de estoque ele multiplica por zero - quem
   valoriza o estoque são os componentes, com o custo deles.
   Suporta kit feito de kit (recursivo) e ignora referência circular (vistos) pra não travar. */
function custoKitCalculado(p,vistos){
  const comps=componentesDe(p);
  if(!comps.length) return null;
  vistos=vistos||new Set();
  if(vistos.has(p.id)) return null; /* kit que se referencia em círculo - não dá pra somar */
  vistos.add(p.id);
  let total=0;
  for(const c of comps){
    const comp=prodById(c.produtoId);
    if(!comp) return null; /* componente sumiu - melhor não inventar um custo pela metade */
    const sub=custoKitCalculado(comp,vistos);
    /* componente que TAMBÉM é kit mas não deu pra calcular (círculo, componente faltando) não
       pode virar 0 disfarçado - nesse caso desiste e deixa o custo atual como está. */
    if(sub===null&&componentesDe(comp).length) return null;
    const unit=sub!==null?sub:(Number(comp.custo)||0);
    total+=unit*(Number(c.qtdPorUnidade)||1);
  }
  return Math.round(total*100)/100;
}
function atualizarCustosDeKits(){
  state.produtos.forEach(p=>{
    if(!componentesDe(p).length) return;
    const calc=custoKitCalculado(p);
    if(calc===null) return;
    if(Number(p.custo||0)!==calc) p.custo=calc;
  });
}
function reconciliarTudo(){ let t=0; state.produtos.forEach(p=>{ t+=reconciliarProduto(p); }); atualizarCustosDeKits(); return t; }
function ajustarEstoque(id,novos){
  const p=prodById(id); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  const rc=reservadoColetaDe(p);
  const nc=parseInt(novos.coletar);
  if(!isNaN(nc)&&nc<rc) return {ok:false,msg:`Coletar não pode ficar abaixo de ${fmtInt(rc)} — essa quantidade já está reservada para envios FULL. Remova do envio antes de reduzir.`};
  /* o número informado é o TOTAL contado no galpão (livre + o que já está etiquetado) */
  /* o número informado é só a parte LIVRE (solta no galpão) - o que já está etiquetado/
     reservado para envios FULL fica de fora dessa contagem e não é alterado aqui. Antes o
     campo pedia o TOTAL (livre + etiquetado) e travava se desse menos que o etiquetado, o que
     obrigava a pessoa a somar de cabeça o que já estava separado/embalado pro FULL - na
     prática, quem faz a contagem física não recontava essas caixas já preparadas. */
  const livre=parseInt(novos.local);
  const etiquetado=reservadoLocalDe(p);
  if(!isNaN(livre)&&livre<0) return {ok:false,msg:'Informe uma quantidade válida.'};
  snapshot('ajuste manual de estoque ('+p.sku+')');
  if(!isNaN(livre)) p.qtd.local=livre;
  const ncp=parseInt(novos.comprar); if(!isNaN(ncp)&&ncp>=0) ajustarComprarPorPedidos(p,ncp);
  if(!isNaN(nc)&&nc>=0) ajustarColetarPorLotes(p,nc);
  p.atualizadoEm=Date.now();
  const rec=reconciliarProduto(p);
  persist();
  return {ok:true,reconciliado:rec};
}
/* ---------- listas de tarefas (auxiliares únicos — o resto de listas/tarefas/subtarefas
   está definido junto com a tela, mais abaixo, num só lugar) ---------- */
function tarefaById(id){ return state.tarefas.find(t=>t.id===id); }
/* leva a tarefa para outra lista, mantendo ela no topo da lista de destino */
function moverTarefaParaLista(tarefaId,listaId){
  const t=state.tarefas.find(x=>x.id===tarefaId); if(!t) return {ok:false};
  const l=state.listas.find(x=>x.id===listaId); if(!l) return {ok:false};
  if(t.listaId===listaId) return {ok:false,mesma:true};
  const nomeAntigo=(state.listas.find(x=>x.id===t.listaId)||{}).nome||'';
  snapshot('mover tarefa para '+l.nome);
  const i=state.tarefas.indexOf(t);
  state.tarefas.splice(i,1);
  t.listaId=listaId;
  const prim=state.tarefas.findIndex(x=>x.listaId===listaId);
  if(prim<0) state.tarefas.push(t); else state.tarefas.splice(prim,0,t);
  persist();
  return {ok:true,tarefa:t,de:nomeAntigo,para:l.nome};
}
/* reordena as listas arrastando os chips */
function reordenarListas(id,paraId){
  if(id===paraId) return false;
  const de=state.listas.findIndex(l=>l.id===id), para=state.listas.findIndex(l=>l.id===paraId);
  if(de<0||para<0) return false;
  snapshot('reordenação das listas');
  const [l]=state.listas.splice(de,1);
  state.listas.splice(para,0,l);
  persist();
  return true;
}
/* ---------- envios FULL ---------- */
function criarEnvio(nome,data,loja,arquivo,localColeta){
  const e={id:gerarId('e'),nome,data,loja,arquivo:arquivo||'',localColeta:localColeta||LOCAIS_COLETA[0],itens:[],criadoEm:Date.now()};

function editarEnvio(id,patch){
  const e=envioById(id); if(!e) return;
  snapshot('edição do envio '+e.nome);
  /* Felipe 31/08: quando muda a data do FULL na mão, destrava a confirmação de "Coleta em" -
     a pessoa marcada como confirmada pode não valer mais pra nova data (às vezes muda quem vai
     buscar). Sem isso o "✓ FELIPE" ficava travado mostrando confirmado pra uma data que já nem
     é mais essa. */
  const dataMudou=patch.data!==undefined&&patch.data!==e.data;
  Object.assign(e,patch);
  if(dataMudou) e.coletaConfirmada=false;
  const marca='FULL '+(e.nome||'')+(e.loja?' · '+e.loja:'');
  state.produtos.forEach(p=>(p.pedidos||[]).forEach(c=>{ if(c.envioId===id) c.origem=marca; }));
  persist();
}
/* Reserva o que está no galpão (Local) e o que já foi comprado e está por coletar.
   O Coletar NÃO é descontado — o motorista continua vendo tudo que precisa buscar. */
function alocarNoEnvio(envio,produtoEscolhido,solicitado,kitPaiId){
  const marcaEnvio='FULL '+(envio.nome||'')+(envio.loja?' · '+envio.loja:'');
  /* se o SKU escolhido e' um KIT (junta outros produtos, ex: Kit Pet = 1 luva + 1 Esponja Pet),
     ele nao tem estoque proprio pra alocar - explode a quantidade pedida em cada componente
     (qtd. por unidade x solicitado) e aloca/reserva/manda comprar CADA componente separado,
     recursivamente (cada componente passa de novo por essa mesma funcao, entao se um componente
     TAMBEM for vinculado a um mestre ou for ele mesmo um kit aninhado, resolve certo tambem).
     Registra 1 item "guarda-chuva" do kit no envio (0 em tudo, quem carrega os numeros de
     verdade sao os itens dos componentes, marcados com kitDeItemId apontando pra esse guarda-
     chuva) - a tela de Envios (renderEnvio) usa esse link pra CONSOLIDAR kit + componentes numa
     linha só em vez de mostrar cada um separado. */
  const comps=componentesDe(produtoEscolhido);
  if(comps.length){
    const idGuardaChuva=gerarId('it');
    envio.itens.push({id:idGuardaChuva,produtoId:produtoEscolhido.id,solicitado,alocado:0,reservadoColeta:0,geradoCompra:0,kitGuardaChuva:true,kitDeItemId:kitPaiId||null});
    let alocadoTotal=0,aCaminhoTotal=0,geradoTotal=0;
    comps.forEach(c=>{
      const comp=prodById(c.produtoId); if(!comp) return;
      const r=alocarNoEnvio(envio,comp,solicitado*c.qtdPorUnidade,idGuardaChuva);
      alocadoTotal+=r.alocado; aCaminhoTotal+=r.aCaminho; geradoTotal+=r.gerado;
    });
    produtoEscolhido.atualizadoEm=Date.now();
    return {alocado:alocadoTotal,aCaminho:aCaminhoTotal,gerado:geradoTotal,itemId:idGuardaChuva};
  }
  /* se o SKU escolhido na tela e' um membro vinculado (estoque fisico compartilhado com outro
     anuncio), o estoque de verdade mora no mestre - aloca/decrementa/compra sempre por la',
     senao ficava tirando de um produto.qtd.local que fica sempre travado em 0 pra um vinculado
     (mandava tudo pra "comprar" mesmo tendo estoque de sobra no mestre). O item do envio continua
     registrado com o produtoId do SKU ESCOLHIDO (pra saber pra qual anuncio esse envio FULL e'),
     so' a CONTA de disponibilidade/decremento que acontece no mestre. */
  const produto=produtoEfetivo(produtoEscolhido);
  const aloc=Math.min(solicitado,produto.qtd.local);
  produto.qtd.local-=aloc;
  let falta=solicitado-aloc;
  const resCol=Math.min(falta,coletarLivre(produto));
  falta-=resCol;
  const gerado=falta;
  if(gerado>0){
    if(!produto.pedidos) produto.pedidos=[];
    produto.pedidos.push({...novoPedido(gerado),origem:marcaEnvio,envioId:envio.id});
    sincronizarPedidos(produto);
  }
  const idItem=gerarId('it');
  envio.itens.push({id:idItem,produtoId:produto.id,skuEscolhidoId:produtoEscolhido.id!==produto.id?produtoEscolhido.id:null,solicitado,alocado:aloc,reservadoColeta:resCol,geradoCompra:gerado,kitDeItemId:kitPaiId||null});
  produto.atualizadoEm=Date.now();
  produtoEscolhido.atualizadoEm=Date.now();
  return {alocado:aloc,aCaminho:resCol,gerado,itemId:idItem};
}
/* puxa para a reserva o que estiver sobrando no Local */
function alocarPendentes(envioId){
  const e=envioById(envioId); if(!e) return 0;
  snapshot('alocar estoque no envio '+e.nome);
  let total=0;
  e.itens.forEach(i=>{
    const p=prodById(i.produtoId); if(!p) return;
    const falta=(i.solicitado||0)-(i.alocado||0)-(i.reservadoColeta||0)-(i.geradoCompra||0);
    const alvo=Math.max(falta,0)+ (i.geradoCompra||0);
    const dl=Math.min(alvo,p.qtd.local);
    if(dl<=0) return;
    p.qtd.local-=dl; i.alocado+=dl; total+=dl;
    i.geradoCompra=Math.max(0,(i.geradoCompra||0)-dl);
  });
  persist(); return total;
}
/* tira a quantidade dos pedidos gerados por ESTE envio; só depois recorre aos demais */
function removerCompraDoEnvio(p,envioId,qtd){
  if(!p.pedidos) p.pedidos=[];
  let rest=qtd;
  for(let i=p.pedidos.length-1;i>=0&&rest>0;i--){
    if(p.pedidos[i].envioId!==envioId) continue;
    const t=Math.min(rest,p.pedidos[i].qtd);
    p.pedidos[i].qtd-=t; rest-=t;
    if(p.pedidos[i].qtd<=0) p.pedidos.splice(i,1);
  }
  for(let i=p.pedidos.length-1;i>=0&&rest>0;i--){
    const t=Math.min(rest,p.pedidos[i].qtd);
    p.pedidos[i].qtd-=t; rest-=t;
    if(p.pedidos[i].qtd<=0) p.pedidos.splice(i,1);
  }
  sincronizarPedidos(p);
}
function reverterItem(item,envioId){
  const p=prodById(item.produtoId); if(!p) return;
  p.qtd.local+=(item.alocado||0);
  if(item.geradoCompra>0) removerCompraDoEnvio(p,envioId,item.geradoCompra);
  p.atualizadoEm=Date.now();
}
function cancelarEnvio(envioId){
  const e=envioById(envioId); if(!e) return;
  snapshot('cancelamento do envio '+e.nome);
  e.itens.forEach(i=>reverterItem(i,e.id));
  state.envios=state.envios.filter(x=>x.id!==envioId);
  persist();
}
/* todos os itens do envio que pertencem ao grupo de 1 kit (o guarda-chuva + todos os
   componentes explodidos dele, recursivo pra suportar kit de kit) - usado pra Remover/Ajustar
   tratarem o kit como 1 linha só na tela de Envios, mesmo internamente sendo N itens. */
function itensDoGrupoKit(envio,kitItemId){
  const grupo=[]; const fila=[kitItemId];
  while(fila.length){
    const alvo=fila.shift();
    const item=envio.itens.find(i=>i.id===alvo); if(!item) continue;
    grupo.push(item);
    envio.itens.filter(i=>i.kitDeItemId===alvo).forEach(f=>fila.push(f.id));
  }
  return grupo;
}
/* remove o kit inteiro (guarda-chuva + componentes) de um envio - reverte cada peça pro
   estoque/compra antes de tirar da lista, igual removerItemEnvio faria pra cada uma. */
function removerGrupoKitEnvio(envioId,kitItemId){
  const e=envioById(envioId); if(!e) return;
  const grupo=itensDoGrupoKit(e,kitItemId);
  const kit=grupo.find(i=>i.id===kitItemId), p=kit&&prodById(kit.produtoId);
  snapshot('remoção do kit '+(p?p.sku:'')+' do envio '+e.nome);
  grupo.forEach(it=>reverterItem(it,envioId));
  const idsGrupo=new Set(grupo.map(i=>i.id));
  e.itens=e.itens.filter(i=>!idsGrupo.has(i.id));
  persist();
}
/* ajusta a quantidade de um kit já no envio - como a quantidade nova muda a explosão de TODOS
   os componentes (nem sempre proporcional, por causa de estoque/coletar/comprar de cada um),
   o jeito seguro é reverter o grupo inteiro e alocar de novo do zero com o novo total, reusando
   a mesma lógica testada de alocarNoEnvio em vez de tentar calcular a diferença componente a
   componente. */
function ajustarGrupoKitEnvio(envioId,kitItemId,novoTotal){
  const e=envioById(envioId); if(!e) return {ok:false,msg:'Envio não encontrado.'};
  const grupo=itensDoGrupoKit(e,kitItemId);
  const kit=grupo.find(i=>i.id===kitItemId); if(!kit) return {ok:false,msg:'Item não encontrado.'};
  const p=prodById(kit.produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  novoTotal=parseInt(novoTotal);
  if(isNaN(novoTotal)||novoTotal<0) return {ok:false,msg:'Informe uma quantidade válida.'};
  const totalAntes=kit.solicitado||0;
  if(novoTotal===totalAntes) return {ok:true,dif:0};
  snapshot(`ajuste do kit ${p.sku} no envio ${e.nome}`);
  grupo.forEach(it=>reverterItem(it,envioId));
  const idsGrupo=new Set(grupo.map(i=>i.id));
  e.itens=e.itens.filter(i=>!idsGrupo.has(i.id));
  if(novoTotal>0) alocarNoEnvio(e,p,novoTotal);
  persist();
  return {ok:true,dif:novoTotal-totalAntes};
}
/* move um KIT inteiro (guarda-chuva + todos os componentes explodidos) de um envio pra outro já
   programado da mesma loja (pedido do Felipe 28/08: "não está aparecendo o botão de mover no kit,
   caso eu queira antecipar pra outro FULL"). Igual moverItemEnvio, NÃO mexe em reserva/compra
   (ficariam idênticas) - só transfere a posse das linhas do grupo pro envio de destino, mantendo
   os vínculos kitDeItemId intactos. Kit move sempre INTEIRO - mover só uma parte mudaria a
   explosão de cada componente (estoque/coletar/comprar de cada um), o que já se provou seguro
   só refazendo do zero (ver ajustarGrupoKitEnvio); se precisar dividir, ajuste a quantidade num
   envio e adicione o kit de novo no outro. */
function moverGrupoKitEnvio(envioIdOrigem,kitItemId,envioIdDestino){
  const eo=envioById(envioIdOrigem); if(!eo) return {ok:false,msg:'Envio de origem não encontrado.'};
  const ed=envioById(envioIdDestino); if(!ed) return {ok:false,msg:'Envio de destino não encontrado.'};
  if(envioIdOrigem===envioIdDestino) return {ok:false,msg:'Já está neste envio.'};
  const grupo=itensDoGrupoKit(eo,kitItemId);
  const kit=grupo.find(i=>i.id===kitItemId); if(!kit) return {ok:false,msg:'Kit não encontrado.'};
  const p=prodById(kit.produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  if(ed.loja!==p.loja) return {ok:false,msg:'O envio de destino é de outra loja.'};
  snapshot('kit '+p.sku+' movido do envio '+eo.nome+' pro '+ed.nome);
  const idsGrupo=new Set(grupo.map(i=>i.id));
  eo.itens=eo.itens.filter(i=>!idsGrupo.has(i.id));
  grupo.forEach(i=>ed.itens.push(i));
  persist();
  return {ok:true,sku:p.sku,qtd:kit.solicitado||0,destinoNome:ed.nome};
}
function removerItemEnvio(envioId,itemId){
  const e=envioById(envioId); if(!e) return;
  const it=e.itens.find(i=>i.id===itemId); if(!it) return;
  const p=prodById(it.produtoId);
  snapshot('remoção de '+(p?p.sku:'item')+' do envio '+e.nome);
  reverterItem(it,envioId);
  e.itens=e.itens.filter(i=>i.id!==itemId);
  persist();
}
/* move a programação de 1 item de um envio pra outro já existente (mesma loja) - diferente de
   remover+recriar, isso NÃO libera e re-reserva o estoque (que ficaria idêntico de qualquer
   forma): só muda qual envio "é dono" da reserva/compra que já está feita. Se o envio de
   destino já tiver esse mesmo produto, soma nele em vez de duplicar linha. */
function moverItemEnvio(envioIdOrigem,itemId,envioIdDestino){
  const eo=envioById(envioIdOrigem); if(!eo) return {ok:false,msg:'Envio de origem não encontrado.'};
  const ed=envioById(envioIdDestino); if(!ed) return {ok:false,msg:'Envio de destino não encontrado.'};
  if(envioIdOrigem===envioIdDestino) return {ok:false,msg:'Já está neste envio.'};
  const it=eo.itens.find(i=>i.id===itemId); if(!it) return {ok:false,msg:'Item não encontrado.'};
  const p=prodById(it.produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  if(ed.loja!==p.loja) return {ok:false,msg:'O envio de destino é de outra loja.'};
  snapshot('mover '+p.sku+' do envio '+eo.nome+' para '+ed.nome);
  /* re-marca os pedidos de compra deste produto que estavam etiquetados pro envio de origem -
     senão, se um dos dois envios for cancelado depois, o sistema ia procurar a ordem de compra
     pelo envio errado (removerCompraDoEnvio casa por envioId) e não achava/reduzia certo. */
  const marcaDestino='FULL '+(ed.nome||'')+(ed.loja?' · '+ed.loja:'');
  (p.pedidos||[]).forEach(c=>{ if(c.envioId===envioIdOrigem){ c.envioId=envioIdDestino; c.origem=marcaDestino; } });
  eo.itens=eo.itens.filter(i=>i.id!==itemId);
  const existente=ed.itens.find(i=>i.produtoId===it.produtoId);
  if(existente){
    existente.solicitado=(existente.solicitado||0)+(it.solicitado||0);
    existente.alocado=(existente.alocado||0)+(it.alocado||0);
    existente.reservadoColeta=(existente.reservadoColeta||0)+(it.reservadoColeta||0);
    existente.geradoCompra=(existente.geradoCompra||0)+(it.geradoCompra||0);
  } else {
    ed.itens.push({...it,id:gerarId('it')});
  }
  persist();
  return {ok:true};
}
/* cria um envio novo de emergência (separado dos programados) e já move este item pra ele */
function moverItemParaNovoEmergencia(envioIdOrigem,itemId,data,localColeta){
  const eo=envioById(envioIdOrigem); if(!eo) return {ok:false,msg:'Envio de origem não encontrado.'};
  const it=eo.itens.find(i=>i.id===itemId); if(!it) return {ok:false,msg:'Item não encontrado.'};
  const p=prodById(it.produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  let res=null;
  batch('criação de FULL de emergência a partir do envio '+eo.nome,()=>{
    const novo=criarEnvio('🚨 Emergência '+fmtData(data),data,p.loja,'',localColeta||LOCAIS_COLETA[0]);
    novo.origem='emergencia';
    res=moverItemEnvio(envioIdOrigem,itemId,novo.id);
    if(res.ok) res.envio=novo;
    else state.envios=state.envios.filter(x=>x.id!==novo.id);
  });
  return res;
}
/* re-etiqueta uma quantidade PARCIAL de pedidos de compra (envioId+origem) de um envio pro
   outro - igual moverItemEnvio faz, só que aqui pode ter que partir 1 pedido em 2 (uma parte
   fica com o envio de origem, outra vai pro de destino), porque nem sempre a fatia que está
   indo de emergência bate exatamente com 1 pedido inteiro. */
function reetiquetarPedidosParcial(p,envioIdOrigem,envioIdDestino,marcaDestino,qtd){
  if(!p.pedidos) return;
  let restante=qtd;
  for(const c of p.pedidos){
    if(restante<=0) break;
    if(c.envioId!==envioIdOrigem) continue;
    if(c.qtd<=restante){ c.envioId=envioIdDestino; c.origem=marcaDestino; restante-=c.qtd; }
    else { c.qtd-=restante; p.pedidos.push({id:gerarId('c'),qtd:restante,data:c.data,obs:c.obs,origem:marcaDestino,envioId:envioIdDestino}); restante=0; }
  }
  sincronizarPedidos(p);
}
/* move uma quantidade PARCIAL de um item pra outro envio JÁ EXISTENTE (mesma loja) - o resto
   fica no envio de origem, programado normalmente. Se a quantidade pedida for o item inteiro,
   cai no mesmo caminho de moverItemEnvio (sem sobrar item vazio no envio de origem). */
function moverQtdEntreEnvios(envioIdOrigem,itemId,envioIdDestino,qtd){
  const eo=envioById(envioIdOrigem); if(!eo) return {ok:false,msg:'Envio de origem não encontrado.'};
  const ed=envioById(envioIdDestino); if(!ed) return {ok:false,msg:'Envio de destino não encontrado.'};
  if(envioIdOrigem===envioIdDestino) return {ok:false,msg:'Já está neste envio.'};
  const it=eo.itens.find(i=>i.id===itemId); if(!it) return {ok:false,msg:'Item não encontrado.'};
  const p=prodById(it.produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  if(ed.loja!==p.loja) return {ok:false,msg:'O envio de destino é de outra loja.'};
  qtd=Math.max(0,Math.min(Math.round(qtd),it.solicitado||0));
  if(qtd<=0) return {ok:false,msg:'Informe uma quantidade válida.'};
  if(qtd>=(it.solicitado||0)) return moverItemEnvio(envioIdOrigem,itemId,envioIdDestino);
  snapshot('mover '+fmtInt(qtd)+' un. de '+p.sku+' do envio '+eo.nome+' para '+ed.nome);
  const marcaDestino='FULL '+(ed.nome||'')+(ed.loja?' · '+ed.loja:'');
  let restante=qtd;
  const tirarAlocado=Math.min(restante,it.alocado||0); restante-=tirarAlocado;
  const tirarColeta=Math.min(restante,it.reservadoColeta||0); restante-=tirarColeta;
  const tirarCompra=Math.min(restante,it.geradoCompra||0); restante-=tirarCompra;
  if(tirarCompra>0) reetiquetarPedidosParcial(p,envioIdOrigem,envioIdDestino,marcaDestino,tirarCompra);
  it.alocado=(it.alocado||0)-tirarAlocado;
  it.reservadoColeta=(it.reservadoColeta||0)-tirarColeta;
  it.geradoCompra=(it.geradoCompra||0)-tirarCompra;
  it.solicitado=(it.solicitado||0)-qtd;
  const existente=ed.itens.find(i=>i.produtoId===it.produtoId);
  if(existente){
    existente.solicitado=(existente.solicitado||0)+qtd;
    existente.alocado=(existente.alocado||0)+tirarAlocado;
    existente.reservadoColeta=(existente.reservadoColeta||0)+tirarColeta;
    existente.geradoCompra=(existente.geradoCompra||0)+tirarCompra;
  } else {
    ed.itens.push({id:gerarId('it'),produtoId:it.produtoId,solicitado:qtd,alocado:tirarAlocado,reservadoColeta:tirarColeta,geradoCompra:tirarCompra});
  }
  persist();
  return {ok:true};
}
/* cria um FULL de emergência com só uma PARTE da quantidade programada no item (o resto
   continua no envio de origem, programado normalmente) - prioriza tirar do que já está mais
   pronto (galpão primeiro, depois a coletar, só por último o que ainda nem foi comprado),
   igual o resto do sistema já faz ao reservar. Se a quantidade pedida cobrir o item inteiro,
   cai no mesmo caminho de moverItemParaNovoEmergencia (sem sobrar item vazio no envio de
   origem). */
function moverQtdParaNovoEmergencia(envioIdOrigem,itemId,qtd,data,localColeta){
  const eo=envioById(envioIdOrigem); if(!eo) return {ok:false,msg:'Envio de origem não encontrado.'};
  const it=eo.itens.find(i=>i.id===itemId); if(!it) return {ok:false,msg:'Item não encontrado.'};
  const p=prodById(it.produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  qtd=Math.max(0,Math.min(Math.round(qtd),it.solicitado||0));
  if(qtd<=0) return {ok:false,msg:'Informe uma quantidade válida.'};
  if(qtd>=(it.solicitado||0)) return moverItemParaNovoEmergencia(envioIdOrigem,itemId,data,localColeta);
  let res=null;
  batch('criação de FULL de emergência (parcial) a partir do envio '+eo.nome,()=>{
    const novo=criarEnvio('🚨 Emergência '+fmtData(data),data,p.loja,'',localColeta||LOCAIS_COLETA[0]);
    novo.origem='emergencia';
    const marcaDestino='FULL '+(novo.nome||'')+(novo.loja?' · '+novo.loja:'');
    let restante=qtd;
    const tirarAlocado=Math.min(restante,it.alocado||0); restante-=tirarAlocado;
    const tirarColeta=Math.min(restante,it.reservadoColeta||0); restante-=tirarColeta;
    const tirarCompra=Math.min(restante,it.geradoCompra||0); restante-=tirarCompra;
    if(tirarCompra>0) reetiquetarPedidosParcial(p,envioIdOrigem,novo.id,marcaDestino,tirarCompra);
    it.alocado=(it.alocado||0)-tirarAlocado;
    it.reservadoColeta=(it.reservadoColeta||0)-tirarColeta;
    it.geradoCompra=(it.geradoCompra||0)-tirarCompra;
    it.solicitado=(it.solicitado||0)-qtd;
    novo.itens.push({id:gerarId('it'),produtoId:it.produtoId,solicitado:qtd,alocado:tirarAlocado,reservadoColeta:tirarColeta,geradoCompra:tirarCompra});
    res={ok:true,envio:novo};
  });
  return res;
}
/* reduz o envio ao que já está etiquetado no galpão, liberando o que faltava */
function ajustarEnvioParaPronto(envioId){
  const e=envioById(envioId); if(!e) return 0;
  snapshot('ajuste do envio '+e.nome+' para o que está pronto');
  let liberado=0;
  e.itens.forEach(i=>{
    const p=prodById(i.produtoId);
    const pend=(i.solicitado||0)-(i.alocado||0);
    if(pend<=0) return;
    liberado+=pend;
    if(p&&i.geradoCompra>0) removerCompraDoEnvio(p,e.id,i.geradoCompra);
    i.reservadoColeta=0; i.geradoCompra=0; i.solicitado=i.alocado;
  });
  e.itens=e.itens.filter(i=>(i.solicitado||0)>0);
  persist();
  return liberado;
}
function confirmarEnvioFull(envioId,manterCompra){
  const e=envioById(envioId); if(!e) return;
  snapshot('confirmação do envio '+e.nome);
  if(!manterCompra) e.itens.forEach(i=>{ const p=prodById(i.produtoId); if(p&&i.geradoCompra>0) removerCompraDoEnvio(p,e.id,i.geradoCompra); });
  /* confirmar só tira o envio da programação (ele já não conta mais como "Próximos
     programados" na Previsão) — não tenta mais adivinhar um estado intermediário de "a
     caminho do Full" localmente. Assim que a mercadoria chegar de verdade, a próxima
     sincronização com o Mercado Livre mostra ela em "Aptas"/"Em transferência", que já é
     dado real direto da API — sem número congelado no meio do caminho. */
  const somado=[];
  e.itens.forEach(i=>{
    const p=prodById(i.produtoId); if(!p||!(i.solicitado>0)) return;
    /* CORRIGIDO 28/08 (junto com o fix do kit travando o Virou FULL): componente explodido de kit
       (kitDeItemId) não ganha marcador de "Entrada pendente" - o que o Mercado Livre vai registrar
       chegando é o KIT montado (a linha guarda-chuva, que continua ganhando o marcador normal),
       nunca o componente solto. Sem isso, os componentes ficavam 5 dias com estoque "chegando"
       que nunca chega, inflando a projeção deles. */
    if(i.kitDeItemId) return;
    /* CORRIGIDO 31/08 (Felipe: produtos que compartilham estoque - ex. ALICATE - mostravam
       "entrada pendente" de OUTRA loja): i.produtoId aqui é sempre o MESTRE físico (onde o
       estoque de verdade é decrementado - ver alocarNoEnvio), mas a fila de "entrada pendente"
       é por LOJA/anúncio (cada loja tem seu próprio painel Full e seu próprio log real de
       recebimento do ML - ver mlAtualizarFullDoSinc). Gravar sempre no mestre juntava numa fila
       só as confirmações de TODAS as lojas que compartilham aquele produto, e qualquer loja via
       a entrada pendente confirmada por outra. i.skuEscolhidoId guarda o SKU realmente escolhido
       pra ESTE envio (só é diferente do mestre quando é um vinculado) - usa ele como o lugar
       certo pra gravar a fila dessa loja específica. */
    const pLoja=prodById(i.skuEscolhidoId)||p;
    const fi=state.full.itens.find(x=>x.loja===e.loja&&fullProduto(x)&&fullProduto(x).id===pLoja.id);
    if(fi) fi.ajuste=null;
    /* 21/08 (Felipe): assim que confirma um envio, ele some de "Próximos programados" (de
       propósito - ver comentário lá em cima) e o Mercado Livre ainda demora uns dias pra
       registrar o recebimento (aptas/em transferência) - nesse intervalo, o alerta de ruptura
       voltava a disparar "esse SKU não está no próximo envio, vai zerar antes" mesmo já tendo
       saído material pra lá. Em vez de inventar um número de estoque "a caminho" (isso já foi
       tentado antes como "Entrada pendente" e foi removido - ver aviso acima - porque travava
       errado sempre que algo mudava fora do Doca), guarda só um marcador leve: quando esse SKU
       foi confirmado e quanto tinha de aptas+transf NAQUELE momento. Enquanto esse número real
       não SUBIR (prova de que o ML já processou algo) e o prazo de segurança não vencer, o
       alerta "não está no próximo envio" fica suspenso pra esse SKU - o resto do cálculo
       (zera em X dias, etc) continua 100% real, sem gerar número congelado. */
    /* CORRIGIDO 28/08 (Felipe: "próximos programados vira 'em processamento', espera os mesmos 5
       dias, e conforme o que já chegou vai descontando desse total" - em vez de um corte binário em
       10%, decai PROPORCIONAL: cada unidade que aparecer em aptas+transf acima do baseline é uma
       unidade a menos ainda "em processamento", até chegar a zero ou vencer o prazo de 5 dias - ver
       fullCalc/mlAtualizarFullDoSinc).
       CORRIGIDO 28/08 (2ª volta, Felipe: "existe possibilidade melhor?"): 1 marcador único por
       produto quebrava se confirmasse 2 envios do mesmo SKU dentro da mesma janela de 5 dias (ex.:
       programado + emergência) - o 2º sobrescrevia o 1º e perdia o rastro do que ainda faltava
       chegar dele. Agora é uma FILA (p.filaProcessamento[]): cada confirmação empilha sua própria
       quantidade, e os aumentos reais de aptas+transf (delta desde p.filaBaseline, atualizado a
       cada sincronização - ver mlAtualizarFullDoSinc) descontam da entrada MAIS ANTIGA primeiro
       (FIFO), sobrando pra próxima quando zerar. p.filaBaseline só é (re)ancorado quando a fila
       estava vazia - se já tinha algo em processamento, o baseline current já está sendo
       acompanhado sync a sync, não reseta. */
    /* CORRIGIDO 28/08 (3ª volta, "Entrada Pendente 2.0"): não guarda mais baseline nenhum aqui - a
       conta de "quanto já chegou" agora vem do log real de operações do ML
       (buscarRecebimentosFull no server.js), não de comparar aptas+transf antes/depois (que se
       confundia com venda no meio do caminho) - ver filaProcessamentoComRestante. */
    if(!pLoja.filaProcessamento) pLoja.filaProcessamento=[];
    pLoja.filaProcessamento.push({data:hoje(),qtdOriginal:i.solicitado||0});
    somado.push(pLoja.sku);
    flashFull[pLoja.id]=Date.now();
  });
  state.envios=state.envios.filter(x=>x.id!==envioId);
  persist();
  if(somado.length) toast(somado.length+' SKU(s) confirmados como FULL. Assim que o Mercado Livre receber, a próxima sincronização atualiza sozinha.');
  /* tira o realce depois de alguns segundos e re-renderiza só pra limpar a classe */
  setTimeout(()=>{ flashFull={}; renderPrevisao(); },2600);
}

/* ---------- visão geral ---------- */
function finLoja(loja){
  if(!state.financeiro) state.financeiro={};
  if(!state.financeiro[loja]) state.financeiro[loja]={mercadoPago:0,aReceber:0,imposto:0,aliquotaImposto:0,pctFaturaMl:9};
  else{
    if(typeof state.financeiro[loja].imposto!=='number') state.financeiro[loja].imposto=Number(state.financeiro[loja].imposto)||0;
    if(typeof state.financeiro[loja].aliquotaImposto!=='number') state.financeiro[loja].aliquotaImposto=Number(state.financeiro[loja].aliquotaImposto)||0;
    /* % média de fatura ML sobre o faturamento (pedido do Felipe 27/08, pra projetar a fatura em
       aberto e o imposto do ciclo seguinte em cima da receita PROJETADA, não só a parcial já
       fechada). Fixo por enquanto (editável aqui, não calculado do histórico) porque o Felipe está
       ativamente reduzindo Ads - a tendência é essa % cair com o tempo, e ele prefere ajustar na
       mão conforme isso acontece em vez de uma média histórica que ficaria sempre desatualizada
       pra trás. Default 9 (número que o Felipe já usa de cabeça hoje). */
    if(typeof state.financeiro[loja].pctFaturaMl!=='number') state.financeiro[loja].pctFaturaMl=state.financeiro[loja].pctFaturaMl==null?9:(Number(state.financeiro[loja].pctFaturaMl)||0);
  }
  return state.financeiro[loja];
}
function atualizarFinanceiro(loja,patch){
  const f=finLoja(loja);
  snapshot('ajuste financeiro de '+loja);
  if(patch.mercadoPago!==undefined){ f.mercadoPago=Math.max(0,parseMoeda(patch.mercadoPago)); }
  if(patch.aReceber!==undefined){ f.aReceber=Math.max(0,parseMoeda(patch.aReceber)); }
  if(patch.imposto!==undefined){ f.imposto=Math.max(0,parseMoeda(patch.imposto)); }
  if(patch.aliquotaImposto!==undefined){ const v=Number(String(patch.aliquotaImposto).replace(',','.')); f.aliquotaImposto=isNaN(v)?0:Math.min(100,Math.max(0,v)); }
  if(patch.pctFaturaMl!==undefined){ const v=Number(String(patch.pctFaturaMl).replace(',','.')); f.pctFaturaMl=isNaN(v)?0:Math.min(100,Math.max(0,v)); }
  persist();
}
/* soma das faturas do Mercado Livre ainda não pagas dessa loja (cadastradas em Finanças, origem
   "ml_fatura") - usada aqui só pra descontar do patrimônio da Visão Geral, sem duplicar a lógica
   de cálculo que já existe na aba Finanças */
function faturaMlPendenteLoja(loja){
  return despesasArr().filter(d=>d.origem==='ml_fatura'&&d.loja===loja&&!d.pago).reduce((s,d)=>s+(Number(d.valor)||0),0);
}
/* recalcula o campo "Imposto" da Visão Geral automaticamente: faturamento do mês corrente × a
   alíquota configurada em Finanças → Resumo Financeiro pra essa loja. Se a alíquota ainda não foi
   configurada (0%), o imposto fica em R$0,00 mesmo (não é um erro, só falta configurar). */
function aplicarImpostoAutomatico(loja,faturamentoMes){
  const f=finLoja(loja);
  f.imposto=faturamentoMes*((f.aliquotaImposto||0)/100);
  f.impostoFaturamentoBase=faturamentoMes;
  f.impostoAtualizadoEm=Date.now();
  persist();
}
async function sincronizarImpostoAutomatico(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
  const r=await fetch(`${base}/financas/faturamento-mes?loja=${encodeURIComponent(loja)}`);
  let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+r.status+').'); }
  if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao buscar o faturamento do mês (status '+r.status+').'));
  aplicarImpostoAutomatico(loja,j.faturamento||0);
}
function mesAnteriorStr(mes){
  const [ano,mm]=(mes||mesAtualStr()).split('-').map(Number);
  const d=new Date(Date.UTC(ano,mm-2,1));
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
}
/* despesa de Imposto automática (pedido do Felipe 23/08): entra sozinha em Despesas todo mês,
   vencendo dia 20, com base no FATURAMENTO DO MÊS ANTERIOR × alíquota configurada (convenção do
   DAS/Simples Nacional - imposto do mês M paga no dia 20 do mês M+1). Só entra como LEMBRETE de
   pagamento (fica em Despesas e conta no Fluxo de Caixa) - não soma em despesasPeriodoLoja porque
   o imposto já é descontado direto dentro da Margem Líquida (ver calcularMargensResumo), então
   somar aqui de novo descontaria 2x. Casa pela loja + impostoRefMes (mês de referência do
   faturamento usado), pra não duplicar - se já existe, só atualiza o valor (o faturamento do mês
   de referência pode mudar um pouco se recalculado depois, ex. reembolsos processados depois). */
async function sincronizarImpostoDespesaMes(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
  const aliquota=finLoja(loja).aliquotaImposto||0;
  if(!aliquota) return; // sem alíquota configurada ainda - não cria despesa de R$0 à toa
  /* CORRIGIDO 28/08 (Felipe: "no fluxo de caixa você não está considerando o imposto") - antes só
     criava a despesa do CICLO ATUAL (vencimento no dia 20 deste mês), então o Fluxo de Caixa ficava
     "cego" pro imposto do PRÓXIMO mês até alguém abrir o Doca já dentro daquele mês (só aí o ciclo
     "nascia" como despesa de verdade). Agora roda pra 2 ciclos: o atual (base no faturamento do mês
     passado, já fechado) e o seguinte (base no faturamento do mês CORRENTE, ainda em andamento -
     atualiza sozinho a cada sync, foi ficando mais preciso conforme o mês fecha, igual a "reserva
     recomendada" do relatório DRE+DFC). Cada ciclo casa por loja+impostoRefMes (upsert, não
     duplica). Se o ciclo seguinte falhar (ex: mês corrente sem venda ainda), não trava o app - só o
     ciclo atual precisa funcionar de verdade. */
  let mesVencimento=mesAtualStr();
  for(let ciclo=0;ciclo<2;ciclo++){
    const refMes=mesAnteriorStr(mesVencimento);
    const de=`${refMes}-01`;
    const [anoRef,mmRef]=refMes.split('-').map(Number);
    const ate=`${refMes}-${String(new Date(anoRef,mmRef,0).getDate()).padStart(2,'0')}`;
    try{
      const r=await fetch(`${base}/financas/faturamento-mes?loja=${encodeURIComponent(loja)}&de=${de}&ate=${ate}`);
      let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+r.status+').'); }
      if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao buscar o faturamento do mês '+refMes+' (status '+r.status+').'));
      const faturamentoBase=j.faturamento||0;
      if(faturamentoBase>0){
        const valor=Math.round(faturamentoBase*(aliquota/100)*100)/100;
        const vencimento=`${mesVencimento}-20`;
        const arr=despesasArr();
        let d=arr.find(x=>x.origem==='imposto'&&x.loja===loja&&x.impostoRefMes===refMes);
        if(d){
          d.valor=valor; d.dataPagamento=vencimento; d.impostoFaturamentoBase=faturamentoBase; d.impostoAliquota=aliquota;
        }else{
          arr.push({id:gerarId('desp'),descricao:`Imposto — ${loja} (base ${mesLabel(refMes)})`,valor,dataPagamento:vencimento,
            pago:false,recorrente:true,loja,origem:'imposto',faturaKey:null,origemRecorrenciaId:null,
            impostoRefMes:refMes,impostoFaturamentoBase:faturamentoBase,impostoAliquota:aliquota,criadoEm:Date.now()});
        }
      }
    }catch(e){
      if(ciclo===0) throw e;
      console.error('[imposto] falha ao projetar o ciclo seguinte:',loja,e.message);
    }
    const [a,m]=mesVencimento.split('-').map(Number);
    const dNext=new Date(Date.UTC(a,m,1));
    mesVencimento=`${dNext.getUTCFullYear()}-${String(dNext.getUTCMonth()+1).padStart(2,'0')}`;
  }
  persist();
}
/* ---------- perguntas sem resposta (card na Visão Geral) ----------
   A CONTAGEM (p.mlPerguntas) já vem de graça no "Atualizar" normal de Produtos. O TEXTO de cada
   pergunta só é buscado sob demanda (quando a pessoa clica pra ver aquela loja), pra não pesar
   toda sincronização - e responder aqui já usa a API oficial de perguntas e respostas do ML. */
let perguntasCarregadas={}; // loja -> array de perguntas já buscadas (undefined = ainda não pediu)
let perguntasCarregando=null; // loja sendo buscada agora
let perguntasEnviando={}; // questionId -> true enquanto envia a resposta
async function carregarPerguntas(loja){
  perguntasCarregando=loja; renderDashboard();
  try{
    const base=backendUrl();
    if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
    const r=await fetch(`${base}/perguntas?loja=${encodeURIComponent(loja)}`);
    let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+r.status+').'); }
    if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao buscar perguntas (status '+r.status+').'));
    perguntasCarregadas[loja]=j.perguntas||[];
    // CORRIGIDO 26/08: recalibra a contagem por produto (p.mlPerguntas, só atualizada no /sync
    // completo) com a lista REAL que acabou de chegar - cobre o caso de responder direto no app
    // do Mercado Livre em vez de pelo Doca: sem isso, o badge "X sem resposta" na Visão Geral
    // continuava com o número antigo até rodar Atualizar de novo, mesmo já mostrando aqui embaixo
    // "nenhuma pergunta sem resposta agora" (a lista real e o badge vinham de fontes diferentes).
    const contagemReal={};
    perguntasCarregadas[loja].forEach(q=>{ if(q.itemId) contagemReal[q.itemId]=(contagemReal[q.itemId]||0)+1; });
    let mudouContagem=false;
    state.produtos.filter(p=>p.loja===loja).forEach(p=>{
      const real=contagemReal[p.mlItemId]||0;
      if((p.mlPerguntas||0)!==real){ p.mlPerguntas=real; mudouContagem=true; }
    });
    if(mudouContagem) persist();
    // dispara a sugestao de IA pra cada pergunta nova (mesmo padrao ja usado em carregarMensagens) -
    // faltava essa chamada aqui, por isso a caixa de resposta ficava sem sugestao nenhuma (21/08)
    const lista=perguntasCarregadas[loja];
    await Promise.all(lista.filter(q=>q.texto&&sugestoesResposta[q.id]===undefined)
      .map(q=>buscarSugestaoSilenciosa(q.id,'pergunta',q.texto,q.titulo)));
  }catch(e){ alert('Não foi possível buscar as perguntas: '+e.message); }
  finally{ perguntasCarregando=null; renderDashboard(); }
}
async function responderPergunta(loja,questionId,itemId,texto){
  if(!texto||!texto.trim()){ alert('Escreva uma resposta antes de enviar.'); return; }
  perguntasEnviando[questionId]=true; renderDashboard();
  try{
    const base=backendUrl();
    if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
    const r=await fetch(`${base}/perguntas/responder?loja=${encodeURIComponent(loja)}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({questionId,texto:texto.trim()})
    });
    let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+r.status+').'); }
    if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao responder (status '+r.status+').'));
    if(perguntasCarregadas[loja]) perguntasCarregadas[loja]=perguntasCarregadas[loja].filter(q=>String(q.id)!==String(questionId));
    const p=state.produtos.find(x=>x.mlItemId===itemId);
    if(p&&p.mlPerguntas>0){ p.mlPerguntas--; persist(); }
    toast('Resposta enviada pro Mercado Livre.');
  }catch(e){ alert('Não foi possível responder: '+e.message); }
  finally{ delete perguntasEnviando[questionId]; renderDashboard(); }
}
/* ---------- sugestão de resposta pronta (IA) - Perguntas e Mensagens pós-venda ----------
   Pedido do Felipe (20/08): tanto em Perguntas quanto em Mensagens pós-venda, deixar a resposta
   sugerida já pronta na caixa de texto, só pra clicar Responder (ou editar antes). Busca em
   paralelo pra todos os itens de uma vez e só re-renderiza no final (evita apagar o que a pessoa
   já esteja digitando a cada sugestão que for chegando). */
let sugestoesResposta={}; // chave (questionId ou packId) -> texto sugerido | 'carregando' | ''(falhou)
let sugestoesErro={}; // chave -> motivo da última falha (só existe quando sugestoesResposta[chave]==='')
let sugestoesContexto={}; // chave -> {tipo,texto,titulo} guardado pra dar pra "tentar de novo" sem reconstruir nada
// 21/08: até aqui, se a chamada de IA falhasse (ex: faltou configurar a ANTHROPIC_API_KEY no
// Render, ou a API do Claude deu erro), o Doca engolia o erro em silêncio - a caixa de resposta só
// ficava sem sugestão nenhuma, sem avisar PORQUE, e o Felipe (21/08) reportou isso como "bug" sem
// ter como saber o motivo. Agora guarda o motivo da falha (aparece no hover) e mostra um link
// "tentar de novo".
async function buscarSugestaoSilenciosa(chave,tipo,texto,titulo){
  sugestoesContexto[chave]={tipo,texto,titulo};
  sugestoesResposta[chave]='carregando';
  delete sugestoesErro[chave];
  try{
    const base=backendUrl();
    if(!base){ sugestoesResposta[chave]=''; sugestoesErro[chave]='Configure a URL do backend primeiro (em Produtos → Atualizar).'; return; }
    const r=await fetch(`${base}/sugestao/resposta`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tipo,texto,titulo:titulo||null})
    });
    let j; try{ j=await r.json(); }catch(e){ throw new Error('o backend respondeu algo inesperado (status '+r.status+')'); }
    if(r.ok&&j.ok&&j.sugestao){ sugestoesResposta[chave]=j.sugestao; }
    else{ sugestoesResposta[chave]=''; sugestoesErro[chave]=j.erro||('falha desconhecida (status '+r.status+')'); }
  }catch(e){ sugestoesResposta[chave]=''; sugestoesErro[chave]=e.message; }
  if(sugestoesErro[chave]) console.error('Sugestão de IA falhou ('+chave+'):', sugestoesErro[chave]);
}
async function tentarSugestaoDeNovo(chave){
  const ctx=sugestoesContexto[chave]; if(!ctx) return;
  await buscarSugestaoSilenciosa(chave,ctx.tipo,ctx.texto,ctx.titulo);
  renderDashboard();
}
// rótulo mostrado ao lado de "Resposta" - reaproveitado em Perguntas e Mensagens pós-venda
function rotuloSugestao(chave){
  if(sugestoesResposta[chave]==='carregando') return ' <span class="muted" style="font-weight:400">(gerando sugestão...)</span>';
  if(sugestoesResposta[chave]) return ' <span class="muted" style="font-weight:400">(sugestão da IA - revise antes de enviar)</span>';
  if(sugestoesErro[chave]) return ` <span style="font-weight:400;color:#e66" title="${esc(sugestoesErro[chave])}">(sugestão indisponível — <a href="#" data-sugestaotentar="${esc(chave)}">tentar de novo</a>)</span>`;
  return '';
}
/* ---------- reclamações e mediações (card na Visão Geral) ----------
   Resolvidas automaticamente pelo backend (dentro do /sync, pela regra do frete) - aqui só busca
   o relatório do que já foi feito, pra mostrar sempre visível (inclusive quando não tem
   pendência nenhuma). Carregado junto com a sincronização normal (ver sincronizarMlAoAbrir e o
   botão Atualizar). */
/* Mensagens pós-venda e Reclamações podem demorar bastante no backend (processam vários packs/claims
   em sequência contra a API do Mercado Livre) - se o backend travar ou demorar demais, um fetch()
   normal fica pendurado pra sempre e o card fica em "carregando..." eternamente. Esse helper corta
   depois de "ms" milissegundos e joga um erro, pra sempre chegar num estado final. */
async function fetchComTimeout(url,opts,ms){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),ms);
  try{ return await fetch(url,Object.assign({},opts,{signal:ctrl.signal})); }
  catch(e){ if(e.name==='AbortError') throw new Error('demorou demais pra responder (mais de '+Math.round(ms/1000)+'s)'); throw e; }
  finally{ clearTimeout(timer); }
}
let reclamacoesPorLoja={}; // loja -> {total,pendentes,resolvidas,itens} | undefined = ainda não carregou
async function carregarReclamacoes(loja){
  try{
    const base=backendUrl(); if(!base){ reclamacoesPorLoja[loja]={total:0,pendentes:0,resolvidas:0,itens:[],erro:'backend não configurado'}; return; }
    const r=await fetchComTimeout(`${base}/reclamacoes/relatorio?loja=${encodeURIComponent(loja)}`,{},30000);
    const j=await r.json();
    if(r.ok&&j.ok) reclamacoesPorLoja[loja]=j;
    else reclamacoesPorLoja[loja]={total:0,pendentes:0,resolvidas:0,itens:[],erro:j.erro||('status '+r.status)};
  }catch(e){
    console.error('Falha ao buscar relatório de reclamações ('+loja+'):',e.message);
    // sempre fecha num estado terminal (nunca deixa undefined) - senão o card fica em "carregando..."
    // pra sempre quando o backend falha ou demora demais.
    reclamacoesPorLoja[loja]={total:0,pendentes:0,resolvidas:0,itens:[],erro:e.message};
  }
}
/* ---------- mensagens pós-venda (card na Visão Geral, logo abaixo de Perguntas) ----------
   Diferente de Perguntas, o Felipe pediu isso sempre visível (sem precisar clicar pra carregar) -
   por isso é buscado junto com a sincronização normal, igual Reclamações. Resposta continua
   manual (só a sugestão vem pronta). */
let mensagensCarregadas={}; // loja -> array de mensagens pendentes | undefined = ainda não carregou
let mensagensEnviando={}; // packId -> true enquanto envia a resposta
async function carregarMensagens(loja){
  try{
    const base=backendUrl(); if(!base){ mensagensCarregadas[loja]=Object.assign([],{erro:'backend não configurado'}); return; }
    const r=await fetchComTimeout(`${base}/mensagens?loja=${encodeURIComponent(loja)}`,{},45000);
    const j=await r.json();
    if(!r.ok||!j.ok) throw new Error(j.erro||'falha ao buscar mensagens');
    mensagensCarregadas[loja]=j.mensagens||[];
    const lista=mensagensCarregadas[loja];
    await Promise.all(lista.filter(m=>m.ultimaMensagem&&sugestoesResposta[m.packId]===undefined)
      .map(m=>buscarSugestaoSilenciosa(m.packId,'mensagem',m.ultimaMensagem.texto,m.titulo)));
  }catch(e){
    console.error('Falha ao buscar mensagens pós-venda ('+loja+'):',e.message);
    // sempre fecha num estado terminal (nunca deixa undefined) - senão o card fica em "carregando..."
    // pra sempre quando o backend falha, demora demais ou o endpoint dá erro.
    mensagensCarregadas[loja]=Object.assign([],{erro:e.message});
  }
}
async function responderMensagem(loja,packId,buyerId,texto){
  if(!texto||!texto.trim()){ alert('Escreva uma resposta antes de enviar.'); return; }
  if(!buyerId){ alert('Não foi possível identificar o comprador dessa conversa - atualize a página e tente de novo.'); return; }
  mensagensEnviando[packId]=true; renderDashboard();
  try{
    const base=backendUrl();
    if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
    const r=await fetch(`${base}/mensagens/responder?loja=${encodeURIComponent(loja)}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({packId,buyerId,texto:texto.trim()})
    });
    let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+r.status+').'); }
    if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao responder (status '+r.status+').'));
    if(mensagensCarregadas[loja]) mensagensCarregadas[loja]=mensagensCarregadas[loja].filter(m=>String(m.packId)!==String(packId));
    toast('Resposta enviada pro Mercado Livre.');

  finally{ delete mensagensEnviando[packId]; renderDashboard(); }
}
/* ---------- pausado / perdendo no catálogo (card na Visão Geral) ----------
   100% calculado localmente a partir do que já vem no /sync normal (mlStatus, mlConcorrenciaStatus)
   - não precisa de chamada extra nenhuma ao backend. */
function produtosPausadosOuPerdendo(){
  // exclui p.mlAusente (anúncio que não apareceu mais no último sync — provavelmente excluído/
  // encerrado no Mercado Livre) - senão um produto pausado ANTES de ser excluído fica preso pra
  // sempre nesse card (mlStatus fica "paused" congelado, o Doca nunca mais recebe atualização
  // dele pra saber que sumiu de vez). Mesmo critério já usado no alerta de ruptura (linha ~7814).
  // exclui tambem p.repoPausada (produto que o Felipe ja marcou pra sair de linha pelo botao 🔕) -
  // mesmo criterio do alerta de ruptura, reaproveitado aqui a pedido dele (21/08)
  return state.produtos.filter(p=>p.mlItemId&&!p.mlAusente&&!p.repoPausada&&(p.mlStatus==='paused'||p.mlConcorrenciaStatus==='losing'||p.mlConcorrenciaStatus==='sharing_first'));
}
/* CARD "RANKING DE MAIS VENDIDOS" na Visão Geral (pedido do Felipe 02/09) - quem ganhou e quem
   perdeu posição desde a leitura anterior, quem está no top 10, e os candidatos ao selo. O
   histórico vem de registrarPosicaoProduto (1 leitura por dia, guardada 120 dias). */
/* ---------- cards novos da Visão Geral (ranking, concorrência, oportunidades) ----------
   02/09: mesmo desenho dos cards de loja (ver .card-vg no CSS) e, a pedido do Felipe, organizados
   POR LOJA - uma coluna por loja, na mesma ordem dos cards de cima, pra bater o olho e comparar. */
function vgLinha(esq,dir,sub){
  return `<div class="vg-ln"><span><span class="sku">${esq}</span>${sub?`<span class="sub2">${sub}</span>`:''}</span>${dir?`<span class="dir">${dir}</span>`:''}</div>`;
}
function vgColunaLoja(loja,qtd,corpo,vazio){
  return `<div class="vg-col">
    <div class="vg-col-tit"><span>${esc(loja)}</span>${qtd?`<span class="badge">${qtd}</span>`:''}</div>
    ${corpo||`<div class="vg-vazio">${vazio||'Nada por aqui.'}</div>`}
  </div>`;
}
function cardRankingMaisVendidos(){
  const comRanking=state.produtos.filter(p=>p.mlItemId&&Array.isArray(p.mlPosicaoHist)&&p.mlPosicaoHist.length);
  const candidatos=state.produtos.filter(p=>p.mlItemId&&p.mlTagMaisVendido&&typeof p.mlPosicaoCategoria!=='number');
  if(!comRanking.length&&!candidatos.length){
    return `<div class="card-vg"><h3>🏅 Ranking de mais vendidos</h3>
      <p class="sub">Ainda sem leitura. É buscado sozinho no Mercado Livre quando o Doca abre (no máximo 2× por dia); a comparação de subiu/caiu começa na segunda leitura.</p></div>`;
  }
  const medalhados=comRanking.filter(p=>typeof p.mlPosicaoCategoria==='number');
  /* a linha mostra o MOVIMENTO desde a leitura anterior (subiu/caiu/entrou/saiu) embaixo do SKU -
     pedido do Felipe 02/09. O "de N no ranking" saiu: era informação repetida em toda linha e não
     dizia nada de novo. Enquanto só existe 1 leitura, fica "primeira leitura". */
  const linhaProduto=p=>{
    const v=variacaoPosicao(p);
    let mov='<span class="muted" style="font-size:10.5px">primeira leitura</span>';
    if(v){
      if(v.entrou) mov=`<span class="okv" style="font-size:10.5px">🚀 entrou no ranking</span>`;
      else if(v.saiu) mov=`<span class="pend" style="font-size:10.5px">saiu do ranking (era ${v.de}º)</span>`;
      else if(v.delta>0) mov=`<span class="okv" style="font-size:10.5px">▲ subiu ${v.delta} · era ${v.de}º</span>`;
      else if(v.delta<0) mov=`<span class="pend" style="font-size:10.5px">▼ caiu ${Math.abs(v.delta)} · era ${v.de}º</span>`;
      else mov=`<span class="muted" style="font-size:10.5px">manteve a posição</span>`;
    }
    const pos=(typeof p.mlPosicaoCategoria==='number')
      ? `<span style="color:${p.mlPosicaoCategoria<=3?'var(--gold,#d4a83c)':'inherit'}">${p.mlPosicaoCategoria}º</span>` : '—';
    return vgLinha(esc(p.sku),pos,mov);
  };
  return `<div class="card-vg">
    <h3>🏅 Ranking de mais vendidos</h3>
    <p class="sub">Posição entre os mais vendidos da categoria no Mercado Livre · <b>${medalhados.length}</b> com medalha hoje, de ${comRanking.length} anúncio(s) lido(s) · atualizado sozinho ao abrir o Doca.${candidatos.length?` · ${candidatos.length} candidato(s) ao selo.`:''}</p>
    <div class="vg-cols">
      ${STORES.map(loja=>{
        const lista=medalhados.filter(p=>p.loja===loja).sort((a,b)=>a.mlPosicaoCategoria-b.mlPosicaoCategoria);
        const foraAgora=comRanking.filter(p=>p.loja===loja&&typeof p.mlPosicaoCategoria!=='number'&&(()=>{const v=variacaoPosicao(p);return v&&v.saiu;})());
        return vgColunaLoja(loja,lista.length,
          lista.map(linhaProduto).join('')+foraAgora.map(linhaProduto).join(''),
          'Nenhum anúncio no ranking da categoria.');
      }).join('')}
    </div>
  </div>`;
}
function cardConcorrenciaCatalogo(){
  const ps=state.produtos.filter(p=>p.mlItemId&&!p.mlAusente);
  const comConcorrente=ps.filter(p=>typeof p.mlOutrosVendedores==='number'&&p.mlOutrosVendedores>0);
  const perdendo=ps.filter(p=>p.mlConcorrenciaStatus==='losing'&&!(typeof p.mlOutrosVendedores==='number'&&p.mlOutrosVendedores>0));
  const sozinho=ps.filter(p=>p.mlOutrosVendedores===0).length;
  const novos=ps.filter(p=>{ const e=entrouConcorrente(p); return e&&e.entrou; });
  if(!comConcorrente.length&&!perdendo.length&&!sozinho) return '';
  const precos=p=>{
    const partes=[];
    if(typeof p.mlMenorPrecoConcorrente==='number') partes.push('menor deles '+fmtMoney(p.mlMenorPrecoConcorrente));
    else if(typeof p.mlConcorrenciaPreco==='number') partes.push('concorrente '+fmtMoney(p.mlConcorrenciaPreco));
    if(typeof p.mlPreco==='number'&&p.mlPreco>0) partes.push('você '+fmtMoney(p.mlPreco));
    return partes.join(' · ');
  };
  const statusTxt=p=>{
    const e=entrouConcorrente(p);
    if(e&&e.entrou) return '<span class="pend">🚨 entrou agora</span>';
    if(e&&e.saiu) return '<span class="okv">✅ recuperou</span>';
    if(p.mlConcorrenciaStatus==='losing') return '<span class="pend">perdendo</span>';
    if(p.mlConcorrenciaStatus==='sharing_first') return '<span>empatado</span>';
    return '<span class="okv">ganhando</span>';
  };
  return `<div class="card-vg">
    <h3>⚔ Concorrência no catálogo${novos.length?` <span class="badge pend">${novos.length} novo(s)</span>`:''}</h3>
    <p class="sub">Outros vendedores ofertando os mesmos produtos de catálogo que você — inclusive onde você está ganhando a compra${sozinho?` · <b>${sozinho}</b> anúncio(s) sem nenhum concorrente hoje`:''}.</p>
    <div class="vg-cols">
      ${STORES.map(loja=>{
        const lista=comConcorrente.filter(p=>p.loja===loja).sort((a,b)=>b.mlOutrosVendedores-a.mlOutrosVendedores);

/* HISTÓRICO DE CONCORRÊNCIA NO CATÁLOGO (pedido do Felipe 02/09: "consegue trazer no card se algum
   outro vendedor entrou no meu catálogo?"). O status por anúncio já vinha da sincronização
   (price_to_win: 'winning' = você é o dono da compra, 'sharing_first' = empatado, 'losing' =
   alguém está ganhando de você). O que faltava era GUARDAR, pra dar pra dizer "entrou agora" em vez
   de só "está assim hoje". Guarda 1 leitura por dia, 120 dias. */
function registrarConcorrencia(p){
  if(!p||!p.mlItemId) return;
  const d=hoje();
  const st=p.mlConcorrenciaStatus||'winning';
  if(!Array.isArray(p.mlConcHist)) p.mlConcHist=[];
  const ultimo=p.mlConcHist[p.mlConcHist.length-1];
  if(ultimo&&ultimo.data===d){ ultimo.st=st; ultimo.preco=(typeof p.mlConcorrenciaPreco==='number')?p.mlConcorrenciaPreco:null; }
  else p.mlConcHist.push({data:d,st,preco:(typeof p.mlConcorrenciaPreco==='number')?p.mlConcorrenciaPreco:null});
  const limite=_somaDiasISO(d,-120);
  p.mlConcHist=p.mlConcHist.filter(x=>x.data>=limite);
}
/* mudou de "sozinho/ganhando" pra "dividindo/perdendo" desde a leitura anterior = entrou gente */
function entrouConcorrente(p){
  const h=Array.isArray(p&&p.mlConcHist)?p.mlConcHist:[];
  if(h.length<2) return null;
  const atual=h[h.length-1], ant=h[h.length-2];
  const disputado=s=>s==='losing'||s==='sharing_first';
  if(!disputado(ant.st)&&disputado(atual.st)) return {entrou:true,de:ant.st,para:atual.st,desde:ant.data,preco:atual.preco};
  if(disputado(ant.st)&&!disputado(atual.st)) return {saiu:true,de:ant.st,para:atual.st,desde:ant.data};
  if(ant.st==='sharing_first'&&atual.st==='losing') return {piorou:true,de:ant.st,para:atual.st,desde:ant.data,preco:atual.preco};
  return null;
}
/* alimenta automaticamente a mesma lista usada pelo card "No FULL" da Visão Geral (state.full.itens)
   com o que vem da API do Mercado Livre: quantidade "aptas", vendas 7/15/30d (a Previsão de
   reposição e a média ponderada passam a usar isso, igual usariam uma leitura manual do
   painel) e a transferência real entre depósitos do Full.
   O cálculo do "No Full" é sempre aptas+transf, os dois direto da API — nada inferido/guardado
   localmente. O campo "Entrada pendente" (que tentava adivinhar o que já foi confirmado como
   FULL no Doca mas a API ainda não mostrou) foi removido: não tinha fonte confiável (Mercado
   Livre não expõe isso por API) e criava número congelado/errado sempre que algo mudava fora
   do Doca. Pra planejar o próximo envio, o que interessa é "Próximos programados" (envios já
   criados no Doca e ainda não confirmados como FULL — ver entradaPendenteDe/fullCalc), que é
   um dado 100% real, mantido pelo próprio Doca. Assim que um envio é confirmado como FULL, ele
   sai da programação e some do cálculo até a próxima sincronização mostrar ele em aptas/transf
   de verdade — sem precisar adivinhar o estado intermediário. */
/* "Entrada Pendente 2.0" (28/08, pedido do Felipe depois de perguntar "existe possibilidade
   melhor?" da estimativa por delta): calcula, AO VIVO (sem nada guardado/mutado - sempre
   recalculado do zero), quanto ainda falta chegar de cada entrada da fila de "em processamento"
   de um produto (ver confirmarEnvioFull). Antes (v334/v335) isso vinha de comparar o total de
   aptas+transferência subindo desde a última sincronização - funcionava, mas se confundia com
   venda/ajuste acontecendo no meio do caminho (uma venda reduz aptas ao mesmo tempo que uma
   chegada aumenta, mascarando o quanto realmente chegou). Agora usa p.recebimentosFull - o LOG
   REAL de recebimento do galpão Full, vindo direto do Mercado Livre (endpoint
   /stock/fulfillment/operations/search, type=inbound_reception - ver buscarRecebimentosFull no
   server.js), datado e sem ambiguidade nenhuma com venda. Soma os eventos reais desde a data da
   entrada mais antiga da fila, e desconta em ordem (mais antiga primeiro, igual antes). */
function filaProcessamentoComRestante(p){
  const fila=(p&&p.filaProcessamento)||[];
  if(!fila.length) return [];
  const dataMaisAntiga=fila[0].data;
  const eventos=(p.recebimentosFull||[]).filter(e=>e.data>=dataMaisAntiga);
  let recebido=eventos.reduce((s,e)=>s+(Number(e.qtd)||0),0);
  return fila.map(entrada=>{
    const qtdOriginal=entrada.qtdOriginal!=null?entrada.qtdOriginal:(entrada.qtdRestante||0);
    const consumido=Math.min(recebido,qtdOriginal);
    recebido-=consumido;
    return {data:entrada.data,qtdOriginal,qtdRestante:Math.max(0,qtdOriginal-consumido)};
  });
}
function mlAtualizarFullDoSinc(p,item,loja){
  let fi=state.full.itens.find(x=>x.loja===loja&&fullProduto(x)&&fullProduto(x).id===p.id);
  if(!fi){
    fi={id:gerarId('fi'),loja,sku:p.sku,codigo:p.codigo||'',produtoId:p.id,
      v7:0,v15:0,v30:0,aptas:0,aCaminho:0,transf:0,mediaFixa:null,ajuste:null,movido:null};
    state.full.itens.push(fi);
  }
  const transferido=(typeof item.transferencia_full==='number')?item.transferencia_full:0;
  fi.aptas=item.quantidade_disponivel||0;
  fi.v7=(typeof item.vendas_7d==='number')?item.vendas_7d:(fi.v7||0);
  fi.v15=(typeof item.vendas_15d==='number')?item.vendas_15d:(fi.v15||0);
  fi.v30=(typeof item.vendas_30d==='number')?item.vendas_30d:(fi.v30||0);
  fi.transf=transferido;
  fi.aCaminho=transferido;
  fi.aCaminhoFonte='api';
  fi.confirmadoNaoVerificado=0;
  fi.movido=null;
  state.full.lidoEm[loja]=Date.now();
  // "Entrada Pendente 2.0" (28/08, 3ª volta): guarda o log real de recebimento (só vem preenchido
  // quando esse item estava na lista "pendentes" do /sync - ver mlSincronizarLoja) e poda a fila de
  // "envios confirmados, aguardando o ML registrar" (ver confirmarEnvioFull) por prazo de segurança
  // - 5 dias (Felipe, 21/08) - ou por já ter chegado tudo de verdade (ver filaProcessamentoComRestante,
  // que faz a conta real agora sem se confundir com venda no meio do caminho, ao contrário da
  // versão anterior por delta de aptas+transferência).
  if(Array.isArray(item.recebimentos_full)) p.recebimentosFull=item.recebimentos_full;
  if(p.filaProcessamento&&p.filaProcessamento.length){
    p.filaProcessamento=filaProcessamentoComRestante(p)
      .filter(entrada=>{
        const diasDesde=(Date.now()-Date.parse(entrada.data+'T00:00:00-03:00'))/864e5;
        return entrada.qtdRestante>0.5&&diasDesde<=5;
      })
      .map(({data,qtdOriginal})=>({data,qtdOriginal}));
  }
}
/* chama o backend hospedado: primeiro manda sincronizar (POST /sync), depois busca o resultado (GET /data) */
async function mlSincronizarLoja(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro (ex: https://doca-sync.onrender.com).');
  /* "Entrada Pendente 2.0" (28/08): avisa o backend quais produtos têm algo "em processamento"
     (envio confirmado como FULL, aguardando o ML - ver confirmarEnvioFull) pra ele só gastar a
     chamada extra do log real de recebimento (buscarRecebimentosFull) nesses - resto do catálogo
     não tem nada pendente na maior parte do tempo, não faz sentido consultar sempre. */
  const pendentes=state.produtos.filter(p=>p.loja===loja&&p.mlItemId&&p.filaProcessamento&&p.filaProcessamento.length).map(p=>p.mlItemId);
  const qsPendentes=pendentes.length?`&pendentes=${encodeURIComponent(pendentes.join(','))}`:'';
  const rSync=await fetch(`${base}/sync?loja=${encodeURIComponent(loja)}${qsPendentes}`,{method:'POST'});
  let jSync; try{ jSync=await rSync.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+rSync.status+'). Confira a URL.'); }
  if(!rSync.ok||!jSync.ok) throw new Error(jSync.erro||('Falha ao sincronizar (status '+rSync.status+').'));
  const rData=await fetch(`${base}/data?loja=${encodeURIComponent(loja)}`);
  let jData; try{ jData=await rData.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado ao buscar os dados.'); }
  if(!rData.ok||!jData.ok) throw new Error(jData.erro||'Falha ao buscar os dados sincronizados.');
  return jData;
}
/* sincroniza o financeiro (saldo Mercado Pago + a receber) de 1 loja com o backend. Os
   relatórios do Mercado Pago são assíncronos (pedem minutos pra ficar prontos), então cada
   chamada tenta TERMINAR o pedido anterior e/ou começar um novo — o valor só troca de verdade
   quando um pedido anterior finalmente fica pronto, por isso guarda sempre o "atualizado em"
   junto (ver aplicarSincronizacaoFinanceira). Se a loja não tem token do Mercado Pago
   configurado no backend, o retorno vem com configurado:false e essa loja simplesmente
   continua com os campos manuais — não é erro. */
async function mpSincronizarFinanceiro(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro.');
  const r=await fetch(`${base}/financeiro/mp/sincronizar?loja=${encodeURIComponent(loja)}`,{method:'POST'});
  let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado ao sincronizar o financeiro.'); }
  if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao sincronizar o financeiro (status '+r.status+').'));
  return j;
}
/* aplica o resultado de mpSincronizarFinanceiro no state — só sobrescreve o número quando o
   backend realmente tem um valor lido (saldoDisponivel/aReceber não nulos); enquanto o
   primeiro relatório ainda não processou, mantém o que já estava (0 ou o que foi digitado
   manualmente antes de ligar a automação) e só liga a marcação de "automático". */
function aplicarSincronizacaoFinanceira(loja,j){
  if(!j||!j.configurado) return;
  const f=finLoja(loja);
  f.mpAutomatico=true;
  /* Number(...) aqui é proposital: o backend pode devolver esses valores como texto
     (coluna "numeric" do Postgres vira string), e "3310"+"2716.3" em JS gruda os dígitos
     em vez de somar, gerando um patrimônio absurdo. Nunca confiar que a API manda number. */
  if(j.saldoDisponivel!=null){
    /* fechamento diário do saldo MP (28/08, pedido do Felipe - calibrado com extrato real da
       TorvStore de 27/08). Antes a "Estimativa — Fim do Dia" somava a agenda de hoje em cima do
       saldo sincronizado HOJE - mas esse saldo pode já incluir PARTE do movimento de hoje (o
       relatório de saldo e o de agenda saem do Mercado Pago em horários diferentes), contando a
       mesma liberação 2x. Erro medido nesse dia real: R$1.991 (6,8%). Guardando aqui o ÚLTIMO
       saldo conhecido de CADA dia (antes de virar o dia seguinte), a estimativa passa a somar a
       agenda de hoje em cima do FECHAMENTO DE ONTEM - que por construção nunca tem nada de hoje
       dentro, então não tem como dar dupla contagem. Validado no mesmo dia real: erro caiu pra
       R$24 (0,08%). Guarda só os últimos 14 dias (só precisa de ontem, o resto é peso morto). */
    if(f.mpAtualizadoEm){
      const dOld=new Date(f.mpAtualizadoEm);
      const diaOld=_dataISO(dOld.getFullYear(),dOld.getMonth(),dOld.getDate());
      let diaNovo=hoje();
      if(j.saldoAtualizadoEm){ const dN=new Date(j.saldoAtualizadoEm); if(!isNaN(dN.getTime())) diaNovo=_dataISO(dN.getFullYear(),dN.getMonth(),dN.getDate()); }
      if(diaOld<diaNovo){
        if(!f.fechamentoDiario) f.fechamentoDiario={};
        f.fechamentoDiario[diaOld]=f.mercadoPago;
        const limite=_somaDiasISO(diaNovo,-14);
        Object.keys(f.fechamentoDiario).forEach(d=>{ if(d<limite) delete f.fechamentoDiario[d]; });
      }
    }
    f.mercadoPago=Number(j.saldoDisponivel)||0; f.mpAtualizadoEm=j.saldoAtualizadoEm||null;
  }
  if(j.aReceber!=null){ f.aReceber=Number(j.aReceber)||0; f.aReceberAtualizadoEm=j.aReceberAtualizadoEm||null; }
  /* agenda de liberações (pra Fluxo de Caixa, 23/08): datas em que o dinheiro pendente no MP vai
     ficar disponível pra usar - [{data,valor}], já vem ordenada por data do backend. */
  if(Array.isArray(j.agendaLiberacoes)) f.agendaLiberacoes=j.agendaLiberacoes.map(x=>({data:x.data,valor:Number(x.valor)||0}));
  /* prazo de liberação empírico + receita diária média (27/08, coluna "Projetado" do Fluxo de
     Caixa) - calculados no backend a partir do relatório real de "dinheiro em conta" da própria
     loja (ver passoAReceberMp em server.js). */
  if(j.prazoLiberacaoDias!=null){ f.prazoLiberacaoDias=Number(j.prazoLiberacaoDias)||null; }
  if(j.receitaDiariaMedia!=null){ f.receitaDiariaMedia=Number(j.receitaDiariaMedia)||null; f.receitaAtualizadoEm=j.receitaAtualizadoEm||null; }
  persist();
}
/* aplica os dados de 1 anúncio sincronizado no SKU do Doca que já está vinculado a ele —
   usado tanto no vínculo automático (por mlItemId/SKU) quanto no manual e na importação,
   pra não ter a mesma lista de campos copiada em 3 lugares */
function aplicarItemSincronizado(p,item,loja){
  p.mlItemId=item.ml_item_id;
  p.mlQtdDisponivel=item.quantidade_disponivel;
  /* preço atual do anúncio - já vinha do backend (coluna preco de ml_produtos), só não era
     guardado. Usado na meta de TACOS por produto (ver metaTacosPorProduto), pedido do Felipe
     02/09: a meta tem que sair do preço do anúncio, não da média do que já foi vendido. */
  p.mlPreco=(typeof item.preco==='number')?item.preco:(item.preco!=null?Number(item.preco)||null:null);
  p.mlAtualizadoEm=item.atualizado_em;
  p.mlStatus=item.status||null;
  p.mlCatalogo=!!item.catalog_listing;
  p.mlConcorrenciaStatus=item.concorrencia_status||null;
  p.mlConcorrenciaPreco=(typeof item.concorrencia_preco==='number')?item.concorrencia_preco:null;
  registrarConcorrencia(p);   /* forma o histórico do card "entrou no meu catálogo" */
  p.mlPerguntas=item.perguntas_sem_resposta||0;
  p.mlTransferencia=(typeof item.transferencia_full==='number')?item.transferencia_full:null;
  p.mlAusente=false; p.mlAusenteDesde=null;
  mlAtualizarFullDoSinc(p,item,loja);
}
/* depois de aplicar a sincronização, marca como "ausente no ML" todo produto desta loja que já
   teve um anúncio vinculado (mlItemId) mas não veio na resposta desta sincronização - ou seja,
   o anúncio foi excluído/encerrado no Mercado Livre. Não apaga o cadastro (custo, fornecedor,
   histórico de compra continuam), só marca pra sumir das listas ativas (Produtos, Previsão etc)
   até você decidir o que fazer. Se o produto reaparecer numa sincronização futura, a marca sai
   sozinha (ver aplicarItemSincronizado acima). */
function marcarAusentesNoML(loja,itensDoResultado){
  // trata item com status "closed" como se nao tivesse vindo na sincronizacao - o Mercado Livre as
  // vezes ainda devolve o anuncio encerrado por um tempo na listagem de itens do vendedor, mas pra
  // nos ele ja era (nao vai vender mais); sem isso, um anúncio recem-encerrado continuava aparecendo
  // como se estivesse ativo, escondendo do "mlAusente" (achado com dado real do Felipe, 21/08).
  const encontrados=new Set((itensDoResultado||[]).filter(it=>it.status!=='closed').map(it=>it.ml_item_id));
  let mudou=false;
  state.produtos.filter(p=>p.loja===loja&&p.mlItemId).forEach(p=>{
    const ausenteAgora=!encontrados.has(p.mlItemId);
    if(ausenteAgora&&!p.mlAusente){ p.mlAusente=true; p.mlAusenteDesde=Date.now(); mudou=true; }
  });
  return mudou;
}
/* cadastra no Doca, sozinho, um anúncio do ML que ainda não tem SKU correspondente — usa o
   SKU do próprio anúncio (ou o ID do anúncio, se não tiver SKU) como SKU do Doca e o título
   do anúncio como Código, com custo/fornecedor em branco pra completar depois. Se por acaso já
   existir um produto com esse SKU nessa loja (corrida entre duas sincronizações, por ex.),
   reaproveita em vez de duplicar. */
function importarProdutoAutomatico(item,loja){
  const skuGerado=(item.sku||item.ml_item_id).toUpperCase();
  let p=state.produtos.find(x=>x.loja===loja&&(x.sku||'').toUpperCase()===skuGerado);
  if(!p){
    p=addProduto({loja,sku:skuGerado,codigo:item.titulo||'',fornecedor:'',custo:0,estoqueMinimo:0,
      qtd:{comprar:0,coletar:0,local:0},lotes:[],pedidos:[],obsCompra:'Importado automaticamente do Mercado Livre.'});
  }
  aplicarItemSincronizado(p,item,loja);
  return p;
}
/* casa cada anúncio do resultado com o SKU certo (por mlItemId salvo, ou por SKU quando bate);
   o que não bater com nada é cadastrado sozinho no Doca (ver importarProdutoAutomatico) — não
   precisa importar manualmente cada anúncio novo. Usado tanto pelo modal quanto pela
   sincronização automática ao abrir o Doca. */
function aplicarSincronizacaoAutomatica(resultado){
  const produtosDaLoja=state.produtos.filter(p=>p.loja===resultado.loja);
  let vinculados=0,importados=0;
  resultado.produtos.forEach(item=>{
    let p=produtosDaLoja.find(x=>x.mlItemId===item.ml_item_id);
    if(!p&&item.sku) p=produtosDaLoja.find(x=>!x.mlItemId&&x.sku&&x.sku.toLowerCase()===item.sku.toLowerCase());
    if(p){ aplicarItemSincronizado(p,item,resultado.loja); vinculados++; }
    else { p=importarProdutoAutomatico(item,resultado.loja); produtosDaLoja.push(p); importados++; }
  });
  const mudouAusentes=marcarAusentesNoML(resultado.loja,resultado.produtos);
  if(vinculados>0||importados>0||mudouAusentes) persist();
  return {vinculados,importados};
}

          <td class="num">${fi?(()=>{const tot=fk.full-(fi.aptas||0); return `<span class="det">${fmtInt(tot)}<span class="i">i</span><span class="pop">

  document.getElementById('filtroLoja').onchange=e=>{ filtro.loja=e.target.value; renderProdutos(); };
  const filtroMostrarAusentes=document.getElementById('filtroMostrarAusentes');
  if(filtroMostrarAusentes) filtroMostrarAusentes.onchange=e=>{ filtro.mostrarAusentes=e.target.checked; renderProdutos(); };
  document.getElementById('filtroBusca').oninput=e=>{
    filtro.busca=e.target.value;
    const pos=e.target.selectionStart;
    renderProdutos();
    /* renderProdutos recria o <input> do zero (reescreve o innerHTML inteiro) - sem isso o
       campo perdia o foco a cada letra digitada, deixando so digitar 1 caractere por vez. */
    const novo=document.getElementById('filtroBusca');
    if(novo){ novo.focus(); novo.setSelectionRange(pos,pos); }
  };
  document.getElementById('btnNovoSku').onclick=()=>openProdutoModal(null,filtro.loja!=='todas'?filtro.loja:null);

  document.getElementById('btnSyncML').onclick=abrirSincronizacaoML;

  el.querySelectorAll('[data-verres]').forEach(b=>b.onclick=()=>openOndeReservadoModal(b.dataset.verres));
}
/* mostra em quais envios o SKU está reservado */
function openOndeReservadoModal(id){
  const p=prodById(id);
  const linhas=[];
  state.envios.forEach(e=> e.itens.forEach(i=>{
    if(i.produtoId!==id) return;
    if((i.alocado||0)+(i.reservadoColeta||0)<=0) return;
    linhas.push({e,i});
  }));
  const body=openModal(false);
  body.innerHTML=`<h3>Onde ${esc(p.sku)} está reservado</h3>
    ${linhas.length?`<div class="table-wrap"><table class="tbl-produtos"><thead><tr>
      <th>Envio</th><th>Loja</th><th>No galpão</th><th>A coletar</th><th>Total</th></tr></thead><tbody>
      ${linhas.map(({e,i})=>`<tr><td>${esc(e.nome)}</td><td><span class="loja-tag">${esc(e.loja)}</span></td>
        <td class="num okv">${fmtInt(i.alocado||0)}</td><td class="num ${i.reservadoColeta?'cam':''}">${fmtInt(i.reservadoColeta||0)}</td>
        <td class="num">${fmtInt((i.alocado||0)+(i.reservadoColeta||0))}</td></tr>`).join('')}
      <tr><td colspan="4" style="text-align:right"><b>Total reservado</b></td><td class="num"><b>${fmtInt(reservadoDe(p))}</b></td></tr>
    </tbody></table></div>
    <p class="hint">Para liberar, cancele o envio ou remova este SKU dele na aba <b>Envios FULL</b>.</p>`
    :`<p class="empty-inline">Este SKU não está reservado em nenhum envio.</p>`}
    <div class="modal-actions"><button class="btn" id="btnFechar">Fechar</button></div>`;
  document.getElementById('btnFechar').onclick=closeModal;
}
/* ---------- conferência mensal de estoque ---------- */
function imprimirConferenciaEstoque(){
  const lojas = filtro.loja==='todas' ? STORES : [filtro.loja];
  const dados = lojas.map(loja=>({loja, itens: state.produtos.filter(p=>p.loja===loja&&(totalNoGalpao(p)>0||p.qtd.coletar>0))
    .sort((a,b)=>(a.fornecedor||'').localeCompare(b.fornecedor||'')||a.sku.localeCompare(b.sku)),
    /* SKUs vinculados (estoque fisico compartilhado) nao entram como linha propria - ja' estao
       contados dentro do SKU mestre. Sem essa lista, o SKU simplesmente sumia da folha impressa
       sem explicacao nenhuma, dando a entender que sumiu do sistema por engano. */
    vinculados: state.produtos.filter(p=>p.loja===loja&&p.vinculadoA)
      .map(p=>({p,mestre:prodById(p.vinculadoA)})).filter(x=>x.mestre)
      .sort((a,b)=>a.p.sku.localeCompare(b.p.sku))
    })).filter(d=>d.itens.length||d.vinculados.length);
  if(!dados.length){ alert('Não há estoque no galpão nem a coletar para conferir.'); return; }
  const win=window.open('','_blank');
  if(!win){ alert('Não foi possível abrir a janela do relatório. Verifique o bloqueador de pop-up.'); return; }
  win.document.open();
  win.document.write(`<!doctype html><html><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conferência de Estoque</title>
    <style>${relatorioDarkCss()}
      .loja-h{font-weight:700;font-size:14.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px}
      td.box-cell{width:52px}
      .tot{font-size:12px;text-align:right;color:var(--muted);margin-top:6px}
      .quebra{page-break-after:always}
    </style></head><body>
    <h1>Conferência de Estoque</h1>
    <div class="sub">Gerado em ${new Date().toLocaleString('pt-BR')}</div>
    <div class="assin">Conferido por: ______________________________<br>Data da contagem: ______ / ______ / __________</div>
    ${dados.map((d,idx)=>{
      const tg=d.itens.reduce((a,p)=>a+totalNoGalpao(p),0);
      const tc=d.itens.reduce((a,p)=>a+p.qtd.coletar,0);
      return `<div class="card-rel">
      <div class="loja-h">${esc(d.loja)}</div>
      <div class="tbl-scroll"><table><thead><tr>
        <th>SKU</th><th>Código</th><th>Fornecedor</th>
        <th class="n">No galpão</th><th>Contado</th><th>Difer.</th>
        <th class="n">A coletar</th><th>Contado</th><th>Difer.</th>
      </tr></thead><tbody>
      ${d.itens.map(p=>`<tr>
        <td>${esc(p.sku)}</td><td>${esc(p.codigo)}</td><td>${esc(p.fornecedor)||'—'}</td>
        <td class="n">${fmtInt(totalNoGalpao(p))}</td><td class="box-cell"><span class="box"></span></td><td class="box-cell"><span class="box"></span></td>
        <td class="n">${fmtInt(p.qtd.coletar)}</td><td class="box-cell"><span class="box"></span></td><td class="box-cell"><span class="box"></span></td>
      </tr>`).join('')}
      </tbody></table></div>
      <div class="tot">total no galpão: ${fmtInt(tg)} un. · total a coletar: ${fmtInt(tc)} un.</div>
      ${d.vinculados.length?`<div class="rod" style="margin-top:8px">${d.vinculados.map(v=>`<div>ℹ ${esc(v.p.sku)} (${esc(v.p.codigo)||'—'}) está vinculado ao estoque de <b>${esc(v.mestre.sku)}</b> — já contado na linha dele, não precisa contar separado.</div>`).join('')}</div>`:''}
      </div>
      ${idx<dados.length-1?'<div class="quebra"></div>':''}`;
    }).join('')}
    <div class="rod">Preencha a coluna <b>Contado</b> com a quantidade física encontrada e anote a diferença. Depois lance os ajustes no sistema em Produtos → Gerenciar → Ajuste manual de estoque.<br>
    Atenção: a coluna "No galpão" inclui o que já está etiquetado para envios FULL — conte tudo que estiver fisicamente no galpão.</div>
    <div class="share-box no-print">
      <button class="btn-share" onclick="window.print()">🖨️ Imprimir (pra contagem no papel)</button>
    </div>
    ${relatorioShareBoxHtml()}
    <div class="gerado">Doca · Conferência de Estoque</div>
    <script>${relatorioShareScript('Conferência de Estoque')}<\/script>
    </body></html>`);
  win.document.close();
}
