/* ---------- Ads: puxado direto da API (Product Ads / Mercado Ads) ----------
   Substitui o renderAds() manual acima (ficou parado, sem uso, caso algum pedaço da análise
   dele — scores, sugestões etc — sirva de referência depois). Por enquanto só mostra tudo que
   a API devolve, sem calcular nada por cima: filtros e cálculos entram numa etapa seguinte,
   depois de decidirmos o que faz sentido com dado real na mão. */
function adsApiLoja(loja){
  if(!state.adsApi) state.adsApi={};
  if(!state.adsApi[loja]) state.adsApi[loja]={advertiserId:null,siteId:null,atualizadoEm:null,periodos:{}};
  if(!state.adsApi[loja].manualLostRank) state.adsApi[loja].manualLostRank={};
  if(!state.adsApi[loja].tagMaisVendido) state.adsApi[loja].tagMaisVendido={};
  return state.adsApi[loja];
}
async function adsSincronizarLoja(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
  const rSync=await fetch(`${base}/ads/sync?loja=${encodeURIComponent(loja)}`,{method:'POST'});
  let jSync; try{ jSync=await rSync.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado ao sincronizar Ads (status '+rSync.status+').'); }
  if(!rSync.ok||!jSync.ok) throw new Error(jSync.erro||('Falha ao sincronizar Ads (status '+rSync.status+').'));
  const rData=await fetch(`${base}/ads/data?loja=${encodeURIComponent(loja)}`);
  let jData; try{ jData=await rData.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado ao buscar os dados de Ads.'); }
  if(!rData.ok||!jData.ok) throw new Error(jData.erro||'Falha ao buscar os dados de Ads sincronizados.');
  const alvo=adsApiLoja(loja);
  alvo.periodos=jData.periodos||{};
  alvo.atualizadoEm=jData.atualizadoEm;
  persist();
  return jData;
}
/* TACOS (Total Advertising Cost of Sale) = custo do anúncio dividido pela receita TOTAL do
   produto anunciado (venda atribuída ao anúncio + venda orgânica dele) — diferente do ACOS,
   que só considera a venda atribuída ao anúncio. A API de Ads não devolve isso pronto (só
   ACOS/ROAS), então calculamos a partir do que ela devolve. */
function calcTacos(m){
  const receita=(m.total_amount||0)+(m.organic_units_amount||0);
  return receita>0?(m.cost||0)/receita*100:0;
}
/* "Aporte para publicidade" = o mesmo texto/percentual que aparece no painel oficial do Mercado
   Ads ("Seus anúncios patrocinados geram X% das vendas totais dos seus anúncios divulgados").
   Confirmado batendo com dado real: campanha CABO MICKEY, 7 dias — units_quantity:50,
   organic_items_quantity:23 → 50/(50+23)=68,49% ≈ os 68% mostrados no painel deles. */
function calcAporteAds(m){
  const vendasAds=m.units_quantity||0, outrasVendas=m.organic_items_quantity||0;
  const total=vendasAds+outrasVendas;
  return total>0?vendasAds/total*100:0;
}
/* seta comparando o valor atual com o de um período mais longo (ex.: 7d vs 30d) — verde quando
   melhora, vermelho quando piora; maiorMelhor diz se, pra essa métrica, subir é bom (ROAS/CTR/
   CVR) ou ruim (TACOS/ACOS) */
function setaTrendAds(atual,base,maiorMelhor){
  if(base==null||!isFinite(base)) return '';
  const diff=atual-base;
  if(Math.abs(diff)<0.05) return ' <span class="muted" style="font-size:10px">=</span>';
  const melhorou=maiorMelhor?diff>0:diff<0;
  return ` <span class="${melhorou?'okv':'pend'}" style="font-size:10px">${diff>0?'▲':'▼'}</span>`;
}
/* ---------- sugestão "subir ROAS" (regra combinada com o usuário — ver
   regras_sugestao_roas_ads.md pra descrição completa de cada critério) ----------
   Reescrita pra 6 critérios, SEMPRE em cima dos últimos 7 dias (não muda com o período
   selecionado na tela) - as tendências (critérios 5 e 6) comparam contra 15d E 30d juntos. */
function percentilAds(valores,p){
  const ord=valores.filter(v=>v!=null&&isFinite(v)).sort((a,b)=>a-b);
  if(!ord.length) return null;
  const idx=Math.min(ord.length-1,Math.floor(p*ord.length));
  return ord[idx];
}
/* avalia os 6 critérios pra TODAS as campanhas de 1 loja de uma vez (sempre com base nos
   últimos 7 dias), porque o critério de CVR alto só faz sentido comparando uma campanha com
   as outras da MESMA loja/período - por isso o percentil é calculado 1x em cima do conjunto
   inteiro. Devolve um Map campanhaId -> {score (0-100), criterios:[6 booleans], vendasDia}. */
function avaliarSugestoesRoas7d(loja,dados){
  const p7=dados.periodos.d7, p15=dados.periodos.d15, p30=dados.periodos.d30;
  const campanhas7=(p7&&p7.results)||[];
  const mapa15={}, mapa30={};
  ((p15&&p15.results)||[]).forEach(cp=>mapa15[cp.id]=cp.metrics||{});
  ((p30&&p30.results)||[]).forEach(cp=>mapa30[cp.id]=cp.metrics||{});
  const cvrs=campanhas7.map(cp=>(cp.metrics||{}).cvr).filter(v=>v!=null&&v>0);
  const p75Cvr=percentilAds(cvrs,0.75);
  const resultado=new Map();
  campanhas7.forEach(camp=>{
    const m=camp.metrics||{};
    const m15=mapa15[camp.id], m30=mapa30[camp.id];
    const vendasTotal=(m.units_quantity||0)+(m.organic_units_quantity||0);
    const vendasDia=vendasTotal/7;
    const tacos7=calcTacos(m);
    const tacos15=m15?calcTacos(m15):null;
    const tacos30=m30?calcTacos(m30):null;
    const cvr7=m.cvr||0, cvr15=m15?(m15.cvr||0):null, cvr30=m30?(m30.cvr||0):null;
    const criterios=[
      m.roas!=null&&camp.roas_target!=null&&m.roas>camp.roas_target,          // 1. ROAS real > objetivo
      m.sov!=null&&m.sov>50,                                                  // 2. Ganho de Leilões > 50%
      vendasDia>=10,                                                          // 3. 10 vendas/dia (orgânica+ads)
      p75Cvr!=null&&cvr7>=p75Cvr,                                             // 4. CVR alto vs. outras campanhas
      (tacos15!=null&&tacos7<tacos15)&&(tacos30!=null&&tacos7<tacos30),       // 5. TACOS caindo vs. 15d E 30d
      (cvr15!=null&&cvr7>=cvr15-0.05)&&(cvr30!=null&&cvr7>=cvr30-0.05)        // 6. CVR subindo ou igual vs. 15d E 30d
    ];
    const score=criterios.filter(Boolean).length/6*100;
    resultado.set(camp.id,{score,criterios,vendasDia,tacos:tacos7});
  });
  return resultado;
}
function renderAds(){

  /* período de comparação pras setas: sempre o de 30 dias (a "base"), exceto quando já
     estamos vendo 30 dias — aí não tem um período maior pra comparar */
  const periodoComp=adsPeriodoApi==='d30'?null:'d30';
  const dadosComp=periodoComp?dados.periodos[periodoComp]:null;
  const mapaComp={};
  if(dadosComp) (dadosComp.results||[]).forEach(camp=>mapaComp[camp.id]=camp.metrics||{});
  /* sugestão "subir ROAS" - sempre calculada em cima dos últimos 7 dias, independente do
     período escolhido pra ver o resto da tabela (ver avaliarSugestoesRoas7d) */
  const avalAtual=avaliarSugestoesRoas7d(c.loja,dados);

  let linhas=campanhas.map(camp=>{
    const m=camp.metrics||{};
    const tacos=calcTacos(m);
    return {camp,m,tacos};
  });
  if(adsFiltro==='tacos_desc') linhas=linhas.slice().sort((a,b)=>b.tacos-a.tacos);
  else if(adsFiltro==='tacos_asc') linhas=linhas.slice().sort((a,b)=>a.tacos-b.tacos);
  else if(adsFiltro==='custo_desc') linhas=linhas.slice().sort((a,b)=>(b.m.cost||0)-(a.m.cost||0));
  else if(adsFiltro==='roas_score'){
    const nota=x=>{ const av=avalAtual.get(x.camp.id); return av?av.score:-1; };

    const diasPeriodo={d7:7,d15:15,d30:30}[adsPeriodoApi]||7;

      <div class="acoes-linha" style="margin-top:14px;flex-wrap:wrap">

        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)">Filtro
          <select id="adFiltro" style="width:auto;font-size:12.5px;padding:6px 8px">
            <option value="tacos_desc" ${adsFiltro==='tacos_desc'?'selected':''}>Maior TACOS</option>
            <option value="tacos_asc" ${adsFiltro==='tacos_asc'?'selected':''}>Menor TACOS</option>
            <option value="custo_desc" ${adsFiltro==='custo_desc'?'selected':''}>Maior custo</option>

/* ================= Finanças (despesas + histórico mensal, base pra DRE) =================
   Guarda as despesas do negócio (manuais ou puxadas automaticamente do Mercado Livre) com data de
   pagamento, se já foi pago, e se é recorrente (repete todo mês). Despesa recorrente marcada como
   paga não "some" nem "vira" o mês que vem — ela fica registrada naquele mês (pro histórico) e uma
   NOVA ocorrência é criada pro mês seguinte, ligada pelo campo origemRecorrenciaId. Ainda não inclui
   receita/faturamento automaticamente — só o lado das despesas, que é o que foi pedido por ora. */
function despesasArr(){ if(!Array.isArray(state.despesas)) state.despesas=[]; return state.despesas; }
function addDespesa({descricao,valor,dataPagamento,recorrente,loja,origem,faturaKey}){
  snapshot('nova despesa'+(descricao?' ("'+descricao.slice(0,30)+'")':''));
  const arr=despesasArr();
  const d={id:gerarId('desp'),descricao:(descricao||'').trim(),valor:Number(valor)||0,dataPagamento:dataPagamento||hoje(),
    pago:false,recorrente:!!recorrente,loja:loja||null,origem:origem||'manual',faturaKey:faturaKey||null,
    origemRecorrenciaId:null,criadoEm:Date.now()};
  arr.push(d);
  persist();
  return d;
}
function excluirDespesa(id){
  const arr=despesasArr();
  const d=arr.find(x=>x.id===id); if(!d) return;
  snapshot('exclusão de despesa ("'+(d.descricao||'').slice(0,30)+'")');
  state.despesas=arr.filter(x=>x.id!==id);
  persist();
}
/* marca pago/pendente; se for recorrente e estiver marcando como PAGO, gera a proxima ocorrência
   (mês seguinte) automaticamente, se ainda não existir - assim o histórico do mês atual fica
   preservado e a despesa continua "viva" pro mês que vem */
function marcarDespesaPaga(id,pago){
  const arr=despesasArr();
  const d=arr.find(x=>x.id===id); if(!d) return;
  snapshot((pago?'despesa paga: ':'despesa marcada como pendente: ')+(d.descricao||''));
  d.pago=!!pago;
  if(pago&&d.recorrente){
    const serieId=d.origemRecorrenciaId||d.id;
    const proxData=proximoMes(d.dataPagamento);
    const jaExiste=arr.some(x=>(x.origemRecorrenciaId||x.id)===serieId&&x.dataPagamento===proxData);
    if(!jaExiste){
      arr.push({id:gerarId('desp'),descricao:d.descricao,valor:d.valor,dataPagamento:proxData,
        pago:false,recorrente:true,loja:d.loja,origem:d.origem,faturaKey:null,origemRecorrenciaId:serieId,criadoEm:Date.now()});
    }
  }
  persist();
}
/* busca a fatura mais recente do Mercado Livre (taxas de venda/anúncio/Full - não é o saldo do
   Mercado Pago) e cadastra/atualiza como despesa recorrente automaticamente, evitando duplicar
   pelo par loja+faturaKey (a "key" que o próprio ML usa pra identificar o período de cobrança) */
let financasUltimoErroAuto={}; // loja -> mensagem do último erro da tentativa AUTOMÁTICA de puxar a fatura (não persistido — só pra visibilidade nesta sessão, sem precisar abrir o console do navegador)
function sleep(ms){ return new Promise(res=>setTimeout(res,ms)); }
async function puxarFaturaMl(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
  const r=await fetch(`${base}/financas/fatura-ml?loja=${encodeURIComponent(loja)}`);
  let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+r.status+').'); }
  if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao buscar a fatura do Mercado Livre (status '+r.status+').'));
  if(!j.fatura) throw new Error('Nenhuma fatura encontrada pra essa loja ainda.');
  const f=j.fatura;
  const arr=despesasArr();
  // sem data de vencimento confiável (período ainda em aberto, ML não fechou a conta) usa hoje
  // só pra a despesa aparecer no mês certo — não inventa uma data de vencimento que não existe
  const dataPagamento=f.vencimento||hoje();
  let d=arr.find(x=>x.origem==='ml_fatura'&&x.loja===loja&&x.faturaKey===f.key);
  if(d){
    snapshot('atualização da fatura do Mercado Livre ('+loja+')');
    d.valor=f.valor; d.dataPagamento=dataPagamento; d.itens=f.itens||[]; d.valorTotal=f.valorTotal; d.itensAviso=f.itensAviso||null;
    if(f.valorPendente===0) d.pago=true;
  }else{
    snapshot('fatura do Mercado Livre importada ('+loja+')');
    arr.push({id:gerarId('desp'),descricao:'Fatura Mercado Livre — '+loja,valor:f.valor,dataPagamento,
      pago:f.valorPendente===0,recorrente:true,loja,origem:'ml_fatura',faturaKey:f.key,origemRecorrenciaId:null,
      itens:f.itens||[],valorTotal:f.valorTotal,itensAviso:f.itensAviso||null,criadoEm:Date.now()});
  }
  delete financasUltimoErroAuto[loja];
  persist();
  return f;
}
/* tenta de novo com espera crescente quando o Mercado Livre responde 429 (limite de chamadas por
   segundo) — descoberto ao puxar a fatura das 4 lojas em paralelo assim que o Doca abre, que às
   vezes estourava o limite. Erros de outro tipo (sem fatura, backend fora do ar etc.) não têm
   novo motivo pra dar certo numa tentativa a mais, então sobem direto. */
async function puxarFaturaMlComRetry(loja,tentativa){
  tentativa=tentativa||0;
  try{
    return await puxarFaturaMl(loja);
  }catch(e){
    if(/\b429\b/.test(e.message)&&tentativa<3){
      await sleep(1200*Math.pow(2,tentativa));
      return puxarFaturaMlComRetry(loja,tentativa+1);
    }
    throw e;
  }
}
/* explica em português simples cada categoria de cobrança que vem no detalhamento da fatura do
   ML (vindo do /summary da API de Billing) - os rótulos que o próprio ML manda variam um pouco
   de conta pra conta, então casa por palavra-chave (sem acento, minúsculo) em vez de comparar o
   texto inteiro. Cobre publicidade/Ads, comissão de venda, envio/frete, parcelamento, Full
   (armazenagem/coleta), devolução, reembolso/estorno e bonificação - o resto cai num texto
   genérico em vez de ficar mudo. */
function normalizarTexto(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function explicarCobrancaML(label){
  const t=normalizarTexto(label);
  if(t.includes('bonific')) return 'Valor que o próprio Mercado Livre devolveu pra você (ex: comissão ou taxa estornada).';
  if(t.includes('devolu')) return 'Ajuste referente a um produto devolvido pelo comprador.';
  if(t.includes('reembols')||t.includes('estorno')) return 'Valor reembolsado por cancelamento ou estorno de uma venda.';
  if(t.includes('public')||t.includes('campanha')||t.includes('ads')) return 'Custo dos anúncios patrocinados (Ads) contratados pra aparecer em destaque nas buscas.';
  if(t.includes('full')||t.includes('armazen')||t.includes('coleta')||t.includes('fulfillment')) return 'Custo de armazenar, coletar ou movimentar produtos no centro de distribuição Full.';
  if(t.includes('parcel')) return 'Taxa cobrada quando o comprador parcela o pagamento no cartão.';
  if(t.includes('envio')||t.includes('frete')||t.includes('shipping')) return 'Custo do frete das vendas enviadas pelo Mercado Envios (repassado a você quando o anúncio tem frete grátis).';
  if(t.includes('venda')||t.includes('comiss')) return 'Comissão que o Mercado Livre cobra por cada venda concluída.';
  return 'Cobrança do Mercado Livre referente a essa categoria (detalhe direto da fatura oficial).';
}
function mesLabel(m){
  if(!m) return '—';
  const [a,mm]=m.split('-');
  const nomes=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return `${nomes[Number(mm)-1]||mm}/${a}`;
}
let financasFiltroMes=hoje().slice(0,7);
let financasFiltroLoja=STORES[0]; // nome de uma loja (uma de cada vez, sem agrupar "todas") | '__geral__' (despesas sem loja específica, ex: aluguel do galpão)
let financasPuxandoFatura=null;
let financasExpandido={}; // id da despesa -> true enquanto mostra o detalhamento (ex: fatura do ML por categoria)
function despesaBateFiltroLoja(d){
  if(financasFiltroLoja==='__geral__') return !d.loja;
  return d.loja===financasFiltroLoja;
}

/* ================= Retiradas e Reembolsos (TorvStore): fechamento equilibrado entre sócios =====
   RETIRADA = dinheiro que o sócio já tirou da empresa pra ele (reduz o que falta receber da cota).
   REEMBOLSO = o inverso: dinheiro que o sócio pagou do próprio bolso pela empresa e que a empresa
   precisa devolver pra ele (aumenta o que a empresa ainda deve, além da cota). No fechamento, a
   margem líquida do período é dividida 50/50 (a "cota" de cada um); o que falta pra cada um é:
   cota − retiradas + reembolsos. Quem já retirou mais que a cota (líquido de reembolsos) devolve a
   diferença. Cada entrada guarda um "tipo" ('retirada' ou 'reembolso') — entradas antigas sem tipo
   (de antes desse campo existir) contam como retirada, mantendo o comportamento de antes. */
function sociosLoja(loja){
  if(!state.socios) state.socios={};
  if(!state.socios[loja]) state.socios[loja]={felipe:[],thiago:[]};
  if(!Array.isArray(state.socios[loja].felipe)) state.socios[loja].felipe=[];
  if(!Array.isArray(state.socios[loja].thiago)) state.socios[loja].thiago=[];
  [...state.socios[loja].felipe,...state.socios[loja].thiago].forEach(x=>{ if(x.tipo!=='retirada'&&x.tipo!=='reembolso') x.tipo='retirada'; });
  return state.socios[loja];
}
function addMovimentoSocio(loja,socio,tipo,descricao,valor,data){
  snapshot((tipo==='reembolso'?'reembolso de ':'retirada de ')+socio+' ('+loja+')');
  const s=sociosLoja(loja);
  s[socio].push({id:gerarId('soc'),tipo:tipo==='reembolso'?'reembolso':'retirada',descricao:(descricao||'').trim(),valor:Number(valor)||0,data:data||hoje()});
  persist();
}
function removerMovimentoSocio(loja,socio,id){
  const s=sociosLoja(loja);
  const d=s[socio].find(x=>x.id===id); if(!d) return;
  snapshot('remoção de lançamento de '+socio);
  s[socio]=s[socio].filter(x=>x.id!==id);
  persist();
}
function movimentosSocioMes(loja,socio,mes){
  return sociosLoja(loja)[socio].filter(x=>(x.data||'').slice(0,7)===mes).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
}
function totalPorTipo(lista,tipo){
  return lista.filter(x=>x.tipo===tipo).reduce((s,x)=>s+(Number(x.valor)||0),0);
}

/* ================= Resumo Financeiro (faturamento, margem de contribuição, deduções) =================
   Puxa direto da API de pedidos/ads/frete do Mercado Livre (não usa as despesas cadastradas à mão
   acima) - período flexível igual ferramenta tipo Metrify: 7/15/30 dias, mês fechado ou intervalo
   personalizado. O CMV é calculado AQUI no navegador (backend só manda item_id+qtd vendida),
   porque o custo unitário de cada produto só existe no state local (aba Produtos). */
let financasResumoLoja=STORES[0];
let financasResumoPeriodo='30d';
let financasResumoDe='', financasResumoAte='';
let financasResumoResultado=null; // último resumo buscado (guarda o objeto inteiro devolvido pelo backend)
let financasResumoCarregando=false;
let financasResumoErro=null;
async function pesquisarResumoFinanceiro(){
  financasResumoCarregando=true; financasResumoErro=null; renderFinancas();
  try{
    const base=backendUrl();
    if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
    const params=new URLSearchParams({loja:financasResumoLoja,periodo:financasResumoPeriodo});
    if(financasResumoPeriodo==='personalizado'){
      if(!financasResumoDe||!financasResumoAte) throw new Error('Informe as duas datas do período personalizado.');
      params.set('de',financasResumoDe); params.set('ate',financasResumoAte);
    }
    const r=await fetch(`${base}/financas/resumo?${params.toString()}`);
    let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+r.status+').'); }
    if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao buscar o resumo financeiro (status '+r.status+').'));
    financasResumoResultado=j.resumo;
  }catch(e){ financasResumoErro=e.message; }
  finally{ financasResumoCarregando=false; renderFinancas(); }
}
/* CMV = soma de (custo cadastrado do produto × quantidade vendida no período), casando pelo
   mlItemId salvo em cada produto. Item vendido sem produto vinculado (ou sem custo cadastrado)
   entra em "semCusto" pra avisar que o CMV está subestimado, em vez de fingir que é zero. */
function calcularCmvResumo(resumo){
  let cmv=0,unidSemCusto=0;
  (resumo.itensVendidos||[]).forEach(it=>{
    const p=state.produtos.find(x=>x.mlItemId===it.itemId);
    if(p&&p.custo>0) cmv+=p.custo*it.qtd; else unidSemCusto+=it.qtd;
  });
  return {cmv,unidSemCusto};
}
/* despesas manuais (cadastradas em Finanças, exceto a fatura do ML — que entra separada, com o
   valor pendente atual) dessa loja com vencimento dentro do período do Resumo Financeiro — usadas
   como "custos do período" na Margem Líquida. */
function despesasPeriodoLoja(loja,de,ate){
  return despesasArr().filter(d=>d.loja===loja&&d.origem!=='ml_fatura'&&d.dataPagamento&&d.dataPagamento>=de&&d.dataPagamento<=ate);
}
/* margem de contribuição e margem líquida a partir de um resumo (do backend) - função separada
   pra ser reaproveitada tanto no Resumo Financeiro quanto no fechamento dos sócios. */
function calcularMargensResumo(resumo,loja){
  const {cmv,unidSemCusto}=calcularCmvResumo(resumo);
  const aliquota=finLoja(loja).aliquotaImposto||0;
  const impostoCalc=resumo.faturamento*(aliquota/100);
  const margem=resumo.faturamento-cmv-resumo.tarifas-impostoCalc-(resumo.ads.custo||0)-(resumo.frete.vendedor||0)-resumo.cancelamentosValor-resumo.reembolsosValor;
  const custosPeriodo=despesasPeriodoLoja(loja,resumo.periodo.de,resumo.periodo.ate).reduce((s,d)=>s+(Number(d.valor)||0),0);
  const faturaMlAtual=faturaMlPendenteLoja(loja);
  const margemLiquida=margem-custosPeriodo-faturaMlAtual;
  return {cmv,unidSemCusto,aliquota,impostoCalc,margem,custosPeriodo,faturaMlAtual,margemLiquida};
}
/* monta os cartões de dedução + margem de contribuição a partir do resumo devolvido pelo backend.
   Frete pago pelo COMPRADOR não entra na margem (não sai do seu bolso) - só o frete VENDEDOR
   (o que você paga quando o anúncio tem frete grátis) é deduzido, igual o print de referência
   (Metrify) mostrava. Cancelamentos e reembolsos também são deduzidos - são vendas que geraram
   custo/trabalho mas não viraram receita de verdade. */
function renderResumoFinanceiroResultado(resumo,loja){
  const {cmv,unidSemCusto,aliquota,impostoCalc,margem,custosPeriodo,faturaMlAtual,margemLiquida}=calcularMargensResumo(resumo,loja);
  const margemPct=resumo.faturamento>0?(margem/resumo.faturamento*100):0;
  const margemLiquidaPct=resumo.faturamento>0?(margemLiquida/resumo.faturamento*100):0;
  const pct=v=>resumo.faturamento>0?(v/resumo.faturamento*100).toFixed(1)+'% do faturamento':'';
  const cartao=(titulo,valor,sub)=>`<div class="card" style="margin:0"><div class="muted" style="font-size:11px">${titulo}</div><b style="font-size:17px">${fmtMoney(valor)}</b>${sub?`<div class="hint" style="margin:2px 0 0;font-size:11px">${sub}</div>`:''}</div>`;
  const itensOrdenados=(resumo.itensVendidos||[]).slice().sort((a,b)=>b.qtd-a.qtd);
  const unidadesVendidas=itensOrdenados.reduce((s,it)=>s+it.qtd,0);
  return `
    <p class="hint" style="margin:14px 0 8px">Período: ${fmtData(resumo.periodo.de)} a ${fmtData(resumo.periodo.ate)} · ${fmtInt(resumo.pedidosValidos)} pedido(s) válido(s) · ${fmtInt(unidadesVendidas)} unidade(s) vendida(s)${resumo.pedidosCancelados?' · '+fmtInt(resumo.pedidosCancelados)+' cancelado(s)':''}</p>
    <div class="form-grid" style="grid-template-columns:repeat(3,1fr);gap:10px">
      ${cartao('FATURAMENTO',resumo.faturamento)}
      ${cartao('CUSTOS (CMV)',cmv,unidSemCusto?fmtInt(unidSemCusto)+' unid. sem custo cadastrado — CMV subestimado':pct(cmv))}
      ${cartao('TARIFAS (COMISSÃO)',resumo.tarifas,(pct(resumo.tarifas)?pct(resumo.tarifas)+' · ':'')+'só comissão de venda (sale_fee) — pode não incluir juro de parcelamento')}
      ${cartao('IMPOSTOS ('+(aliquota||0)+'%)',impostoCalc,aliquota?pct(impostoCalc):'alíquota não configurada')}

/* ---- Retiradas e Reembolsos (TorvStore): cartão independente, sempre visível (não depende de
   ter pesquisado um período no Resumo Financeiro acima) — mesma lógica de "sempre aparece" da
   tabela de despesas, usando o mesmo mês selecionado em financasFiltroMes. O fechamento (margem
   líquida do mês) é calculado sob demanda, com uma busca própria à API do Mercado Livre pro mês
   inteiro. */
let sociosFechamento=null;
let sociosFechamentoMes=null;
let sociosFechamentoCarregando=false;
let sociosFechamentoErro=null;
async function calcularFechamentoSocios(){
  sociosFechamentoCarregando=true; sociosFechamentoErro=null; renderFinancas();
  try{
    const base=backendUrl();
    if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
    const mes=financasFiltroMes;
    const [ano,mm]=mes.split('-').map(Number);
    const de=`${mes}-01`;
    const ate=`${mes}-${String(new Date(ano,mm,0).getDate()).padStart(2,'0')}`;
    const params=new URLSearchParams({loja:'TorvStore',periodo:'personalizado',de,ate});
    const r=await fetch(`${base}/financas/resumo?${params.toString()}`);
    let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+r.status+').'); }
    if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao buscar o resumo financeiro (status '+r.status+').'));
    sociosFechamento=j.resumo;
    sociosFechamentoMes=mes;
  }catch(e){ sociosFechamentoErro=e.message; }
  finally{ sociosFechamentoCarregando=false; renderFinancas(); }
}

    financasExpandido[b.dataset.fndetalhar]=!financasExpandido[b.dataset.fndetalhar];

  });
  el.querySelectorAll('[data-puxarfatura]').forEach(b=>b.onclick=async()=>{
    const loja=b.dataset.puxarfatura;

      toast(`Fatura de ${loja} importada: falta pagar ${fmtMoney(f.valor)}${f.vencimento?', vencimento '+fmtData(f.vencimento):''}.`);

  });
  const frLoja=document.getElementById('frLoja'), frPeriodo=document.getElementById('frPeriodo');
  if(frLoja) frLoja.onchange=e=>{ financasResumoLoja=e.target.value; financasResumoResultado=null; renderFinancas(); };
  /* trocar o período (exceto "personalizado", que precisa das duas datas primeiro) já pesquisa
     de novo sozinho — sem isso, o resumo (incluindo o ranking de produtos) ficava mostrando os
     dados do período anterior até clicar em Pesquisar de novo. */
  if(frPeriodo) frPeriodo.onchange=e=>{
    financasResumoPeriodo=e.target.value;
    financasResumoResultado=null;
    if(financasResumoPeriodo==='personalizado'){ renderFinancas(); return; }
    pesquisarResumoFinanceiro();
  };
  const frDe=document.getElementById('frDe'), frAte=document.getElementById('frAte');
  if(frDe) frDe.onchange=e=>{ financasResumoDe=e.target.value; };
  if(frAte) frAte.onchange=e=>{ financasResumoAte=e.target.value; };
  const frPesquisar=document.getElementById('frPesquisar');
  if(frPesquisar) frPesquisar.onclick=pesquisarResumoFinanceiro;
  const frAliquota=document.getElementById('frAliquota');
  if(frAliquota) frAliquota.onchange=e=>{ atualizarFinanceiro(financasResumoLoja,{aliquotaImposto:e.target.value}); renderFinancas(); };
  const btnAddSocio=document.getElementById('btnAddSocio');
  if(btnAddSocio) btnAddSocio.onclick=()=>{
    const socio=document.getElementById('socQuem').value;
    const tipo=document.getElementById('socTipo').value;
    const descricao=document.getElementById('socDescricao').value.trim();
    const valor=Number(document.getElementById('socValor').value);
    const data=document.getElementById('socData').value||hoje();
    if(!valor||valor<=0){ alert('Informe um valor válido.'); return; }
    addMovimentoSocio('TorvStore',socio,tipo,descricao,valor,data);
    toast((tipo==='reembolso'?'Reembolso':'Retirada')+' de '+(socio==='felipe'?'Felipe':'Thiago')+' lançado(a).');
    renderFinancas();
  };
  el.querySelectorAll('[data-remsocio]').forEach(b=>b.onclick=()=>{
    const [socio,id]=b.dataset.remsocio.split('|');
    removerMovimentoSocio('TorvStore',socio,id);
    toast('Lançamento removido.');
    renderFinancas();
  });
  const btnFecharSocios=document.getElementById('btnFecharSocios');
  if(btnFecharSocios) btnFecharSocios.onclick=calcularFechamentoSocios;
}

/* ---------- listas de tarefas ---------- */
function addLista(nome){
  snapshot('nova lista de tarefas');
  const l={id:gerarId('lst'),nome:(nome||'').trim().toUpperCase()||'NOVA LISTA'};
  state.listas.push(l); listaAtual=l.id; persist();
  return l;
}
function renomearLista(id,nome){
  const l=state.listas.find(x=>x.id===id); if(!l) return;
  snapshot('renomear lista'); l.nome=(nome||'').trim().toUpperCase()||l.nome; persist();
}
function excluirLista(id){
  if(state.listas.length<=1){ alert('É preciso ter ao menos uma lista.'); return; }
  snapshot('exclusão de lista de tarefas');
  state.listas=state.listas.filter(l=>l.id!==id);
  state.tarefas=state.tarefas.filter(t=>t.listaId!==id);
  if(listaAtual===id) listaAtual=state.listas[0].id;
  persist();
}
function tarefasDaLista(id){ return state.tarefas.filter(t=>t.listaId===id); }

/* ---------- tarefas ---------- */
function addTarefa(titulo,data,hora,repetirMensal,obs){
  snapshot('nova tarefa');
  state.tarefas.unshift({id:gerarId('t'),listaId:listaAtual,titulo:(titulo||'').trim().toUpperCase(),data:data||'',hora:hora||'',repetirMensal:!!repetirMensal,obs:(obs||'').trim(),subs:[],criadoEm:Date.now()});
  persist();
}
function updateTarefa(id,patch){
  const t=state.tarefas.find(x=>x.id===id); if(!t) return;
  snapshot('edição de tarefa');
  Object.assign(t,patch); persist();
}
function concluirTarefa(id){
  const t=state.tarefas.find(x=>x.id===id); if(!t) return {ok:false};
  if(t.repetirMensal&&t.data){
    snapshot('conclusão (recorrente) da tarefa "'+(t.titulo||'').slice(0,30)+'"');
    t.data=proximoMes(t.data);
    (t.subs||[]).forEach(s=>s.feito=false);
    persist();
    return {ok:true,repetiu:true,novaData:t.data};
  }
  snapshot('conclusão da tarefa "'+(t.titulo||'').slice(0,30)+'"');
  state.tarefas=state.tarefas.filter(x=>x.id!==id);
  persist();
  return {ok:true,repetiu:false};
}
function moverTarefa(id,paraId){
  if(id===paraId) return;
  const de=state.tarefas.findIndex(t=>t.id===id);
  const para=state.tarefas.findIndex(t=>t.id===paraId);
  if(de<0||para<0) return;
  snapshot('reordenação de tarefas');
  const [t]=state.tarefas.splice(de,1);
  state.tarefas.splice(para,0,t);
  persist();
}
function addSub(tid,titulo){
  const t=state.tarefas.find(x=>x.id===tid); if(!t) return;
  const tit=(titulo||'').trim(); if(!tit) return;
  snapshot('nova subtarefa');
  if(!t.subs) t.subs=[];
  t.subs.push({id:gerarId('s'),titulo:tit.toUpperCase(),feito:false});
  persist();
}
function alternarSub(tid,sid){
  const t=state.tarefas.find(x=>x.id===tid); if(!t) return;
  const s=(t.subs||[]).find(x=>x.id===sid); if(!s) return;
  snapshot(s.feito?'reabrir subtarefa':'concluir subtarefa');
  s.feito=!s.feito; persist();
}
function editarSub(tid,sid,titulo){
  const t=state.tarefas.find(x=>x.id===tid); if(!t) return;
  const s=(t.subs||[]).find(x=>x.id===sid); if(!s) return;
  snapshot('edição de subtarefa'); s.titulo=(titulo||'').toUpperCase(); persist();
}
function removerSub(tid,sid){
  const t=state.tarefas.find(x=>x.id===tid); if(!t) return;
  snapshot('remoção de subtarefa');
  t.subs=(t.subs||[]).filter(x=>x.id!==sid); persist();
}
/* arrasta a subtarefa sid pra posição da subtarefa paraSid (mesma tarefa) */
function moverSubPara(tid,sid,paraSid){
  if(sid===paraSid) return;
  const t=state.tarefas.find(x=>x.id===tid); if(!t||!Array.isArray(t.subs)) return;
  const de=t.subs.findIndex(x=>x.id===sid), para=t.subs.findIndex(x=>x.id===paraSid);
  if(de<0||para<0) return;
  snapshot('reordenação de subtarefas');
  const [s]=t.subs.splice(de,1);
  t.subs.splice(t.subs.findIndex(x=>x.id===paraSid),0,s);
  persist();
}
function tarefasAtrasadas(lid){ const h=hoje(); return state.tarefas.filter(t=>(!lid||t.listaId===lid)&&t.data&&t.data<h).length; }

function modalRecalculo(envioId,novaData,localColeta,r){
  const e=envioById(envioId);
  const body=openModal(true);
  const desc=c=>{
    if(c.semMedia) return '<span style="opacity:.5">sem média guardada — fica igual</span>';
    if(c.dif>0) return '<span class="okv">+'+fmtInt(c.dif)+' — reserva ou ordem de compra</span>';
    if(c.dif<0) return '<span class="okv">'+fmtInt(c.dif)+' — sai da compra ou volta ao disponível</span>';
    return '<span style="opacity:.5">sem mudança</span>';
  };
  const soma=r.linhas.reduce((a,l)=>a+Math.max(0,l.dif),0), sub=r.linhas.reduce((a,l)=>a+Math.max(0,-l.dif),0);
  body.innerHTML=`<h3>Nova data: ${fmtData(novaData)}</h3>
    <p class="hint" style="margin:0 0 12px">De ${fmtData(e.data)} para ${fmtData(novaData)} · agora são <b>${r.D} dia(s)</b> até o envio ·
      cobertura de <b>${r.cob}</b> dias. O sistema refez as quantidades pela média de vendas guardada quando este envio foi criado.</p>
    <div class="table-wrap"><table class="tbl-produtos"><thead><tr>
      <th>SKU</th><th class="num">Vendas/dia</th><th class="num">Hoje</th><th class="num">Nova</th><th class="num">Diferença</th><th>O que acontece</th>
    </tr></thead><tbody>${r.linhas.map(c=>`<tr${c.dif===0?' style="opacity:.45"':''}>
      <td class="mono">${esc(c.produto.sku)}</td><td class="num">${c.media!=null?c.media.toFixed(2):'—'}</td>
      <td class="num">${fmtInt(c.atual)}</td><td class="num">${fmtInt(c.novo)}</td>
      <td class="num"><b>${c.dif>0?'+':''}${fmtInt(c.dif)}</b></td><td>${desc(c)}</td></tr>`).join('')}</tbody></table></div>
    <div class="aviso atencao" style="margin:12px 0 0"><span>⚠</span><span>Total: <b>+${fmtInt(soma)}</b> un. a mais${sub?` e <b>${fmtInt(sub)}</b> un. liberadas`:''}. O que aumentar sai do galpão, depois do Coletar, e só o resto vira ordem de compra.</span></div>
    <div class="modal-actions"><button class="btn" id="btnRecCanc">Cancelar</button>
      <button class="btn" id="btnRecSo">Só mudar a data</button>
      <button class="btn gold" id="btnRecOk">Aplicar e recalcular</button></div>`;
  document.getElementById('btnRecCanc').onclick=closeModal;
  document.getElementById('btnRecSo').onclick=()=>{ editarEnvio(envioId,{nome:fmtData(novaData),data:novaData,localColeta}); closeModal(); toast('Data alterada. As quantidades ficaram como estavam.'); };
  document.getElementById('btnRecOk').onclick=()=>{
    const res=aplicarRecalculo(envioId,novaData);
    if(localColeta) editarEnvio(envioId,{localColeta});
    closeModal();
    if(!res.ok){ alert(res.msg); return; }
    toast(`Envio recalculado para ${fmtData(novaData)}.`+(res.soma?` +${fmtInt(res.soma)} un.`:'')+(res.sub?` −${fmtInt(res.sub)} un. liberadas.`:''));
  };

/* modal do botão "↦ Mover" na linha do item, dentro de Envios FULL: mover pra outro envio já

  body.innerHTML=`<h3>Mover ${esc(p.sku)}</h3>

    <h4>Ou criar um FULL de emergência</h4>
    <p class="hint" style="margin-top:-4px">Pra antecipar quando este produto vai zerar antes do envio programado chegar. Não precisa ser tudo — dá pra mandar só o suficiente pra cobrir alguns dias e deixar o resto no envio programado normalmente.</p>
    <div class="form-grid">
      <label>Data deste envio de emergência<input id="mvEmData" type="date" value="${esc(hoje())}"></label>
      <label>Local da coleta<select id="mvEmColeta">${optsColeta(LOCAIS_COLETA[0])}</select></label>
      <label>Dias de cobertura desta emergência<input id="mvEmDias" type="number" min="1" placeholder="Ex: 15" ${media>0?'':'disabled title="Sem média de vendas/dia lida ainda pra este SKU — informe a quantidade direto"'}></label>
      <label>Quantidade a enviar<input id="mvEmQtd" type="number" min="1" max="${it.solicitado}" value="${it.solicitado}"></label>
    </div>
    <p class="hint" id="mvEmInfo" style="margin-top:-6px">${media>0?`Média de vendas: <b>${media.toFixed(2)}</b> un./dia. No máximo dá pra tirar ${fmtInt(it.solicitado)} un. deste envio (o que sobrar continua programado normalmente pra ${fmtData(e.data)}).`:'Sem média de vendas/dia lida ainda pra este SKU — o campo de dias fica desativado, informe a quantidade direto.'}</p>
    <button class="btn gold" id="mvBtnEmergencia">🚨 Criar FULL de emergência</button>
    <div class="modal-actions" style="margin-top:14px"><button class="btn" id="mvCancelar">Fechar</button></div>`;
  document.getElementById('mvCancelar').onclick=closeModal;
  const mvEmDias=document.getElementById('mvEmDias'), mvEmQtd=document.getElementById('mvEmQtd');
  if(media>0) mvEmDias.oninput=()=>{
    const d=Number(mvEmDias.value);
    if(!d||d<=0) return;
    mvEmQtd.value=Math.min(it.solicitado,Math.ceil(d*media));
  };
  const btnMover=document.getElementById('mvBtnMover');
  if(btnMover) btnMover.onclick=()=>{
    const destino=document.getElementById('mvDestino').value;
    if(!destino){ alert('Escolha o envio de destino.'); return; }
    const ed=envioById(destino);
    const qtd=Math.round(Number(document.getElementById('mvQtd').value)||0);
    if(qtd<=0){ alert('Informe uma quantidade válida.'); return; }
    const r=moverQtdEntreEnvios(envioId,itemId,destino,qtd);
    if(!r.ok){ alert(r.msg); return; }
    closeModal();
    const restou=it.solicitado-qtd;
    toast(`${fmtInt(qtd)} un. de ${p.sku} movidas para o envio "${ed.nome}".`+(restou>0?` As outras ${fmtInt(restou)} un. continuam no envio "${e.nome}".`:''));
  };
  document.getElementById('mvBtnEmergencia').onclick=()=>{
    const data=document.getElementById('mvEmData').value;
    if(!data){ alert('Informe a data.'); return; }

    const qtd=Math.round(Number(mvEmQtd.value)||0);
    if(qtd<=0){ alert('Informe uma quantidade válida.'); return; }
    const r=moverQtdParaNovoEmergencia(envioId,itemId,qtd,data,localColeta);
    if(!r.ok){ alert(r.msg); return; }
    closeModal();
    const restou=it.solicitado-qtd;
    toast(`FULL de emergência criado com ${fmtInt(qtd)} un. de ${p.sku}.`+(restou>0?` As outras ${fmtInt(restou)} un. continuam no envio "${e.nome}".`:''));
  };

/* ---------- PDF ---------- */
function parseNomeArquivo(nome){
  const base=nome.replace(/\.pdf$/i,'').trim();
  const m=/^(\d{2})(\d{2})(\d{2})[\s._-]*(.+)$/.exec(base);
  if(!m) return {data:'',loja:null,nome:base};
  const [,dd,mm,aa,lt]=m;
  return {data:`20${aa}-${mm}-${dd}`,loja:acharLoja(lt),nome:base};
}
async function extrairLinhasPdf(file){
  if(!window.pdfjsLib) throw new Error('Biblioteca de leitura de PDF não carregou. Verifique sua conexão e recarregue a página.');
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const linhas=[];
  for(let pn=1;pn<=pdf.numPages;pn++){
    const tc=await (await pdf.getPage(pn)).getTextContent();
    const items=tc.items.map(it=>({str:(it.str||''),x:it.transform[4],y:it.transform[5]}));
    const skus=[],codigos=[],qtds=[];
    items.forEach(it=>{
      if(it.x<235){
        const ms=/SKU:\s*(\S+)/i.exec(it.str); if(ms) skus.push({sku:ms[1],y:it.y});
        const mc=/C[óo]digo ML:\s*([A-Z0-9]+)/i.exec(it.str); if(mc) codigos.push({codigo:mc[1],y:it.y});
      }
      const s=it.str.trim();
      if(it.x>=225&&it.x<=285&&/^\d[\d.,]*$/.test(s)){
        const v=parseInt(s.replace(/\D/g,''),10);
        if(!isNaN(v)&&v>0) qtds.push({qtd:v,y:it.y});
      }
    });
    qtds.forEach(q=>{
      let best=null,bd=Infinity;
      skus.forEach(s=>{ const d=q.y-s.y; if(d>=-6&&d<=32&&Math.abs(d)<bd){ bd=Math.abs(d); best=s; } });
      if(!best) return;
      let cod='',cd=Infinity;
      codigos.forEach(c=>{ const d=Math.abs(c.y-best.y); if(d<=22&&d<cd){ cd=d; cod=c.codigo; } });
      const ex=linhas.find(l=>l.sku.toLowerCase()===best.sku.toLowerCase());
      if(ex) ex.qtd+=q.qtd; else linhas.push({sku:best.sku,qtd:q.qtd,codigo:cod});
    });
  }
  return linhas;
}
async function processarPdf(file){
  try{
    toast('Lendo o PDF...');
    const meta=parseNomeArquivo(file.name);
    const linhas=await extrairLinhasPdf(file);
    if(!linhas.length){ alert('Não consegui identificar SKUs e quantidades nesse PDF. Confira se é o documento de inbound do Mercado Livre.'); return; }
    /* mesmo arquivo, ou mesma loja na mesma data = provavelmente uma atualizacao */
    const dup=state.envios.find(e=>e.arquivo&&e.arquivo.toLowerCase()===file.name.toLowerCase())
      ||(meta.loja&&meta.data?state.envios.find(e=>e.loja===meta.loja&&e.data===meta.data):null);
    const seguir=()=>{ pdfPreview={meta,linhas,arquivo:file.name}; openPdfPreviewModal(); };
    if(dup) perguntarAtualizacao(dup,{meta,linhas,arquivo:file.name},seguir);
    else seguir();
  }catch(err){ alert('Erro ao ler o PDF: '+err.message); }
}

function modalComparacao(envio,dados){
  const {linhas,arquivo}=dados;
  const comp=compararEnvioComPdf(envio,linhas);
  const mudou=comp.filter(c=>c.dif!==0);
  const body=openModal(true);
  const rot=c=>{
    if(c.tipo==='removido') return '<span class="pend">sai do envio — volta ao disponível</span>';
    if(c.tipo==='novoProduto') return '<span class="pend">SKU novo — será cadastrado</span>';
    if(c.tipo==='novoItem') return '<span class="pend">entra no envio</span>';
    if(c.dif>0) return '<span class="okv">+'+fmtInt(c.dif)+' — reserva ou ordem de compra</span>';
    if(c.dif<0) return '<span class="okv">'+fmtInt(c.dif)+' — sai da compra ou volta ao disponível</span>';
    return '<span style="opacity:.5">sem mudança</span>';
  };
  const varias=comp.filter(c=>c.varias).length;
  body.innerHTML=`<h3>Atualizar o envio ${esc(envio.nome)}</h3>
    <p class="hint" style="margin:0 0 12px">Arquivo: <span class="mono">${esc(arquivo)}</span> · ${mudou.length} item(ns) com mudança de ${comp.length}.</p>
    <div class="table-wrap"><table class="tbl-produtos"><thead><tr>
      <th>SKU</th><th class="num">No envio</th><th class="num">No PDF</th><th class="num">Diferença</th><th>O que acontece</th>
    </tr></thead><tbody>${comp.map(c=>`<tr${c.dif===0?' style="opacity:.45"':''}>
      <td class="mono">${esc(c.sku)}</td><td class="num">${fmtInt(c.atual)}</td><td class="num">${fmtInt(c.novo)}</td>
      <td class="num"><b>${c.dif>0?'+':''}${fmtInt(c.dif)}</b></td><td>${rot(c)}</td></tr>`).join('')}</tbody></table></div>
    ${varias?`<div class="aviso atencao" style="margin:12px 0 0"><span>⚠</span><span>${varias} SKU(s) têm mais de uma programação neste envio. A diferença é aplicada na <b>programação mais recente</b>, preservando a mais antiga.</span></div>`:''}
    ${mudou.length?'':'<div class="aviso" style="margin:12px 0 0"><span>ℹ</span><span>Nada mudou em relação ao envio atual.</span></div>'}
    <div class="modal-actions"><button class="btn" id="btnCancComp">Cancelar</button>
      <button class="btn gold" id="btnAplicComp"${mudou.length?'':' disabled'}>Aplicar ao envio</button></div>`;
  document.getElementById('btnCancComp').onclick=()=>{ pdfPreview=null; closeModal(); };
  document.getElementById('btnAplicComp').onclick=()=>{
    const r=atualizarEnvioComPdf(envio.id,linhas,arquivo);
    pdfPreview=null; closeModal();
    if(!r.ok){ alert(r.msg); return; }
    let m=`Envio "${envio.nome}" atualizado.`;
    if(r.soma) m+=` +${fmtInt(r.soma)} un.`;
    if(r.sub) m+=` −${fmtInt(r.sub)} un. liberadas.`;
    if(r.rem) m+=` ${r.rem} SKU(s) removidos.`;
    if(r.cri) m+=` ${r.cri} SKU(s) novos cadastrados.`;
    toast(m);
  };
}

/* ================= PREVISÃO FULL ================= */
function fullCfg(){ return state.full.cfg; }
function fullItensLoja(loja){ return state.full.itens.filter(i=>i.loja===(loja||fullCfg().loja)); }
/* casa com o cadastro do Doca: SKU primeiro, depois Código ML */
function fullProduto(i){
  if(i.produtoId){ const v=prodById(i.produtoId); if(v) return v; }
  const s=String(i.sku||'').trim().toLowerCase(), c=String(i.codigo||'').trim().toLowerCase();
  return state.produtos.find(p=>p.loja===i.loja&&String(p.sku||'').toLowerCase()===s)
    ||(c?state.produtos.find(p=>p.loja===i.loja&&String(p.codigo||'').toLowerCase()===c):null)
    ||(s?state.produtos.find(p=>p.loja===i.loja&&String(p.codigo||'').toLowerCase()===s):null)||null;
}
/* o SKU mostrado é sempre o do cadastro quando o produto existe */
function fullSku(i){ const p=fullProduto(i); return p?p.sku:(i.sku||i.codigo||'—'); }
function fullCusto(i){ const p=fullProduto(i); return p?(Number(p.custo)||0):0; }
function diasEntre(a,b){ if(!a||!b) return 0; return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5); }
function fullCalc(i,envioOverride){
  const c=fullCfg();
  const r7=(i.v7||0)/7, r15=(i.v15||0)/15, r30=(i.v30||0)/30;
  const soma=(c.p7||0)+(c.p15||0)+(c.p30||0);
  const somaPond=r7*c.p7+r15*c.p15+r30*c.p30;
  const temPeriodos=(i.v7||0)||(i.v15||0)||(i.v30||0);
  const mediaPronta=(!temPeriodos&&i.mediaFixa!=null&&i.mediaFixa>0);
  const media=mediaPronta?i.mediaFixa:(soma>0?somaPond/soma:0);
  /* envioOverride deixa recalcular pra uma data diferente da salva em c.envio, sem mexer no
     estado — usado no modal "Criar FULL no Doca" pra atualizar a sugestão na hora quando a
     pessoa muda a data ali dentro, antes de confirmar. */
  const D=Math.max(0,diasEntre(hoje(),envioOverride||c.envio));
  /* dois estados de estoque "a caminho do Full", cada um com fonte própria e 100% real:
     - "em transferência" (i.transf): direto da API do Mercado Livre.
     - "próximos programados" (envios criados no Doca e ainda NÃO confirmados como FULL — ver
       entradaPendenteDe): dado do próprio Doca, sempre atual.
     O campo "Entrada pendente" (tentativa de rastrear localmente o que já foi confirmado como
     FULL no Doca mas a API ainda não mostrava) foi removido — o Mercado Livre não expõe essa
     informação por API, e o número só ficava desatualizado sem ninguém perceber. Assim que um
     envio é confirmado como FULL, ele sai de "Próximos programados" e some do cálculo até a
     próxima sincronização mostrar a mercadoria de verdade em "Aptas"/"Em transferência".
     Os dois contam pra QUANTIDADE (full/Total/cobertura/sugestão de envio), pra não sugerir
     enviar de novo o que já está no caminho ou já programado. Só "em transferência" conta pro
     VALOR EM DINHEIRO — "próximos programados" ainda está fisicamente no galpão/fornecedor e
     seu valor já é contado no estoque LOCAL via "Reservado" (ver valorEstoque/totalNoGalpao);
     contar de novo aqui duplicaria o dinheiro. */
  const proximosProgramados=entradaPendenteDe(i.produtoId||(fullProduto(i)?fullProduto(i).id:null));
  const fullValorBase=(i.aptas||0)+(i.transf||0);
  const full=fullValorBase+proximosProgramados;   /* quantidade, pra Total/cobertura/sugestão */
  const consumo=media*D, proj=full-consumo, dem=media*(c.cobertura||30);
  const bruto=dem-proj, enviar=bruto>0?Math.ceil(bruto):0;
  const cob=media>0?full/media:(full>0?Infinity:0);   /* dias que o estoque do Full aguenta */
  /* ruptura: o estoque zera ANTES do envio chegar */
  const rompe=media>0&&cob<D;
  const diaRuptura=rompe?new Date(Date.now()+Math.floor(cob)*864e5).toISOString().slice(0,10):'';
  const vendasIncoer=!mediaPronta&&((i.v7||0)>(i.v15||0)||(i.v15||0)>(i.v30||0));
  /* se esse SKU ja teve um envio confirmado (Criar FULL no Doca) e o envio ainda existe,
     nao sugere mandar de novo — mesmo que a conta de demanda desse outro numero. So volta a
     sugerir se o envio for excluido ou se voce ajustar manualmente. */
  const jaEnviado=!!(i.enviado&&envioById(i.enviado.envioId));
  const qtd=i.ajuste!=null?i.ajuste:(jaEnviado?0:enviar);
  return {r7,r15,r30,soma:somaPond,media,mediaPronta,D,full,proximosProgramados,consumo,proj,dem,enviar,qtd,cob,
    rompe,diaRuptura,vendasIncoer,jaEnviado,custo:fullCusto(i),valor:fullValorBase*fullCusto(i)};
}
function fullResumo(loja){
  const l=fullItensLoja(loja).map(i=>({i,k:fullCalc(i)}));
  return {
    itens:l.length,
    unid:l.reduce((a,x)=>a+x.k.full,0),
    valor:l.reduce((a,x)=>a+x.k.valor,0),
    semCusto:l.filter(x=>x.k.full>0&&!x.k.custo).length,
    enviar:l.filter(x=>x.k.qtd>0).length,
    unEnviar:l.reduce((a,x)=>a+x.k.qtd,0),
    rupturas:l.filter(x=>x.k.rompe).length,
    lidoEm:state.full.lidoEm[loja||fullCfg().loja]||0
  };
}
function fullValorTodasLojas(){ return STORES.reduce((a,l)=>a+fullResumo(l).valor,0); }
/* produtos (de qualquer loja) que, no ritmo de venda atual, zeram no FULL dentro de N dias —
   independe da data de envio programada, é só um alerta antecipado pra Visão Geral. */
function rupturaProximaLista(diasLimite){
  const out=[];
  state.full.itens.forEach(i=>{
    const p=fullProduto(i); if(!p) return;
    const k=fullCalc(i);
    if(k.media>0&&k.cob<=diasLimite){
      out.push({produto:p,dias:Math.max(0,Math.floor(k.cob)),diaZero:new Date(Date.now()+Math.max(0,Math.floor(k.cob))*864e5).toISOString().slice(0,10)});
    }
  });
  return out.sort((a,b)=>a.dias-b.dias);
}
function fullUnidadesTodasLojas(){ return STORES.reduce((a,l)=>a+fullResumo(l).unid,0); }
/* liga o item lido do painel a um produto já cadastrado — grava o Código ML no produto
   para que as próximas leituras casem sozinhas */
function vincularItemFull(itemId,produtoId){
  const i=state.full.itens.find(x=>x.id===itemId); if(!i) return {ok:false,msg:'Item não encontrado.'};
  const p=prodById(produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  if(p.loja!==i.loja) return {ok:false,msg:'O produto é de outra loja.'};
  const jaUsado=state.full.itens.find(x=>x!==i&&x.loja===i.loja&&fullProduto(x)&&fullProduto(x).id===produtoId);
  if(jaUsado) return {ok:false,msg:'Este produto já está ligado a outra linha desta leitura.'};
  snapshot('vínculo de '+(i.codigo||i.sku)+' com '+p.sku);
  i.produtoId=produtoId;
  const cod=String(i.codigo||i.sku||'').toUpperCase();
  if(cod&&!p.codigo) p.codigo=cod;      /* guarda o Código ML no cadastro */
  persist();
  return {ok:true,produto:p,gravouCodigo:!!cod};
}
function desvincularItemFull(itemId){
  const i=state.full.itens.find(x=>x.id===itemId); if(!i) return;
  snapshot('remoção do vínculo'); i.produtoId=null; persist();
}
/* histórico: uma linha por SKU a cada leitura, para ver a tendência */
function chaveHist(i){ const p=fullProduto(i); return (i.loja||'')+'|'+(p?p.id:('cod:'+String(i.codigo||i.sku||'').toUpperCase())); }
function gravarHistorico(loja){
  const dia=hoje();
  fullItensLoja(loja).forEach(i=>{
    const k=fullCalc(i), ch=chaveHist(i);
    const ant=state.full.hist.filter(x=>x.ch===ch);
    const mesmoDia=ant.find(x=>x.data===dia);
    if(mesmoDia){ mesmoDia.media=k.media; mesmoDia.full=k.full; mesmoDia.sku=fullSku(i); return; }
    state.full.hist.push({ch,loja,sku:fullSku(i),data:dia,media:k.media,full:k.full});
    /* guarda no máximo 24 leituras por SKU */
    const meus=state.full.hist.filter(x=>x.ch===ch);
    if(meus.length>24){ const fora=meus.slice(0,meus.length-24); state.full.hist=state.full.hist.filter(x=>fora.indexOf(x)<0); }
  });
}
function histDe(i){ const ch=chaveHist(i); return state.full.hist.filter(x=>x.ch===ch).slice(-24); }
/* tendência: compara a média de agora com a leitura anterior */
function tendencia(i){
  const h=histDe(i); if(h.length<2) return null;
  const atual=h[h.length-1].media, ant=h[h.length-2].media;
  if(!ant) return null;
  const v=(atual/ant-1)*100;
  return {pct:v,sobe:v>2,cai:v<-2,ant,de:h[h.length-2].data};
}
/* média das últimas leituras — serve de referência para prever o próximo período */
function mediaHistorica(i,n){
  const h=histDe(i).slice(-(n||6)).filter(x=>x.media>0);
  if(!h.length) return null;
  return {media:h.reduce((a,x)=>a+x.media,0)/h.length,leituras:h.length,desde:h[0].data};
}
/* cria o envio no Doca direto da previsão */
function criarFullDaPrevisao(loja,data,localColeta){
  const l=fullItensLoja(loja).map(i=>({i,k:fullCalc(i)})).filter(x=>x.k.qtd>0);
  if(!l.length) return {ok:false,msg:'Nenhum produto com quantidade a enviar nesta loja.'};
  let criados=0,ger=0,cam=0,alo=0;
  const nome=fmtData(data);
  let envio=null;
  batch('criação do envio '+nome+' pela Previsão FULL',()=>{
    envio=criarEnvio(nome,data,loja,'',localColeta||LOCAIS_COLETA[0]);
    envio.origem='previsao';
    envio.medias={};
    l.forEach(({i,k})=>{
      let p=fullProduto(i);
      if(!p){
        p=addProduto({loja,sku:(i.sku||i.codigo||'').toUpperCase(),codigo:(i.codigo||'').toUpperCase(),
          fornecedor:'',custo:0,estoqueMinimo:0,qtd:{comprar:0,coletar:0,local:0},lotes:[],pedidos:[],obsCompra:''});
        criados++;
      } else if(!p.codigo&&i.codigo) p.codigo=String(i.codigo).toUpperCase();
      const r=alocarNoEnvio(envio,p,k.qtd);
      alo+=r.alocado; cam+=r.aCaminho; ger+=r.gerado;
      /* guarda a média e o estoque lido, para recalcular se a data mudar */
      envio.medias[p.id]={media:k.media,full:k.full,lidoEm:state.full.lidoEm[loja]||Date.now()};
      i.enviado={qtd:k.qtd,envioId:envio.id,envio:nome,em:Date.now()};
    });
  });
  return {ok:true,envio,criados,alocado:alo,aCaminho:cam,gerado:ger,itens:l.length};
}
/* Cria um envio separado (marcado como emergência) só com os SKUs que vão zerar
   antes da data prevista — usado quando não dá pra antecipar o envio já programado. */
function criarFullEmergencia(loja,data,localColeta){
  const l=fullItensLoja(loja).map(i=>({i,k:fullCalc(i)})).filter(x=>x.k.rompe);
  if(!l.length) return {ok:false,msg:'Nenhum produto em risco de ruptura nesta loja.'};
  let criados=0,ger=0,cam=0,alo=0;
  const nome='FULL DE EMERGÊNCIA · '+fmtData(data);
  let envio=null;
  batch('criação do envio de emergência '+nome,()=>{
    envio=criarEnvio(nome,data,loja,'',localColeta||LOCAIS_COLETA[0]);
    envio.origem='emergencia';
    envio.medias={};
    l.forEach(({i,k})=>{
      let p=fullProduto(i);
      const qtd=Math.max(k.qtd,1);
      if(!p){
        p=addProduto({loja,sku:(i.sku||i.codigo||'').toUpperCase(),codigo:(i.codigo||'').toUpperCase(),
          fornecedor:'',custo:0,estoqueMinimo:0,qtd:{comprar:0,coletar:0,local:0},lotes:[],pedidos:[],obsCompra:''});
        criados++;
      } else if(!p.codigo&&i.codigo) p.codigo=String(i.codigo).toUpperCase();
      const r=alocarNoEnvio(envio,p,qtd);
      alo+=r.alocado; cam+=r.aCaminho; ger+=r.gerado;
      envio.medias[p.id]={media:k.media,full:k.full,lidoEm:state.full.lidoEm[loja]||Date.now()};
      i.enviado={qtd,envioId:envio.id,envio:nome,em:Date.now()};
    });
  });
  return {ok:true,envio,criados,alocado:alo,aCaminho:cam,gerado:ger,itens:l.length};
}
/* recalcula um envio da Previsão para uma nova data — só calcula, não altera */
function recalcularEnvioPorData(envioId,novaData){
  const e=envioById(envioId); if(!e) return {ok:false,msg:'Envio não encontrado.'};
  if(!e.medias) return {ok:false,msg:'Este envio não veio da Previsão FULL, então não há média de vendas guardada para recalcular.'};
  const D=Math.max(0,diasEntre(hoje(),novaData));
  const cob=fullCfg().cobertura||30;
  const linhas=[];
  e.itens.forEach(it=>{
    const p=prodById(it.produtoId); if(!p) return;
    const m=e.medias[p.id]; if(!m) { linhas.push({item:it,produto:p,atual:it.solicitado,novo:it.solicitado,dif:0,semMedia:true}); return; }
    const proj=(m.full||0)-m.media*D;
    const bruto=m.media*cob-proj;
    const novo=bruto>0?Math.ceil(bruto):0;
    linhas.push({item:it,produto:p,media:m.media,atual:it.solicitado||0,novo,dif:novo-(it.solicitado||0)});
  });
  return {ok:true,D,cob,linhas,mudou:linhas.filter(l=>l.dif!==0)};
}
function aplicarRecalculo(envioId,novaData){
  const r=recalcularEnvioPorData(envioId,novaData);
  if(!r.ok) return r;
  const e=envioById(envioId);
  let soma=0,sub=0;
  batch('mudança da data do envio '+e.nome+' para '+fmtData(novaData),()=>{
    r.linhas.forEach(l=>{
      if(l.dif===0) return;
      aplicarAjusteItem(e,l.item,l.produto,l.novo);
      if(l.dif>0) soma+=l.dif; else sub+=-l.dif;
    });
    e.data=novaData; e.nome=fmtData(novaData);
  });
  return {ok:true,soma,sub};
}

}

function gerarInboundPrevisao(){
  const c=fullCfg(), l=fullItensLoja().map(i=>({i,k:fullCalc(i)})).filter(x=>x.k.qtd>0);
  if(!l.length){ alert('Nenhum produto com quantidade a enviar nesta loja.'); return; }
  if(!window.jspdf||!window.jspdf.jsPDF){ alert('A biblioteca de PDF não carregou. Verifique a conexão e recarregue a página.'); return; }
  const {jsPDF}=window.jspdf, ALT=841.89, X_PROD=38, X_QTD=237;
  const doc=new jsPDF({unit:'pt',format:'a4'}), y=v=>ALT-v;
  doc.setFontSize(9);
  doc.text('PRODUTO',X_PROD,y(632)); doc.text('UNIDADES',X_QTD,y(632));
  let py=603;
  l.forEach(({i,k})=>{
    if(py<70){ doc.addPage(); py=754; doc.text('PRODUTO',X_PROD,y(782)); doc.text('UNIDADES',X_QTD,y(782)); }
    const p=fullProduto(i);
    doc.text('Código ML: '+((p&&p.codigo)||i.codigo||'—')+' Código universal: ',X_PROD,y(py));
    doc.text('SKU: '+fullSku(i),X_PROD,y(py-9));
    doc.text(String(fullSku(i)).slice(0,62),X_PROD,y(py-21));
    doc.text(String(k.qtd),X_QTD,y(py+2));
    py-=61;
  });
  const [a,m,d]=c.envio.split('-');
  const nome=d+m+a.slice(2)+' '+c.loja.toUpperCase().replace(/\s+/g,'')+'.pdf';
  const blob=doc.output('blob'), link=document.createElement('a');
  link.href=URL.createObjectURL(blob); link.download=nome; link.click();
  setTimeout(()=>URL.revokeObjectURL(link.href),4000);
  toast('Inbound gerado: '+nome);
}

function fLidoTxt(t){
  if(!t) return 'nunca';
  const d=new Date(t);
  /* comparação por DIA CIVIL (data do calendário), não por janela corrida de 24h - antes,
     uma leitura de ontem às 19:50 ainda aparecia como "hoje" se tivessem se passado menos de
     24h (ex: eram 15h de hoje), o que é enganoso: a data impressa já mostra 11/08 mas o rótulo
     dizia "hoje" mesmo sendo 12/08. */
  const meiaNoite=x=>{ const dt=new Date(x); return new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()).getTime(); };
  const ha=Math.round((meiaNoite(Date.now())-meiaNoite(t))/864e5);
  const s=d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return s+(ha<=0?' · hoje':ha===1?' · ontem':' · há '+ha+' dia(s)');
}

/* ---------- Ruptura de estoque: todas as lojas de uma vez, comparando com o envio FULL
   já programado de verdade (Envios programados), não com a data manual da Previsão ---------- */
/* envios programados (ainda não confirmados como FULL) deste produto, abertos por data - mesmo
   conjunto que entradaPendenteDe soma num número só, só que aqui cada data fica separada. */
function pendentesPorData(produtoId){
  if(!produtoId) return [];
  const porData={};
  state.envios.forEach(e=>e.itens.forEach(i=>{
    if(i.produtoId!==produtoId||!(i.solicitado>0)) return;
    const d=e.data||'9999-99-99'; /* sem data = não dá pra saber se chega a tempo, trata como "não conta" */
    porData[d]=(porData[d]||0)+i.solicitado;
  }));
  return Object.keys(porData).sort().map(d=>({data:d,qtd:porData[d]}));
}
/* recalcula full/cob/diaZero considerando só os envios programados que chegam A TEMPO de evitar
   a ruptura: aptas + em transferência sempre contam (já são reais/garantidos); dos "próximos
   programados", só entra quem tem data igual ou antes da projeção de zerar - envio programado
   pra depois que já zerou não ajuda em nada. Precisa iterar porque incluir um envio empurra a
   projeção de zerar mais pra frente, o que pode trazer mais um envio pra dentro do prazo. */
function rupturaCalcComData(i){
  const k=fullCalc(i);
  const produtoId=i.produtoId||(fullProduto(i)?fullProduto(i).id:null);
  const pendentes=pendentesPorData(produtoId);
  const diaCalc=full=>k.media>0?full/k.media:(full>0?Infinity:0);
  let full=(i.aptas||0)+(i.transf||0);
  let cob=diaCalc(full);
  let diaZero=cob===Infinity?null:new Date(Date.now()+Math.max(0,Math.floor(cob))*864e5).toISOString().slice(0,10);
  const usados=new Set();
  let mudou=true;
  while(mudou){
    mudou=false;
    for(const p of pendentes){
      if(usados.has(p.data)) continue;
      if(diaZero!=null&&p.data<=diaZero){
        full+=p.qtd; usados.add(p.data); mudou=true;
        cob=diaCalc(full);
        diaZero=cob===Infinity?null:new Date(Date.now()+Math.max(0,Math.floor(cob))*864e5).toISOString().slice(0,10);
      }
    }
  }
  return {...k,full,cob,diaZero};
}
function rupturaLojaLista(loja,diasLimite){
  const prox=proximoEnvioLoja(loja);
  const diasAteEnvio=prox?diasEntre(hoje(),prox.data):null;
  return fullItensLoja(loja).map(i=>({i,k:fullCalc(i),p:fullProduto(i)}))
    .filter(({k})=>k.media>0&&k.cob!==Infinity)
    .map(x=>{
      const kr=rupturaCalcComData(x.i);
      const cobDias=Math.floor(kr.cob);
      const zeraAntesDoEnvio=prox!=null&&cobDias<diasAteEnvio;
      const diaZero=kr.diaZero||new Date(Date.now()+Math.max(0,cobDias)*864e5).toISOString().slice(0,10);
      return {...x,k:kr,cobDias,zeraAntesDoEnvio,diaZero};
    })
    .filter(x=>x.cobDias<=diasLimite||x.zeraAntesDoEnvio)
    .sort((a,b)=>a.cobDias-b.cobDias)
    .map(x=>({...x,prox,diasAteEnvio}));
}
function renderRuptura(){
  const el=document.getElementById('tab-ruptura'); if(!el) return;
  const diasLimite=fullCfg().diasAlertaRuptura||10;
  const secoes=STORES.map(loja=>{
    const l=rupturaLojaLista(loja,diasLimite);
    const prox=proximoEnvioLoja(loja);
    const antesDoEnvio=l.filter(x=>x.zeraAntesDoEnvio).length;
    return {loja,l,prox,antesDoEnvio};
  });
  const totalRisco=secoes.reduce((a,s)=>a+s.l.length,0);
  const totalAntes=secoes.reduce((a,s)=>a+s.antesDoEnvio,0);
  el.innerHTML=`
  <div class="card">
    <div class="form-grid">
      <label>Avisar ruptura com <small>(dias de antecedência)</small><input id="rDiasAlerta" type="number" min="1" value="${diasLimite}"></label>
    </div>
    <p class="hint">Mostra, por loja, todo SKU que — no ritmo de venda atual — vai zerar no FULL dentro desse prazo, e destaca em vermelho quem vai zerar <b>antes do próximo envio já programado</b> em Envios programados (não a data manual da Previsão). O cálculo conta aptas + em transferência sempre, e dos envios programados só entra quem tem data <b>igual ou antes</b> da projeção de zerar — envio programado pra depois que já zerou não evita a ruptura, então não entra na conta. Esse mesmo campo de dias também controla o alerta da Visão Geral.</p>
  </div>
  <div class="cards-linha">
    <div class="card mini ${totalRisco?'alerta':''}"><span class="rot">SKU(s) em risco (todas as lojas)</span><b>${fmtInt(totalRisco)}</b>
      <small>dentro de ${diasLimite} dia(s)</small></div>
    <div class="card mini ${totalAntes?'alerta':''}"><span class="rot">Vão zerar antes do envio programado</span><b>${fmtInt(totalAntes)}</b>
      <small>${totalAntes?'precisam de ação — antecipar ou emergência':'nenhum, com os envios programados de hoje'}</small></div>
  </div>
  ${secoes.map(({loja,l,prox,antesDoEnvio})=>`
    <div class="card">
      <div class="acoes-linha" style="justify-content:space-between;align-items:center">
        <h3 style="margin:0">${esc(loja)}</h3>
        <span class="hint" style="margin:0">${prox?'Próximo envio programado: <b>'+fmtData(prox.data)+'</b> ('+esc(prox.nome)+')':'Nenhum envio programado para esta loja'}</span>
      </div>
      ${!l.length?`<p class="empty-inline">Nenhum SKU em risco de ruptura nesta loja.</p>`:`
      ${antesDoEnvio?`<div class="aviso risco" style="margin-top:10px"><span>🚨</span><span><b>${antesDoEnvio} SKU(s) vão zerar antes do envio programado.</b> Antecipe o envio se der, ou crie um FULL de emergência só com eles.</span>
        <button class="btn sm danger" data-remerg="${esc(loja)}">🚨 FULL de emergência</button></span></div>`:''}
      <div class="table-wrap" style="margin-top:10px"><table class="tbl-produtos"><thead><tr>
        <th>SKU</th><th class="num">Estoque FULL</th><th class="num">Vendas/dia</th><th class="num">Cobertura</th><th>Zera em</th><th></th></tr></thead><tbody>
        ${l.map(({i,k,p,cobDias,zeraAntesDoEnvio,diaZero})=>`<tr>
          <td class="mono">${esc(fullSku(i))}</td>
          <td class="num">${fmtInt(k.full)}</td>
          <td class="num">${k.media.toFixed(2)}</td>
          <td class="num">${cobDias} d</td>
          <td>${zeraAntesDoEnvio?`<span class="pend">${fmtData(diaZero)} — antes do envio</span>`:fmtData(diaZero)}</td>
          <td><button class="btn sm" data-rver="${loja}" title="Ver e ajustar na Previsão de reposição">Ver na Previsão</button></td>
        </tr>`).join('')}
      </tbody></table></div>`}
    </div>`).join('')}`;
  const rd=document.getElementById('rDiasAlerta'); if(rd) rd.onchange=()=>{
    const v=Number(rd.value);
    if(isNaN(v)||v<1){ alert('Valor inválido.'); renderRuptura(); return; }
    snapshot('ajuste de dias de alerta de ruptura'); fullCfg().diasAlertaRuptura=v; persist();
  };
  el.querySelectorAll('[data-rver]').forEach(b=>b.onclick=()=>{ fullCfg().loja=b.dataset.rver; persist(); irParaAba('previsao'); });
  el.querySelectorAll('[data-remerg]').forEach(b=>b.onclick=()=>{ fullCfg().loja=b.dataset.remerg; persist(); abrirCriarFullEmergencia(); });
}

/* ---------- render ---------- */
function renderAll(){
  /* cada seção isolada: se uma falhar, as outras continuam atualizando */
  [['bloqueio',renderBloqueio],['avisos',renderAvisos],['tarefas',renderTarefas],['onboarding',renderOnboard],['visão geral',renderDashboard],
   ['produtos',renderProdutos],['comprar',renderComprar],['coletar',renderColetar],['notas fiscais',renderNotasFiscais],['finanças',renderFinancas],['ads',renderAds],
   ['previsão FULL',renderPrevisao],['envios',renderEnvio],['ruptura',renderRuptura],['barra',updateFileStatus],['menu',atualizarBadgeTarefas]
  ].forEach(([nome,fn])=>{
    try{ fn(); }catch(err){ console.error('Erro ao renderizar '+nome,err); toast('⚠ Erro ao atualizar a aba '+nome+'. Recarregue a página.'); }
  });
}

/* ---------- init ---------- */
function irParaSub(nome){
  document.querySelectorAll('#subFull button').forEach(x=>x.setAttribute('aria-selected',x.dataset.sub===nome?'true':'false'));
  ['previsao','envio','ruptura'].forEach(n=>{ const p=document.getElementById('tab-'+n); if(p) p.classList.toggle('hidden',n!==nome); });
}
function irParaAba(nome){
  /* previsão, envios e ruptura moram na mesma aba FULL */
  let sub=null;
  if(nome==='previsao'||nome==='envio'||nome==='ruptura'){ sub=nome; nome='full'; }
  const b=document.querySelector('#mainNav button[data-tab='+nome+']'); if(!b) return;
  document.querySelectorAll('#mainNav button').forEach(x=>x.setAttribute('aria-selected','false'));
  b.setAttribute('aria-selected','true');
  document.querySelectorAll('.tabpanel').forEach(p=>p.classList.add('hidden'));
  const p=document.getElementById('tab-'+nome); if(p) p.classList.remove('hidden');
  if(sub) irParaSub(sub);
  try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){}
}
document.querySelectorAll('#mainNav button').forEach(b=>{ b.onclick=()=>irParaAba(b.dataset.tab); });
document.querySelectorAll('#subFull button').forEach(b=>{ b.onclick=()=>irParaSub(b.dataset.sub); });
document.getElementById('btnArquivo').onclick=menuArquivo;
document.getElementById('btnBackup').onclick=baixarBackup;
document.getElementById('btnDesfazer').onclick=desfazer;
document.getElementById('confirmYes').onclick=()=>{
  document.getElementById('confirmOverlay').classList.add('hidden');
  if(pendingConfirm) pendingConfirm();
  pendingConfirm=null;
};
document.getElementById('confirmNo').onclick=()=>{ document.getElementById('confirmOverlay').classList.add('hidden'); pendingConfirm=null; };
document.getElementById('modalOverlay').addEventListener('click',e=>{ if(e.target.id==='modalOverlay') closeModal(); });
/* os iconezinhos "i" (.det .i) mostram detalhe no hover, mas isso depende de ter espaço na
   tela — perto do topo, do rodapé ou dentro de listas com rolagem, o balão pode ficar cortado
   ou preso na área visível. Clicar no ícone abre o mesmo conteúdo numa janela normal (o modal
   que já existe no resto do Doca), que sempre aparece inteira, não importa onde a linha esteja. */
document.addEventListener('click',e=>{
  const i=e.target.closest('.det .i'); if(!i) return;
  const pop=i.nextElementSibling; if(!pop||!pop.classList.contains('pop')) return;
  const body=openModal(true);
  body.innerHTML=`<h3>Detalhe</h3><div class="det" style="display:block"><span class="pop" style="position:static;opacity:1;pointer-events:auto;transform:none;box-shadow:none;border:0;padding:0;display:block;min-width:0;background:transparent">${pop.innerHTML}</span></div><div class="modal-acoes"><button class="btn" id="btnFecharDet">Fechar</button></div>`;
  document.getElementById('btnFecharDet').onclick=closeModal;
});
document.getElementById('confirmOverlay').addEventListener('click',e=>{ if(e.target.id==='confirmOverlay'){ document.getElementById('confirmOverlay').classList.add('hidden'); pendingConfirm=null; } });

/* grava pendências ao sair ou trocar de aba.
   Só avisa/força gravação se houver arquivo/pasta conectado — sem isso os dados já
   estão salvos no cache deste navegador (localStorage) e não há nada "pendente" de verdade. */
function flushEdicaoAtual(){
  const a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&typeof a.blur==='function') a.blur();
}
window.addEventListener('visibilitychange',()=>{
  flushEdicaoAtual();
  if(document.visibilityState==='hidden'&&alteracaoLocal&&fileHandle) saveToFile();
});
window.addEventListener('beforeunload',e=>{
  flushEdicaoAtual();
  if(alteracaoLocal&&fileHandle){ saveToFile(); e.preventDefault(); e.returnValue=''; }
});

loadFromLocalStorage();
renderBloqueio();   /* trava a tela imediatamente, antes de tudo */
renderAll();
tentarReconectar();

/* sincroniza com o Mercado Livre sozinho assim que o Doca abre, se o backend já estiver
   configurado — não precisa clicar em nada nem dar F5. Passa por TODAS as lojas (STORES),
   uma de cada vez (não em paralelo, pra não sobrecarregar o backend/servidor gratuito),
   aplicando automaticamente o que já está vinculado por SKU/mlItemId. Roda em segundo
   plano; se uma loja falhar (não autorizada, servidor dormindo, sem internet etc.) segue
   pras próximas sem travar o resto do app — cada loja fica só com os dados de quando
   funcionou por último. */
(async function sincronizarMlAoAbrir(){
  if(!backendUrl()) return;
  /* fatura do Mercado Livre primeiro (uma chamada rápida por loja) — antes ela ficava no fim de
     uma fila sequencial (produtos → Mercado Pago → Ads → fatura → imposto, loja por loja), então
     se qualquer passo mais lento travasse ou o backend gratuito estivesse "dormindo", a fatura só
     aparecia depois de clicar manualmente em "🔄" na aba Finanças. Disparar as 4 lojas exatamente
     ao mesmo tempo esbarrava no limite de chamadas por segundo do Mercado Livre (429), então agora
     começa uma loja a cada 500ms (ainda bem mais rápido que a fila antiga) e cada uma tenta de
     novo sozinha se cair num 429 (ver puxarFaturaMlComRetry). */
  const promessasFatura=[];
  for(let i=0;i<STORES.length;i++){
    const loja=STORES[i];
    promessasFatura.push(puxarFaturaMlComRetry(loja).catch(e=>{
      console.error(`Sincronização automática da fatura do Mercado Livre falhou ao abrir o Doca (loja ${loja}):`,e.message);
      financasUltimoErroAuto[loja]=e.message;
    }));
    if(i<STORES.length-1) await sleep(500);
  }
  await Promise.allSettled(promessasFatura);
  renderFinancas();
  for(const loja of STORES){
    try{
      const resultado=await mlSincronizarLoja(loja);
      aplicarSincronizacaoAutomatica(resultado);
    }catch(e){
      console.error(`Sincronização automática com o Mercado Livre falhou ao abrir o Doca (loja ${loja}):`,e.message);
    }
    try{
      aplicarSincronizacaoFinanceira(loja,await mpSincronizarFinanceiro(loja));
    }catch(e){
      console.error(`Sincronização automática do financeiro (Mercado Pago) falhou ao abrir o Doca (loja ${loja}):`,e.message);
    }
    try{
      await adsSincronizarLoja(loja);
    }catch(e){
      console.error(`Sincronização automática de Ads falhou ao abrir o Doca (loja ${loja}):`,e.message);
    }
    try{
      await sincronizarImpostoAutomatico(loja);
      renderDashboard();
    }catch(e){
      console.error(`Sincronização automática do imposto (Visão Geral) falhou ao abrir o Doca (loja ${loja}):`,e.message);
    }
  }
})();

/* re-sync periódico só do financeiro (Mercado Pago), enquanto a aba do Doca fica aberta.
   Motivo (descoberto com dado real em 13/08): o relatório do Mercado Pago fica pronto rápido,
   mas o Doca só ia buscar ele quando a aba era aberta/recarregada - sem isso, um relatório que
   ficasse pronto enquanto ninguém tinha o Doca aberto só era "visto" horas depois, na próxima
   vez que alguém abrisse o app, dentro da janela de frescor. Rodando esse re-sync sozinho a
   cada 20min, a aba aberta vai catando o relatório pronto sem precisar recarregar a página. */
async function sincronizarFinanceiroPeriodico(){
  if(!backendUrl()) return;
  for(const loja of STORES){
    try{ aplicarSincronizacaoFinanceira(loja,await mpSincronizarFinanceiro(loja)); }
    catch(e){ console.error(`Re-sync periódico do financeiro (Mercado Pago) falhou (loja ${loja}):`,e.message); }
  }
}
setInterval(sincronizarFinanceiroPeriodico,20*60*1000);
</script>
