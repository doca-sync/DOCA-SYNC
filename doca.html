/* Reserva o que está no galpão (Local) e o que já foi comprado e está por coletar.
   O Coletar NÃO é descontado — o motorista continua vendo tudo que precisa buscar. */
function alocarNoEnvio(envio,produtoEscolhido,solicitado,kitPaiId){
  const marcaEnvio='FULL '+(envio.nome||'')+(envio.loja?' · '+envio.loja:'');
  /* se o SKU escolhido e' um KIT (junta outros produtos, ex: Kit Pet = 1 luva + 1 Esponja Pet),
     ele nao tem estoque proprio pra alocar - explode a quantidade pedida em cada componente
     (qtd. por unidade x solicitado) e aloca/reserva/manda comprar CADA componente separado,
     recursivamente (cada componente passa de novo por essa mesma funcao, entao se um componente
     TAMBEM for vinculado a um mestre ou for ele mesmo um kit aninhado, resolve certo tambem).
     Registra 1 item "guarda-chuva" do kit no envio (0 em tudo, quem carrega os numeros de
     verdade sao os itens dos componentes, marcados com kitDeItemId apontando pra esse guarda-
     chuva) - a tela de Envios (renderEnvio) usa esse link pra CONSOLIDAR kit + componentes numa
     linha só em vez de mostrar cada um separado. */
  const comps=componentesDe(produtoEscolhido);
  if(comps.length){
    const idGuardaChuva=gerarId('it');
    envio.itens.push({id:idGuardaChuva,produtoId:produtoEscolhido.id,solicitado,alocado:0,reservadoColeta:0,geradoCompra:0,kitGuardaChuva:true,kitDeItemId:kitPaiId||null});
    let alocadoTotal=0,aCaminhoTotal=0,geradoTotal=0;
    comps.forEach(c=>{
      const comp=prodById(c.produtoId); if(!comp) return;
      const r=alocarNoEnvio(envio,comp,solicitado*c.qtdPorUnidade,idGuardaChuva);
      alocadoTotal+=r.alocado; aCaminhoTotal+=r.aCaminho; geradoTotal+=r.gerado;
    });
    produtoEscolhido.atualizadoEm=Date.now();
    return {alocado:alocadoTotal,aCaminho:aCaminhoTotal,gerado:geradoTotal,itemId:idGuardaChuva};
  }
  /* se o SKU escolhido na tela e' um membro vinculado (estoque fisico compartilhado com outro
     anuncio), o estoque de verdade mora no mestre - aloca/decrementa/compra sempre por la',
     senao ficava tirando de um produto.qtd.local que fica sempre travado em 0 pra um vinculado
     (mandava tudo pra "comprar" mesmo tendo estoque de sobra no mestre). O item do envio continua
     registrado com o produtoId do SKU ESCOLHIDO (pra saber pra qual anuncio esse envio FULL e'),
     so' a CONTA de disponibilidade/decremento que acontece no mestre. */
  const produto=produtoEfetivo(produtoEscolhido);
  const aloc=Math.min(solicitado,produto.qtd.local);
  produto.qtd.local-=aloc;
  let falta=solicitado-aloc;
  const resCol=Math.min(falta,coletarLivre(produto));
  falta-=resCol;
  const gerado=falta;
  if(gerado>0){
    if(!produto.pedidos) produto.pedidos=[];
    produto.pedidos.push({...novoPedido(gerado),origem:marcaEnvio,envioId:envio.id});
    sincronizarPedidos(produto);
  }
  const idItem=gerarId('it');
  envio.itens.push({id:idItem,produtoId:produto.id,skuEscolhidoId:produtoEscolhido.id!==produto.id?produtoEscolhido.id:null,solicitado,alocado:aloc,reservadoColeta:resCol,geradoCompra:gerado,kitDeItemId:kitPaiId||null});
  produto.atualizadoEm=Date.now();
  produtoEscolhido.atualizadoEm=Date.now();
  return {alocado:aloc,aCaminho:resCol,gerado,itemId:idItem};
}
/* puxa para a reserva o que estiver sobrando no Local */
function alocarPendentes(envioId){
  const e=envioById(envioId); if(!e) return 0;
  snapshot('alocar estoque no envio '+e.nome);
  let total=0;
  e.itens.forEach(i=>{
    const p=prodById(i.produtoId); if(!p) return;
    const falta=(i.solicitado||0)-(i.alocado||0)-(i.reservadoColeta||0)-(i.geradoCompra||0);
    const alvo=Math.max(falta,0)+ (i.geradoCompra||0);
    const dl=Math.min(alvo,p.qtd.local);
    if(dl<=0) return;
    p.qtd.local-=dl; i.alocado+=dl; total+=dl;
    i.geradoCompra=Math.max(0,(i.geradoCompra||0)-dl);
  });
  persist(); return total;
}
/* tira a quantidade dos pedidos gerados por ESTE envio; só depois recorre aos demais */
function removerCompraDoEnvio(p,envioId,qtd){
  if(!p.pedidos) p.pedidos=[];
  let rest=qtd;
  for(let i=p.pedidos.length-1;i>=0&&rest>0;i--){
    if(p.pedidos[i].envioId!==envioId) continue;
    const t=Math.min(rest,p.pedidos[i].qtd);
    p.pedidos[i].qtd-=t; rest-=t;
    if(p.pedidos[i].qtd<=0) p.pedidos.splice(i,1);
  }
  for(let i=p.pedidos.length-1;i>=0&&rest>0;i--){
    const t=Math.min(rest,p.pedidos[i].qtd);
    p.pedidos[i].qtd-=t; rest-=t;
    if(p.pedidos[i].qtd<=0) p.pedidos.splice(i,1);
  }
  sincronizarPedidos(p);
}
function reverterItem(item,envioId){
  const p=prodById(item.produtoId); if(!p) return;
  p.qtd.local+=(item.alocado||0);
  if(item.geradoCompra>0) removerCompraDoEnvio(p,envioId,item.geradoCompra);
  p.atualizadoEm=Date.now();
}
function cancelarEnvio(envioId){
  const e=envioById(envioId); if(!e) return;
  snapshot('cancelamento do envio '+e.nome);
  e.itens.forEach(i=>reverterItem(i,e.id));
  state.envios=state.envios.filter(x=>x.id!==envioId);
  persist();
}
/* todos os itens do envio que pertencem ao grupo de 1 kit (o guarda-chuva + todos os
   componentes explodidos dele, recursivo pra suportar kit de kit) - usado pra Remover/Ajustar
   tratarem o kit como 1 linha só na tela de Envios, mesmo internamente sendo N itens. */
function itensDoGrupoKit(envio,kitItemId){
  const grupo=[]; const fila=[kitItemId];
  while(fila.length){
    const alvo=fila.shift();
    const item=envio.itens.find(i=>i.id===alvo); if(!item) continue;
    grupo.push(item);
    envio.itens.filter(i=>i.kitDeItemId===alvo).forEach(f=>fila.push(f.id));
  }
  return grupo;
}
/* remove o kit inteiro (guarda-chuva + componentes) de um envio - reverte cada peça pro
   estoque/compra antes de tirar da lista, igual removerItemEnvio faria pra cada uma. */
function removerGrupoKitEnvio(envioId,kitItemId){
  const e=envioById(envioId); if(!e) return;
  const grupo=itensDoGrupoKit(e,kitItemId);
  const kit=grupo.find(i=>i.id===kitItemId), p=kit&&prodById(kit.produtoId);
  snapshot('remoção do kit '+(p?p.sku:'')+' do envio '+e.nome);
  grupo.forEach(it=>reverterItem(it,envioId));
  const idsGrupo=new Set(grupo.map(i=>i.id));
  e.itens=e.itens.filter(i=>!idsGrupo.has(i.id));
  persist();
}
/* ajusta a quantidade de um kit já no envio - como a quantidade nova muda a explosão de TODOS
   os componentes (nem sempre proporcional, por causa de estoque/coletar/comprar de cada um),
   o jeito seguro é reverter o grupo inteiro e alocar de novo do zero com o novo total, reusando
   a mesma lógica testada de alocarNoEnvio em vez de tentar calcular a diferença componente a
   componente. */
function ajustarGrupoKitEnvio(envioId,kitItemId,novoTotal){
  const e=envioById(envioId); if(!e) return {ok:false,msg:'Envio não encontrado.'};
  const grupo=itensDoGrupoKit(e,kitItemId);
  const kit=grupo.find(i=>i.id===kitItemId); if(!kit) return {ok:false,msg:'Item não encontrado.'};
  const p=prodById(kit.produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  novoTotal=parseInt(novoTotal);
  if(isNaN(novoTotal)||novoTotal<0) return {ok:false,msg:'Informe uma quantidade válida.'};
  const totalAntes=kit.solicitado||0;
  if(novoTotal===totalAntes) return {ok:true,dif:0};
  snapshot(`ajuste do kit ${p.sku} no envio ${e.nome}`);
  grupo.forEach(it=>reverterItem(it,envioId));
  const idsGrupo=new Set(grupo.map(i=>i.id));
  e.itens=e.itens.filter(i=>!idsGrupo.has(i.id));
  if(novoTotal>0) alocarNoEnvio(e,p,novoTotal);
  persist();
  return {ok:true,dif:novoTotal-totalAntes};
}
function removerItemEnvio(envioId,itemId){
  const e=envioById(envioId); if(!e) return;
  const it=e.itens.find(i=>i.id===itemId); if(!it) return;
  const p=prodById(it.produtoId);
  snapshot('remoção de '+(p?p.sku:'item')+' do envio '+e.nome);
  reverterItem(it,envioId);
  e.itens=e.itens.filter(i=>i.id!==itemId);
  persist();
}
/* move a programação de 1 item de um envio pra outro já existente (mesma loja) - diferente de
   remover+recriar, isso NÃO libera e re-reserva o estoque (que ficaria idêntico de qualquer
   forma): só muda qual envio "é dono" da reserva/compra que já está feita. Se o envio de
   destino já tiver esse mesmo produto, soma nele em vez de duplicar linha. */
function moverItemEnvio(envioIdOrigem,itemId,envioIdDestino){
  const eo=envioById(envioIdOrigem); if(!eo) return {ok:false,msg:'Envio de origem não encontrado.'};
  const ed=envioById(envioIdDestino); if(!ed) return {ok:false,msg:'Envio de destino não encontrado.'};
  if(envioIdOrigem===envioIdDestino) return {ok:false,msg:'Já está neste envio.'};
  const it=eo.itens.find(i=>i.id===itemId); if(!it) return {ok:false,msg:'Item não encontrado.'};
  const p=prodById(it.produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  if(ed.loja!==p.loja) return {ok:false,msg:'O envio de destino é de outra loja.'};
  snapshot('mover '+p.sku+' do envio '+eo.nome+' para '+ed.nome);
  /* re-marca os pedidos de compra deste produto que estavam etiquetados pro envio de origem -
     senão, se um dos dois envios for cancelado depois, o sistema ia procurar a ordem de compra
     pelo envio errado (removerCompraDoEnvio casa por envioId) e não achava/reduzia certo. */
  const marcaDestino='FULL '+(ed.nome||'')+(ed.loja?' · '+ed.loja:'');
  (p.pedidos||[]).forEach(c=>{ if(c.envioId===envioIdOrigem){ c.envioId=envioIdDestino; c.origem=marcaDestino; } });
  eo.itens=eo.itens.filter(i=>i.id!==itemId);
  const existente=ed.itens.find(i=>i.produtoId===it.produtoId);
  if(existente){
    existente.solicitado=(existente.solicitado||0)+(it.solicitado||0);
    existente.alocado=(existente.alocado||0)+(it.alocado||0);
    existente.reservadoColeta=(existente.reservadoColeta||0)+(it.reservadoColeta||0);
    existente.geradoCompra=(existente.geradoCompra||0)+(it.geradoCompra||0);
  } else {
    ed.itens.push({...it,id:gerarId('it')});
  }
  persist();
  return {ok:true};
}
/* cria um envio novo de emergência (separado dos programados) e já move este item pra ele */
function moverItemParaNovoEmergencia(envioIdOrigem,itemId,data,localColeta){
  const eo=envioById(envioIdOrigem); if(!eo) return {ok:false,msg:'Envio de origem não encontrado.'};
  const it=eo.itens.find(i=>i.id===itemId); if(!it) return {ok:false,msg:'Item não encontrado.'};
  const p=prodById(it.produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  let res=null;
  batch('criação de FULL de emergência a partir do envio '+eo.nome,()=>{
    const novo=criarEnvio('🚨 Emergência '+fmtData(data),data,p.loja,'',localColeta||LOCAIS_COLETA[0]);
    novo.origem='emergencia';
    res=moverItemEnvio(envioIdOrigem,itemId,novo.id);
    if(res.ok) res.envio=novo;
    else state.envios=state.envios.filter(x=>x.id!==novo.id);
  });
  return res;
}
/* re-etiqueta uma quantidade PARCIAL de pedidos de compra (envioId+origem) de um envio pro
   outro - igual moverItemEnvio faz, só que aqui pode ter que partir 1 pedido em 2 (uma parte
   fica com o envio de origem, outra vai pro de destino), porque nem sempre a fatia que está
   indo de emergência bate exatamente com 1 pedido inteiro. */
function reetiquetarPedidosParcial(p,envioIdOrigem,envioIdDestino,marcaDestino,qtd){
  if(!p.pedidos) return;
  let restante=qtd;
  for(const c of p.pedidos){
    if(restante<=0) break;
    if(c.envioId!==envioIdOrigem) continue;
    if(c.qtd<=restante){ c.envioId=envioIdDestino; c.origem=marcaDestino; restante-=c.qtd; }
    else { c.qtd-=restante; p.pedidos.push({id:gerarId('c'),qtd:restante,data:c.data,obs:c.obs,origem:marcaDestino,envioId:envioIdDestino}); restante=0; }
  }
  sincronizarPedidos(p);
}
/* move uma quantidade PARCIAL de um item pra outro envio JÁ EXISTENTE (mesma loja) - o resto
   fica no envio de origem, programado normalmente. Se a quantidade pedida for o item inteiro,
   cai no mesmo caminho de moverItemEnvio (sem sobrar item vazio no envio de origem). */
function moverQtdEntreEnvios(envioIdOrigem,itemId,envioIdDestino,qtd){
  const eo=envioById(envioIdOrigem); if(!eo) return {ok:false,msg:'Envio de origem não encontrado.'};
  const ed=envioById(envioIdDestino); if(!ed) return {ok:false,msg:'Envio de destino não encontrado.'};
  if(envioIdOrigem===envioIdDestino) return {ok:false,msg:'Já está neste envio.'};
  const it=eo.itens.find(i=>i.id===itemId); if(!it) return {ok:false,msg:'Item não encontrado.'};
  const p=prodById(it.produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  if(ed.loja!==p.loja) return {ok:false,msg:'O envio de destino é de outra loja.'};
  qtd=Math.max(0,Math.min(Math.round(qtd),it.solicitado||0));
  if(qtd<=0) return {ok:false,msg:'Informe uma quantidade válida.'};
  if(qtd>=(it.solicitado||0)) return moverItemEnvio(envioIdOrigem,itemId,envioIdDestino);
  snapshot('mover '+fmtInt(qtd)+' un. de '+p.sku+' do envio '+eo.nome+' para '+ed.nome);
  const marcaDestino='FULL '+(ed.nome||'')+(ed.loja?' · '+ed.loja:'');
  let restante=qtd;
  const tirarAlocado=Math.min(restante,it.alocado||0); restante-=tirarAlocado;
  const tirarColeta=Math.min(restante,it.reservadoColeta||0); restante-=tirarColeta;
  const tirarCompra=Math.min(restante,it.geradoCompra||0); restante-=tirarCompra;
  if(tirarCompra>0) reetiquetarPedidosParcial(p,envioIdOrigem,envioIdDestino,marcaDestino,tirarCompra);
  it.alocado=(it.alocado||0)-tirarAlocado;
  it.reservadoColeta=(it.reservadoColeta||0)-tirarColeta;
  it.geradoCompra=(it.geradoCompra||0)-tirarCompra;
  it.solicitado=(it.solicitado||0)-qtd;
  const existente=ed.itens.find(i=>i.produtoId===it.produtoId);
  if(existente){
    existente.solicitado=(existente.solicitado||0)+qtd;
    existente.alocado=(existente.alocado||0)+tirarAlocado;
    existente.reservadoColeta=(existente.reservadoColeta||0)+tirarColeta;
    existente.geradoCompra=(existente.geradoCompra||0)+tirarCompra;
  } else {
    ed.itens.push({id:gerarId('it'),produtoId:it.produtoId,solicitado:qtd,alocado:tirarAlocado,reservadoColeta:tirarColeta,geradoCompra:tirarCompra});
  }
  persist();
  return {ok:true};
}
/* cria um FULL de emergência com só uma PARTE da quantidade programada no item (o resto
   continua no envio de origem, programado normalmente) - prioriza tirar do que já está mais
   pronto (galpão primeiro, depois a coletar, só por último o que ainda nem foi comprado),
   igual o resto do sistema já faz ao reservar. Se a quantidade pedida cobrir o item inteiro,
   cai no mesmo caminho de moverItemParaNovoEmergencia (sem sobrar item vazio no envio de
   origem). */
function moverQtdParaNovoEmergencia(envioIdOrigem,itemId,qtd,data,localColeta){
  const eo=envioById(envioIdOrigem); if(!eo) return {ok:false,msg:'Envio de origem não encontrado.'};
  const it=eo.itens.find(i=>i.id===itemId); if(!it) return {ok:false,msg:'Item não encontrado.'};
  const p=prodById(it.produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  qtd=Math.max(0,Math.min(Math.round(qtd),it.solicitado||0));
  if(qtd<=0) return {ok:false,msg:'Informe uma quantidade válida.'};
  if(qtd>=(it.solicitado||0)) return moverItemParaNovoEmergencia(envioIdOrigem,itemId,data,localColeta);
  let res=null;
  batch('criação de FULL de emergência (parcial) a partir do envio '+eo.nome,()=>{
    const novo=criarEnvio('🚨 Emergência '+fmtData(data),data,p.loja,'',localColeta||LOCAIS_COLETA[0]);
    novo.origem='emergencia';
    const marcaDestino='FULL '+(novo.nome||'')+(novo.loja?' · '+novo.loja:'');
    let restante=qtd;
    const tirarAlocado=Math.min(restante,it.alocado||0); restante-=tirarAlocado;
    const tirarColeta=Math.min(restante,it.reservadoColeta||0); restante-=tirarColeta;
    const tirarCompra=Math.min(restante,it.geradoCompra||0); restante-=tirarCompra;
    if(tirarCompra>0) reetiquetarPedidosParcial(p,envioIdOrigem,novo.id,marcaDestino,tirarCompra);
    it.alocado=(it.alocado||0)-tirarAlocado;
    it.reservadoColeta=(it.reservadoColeta||0)-tirarColeta;
    it.geradoCompra=(it.geradoCompra||0)-tirarCompra;
    it.solicitado=(it.solicitado||0)-qtd;
    novo.itens.push({id:gerarId('it'),produtoId:it.produtoId,solicitado:qtd,alocado:tirarAlocado,reservadoColeta:tirarColeta,geradoCompra:tirarCompra});
    res={ok:true,envio:novo};
  });
  return res;
}
/* reduz o envio ao que já está etiquetado no galpão, liberando o que faltava */
function ajustarEnvioParaPronto(envioId){
  const e=envioById(envioId); if(!e) return 0;
  snapshot('ajuste do envio '+e.nome+' para o que está pronto');
  let liberado=0;
  e.itens.forEach(i=>{
    const p=prodById(i.produtoId);
    const pend=(i.solicitado||0)-(i.alocado||0);
    if(pend<=0) return;
    liberado+=pend;
    if(p&&i.geradoCompra>0) removerCompraDoEnvio(p,e.id,i.geradoCompra);
    i.reservadoColeta=0; i.geradoCompra=0; i.solicitado=i.alocado;
  });
  e.itens=e.itens.filter(i=>(i.solicitado||0)>0);
  persist();
  return liberado;
}
function confirmarEnvioFull(envioId,manterCompra){
  const e=envioById(envioId); if(!e) return;
  snapshot('confirmação do envio '+e.nome);
  if(!manterCompra) e.itens.forEach(i=>{ const p=prodById(i.produtoId); if(p&&i.geradoCompra>0) removerCompraDoEnvio(p,e.id,i.geradoCompra); });
  /* confirmar só tira o envio da programação (ele já não conta mais como "Próximos
     programados" na Previsão) — não tenta mais adivinhar um estado intermediário de "a
     caminho do Full" localmente. Assim que a mercadoria chegar de verdade, a próxima
     sincronização com o Mercado Livre mostra ela em "Aptas"/"Em transferência", que já é
     dado real direto da API — sem número congelado no meio do caminho. */
  const somado=[];
  e.itens.forEach(i=>{
    const p=prodById(i.produtoId); if(!p||!(i.solicitado>0)) return;
    const fi=state.full.itens.find(x=>x.loja===e.loja&&fullProduto(x)&&fullProduto(x).id===p.id);
    if(fi) fi.ajuste=null;
    somado.push(p.sku);
    flashFull[p.id]=Date.now();
  });
  state.envios=state.envios.filter(x=>x.id!==envioId);
  persist();
  if(somado.length) toast(somado.length+' SKU(s) confirmados como FULL. Assim que o Mercado Livre receber, a próxima sincronização atualiza sozinha.');
  /* tira o realce depois de alguns segundos e re-renderiza só pra limpar a classe */
  setTimeout(()=>{ flashFull={}; renderPrevisao(); },2600);
}

let renderizandoTarefas=false;
/* avança uma data ISO em 1 mês, ajustando pro último dia quando o mês novo é mais curto */
function proximoMes(iso){
  if(!iso) return '';
  const [a,m,d]=iso.split('-').map(Number);
  let novoM=m+1, novoA=a;
  if(novoM>12){ novoM=1; novoA++; }
  const ultimoDia=new Date(novoA,novoM,0).getDate();
  const novoD=Math.min(d,ultimoDia);
  return novoA+'-'+String(novoM).padStart(2,'0')+'-'+String(novoD).padStart(2,'0');
}
let listaAtual='';
function renderTarefas(){
  renderizandoTarefas=true;
  const el=document.getElementById('tab-tarefas');
  const h=hoje();
  if(!state.listas.length) state.listas=[{id:'lista_geral',nome:'GERAL'}];
  if(!listaAtual||!state.listas.some(l=>l.id===listaAtual)) listaAtual=state.listas[0].id;
  const tarefas=tarefasDaLista(listaAtual);
  const listaAtualObj=state.listas.find(l=>l.id===listaAtual);
  el.innerHTML=`
    <h1 class="page-title">Tarefas</h1>
    <div class="listas-bar">
      ${state.listas.map(l=>{
        const n=tarefasDaLista(l.id).length, atr=tarefasAtrasadas(l.id);
        return `<button class="lista-chip ${l.id===listaAtual?'ativa':''}" data-lista="${l.id}" draggable="true"
          title="Clique para abrir · arraste para mudar a ordem · solte uma tarefa aqui para movê-la">${esc(l.nome)}${n?` <span class="chip-n${atr?' atras':''}">${n}</span>`:''}</button>`;
      }).join('')}
      <button class="lista-chip nova" id="btnNovaLista" title="Criar outra lista">+ Nova lista</button>
      ${state.listas.length?`<span class="lista-acoes">
        <button class="btn sm" id="btnRenomearLista" title="Renomear esta lista">✎</button>
        ${state.listas.length>1?`<button class="btn sm danger-outline" id="btnExcluirLista" title="Excluir esta lista">✕</button>`:''}
      </span>`:''}
    </div>
    <div class="tarefa-nova">
      <input id="tfTitulo" type="text" placeholder="O que precisa ser feito?" autocomplete="off" value="${esc(novaTarefaTitulo)}">
      ${botaoData('tfData',novaTarefaData,{placeholder:'Data (opcional)',style:'',classe:'sm'})}
      <input id="tfHora" type="time" title="Horário (opcional)">
      <button type="button" class="btn sm ${novoGestaoTipo==='mensal'?'acc':''}" id="tfGestaoMensal" title="Criar já em Gestão Ativa mensal: não some ao concluir, fica com ✓ e volta a pedir sozinha no mês seguinte">🔁M</button>
      <button type="button" class="btn sm ${novoGestaoTipo==='semanal'?'acc':''}" id="tfGestaoSemanal" title="Criar já em Gestão Ativa semanal: não some ao concluir, fica com ✓ e volta a pedir sozinha na semana seguinte">🔁S</button>
      <button class="btn gold" id="btnAddTarefa">+ Adicionar</button>
    </div>
    ${tarefas.length?`<div class="tarefa-lista" id="tarefaLista">
      ${tarefas.map(t=>{
        const venc=t.data&&t.data<h, hj=t.data===h;
        const idx=tarefas.indexOf(t);
        const subs=t.subs||[];
        const resetaTipo=t.resetaTipo;
        const mensal=!!resetaTipo; // true pra qualquer modo periódico ativo nesta tarefa (mensal OU semanal)
        const periodoAtualLista=mensal?periodoAtualParaTarefa(t):null;
        const rotuloPeriodo=resetaTipo==='semanal'?'esta semana':'este mês';
        const rotuloPeriodoSeg=resetaTipo==='semanal'?'na semana seguinte':'no mês seguinte';
        const feitas=mensal?subs.filter(s=>s.concluidoMes===periodoAtualLista).length:subs.filter(s=>s.feito).length;
        const temSubsMensal=mensal&&subs.length>0;
        const feitaEsteMes=temSubsMensal?(feitas===subs.length):(mensal&&tarefaFeitaEsteMes(t));
        return `<div class="tarefa" draggable="true" data-tid="${t.id}">
          <div class="tarefa-topo">
            <span class="tarefa-grip" title="Arraste para mudar a prioridade">⠿</span>
            <span class="tarefa-ordem">
              <button data-sobe="${t.id}" ${idx===0?'disabled':''} title="Subir">▲</button>
              <button data-desce="${t.id}" ${idx===tarefas.length-1?'disabled':''} title="Descer">▼</button>
            </span>
            ${temSubsMensal?(feitaEsteMes?`<span class="tarefa-check feito" title="Todas as subtarefas concluídas ${rotuloPeriodo}"></span>`:''):`<button class="tarefa-check ${feitaEsteMes?'feito':''}" data-concluir="${t.id}" title="${mensal?(feitaEsteMes?('Feita '+rotuloPeriodo+' — clique para reabrir'):('Marcar como feita '+rotuloPeriodo+' (não some, volta a pedir '+rotuloPeriodoSeg+')')):'Concluir tarefa'}"></button>`}
            <input class="tarefa-tit" type="text" value="${esc(t.titulo)}" data-tit="${t.id}" placeholder="Sem título">
            <button type="button" class="tarefa-resumo" data-abrir="${t.id}" title="Data, horário, repetição e observação">${t.data?`📅 ${fmtData(t.data).slice(0,5)}`:''}${t.repetirMensal?' 🔁':''}${(!t.data&&!t.repetirMensal)?'⋯':''}</button>
            ${subs.length?`<span class="sub-cont ${feitas===subs.length?'ok':''}" title="Subtarefas concluídas">${feitas}/${subs.length}</span>`:''}
            ${botaoData('data_'+t.id,t.data,{placeholder:'Data',style:'',classe:'tarefa-data '+(venc?'venc':(hj?'hoje':'')),dataAttr:`data-databtn="${t.id}"`})}
            <input class="tarefa-hora" type="time" value="${esc(t.hora||'')}" data-hora="${t.id}" title="Horário (opcional)">
            <button class="tarefa-repetir ${resetaTipo==='mensal'?'ativo':''}" data-gestaomensal="${t.id}" title="${resetaTipo==='mensal'?'Gestão Ativa mensal ativada — clique para desativar':'Ativar Gestão Ativa mensal nesta tarefa: não some ao concluir, fica com ✓ e volta a pedir sozinha no mês seguinte'}">🔁M</button>
            <button class="tarefa-repetir ${resetaTipo==='semanal'?'ativo':''}" data-gestaosemanal="${t.id}" title="${resetaTipo==='semanal'?'Gestão Ativa semanal ativada — clique para desativar':'Ativar Gestão Ativa semanal nesta tarefa: não some ao concluir, fica com ✓ e volta a pedir sozinha na semana seguinte'}">🔁S</button>
            <button class="tarefa-x" data-excluir="${t.id}" title="Excluir tarefa">✕</button>
          </div>
          <textarea class="tarefa-obs" data-obs="${t.id}" rows="1" placeholder="Observações (Enter pula linha)">${esc(t.obs)}</textarea>
          ${subs.length?`<div class="subs">
            ${subs.map((s,si)=>{ const sFeito=mensal?(s.concluidoMes===periodoAtualLista):s.feito; return `<div class="sub ${sFeito?'feita':''}" draggable="true" data-subid="${t.id}|${s.id}">
              <span class="sub-grip" title="Arraste para reordenar">⠿</span>
              <button class="sub-check" data-sub="${t.id}|${s.id}" title="${sFeito?'Reabrir':'Concluir'}">${sFeito?'✓':''}</button>
              <input class="sub-tit" type="text" value="${esc(s.titulo)}" data-subtit="${t.id}|${s.id}">
              <button class="sub-x" data-subx="${t.id}|${s.id}" title="Remover">✕</button>
            </div>`; }).join('')}
          </div>`:''}
          <div class="sub-nova">
            <span class="sub-mais">+</span>
            <input type="text" data-novasub="${t.id}" placeholder="Adicionar subtarefa (Enter para incluir)">
            ${state.listas.length>1?`<span class="mover-lista" title="Mover esta tarefa para outra lista">
              <select data-movelista="${t.id}">
                <option value="">↦ mover para...</option>
                ${state.listas.filter(l=>l.id!==t.listaId).map(l=>`<option value="${l.id}">${esc(l.nome)}</option>`).join('')}
              </select></span>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>`:`<p class="empty-inline">Nenhuma tarefa nesta lista. Adicione a primeira acima — ou arraste uma tarefa de outra lista para o nome desta aqui em cima.</p>`}`;
  const btnTfData=document.getElementById('tfData');
  if(btnTfData) btnTfData.onclick=()=>abrirSeletorData(novaTarefaData,(iso)=>{ novaTarefaData=iso; renderTarefas(); });
  const add=()=>{
    const tituloInput=document.getElementById('tfTitulo');
    const horaInput=document.getElementById('tfHora');
    const tit=tituloInput.value.trim();
    if(!tit){ alert('Escreva o que precisa ser feito.'); return; }
    const dataEscolhida=novaTarefaData, gestaoEscolhido=novoGestaoTipo, horaEscolhida=horaInput.value;
    novaTarefaData='';
    novoGestaoTipo=null;
    novaTarefaTitulo='';
    addTarefa(tit,dataEscolhida,horaEscolhida,false,'',gestaoEscolhido);
    const c=document.getElementById('tfTitulo'); if(c) c.focus();
    /* pedido do Felipe 20/08: o alerta de "tarefas pra hoje" só disparava ao abrir o app ou
       trocar de aba - se a tarefa for criada já com data de hoje enquanto a pessoa já está na
       aba Tarefas, o alerta nunca aparecia (só apareceria só se saísse e voltasse pra aba, ou
       recarregasse a página). Chama de novo aqui, logo após criar - não faz nada se não tiver
       nenhuma tarefa pendente pra hoje. */
    mostrarAlertaTarefasDoDia();
  };
  const tfTituloEl=document.getElementById('tfTitulo');
  tfTituloEl.oninput=()=>{ novaTarefaTitulo=tfTituloEl.value; };
  document.getElementById('tfGestaoMensal').onclick=()=>{ novoGestaoTipo=novoGestaoTipo==='mensal'?null:'mensal'; renderTarefas(); };
  document.getElementById('tfGestaoSemanal').onclick=()=>{ novoGestaoTipo=novoGestaoTipo==='semanal'?null:'semanal'; renderTarefas(); };
  el.querySelectorAll('[data-lista]').forEach(b=>b.onclick=()=>{ listaAtual=b.dataset.lista; renderTarefas(); });
  document.getElementById('btnNovaLista').onclick=()=>{
    const body=openModal(false);
    body.innerHTML=`<h3>Nova lista de tarefas</h3>
      <div class="form-grid"><label class="span2">Nome da lista<input id="lstNome" type="text" placeholder="Ex: COMPRAS, GALPÃO, FINANCEIRO"></label></div>
      <div class="modal-actions"><button class="btn" id="btnCancelar">Cancelar</button><button class="btn acc" id="btnCriarLista">Criar lista</button></div>`;
    document.getElementById('btnCancelar').onclick=closeModal;
    document.getElementById('lstNome').focus();
    const criar=()=>{ const n=document.getElementById('lstNome').value.trim(); if(!n){ alert('Dê um nome à lista.'); return; } addLista(n); closeModal(); toast('Lista criada.'); mostrarAlertaTarefasDoDia(); };
    document.getElementById('btnCriarLista').onclick=criar;
    document.getElementById('lstNome').onkeydown=e=>{ if(e.key==='Enter') criar(); };
  };
  const br=document.getElementById('btnRenomearLista');
  if(br) br.onclick=()=>{
    const l=state.listas.find(x=>x.id===listaAtual);
    const body=openModal(false);
    body.innerHTML=`<h3>Renomear lista</h3>
      <div class="form-grid"><label class="span2">Nome<input id="lstNome" type="text" value="${esc(l.nome)}"></label></div>
      <div class="modal-actions"><button class="btn" id="btnCancelar">Cancelar</button><button class="btn acc" id="btnOk">Salvar</button></div>`;
    document.getElementById('btnCancelar').onclick=closeModal;
    const ok=()=>{ renomearLista(listaAtual,document.getElementById('lstNome').value); closeModal(); toast('Lista renomeada.'); };
    document.getElementById('btnOk').onclick=ok;
    document.getElementById('lstNome').onkeydown=e=>{ if(e.key==='Enter') ok(); };
  };
  const bx=document.getElementById('btnExcluirLista');
  if(bx) bx.onclick=()=>{
    const l=state.listas.find(x=>x.id===listaAtual);
    const n=tarefasDaLista(listaAtual).length;
    confirmAction(`Excluir a lista "${l.nome}"${n?` e as ${n} tarefa(s) dela`:''}? Dá pra reverter no botão Desfazer.`,()=>{
      excluirLista(listaAtual); toast('Lista excluída.');
    });
  };
  document.getElementById('btnAddTarefa').onclick=add;
  document.getElementById('tfTitulo').onkeydown=e=>{ if(e.key==='Enter') add(); };
  document.getElementById('tfHora').onkeydown=e=>{ if(e.key==='Enter') add(); };
  el.querySelectorAll('[data-concluir]').forEach(b=>b.onclick=()=>{
    const t=state.tarefas.find(x=>x.id===b.dataset.concluir);
    if(t&&t.resetaTipo){
      // tarefa em Gestão Ativa (mensal ou semanal): não some - só alterna feito/reabrir, reseta sozinha no período seguinte
      const rot=t.resetaTipo==='semanal'?'esta semana':'este mês';
      if(tarefaFeitaEsteMes(t)){ desconcluirTarefa(b.dataset.concluir); toast('Tarefa reaberta: '+((t&&t.titulo)||'')); }
      else { concluirTarefaMensal(b.dataset.concluir); toast('✓ Concluída '+rot+': '+((t&&t.titulo)||'')); }
      renderTarefas();
      return;
    }
    b.classList.add('feito');
    setTimeout(()=>{
      const r=concluirTarefa(b.dataset.concluir);
      toast(r&&r.repetiu?`🔁 Concluída — volta em ${fmtData(r.novaData)}: ${(t&&t.titulo)||''}`:('Tarefa concluída: '+((t&&t.titulo)||'')));
    },180);
  });
  el.querySelectorAll('[data-gestaomensal]').forEach(b=>b.onclick=()=>{ alternarGestaoTipoTarefa(b.dataset.gestaomensal,'mensal'); renderTarefas(); });
  el.querySelectorAll('[data-gestaosemanal]').forEach(b=>b.onclick=()=>{ alternarGestaoTipoTarefa(b.dataset.gestaosemanal,'semanal'); renderTarefas(); });
  el.querySelectorAll('[data-excluir]').forEach(b=>b.onclick=()=>{
    const t=state.tarefas.find(x=>x.id===b.dataset.excluir);
    confirmAction(`Excluir a tarefa "${(t&&t.titulo)||''}"? Dá pra reverter no botão Desfazer.`,()=>{
      concluirTarefa(b.dataset.excluir); toast('Tarefa excluída.');
    });
  });
  el.querySelectorAll('[data-sobe]').forEach(b=>b.onclick=()=>{
    const i=tarefas.findIndex(x=>x.id===b.dataset.sobe);
    if(i>0) moverTarefa(b.dataset.sobe,tarefas[i-1].id);
  });
  el.querySelectorAll('[data-desce]').forEach(b=>b.onclick=()=>{
    const i=tarefas.findIndex(x=>x.id===b.dataset.desce);
    if(i>=0&&i<tarefas.length-1) moverTarefa(b.dataset.desce,tarefas[i+1].id);
  });
  el.querySelectorAll('[data-tit]').forEach(i=>i.onchange=()=>updateTarefa(i.dataset.tit,{titulo:i.value.toUpperCase()}));
  el.querySelectorAll('[data-obs]').forEach(i=>{
    const ajustar=()=>{ i.style.height='auto'; i.style.height=(i.scrollHeight+2)+'px'; };
    ajustar(); i.oninput=ajustar;
    i.onchange=()=>updateTarefa(i.dataset.obs,{obs:i.value.toUpperCase()});
  });
  el.querySelectorAll('[data-novasub]').forEach(i=>{
    i.onkeydown=ev=>{
      if(ev.key==='Enter'&&i.value.trim()){
        ev.preventDefault();
        const v=i.value, tid=i.dataset.novasub;
        i.value=''; i.onblur=null;
        addSub(tid,v);
        const novo=document.querySelector(`[data-novasub="${tid}"]`);
        if(novo) novo.focus();
      }
    };
    i.onblur=()=>{ if(renderizandoTarefas) return; if(i.value.trim()) addSub(i.dataset.novasub,i.value); };
  });
  el.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{
    const [tid,sid]=b.dataset.sub.split('|');
    const tt=state.tarefas.find(x=>x.id===tid);
    if(tt&&tt.resetaTipo) alternarSubMensal(tid,sid); else alternarSub(tid,sid);
    renderTarefas();
  });
  el.querySelectorAll('[data-subtit]').forEach(i=>i.onchange=()=>{ const [tid,sid]=i.dataset.subtit.split('|'); editarSub(tid,sid,i.value); });
  el.querySelectorAll('[data-subx]').forEach(b=>b.onclick=()=>{ const [tid,sid]=b.dataset.subx.split('|'); removerSub(tid,sid); });
  /* arrastar subtarefa pra reordenar (só dentro da mesma tarefa) */
  el.querySelectorAll('.sub[data-subid]').forEach(c=>{
    c.ondragstart=ev=>{
      if(['INPUT','TEXTAREA','BUTTON'].includes(ev.target.tagName)){ ev.preventDefault(); return; }
      arrastandoSub=c.dataset.subid; ev.stopPropagation(); c.classList.add('arrastando');
      ev.dataTransfer.effectAllowed='move'; try{ev.dataTransfer.setData('text/plain',c.dataset.subid);}catch(e){}
    };
    c.ondragend=()=>{ arrastandoSub=null; el.querySelectorAll('.sub[data-subid]').forEach(x=>x.classList.remove('arrastando','alvo')); };
    c.ondragover=ev=>{
      if(!arrastandoSub) return;
      const [tidA]=arrastandoSub.split('|'), [tidB]=c.dataset.subid.split('|');
      if(tidA!==tidB) return; /* só reordena dentro da mesma tarefa */
      ev.preventDefault(); ev.stopPropagation();
      if(arrastandoSub!==c.dataset.subid) c.classList.add('alvo');
    };
    c.ondragleave=()=>c.classList.remove('alvo');
    c.ondrop=ev=>{
      ev.preventDefault(); ev.stopPropagation(); c.classList.remove('alvo');
      if(!arrastandoSub||arrastandoSub===c.dataset.subid) return;
      const [tidA,sidA]=arrastandoSub.split('|'), [tidB,sidB]=c.dataset.subid.split('|');
      if(tidA!==tidB) return;
      moverSubPara(tidA,sidA,sidB);
    };
  });
  el.querySelectorAll('[data-databtn]').forEach(b=>b.onclick=()=>{
    const t=state.tarefas.find(x=>x.id===b.dataset.databtn); if(!t) return;
    abrirSeletorData(t.data,(iso)=>updateTarefa(t.id,{data:iso}));
  });
  el.querySelectorAll('[data-repetir]').forEach(b=>b.onclick=()=>{
    const t=state.tarefas.find(x=>x.id===b.dataset.repetir); if(!t) return;
    const novo=!t.repetirMensal;
    if(novo&&!t.data){ alert('Defina uma data para a tarefa antes de ativar a repetição mensal.'); return; }
    updateTarefa(b.dataset.repetir,{repetirMensal:novo});
    toast(novo?'🔁 Tarefa marcada como repetição mensal.':'Repetição mensal desativada.');
  });
  el.querySelectorAll('[data-hora]').forEach(i=>i.onchange=()=>updateTarefa(i.dataset.hora,{hora:i.value}));
  el.querySelectorAll('[data-abrir]').forEach(b=>b.onclick=()=>{
    const card=b.closest('.tarefa'); card.classList.toggle('aberta');
    const obs=card.querySelector('.tarefa-obs');
    if(obs&&card.classList.contains('aberta')){ obs.style.height='auto'; obs.style.height=(obs.scrollHeight+2)+'px'; }
  });
  el.querySelectorAll('[data-movelista]').forEach(s=>s.onchange=()=>{
    if(!s.value) return;
    const r=moverTarefaParaLista(s.dataset.movelista,s.value);
    if(r.ok) toast(`"${r.tarefa.titulo}" foi para ${r.para}.`);
  });
  el.querySelectorAll('.tarefa').forEach(c=>{
    c.ondragstart=ev=>{ if(['INPUT','TEXTAREA','BUTTON'].includes(ev.target.tagName)){ ev.preventDefault(); return; } arrastando=c.dataset.tid; arrastandoLista=null; c.classList.add('arrastando'); ev.dataTransfer.effectAllowed='move'; try{ev.dataTransfer.setData('text/plain',c.dataset.tid);}catch(e){} el.querySelectorAll('.lista-chip[data-lista]').forEach(x=>x.classList.add('pode-soltar')); };
    c.ondragend=()=>{ arrastando=null; el.querySelectorAll('.tarefa').forEach(x=>x.classList.remove('arrastando','alvo'));
      el.querySelectorAll('.lista-chip').forEach(x=>x.classList.remove('pode-soltar','alvo-chip')); };
    c.ondragover=ev=>{ ev.preventDefault(); if(arrastando&&arrastando!==c.dataset.tid) c.classList.add('alvo'); };
    c.ondragleave=()=>c.classList.remove('alvo');
    c.ondrop=ev=>{ ev.preventDefault(); c.classList.remove('alvo'); if(arrastando) moverTarefa(arrastando,c.dataset.tid); };
  });
  /* chips das listas: recebem tarefas e podem ser reordenados entre si */
  el.querySelectorAll('.lista-chip[data-lista]').forEach(ch=>{
    ch.ondragstart=ev=>{ arrastandoLista=ch.dataset.lista; arrastando=null; ch.classList.add('arrastando');
      ev.dataTransfer.effectAllowed='move'; try{ev.dataTransfer.setData('text/plain',ch.dataset.lista);}catch(e){}
      ev.stopPropagation(); };
    ch.ondragend=()=>{ arrastandoLista=null;
      el.querySelectorAll('.lista-chip').forEach(x=>x.classList.remove('arrastando','alvo-chip','pode-soltar')); };
    ch.ondragover=ev=>{
      if(arrastando){ ev.preventDefault(); if(tarefaById(arrastando)&&tarefaById(arrastando).listaId!==ch.dataset.lista) ch.classList.add('alvo-chip'); return; }
      if(arrastandoLista&&arrastandoLista!==ch.dataset.lista){ ev.preventDefault(); ch.classList.add('alvo-chip'); }
    };
    ch.ondragleave=()=>ch.classList.remove('alvo-chip');
    ch.ondrop=ev=>{
      ev.preventDefault(); ev.stopPropagation(); ch.classList.remove('alvo-chip');
      if(arrastando){
        const r=moverTarefaParaLista(arrastando,ch.dataset.lista);
        arrastando=null;
        if(r.ok) toast(`"${r.tarefa.titulo}" foi para ${r.para}.`);
        else if(r.mesma) toast('A tarefa já está nessa lista.');
        return;
      }
      if(arrastandoLista){ const ok=reordenarListas(arrastandoLista,ch.dataset.lista); arrastandoLista=null; if(ok) toast('Ordem das listas atualizada.'); }
    };
  });
  renderizandoTarefas=false;
}
/* ---------- visão geral ---------- */
function finLoja(loja){
  if(!state.financeiro) state.financeiro={};
  if(!state.financeiro[loja]) state.financeiro[loja]={mercadoPago:0,aReceber:0,imposto:0,aliquotaImposto:0};
  else{
    if(typeof state.financeiro[loja].imposto!=='number') state.financeiro[loja].imposto=Number(state.financeiro[loja].imposto)||0;
    if(typeof state.financeiro[loja].aliquotaImposto!=='number') state.financeiro[loja].aliquotaImposto=Number(state.financeiro[loja].aliquotaImposto)||0;
  }
  return state.financeiro[loja];
}
function atualizarFinanceiro(loja,patch){
  const f=finLoja(loja);
  snapshot('ajuste financeiro de '+loja);
  if(patch.mercadoPago!==undefined){ f.mercadoPago=Math.max(0,parseMoeda(patch.mercadoPago)); }
  if(patch.aReceber!==undefined){ f.aReceber=Math.max(0,parseMoeda(patch.aReceber)); }
  if(patch.imposto!==undefined){ f.imposto=Math.max(0,parseMoeda(patch.imposto)); }
  if(patch.aliquotaImposto!==undefined){ const v=Number(String(patch.aliquotaImposto).replace(',','.')); f.aliquotaImposto=isNaN(v)?0:Math.min(100,Math.max(0,v)); }

/* soma das faturas do Mercado Livre ainda não pagas dessa loja (cadastradas em Finanças, origem
   "ml_fatura") - usada aqui só pra descontar do patrimônio da Visão Geral, sem duplicar a lógica
   de cálculo que já existe na aba Finanças */
function faturaMlPendenteLoja(loja){
  return despesasArr().filter(d=>d.origem==='ml_fatura'&&d.loja===loja&&!d.pago).reduce((s,d)=>s+(Number(d.valor)||0),0);
}
/* recalcula o campo "Imposto" da Visão Geral automaticamente: faturamento do mês corrente × a
   alíquota configurada em Finanças → Resumo Financeiro pra essa loja. Se a alíquota ainda não foi
   configurada (0%), o imposto fica em R$0,00 mesmo (não é um erro, só falta configurar). */
function aplicarImpostoAutomatico(loja,faturamentoMes){
  const f=finLoja(loja);
  f.imposto=faturamentoMes*((f.aliquotaImposto||0)/100);
  f.impostoFaturamentoBase=faturamentoMes;
  f.impostoAtualizadoEm=Date.now();
  persist();
}
async function sincronizarImpostoAutomatico(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
  const r=await fetch(`${base}/financas/faturamento-mes?loja=${encodeURIComponent(loja)}`);
  let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+r.status+').'); }
  if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao buscar o faturamento do mês (status '+r.status+').'));
  aplicarImpostoAutomatico(loja,j.faturamento||0);
}

/* ---------- sugestão de resposta pronta (IA) - Perguntas e Mensagens pós-venda ----------
   Pedido do Felipe (20/08): tanto em Perguntas quanto em Mensagens pós-venda, deixar a resposta
   sugerida já pronta na caixa de texto, só pra clicar Responder (ou editar antes). Busca em
   paralelo pra todos os itens de uma vez e só re-renderiza no final (evita apagar o que a pessoa
   já esteja digitando a cada sugestão que for chegando). */
let sugestoesResposta={}; // chave (questionId ou packId) -> texto sugerido | 'carregando' | ''(falhou)
async function buscarSugestaoSilenciosa(chave,tipo,texto,titulo){
  sugestoesResposta[chave]='carregando';
  try{
    const base=backendUrl(); if(!base) return;
    const r=await fetch(`${base}/sugestao/resposta`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tipo,texto,titulo:titulo||null})
    });
    const j=await r.json();
    sugestoesResposta[chave]=(r.ok&&j.ok&&j.sugestao)?j.sugestao:'';
  }catch(e){ sugestoesResposta[chave]=''; }
}
/* ---------- reclamações e mediações (card na Visão Geral) ----------
   Resolvidas automaticamente pelo backend (dentro do /sync, pela regra do frete) - aqui só busca
   o relatório do que já foi feito, pra mostrar sempre visível (inclusive quando não tem
   pendência nenhuma). Carregado junto com a sincronização normal (ver sincronizarMlAoAbrir e o
   botão Atualizar). */
/* Mensagens pós-venda e Reclamações podem demorar bastante no backend (processam vários packs/claims
   em sequência contra a API do Mercado Livre) - se o backend travar ou demorar demais, um fetch()
   normal fica pendurado pra sempre e o card fica em "carregando..." eternamente. Esse helper corta
   depois de "ms" milissegundos e joga um erro, pra sempre chegar num estado final. */
async function fetchComTimeout(url,opts,ms){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),ms);
  try{ return await fetch(url,Object.assign({},opts,{signal:ctrl.signal})); }
  catch(e){ if(e.name==='AbortError') throw new Error('demorou demais pra responder (mais de '+Math.round(ms/1000)+'s)'); throw e; }
  finally{ clearTimeout(timer); }
}
let reclamacoesPorLoja={}; // loja -> {total,pendentes,resolvidas,itens} | undefined = ainda não carregou
async function carregarReclamacoes(loja){
  try{
    const base=backendUrl(); if(!base){ reclamacoesPorLoja[loja]={total:0,pendentes:0,resolvidas:0,itens:[],erro:'backend não configurado'}; return; }
    const r=await fetchComTimeout(`${base}/reclamacoes/relatorio?loja=${encodeURIComponent(loja)}`,{},30000);
    const j=await r.json();
    if(r.ok&&j.ok) reclamacoesPorLoja[loja]=j;
    else reclamacoesPorLoja[loja]={total:0,pendentes:0,resolvidas:0,itens:[],erro:j.erro||('status '+r.status)};
  }catch(e){
    console.error('Falha ao buscar relatório de reclamações ('+loja+'):',e.message);
    // sempre fecha num estado terminal (nunca deixa undefined) - senão o card fica em "carregando..."
    // pra sempre quando o backend falha ou demora demais.
    reclamacoesPorLoja[loja]={total:0,pendentes:0,resolvidas:0,itens:[],erro:e.message};
  }
}

/* ---------- produtos ---------- */
function mlSyncCfg(){ return state.mlSync.cfg; }
/* URL do backend: se não foi digitada em Produtos → Atualizar, e o próprio Doca está sendo
   aberto direto do backend (ex.: https://doca-sync.onrender.com/doca, o caso do celular), usa
   o endereço da própria página como padrão — não precisa configurar nada à mão nesse caso. */
function backendUrl(){
  const configurada=(mlSyncCfg().baseUrl||'').trim().replace(/\/+$/,'');
  if(configurada) return configurada;
  if(location.protocol==='http:'||location.protocol==='https:') return location.origin;
  return '';
}
function statusMlLabel(s){
  const mapa={active:'Ativo',paused:'Pausado',closed:'Encerrado',under_review:'Em revisão',inactive:'Inativo',payment_required:'Aguardando pagamento'};
  return mapa[s]||(s||'—');
}
/* só mostra algo quando tem concorrência real na página do catálogo (empatando ou perdendo) —
   "ganhando"/"listado" não indicam a presença de outro vendedor de forma confiável, então ficam mudos */
function concorrenciaLabel(s){
  if(s==='losing') return 'Perdendo no catálogo';
  if(s==='sharing_first') return 'Empatando no catálogo';
  return null;
}
/* alimenta automaticamente a mesma lista usada pelo card "No FULL" da Visão Geral (state.full.itens)
   com o que vem da API do Mercado Livre: quantidade "aptas", vendas 7/15/30d (a Previsão de
   reposição e a média ponderada passam a usar isso, igual usariam uma leitura manual do
   painel) e a transferência real entre depósitos do Full.
   O cálculo do "No Full" é sempre aptas+transf, os dois direto da API — nada inferido/guardado
   localmente. O campo "Entrada pendente" (que tentava adivinhar o que já foi confirmado como
   FULL no Doca mas a API ainda não mostrou) foi removido: não tinha fonte confiável (Mercado
   Livre não expõe isso por API) e criava número congelado/errado sempre que algo mudava fora
   do Doca. Pra planejar o próximo envio, o que interessa é "Próximos programados" (envios já
   criados no Doca e ainda não confirmados como FULL — ver entradaPendenteDe/fullCalc), que é
   um dado 100% real, mantido pelo próprio Doca. Assim que um envio é confirmado como FULL, ele
   sai da programação e some do cálculo até a próxima sincronização mostrar ele em aptas/transf
   de verdade — sem precisar adivinhar o estado intermediário. */
function mlAtualizarFullDoSinc(p,item,loja){
  let fi=state.full.itens.find(x=>x.loja===loja&&fullProduto(x)&&fullProduto(x).id===p.id);
  if(!fi){
    fi={id:gerarId('fi'),loja,sku:p.sku,codigo:p.codigo||'',produtoId:p.id,
      v7:0,v15:0,v30:0,aptas:0,aCaminho:0,transf:0,mediaFixa:null,ajuste:null,movido:null};
    state.full.itens.push(fi);
  }
  const transferido=(typeof item.transferencia_full==='number')?item.transferencia_full:0;
  fi.aptas=item.quantidade_disponivel||0;
  fi.v7=(typeof item.vendas_7d==='number')?item.vendas_7d:(fi.v7||0);
  fi.v15=(typeof item.vendas_15d==='number')?item.vendas_15d:(fi.v15||0);
  fi.v30=(typeof item.vendas_30d==='number')?item.vendas_30d:(fi.v30||0);
  fi.transf=transferido;
  fi.aCaminho=transferido;
  fi.aCaminhoFonte='api';
  fi.confirmadoNaoVerificado=0;
  fi.movido=null;
  state.full.lidoEm[loja]=Date.now();
}
/* chama o backend hospedado: primeiro manda sincronizar (POST /sync), depois busca o resultado (GET /data) */
async function mlSincronizarLoja(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro (ex: https://doca-sync.onrender.com).');
  const rSync=await fetch(`${base}/sync?loja=${encodeURIComponent(loja)}`,{method:'POST'});
  let jSync; try{ jSync=await rSync.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado (status '+rSync.status+'). Confira a URL.'); }
  if(!rSync.ok||!jSync.ok) throw new Error(jSync.erro||('Falha ao sincronizar (status '+rSync.status+').'));
  const rData=await fetch(`${base}/data?loja=${encodeURIComponent(loja)}`);
  let jData; try{ jData=await rData.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado ao buscar os dados.'); }
  if(!rData.ok||!jData.ok) throw new Error(jData.erro||'Falha ao buscar os dados sincronizados.');
  return jData;
}
/* sincroniza o financeiro (saldo Mercado Pago + a receber) de 1 loja com o backend. Os
   relatórios do Mercado Pago são assíncronos (pedem minutos pra ficar prontos), então cada
   chamada tenta TERMINAR o pedido anterior e/ou começar um novo — o valor só troca de verdade
   quando um pedido anterior finalmente fica pronto, por isso guarda sempre o "atualizado em"
   junto (ver aplicarSincronizacaoFinanceira). Se a loja não tem token do Mercado Pago
   configurado no backend, o retorno vem com configurado:false e essa loja simplesmente
   continua com os campos manuais — não é erro. */
async function mpSincronizarFinanceiro(loja){
  const base=backendUrl();
  if(!base) throw new Error('Configure a URL do backend primeiro.');
  const r=await fetch(`${base}/financeiro/mp/sincronizar?loja=${encodeURIComponent(loja)}`,{method:'POST'});
  let j; try{ j=await r.json(); }catch(e){ throw new Error('O backend respondeu algo inesperado ao sincronizar o financeiro.'); }
  if(!r.ok||!j.ok) throw new Error(j.erro||('Falha ao sincronizar o financeiro (status '+r.status+').'));
  return j;
}
/* aplica o resultado de mpSincronizarFinanceiro no state — só sobrescreve o número quando o
   backend realmente tem um valor lido (saldoDisponivel/aReceber não nulos); enquanto o
   primeiro relatório ainda não processou, mantém o que já estava (0 ou o que foi digitado
   manualmente antes de ligar a automação) e só liga a marcação de "automático". */
function aplicarSincronizacaoFinanceira(loja,j){
  if(!j||!j.configurado) return;
  const f=finLoja(loja);
  f.mpAutomatico=true;
  /* Number(...) aqui é proposital: o backend pode devolver esses valores como texto
     (coluna "numeric" do Postgres vira string), e "3310"+"2716.3" em JS gruda os dígitos
     em vez de somar, gerando um patrimônio absurdo. Nunca confiar que a API manda number. */
  if(j.saldoDisponivel!=null){ f.mercadoPago=Number(j.saldoDisponivel)||0; f.mpAtualizadoEm=j.saldoAtualizadoEm||null; }
  if(j.aReceber!=null){ f.aReceber=Number(j.aReceber)||0; f.aReceberAtualizadoEm=j.aReceberAtualizadoEm||null; }
  persist();
}
/* aplica os dados de 1 anúncio sincronizado no SKU do Doca que já está vinculado a ele —
   usado tanto no vínculo automático (por mlItemId/SKU) quanto no manual e na importação,
   pra não ter a mesma lista de campos copiada em 3 lugares */
function aplicarItemSincronizado(p,item,loja){
  p.mlItemId=item.ml_item_id;
  p.mlQtdDisponivel=item.quantidade_disponivel;
  p.mlAtualizadoEm=item.atualizado_em;
  p.mlStatus=item.status||null;
  p.mlCatalogo=!!item.catalog_listing;
  p.mlConcorrenciaStatus=item.concorrencia_status||null;
  p.mlConcorrenciaPreco=(typeof item.concorrencia_preco==='number')?item.concorrencia_preco:null;
  p.mlPerguntas=item.perguntas_sem_resposta||0;
  p.mlTransferencia=(typeof item.transferencia_full==='number')?item.transferencia_full:null;
  p.mlAusente=false; p.mlAusenteDesde=null;
  mlAtualizarFullDoSinc(p,item,loja);
}
/* depois de aplicar a sincronização, marca como "ausente no ML" todo produto desta loja que já
   teve um anúncio vinculado (mlItemId) mas não veio na resposta desta sincronização - ou seja,
   o anúncio foi excluído/encerrado no Mercado Livre. Não apaga o cadastro (custo, fornecedor,
   histórico de compra continuam), só marca pra sumir das listas ativas (Produtos, Previsão etc)
   até você decidir o que fazer. Se o produto reaparecer numa sincronização futura, a marca sai
   sozinha (ver aplicarItemSincronizado acima). */
function marcarAusentesNoML(loja,itensDoResultado){
  // trata item com status "closed" como se nao tivesse vindo na sincronizacao - o Mercado Livre as
  // vezes ainda devolve o anuncio encerrado por um tempo na listagem de itens do vendedor, mas pra
  // nos ele ja era (nao vai vender mais); sem isso, um anúncio recem-encerrado continuava aparecendo
  // como se estivesse ativo, escondendo do "mlAusente" (achado com dado real do Felipe, 21/08).
  const encontrados=new Set((itensDoResultado||[]).filter(it=>it.status!=='closed').map(it=>it.ml_item_id));
  let mudou=false;
  state.produtos.filter(p=>p.loja===loja&&p.mlItemId).forEach(p=>{
    const ausenteAgora=!encontrados.has(p.mlItemId);
    if(ausenteAgora&&!p.mlAusente){ p.mlAusente=true; p.mlAusenteDesde=Date.now(); mudou=true; }
  });
  return mudou;
}
/* cadastra no Doca, sozinho, um anúncio do ML que ainda não tem SKU correspondente — usa o
   SKU do próprio anúncio (ou o ID do anúncio, se não tiver SKU) como SKU do Doca e o título
   do anúncio como Código, com custo/fornecedor em branco pra completar depois. Se por acaso já
   existir um produto com esse SKU nessa loja (corrida entre duas sincronizações, por ex.),
   reaproveita em vez de duplicar. */
function importarProdutoAutomatico(item,loja){
  const skuGerado=(item.sku||item.ml_item_id).toUpperCase();
  let p=state.produtos.find(x=>x.loja===loja&&(x.sku||'').toUpperCase()===skuGerado);
  if(!p){
    p=addProduto({loja,sku:skuGerado,codigo:item.titulo||'',fornecedor:'',custo:0,estoqueMinimo:0,
      qtd:{comprar:0,coletar:0,local:0},lotes:[],pedidos:[],obsCompra:'Importado automaticamente do Mercado Livre.'});
  }
  aplicarItemSincronizado(p,item,loja);
  return p;
}
/* casa cada anúncio do resultado com o SKU certo (por mlItemId salvo, ou por SKU quando bate);
   o que não bater com nada é cadastrado sozinho no Doca (ver importarProdutoAutomatico) — não
   precisa importar manualmente cada anúncio novo. Usado tanto pelo modal quanto pela
   sincronização automática ao abrir o Doca. */
function aplicarSincronizacaoAutomatica(resultado){
  const produtosDaLoja=state.produtos.filter(p=>p.loja===resultado.loja);
  let vinculados=0,importados=0;
  resultado.produtos.forEach(item=>{
    let p=produtosDaLoja.find(x=>x.mlItemId===item.ml_item_id);
    if(!p&&item.sku) p=produtosDaLoja.find(x=>!x.mlItemId&&x.sku&&x.sku.toLowerCase()===item.sku.toLowerCase());
    if(p){ aplicarItemSincronizado(p,item,resultado.loja); vinculados++; }
    else { p=importarProdutoAutomatico(item,resultado.loja); produtosDaLoja.push(p); importados++; }
  });
  const mudouAusentes=marcarAusentesNoML(resultado.loja,resultado.produtos);
  if(vinculados>0||importados>0||mudouAusentes) persist();
  return {vinculados,importados};
}
/* modal com o botão Atualizar: sincroniza com o backend e mostra os anúncios do Mercado Livre
   comparados com o cadastro do Doca (vínculo por mlItemId salvo, ou por SKU quando bate) */

  let render=(resultado,erro)=>{
    let linhasHtml='';

        if(!p&&item.sku) p=produtosDaLoja.find(x=>!x.mlItemId&&x.sku&&x.sku.toLowerCase()===item.sku.toLowerCase());
        let importadoAgora=false;
        if(p){ aplicarItemSincronizado(p,item,resultado.loja); }
        else { p=importarProdutoAutomatico(item,resultado.loja); produtosDaLoja.push(p); importadoAgora=true; }
        mudouAlgo=true;
        return `<tr>
          <td>${esc(item.titulo)}</td>
          <td class="mono">${esc(item.sku)||'<span class="muted">—</span>'}</td>
          <td class="num">${fmtInt(item.quantidade_disponivel)}</td>
          <td>${statusMlLabel(item.status)}${item.catalog_listing?' <span title="Vinculado ao catálogo do Mercado Livre">📚</span>':''}${concorrenciaLabel(item.concorrencia_status)?` <span title="${esc(concorrenciaLabel(item.concorrencia_status))}${(typeof item.concorrencia_preco==='number')?' · Concorrente: '+fmtMoney(item.concorrencia_preco):''}">⚔</span>`:''}</td>
          <td><span class="okv">✓ ${esc(p.sku)} (${esc(p.loja)})</span>${importadoAgora?` <span class="pend" title="Cadastro criado automaticamente pela sincronização — confira/edite custo e fornecedor na aba Produtos">🆕 novo SKU</span>`:''}<br><span class="muted" style="font-size:11px">Disponível no Doca: ${fmtInt(disponivel(p))}</span></td>
        </tr>`;
      }).join('');
      if(marcarAusentesNoML(resultado.loja,resultado.produtos)) mudouAlgo=true;
      if(mudouAlgo) persist();
    }
    body.innerHTML=`<h3>🔄 Sincronizar com o Mercado Livre</h3>

        <label>URL do backend<input id="mlBaseUrl" type="text" placeholder="${esc(backendUrl()||'https://doca-sync.onrender.com')}" value="${esc(c.baseUrl)}"></label>

      </div>
      ${!c.baseUrl&&backendUrl()?`<p class="hint" style="margin-top:6px">Detectado automaticamente: <b class="mono">${esc(backendUrl())}</b> (o próprio endereço deste Doca). Só preencha o campo acima se quiser usar outro.</p>`:''}
      <div class="acoes-linha" style="margin-top:10px">
        <button class="btn gold" id="btnMlAtualizar">🔄 Atualizar todas as lojas</button>
        <span id="mlStatus" style="font-size:12.5px;color:var(--muted)"></span>
      </div>
      ${erro?`<p class="aviso" style="margin-top:12px">⚠ ${esc(erro)}</p>`:''}
      ${resultado?`
        <p class="hint" style="margin-top:12px">${resultado.autorizado?'Loja autorizada.':'⚠ Essa loja ainda não foi autorizada no backend (rode o /oauth/login primeiro).'} ${resultado.ultimaAtualizacao?'Última sincronização: '+new Date(resultado.ultimaAtualizacao).toLocaleString('pt-BR'):''}</p>
        <div class="table-wrap"><table class="tbl-produtos"><thead><tr><th>Anúncio</th><th>SKU (ML)</th><th class="num">Disponível (ML)</th><th>Status</th><th>Vínculo com o Doca</th></tr></thead>
        <tbody>${linhasHtml||`<tr><td colspan="5" class="empty">Nenhum anúncio encontrado.</td></tr>`}</tbody></table></div>
      `:''}
      <div class="modal-acoes"><button class="btn" id="btnMlFechar">Fechar</button></div>`;
    document.getElementById('btnMlFechar').onclick=closeModal;
    document.getElementById('mlBaseUrl').onchange=e=>{ c.baseUrl=e.target.value.trim(); persist(); };
    document.getElementById('mlLoja').onchange=e=>{ c.loja=e.target.value; persist(); render(ultimoResultadoMl&&ultimoResultadoMl.loja===c.loja?ultimoResultadoMl:null,null); };
    /* clicar em "Atualizar" sincroniza TODAS as lojas de STORES, uma de cada vez — as outras
       (diferentes da selecionada no dropdown) são aplicadas em segundo plano, direto, sem
       mostrar tabela; a loja selecionada é sincronizada por último e mostra a tabela completa
       de comparação/vínculo, porque é a única que faz sentido revisar visualmente aqui. */
    document.getElementById('btnMlAtualizar').onclick=async()=>{
      c.baseUrl=document.getElementById('mlBaseUrl').value.trim();
      c.loja=document.getElementById('mlLoja').value;
      persist();
      const st=document.getElementById('mlStatus'); const btn=document.getElementById('btnMlAtualizar');
      btn.disabled=true;
      const outras=STORES.filter(l=>l!==c.loja);
      const falhas=[];
      for(let i=0;i<outras.length;i++){
        st.textContent=`Sincronizando ${outras[i]}... (${i+1}/${outras.length+1})`;

        try{ await carregarReclamacoes(outras[i]); await carregarMensagens(outras[i]); renderDashboard(); }catch(e){}
        try{ aplicarSincronizacaoFinanceira(outras[i],await mpSincronizarFinanceiro(outras[i])); }catch(e){}
      }
      st.textContent=`Sincronizando ${c.loja}... (${outras.length+1}/${outras.length+1}) — pode levar até 1 minuto se o servidor estava dormindo.`;
      try{
        const resultado=await mlSincronizarLoja(c.loja);
        ultimoResultadoMl=resultado;
        try{ await carregarReclamacoes(c.loja); await carregarMensagens(c.loja); renderDashboard(); }catch(e){}
        try{ aplicarSincronizacaoFinanceira(c.loja,await mpSincronizarFinanceiro(c.loja)); }catch(e){}
        render(resultado,null);

      }catch(e){
        render(null,e.message);
      }
      btn.disabled=false;

     não precisa clicar duas vezes (uma pra abrir, outra pra atualizar) */
  if(backendUrl()) document.getElementById('btnMlAtualizar').onclick();
}

            <span class="ln tot"><span>Total</span><b>${fmtInt(tot)}</b></span>

          <td class="num" title="Estoque local e disponível: ${fmtMoney(valorEstoqueDetalhado(p).local)} · No FULL: ${fmtMoney(valorEstoqueDetalhado(p).full)}">${fmtMoney(valorEstoqueDetalhado(p).total)}</td>
          <td><button class="btn sm" data-manage="${p.id}">Gerenciar</button></td>
        </tr>`;}).join(''):`<tr><td colspan="13" class="empty">Nenhum SKU encontrado.</td></tr>`}</tbody>
    </table></div>
    <p class="hint"><b>Coletar</b> e <b>Local</b> mostram o total físico (no fornecedor e no galpão). <b>Reservado</b> é a parte disso que já tem destino num envio — ele não soma, se sobrepõe. *<b>Disponível</b> = o que ainda está livre pra ser reservado num próximo envio.</p>`;
  document.getElementById('filtroLoja').onchange=e=>{ filtro.loja=e.target.value; renderProdutos(); };
  const filtroMostrarAusentes=document.getElementById('filtroMostrarAusentes');
  if(filtroMostrarAusentes) filtroMostrarAusentes.onchange=e=>{ filtro.mostrarAusentes=e.target.checked; renderProdutos(); };
  document.getElementById('filtroBusca').oninput=e=>{
    filtro.busca=e.target.value;
    const pos=e.target.selectionStart;
    renderProdutos();
    /* renderProdutos recria o <input> do zero (reescreve o innerHTML inteiro) - sem isso o
       campo perdia o foco a cada letra digitada, deixando so digitar 1 caractere por vez. */
    const novo=document.getElementById('filtroBusca');
    if(novo){ novo.focus(); novo.setSelectionRange(pos,pos); }
  };
  document.getElementById('btnNovoSku').onclick=()=>openProdutoModal(null,filtro.loja!=='todas'?filtro.loja:null);
  document.getElementById('btnConferencia').onclick=imprimirConferenciaEstoque;
  document.getElementById('btnSyncML').onclick=abrirSincronizacaoML;
  el.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>openProdutoModal(b.dataset.manage));
  el.querySelectorAll('[data-verres]').forEach(b=>b.onclick=()=>openOndeReservadoModal(b.dataset.verres));
}
/* mostra em quais envios o SKU está reservado */
function openOndeReservadoModal(id){
  const p=prodById(id);
  const linhas=[];
  state.envios.forEach(e=> e.itens.forEach(i=>{
    if(i.produtoId!==id) return;
    if((i.alocado||0)+(i.reservadoColeta||0)<=0) return;
    linhas.push({e,i});
  }));
  const body=openModal(false);
  body.innerHTML=`<h3>Onde ${esc(p.sku)} está reservado</h3>
    ${linhas.length?`<div class="table-wrap"><table class="tbl-produtos"><thead><tr>
      <th>Envio</th><th>Loja</th><th>No galpão</th><th>A coletar</th><th>Total</th></tr></thead><tbody>
      ${linhas.map(({e,i})=>`<tr><td>${esc(e.nome)}</td><td><span class="loja-tag">${esc(e.loja)}</span></td>
        <td class="num okv">${fmtInt(i.alocado||0)}</td><td class="num ${i.reservadoColeta?'cam':''}">${fmtInt(i.reservadoColeta||0)}</td>
        <td class="num">${fmtInt((i.alocado||0)+(i.reservadoColeta||0))}</td></tr>`).join('')}
      <tr><td colspan="4" style="text-align:right"><b>Total reservado</b></td><td class="num"><b>${fmtInt(reservadoDe(p))}</b></td></tr>
    </tbody></table></div>
    <p class="hint">Para liberar, cancele o envio ou remova este SKU dele na aba <b>Envios FULL</b>.</p>`
    :`<p class="empty-inline">Este SKU não está reservado em nenhum envio.</p>`}
    <div class="modal-actions"><button class="btn" id="btnFechar">Fechar</button></div>`;
  document.getElementById('btnFechar').onclick=closeModal;
}
/* ---------- conferência mensal de estoque ---------- */
function imprimirConferenciaEstoque(){
  const lojas = filtro.loja==='todas' ? STORES : [filtro.loja];
  const dados = lojas.map(loja=>({loja, itens: state.produtos.filter(p=>p.loja===loja&&(totalNoGalpao(p)>0||p.qtd.coletar>0))
    .sort((a,b)=>(a.fornecedor||'').localeCompare(b.fornecedor||'')||a.sku.localeCompare(b.sku)),
    /* SKUs vinculados (estoque fisico compartilhado) nao entram como linha propria - ja' estao
       contados dentro do SKU mestre. Sem essa lista, o SKU simplesmente sumia da folha impressa
       sem explicacao nenhuma, dando a entender que sumiu do sistema por engano. */
    vinculados: state.produtos.filter(p=>p.loja===loja&&p.vinculadoA)
      .map(p=>({p,mestre:prodById(p.vinculadoA)})).filter(x=>x.mestre)
      .sort((a,b)=>a.p.sku.localeCompare(b.p.sku))
    })).filter(d=>d.itens.length||d.vinculados.length);
  if(!dados.length){ alert('Não há estoque no galpão nem a coletar para conferir.'); return; }
  const win=window.open('','_blank');
  if(!win){ alert('Não foi possível abrir a janela de impressão. Verifique o bloqueador de pop-up.'); return; }
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Conferência de Estoque</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;padding:26px;color:#111}
      h1{font-size:19px;margin:0 0 4px}
      .sub{color:#555;font-size:12px;margin-bottom:6px}
      .assin{font-size:12px;margin:10px 0 18px;color:#333}
      .loja-h{font-weight:bold;font-size:16px;background:#eee;padding:9px 12px;margin:26px 0 10px;border-radius:4px}
      .loja-h:first-of-type{margin-top:14px}
      table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
      th,td{border:1px solid #bbb;padding:6px 8px;text-align:left}
      th{background:#f2f2f2;font-size:11px}
      td.n{text-align:right;font-family:monospace;font-weight:bold}
      td.box{background:#fcfcfc;width:62px}
      .tot{font-size:12.5px;text-align:right;font-weight:bold;margin-bottom:4px}
      .quebra{page-break-after:always}
      .rod{margin-top:20px;font-size:11.5px;color:#444;border-top:1px solid #999;padding-top:8px}
      @media print{.no-print{display:none}}
    </style></head><body>
    <h1>Conferência de Estoque</h1>
    <div class="sub">Gerado em ${new Date().toLocaleString('pt-BR')}</div>
    <div class="assin">Conferido por: ______________________________&nbsp;&nbsp;&nbsp;&nbsp;Data da contagem: ______ / ______ / __________</div>
    ${dados.map((d,idx)=>{
      const tg=d.itens.reduce((a,p)=>a+totalNoGalpao(p),0);
      const tc=d.itens.reduce((a,p)=>a+p.qtd.coletar,0);
      return `<div class="loja-h">${esc(d.loja)}</div>
      <table><thead><tr>
        <th>SKU</th><th>Código</th><th>Fornecedor</th>
        <th>No galpão<br><span style="font-weight:normal">(sistema)</span></th><th>Contado</th><th>Difer.</th>
        <th>A coletar<br><span style="font-weight:normal">(sistema)</span></th><th>Contado</th><th>Difer.</th>
      </tr></thead><tbody>
      ${d.itens.map(p=>`<tr>
        <td>${esc(p.sku)}</td><td>${esc(p.codigo)}</td><td>${esc(p.fornecedor)||'—'}</td>
        <td class="n">${fmtInt(totalNoGalpao(p))}</td><td class="box"></td><td class="box"></td>
        <td class="n">${fmtInt(p.qtd.coletar)}</td><td class="box"></td><td class="box"></td>
      </tr>`).join('')}
      </tbody></table>
      <div class="tot">${esc(d.loja)} — total no galpão: ${fmtInt(tg)} un. · total a coletar: ${fmtInt(tc)} un.</div>
      ${d.vinculados.length?`<div class="rod" style="margin-top:6px;border-top:none;padding-top:0">${d.vinculados.map(v=>`<div>ℹ ${esc(v.p.sku)} (${esc(v.p.codigo)||'—'}) está vinculado ao estoque de <b>${esc(v.mestre.sku)}</b> — já contado na linha dele, não precisa contar separado.</div>`).join('')}</div>`:''}
      ${idx<dados.length-1?'<div class="quebra"></div>':''}`;
    }).join('')}
    <div class="rod">Preencha a coluna <b>Contado</b> com a quantidade física encontrada e anote a diferença. Depois lance os ajustes no sistema em Produtos → Gerenciar → Ajuste manual de estoque.<br>
    Atenção: a coluna "No galpão" inclui o que já está etiquetado para envios FULL — conte tudo que estiver fisicamente no galpão.</div>
    <button class="no-print" onclick="window.print()" style="margin-top:14px;padding:10px 18px;font-size:14px;cursor:pointer">Imprimir</button>
    </body></html>`);
  win.document.close();
}

    ${editing?`
      <hr class="modal-sep">

        <div style="margin-top:10px">
        ${mestreVinc?`

          ${candidatosVinculo.length?`<div class="envio-full-row">

            <button class="btn" id="btnVincular">Vincular</button>
          </div>`:`<p class="hint muted">Não há outro SKU nessa loja disponível pra vincular.</p>`}

        </div>
      </details>
      ${mestreVinc?'':`
      <hr class="modal-sep">
      <details${ehKit?' open':''}>
        <summary><b>Kit (monta a partir de outros produtos)</b>${ehKit?' <span class="muted">('+componentesDe(p).length+' componente'+(componentesDe(p).length>1?'s':'')+')</span>':''}</summary>
        <div style="margin-top:10px">

        ${(()=>{ const cands=state.produtos.filter(x=>x.id!==id&&x.loja===p.loja&&!x.vinculadoA&&!componentesDe(x).length&&!componentesDe(p).some(c=>c.produtoId===x.id)); return cands.length?`
          <div class="envio-full-row" style="margin-top:8px">

        <div class="envio-full-row" style="margin-top:8px">

      <hr class="modal-sep">
      ${(mestreVinc||ehKit)?`

      `:`
      <h4>Adicionar compra (nova entrada em Comprar)</h4>
      <div class="envio-full-row"><input id="fQtdAdicionar" type="number" min="1" placeholder="Quantidade">

      <hr class="modal-sep">

      <div class="form-grid">
        <label class="span2">Quantidade livre contada no galpão <small>(sem contar o que já está etiquetado pro FULL)</small><input id="ajLocal" type="number" min="0" value="${p.qtd.local}"></label>

      <hr class="modal-sep">
      <div class="calc-row">
        <span>A comprar: <b>${fmtInt(p.qtd.comprar)}</b></span>
        <span>A coletar: <b>${fmtInt(p.qtd.coletar)}</b></span>
        <span>No galpão: <b>${fmtInt(totalNoGalpao(p))}</b></span>
        <span>Reservado: <b>${fmtInt(rl+rc)}</b> <span class="muted">(${fmtInt(rl)} no galpão + ${fmtInt(rc)} a coletar)</span></span>

      <hr class="modal-sep">

  document.getElementById('btnCancelar').onclick=closeModal;
  document.getElementById('btnSalvarProduto').onclick=()=>{
    const loja=document.getElementById('fpLoja').value;
    const sku=document.getElementById('fSku').value.trim().toUpperCase();
    const codigo=document.getElementById('fCodigo').value.trim().toUpperCase();
    const fornecedor=document.getElementById('fFornecedor').value.trim().toUpperCase();
    const custo=parseMoeda(document.getElementById('fCusto').value);
    const unidPorCaixa=Math.max(0,parseInt(document.getElementById('fUnidCaixa').value)||0);
    if(!sku){ alert('Preencha o SKU.'); return; }
    const dup=state.produtos.some(x=>x.id!==id&&x.loja===loja&&x.sku.toLowerCase()===sku.toLowerCase());
    if(dup){ alert('Já existe esse SKU cadastrado nessa loja.'); return; }
    if(editing&&loja!==p.loja){

    };
    const btnCriarComponenteInterno=document.getElementById('btnCriarComponenteInterno');
    if(btnCriarComponenteInterno) btnCriarComponenteInterno.onclick=()=>{
      const sku=document.getElementById('fNovoSkuInterno').value;
      const qtd=document.getElementById('fQtdSkuInterno').value;
      const r=criarComponenteInterno(id,sku,qtd);
      if(!r.ok){ alert(r.msg); return; }
      openProdutoModal(id); toast('SKU interno criado e adicionado ao kit.');
    };
    const btnAjustar=document.getElementById('btnAjustar');
    if(btnAjustar) btnAjustar.onclick=()=>{
      const r=ajustarEstoque(id,{local:document.getElementById('ajLocal').value});
      if(!r.ok){ alert(r.msg); return; }
      openProdutoModal(id);
      const pp=prodById(id);
      toast(`Contagem salva: ${fmtInt(totalNoGalpao(pp))} un. no galpão.`+(r.reconciliado?` ${fmtInt(r.reconciliado)} un. foram destinadas a envios pendentes.`:''));
    };
    const btnAbrirMestre=document.getElementById('btnAbrirMestre');
    if(btnAbrirMestre) btnAbrirMestre.onclick=()=>openProdutoModal(mestreVinc.id);
    const btnDesvincular=document.getElementById('btnDesvincular');
    if(btnDesvincular) btnDesvincular.onclick=()=>{
      confirmAction(`Desvincular ${p.sku} do estoque de ${mestreVinc.sku}? Ele volta a ter compra/coleta/estoque próprios (hoje zerados — ajuste na aba Comprar/Coletar depois de desvincular).`,()=>{
        updateProduto(id,{vinculadoA:null}); openProdutoModal(id); toast('SKU desvinculado.');
      });
    };
    const btnVincular=document.getElementById('btnVincular');
    if(btnVincular) btnVincular.onclick=()=>{
      const alvoId=document.getElementById('fVincularA').value;
      if(!alvoId){ alert('Escolha um SKU pra vincular.'); return; }
      const alvo=prodById(alvoId);
      /* estoque próprio (Comprar/Coletar/Local) e reservas em envio FULL deste SKU não ficam
         perdidos - são transferidos automaticamente pro SKU mestre ao vincular (ver
         mesclarEstoqueNoVinculo), não precisa mais zerar/mover nada à mão antes. */
      const temEstoqueProprio=(p.qtd.comprar||0)+(p.qtd.coletar||0)+(p.qtd.local||0)>0;
      const temReserva=reservadoDe(p)>0;
      const avisoTransferencia=(temEstoqueProprio||temReserva)
        ?` O estoque próprio deste SKU (${fmtInt(p.qtd.comprar)} a comprar, ${fmtInt(p.qtd.coletar)} a coletar, ${fmtInt(p.qtd.local)} no galpão${temReserva?', incluindo o que já está reservado em envio':''}) será transferido automaticamente pro SKU ${alvo.sku}.`
        :'';
      confirmAction(`Vincular ${p.sku} ao estoque de ${alvo.sku}? Este SKU passa a não ter mais compra/coleta/ajuste próprios — tudo isso passa a ser feito no SKU ${alvo.sku}.${avisoTransferencia}`,()=>{
        batch('vínculo de '+p.sku+' ao estoque de '+alvo.sku,()=>{
          if(temEstoqueProprio||temReserva) mesclarEstoqueNoVinculo(id,alvoId);
          updateProduto(id,{vinculadoA:alvoId});
        });
        openProdutoModal(id); toast(`Vinculado ao estoque de ${alvo.sku}.`+(avisoTransferencia?' Estoque próprio transferido.':''));
      });
    };
    document.getElementById('btnExcluirProduto').onclick=()=>{
      confirmAction(`Excluir o SKU ${p.sku} (${p.loja})? Ele sai também dos envios FULL em que estiver. Dá pra reverter no botão Desfazer.`,()=>{
        deleteProduto(id); closeModal(); toast('SKU excluído.');
      });
    };
  }
}

/* Margem de Contribuição do(s) produto(s) desta campanha, no período calculado em Lucro — mesma
   fórmula usada no ranking do Resumo Financeiro. Retorna null se ainda não calculou ou não achou
   o produto no período (sem vendas). */
function margemContribuicaoCampanha(camp,loja){
  if(!adsLucroResultado) return null;
  const itensAds=itensDaCampanhaAds(camp);
  if(!itensAds.length) return null;
  const aliquota=finLoja(loja).aliquotaImposto||0;

  itensAds.forEach(ia=>{
    const iv=((adsLucroResultado.itensVendidos)||[]).find(x=>x.itemId===ia.itemId);
    if(!iv) return;

    const custoUnit=p&&p.custo?p.custo:0;
    const custoProdutoItem=custoUnit*iv.qtd;
    const impostoItem=iv.valor*(aliquota/100);
    margemTotal+=iv.valor-custoProdutoItem-(iv.tarifa||0)-(iv.freteMl||0)-impostoItem;
    faturamentoTotal+=iv.valor;
  });
  return achou?{margem:margemTotal,faturamento:faturamentoTotal}:null;
}
