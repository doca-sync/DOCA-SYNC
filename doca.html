<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doca · Abastecimento Full · Mercado Livre</title>
<meta name="theme-color" content="#0C0620">
<meta name="description" content="Doca — controle de compra, coleta e envios Full do Mercado Livre por loja.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230C0620'/%3E%3Crect x='6' y='19' width='20' height='2.4' rx='1.2' fill='%23D4D4D4'/%3E%3Crect x='7.5' y='12' width='7' height='6' rx='1' fill='%23FFC53D'/%3E%3Crect x='16' y='9' width='7' height='9' rx='1' fill='%23A3A3A3'/%3E%3Cpath d='M13 25.5h6l-3 3z' fill='%23FFC53D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0A0418; --night2:#150A2E;
  --violet:#A3A3A3; --violet-l:#D4D4D4; --violet-d:#4A4A4D;
  --gold:#FFC53D;
  --paper:#170D31; --bg:#0C0620; --bg2:#241547;
  --text:#EFEBF9; --muted:#9A90BC; --line:#2E1F55; --line2:#231646;
  --ok:#34D399; --warn:#FBBF24; --danger:#FB7185; --info:#60A5FA; --pad:22px; --r:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
   radial-gradient(1100px 520px at 12% -8%,rgba(150,150,153,.20),transparent 62%),
   radial-gradient(900px 440px at 92% 2%,rgba(255,197,61,.06),transparent 60%),
   var(--bg);
  background-attachment:fixed;color:var(--text);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body,input,select,button,textarea{text-transform:uppercase}
.hint,.onboard,.aviso,.empty,.empty-inline,#toast,.file-status,.undo-label,
.modal p,.form-grid label small{text-transform:none}
input::placeholder{text-transform:none}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
/* 1360px deixava a tabela de Produtos (13 colunas, tudo com white-space:nowrap) mais larga
   que o container em qualquer tela, forçando a barra de rolagem horizontal mesmo em monitor
   grande com espaço sobrando dos dois lados. 1680px dá espaço suficiente pra tabela inteira
   caber sem rolagem na maioria dos desktops, mantendo o layout centralizado como antes. No
   celular a media query de baixo (max-width:720px etc) já cuida do resto - a rolagem
   horizontal continua normal lá. */
.wrap{max-width:1680px;margin:0 auto;padding:0 var(--pad)}
.hidden{display:none !important}
header{background:var(--night);position:sticky;top:0;z-index:60;border-bottom:1px solid rgba(190,190,193,.2)}
.bar{display:flex;align-items:center;gap:20px;height:60px}
.mark{display:flex;align-items:center;gap:10px;flex:none;color:#fff}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(140deg,var(--violet),var(--violet-d));
  display:grid;place-items:center;font-family:Sora;font-weight:800;font-size:14px;color:var(--gold);flex:none}
.mark b{font-family:Sora;font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.15;display:block}
.mark small{display:block;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--violet-l);font-weight:600}
nav{display:flex;gap:3px;margin-left:auto;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{font-size:13px;font-weight:700;padding:8px 14px;border-radius:99px;
  color:rgba(255,255,255,.6);white-space:nowrap;transition:.15s;flex:none;letter-spacing:.03em}
nav button:hover{color:#fff;background:rgba(190,190,193,.18)}
nav button[aria-selected=true]{color:var(--night);background:var(--gold)}
.filebar{background:var(--night2);border-bottom:1px solid rgba(190,190,193,.2);padding:9px 0}
.filebar .in{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filebar .btn{font-size:12px;padding:6px 11px;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(190,190,193,.35)}
.filebar .btn:hover{background:rgba(190,190,193,.28);color:#fff}
.filebar .btn:disabled{opacity:.3}
.filebar .btn:disabled:hover{background:rgba(255,255,255,.08)}
.undo-label{font-size:11.5px;color:var(--violet-l);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-status{margin-left:auto;font-size:11.5px;color:rgba(255,255,255,.55)}
.btn{font-size:12.5px;font-weight:700;letter-spacing:.03em;padding:8px 14px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg2);color:var(--text);display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{border-color:var(--violet);color:var(--violet-l);background:rgba(163,163,163,.14)}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.acc{background:var(--violet-d);border-color:var(--violet);color:#fff}
.btn.acc:hover{background:var(--violet);border-color:var(--violet-l);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--night)}
.btn.gold:hover{background:#FFD469;border-color:#FFD469;color:var(--night)}
.btn.danger{background:#9F1239;border-color:#BE123C;color:#fff}
.btn.danger:hover{background:#BE123C;border-color:var(--danger);color:#fff}
.btn.danger-outline{color:var(--danger);border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.08)}
.btn.danger-outline:hover{background:#9F1239;border-color:#BE123C;color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line);color:var(--text);background:var(--bg2)}
main{padding:26px 0 70px}
h1.page-title{font-family:Sora;font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0 0 18px}
h3{font-family:Sora;font-weight:700;font-size:14.5px;margin:22px 0 10px;letter-spacing:.02em}
h3:first-child{margin-top:0}
h4{font-family:Sora;font-weight:700;font-size:13.5px;margin:0 0 10px;letter-spacing:.02em}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.empty, .empty-inline{color:var(--muted);font-size:13.5px;padding:14px 4px}
.onboard{background:var(--paper);border:1px dashed var(--violet-l);border-radius:var(--r);padding:20px;margin-bottom:20px;font-size:14px}
.onboard b{color:var(--violet-l)}
.aviso{border-radius:var(--r);padding:13px 16px;margin-bottom:14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.aviso.risco{background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.42);color:#FFC2CB}
.aviso.atencao{background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.38);color:#FFE08A}
.aviso b{font-weight:700}
.aviso .btn{margin-left:auto;flex:none}
.cards-lojas{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
.card-loja{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:0 10px 26px -18px rgba(0,0,0,.8);transition:.18s}
.card-loja:hover{border-color:rgba(163,163,163,.45);transform:translateY(-2px)}
.card-loja-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:Sora;font-size:15px}
.badge{font-family:'IBM Plex Mono';font-size:10.5px;font-weight:600;background:var(--bg2);color:var(--muted);padding:2px 8px;border-radius:99px}
.card-loja-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.stat{background:var(--bg2);border:1px solid rgba(163,163,163,.14);border-radius:9px;padding:9px 4px;text-align:center}
.stat-n{display:block;font-family:Sora;font-weight:700;font-size:17px}
.stat-l{display:block;font-size:10px;color:var(--muted);letter-spacing:.05em;margin-top:2px;text-transform:uppercase}
.card-loja-foot{display:flex;flex-direction:column;gap:5px;font-size:13px;border-top:1px solid var(--line2);padding-top:10px}
.total-geral{margin-top:16px;font-family:Sora;
  background:linear-gradient(135deg,#1B0F3D,#2A1160);border:1px solid rgba(190,190,193,.3);
  color:#fff;padding:16px 20px;border-radius:var(--r);display:grid;gap:8px}
.total-geral > div{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;font-size:16px}
.total-geral b{color:var(--gold);font-size:19px}
.total-geral .linha2{border-top:1px solid rgba(190,190,193,.22);padding-top:8px}
.total-geral .linha2 b{color:var(--violet-l)}
.total-geral small{font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.02em;font-family:'Plus Jakarta Sans',sans-serif}
.card-loja-foot .valor-info{display:inline-flex;align-items:center;gap:6px}
.valor-manual-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.valor-manual{font:inherit;font-size:12.5px;font-weight:700;color:var(--gold);background:var(--bg2);
  border:1px solid var(--line);border-radius:6px;padding:3px 8px;width:110px;text-align:right;color-scheme:dark}
.valor-manual:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 2px rgba(163,163,163,.25)}
.alert-baixo{margin-top:16px;background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.38);border-radius:var(--r);padding:14px 16px}
.alert-head{font-weight:700;color:var(--warn);margin-bottom:8px;font-size:13px;text-transform:uppercase}
.alert-baixo.risco{background:rgba(251,113,133,.10);border-color:rgba(251,113,133,.4)}
.alert-baixo.risco .alert-head{color:var(--danger)}
.alert-list{display:flex;flex-direction:column;gap:4px;font-size:13px}
.alert-grupo-loja{margin-top:12px}
.alert-grupo-loja:first-of-type{margin-top:0}
.alert-loja{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.curva-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:5px;font-size:9.5px;font-weight:800;line-height:1;background:var(--bg2);color:var(--muted)}
.curva-badge.curva-A{background:rgba(52,211,153,.18);color:var(--ok)}
.curva-badge.curva-B{background:rgba(251,191,36,.18);color:var(--warn)}
.curva-badge.curva-C{background:rgba(148,163,184,.18);color:var(--muted)}
.acao-ok{color:var(--ok);font-weight:600}
.acao-aten{color:var(--warn);font-weight:600}
.acao-risco{color:var(--danger);font-weight:600}
.toolbar-produtos{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar-produtos select, .toolbar-produtos input[type=text], .toolbar-produtos input[type=date]{font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--text);color-scheme:dark}
.toolbar-produtos input[type=text].grow{flex:1;min-width:180px}
/* rolagem só horizontal contida dentro do card, em vez de rolar a página inteira. Isso corta o
   popup do ícone "i" quando ele estoura o card (CSS não permite ter as duas coisas: rolagem
   horizontal + popup sem corte no mesmo elemento) — mas pra isso já existe o clique no "i" que
   abre o mesmo detalhe num modal normal, que nunca corta (ver o listener de '.det .i' mais
   abaixo no arquivo). Por isso dá pra manter isso ligado em todas as tabelas sem problema. */
.table-wrap{overflow-x:auto;max-width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
table.tbl-produtos{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl-produtos th{text-align:left;font-size:10.5px;letter-spacing:.05em;color:var(--muted);
  padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase}
table.tbl-produtos td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
table.tbl-produtos tr:last-child td{border-bottom:0}
table.tbl-produtos td.num{text-align:right;font-family:'IBM Plex Mono';font-weight:600}
table.tbl-produtos th.num{text-align:right}
table.tbl-produtos tbody tr:hover{background:rgba(163,163,163,.07)}
table.tbl-produtos tr.row-baixo{background:rgba(251,191,36,.07)}
.loja-tag{font-size:10.5px;font-weight:700;background:rgba(163,163,163,.18);color:var(--violet-l);padding:3px 8px;border-radius:99px;white-space:nowrap;border:1px solid rgba(163,163,163,.3)}
.qty-acao{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;width:88px;background:var(--bg2);color:var(--text)}
.obs-input{font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;width:100%;min-width:240px;background:var(--bg2);color:var(--text)}
input[type=checkbox]{accent-color:var(--violet);width:17px;height:17px}
.pend{color:var(--danger);font-weight:700}
.okv{color:var(--ok);font-weight:700}
.cam{color:var(--info);font-weight:700}
.tag-zero{font-size:10px;font-weight:700;background:rgba(251,113,133,.15);color:var(--danger);padding:2px 6px;border-radius:5px;white-space:nowrap;border:1px solid rgba(251,113,133,.3);text-transform:uppercase}
.envio-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 10px 26px -20px rgba(0,0,0,.8)}
.envio-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.envio-tit{font-family:Sora;font-weight:700;font-size:15.5px;text-transform:uppercase}
.envio-meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.envio-acts{display:flex;gap:8px;flex-wrap:wrap}
.modal-overlay{position:fixed;inset:0;background:rgba(5,2,14,.78);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--paper);border:1px solid rgba(163,163,163,.28);border-radius:16px;max-width:600px;width:100%;padding:24px 26px 26px;box-shadow:0 26px 70px -18px rgba(0,0,0,.9)}
.modal.wide{max-width:900px}
.modal h3{margin-top:0;text-transform:uppercase}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.form-grid label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.form-grid label.span2{grid-column:1/-1}
.form-grid input, .form-grid select{font:inherit;font-size:14px;font-weight:500;color:var(--text);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color-scheme:dark}
.form-grid input:focus,.form-grid select:focus,.qty-acao:focus,.obs-input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(163,163,163,.2)}
.form-grid label small{font-weight:500;color:var(--muted);font-size:11px;text-transform:none}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.modal-sep{border:0;border-top:1px solid var(--line2);margin:20px 0}
.calc-row{display:flex;justify-content:space-between;margin-top:12px;font-size:13.5px;background:var(--bg2);border:1px solid rgba(163,163,163,.16);padding:10px 12px;border-radius:9px;flex-wrap:wrap;gap:8px}
.envio-full-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.envio-full-row input{width:140px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--text)}
#confirmOverlay .modal{max-width:460px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:linear-gradient(135deg,#1B0F3D,#2A1160);border:1px solid rgba(190,190,193,.4);color:#fff;
  padding:13px 22px;border-radius:14px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;
  box-shadow:0 16px 44px -12px rgba(0,0,0,.9);max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.drop{border:2px dashed rgba(190,190,193,.45);border-radius:var(--r);padding:22px;text-align:center;background:var(--paper);margin-bottom:18px;transition:.18s}
.drop.dragover{background:rgba(163,163,163,.16);border-color:var(--gold)}
.drop b{display:block;font-family:Sora;font-size:14.5px;margin-bottom:4px;text-transform:uppercase}
@media(max-width:720px){
  .form-grid{grid-template-columns:1fr}
  .card-loja-grid{grid-template-columns:repeat(2,1fr)}
  .file-status{margin-left:0;width:100%}
}
/* ---- tela de atualizacao (trava o sistema) ---- */
#lockOverlay{position:fixed;inset:0;z-index:500;background:rgba(6,2,16,.93);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:24px}
.lock-box{background:var(--paper);border:1px solid rgba(163,163,163,.45);border-radius:18px;
  max-width:520px;width:100%;padding:34px 32px;text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.95)}
.lock-ico{font-size:40px;color:var(--gold);line-height:1;margin-bottom:10px;animation:girar 2.4s linear infinite;display:inline-block}
@keyframes girar{to{transform:rotate(360deg)}}
/* realce temporário na linha da Previsão quando um envio é confirmado como FULL — o total
   cai nesse momento (sai de "Próximos programados" e só volta quando a próxima sincronização
   mostrar a mercadoria de verdade), então o realce ajuda a deixar claro que a ação funcionou */
.flash-full{animation:realceFull 2.4s ease-out}
@keyframes realceFull{0%{background:rgba(255,197,61,.28)}100%{background:transparent}}
.lock-box h2{font-family:Sora;font-size:21px;margin:0 0 14px;letter-spacing:-.01em}
.lock-box p{font-size:14px;color:var(--muted);margin:0 0 12px;text-transform:none;line-height:1.55}
.lock-box p b{color:var(--text)}
.lock-btn{width:100%;justify-content:center;font-size:14px;padding:13px;margin-top:8px}
.lock-alt{display:block;margin:14px auto 0;font-size:11.5px;color:var(--muted);text-decoration:underline;
  text-transform:none;background:none;border:0;cursor:pointer}
.lock-alt:hover{color:var(--danger)}
.lock-sub{font-size:12.5px;opacity:.75}
/* ---------- tarefas ---------- */
.listas-bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lista-chip{font-size:12px;font-weight:700;letter-spacing:.03em;padding:7px 14px;border-radius:99px;
  border:1px solid var(--line);background:var(--bg2);color:var(--muted);transition:.15s;display:inline-flex;align-items:center;gap:7px}
.lista-chip:hover{border-color:var(--violet);color:var(--violet-l)}
.lista-chip.ativa{background:var(--violet-d);border-color:var(--violet);color:#fff}
.lista-chip.nova{border-style:dashed;color:var(--violet-l)}
.chip-n{font-family:'IBM Plex Mono';font-size:10.5px;background:rgba(0,0,0,.28);padding:1px 6px;border-radius:99px}
.chip-n.atras{background:#9F1239;color:#fff}
.lista-acoes{display:inline-flex;gap:5px;margin-left:auto}
.lista-acoes .btn{padding:6px 10px}
.tarefa-nova{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tarefa-nova input[type=text]{flex:1;min-width:200px;font:inherit;font-size:15px;padding:11px 12px;
  border:1px solid var(--line);border-radius:9px;background:var(--bg2);color:var(--text)}
.tarefa-nova input[type=date]{font:inherit;font-size:14px;padding:11px 12px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg2);color:var(--text);color-scheme:dark}
.tarefa-nova input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(163,163,163,.2)}
.tarefa-lista{display:flex;flex-direction:column;gap:8px}
.tarefa{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 13px;transition:.15s}
.tarefa-topo{display:flex;align-items:center;gap:10px}
.tarefa:hover{border-color:rgba(163,163,163,.45)}
.tarefa.arrastando{opacity:.4}
.lista-chip[draggable=true]{cursor:grab}
.lista-chip.arrastando{opacity:.45;cursor:grabbing}

.tarefa-check{width:23px;height:23px;flex:none;border-radius:50%;border:2px solid var(--muted);

.tarefa-data.hoje{border-color:rgba(255,197,61,.6);color:var(--gold);background:rgba(255,197,61,.1)}
.tarefa-hora{font:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg2);color:var(--muted);color-scheme:dark;flex:none;width:88px}
.tarefa-x{color:var(--muted);font-size:14px;padding:5px 8px;border-radius:7px;flex:none;opacity:0;transition:.15s}

.tarefa-repetir{color:var(--muted);font-size:14px;padding:5px 8px;border-radius:7px;flex:none;opacity:.55;transition:.15s}

.nav-badge{font-family:'IBM Plex Mono';font-size:10px;background:rgba(0,0,0,.3);padding:1px 6px;border-radius:99px;margin-left:2px}

/* botão-resumo (📅/🔁/⋯): só existe visualmente no celular — abre/fecha data, hora, repetir,
   excluir e observação, que ficam escondidos até tocar nele. Igual ao Tarefas do Google: na
   lista só aparece a tarefa e as subtarefas; o resto mora "dentro" da tarefa. */
.tarefa-resumo{display:none;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted);
  background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;flex:none;
  text-transform:none;cursor:pointer;transition:.15s}
.tarefa-resumo:hover{border-color:var(--violet-d);color:var(--text)}
.tarefa.aberta .tarefa-resumo{background:var(--violet-d);border-color:var(--violet);color:#fff}
@media(max-width:820px){

  .tarefa-topo{flex-wrap:wrap;row-gap:8px}
  .tarefa-ordem{order:1}
  .tarefa-check{order:2;width:27px;height:27px}
  .tarefa-tit{order:3;flex:1 1 auto;min-width:0;font-size:16px}
  .tarefa-resumo{order:4;display:inline-flex}
  .sub-cont{order:5}
  /* escondidos até tocar no botão-resumo acima */
  .tarefa-data,.tarefa-hora,.tarefa-repetir,.tarefa-x,.tarefa-obs{display:none}
  .tarefa.aberta .tarefa-data{display:inline-flex;order:6;flex-basis:100%;margin-top:4px}
  .tarefa.aberta .tarefa-hora{display:inline-flex;order:7}

  .tarefa.aberta .tarefa-x{display:inline-flex;order:9;margin-left:auto;font-size:17px;padding:6px 10px}
  .tarefa.aberta .tarefa-obs{display:block}
  .tarefa-data,.tarefa-hora{padding:8px 9px;flex:none;width:auto}
}

/* produtoId -> timestamp: usado só pra piscar a linha na Previsão quando um envio é

let flashFull={};

let confirmarLojaAtual='todas';

let batchDepth=0;

let tipoPendente='';          /* 'dir' ou 'file' */
let verificandoArquivo=!!localStorage.getItem('estoque_arquivo_nome');
const ARQ_PRINCIPAL='estoque-dados.json';
const PASTA_BACKUP='backups';

   (evita que ele sobrescreva um clique/toque recente antes de terminar de gravar) - pedido do
   Felipe 19/08, bolinha de tarefa voltando vazia / subtarefas sumindo */
let ultimaAtividadeLocal=0;

/* barra de progresso reutilizável - real (feito/total, em %) ou indeterminada (quando ainda

/* versão "job" de /financas/resumo — igual ao padrão que já criamos pro Ads (inicia, devolve
   jobId na hora, roda em background) - pra qualquer tela poder mostrar status de progresso REAL
   (0-100%) em vez de só "carregando...". onProgress(progresso) é chamado a cada atualização
   (progresso = {feito,total,etapa}); a Promise resolve com o "resumo" (mesmo formato que
   j.resumo do endpoint síncrono antigo) quando terminar. */
function fetchResumoJob(loja,periodo,de,ate,onProgress){
  return new Promise((resolve,reject)=>{
    (async()=>{
      try{
        const base=backendUrl();
        if(!base) throw new Error('Configure a URL do backend primeiro (em Produtos → Atualizar).');
        const params=new URLSearchParams({loja,periodo});
        if(periodo==='personalizado'){ params.set('de',de); params.set('ate',ate); }
        const r=await fetch(`${base}/financas/resumo-job/iniciar?${params.toString()}`);
        let j; try{ j=await r.json(); }catch(e){ throw new Error('Resposta inválida do backend.'); }
        if(!r.ok||!j.ok) throw new Error(j.erro||('Erro ao iniciar (HTTP '+r.status+').'));
        const jobId=j.jobId;
        const poll=async()=>{
          try{
            const r2=await fetch(`${base}/financas/resumo-job/status?id=${encodeURIComponent(jobId)}`);
            let j2; try{ j2=await r2.json(); }catch(e){ throw new Error('Resposta inválida do backend.'); }
            if(!r2.ok||!j2.ok) throw new Error(j2.erro||('Erro ao consultar status (HTTP '+r2.status+').'));
            if(onProgress) onProgress(j2.progresso);
            if(j2.status==='rodando'){ setTimeout(poll,1200); return; }
            if(j2.status==='erro'){ reject(new Error(j2.erro||'Falha desconhecida.')); return; }
            resolve(j2.resultado.resumo);
          }catch(e){ reject(e); }
        };
        poll();
      }catch(e){ reject(e); }
    })();
  });
}
/* le valor em R$ digitado no padrão brasileiro (vírgula como decimal, ex: "1234,56") — os
   campos de valor usam type="text" (não "number") justamente pra deixar digitar vírgula, que o
   input number do navegador bloqueia. Também aceita ponto, por segurança, caso alguém digite
   do jeito antigo. */
function parseMoeda(v){
  const limpo=String(v??'').trim().replace(/\./g,'').replace(',','.');
  const n=parseFloat(limpo);
  return isNaN(n)?0:n;
}
/* filtra em tempo real o que é digitado nos campos de valor (R$): só dígitos e 1 vírgula —
   bloqueia o ponto na hora de digitar, em vez de só ignorar depois. Usado via oninput. */
function filtrarValorMoeda(el){
  let v=el.value.replace(/[^\d,]/g,'');
  const partes=v.split(',');
  if(partes.length>2) v=partes[0]+','+partes.slice(1).join('');
  el.value=v;
}
function fmtInt(v){ return (Number(v)||0).toLocaleString('pt-BR'); }
/* mostra a conversão pra caixas (quando o SKU tem "unidades por caixa" cadastrado) junto de uma
   quantidade em unidades - usado em Comprar/FULL pra facilitar pedir/conferir por caixa fechada.
   Arredonda pra cima (não dá pra pedir "meia caixa"), então avisa quando sobra fração. */
function caixasTxt(qtd,unidPorCaixa){
  const un=Number(unidPorCaixa)||0;
  if(un<=0||!qtd) return '';
  const caixas=qtd/un;
  const fechadas=Math.floor(caixas);
  const resto=qtd-fechadas*un;
  if(resto<=0) return `${fmtInt(fechadas)} cx`;
  return `${fmtInt(Math.ceil(caixas))} cx (${fechadas?fmtInt(fechadas)+' fechada(s) + ':''}${fmtInt(resto)} un.)`;
}

function optsLojas(sel){ return STORES.map(l=>`<option value="${esc(l)}" ${l===sel?'selected':''}>${esc(l)}</option>`).join(''); }
function optsColeta(sel){ return LOCAIS_COLETA.map(l=>`<option value="${esc(l)}" ${l===sel?'selected':''}>${esc(l)}</option>`).join(''); }
function fmtData(iso){ if(!iso) return 'sem data'; const [a,m,d]=iso.split('-'); return `${d}/${m}/${a}`; }
function nomeEnvio(e){ return `${e.nome} · ${e.loja}`; }
/* bug corrigido 20/08: usava .toISOString() (sempre em UTC), então perto da meia-noite em
   Brasília (a partir das ~21h, já que BRT = UTC-3) o "hoje" da tela já virava o dia SEGUINTE em
   UTC - explicando o alerta de "tarefas pra hoje" aparecer de noite mostrando uma tarefa
   programada pra "hoje" que, no relógio de Brasília, ainda era o dia de amanhã. Trocado pra
   pegar ano/mês/dia do horário LOCAL do navegador (que já é o de Brasília, sem forçar UTC). */
function hoje(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function prodById(id){ return state.produtos.find(p=>p.id===id); }
function envioById(id){ return state.envios.find(e=>e.id===id); }
function normLoja(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function acharLoja(t){ const n=normLoja(t); return STORES.find(l=>normLoja(l)===n)||STORES.find(l=>n.includes(normLoja(l)))||null; }
function enviosOrdenados(){ return [...state.envios].sort((a,b)=>(a.data||'9999-99-99').localeCompare(b.data||'9999-99-99')); }
/* próximo envio FULL já programado (com data hoje ou futura) para uma loja — usado na aba
   Ruptura de estoque para saber se o estoque vai zerar ANTES desse envio de verdade chegar,
   em vez de depender só da data manual "Previsão do envio ao FULL" da Previsão. */
function proximoEnvioLoja(loja){
  const h=hoje();
  return enviosOrdenados().find(e=>e.loja===loja&&e.data&&e.data>=h)||null;
}
/* reservado no galpão (etiquetado) */
function reservadoLocalDe(p){ let t=0; state.envios.forEach(e=>e.itens.forEach(i=>{ if(i.produtoId===p.id) t+=(i.alocado||0); })); return t; }
/* reservado mas ainda a coletar (já comprado, no fornecedor) */
function reservadoColetaDe(p){ let t=0; state.envios.forEach(e=>e.itens.forEach(i=>{ if(i.produtoId===p.id) t+=(i.reservadoColeta||0); })); return t; }
/* total comprometido com envios */
function reservadoDe(p){ return reservadoLocalDe(p)+reservadoColetaDe(p); }
/* acha o item da Previsão de reposição ligado a este produto (mesma loja) — usado pra deixar
   a coluna "A Caminho" de Produtos igual ao que a Previsão mostra (transferência real +
   entrada pendente), em vez de reler campos soltos do produto que não acompanham o programado */
function fullItemDeProduto(p){
  return state.full.itens.find(x=>x.loja===p.loja&&x.produtoId===p.id)||null;
}
/* "entrada pendente" é conceito separado do "Reservado": soma o solicitado inteiro do envio
   programado (não só o que já está alocado/coletado), porque quando o envio é registrado no
   Mercado Livre a declaração vale pela quantidade total prevista, mesmo que uma parte ainda
   esteja em processo de compra aqui no Doca — não dá pra amarrar isso no que já está físico
   no galpão, senão falta contar exatamente a parte que ainda vai ser comprada. Usada na
   Previsão de reposição pra somar dentro do "a caminho" (ver fullCalc). */
function entradaPendenteDe(produtoId){
  if(!produtoId) return 0;
  let t=0;
  state.envios.forEach(e=>e.itens.forEach(i=>{ if(i.produtoId===produtoId) t+=(i.solicitado||0); }));
  return t;
}
/* o que ainda falta comprar por causa de envios */
function compraDeEnvios(p){ let t=0; state.envios.forEach(e=>e.itens.forEach(i=>{ if(i.produtoId===p.id) t+=(i.geradoCompra||0); })); return t; }
/* coletar que ainda não tem destino */
/* ---- pedidos de compra (cada "adicionar ao comprar" é um pedido separado) ---- */
function novoPedido(qtd,obs){ return {id:gerarId('c'),qtd,data:hoje(),obs:obs||''}; }
function somaPedidos(p){ return (p.pedidos||[]).reduce((a,c)=>a+(c.qtd||0),0); }
function sincronizarPedidos(p){ if(!Array.isArray(p.pedidos)) p.pedidos=[]; p.qtd.comprar=somaPedidos(p); }
function garantirPedidos(p){
  if(!Array.isArray(p.pedidos)) p.pedidos=[];
  if(p.pedidos.length===0 && (p.qtd&&p.qtd.comprar>0)) p.pedidos=[novoPedido(p.qtd.comprar)];
  p.pedidos.forEach(c=>{ if(!c.id) c.id=gerarId('c'); if(!c.data) c.data=hoje(); if(c.obs===undefined) c.obs=''; if(c.origem===undefined) c.origem=''; if(c.envioId===undefined) c.envioId=''; });
  sincronizarPedidos(p);
}
/* ajusta mantendo os pedidos existentes (não cria pedido novo) */
function ajustarComprarPorPedidos(p,novo){
  if(!p.pedidos) p.pedidos=[];
  const atual=somaPedidos(p);
  if(novo>atual){
    if(p.pedidos.length) p.pedidos[p.pedidos.length-1].qtd+=(novo-atual);
    else p.pedidos.push(novoPedido(novo-atual));
  } else if(novo<atual){
    let tirar=atual-novo;
    for(let i=p.pedidos.length-1;i>=0&&tirar>0;i--){
      const t=Math.min(tirar,p.pedidos[i].qtd);
      p.pedidos[i].qtd-=t; tirar-=t;
      if(p.pedidos[i].qtd<=0) p.pedidos.splice(i,1);
    }
  }
  sincronizarPedidos(p);
}
/* ---- lotes de compra a coletar (cada compra é um lote separado) ---- */
function novoLote(qtd,pedido){ return {id:gerarId('l'),qtd,data:hoje(),pedido:pedido||''}; }
function somaLotes(p){ return (p.lotes||[]).reduce((a,l)=>a+(l.qtd||0),0); }
function sincronizarLotes(p){ if(!Array.isArray(p.lotes)) p.lotes=[]; p.qtd.coletar=somaLotes(p); }
/* se vier estoque em Coletar sem lote (dado antigo ou cadastro direto), cria o lote correspondente */
function garantirLotes(p){
  if(!Array.isArray(p.lotes)) p.lotes=[];
  if(p.lotes.length===0 && (p.qtd&&p.qtd.coletar>0)) p.lotes=[novoLote(p.qtd.coletar)];
  p.lotes.forEach(l=>{ if(!l.id) l.id=gerarId('l'); if(!l.data) l.data=hoje(); if(l.pedido===undefined) l.pedido=''; });
  sincronizarLotes(p);
}
function ajustarColetarPorLotes(p,novo){
  if(!p.lotes) p.lotes=[];
  const atual=somaLotes(p);
  if(novo>atual) p.lotes.push(novoLote(novo-atual));
  else if(novo<atual){
    let tirar=atual-novo;
    for(let i=p.lotes.length-1;i>=0&&tirar>0;i--){
      const t=Math.min(tirar,p.lotes[i].qtd);
      p.lotes[i].qtd-=t; tirar-=t;
      if(p.lotes[i].qtd<=0) p.lotes.splice(i,1);
    }
  }
  sincronizarLotes(p);
}
function coletarLivre(p){ return Math.max(0, p.qtd.coletar - reservadoColetaDe(p)); }
/* total que está fisicamente no galpão (livre + o que já está etiquetado pra um envio) */
function totalNoGalpao(p){ return p.qtd.local + reservadoLocalDe(p); }
function disponivel(p){ return coletarLivre(p)+p.qtd.local; }
/* pra alertas de ruptura: mostra quanto tem em cada situação — no galpão (pronto pra enviar),
   a coletar (já comprado, só falta buscar no fornecedor) e a comprar (nem foi comprado ainda) —
   só lista o que for maior que zero. Cor: verde se já tem algo pronto no galpão, amarelo se só
   tem coisa a coletar, vermelho se só falta comprar (ou não tem nada pendente). */
function statusAcaoFull(p){
  const galpaoTotal=totalNoGalpao(p), galpaoLivre=p.qtd.local||0;
  const coletarTotal=p.qtd.coletar||0, coletarLivreQtd=coletarLivre(p);
  const comprar=p.qtd.comprar||0;
  const partes=[];
  if(galpaoTotal>0) partes.push(`galpão: ${fmtInt(galpaoTotal)}${galpaoLivre<galpaoTotal?` (${fmtInt(galpaoLivre)} livre)`:''}`);
  if(coletarTotal>0) partes.push(`a coletar: ${fmtInt(coletarTotal)}${coletarLivreQtd<coletarTotal?` (${fmtInt(coletarLivreQtd)} livre)`:''}`);
  if(comprar>0) partes.push(`a comprar: ${fmtInt(comprar)}`);
  const tipo=galpaoLivre>0?'ok':(coletarLivreQtd>0?'aten':'risco');
  return {texto:partes.length?partes.join(' · '):'sem estoque, compra ou coleta pendente',tipo};
}
/* qtd.coletar já contém o reservadoColeta — não somar duas vezes */
function valorEstoque(p){ return (p.custo||0)*(p.qtd.coletar+p.qtd.local+reservadoLocalDe(p)); }
/* "Valor estoque" na aba Produtos mostra o total (local + FULL) com o detalhe no hover.
   Na Visão Geral os dois continuam em linhas separadas, não mexe nisso aqui. */
function valorEstoqueDetalhado(p){
  const local=valorEstoque(p);
  const itFull=itemFullDoProduto(p);
  const full=itFull?fullCalc(itFull).valor:0;
  return {local,full,total:local+full};
}
function capitalGiroComprar(p){ return (p.custo||0)*p.qtd.comprar; }
/* estoque mínimo efetivo: quando o SKU já tem leitura do painel do Full, o mínimo passa a ser
   a média de vendas diária (mesma conta ponderada 7/15/30d da Previsão) x 30 dias de cobertura.
   Sem leitura do Full ainda, usa o valor manual digitado em Produtos. */
function itemFullDoProduto(p){
  return state.full.itens.find(i=>i.loja===p.loja&&fullProduto(i)&&fullProduto(i).id===p.id)||null;
}
function estoqueMinimoSugerido(p){
  if(p.vinculadoA) return null; /* mínimo mora no mestre, ver estoqueMinimoEfetivo */
  const media=mediaVendasDiaria(p);
  return (media!=null&&media>0)?Math.ceil(media*30):null;
}
function estoqueMinimoEfetivo(p){
  const sug=estoqueMinimoSugerido(p);
  return (sug!=null&&sug>0)?sug:(p.estoqueMinimo||0);
}
/* SKUs vinculados a este (mesmo produto físico, estoque compartilhado) - ver p.vinculadoA */
function membrosVinculados(p){ return state.produtos.filter(x=>x.vinculadoA===p.id); }
function estoqueBaixo(p){
  /* um SKU vinculado nunca tem estoque próprio (fica sempre com qtd zerada de propósito) -
     sem essa checagem ele soaria alarme de "estoque baixo" toda hora, mesmo o produto tendo
     estoque de sobra no SKU mestre. O alerta de verdade fica só no mestre. */
  if(p.vinculadoA) return false;
  return estoqueMinimoEfetivo(p)>0 && disponivel(p)<estoqueMinimoEfetivo(p);
}
/* média de vendas/dia do FULL (curva de vendas) — null quando não há leitura para o SKU.
   Quando o produto tem SKUs vinculados (mesmo estoque físico, ver p.vinculadoA), soma a média
   de todos eles - a decisão de quanto comprar/repor tem que olhar a demanda total, não só a
   de 1 dos anúncios. Um SKU vinculado não soma sozinho (retorna 0) - seu volume já entra na
   conta do mestre. */
/* media de vendas/dia SO' deste anuncio especifico, mesmo quando ele esta vinculado a outro -
   diferente de mediaVendasDiaria (que soma no mestre e esconde o valor do membro, usada pra
   decisao de reposicao). Usada so' pra EXIBIR na tabela de Produtos, pra Felipe conseguir ver
   o desempenho de cada anuncio separado mesmo depois de vincular o estoque. */
function mediaVendasDiariaPropria(p){
  const it=itemFullDoProduto(p);
  if(!it) return null;
  const m=fullCalc(it).media;
  return m>0?m:null;
}
/* resolve pro SKU que realmente guarda o estoque fisico (o mestre, se este for um membro
   vinculado - ou ele mesmo, se nao estiver vinculado a ninguem). Usada em qualquer lugar que
   PRECISE saber/mexer no estoque de verdade a partir de um SKU qualquer (ex: alocar num envio
   FULL escolhendo pela tela o SKU membro). */
function produtoEfetivo(p){ return p.vinculadoA?(prodById(p.vinculadoA)||p):p; }
function mediaVendasDiaria(p){
  if(p.vinculadoA) return 0;
  const grupo=[p,...membrosVinculados(p)];
  let total=0, temAlgum=false;
  grupo.forEach(q=>{
    const it=itemFullDoProduto(q);
    if(it){ const m=fullCalc(it).media; if(m>0){ total+=m; temAlgum=true; } }
  });
  return temAlgum?total:null;
}
/* classifica os produtos de 1 loja em curva A/B/C pela % acumulada da média de vendas/dia
   (Pareto: A até 80% acumulado, B até 95%, C o resto). Produtos sem leitura do FULL ficam sem
   classe (fora do mapa). Devolve um Map produtoId -> 'A'|'B'|'C'. */
function classificarCurvaLoja(loja){
  const ps=state.produtos.filter(p=>p.loja===loja).map(p=>({p,m:mediaVendasDiaria(p)||0})).filter(x=>x.m>0);
  ps.sort((a,b)=>b.m-a.m);
  const total=ps.reduce((s,x)=>s+x.m,0);
  const mapa=new Map();
  let acc=0;
  ps.forEach(x=>{
    acc+=x.m;
    const pct=total>0?acc/total:1;
    mapa.set(x.p.id,pct<=0.8?'A':(pct<=0.95?'B':'C'));
  });
  return mapa;
}
/* ---------- migração ---------- */
/* Dados criados antes deste vínculo: descobre de qual envio veio cada pedido,
   comparando o que cada envio ainda precisa comprar. */
function vincularPedidosAntigos(){
  state.produtos.forEach(p=>{
    if(!Array.isArray(p.pedidos)||!p.pedidos.length) return;
    if(p.pedidos.every(c=>c.envioId)) return;
    state.envios.forEach(e=>e.itens.forEach(i=>{
      if(i.produtoId!==p.id||!(i.geradoCompra>0)) return;
      const marca='FULL '+(e.nome||'')+(e.loja?' · '+e.loja:'');
      let rest=i.geradoCompra;
      for(let k=0;k<p.pedidos.length&&rest>0;k++){
        const c=p.pedidos[k];
        if(c.envioId) continue;
        if(c.qtd<=rest){ c.envioId=e.id; c.origem=marca; rest-=c.qtd; }
        else { c.qtd-=rest; p.pedidos.push({...novoPedido(rest),data:c.data,origem:marca,envioId:e.id}); rest=0; }
      }
    }));
    sincronizarPedidos(p);
  });
}

  (function migrarGestaoParaTarefa(){

  (function migrarSubsPeriodo(){

/* ---------- undo ---------- */
function snapshot(desc){ if(batchDepth>0) return; undoStack.push({desc,data:JSON.stringify(state)}); if(undoStack.length>25) undoStack.shift(); }
function batch(desc,fn){ snapshot(desc); batchDepth++; try{ fn(); } finally{ batchDepth--; } persist(); }
function desfazer(){
  const s=undoStack.pop(); if(!s) return;
  state=JSON.parse(s.data);
  saveToLocalStorage(); if(fileHandle) saveToFile(); renderAll();
  toast('↩ Desfeito: '+s.desc+(undoStack.length?` · restam ${undoStack.length} ação(ões) para desfazer`:' · nada mais para desfazer'));
}

/* ---- memória do arquivo entre sessões (IndexedDB) ---- */
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('estoque_fs',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('h'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){ try{ const d=await idbOpen(); return new Promise(res=>{ const t=d.transaction('h','readwrite'); t.objectStore('h').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>res(); }); }catch(e){} }
async function idbGet(k){ try{ const d=await idbOpen(); return new Promise(res=>{ const t=d.transaction('h','readonly'); const q=t.objectStore('h').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbDel(k){ try{ const d=await idbOpen(); return new Promise(res=>{ const t=d.transaction('h','readwrite'); t.objectStore('h').delete(k); t.oncomplete=()=>res(); t.onerror=()=>res(); }); }catch(e){} }
async function escrever(handle,texto){
  const w=await handle.createWritable(); await w.write(texto); await w.close();
}
/* Cache rotativo: a cada operação grava num slot; ao chegar no último, volta ao primeiro
   (sempre sobrescreve o mais antigo). Guarda as últimas N versões para recuperação. */
async function salvarRotativo(conteudo){
  const bdir=await dirHandle.getDirectoryHandle(PASTA_BACKUP,{create:true});
  let alvo=null, maisAntigo=Infinity;
  for(let i=1;i<=numSlots;i++){
    const nome='v'+String(i).padStart(2,'0')+'.json';
    let m;
    try{ m=(await (await bdir.getFileHandle(nome)).getFile()).lastModified; }
    catch(e){ alvo=nome; maisAntigo=-1; break; }   /* slot ainda não existe: usa este */
    if(m<maisAntigo){ maisAntigo=m; alvo=nome; }
  }
  if(alvo) await escrever(await bdir.getFileHandle(alvo,{create:true}),conteudo);
  return alvo;
}
/* Backup diário: guarda a foto do primeiro salvamento de cada dia */
async function salvarDiario(conteudo){
  const bdir=await dirHandle.getDirectoryHandle(PASTA_BACKUP,{create:true});
  const nome='diario-'+new Date().toISOString().slice(0,10)+'.json';
  let existe=true;
  try{ await bdir.getFileHandle(nome); }catch(e){ existe=false; }
  if(existe) return;
  await escrever(await bdir.getFileHandle(nome,{create:true}),conteudo);
  limparDiariosAntigos(bdir);
}
async function limparDiariosAntigos(bdir){
  try{
    const nomes=[];
    for await (const [nome] of bdir.entries()) if(/^diario-\d{4}-\d{2}-\d{2}\.json$/.test(nome)) nomes.push(nome);
    nomes.sort();
    while(nomes.length>MAX_BACKUPS_DIARIOS){ const v=nomes.shift(); try{ await bdir.removeEntry(v); }catch(e){} }
  }catch(e){}
}
async function salvarNaPasta(){
  const conteudo=JSON.stringify(state,null,2);
  const principal=await dirHandle.getFileHandle(ARQ_PRINCIPAL,{create:true});
  await escrever(principal,conteudo);
  fileHandle=principal;
  try{ ultimoMod=(await principal.getFile()).lastModified; }catch(e){}
  /* cópias de segurança em segundo plano — não travam o uso do sistema */
  salvarRotativo(conteudo).catch(()=>{});
  salvarDiario(conteudo).catch(()=>{});
  return true;
}
/* lista as versões guardadas para restauração */
async function listarVersoes(){
  if(!dirHandle) return [];
  const out=[];
  try{
    const bdir=await dirHandle.getDirectoryHandle(PASTA_BACKUP,{create:true});
    for await (const [nome,h] of bdir.entries()){
      if(!/\.json$/.test(nome)) continue;
      try{
        const f=await h.getFile();
        let n=0;
        try{ const d=JSON.parse(await f.text()); n=(d.produtos||[]).length; }catch(e){}
        out.push({nome,quando:new Date(f.lastModified),produtos:n,rotativo:/^v\d+\.json$/.test(nome)});
      }catch(e){}
    }
  }catch(e){}
  return out.sort((a,b)=>b.quando-a.quando);
}
async function restaurarVersao(nome){
  try{
    const bdir=await dirHandle.getDirectoryHandle(PASTA_BACKUP);
    const d=JSON.parse(await (await (await bdir.getFileHandle(nome)).getFile()).text());
    if(!d||!Array.isArray(d.produtos)) throw new Error('arquivo inválido');
    snapshot('restauração de backup');
    state={produtos:d.produtos,envios:Array.isArray(d.envios)?d.envios:[],tarefas:Array.isArray(d.tarefas)?d.tarefas:[],listas:Array.isArray(d.listas)?d.listas:[],full:(d.full&&typeof d.full==='object')?d.full:{cfg:{},itens:[],lidoEm:{},hist:[]},notasFiscais:Array.isArray(d.notasFiscais)?d.notasFiscais:[],financeiro:(d.financeiro&&typeof d.financeiro==='object')?d.financeiro:{},ads:(d.ads&&typeof d.ads==='object')?d.ads:{cfg:{},campanhas:[],hist:[]},mlSync:(d.mlSync&&typeof d.mlSync==='object')?d.mlSync:{cfg:{}},adsApi:(d.adsApi&&typeof d.adsApi==='object')?d.adsApi:{}};
    migrar(); persist();
    toast('Restaurado o backup '+nome+'.');
  }catch(e){ alert('Não consegui restaurar: '+e.message); }
}
/* Fila de gravação: evita que duas gravações concorrentes (ex: mexer no estoque e no FULL quase
   ao mesmo tempo) terminem fora de ordem e a mais lenta sobrescreva o arquivo com dados mais antigos.
   Enquanto uma gravação está em andamento, uma nova chamada só marca "salvar de novo depois" — quando
   a gravação atual terminar, ela repete a gravação já lendo o estado mais recente. */
let gravando=false, gravarDeNovo=false;
async function saveToFile(){
  if(!dirHandle&&!fileHandle) return false;
  if(gravando){ gravarDeNovo=true; return true; }
  gravando=true;
  try{
    do{
      gravarDeNovo=false;
      if(dirHandle) await salvarNaPasta();
      else{
        await escrever(fileHandle,JSON.stringify(state,null,2));
        try{ ultimoMod=(await fileHandle.getFile()).lastModified; }catch(e){}
      }
    } while(gravarDeNovo);
    alteracaoLocal=false;
    return true;
  }catch(e){
    console.error(e); alteracaoLocal=true;
    toast('⚠ Não consegui salvar. Verifique se o Dropbox está sincronizando ou reconecte a pasta.');
    return false;
  }finally{
    gravando=false;
  }
}
function limparMarcasFull(){
  if(!state.full||!Array.isArray(state.full.itens)) return;
  /* a marca de "já criado" só vale enquanto o envio existir */
  state.full.itens.forEach(i=>{ if(i.enviado&&!state.envios.some(e=>e.id===i.enviado.envioId)) i.enviado=null; });
}
function persist(){ ultimaAtividadeLocal=Date.now(); state.produtos.forEach(p=>{sincronizarLotes(p);sincronizarPedidos(p);}); reconciliarTudo(); limparMarcasFull(); saveToLocalStorage(); alteracaoLocal=true; if(fileHandle) saveToFile(); if(nuvemAuth) salvarNaNuvem(); renderAll(); }
/* ---- carrega o conteúdo do arquivo para a tela ---- */
async function carregarDoArquivo(silencioso){
  if(!fileHandle) return false;
  try{
    const f=await fileHandle.getFile();
    const d=JSON.parse(await f.text());
    if(!d||!Array.isArray(d.produtos)) throw new Error('conteúdo inválido');
    state={produtos:d.produtos,envios:Array.isArray(d.envios)?d.envios:[],tarefas:Array.isArray(d.tarefas)?d.tarefas:[],listas:Array.isArray(d.listas)?d.listas:[],full:(d.full&&typeof d.full==='object')?d.full:{cfg:{},itens:[],lidoEm:{},hist:[]},notasFiscais:Array.isArray(d.notasFiscais)?d.notasFiscais:[],financeiro:(d.financeiro&&typeof d.financeiro==='object')?d.financeiro:{},ads:(d.ads&&typeof d.ads==='object')?d.ads:{cfg:{},campanhas:[],hist:[]},mlSync:(d.mlSync&&typeof d.mlSync==='object')?d.mlSync:{cfg:{}},adsApi:(d.adsApi&&typeof d.adsApi==='object')?d.adsApi:{}};
    migrar(); saveToLocalStorage();
    ultimoMod=f.lastModified; alteracaoLocal=false; undoStack=[];
    renderAll();
    if(!silencioso) toast('Dados carregados do arquivo.');
    return true;
  }catch(e){ toast('⚠ Não consegui ler o arquivo: '+e.message); return false; }
}
/* evita perder o que o usuário está digitando: se ele tiver um campo de texto em foco,
   não aplica atualização remota agora - tenta de novo no próximo ciclo (pedido do Felipe 19/08,
   texto sumindo em Tarefas enquanto digitava) */
function usuarioDigitando(){
  const a=document.activeElement;
  if(!a) return false;
  const tag=(a.tagName||'').toUpperCase();
  return tag==='INPUT'||tag==='TEXTAREA'||a.isContentEditable;
}
/* além de "está digitando", dá uma folga de alguns segundos depois de QUALQUER clique/edição
   local (concluir tarefa, marcar subtarefa etc.) - o clique já salva sozinho, só evita que o
   sync automático de 30s chegue no meio do caminho e sobrescreva com uma versão mais antiga
   antes da gravação terminar - pedido do Felipe 19/08 */
function syncDevePular(){
  if(usuarioDigitando()) return true;
  if(Date.now()-ultimaAtividadeLocal<6000) return true;
  return false;
}
/* ---- verifica se outro computador alterou o arquivo ---- */
async function verificarArquivo(){
  if(!fileHandle) return;
  try{
    const f=await fileHandle.getFile();
    ultimaVerificacao=new Date();
    if(f.lastModified>ultimoMod+800){
      if(syncDevePular()) return;
      if(alteracaoLocal){
        confirmAction('Este arquivo foi alterado em outro computador, mas você também tem alterações aqui que ainda não foram gravadas. Se carregar a versão do arquivo, você perde o que fez nesta tela. Deseja carregar mesmo assim? (Cancelar mantém o seu e grava por cima na próxima alteração.)',
          ()=>carregarDoArquivo());
      } else {
        await carregarDoArquivo(true);
        toast('🔄 Atualizado: outro computador alterou os dados.');
      }
    }
    updateFileStatus();
  }catch(e){ /* arquivo pode estar sendo sincronizado — tenta de novo no próximo ciclo */ }
}
function iniciarSync(){
  if(syncTimer) clearInterval(syncTimer);
  if(fileHandle&&intervaloSync>0) syncTimer=setInterval(verificarArquivo,intervaloSync*1000);
}
function definirIntervaloSync(seg){
  intervaloSync=seg; localStorage.setItem('estoque_sync_seg',String(seg));
  iniciarSync(); updateFileStatus();
}
/* ---- conectar uma PASTA: o sistema cria e mantém principal + backups ---- */
async function conectarPasta(){
  if(!window.showDirectoryPicker){ alert('Seu navegador não suporta conectar pasta. Use Chrome ou Edge.'); return; }
  try{
    const d=await window.showDirectoryPicker({mode:'readwrite'});
    dirHandle=d; handlePendente=null;
    const principal=await d.getFileHandle(ARQ_PRINCIPAL,{create:true});
    fileHandle=principal;
    let txt='';
    try{ txt=await (await principal.getFile()).text(); }catch(e){}
    if(txt&&txt.trim().length>2){
      try{
        const dd=JSON.parse(txt);
        if(dd&&Array.isArray(dd.produtos)){
          state={produtos:dd.produtos,envios:Array.isArray(dd.envios)?dd.envios:[],tarefas:Array.isArray(dd.tarefas)?dd.tarefas:[],listas:Array.isArray(dd.listas)?dd.listas:[],full:(dd.full&&typeof dd.full==='object')?dd.full:{cfg:{},itens:[],lidoEm:{},hist:[]},notasFiscais:Array.isArray(dd.notasFiscais)?dd.notasFiscais:[],financeiro:(dd.financeiro&&typeof dd.financeiro==='object')?dd.financeiro:{},ads:(dd.ads&&typeof dd.ads==='object')?dd.ads:{cfg:{},campanhas:[],hist:[]},mlSync:(dd.mlSync&&typeof dd.mlSync==='object')?dd.mlSync:{cfg:{}}};
          migrar(); undoStack=[];
          toast('Pasta conectada. Dados existentes carregados.');
        }
      }catch(e){ toast('⚠ O arquivo da pasta está ilegível. Seus dados atuais foram mantidos.'); }
    } else { await saveToFile(); toast('Pasta conectada. O sistema vai manter o arquivo principal e os backups aqui.'); }
    try{ ultimoMod=(await principal.getFile()).lastModified; }catch(e){}
    alteracaoLocal=false;
    await idbSet('dir',d); await idbDel('handle'); localStorage.setItem('estoque_arquivo_nome',d.name||'pasta');
    iniciarSync(); saveToLocalStorage(); renderAll();
  }catch(e){ if(e.name!=='AbortError') alert('Não foi possível conectar a pasta: '+e.message); }
}
/* ---- reconecta sozinho ao que foi usado da última vez ---- */
async function tentarReconectar(){
  if(nuvemAuth){
    verificandoArquivo=false;
    await carregarDaNuvem(true); iniciarSyncNuvem(); renderAll();
    return;
  }
  const d=await idbGet('dir');
  if(d){
    try{
      const perm=await d.queryPermission({mode:'readwrite'});
      if(perm==='granted'){
        dirHandle=d;
        fileHandle=await d.getFileHandle(ARQ_PRINCIPAL,{create:true});
        verificandoArquivo=false;
        await carregarDoArquivo(true); iniciarSync();
        toast('Reconectado à pasta "'+(d.name||'')+'" automaticamente.');
      } else { handlePendente=d; tipoPendente='dir'; }
    }catch(e){ handlePendente=d; tipoPendente='dir'; }
    verificandoArquivo=false; renderAll();
    return;
  }
  const h=await idbGet('handle');
  if(!h){ verificandoArquivo=false; localStorage.removeItem('estoque_arquivo_nome'); renderAll(); return; }
  try{
    const perm=await h.queryPermission({mode:'readwrite'});
    if(perm==='granted'){
      fileHandle=h; verificandoArquivo=false;
      await carregarDoArquivo(true); iniciarSync();
      toast('Sistema atualizado com os dados de "'+(h.name||'arquivo')+'".');
    } else { handlePendente=h; tipoPendente='file'; }
  }catch(e){ handlePendente=h; tipoPendente='file'; }
  verificandoArquivo=false; renderAll();
}
async function reconectarComPermissao(){
  const h=handlePendente; if(!h) return;
  try{
    const perm=await h.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){ toast('Permissão não concedida.'); return; }
    if(tipoPendente==='dir'){ dirHandle=h; fileHandle=await h.getFileHandle(ARQ_PRINCIPAL,{create:true}); }
    else fileHandle=h;
    handlePendente=null; verificandoArquivo=false;
    await carregarDoArquivo(true); iniciarSync();
    renderBloqueio();
    toast('Sistema atualizado com os dados mais recentes.');
  }catch(e){ toast('Não foi possível reconectar: '+e.message); }
}

async function desconectarArquivo(){
  fileHandle=null; dirHandle=null; handlePendente=null;

/* ---- sincronizar com a nuvem: alternativa a "conectar pasta" que funciona em QUALQUER

   computador). Guarda o estado inteiro do Doca no mesmo backend/banco já usado pro Mercado
   Livre/Mercado Pago, em vez de escrever num arquivo local — por isso não depende de Dropbox
   nem de pasta nenhuma. Protegido por usuário/senha (Basic Auth); as credenciais, uma vez
   digitadas, ficam salvas neste navegador. */
function nuvemBaseUrl(){ return backendUrl(); }
async function nuvemFetch(caminho,opts){
  const base=nuvemBaseUrl();

  if(!nuvemAuth) throw new Error('Nuvem não conectada.');
  const r=await fetch(`${base}${caminho}`,{...opts,headers:{...(opts&&opts.headers||{}),Authorization:'Basic '+nuvemAuth,'Content-Type':'application/json'}});
  if(r.status===401) throw new Error('Usuário ou senha incorretos.');

/* ---------- CRUD ---------- */
function addProduto(d){ const p={id:gerarId('p'),...d,criadoEm:Date.now(),atualizadoEm:Date.now()}; garantirLotes(p); garantirPedidos(p); state.produtos.push(p); return p; }
function updateProduto(id,patch){ snapshot('edição do SKU '+(prodById(id)||{}).sku); const p=prodById(id); if(!p) return; Object.assign(p,patch); p.atualizadoEm=Date.now(); persist(); }
/* transfere TODO o estoque próprio (comprar/coletar/local) e as reservas em envios FULL do SKU
   "origem" pro SKU "alvo" (mestre), como parte de vincular estoque compartilhado. Antes disso era
   pedido pra fazer essa mudança à mão (Ajuste manual de estoque), mas isso não dava conta das
   reservas em envio (não tem como "mover" isso na tela) nem era proporcional - o número bruto de
   um SKU não corresponde ao do outro. Agora o vínculo já faz a transferência sozinho: os pedidos
   de compra e os lotes a coletar do SKU antigo passam a pertencer ao SKU mestre (mantendo a
   rastreabilidade de cada lote/pedido), o "local" soma direto, e cada item de envio FULL que
   apontava pro SKU antigo passa a apontar pro mestre (juntando com o item do mestre no mesmo
   envio, se já existir um). */
function mesclarEstoqueNoVinculo(origemId,alvoId){
  const origem=prodById(origemId), alvo=prodById(alvoId);
  if(!origem||!alvo) return {ok:false,msg:'SKU não encontrado.'};
  (origem.pedidos||[]).forEach(ped=>{
    if((ped.qtd||0)<=0) return;
    alvo.pedidos.push({...ped,id:gerarId('c'),obs:(ped.obs?ped.obs+' ':'')+'(transferido de '+origem.sku+')'});
  });
  (origem.lotes||[]).forEach(lote=>{
    if((lote.qtd||0)<=0) return;
    alvo.lotes.push({...lote,id:gerarId('l')});
  });
  alvo.qtd.local=(alvo.qtd.local||0)+(origem.qtd.local||0);
  state.envios.forEach(e=>{
    const idxOrigem=e.itens.findIndex(i=>i.produtoId===origemId);
    if(idxOrigem<0) return;
    const itOrigem=e.itens[idxOrigem];
    const idxAlvo=e.itens.findIndex(i=>i.produtoId===alvoId);
    if(idxAlvo>=0){
      const itAlvo=e.itens[idxAlvo];
      itAlvo.solicitado=(itAlvo.solicitado||0)+(itOrigem.solicitado||0);
      itAlvo.alocado=(itAlvo.alocado||0)+(itOrigem.alocado||0);
      itAlvo.reservadoColeta=(itAlvo.reservadoColeta||0)+(itOrigem.reservadoColeta||0);
      itAlvo.geradoCompra=(itAlvo.geradoCompra||0)+(itOrigem.geradoCompra||0);
      e.itens.splice(idxOrigem,1);
    }else{
      itOrigem.produtoId=alvoId;
    }
  });
  origem.qtd={comprar:0,coletar:0,local:0};
  origem.pedidos=[]; origem.lotes=[];
  return {ok:true};
}
function deleteProduto(id){
  const p=prodById(id); if(!p) return;
  snapshot('exclusão do SKU '+p.sku);
  state.envios.forEach(e=>e.itens.forEach(i=>{ if(i.produtoId===id&&i.geradoCompra>0) removerCompraDoEnvio(p,e.id,i.geradoCompra); }));
  /* se este SKU era o "mestre" de algum vínculo de estoque compartilhado, desvincula os outros
     (senão eles ficam apontando pra um produtoId que não existe mais). */
  state.produtos.forEach(x=>{ if(x.vinculadoA===id) x.vinculadoA=null; });
  state.produtos=state.produtos.filter(x=>x.id!==id);
  state.envios.forEach(e=> e.itens=e.itens.filter(i=>i.produtoId!==id));
  state.envios=state.envios.filter(e=>e.itens.length>0);
  persist();
}
function adicionarQtd(id,campo,qty){
  const p=prodById(id); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  qty=parseInt(qty); if(!qty||qty<=0) return {ok:false,msg:'Informe uma quantidade válida.'};
  snapshot(`entrada de ${qty} un. em ${STATUS_LABEL[campo]} (${p.sku})`);
  if(campo==='coletar'){ if(!p.lotes) p.lotes=[]; p.lotes.push(novoLote(qty)); sincronizarLotes(p); }
  else if(campo==='comprar'){ if(!p.pedidos) p.pedidos=[]; p.pedidos.push(novoPedido(qty)); sincronizarPedidos(p); }
  else p.qtd[campo]=(p.qtd[campo]||0)+qty;
  p.atualizadoEm=Date.now(); persist();
  return {ok:true};
}
/* ---------- kit (produto que consome outros produtos) ---------- */
function componentesDe(p){ return p.componentesKit||[]; }
/* números "virtuais" de um kit pra Comprar/Coletar/Local/Reservado/Disponível - o kit em si
   nunca tem estoque próprio (fica sempre 0, de propósito, pra não contar 2x junto com os
   componentes nos totais da loja), mas pra ORIENTAÇÃO VISUAL é útil ver quantos kits dá pra
   montar com o que cada componente tem hoje em cada status - o gargalo (componente com MENOS)
   é quem manda em cada coluna. Só leitura, não conta em soma nenhuma (por isso a tela de
   Produtos usa esse valor separado do p.qtd de verdade). */
function kitVirtualQtd(p){
  const comps=componentesDe(p);
  if(!comps.length) return null;
  let comprar=Infinity,coletar=Infinity,local=Infinity,reservado=Infinity,disp=Infinity;
  comps.forEach(c=>{
    const comp=prodById(c.produtoId); if(!comp) return;
    const base=produtoEfetivo(comp);
    const qpu=c.qtdPorUnidade||1;
    comprar=Math.min(comprar,Math.floor((base.qtd.comprar||0)/qpu));
    coletar=Math.min(coletar,Math.floor((base.qtd.coletar||0)/qpu));
    local=Math.min(local,Math.floor(totalNoGalpao(base)/qpu));
    reservado=Math.min(reservado,Math.floor(reservadoDe(base)/qpu));
    disp=Math.min(disp,Math.floor(disponivel(base)/qpu));
  });
  if(comprar===Infinity) return null;
  return {comprar,coletar,local,reservado,disp};
}
/* produtos dessa loja que já são componente de ALGUM kit (útil pra saber, mas não bloqueia usar
   o mesmo produto em kits diferentes - ex: esponja pode entrar em mais de 1 kit). */
function kitsQueUsam(produtoId){ return state.produtos.filter(x=>componentesDe(x).some(c=>c.produtoId===produtoId)); }
function adicionarComponenteKit(kitId,produtoId,qtdPorUnidade){
  const kit=prodById(kitId); if(!kit) return {ok:false,msg:'Produto não encontrado.'};
  const comp=prodById(produtoId); if(!comp) return {ok:false,msg:'Componente não encontrado.'};
  qtdPorUnidade=parseInt(qtdPorUnidade); if(!qtdPorUnidade||qtdPorUnidade<=0) return {ok:false,msg:'Informe uma quantidade válida.'};
  if(produtoId===kitId) return {ok:false,msg:'Um kit não pode consumir a si mesmo.'};
  const lista=componentesDe(kit);
  if(lista.some(c=>c.produtoId===produtoId)) return {ok:false,msg:'Esse produto já está nos componentes deste kit.'};
  updateProduto(kitId,{componentesKit:[...lista,{produtoId,qtdPorUnidade}]});
  return {ok:true};
}
function removerComponenteKit(kitId,produtoId){
  const kit=prodById(kitId); if(!kit) return;
  updateProduto(kitId,{componentesKit:componentesDe(kit).filter(c=>c.produtoId!==produtoId)});
}
/* cria um SKU novo (loja igual a do kit) e ja' adiciona ele como componente - pra quando o
   componente e' algo que so' existe pra montar o kit (ex: a luva do Kit Pet), sem anuncio
   proprio no Mercado Livre, sem precisar sair do modal do kit pra cadastrar antes. */
function criarComponenteInterno(kitId,sku,qtdPorUnidade){
  const kit=prodById(kitId); if(!kit) return {ok:false,msg:'Produto não encontrado.'};
  sku=(sku||'').trim().toUpperCase();
  if(!sku) return {ok:false,msg:'Dê um nome/SKU pro componente novo.'};
  const dup=state.produtos.some(x=>x.loja===kit.loja&&x.sku.toLowerCase()===sku.toLowerCase());
  if(dup) return {ok:false,msg:'Já existe esse SKU cadastrado nessa loja.'};
  const novo=addProduto({loja:kit.loja,sku,codigo:'',fornecedor:'',custo:0,unidPorCaixa:0,estoqueMinimo:0,qtd:{comprar:0,coletar:0,local:0},lotes:[],pedidos:[],obsCompra:'',interno:true});
  return adicionarComponenteKit(kitId,novo.id,qtdPorUnidade);
}
/* "montar X kits" não mexe no estoque do próprio kit - soma em Comprar de CADA componente a
   quantidade necessária (qtdMontar x qtdPorUnidade), reaproveitando o mesmo fluxo que já existe
   pra qualquer produto normal (aba Comprar). Ex: montar 20 Kit Pet com componentes {luva:1,
   esponja:1} soma 20 em Comprar da luva e 20 em Comprar da esponja - se a esponja já tinha 20
   de compra própria (venda avulsa), fica 40 no total, exatamente o cenário que motivou isso. */
function montarKit(kitId,qtdMontar){
  const kit=prodById(kitId); if(!kit) return {ok:false,msg:'Produto não encontrado.'};
  qtdMontar=parseInt(qtdMontar); if(!qtdMontar||qtdMontar<=0) return {ok:false,msg:'Informe uma quantidade válida.'};
  const lista=componentesDe(kit);
  if(!lista.length) return {ok:false,msg:'Este kit não tem componentes cadastrados.'};
  const detalhes=[];
  batch(`montagem de ${qtdMontar} un. de ${kit.sku}`,()=>{
    lista.forEach(c=>{
      const comp=prodById(c.produtoId); if(!comp) return;
      const qty=qtdMontar*c.qtdPorUnidade;
      adicionarQtd(c.produtoId,'comprar',qty);
      detalhes.push(`${qty} un. de ${comp.sku}`);
    });
  });
  return {ok:true,detalhes};
}
/* compra que chegou vira "reservado a coletar" nos envios que a geraram */
function converterCompraParaColeta(p,qtd){
  let rest=qtd;
  enviosOrdenados().forEach(e=>e.itens.forEach(i=>{
    if(rest<=0||i.produtoId!==p.id) return;
    const c=Math.min(rest,i.geradoCompra||0);
    if(c>0){ i.geradoCompra-=c; i.reservadoColeta=(i.reservadoColeta||0)+c; rest-=c; }
  }));
}
/* mercadoria coletada que chegou no galpão vira reserva etiquetada */
function converterColetaParaLocal(p,qtd){
  let rest=qtd;
  enviosOrdenados().forEach(e=>e.itens.forEach(i=>{
    if(rest<=0||i.produtoId!==p.id) return;
    const c=Math.min(rest,i.reservadoColeta||0,p.qtd.local);
    if(c>0){ i.reservadoColeta-=c; i.alocado+=c; p.qtd.local-=c; rest-=c; }
  }));
}
function moverQtd(id,from,to,qty){
  const p=prodById(id); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  qty=parseInt(qty); if(!qty||qty<=0) return {ok:false,msg:'Informe uma quantidade válida.'};
  if(p.qtd[from]<qty) return {ok:false,msg:'Quantidade maior que o disponível em '+STATUS_LABEL[from]+'.'};
  if(from==='coletar'&&to==='comprar'&&coletarLivre(p)<qty)
    return {ok:false,msg:`Só ${fmtInt(coletarLivre(p))} un. estão livres em Coletar — o restante já está reservado para um envio FULL.`};
  snapshot(`${qty} un. de ${STATUS_LABEL[from]} → ${STATUS_LABEL[to]} (${p.sku})`);
  if(from==='coletar') ajustarColetarPorLotes(p,p.qtd.coletar-qty);
  else if(from==='comprar') ajustarComprarPorPedidos(p,p.qtd.comprar-qty);
  else p.qtd[from]-=qty;
  if(to==='coletar'){ if(!p.lotes) p.lotes=[]; p.lotes.push(novoLote(qty)); sincronizarLotes(p); }
  else if(to==='comprar'){ if(!p.pedidos) p.pedidos=[]; p.pedidos.push(novoPedido(qty)); sincronizarPedidos(p); }
  else p.qtd[to]=(p.qtd[to]||0)+qty;
  p.atualizadoEm=Date.now();
  if(from==='comprar'&&to==='coletar') converterCompraParaColeta(p,qty);
  if(from==='coletar'&&to==='local') converterColetaParaLocal(p,qty);
  persist();
  return {ok:true};
}
/* marca um pedido como comprado: ele vira um lote a coletar */
function comprarPedido(produtoId,pedidoId){
  const p=prodById(produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  const c=(p.pedidos||[]).find(x=>x.id===pedidoId); if(!c) return {ok:false,msg:'Pedido não encontrado.'};
  if(c.qtd<=0) return {ok:false,msg:'Informe uma quantidade maior que zero.'};
  snapshot(`pedido de ${fmtInt(c.qtd)} un. comprado (${p.sku})`);
  const q=c.qtd;
  p.pedidos=p.pedidos.filter(x=>x.id!==pedidoId);
  sincronizarPedidos(p);
  if(!p.lotes) p.lotes=[];
  const lote=novoLote(q);
  p.lotes.push(lote);
  sincronizarLotes(p);
  converterCompraParaColeta(p,q);
  /* registra a compra na lista de Notas Fiscais — fica independente do ciclo do estoque,
     porque o fornecedor às vezes só manda a NF depois da coleta já feita. */
  if(!Array.isArray(state.notasFiscais)) state.notasFiscais=[];
  state.notasFiscais.push({id:gerarId('nf'),produtoId:p.id,sku:p.sku,codigo:p.codigo,loja:p.loja,
    fornecedor:p.fornecedor,qtd:q,dataCompra:hoje(),loteId:lote.id,recebida:false,numero:'',dataRecebida:null,criadoEm:Date.now()});
  p.atualizadoEm=Date.now(); persist();
  return {ok:true,qtd:q};
}
function atualizarNotaFiscal(id,patch){
  const n=(state.notasFiscais||[]).find(x=>x.id===id); if(!n) return;
  snapshot('atualização de nota fiscal ('+n.sku+')');
  if(patch.numero!==undefined) n.numero=patch.numero;
  if(patch.recebida!==undefined){ n.recebida=!!patch.recebida; n.dataRecebida=n.recebida?hoje():null; }
  persist();
}
/* registra um aviso persistente (fica até a pessoa confirmar que já ajustou no ML de verdade) —
   dispara tanto quando o fornecedor entrega menos (Comprar) quanto quando alguém reduz a
   quantidade de um item direto no envio (Envios programados) */
function registrarAvisoAjusteEnvio(p,envio,qtd,motivo,direcao){
  if(!Array.isArray(state.avisosFornecedor)) state.avisosFornecedor=[];
  state.avisosFornecedor.push({id:gerarId('af'),produtoId:p.id,sku:p.sku,loja:p.loja,
    envioId:envio.id,envioNome:envio.nome,qtd,motivo:motivo||'fornecedor',direcao:direcao||'remover',criadoEm:Date.now()});
}
function atualizarPedido(produtoId,pedidoId,patch){
  const p=prodById(produtoId); if(!p) return {ok:false};
  const c=(p.pedidos||[]).find(x=>x.id===pedidoId); if(!c) return {ok:false};
  let aviso=null;
  if(patch.qtd!==undefined){
    const v=parseInt(patch.qtd);
    if(isNaN(v)||v<0) return {ok:false,msg:'Quantidade inválida.'};
    const faltou=c.qtd-v; /* positivo = fornecedor entregou menos do que o pedido */
    const envioIdOrig=c.envioId;
    snapshot(`ajuste do pedido de ${p.sku}`);
    c.qtd=v;
    if(v===0) p.pedidos=p.pedidos.filter(x=>x.id!==pedidoId);
    /* esse pedido tinha nascido de um envio FULL programado (envioId) e o fornecedor não
       entregou tudo: a diferença não vai existir pra mandar, então tira do envio programado
       aqui no Doca e avisa pra tirar a mesma quantidade do envio real no Mercado Livre —
       o Doca não controla o inbound real do ML, só o planejamento.
       Já quando a quantidade do pedido AUMENTA não mexe no envio: a compra extra pode ser
       só pra guardar em estoque, não necessariamente pro FULL. */
    if(faltou>0&&envioIdOrig){
      const e=envioById(envioIdOrig);
      const item=e&&e.itens.find(x=>x.produtoId===produtoId);
      if(e&&item){
        const tirar=Math.min(faltou,item.geradoCompra||0);
        if(tirar>0){
          item.geradoCompra-=tirar;
          item.solicitado=Math.max(0,(item.solicitado||0)-tirar);
          registrarAvisoAjusteEnvio(p,e,tirar,'fornecedor','remover');
          aviso={envio:e.nome,qtd:tirar,direcao:'remover'};
        }
      }
    }
  }
  if(patch.obs!==undefined) c.obs=patch.obs;
  sincronizarPedidos(p); persist();
  return {ok:true,aviso};
}
/* altera a quantidade de UMA programação do envio, refazendo reserva e compra */
/* nucleo do ajuste — sem snapshot nem persist, para usar dentro de batch */
function aplicarAjusteItem(e,i,p,novoTotal){
  const dif=novoTotal-(i.solicitado||0);
  if(dif===0) return 0;
  if(dif>0){
    /* precisa de mais: galpao -> coletar livre -> compra */
    let falta=dif;
    const doLocal=Math.min(falta,p.qtd.local);
    p.qtd.local-=doLocal; i.alocado+=doLocal; falta-=doLocal;
    const doColeta=Math.min(falta,coletarLivre(p));
    i.reservadoColeta=(i.reservadoColeta||0)+doColeta; falta-=doColeta;
    if(falta>0){
      if(!p.pedidos) p.pedidos=[];
      p.pedidos.push({...novoPedido(falta),origem:'FULL '+(e.nome||'')+(e.loja?' · '+e.loja:''),envioId:e.id});
      sincronizarPedidos(p);
      i.geradoCompra=(i.geradoCompra||0)+falta;
    }
  } else {
    /* sobrou: desfaz na ordem inversa — compra, depois coleta, depois galpao */
    let tirar=-dif;
    const daCompra=Math.min(tirar,i.geradoCompra||0);
    if(daCompra>0){ removerCompraDoEnvio(p,e.id,daCompra); i.geradoCompra-=daCompra; tirar-=daCompra; }
    const daColeta=Math.min(tirar,i.reservadoColeta||0);
    if(daColeta>0){ i.reservadoColeta-=daColeta; tirar-=daColeta; }
    const doGalpao=Math.min(tirar,i.alocado||0);
    if(doGalpao>0){ i.alocado-=doGalpao; p.qtd.local+=doGalpao; tirar-=doGalpao; }
  }
  i.solicitado=novoTotal;
  if(i.solicitado<=0) e.itens=e.itens.filter(x=>x.id!==i.id);
  p.atualizadoEm=Date.now();
  return dif;
}
/* o que muda se este PDF for aplicado sobre o envio — so calcula, nao altera nada */
function compararEnvioComPdf(envio,linhas){
  const res=[], usados={};
  linhas.forEach(l=>{
    const p=state.produtos.find(x=>x.loja===envio.loja&&x.sku.toLowerCase()===String(l.sku||'').toLowerCase());
    const itens=p?envio.itens.filter(i=>i.produtoId===p.id):[];
    itens.forEach(i=>usados[i.id]=1);
    const atual=itens.reduce((a,i)=>a+(i.solicitado||0),0);
    res.push({sku:l.sku,codigo:l.codigo,produto:p,itens,atual,novo:l.qtd,dif:l.qtd-atual,
      tipo:!p?'novoProduto':(itens.length?'ajuste':'novoItem'),varias:itens.length>1});
  });
  envio.itens.forEach(i=>{
    if(usados[i.id]) return;
    const p=prodById(i.produtoId);
    res.push({sku:p?p.sku:'?',codigo:p?p.codigo:'',produto:p,itens:[i],atual:i.solicitado||0,novo:0,
      dif:-(i.solicitado||0),tipo:'removido',varias:false});
  });
  return res;
}
/* aplica o PDF sobre um envio ja existente */
function atualizarEnvioComPdf(envioId,linhas,arquivo){
  const e=envioById(envioId); if(!e) return {ok:false,msg:'Envio não encontrado.'};
  const comp=compararEnvioComPdf(e,linhas);
  let sub=0,soma=0,rem=0,cri=0;
  batch('atualização do envio '+e.nome+' pelo PDF '+(arquivo||''),()=>{
    comp.forEach(c=>{
      if(c.dif===0) return;
      if(c.tipo==='novoProduto'){
        const p=addProduto({loja:e.loja,sku:(c.sku||'').toUpperCase(),codigo:(c.codigo||'').toUpperCase(),
          fornecedor:'',custo:0,estoqueMinimo:0,qtd:{comprar:0,coletar:0,local:0},lotes:[],pedidos:[],obsCompra:''});
        cri++; alocarNoEnvio(e,p,c.novo); soma+=c.novo; return;
      }
      if(c.tipo==='novoItem'){ alocarNoEnvio(e,c.produto,c.novo); soma+=c.novo; return; }
      if(c.tipo==='removido'){ aplicarAjusteItem(e,c.itens[0],c.produto,0); rem++; return; }
      /* ajuste: mexe na ultima programacao do SKU */
      const alvo=c.itens[c.itens.length-1];
      const outras=c.atual-(alvo.solicitado||0);
      const novoDoAlvo=Math.max(0,c.novo-outras);
      aplicarAjusteItem(e,alvo,c.produto,novoDoAlvo);
      if(c.dif>0) soma+=c.dif; else sub+=-c.dif;
    });
    if(arquivo) e.arquivo=arquivo;
  });
  return {ok:true,soma,sub,rem,cri,comp};
}
function ajustarItemEnvio(envioId,itemId,novoTotal){
  const e=envioById(envioId); if(!e) return {ok:false,msg:'Envio não encontrado.'};
  const i=e.itens.find(x=>x.id===itemId); if(!i) return {ok:false,msg:'Item não encontrado.'};
  const p=prodById(i.produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  novoTotal=parseInt(novoTotal);
  if(isNaN(novoTotal)||novoTotal<0) return {ok:false,msg:'Informe uma quantidade válida.'};
  const dif=novoTotal-(i.solicitado||0);
  if(dif===0) return {ok:true,dif:0};
  snapshot(`ajuste de ${p.sku} no envio ${e.nome}`);
  aplicarAjusteItem(e,i,p,novoTotal);
  /* alterou à mão a quantidade de um item que já estava num envio programado: o envio real
     no Mercado Livre também precisa mudar (pra menos ou pra mais) — como o Doca não mexe
     nele diretamente, avisa. */
  if(dif<0) registrarAvisoAjusteEnvio(p,e,-dif,'manual','remover');
  else if(dif>0) registrarAvisoAjusteEnvio(p,e,dif,'manual','adicionar');
  persist();
  return {ok:true,dif};
}
/* recebe um lote inteiro no galpão */
function receberLote(produtoId,loteId){
  const p=prodById(produtoId); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  const l=(p.lotes||[]).find(x=>x.id===loteId); if(!l) return {ok:false,msg:'Lote não encontrado.'};
  snapshot(`lote de ${fmtInt(l.qtd)} un. chegou no galpão (${p.sku})`);
  const q=l.qtd;

}
function atualizarLote(produtoId,loteId,patch){

/* Reavalia os envios deste SKU: pendências de compra que agora já estão cobertas
   pelo estoque a coletar deixam de ser ordem de compra e viram reserva. */
function reconciliarProduto(p){
  let movido=0;
  enviosOrdenados().forEach(e=>e.itens.forEach(i=>{
    if(i.produtoId!==p.id) return;
    /* 1) pendência coberta pelo que já está no galpão → vira reserva etiquetada */
    let c=Math.min(i.geradoCompra||0, p.qtd.local);
    if(c>0){ i.geradoCompra-=c; i.alocado+=c; p.qtd.local-=c; movido+=c; }
    /* 2) pendência coberta pelo que já foi comprado e está por coletar */
    c=Math.min(i.geradoCompra||0, coletarLivre(p));
    if(c>0){ i.geradoCompra-=c; i.reservadoColeta=(i.reservadoColeta||0)+c; movido+=c; }
  }));
  return movido;
}
/* garante que nenhum envio fique "falta comprar" havendo estoque livre daquele SKU */
function reconciliarTudo(){ let t=0; state.produtos.forEach(p=>{ t+=reconciliarProduto(p); }); return t; }
function ajustarEstoque(id,novos){
  const p=prodById(id); if(!p) return {ok:false,msg:'Produto não encontrado.'};
  const rc=reservadoColetaDe(p);
  const nc=parseInt(novos.coletar);
  if(!isNaN(nc)&&nc<rc) return {ok:false,msg:`Coletar não pode ficar abaixo de ${fmtInt(rc)} — essa quantidade já está reservada para envios FULL. Remova do envio antes de reduzir.`};
  /* o número informado é o TOTAL contado no galpão (livre + o que já está etiquetado) */
  /* o número informado é só a parte LIVRE (solta no galpão) - o que já está etiquetado/
     reservado para envios FULL fica de fora dessa contagem e não é alterado aqui. Antes o
     campo pedia o TOTAL (livre + etiquetado) e travava se desse menos que o etiquetado, o que
     obrigava a pessoa a somar de cabeça o que já estava separado/embalado pro FULL - na
     prática, quem faz a contagem física não recontava essas caixas já preparadas. */
  const livre=parseInt(novos.local);
  const etiquetado=reservadoLocalDe(p);
  if(!isNaN(livre)&&livre<0) return {ok:false,msg:'Informe uma quantidade válida.'};
  snapshot('ajuste manual de estoque ('+p.sku+')');
  if(!isNaN(livre)) p.qtd.local=livre;
  const ncp=parseInt(novos.comprar); if(!isNaN(ncp)&&ncp>=0) ajustarComprarPorPedidos(p,ncp);
  if(!isNaN(nc)&&nc>=0) ajustarColetarPorLotes(p,nc);
  p.atualizadoEm=Date.now();
  const rec=reconciliarProduto(p);
  persist();
  return {ok:true,reconciliado:rec};
}
/* ---------- listas de tarefas (auxiliares únicos — o resto de listas/tarefas/subtarefas
   está definido junto com a tela, mais abaixo, num só lugar) ---------- */
function tarefaById(id){ return state.tarefas.find(t=>t.id===id); }
/* leva a tarefa para outra lista, mantendo ela no topo da lista de destino */
function moverTarefaParaLista(tarefaId,listaId){
  const t=state.tarefas.find(x=>x.id===tarefaId); if(!t) return {ok:false};
  const l=state.listas.find(x=>x.id===listaId); if(!l) return {ok:false};
  if(t.listaId===listaId) return {ok:false,mesma:true};
  const nomeAntigo=(state.listas.find(x=>x.id===t.listaId)||{}).nome||'';
  snapshot('mover tarefa para '+l.nome);

  state.tarefas.splice(i,1);
  t.listaId=listaId;
  const prim=state.tarefas.findIndex(x=>x.listaId===listaId);
  if(prim<0) state.tarefas.push(t); else state.tarefas.splice(prim,0,t);
  persist();

}
/* reordena as listas arrastando os chips */
function reordenarListas(id,paraId){

  const de=state.listas.findIndex(l=>l.id===id), para=state.listas.findIndex(l=>l.id===paraId);
  if(de<0||para<0) return false;
